ownership:
  level: partial
  factors:
    use_modify:
      level: moderate
      rationale: "The weight grant is irrevocable, royalty-free and permits commercial use and modification, but it is a non-OSI custom licence with binding RAIL-style field-of-use restrictions (no military, no unlawful use, no harm to minors, no automated legal-rights decisions, etc.) that flow down to derivatives - so use-and-modify is moderate, not strong. This is the material difference from the MIT V3 generations."
      # grounded in: ev-dsv3o-license (license, retrieved) - DeepSeek License Agreement v1.0, Section 5 / Attachment A use restrictions
    transparency:
      level: moderate
      rationale: "Weights are inspectable and there is a detailed technical report, but the training data and code are closed, and the weights carry China-aligned topic filtering you cannot inspect - open_weights, so moderate."
      # grounded in: ev-dsv3o-card (model_card) - open_weights; ev-dsv3o-behaviour (third_party) - China-aligned filtering
    reliability:
      level: strong
      rationale: "Performance 4, operational 5 and safety 3: a strong model with first-class serving; all three at or above 3 with two at or above 4, so reliability is strong. The caveat is the absence of a first-party guard model (and the un-tuned Base variant)."
      # grounded in: dimension scores performance 4 / operational 5 / safety 3
    data_control:
      level: strong
      rationale: "Self-hosted, the weights run entirely on your own infrastructure with no telemetry and an irrevocable grant, so your data stays yours and access cannot be clawed back. (The hosted DeepSeek API is a separate matter with its own data terms.)"
      # grounded in: ev-dsv3o-license (license, retrieved) - irrevocable grant, no claw-back; self-hosting structural
  verdict: "You partially own self-hosted original DeepSeek-V3: self-hosting keeps your data yours under an irrevocable grant (data-control strong, reliability strong), but the DeepSeek License Agreement imposes RAIL-style field-of-use restrictions that flow down to derivatives, holding use-and-modify to moderate - so ownership is partial, one step below the MIT V3 generations (deepseek-v3-mit), which reach substantial. For new work prefer the MIT generations unless you specifically need this checkpoint; where you do use it, honour the use restrictions, deploy behind your own guardrails, and treat EU high-stakes use as needing a self-assembled compliance package (with no open-source exemption on the licence axis)."
