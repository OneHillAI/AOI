  - vllm
  - sglang
  - llama.cpp
  - ollama
  controls_required:
  - Honour the DeepSeek License use restrictions in your deployment and any redistribution (they are a
    licence condition, not optional)
  - Add your own input/output guardrails and a guard/classifier model - no first-party guard ships and
    safety tuning is lighter than Western frontier labs
  - Account for China-aligned topic filtering on politically sensitive prompts
  - Add prompt-injection defences and treat retrieved/tool content as untrusted for agentic use
  - Verify checksums and pin the exact deepseek-ai revision
