# OneHill v2 MODEL library entry for the ORIGINAL DeepSeek-V3 (December 2024). Split from the
# aggregate deepseek entry on the LICENCE axis: the original V3 weights are governed by the custom
# "DeepSeek License Agreement, Version 1.0" (RAIL-style use restrictions, non-OSI), NOT MIT. The
# V3-0324/V3.1 generations moved to MIT and are the separate deepseek-v3-mit entry. The use
# restrictions drop use-and-modify to moderate and ownership to partial - that is the divergence.
# Validated against schema/model.v2.schema.json.

schema_version: '2.0'
id: deepseek-v3-original
name: DeepSeek-V3 (original, DeepSeek License)
aliases:
- DeepSeek-V3
- DeepSeek-V3-Base
- DeepSeek-V3-Chat
- deepseek-ai/DeepSeek-V3
family:
  id: deepseek
  name: DeepSeek
publisher:
  name: DeepSeek
  country: China
  accountable_entity: true
  url: https://huggingface.co/deepseek-ai
  security_contact: https://huggingface.co/deepseek-ai
summary: 'The original DeepSeek-V3 (December 2024) - the 671B-total / 37B-active Mixture-of-Experts base
  and chat model, 128K context, that established the V3 line. It is a separate entry from the later
  MIT-licensed V3 generations because its weights are governed not by MIT but by the custom "DeepSeek
  License Agreement, Version 1.0": the code repository is MIT, but the *weights* carry a perpetual,
  worldwide, royalty-free, irrevocable grant that is nonetheless conditioned on RAIL-style use
  restrictions (no unlawful or military use, no harm to minors, no generating verifiably false content
  to harm others, no unauthorised PII distribution, no defamation, discrimination, or automated
  legal-rights decisions). DeepSeek claims no rights in your output. Because the grant carries
  field-of-use restrictions and is non-OSI, use-and-modify is moderate (not strong) and ownership lands
  at partial - the material difference from the MIT V3 generations, which reach substantial. The rest
  of the profile is the family baseline: open_weights (closed data, partial code), safety tuning lighter
  than Western frontier labs with China-aligned filtering and no first-party guard model, no EU AI Act
  documentation package, and the 671B systemic-risk question in play. Serving support is first-class.

  '
variants:
- name: DeepSeek-V3 (Base)
  params_total: 671B
  params_active: 37B
  context_window: 128k
  kind: base
  safety_tuned: false
- name: DeepSeek-V3 (Chat)
  params_total: 671B
  params_active: 37B
  context_window: 128k
  kind: instruct
  safety_tuned: true
openness:
  tier: open_weights
  components:
    weights: open
    training_data: closed
    training_code: partial
    evaluation: partial
    documentation: open
    license: partial
  license:
    spdx: LicenseRef-DeepSeek-1.0
    name: DeepSeek License Agreement, Version 1.0
    classification: custom
    commercial_use: allowed_with_conditions
    notable_restrictions:
    - 'Non-OSI custom licence. The weight grant is "perpetual, worldwide, non-exclusive, no-charge,
      royalty-free, irrevocable" but conditioned on RAIL-style use restrictions (Section 5 / Attachment
      A): no use violating applicable law, no military application, no harm to minors, no generating
      verifiably false content to harm others, no unauthorised PII distribution, no
      defamation/harassment, no discrimination, no automated decisions affecting legal rights'
    - The patent licence terminates if you bring patent litigation against DeepSeek over the work
    - 'Output is yours: "DeepSeek claims no rights in the Output You generate." The code repository is
      MIT; only the weights carry this agreement'
    url: https://github.com/deepseek-ai/DeepSeek-V3/blob/main/LICENSE-MODEL
provenance:
  canonical_source: https://huggingface.co/deepseek-ai/DeepSeek-V3
  verified_org_on_primary_host: true
  formats:
  - safetensors
  integrity:
    checksums: true
    signed: false
    signing_tech: ''
    provenance_attestation: false
  mirrors_and_quants:
    acknowledged: true
    notable:
    - name: Community GGUF / lower-bit quants
      trust: community
      note: An extensive community quantization ecosystem circulates; each quant is a separate artifact
        whose trust equals its uploader - pin the deepseek-ai revision and verify checksums. Note
        redistribution of derivatives must carry the DeepSeek License use restrictions, not MIT terms
  checkpoint_checklist_score: 5
  scanner_result: {}
  incidents: []
eu_ai_act:
  is_gpai: true
  systemic_risk:
    designated: false
    training_flops_estimate: 'The V3 technical report cites ~2.788M H800 GPU-hours over 14.8T tokens. A
      671B-total / 37B-active MoE at this scale plausibly sits near systemic-risk territory, but
      DeepSeek discloses no absolute FLOP figure, so the 1e25 crossing is not a grounded number.'
    over_1e25_threshold: null
    article_55_docs_available: 'no'
  open_source_exemption:
    license_qualifies: 'no'
    rationale: 'Unlike the MIT V3 generations, the original V3 weights are NOT under a free-and-open-
      source licence: the DeepSeek License Agreement imposes field-of-use (RAIL-style) restrictions, so
      it does not meet the Article 53 open-source definition, and the exemption does not apply on the
      licence axis at all. The surviving obligations are also unmet: no Article 55 documentation, no
      copyright policy, no public training-content summary, and the training corpus is closed.

      '
  provider_package:
    technical_documentation: partial
    downstream_information: partial
    copyright_policy: 'no'
    training_content_summary: 'no'
    code_of_practice_signatory: false
  deployer_notes: 'A use-restricted, non-OSI weight licence from a China-based provider with no EU AI
    Office documentation package. An EU deployer inherits a detailed technical report but must
    self-assemble the copyright policy and training-content material (not reconstructable - the corpus
    is closed) AND must honour the DeepSeek License use restrictions downstream. At 671B the
    systemic-risk question is live and unresolved on disclosed figures. Prefer the MIT V3 generations
    (deepseek-v3-mit) where the use-restriction burden does not apply.

    '
  last_assessed: '2026-08-03'
performance: {}
behaviour: {}
safety: {}
deployment:
