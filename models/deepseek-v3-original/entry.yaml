  ceiling_conditional: true
  hardware_notes: 'A 671B-total / 37B-active MoE: even quantized the weights are large, so serving is a
    multi-GPU / multi-node exercise, though the extensive community quant ecosystem makes lower-bit
    deployment tractable. 128K context.

    '
