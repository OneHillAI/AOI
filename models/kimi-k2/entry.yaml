ownership:
  level: partial
  factors:
    use_modify:
      level: strong
      rationale: "Near-MIT weights: standard MIT permission to fine-tune, redistribute and commercialise the Base and Instruct checkpoints, with a single attribution trigger. Only a commercial product or service over 100M monthly active users or over $20M USD monthly revenue must prominently display 'Kimi K2' on its UI. The licence lacks OSI certification, so verify the LICENSE per checkpoint, but for nearly every adopter it is a plain permissive grant."
      # grounded in: ev-license (license, retrieved) - the "Our only modification part…" 100M-MAU/$20M-revenue clause read verbatim from the raw mirror; ev-kimi-hf (model_card, retrieved) - "Both the code repository and model weights are released under the Modified MIT License"
    transparency:
      level: weak
      rationale: "The model cannot be inspected: the technical report documents a 1T/32B MoE trained on 15.5T tokens with MuonClip, but the training corpus and training code are closed, and the weights carry China-aligned topic censorship that cannot be inspected."
      # grounded in: ev-tech-report (technical_report, retrieved) - 15.5T-token MoE architecture; training data/code closed (structural); ev-behaviour (third_party) - China-aligned filtering
    reliability:
      level: moderate
      rationale: "Runnable but heavy: dependable self-hosting of the trillion-parameter model is a multi-node exercise, and the safety tuning is light with no guard model."
      # grounded in: ev-perf (third_party) - SWE-bench Verified ~65.8; ev-safety (third_party) - lighter tuning, no guard model
    data_control:
      level: strong
      rationale: "Self-hosted, the weights run entirely on your own infrastructure with no telemetry or data clawback, so your data stays yours. The hosted platform.kimi.ai service differs. Its terms and privacy policy train on user prompts, audio, images, videos and files by default (opt-out only via an enterprise or separate written agreement, Singapore law and SIAC arbitration), so keep to the weights if data control matters. Self-hosting is constrained by the ~1 TB block-FP8 footprint, which forces multi-node serving."
      # grounded in: self-hosting (structural) - no clawback/telemetry on the weights; ev-terms (terms, retrieved) - train-to-improve, enterprise opt-out, Singapore/SIAC; ev-privacy (privacy_policy, retrieved) - trains on user content by default, Singapore servers
  verdict: "You substantially use, modify and commercialise the self-hosted Kimi K2 weights under a near-MIT grant. The sole condition is the 100M-MAU / $20M-revenue trigger to display 'Kimi K2' in your UI. The weights run entirely on your own infrastructure, so your data stays yours. Ownership is partial because of transparency: the 15.5T-token corpus and training code are closed and the model carries China-aligned censorship that cannot be inspected. The weights and the hosted service differ: the platform.kimi.ai API trains on your content by default (opt-out only by enterprise agreement, Singapore law), so self-host if data control matters. Confirm the attribution trigger and the per-checkpoint LICENSE before shipping, and budget multi-node infrastructure to run it at all."

# --- Evidence. Each item carries `doc_type` (which kind of primary document) and `retrieved`
#     (true = the document's substantive text was read; false = known to exist but not read).
#     Grounded 2026-07-25 against the primary-source clauses in
#     docs/primary-sources/kimi-k2/_sources.md. The LICENSE text was read verbatim from the
#     canonical raw.githubusercontent.com mirror (the GitHub blob path 404s, raw resolves);
#     the HF model card, arXiv technical report and the hosted platform.kimi.ai terms and
#     privacy policy were read directly. The separate consumer policy at kimi.com was not fetched.
evidence:
- id: ev-kimi-hf
  claim: "The Kimi-K2-Instruct model card on the verified moonshotai Hugging Face org describes block-FP8 safetensors, 1T total and 32B active parameters, a 128K context and the Muon optimiser. It states: \"Both the code repository and model weights are released under the Modified MIT License.\" The card front matter points new_version to moonshotai/Kimi-K2-Instruct-0905 (set 2025-09-05)."
  source_type: publisher
  doc_type: model_card
  retrieved: true
  url: https://huggingface.co/moonshotai/Kimi-K2-Instruct
  date: '2026-11-19'
- id: ev-license
  claim: "The Kimi K2 LICENSE is standard MIT with one added clause, which opens \"Our only modification part is that\". It applies if the Software (or any derivative works thereof) is used for any of your commercial products or services. The trigger is \"more than 100 million monthly active users\", or \"more than 20 million US dollars (or equivalent in other currencies) in monthly revenue\". The licensee then \"shall prominently display 'Kimi K2' on the user interface of such product or service\". The rest is standard MIT."
  source_type: publisher
  doc_type: license
  retrieved: true
  url: https://raw.githubusercontent.com/moonshotai/Kimi-K2/main/LICENSE
  date: '2026-11-19'
- id: ev-github
  claim: The moonshotai/Kimi-K2 repository documents the MoE architecture (384 experts,
    8+1 selected), the MuonClip optimiser, block-FP8 weights and deployment on vLLM,
    SGLang, KTransformers and TensorRT-LLM with an OpenAI/Anthropic-compatible API.
  source_type: publisher
  doc_type: docs
  retrieved: false
  url: https://github.com/moonshotai/Kimi-K2
  date: '2026-07-25'
- id: ev-tech-report
  claim: "Moonshot's arXiv technical report \"Kimi K2: Open Agentic Intelligence\" (2507.20534) describes a 1T-total / 32B-active MoE trained on 15.5T tokens with the MuonClip optimiser (Muon + QK-clip) and reports agentic and coding results (e.g. 66.1 Tau2-Bench, 65.8 SWE-Bench Verified)."
  source_type: publisher
  doc_type: technical_report
  retrieved: true
  url: https://arxiv.org/abs/2507.20534
  date: '2026-07-25'
- id: ev-terms
  claim: "The platform.kimi.ai model-use agreement (page dated \"Last Updated: July 30th, 2026\") says user content is used to improve the services, with opt-out available only via an enterprise or separate written agreement. It is governed by Singapore law, with disputes resolved by SIAC arbitration in English. platform.moonshot.ai 302-redirects to it."
  source_type: publisher
  doc_type: terms
  retrieved: true
  url: https://platform.kimi.ai/docs/agreement/modeluse.md
