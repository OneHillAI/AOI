  name: NVIDIA Nemotron
publisher:
  name: NVIDIA
  country: US
  accountable_entity: true
  url: https://huggingface.co/nvidia
  security_contact: https://www.nvidia.com/en-us/security/
summary: 'NVIDIA Nemotron 3 Ultra is the frontier-scale head of NVIDIA''s open Nemotron 3 family: a
  550B-total / 55B-active Mamba2-Transformer hybrid Latent Mixture-of-Experts with Multi-Token
  Prediction, a context window up to 1M tokens, trained on approximately 20T tokens. What sets it
  apart from its Super and Nano siblings is the licence: Ultra is released under the OpenMDW License
  Agreement v1.1 (OpenMDW-1.1), authored by the OpenMDW project under the Linux Foundation and adopted
  by NVIDIA, whose grant is to "deal in the Model Materials without restriction" - the most permissive
  of the three Nemotron 3 licences, covering weights, data, documentation and software together, with
  only a defensive patent/copyright-litigation termination. That "without restriction" grant, plus
  self-hosting via NIM, is why Ultra is the one member of the family whose ownership reaches
  substantial. It is open_weights_recipe: a representative training recipe is published, though the
  intermediate checkpoints it depends on and the 1M-context data are not open, so the model is not
  fully reproducible. On safety, the White Paper''s evaluation-and-safety section is a contributor
  list with no methodology or red-team, so there is no dedicated model-level safety evaluation - only
  post-training data curation and the downloadable family guard stack. Training compute is not
  disclosed, so whether Ultra crosses the EU AI Act 1e25-FLOP systemic-risk threshold is
  undeterminable.

  '
