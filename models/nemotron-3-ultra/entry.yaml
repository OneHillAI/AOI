  systemic_risk:
    designated: false
    training_flops_estimate: 'Not published. Only "approximately 20 trillion tokens" is disclosed; no
      absolute FLOP or GPU-hour figure appears in the white paper abstract, model card or blogs read.
      At 550B / 55B active the 1e25-FLOP systemic-risk question is UNDETERMINABLE from the disclosed
      figures. No FLOP number is asserted here.'
    over_1e25_threshold: null
    article_55_docs_available: n/a
  open_source_exemption:
    license_qualifies: uncertain
    rationale: 'Ultra''s OpenMDW-1.1 grant is maximally permissive ("deal in the Model Materials
      without restriction"), which is favourable, but it is not OSI-approved (v1.1 is not on the OSI
      approved list), and there is no formal GPAI documentation package, no public training-content
