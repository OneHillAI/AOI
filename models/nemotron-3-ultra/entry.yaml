    training_content_summary: partial
    code_of_practice_signatory: false
  deployer_notes: 'Ultra''s licence is the most permissive in the family (OpenMDW-1.1, "without
    restriction"), so the use-and-modify obligations are light, but the EU AI Act information base is
    the same as the rest of the family: no formal GPAI documentation package, no copyright policy, and
