ownership:
  level: substantial
  factors:
    use_modify:
      level: strong
      rationale: "Ultra is under OpenMDW-1.1, whose grant is to 'deal in the Model Materials without restriction' - an MIT/BSD-style, unconditional permission covering weights, data, documentation and software, with commercial use allowed and no acceptable-use or field-of-use limit. Weights are ungated and fine-tunable. The only condition is a defensive litigation termination (with a first-sued carve-out), which does not restrict ordinary use or modification. This is the permissive-open case, and the reason Ultra is the family member that reaches strong here."
      # grounded in: ev-ultra-openmdw (license, retrieved) - "deal in the Model Materials without restriction" + defensive-only termination
    transparency:
      level: strong
      rationale: "open_weights_recipe: ungated weights, a white paper and a representative training recipe with CC-BY post-training data let you see a great deal of how Ultra was built. The limit is reproducibility, not visibility - the intermediate checkpoints and the 1M-context data are not open - which caps the openness tier, not transparency."
      # grounded in: ev-ultra-recipe (docs, retrieved) - representative recipe + open-subset caveat; ev-ultra-card (model_card, retrieved) - open-weights self-description
    reliability:
      level: moderate
      rationale: "Operational is 3 (runs on mainstream stacks with official quantizations, but is a multi-node-only 550B model with no small-variant drop-in) and safety is 3 (no dedicated model-level safety evaluation, so misuse control is a gap you must fill yourself). Under the ownership rule, a safety score of 3 caps this factor at moderate."
      # grounded in: dimension scores operational 3 / safety 3; ev-ultra-safety
    data_control:
      level: strong
      rationale: "Self-hosted via NIM, the weights and inference run on your own infrastructure and data never leaves your enclave, and the OpenMDW grant claws back no rights - it is 'without restriction' with only a defensive termination. That is the clearest strong case for data control in the family."
      # grounded in: ev-ultra-nim (deployment, retrieved) - self-hosted, data stays in your enclave; ev-ultra-openmdw (license, retrieved) - unconditional grant, defensive-only termination
  verdict: "Ultra is the one Nemotron 3 release whose ownership reaches substantial: the OpenMDW 'deal without restriction' grant makes use-and-modify strong, self-hosting via NIM makes data control strong, and the open_weights_recipe transparency is strong - so you can use it, see it and keep your data outright. It stops short of full because reliability is only moderate: there is no dedicated model-level safety evaluation, and at 550B / 55B active it is a multi-node deployment. Self-host, assemble the downloadable guard stack, red-team for your own use case, and treat EU systemic-risk status as unresolved until NVIDIA discloses training compute."

