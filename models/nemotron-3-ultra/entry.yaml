    Mamba2-Transformer hybrid LatentMoE + MTP; up to 1M context; ~20T training tokens; ungated
    safetensors with BF16/NVFP4 variants; card states "open models with open weights, training data,
    and recipes"; licence tag openmdw-1.1.'
  source_type: publisher
  doc_type: model_card
  retrieved: true
  url: https://huggingface.co/nvidia/NVIDIA-Nemotron-3-Ultra-550B-A55B-BF16
