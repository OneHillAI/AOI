# OneHill v2 MODEL library entry for MiniCPM5-1B (OpenBMB / ModelBest).
# Validated against schema/model.v2.schema.json.
#   scores    -> scripts/score.py --write
#   meters    -> scripts/completeness.py --write
#   prose     -> assess.md / implement.md / use.md / support.md (sections keyed <!-- item: KEY -->)

schema_version: "2.0"
id: minicpm5
name: MiniCPM5-1B
aliases:
- MiniCPM5-1B
- MiniCPM5
- MiniCPM5-1B-SFT
- MiniCPM5-1B-Base
- openbmb/MiniCPM5-1B
family:
  id: minicpm
  name: MiniCPM
publisher:
  name: OpenBMB (developed by Modelbest Inc., THUNLP at Tsinghua University and the Gaoling School of Artificial Intelligence at Renmin University of China)
  country: CN
  accountable_entity: true
  url: https://github.com/OpenBMB/MiniCPM
  security_contact: none published (GitHub issues and Discussions only; no SECURITY.md)
summary: "MiniCPM5-1B is a 1.08 billion parameter, Apache-2.0, text-only model for on-device use. It publishes much more of its training data than typical open-weight releases, but it ships with no safety evaluation and no independent benchmark. It suits local assistants, tool-calling agents and fine-tuning on laptops or phones where the deployer adds a safety layer. The publisher benchmark table is unverified. The release (May 2026) is one dense Llama-architecture transformer with a 131,072-token context, a hybrid think and no-think chat template, and official safetensors, GGUF and MLX checkpoints. The model card names the pretraining corpora (Ultra-FineWeb, Ultra-FineWeb-L3, UltraData-Math) and the SFT set (UltraData-SFT-2605). The three pretraining sets are public and Apache-2.0 tagged on the Hub. The SFT set sits behind an automatic access gate and its card is unavailable. Documented languages are English and Chinese only. The score covers the 1B release (final, SFT-only and Base checkpoints plus the official GGUF and MLX conversions); the later MiniCPM5-2B release is a separate follow-up."
variants:
- name: MiniCPM5-1B (final, RL + OPD post-trained, hybrid think / no-think)
  params_total: 1.08B
  context_window: 128k (131072)
