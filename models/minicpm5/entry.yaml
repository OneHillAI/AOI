      trust: publisher
      note: official conversions published by the same Hub org
    - name: FlagRelease/MiniCPM5-1B-*-FlagOS (Nvidia, Hygon, Metax, Iluvatar, Zhenwu, Mthreads, Kunlunxin, Ascend, ARM-v9)
