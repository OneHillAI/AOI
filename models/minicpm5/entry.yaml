ownership:
  level: partial
  factors:
    use_modify:
      level: strong
      rationale: "Apache-2.0 across Base, SFT, final, GGUF and MLX checkpoints, ungated, with commercial use allowed and no field-of-use or registration clause."
    transparency:
      level: moderate
      rationale: "The recipe and three pretraining datasets are public, but the SFT dataset card is gated and unread, the RL data is partly unreleased, there is no MiniCPM5 report or training pipeline, and the benchmark table is an unverified image."
    reliability:
      level: weak
      rationale: "Operational support is broad (4), but there is no safety evaluation, policy or guard model (safety 1), so the model is unsafe to deploy as presented until the deployer supplies that layer."
    data_control:
      level: strong
      rationale: "Self-hosted weights run on the deployer's own device and the Apache-2.0 licence claws back no rights; no phone-home behaviour is documented."
  verdict: "Use of these weights is fully owned: Apache-2.0, ungated, runnable on a phone or laptop, with Base and SFT checkpoints and public pretraining data to adapt from. Ownership is partial because the reliability factor is weak: OpenBMB publishes no safety evaluation, policy or guard model. The SFT data card is gated, and the only benchmark is the publisher's own table. The model suits local assistants and fine-tuning behind the deployer's own guardrails and safety tests. Ownership moves to substantial once a safety evaluation exists."

evidence:
- id: ev-license
  claim: "The LICENSE file in the OpenBMB/MiniCPM repository, which the MiniCPM5-1B model card links as the licence for \"this repository and MiniCPM model weights\", is the standard Apache License 2.0 text. Compared line by line with apache.org, only the copyright line differs (\"Copyright [OpenBMB]\"). It adds no field-of-use, scale, branding or registration clause. The README states \"This repository and MiniCPM models are released under the Apache-2.0 License\". The licence file is in the GitHub repository and not in the Hub model repository."
  source_type: publisher
  doc_type: license
  retrieved: true
  url: https://raw.githubusercontent.com/OpenBMB/MiniCPM/main/LICENSE
  date: '2026-11-19'
- id: ev-license-meta
  claim: "Hub card metadata for openbmb/MiniCPM5-1B, -SFT, -Base, -GGUF, -MLX and every MiniCPM5-2B checkpoint reads license apache-2.0 with gated false. The model card says \"This repository and MiniCPM model weights are released under the Apache-2.0 License\". The GitHub API reports spdx Apache-2.0 for the code repository."
  source_type: publisher
  doc_type: license
  retrieved: true
  url: https://huggingface.co/openbmb/MiniCPM5-1B
