eu_ai_act:
  is_gpai: true
  systemic_risk:
    designated: false
    training_flops_estimate: not stated by the publisher; at 1.08B parameters the 1e25 FLOP threshold would need roughly 1.5 quadrillion training tokens (6 x parameters x tokens), so it is not credibly reached
    over_1e25_threshold: false
    article_55_docs_available: n/a
  open_source_exemption:
    license_qualifies: 'yes'
    rationale: "Released under OSI-approved Apache-2.0 with public weights and architecture, and not designated as systemic-risk, so it plausibly qualifies for the Article 53 open-source exemption from the Annex XI and XII documentation duties. The duties that survive the exemption are a copyright policy and a public training-content summary. The publisher states no copyright policy. The dataset cards for Ultra-FineWeb, Ultra-FineWeb-L3 and UltraData-Math describe the pretraining sources and are public, which partly serves as a training-content summary. The SFT dataset card is gated and unavailable, the Ultra-FineWeb card tells users to check each source dataset licence individually, and no pretraining token count is given."
  provider_package:
    technical_documentation: partial
    downstream_information: partial
    copyright_policy: 'no'
    training_content_summary: partial
    code_of_practice_signatory: unknown
  deployer_notes: "A deployer placing a fine-tune on the EU market may become the provider for that derivative. Upstream, the licence is clean, but there is no EU-specific statement from OpenBMB, no copyright policy, and no MiniCPM5 technical report (the card cites the MiniCPM4 paper). The pretraining synthetic tier (Ultra-FineWeb-L3) was generated with MiniCPM4 and Qwen3, and the Math L2 selection used unnamed proprietary models, so model-lineage questions about the training data need the publisher. Deployers should record these gaps in their own documentation."
  last_assessed: '2026-11-19'
performance: {}
behaviour: {}
safety: {}
deployment:
  ceiling_tier: T1
  ceiling_conditional: true
  hardware_notes: "The BF16 safetensors file is 2.16 GB, the official GGUF files are 0.69 GB (Q4_K_M), 1.15 GB (Q8_0) and 2.17 GB (F16), and the MLX 4-bit file is 0.61 GB, so the weights fit on phones, single-board computers and any laptop. The KV cache is small because the model uses 2 key-value heads. By arithmetic from config.json (24 layers x 2 heads x 128 head dim x 2 tensors x 2 bytes) it is 24,576 bytes per token, about 3.2 GB at the full 131,072 tokens in 16-bit, so use short contexts on small devices. The publisher cookbook shows llama-server with -c 8192. The publisher does not state RAM or speed figures for named devices."
  serving_support:
  - hf-transformers
  - vllm
  - sglang
  - llama.cpp
  - ollama
  - lm-studio
  - mlx
  - litert-lm
  - arclight
  controls_required:
  - Add your own safety evaluation and input and output guardrails before any user-facing use; the publisher documents none
  - Run tool calls only through SGLang with the minicpm5 parser (or the repo tool parser) and validate every call before executing it
  - Set enable_thinking explicitly and use the sampling values from the card for each mode
  - Pin the exact openbmb revision, verify the LFS sha256 and avoid unreviewed community conversions (some are named "Uncensored")
  - Use short contexts on small devices and test long-context behaviour yourself, since no long-context result is published for the 1B
score:
  rubric_version: '1.1'
  headline: 56.8
  grade: C
  hard_flags: []
  dimensions:
    openness:
      score: 4
      rationale: "Apache-2.0 weights at four checkpoint stages (Base, SFT, final, plus GGUF and MLX), a detailed card recipe, and three public Apache-2.0 pretraining datasets that the card names as the training corpus. That is more data than most open-weight models release. The score is a judgement call between 3 and 4. The anchors for 4 also name training and evaluation code, and the repository holds only user-side fine-tuning and quantisation scripts, with no pretraining, RL or OPD pipeline and no evaluation harness. The SFT dataset exists but its card is behind a Hub gate and unavailable, the RLVR and RLHF data are not released, and there is no MiniCPM5 technical report (the card cites the MiniCPM4 paper). The score stops short of 5 for those reasons."
      evidence_refs:
      - ev-card
      - ev-datasets
      - ev-sft-dataset
      - ev-github
      - ev-papers
    provenance:
      score: 3
      rationale: "Safetensors only (no pickle), Hub file scan clean, per-file LFS sha256, official GGUF and MLX conversions, and the GitHub repository links these exact Hub repos; checklist about 5 of 8. The openbmb Hub org is not verified (isVerified false), so the score is 3 on the checkpoint count and not higher, and there is no signature or attestation. The pretraining synthetic tier was generated with MiniCPM4 and Qwen3 and the Math selection used unnamed proprietary models, so the data lineage depends on other models."
      evidence_refs:
      - ev-repo-files
      - ev-datasets
      - ev-aa
    legal:
      score: 3
      rationale: "Plain Apache-2.0 (identical to the canonical text apart from the copyright line), ungated, commercial use allowed, with no field-of-use or registration clause; the older General Model License is explicitly replaced. The score is held at 3 because there is no EU AI Act statement, no copyright policy, no Annex XI-style package and no MiniCPM5 report. The dataset cards give only a partial training-content summary and warn that source-dataset licences differ (for example NQ-Open is CC BY-SA 3.0 and TriviaQA has no stated licence)."
      evidence_refs:
      - ev-license
      - ev-license-meta
      - ev-legacy-gml
      - ev-datasets
    safety:
      score: 1
      rationale: "The only safety text is a three-sentence limitations paragraph saying the model may produce inaccurate, biased or unsafe output and that users must apply safeguards. There is no safety evaluation, no red-team result, no acceptable-use policy, no guard model, and no description of safety tuning (pairwise RLHF signals are cited for reliability and user experience, not safety). OneHill has not verified the model's safety, and unmodified community \"Uncensored\" derivatives exist. This is the lowest-evidence dimension and it holds the reliability factor at weak."
      evidence_refs:
      - ev-card
      - ev-repo-files
    performance:
      score: 2
      rationale: "The publisher table is strong (average 42.57 against 35.61 for LFM2.5-1.2B, MATH-500 91.60, AIME 40.42, tau2-Bench Telecom 79.53). It is a publisher image with three small thinking-mode baselines, no harness and no non-thinking numbers. The model trails LFM2.5-1.2B on GPQA-Diamond, IFEval, Multi-IF and MultiChallenge, and trails both Qwen baselines on BFCLv4, although the card says its advantage is most visible in tool use. Artificial Analysis lists the model but publishes no score, and no other independent evaluation exists. The score rests on thin independent coverage and not on the publisher claim."
      evidence_refs:
      - ev-bench
      - ev-aa
    operational:
      score: 4
      rationale: "Standard LlamaForCausalLM with no custom code, listed support for Transformers, vLLM, SGLang, llama.cpp, Ollama (local Modelfile), LM Studio, MLX, LiteRT-LM and ArcLight, official GGUF and MLX conversions, cookbooks with file sizes, and a 131,072-token context in config. The score stops short of 5. The Ollama library page does not exist (404), tool calling needs SGLang or the repo parser, and the cards require recent versions (vLLM 0.21 or later, transformers 5.6 or later). No RAM or speed figures for named devices are given, and no long-context result is published for the 1B."
      evidence_refs:
      - ev-card
      - ev-github
      - ev-repo-files
    governance:
      score: 3
      rationale: "An identifiable, accountable publisher group (Modelbest, THUNLP, Renmin University) with a visible cadence since 2024 (MiniCPM 2B Feb 2024, MiniCPM3 Sep 2024, MiniCPM4 Jun 2025, MiniCPM5-1B May 2026, MiniCPM5-2B Sep 2026), an active repository (last push 2026-11-09), GitHub issue templates and Discussions. The score is held at 3 because no SECURITY.md or vulnerability-disclosure process exists (404), there is no deprecation policy, and the card cites a previous-generation paper."
      evidence_refs:
      - ev-github
      - ev-2b-card

signals:
  trainability:
    level: partial
    dimension: openness
    summary: "Freely adaptable and well supplied (Base and SFT checkpoints, five fine-tuning cookbooks, public pretraining datasets) but not reproducible end to end: no pretraining, RL or OPD code, and the SFT dataset card is gated."
    refs: [ev-card, ev-datasets, ev-github]
  knowledge_structure:
    level: moderate
    dimension: performance
    summary: "A 1B dense model with a 131,072-token context and a small KV cache, usable as a compact RAG or agent backbone. No long-context evaluation is published for the 1B, and its knowledge capacity is limited by size (MMLU-Pro 48.85 on the publisher table)."
    refs: [ev-card, ev-bench, ev-repo-files]
  specialization:
    level: strong
    dimension: openness
    summary: "Base and SFT-only checkpoints, public pretraining corpora, Apache-2.0 and cookbooks for TRL, LLaMA-Factory, ms-swift, unsloth and xtuner make adaptation cheap; the SFT data gate and missing training pipeline are the limits."
    refs: [ev-card, ev-github, ev-datasets]
  exchangeability:
    level: high
    dimension: operational
    summary: "Plain Llama architecture on mainstream runtimes with official GGUF and MLX; the swap gotchas are the ChatML-style template with think tags and the XML tool-call format, which needs a matching parser."
    refs: [ev-card, ev-repo-files]
  misuse_exposure:
    level: unbenchmarked
    dimension: safety
    summary: "No safety or misuse evaluation, no guard model and no acceptable-use policy exist, and community uncensored derivatives are already on the Hub."
    refs: [ev-card, ev-repo-files]

