    code_of_practice_signatory: false
  deployer_notes: 'Nano Omni is small (31B / ~3B active) and multimodal, so an EU deployer must
    additionally consider the video/audio/image input surface. The licence is irrevocable with no
    acceptable-use restriction, but there is no formal GPAI documentation package, no copyright policy,
    and NVIDIA is not a Code of Practice signatory. Training compute is undisclosed but at this scale a
    systemic-risk designation is not indicated. The openness posture is weaker than the rest of the
    family (open_weights, not open_weights_recipe), so a downstream deployer inherits less than for
    Super/Nano/Ultra.

