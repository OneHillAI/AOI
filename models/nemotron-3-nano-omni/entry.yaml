ownership:
  level: partial
  factors:
    use_modify:
      level: moderate
      rationale: "The NVIDIA Open Model Agreement is genuinely permissive - perpetual, royalty-free, IRREVOCABLE, commercial use allowed, no acceptable-use or field-of-use restriction, weights ungated and fine-tunable. It is held at moderate, not strong, because it is Apache-2.0-derived but non-OSI (the termination reaches an output from the Work), it is a distinct third family licence whose on-document date is unverified against the PDF, and the released recipe surfaces only the public subset of the alignment corpus, so this is an open_weight community licence with conditions, short of Ultra's unconditional OpenMDW grant."
      # grounded in: ev-omni-agreement (license, retrieved) - irrevocable grant + output-reaching termination; ev-omni-recipe - public-subset recipe caveat
    transparency:
      level: moderate
      rationale: "open_weights, not open_weights_recipe: the weights are ungated and inspectable and there is a model card and licence, but the card does not carry the family's open-data/recipe self-description, links only an image-training dataset, and the recipe that exists surfaces only the public subset. You can see the weights, but the data and full recipe are not clearly released - the anchor for moderate, not strong."
      # grounded in: ev-omni-card (model_card, retrieved) - no open-data self-description, image-training dataset + deploy cookbook only; ev-omni-recipe - public-subset recipe
    reliability:
      level: moderate
      rationale: "Operational is 3 (runs on mainstream stacks with an official BF16 variant, but the multimodal serving path is narrower and the quantization coverage thinner) and safety is 3 (no model-level safety evaluation over a wider multimodal misuse surface). Under the ownership rule, a safety score of 3 caps this factor at moderate."
      # grounded in: dimension scores operational 3 / safety 3; ev-omni-safety
    data_control:
      level: strong
      rationale: "Self-hosted via NIM (or the linked TensorRT-LLM path), the weights and inference run on your own infrastructure and data never leaves your enclave, and the NVIDIA Open Model Agreement claws back no rights - the grant is explicitly IRREVOCABLE, terminating only on the licensee's own IP litigation. That is the strong case for a self-hostable model."
      # grounded in: ev-omni-nim (deployment, retrieved) - self-hosted, data stays in your enclave; ev-omni-agreement (license, retrieved) - irrevocable grant, no revocation claw-back
  verdict: "Nano Omni gives you a small, portable, natively multimodal model under a clean irrevocable licence, and self-hosting keeps your data and rights yours - so data control is strong. Ownership stays partial because use-and-modify is only moderate (a non-OSI third licence with an unverified date and a public-subset-only recipe), transparency is only moderate (open_weights, not open_weights_recipe: the card does not release the data or advertise the recipe), and reliability is moderate (no model-level safety evaluation over a wider multimodal misuse surface). Self-host, assemble the multimodal guard stack, red-team the video/audio/image input path, and confirm the licence version against the PDF."

