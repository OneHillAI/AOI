    rationale: 'The NVIDIA Open Model Agreement is irrevocable and carries no acceptable-use
      restriction, which is favourable, but it is source-available and not OSI, and the openness
      posture is weaker than the rest of the family (open_weights, not open_weights_recipe): the card
      does not advertise open data or a recipe. There is no formal GPAI documentation package, no
      public training-content summary and no copyright policy, and NVIDIA is not a GPAI Code of
