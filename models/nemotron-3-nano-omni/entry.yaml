- nvidia/Nemotron-3-Nano-Omni-30B-A3B-Reasoning
family:
  id: nemotron
  name: NVIDIA Nemotron
publisher:
  name: NVIDIA
  country: US
  accountable_entity: true
  url: https://huggingface.co/nvidia
  security_contact: https://www.nvidia.com/en-us/security/
summary: 'NVIDIA Nemotron 3 Nano Omni is the multimodal member of the Nemotron 3 family: a 31B-total /
  roughly 3B-active Mamba2-Transformer hybrid Mixture-of-Experts that takes video, audio, image and
  text in and returns text, with a 256k-token context and around 717B training tokens. It is governed
  by a THIRD distinct family licence, the NVIDIA Open Model Agreement (v. 2026-03-09), whose text is
  near-identical to the NVIDIA Nemotron Open Model License: an Apache-2.0-derived, perpetual,
  royalty-free and IRREVOCABLE grant to reproduce, modify, sublicense and distribute in source or
  object form, with commercial use allowed and no Trustworthy-AI clause, acceptable-use restriction or
  guardrail clause (their absence is confirmed), terminating only on the licensee bringing IP
  litigation over the Work or an output from it. Its openness posture is the weakest of the family and
  is why it is classified open_weights rather than open_weights_recipe: unlike the Super, Nano and
  Ultra cards, the Nano Omni card does NOT carry the "open weights, training data, and recipes"
  self-description, and links only an image-training dataset and a TensorRT-LLM deploy cookbook. A
  genuine training recipe does exist in the NeMo repo (docs/nemotron/omni3, SFT then RL), but it
  surfaces only the public subset of the alignment corpus, and the card signals do not carry the
  stronger recipe claim. As with the rest of the family, there is no dedicated model-level safety
  evaluation; safety is post-training data curation plus the downloadable, multimodal-capable family
  guard stack. Ownership is partial.

  '
