    training_flops_estimate: 'Not published. Only a training-token count is disclosed (~717B tokens);
      no absolute FLOP or GPU-hour figure appears in the model card or blogs read. At 31B / ~3B active
      on ~717B tokens a systemic-risk designation is not indicated.'
    over_1e25_threshold: false
