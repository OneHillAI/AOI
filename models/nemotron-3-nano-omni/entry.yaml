    level: partial
    dimension: openness
    summary: "A training recipe exists in the NeMo repo (SFT then RL), but it surfaces only the public subset of the alignment corpus and the card does not advertise it, so you can adapt from the released checkpoint, not fully reproduce."
    refs: [ev-omni-recipe, ev-omni-card]
  knowledge_structure:
    level: moderate
    dimension: performance
    summary: "A small multimodal hybrid Mamba-Transformer MoE (video/audio/image in, text out) with a 256k context; capable for its class and modality but not independently benchmarked in this pass."
    refs: [ev-omni-card]
  specialization:
    level: moderate
    dimension: openness
    summary: "The irrevocable licence and small size make adaptation permissible and cheap, but the weaker open-data posture and the unadvertised recipe make domain adaptation less turnkey than for the Super/Nano/Ultra releases."
    refs: [ev-omni-recipe, ev-omni-agreement]
  exchangeability:
    level: medium
    dimension: operational
    summary: "Portable safetensors on vLLM/SGLang/NIM with an official BF16 variant and a small footprint, but the multimodal serving path is narrower and less mature than the text-only members of the family."
    refs: [ev-omni-nim, ev-omni-card]
  misuse_exposure:
    level: partial
    dimension: safety
    summary: "Misuse is partly mitigated but not characterised at the model level, and the video/audio/image input surface widens the path: the multimodal guard classifier is attributable, but there is no published model-level safety evaluation."
    refs: [ev-omni-safety, ev-omni-card]

