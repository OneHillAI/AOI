evidence:
- id: ev-omni-card
  claim: 'Nemotron 3 Nano Omni model card on the verified nvidia HF org
    (nvidia/Nemotron-3-Nano-Omni-30B-A3B-Reasoning-BF16, no "NVIDIA-" prefix): 31B total / ~3B active;
    Mamba2-Transformer hybrid MoE; multimodal (Video, Audio, Image, Text in / Text out); 256k context;
    ~717B training tokens; licence tag nvidia-open-model-agreement. The card does NOT carry the
    family "open weights, training data, and recipes" self-description and links only
    nvidia/Nemotron-Image-Training-v3 and a TensorRT-LLM deploy cookbook.'
  source_type: publisher
  doc_type: model_card
  retrieved: true
  url: https://huggingface.co/nvidia/Nemotron-3-Nano-Omni-30B-A3B-Reasoning-BF16
  date: '2026-08-03'
- id: ev-omni-agreement
  claim: 'NVIDIA Open Model Agreement (v. 2026-03-09), read: a third distinct family licence,
    text near-identical to the NVIDIA Nemotron OML. Grant "perpetual, worldwide, non-exclusive,
    no-charge, royalty-free, irrevocable license to reproduce, prepare Derivative Works of, publicly
    display, publicly perform, sublicense, and distribute the Work ... in source or object form."
    Terminates only on IP litigation over the Work or an output from it. Trustworthy-AI / guardrail /
    acceptable-use clauses CONFIRMED ABSENT. Governing law US / Delaware. NOT OSI. Commercial use
    allowed. On-document date inconsistent with the HTML date and unverified against the PDF.'
  source_type: publisher
  doc_type: license
  retrieved: true
  url: https://www.nvidia.com/en-us/agreements/enterprise-software/nvidia-open-model-agreement/
  date: '2026-08-03'
- id: ev-omni-recipe
  claim: 'A training recipe for Nano Omni exists in the NeMo repo (github.com/NVIDIA-NeMo/Nemotron
    docs/nemotron/omni3, SFT then RL), read: caveat "The 20 RL datasets / 25 environments / ~2.3M
    rollouts referenced in the release blog compose the full upstream alignment corpus; this recipe
    surfaces the public/open-source subset." The card does not advertise this recipe, so on card
    signals the model is classified open_weights, with a note that a recipe exists.'
  source_type: publisher
  doc_type: docs
  retrieved: true
  url: https://github.com/NVIDIA-NeMo/Nemotron
  date: '2026-08-03'
- id: ev-omni-safety
  claim: 'Safety, read: no dedicated model-level safety evaluation for Nano Omni; safety is
    post-training data curation only, over a wider multimodal (video/audio/image) misuse surface. The
    family Nemotron-3-Content-Safety classifier is multimodal (text and images) and so is partly
    attributable; NeMo Guardrails and garak are Apache-2.0. Guard-classifier scores are NVIDIA
    self-reported.'
  source_type: publisher
  doc_type: model_card
  retrieved: true
  url: https://huggingface.co/nvidia/Nemotron-3-Content-Safety
  date: '2026-08-03'
- id: ev-omni-provenance
  claim: 'Verified nvidia org on Hugging Face; the Nano Omni weight repo is ungated safetensors with an
    official BF16 variant. The repo id has no "NVIDIA-" prefix, unlike Super/Nano/Ultra. Published
    checksums / signing / attestation not verified this pass.'
  source_type: publisher
  doc_type: docs
  retrieved: true
  url: https://huggingface.co/nvidia
  date: '2026-08-03'
- id: ev-omni-nim
  claim: 'NVIDIA NIM is self-hosted deployment tooling ("data never leaves your secure enclave"), and
    the Nano Omni card links a TensorRT-LLM deploy cookbook, so self-hosting supports data control and
    NVIDIA is not an AOI inference-provider entry. The hosted build.nvidia.com preview API is an
    evaluation surface that reserves use of content "to improve NVIDIA products and services, including
    AI models".'
  source_type: publisher
  doc_type: terms
  retrieved: true
  url: https://www.nvidia.com/en-us/ai-data-science/products/nim-microservices/
  date: '2026-08-03'
- id: ev-omni-eu
  claim: 'NVIDIA is NOT a signatory to the EU GPAI Code of Practice (EU signatory list), and no NVIDIA
    training-content summary or copyright policy for Nemotron was located. Nano Omni training compute
    is undisclosed but at 31B / ~3B active on ~717B tokens a systemic-risk designation is not
    indicated.'
  source_type: third_party
  doc_type: third_party
  retrieved: true
  url: https://digital-strategy.ec.europa.eu/en/policies/contents-code-gpai
  date: '2026-08-03'
changelog:
- date: '2026-08-03'
  change: Initial entry (NVIDIA Nemotron 3 Nano Omni, multimodal), split out of the former aggregate nemotron entry so each per-licence release is scored on its own. Governed by the NVIDIA Open Model Agreement (a third distinct family licence, near-identical to the Nemotron OML); the corrected reading records it as Apache-2.0-derived, perpetual, royalty-free and IRREVOCABLE with the Trustworthy-AI / acceptable-use / guardrail clauses confirmed absent. Classified open_weights (not open_weights_recipe) because the card carries a weaker open-data posture than the rest of the family, though a public-subset recipe exists in the NeMo repo. Safety scored 3, not the old aggregate 4, because there is no model-level safety evaluation over the multimodal input surface - only post-training data curation plus the downloadable, multimodal-capable family guard stack. AOI 60.0, grade C, ownership partial.
last_verified: '2026-08-03'
