  doc_type: docs
  retrieved: true
  url: https://help.mistral.ai/en/articles/347612-can-i-activate-zero-data-retention-zdr
  date: '2026-07-25'
- id: ev-dpa
  claim: "Mistral's Data Processing Addendum (DPA), read verbatim, uses SCCs Module 4
