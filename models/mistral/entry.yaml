# OneHill v2 MODEL library entry for Mistral AI's open-weight family.
# Validated against schema/model.v2.schema.json.
#   scores    -> scripts/score.py --write        (AOI headline/grade - computed, not hand-set)
#   meters    -> scripts/completeness.py --write  (per-domain completeness/originality)
#   prose     -> assess.md / implement.md / use.md / support.md (sections keyed <!-- item: KEY -->)

schema_version: "2.0"
id: mistral
name: Mistral AI (open-weight family)
aliases:
- Mistral
- Mistral 7B
- Mixtral
- Mixtral 8x7B
- Mixtral 8x22B
- Mistral Nemo
- Mistral Small
- Ministral
- Codestral
- mistralai
family:
  id: mistral
  name: Mistral
publisher:
  name: Mistral AI
  country: FR
  accountable_entity: true
  url: https://mistral.ai/
  security_contact: https://huggingface.co/mistralai
summary: 'Mistral AI is the Paris-based EU lab whose open-weight releases are the leading
  European alternative to the US open-model families. The line spans the dense Mistral
  7B, the Mixtral 8x7B / 8x22B sparse mixture-of-experts models, Mistral Nemo (12B, a
  128K-context collaboration with NVIDIA) and the 24B Mistral Small 3.x, plus specialist
  variants (Codestral for code, Mathstral, Pixtral for vision, Devstral). The licence
  split is what an adopter must get right. THIS entry is the genuine OSI-approved
  Apache-2.0 line: Mistral 7B, Mixtral, Nemo, Mistral Small 3.x, Pixtral 12B, and the
  Apache specialist models (Codestral Mamba, Mathstral, Devstral Small, Magistral Small) -
  all with unconditional commercial use. The non-commercial Mistral models (Ministral 8B,
  Mistral Large 2, Pixtral Large under the research-only MRL; Codestral under the
  non-production MNPL) are the separate mistral-research-license entry. Offsetting the
  split, Mistral''s EU domicile and its status as an early
  signatory of the EU GPAI Code of Practice give it the strongest regulatory posture of
  any non-US family here.

  '
variants:
- name: Mistral 7B
  params_total: 7B
  context_window: 8k-32k (by version)
  kind: instruct
  safety_tuned: true
- name: Mixtral 8x7B
  params_total: 46.7B
  params_active: 12.9B
  context_window: 32k
  kind: instruct
  safety_tuned: true
- name: Mixtral 8x22B
  params_total: 141B
  params_active: 39B
  context_window: 64k
  kind: instruct
  safety_tuned: true
- name: Mistral Nemo (12B)
  params_total: 12B
  context_window: 128k
  kind: instruct
  safety_tuned: true
- name: Mistral Small 3.x (24B)
  params_total: 24B
  context_window: 128k
  kind: instruct
  safety_tuned: true
- name: Codestral Mamba / Mathstral / Devstral Small (Apache)
  kind: code
  safety_tuned: false
- name: Pixtral 12B
  params_total: 12B
  kind: multimodal
  safety_tuned: true
openness:
  tier: open_weights
  components:
    weights: open
    training_data: closed
    training_code: closed
    evaluation: partial
    documentation: open
    license: partial
  license:
    spdx: Apache-2.0
    name: Apache 2.0 (flagship open-weight models); Mistral Research License / MNPL for some models
    classification: osi
    commercial_use: allowed_with_conditions
    notable_restrictions:
    - Flagship general-purpose models (Mistral 7B, Mixtral, Nemo, Mistral Small 3.x) are Apache-2.0 with unconditional commercial use
    - Ministral 8B (2410), Mistral Large 2 (2407, 2411) and Pixtral Large (2411) ship under the research-only Mistral Research Licence (MRL) - a commercial licence must be negotiated separately. Later releases are not MRL - Mistral Large 3 (675B) and Ministral 3 (3B, 8B, 14B) are Apache-2.0, read from the raw model cards on 2026-11-19
    - Codestral-22B-v0.1 is still under the non-production MNPL on Hugging Face (re-read 2026-11-19); check the licence per model and per version
    - Since September 2026 Mistral has also released models under custom licences that are neither Apache-2.0 nor MRL (Mistral Large 4 under the Mistral Ecosystem Open-Weight License, Timestral and Mistral Medium 3.5 under a Modified MIT with a monthly-revenue cap); they are not covered by this entry
    url: https://docs.mistral.ai/models/overview
provenance:
  canonical_source: https://huggingface.co/mistralai
  verified_org_on_primary_host: true
  formats:
  - safetensors
  integrity:
    checksums: true
    signed: false
    signing_tech: ''
    provenance_attestation: false
  mirrors_and_quants:
    acknowledged: true
    notable:
    - name: bartowski / unsloth / lmstudio-community (GGUF, AWQ, FP8 quantizations)
      trust: community
      note: popular local-inference quants rather than the canonical weight source
    - name: Hosted on Bedrock / Azure AI / Vertex / Together / OpenRouter
      trust: provider
      note: served endpoints rather than the weight source
  checkpoint_checklist_score: 6
  scanner_result: {}
  incidents: []
eu_ai_act:
  is_gpai: true
  systemic_risk:
    designated: false
    training_flops_estimate: The Apache open-weight family (<=24B dense, Mixtral MoE) sits well under 1e25 FLOPs; Mistral Large 2 (123B) is research-only MRL, and Mistral Large 3 (675B MoE, 41B active, Apache-2.0) is far larger but Mistral publishes no FLOP figure for it, so the 1e25 line cannot be checked from released artifacts. The Apache models tracked here are the small and mid-size ones.
    over_1e25_threshold: false
    article_55_docs_available: n/a
  open_source_exemption:
    license_qualifies: partial
    rationale: 'The flagship general-purpose models (Mistral 7B, Mixtral, Nemo, Mistral
      Small 3.x) are released under genuine OSI-approved Apache-2.0 with public parameters,
      architecture and usage information - so those models plausibly qualify for the
      Article 53 open-source exemption from the Annex XI/XII technical-documentation duties.
      The exemption does NOT extend to the research-only MRL models (Ministral 8B, Mistral
      Large, Pixtral Large), whose field-of-use restriction fails the Act''s "free and
      open-source" test. None of the open-weight releases is a designated systemic-risk
      model, so where the exemption applies it is not voided; the surviving copyright-policy
      and training-content-summary obligations still apply and are only partially met because
      Mistral does not publish its training corpus.

      '
  provider_package:
    technical_documentation: partial
    downstream_information: 'yes'
    copyright_policy: partial
    training_content_summary: partial
    code_of_practice_signatory: true
  deployer_notes: 'Mistral is EU-domiciled (Paris) and was among the first signatories of
    the EU GPAI Code of Practice in 2025 - the clearest regulatory posture of any non-US
    family in the registry, with no EU field-of-use ban of the kind that affects some
    competitors. A downstream EU deployer still inherits only a partial documentation set
    (training data and a full training-content summary are not published), and a fine-tuner
    placing a derivative on the EU market under its own name may become a provider for that
    derivative. Confirm the specific model''s licence: an MRL model may not be
    deployed commercially without a negotiated licence.

    '
  last_assessed: '2026-07-25'
performance:
  note: Third-party framing only.
  class_position: Competitive-to-strong within each size class on public leaderboards; the leading European open-weight family.
behaviour:
  refusals: Instruct variants refuse clearly-harmful requests but are historically tuned for lower over-refusal than the largest US labs.
  prompt_injection: Residual susceptibility like all current LLMs; treat retrieved/tool content as untrusted.
  failure_modes: Standard hallucination profile for its class; documented in model cards.
safety:
  variant_assessed: Instruct + Mistral Moderation API
  jailbreak_resistance: Withstands casual jailbreaks; deploy the instruct variant with the moderation classifier, never the base.
  guard_model: Mistral Moderation API (a fine-tuned Ministral 8B, offered as a hosted classifier) - not a broadly-shipped open guard-weight comparable to Llama Guard.
deployment:
  ceiling_tier: T2
  ceiling_conditional: true
  hardware_notes: '7B/12B run on a single modern GPU; the 24B Mistral Small fits a 24 GB
    card with modest quantization; Mixtral 8x22B and Mistral Large 2 (123B) need multi-GPU
    or heavy quantization for latency-sensitive serving.

    '
  serving_support:
  - vllm
  - mistral-inference
  - llama.cpp
  - ollama
  - tgi
  - hf-transformers
  controls_required:
  - Deploy the instruct (safety-tuned) variant, not the base checkpoint
  - Add input/output guardrails; the Mistral Moderation API can serve as the companion classifier
  - Add prompt-injection defences and treat retrieved/tool content as untrusted
  - Confirm the per-model licence (Apache vs research-only MRL) before commercial deployment
  - Pin the exact mistralai revision and verify checksums
score:
  rubric_version: '1.1'
  headline: 73.2
  grade: B
  hard_flags: []
  dimensions:
    openness:
      score: 3
      rationale: 'Open-weights tier: the flagship general-purpose models are downloadable
        under permissive OSI-approved Apache-2.0 - a genuinely open licence, unlike a
        click-through community gate - and documentation is good. The open-weights tier
        caps Dimension 1 at 3 per the openness framework, because training data and training
        code are closed (no reproduction path, unlike a fully-open family), evaluation is
        only partial, and a meaningful subset of the family ships under the research-only
        MRL, so the licence component is split rather than uniformly open. It sits at the
        top of the score-3 band, short of the recipe (4) and fully-open (5) tiers.

        '
      evidence_refs:
      - ev-small3
      - ev-weights
      - ev-mrl
      - ev-hf
    provenance:
      score: 4
      rationale: 'Verified mistralai org on Hugging Face, safetensors-only distribution
        with per-file checksums, a clear canonical source and no malicious-checkpoint
        incident on record (checklist ~6/8). Short of 5 only because weights are not
        cryptographically signed and there is no SLSA-style provenance attestation.

        '
      evidence_refs:
      - ev-hf
      - ev-weights
    legal:
      score: 4
      rationale: 'A strong legal posture for the Apache-2.0 flagship models: OSI-approved,
        unconditional commercial use, EU-domiciled and accountable publisher, and an early
        signatory of the EU GPAI Code of Practice with no EU field-of-use ban. Held to 4
        rather than 5 because the family carries a genuine licence split (research-only MRL
        models require a negotiated commercial licence) and, unlike a fully-open family, the
        training corpus is not published so the EU training-content-summary obligation is
        only partially satisfiable from released artifacts.

        '
      evidence_refs:
      - ev-small3
      - ev-cop
      - ev-mrl
    safety:
      score: 3
      rationale: 'Instruct variants are safety-tuned and Mistral ships a hosted Moderation
        API (a fine-tuned Ministral 8B) plus system-level guardrailing guidance - above a
        bare release. Held at 3 because safety tuning is historically lighter than the largest
        US labs, there is no broadly-distributed open guard-weight comparable to Llama Guard,
        and no broad independent third-party red-team across CBRN/cyber/prompt-injection
        domains has been published; base checkpoints are untuned.

        '
      evidence_refs:
      - ev-moderation
      - ev-wiki
    performance:
      score: 4
      rationale: 'Consistently competitive-to-strong within each size class on public
        leaderboards - Mistral 7B and Mixtral were class-leading at release and Mistral
        Small 3.x remains strong for a 24B - and the leading European open-weight family.
        Capped at 4 on third-party leaderboard evidence without independent reproduction.

        '
      evidence_refs:
      - ev-leaderboard
      - ev-wiki
    operational:
      score: 4
      rationale: 'Broad ecosystem support: an official inference library (mistral-inference)
        plus day-0/near-day-0 loading on vLLM, llama.cpp, Ollama, TGI and transformers,
        safetensors distribution, community quants and hosted endpoints on the major clouds.
        Short of 5 because the
        official first-party quantization program is narrower than the largest ecosystems.

        '
      evidence_refs:
      - ev-inference
      - ev-hf
      - ev-weights
    governance:
      score: 4
      rationale: 'Reputable, legally accountable EU publisher with a predictable, dated
        release cadence, published model cards, a moderation offering and - distinctively -
        an EU GPAI Code of Practice signature. Short of 5 because there is no formal
        cryptographic vulnerability-disclosure/signing process and no published deprecation
        policy for the open-weight checkpoints.

        '
      evidence_refs:
      - ev-cop
      - ev-hf

# --- Assessed signals: five cross-cutting attributes highlighted at the top of the entry
#     (like the EU AI Act flag). Not a scoring input - each ties back to one of the seven
#     AOI dimensions and summarises documentation that lives in the four domains.
signals:
  trainability:
    level: partial
    dimension: openness
    summary: "Fine-tunable but not reproducible: Apache-2.0 open weights support full SFT/LoRA and redistribution, but training data and code are closed and a subset of the family is research-only MRL, so trainability depends on the specific model's licence."
    refs: [ev-small3, ev-mrl, ev-hf]
  knowledge_structure:
    level: strong
    dimension: performance
    summary: "Strong grounding backbone: 128K context on Nemo and Mistral Small 3.x, documented tool-calling and improved structured output, and solid multilingual (esp. European) coverage support RAG and structured workflows."
    refs: [ev-small3, ev-leaderboard]
  specialization:
    level: strong
    dimension: openness
    summary: "Strong for specialisation: permissive Apache weights plus a large adapter/fine-tuning ecosystem, and the family already ships domain variants (Codestral, Mathstral, Devstral, Pixtral) as templates; continued pre-training is limited by closed data and code."
    refs: [ev-weights, ev-hf]
  exchangeability:
    level: high
    dimension: operational
    summary: "Highly exchangeable: safetensors on every major runtime plus an official mistral-inference library and OpenAI-compatible serving; the main gotcha when swapping is Mistral's own chat template and mistral-common/Tekken tokenization."
    refs: [ev-inference, ev-hf]
  misuse_exposure:
    level: unbenchmarked
    dimension: safety
    summary: "Not independently benchmarked for misuse: Mistral offers a hosted Moderation API and guardrailing guidance, but there is no broad third-party CBRN/cyber/prompt-injection red-team battery to aggregate."
    refs: [ev-moderation]

# --- Four documentation domains. Item keys match checklists/model.yaml and a
#     `<!-- item: KEY -->` section in the domain .md (except gap items).
#     completeness/originality are written by scripts/completeness.py --write.
#     No onehill_generated items this session: OneHill has run nothing, so every item
#     is `aggregated` (public source, >=1 ref) or an honest `gap`. Originality = 0.
documentation:
  assess:
    completeness: 93.3
    originality: 0.0
    items:
      - key: intended-use
        title: "Intended & out-of-scope use"
        doc_type: reference
        source_type: aggregated
        coverage: full
        refs: [ev-weights, ev-small3]
        summary: "General-purpose assistant, coding and multilingual use; deploy instruct rather than base; confirm the per-model licence before commercial use."
      - key: limitations
        title: "Known limitations, bias & failure modes"
        doc_type: reference
        source_type: aggregated
        coverage: full
        refs: [ev-wiki, ev-moderation]
        summary: "Class-standard hallucination, residual prompt-injection susceptibility, historically lighter safety tuning, and a licence split that constrains commercial use of MRL models."
      - key: openness
        title: "Openness tier & components"
        doc_type: explanation
        source_type: aggregated
        coverage: full
        refs: [ev-small3, ev-weights, ev-mrl]
        summary: "open_weights - Apache-2.0 flagship weights + good docs, but training data and code closed and the licence component split by research-only MRL models."
      - key: license
        title: "License terms & permitted use"
        doc_type: reference
        source_type: aggregated
        coverage: full
        refs: [ev-small3, ev-mrl, ev-mnpl, ev-hf-cards, ev-overview]
        summary: "Apache-2.0 (OSI, unconditional commercial use) for the flagship models; research-only MRL for Ministral 8B / Mistral Large 2 / Pixtral Large; MNPL for Codestral-22B (still the tag on 2026-11-19). Mistral Large 3 and Ministral 3 are Apache-2.0, not MRL."
      - key: provenance
        title: "Supply-chain & provenance"
        doc_type: reference
        source_type: aggregated
        coverage: full
        refs: [ev-hf, ev-weights]
        summary: "Verified mistralai org on Hugging Face, safetensors + checksums, no signing or SLSA attestation; community GGUF/AWQ/FP8 quants are separate artifacts."
      - key: eu-ai-act
        title: "EU AI Act posture"
        doc_type: explanation
        source_type: aggregated
        coverage: full
        refs: [ev-cop, ev-small3]
        summary: "GPAI; open-weight family well under 1e25 FLOPs (not systemic-risk); EU-domiciled and an early GPAI Code of Practice signatory; Article 53 exemption applies to the Apache models rather than the MRL ones."
      - key: evaluation
        title: "Benchmarks & evaluation"
        doc_type: reference
        source_type: aggregated
        coverage: full
        refs: [ev-leaderboard, ev-wiki]
        summary: "Competitive-to-strong in each size class on public leaderboards; the leading European open-weight family."
      - key: safety-eval
        title: "Independent safety evaluation"
        doc_type: reference
        source_type: gap
        gap_reason: "No broad independent adversarial evaluation across CBRN/cyber/prompt-injection domains has been published for the Mistral open-weight family. Mistral documents a Moderation API and guardrailing guidance but there is no third-party red-team battery to aggregate."
  implement:
    completeness: 95.5
    originality: 0.0
    items:
      - key: install
        title: "Install & run"
        doc_type: howto
        source_type: aggregated
        coverage: full
        refs: [ev-hf, ev-inference]
        summary: "HF from_pretrained (safetensors), the official mistral-inference library, Ollama pull, vLLM serve or llama.cpp GGUF; pin the exact mistralai revision."
      - key: hardware
        title: "Hardware & VRAM requirements"
        doc_type: reference
        source_type: aggregated
        coverage: full
        refs: [ev-weights, ev-hf]
        summary: "7B/12B on a single modern GPU; 24B Mistral Small on a 24 GB card with modest quantization; Mixtral 8x22B and Mistral Large 2 (123B) need multi-GPU or heavy quantization."
      - key: serving
        title: "Serving stacks"
        doc_type: reference
        source_type: aggregated
        coverage: full
        refs: [ev-inference, ev-weights]
        summary: "Official mistral-inference plus vLLM, TGI, llama.cpp, Ollama and transformers load the standard safetensors checkpoints."
      - key: safe-deployment
        title: "Safe-deployment controls & Deployment Ceiling"
        doc_type: howto
        source_type: aggregated
        coverage: full
        refs: [ev-moderation, ev-small3]
        summary: "Deployment Ceiling T2 (conditional): instruct variant + input/output guardrails (the Moderation API as companion classifier) + prompt-injection defences + pinned revision + per-model licence check."
      - key: quantization
        title: "Available quantizations"
        doc_type: reference
        source_type: aggregated
        coverage: partial
        refs: [ev-hf]
        summary: "A broad community GGUF/AWQ/GPTQ/FP8 quant ecosystem and some official low-bit releases; coverage marked partial as the first-party program is narrower than the largest ecosystems - verify the source before production use."
      - key: fine-tuning
        title: "Fine-tuning & adaptation"
        doc_type: howto
        source_type: aggregated
        coverage: full
        refs: [ev-inference, ev-hf]
        summary: "Standard SFT/LoRA via transformers/PEFT/TRL/Axolotl/Unsloth on the safetensors checkpoints; no open pre-training data or code, so continued pre-training from scratch is not reproducible."
      - key: integration
        title: "API / OpenAI-compatible integration"
        doc_type: howto
        source_type: aggregated
        coverage: full
        refs: [ev-inference, ev-weights, ev-privacy, ev-training, ev-retention, ev-zdr, ev-commercial-tos]
        summary: "Serve behind vLLM's OpenAI-compatible /v1 server (or TGI/Ollama), or use Mistral's own hosted API (Mistral Studio). If you use the hosted API rather than self-hosting, its terms differ and depend on the product: Vibe consumer plans (Free, Pro, Teams, Student) train on inputs by default unless you opt out, Studio Free mode may train, and Labs and Preview models may always train; the Commercial Terms (4.2) allow training only on an opt-in, on feedback, or on Labs and Preview models. API data is kept for the time needed to generate the output plus 30 rolling days for abuse monitoring, EU hosting is the default (US endpoint option), and Zero Data Retention is available only on pay-as-you-go stateless endpoints at Mistral's discretion - all re-read from the Privacy Policy, help centre and Commercial Terms on 2026-11-19."
  use:
    completeness: 94.4
    originality: 0.0
    items:
      - key: capabilities
        title: "Capabilities & modalities"
        doc_type: reference
        source_type: aggregated
        coverage: full
        refs: [ev-small3, ev-leaderboard]
        summary: "Strong generalist, coding and multilingual text; Pixtral adds vision; Mistral Small 3.x is competitive for a 24B with tool use and structured output."
      - key: context-window
        title: "Context window & long-context behaviour"
        doc_type: reference
        source_type: aggregated
        coverage: full
        refs: [ev-small3, ev-nemo]
        summary: "Mistral Nemo and Mistral Small 3.x offer 128K context; older models are shorter (Mistral 7B 8k-32k, Mixtral 32k-64k) - confirm per model card."
      - key: chat-template
        title: "Prompt format & chat template"
        doc_type: reference
        source_type: aggregated
        coverage: full
        refs: [ev-chat, ev-weights]
        summary: "Use the model's chat template (mistral-common is the ground truth; newer models use the Tekken tokenizer) via apply_chat_template rather than hand-rolling role markers."
      - key: languages
        title: "Language coverage"
        doc_type: reference
        source_type: aggregated
        coverage: full
        refs: [ev-small3, ev-moderation]
        summary: "Genuinely multilingual with strong European-language coverage (English, French, German, Italian, Spanish and more); the Moderation API alone spans 11 languages."
      - key: tool-use
        title: "Function / tool calling"
        doc_type: reference
        source_type: aggregated
        coverage: full
        refs: [ev-small3, ev-weights]
        summary: "Documented native function/tool calling on the instruct models; Mistral Small 3.2 specifically improved tool-use accuracy over 3.1."
      - key: structured-output
        title: "Structured / JSON-constrained output"
        doc_type: reference
        source_type: aggregated
        coverage: partial
        refs: [ev-small3]
        summary: "Instruct models support JSON/structured output (Mistral Small 3.2 improved it); hard schema-constrained decoding is still a serving-layer feature (grammars/guided decoding), hence partial."
  support:
    completeness: 55.6
    originality: 0.0
    items:
      - key: troubleshooting
        title: "Common problems & fixes"
        doc_type: troubleshooting
        source_type: aggregated
        coverage: partial
        refs: [ev-chat, ev-hf]
        summary: "Aggregated common pitfalls (chat-template/tokenizer mismatch, OOM on Mixtral/Large, revision drift, wrong licence assumption); not an exhaustive catalogue."
      - key: release-versioning
        title: "Versions, changelog & cadence"
        doc_type: release_notes
        source_type: aggregated
        coverage: full
        refs: [ev-weights, ev-hf]
        summary: "Dated snapshot versioning (e.g. -2407, -2410, -2506) tracked as immutable Hugging Face revisions on the mistralai org; pin the revision as your changelog anchor."
      - key: security-disclosure
        title: "Security / vulnerability disclosure"
        doc_type: reference
        source_type: gap
        gap_reason: "No formal, published vulnerability-disclosure or security policy (e.g. SECURITY.md / advisory process) for the open-weight checkpoints was found; contact is the general Mistral / Hugging Face org presence, so there is no documented process to aggregate."
      - key: channels
        title: "Community & support channels"
        doc_type: reference
        source_type: aggregated
        coverage: full
        refs: [ev-hf, ev-inference, ev-wiki]
        summary: "Hugging Face model discussions on the mistralai org, GitHub issues on mistral-inference and the cookbook, the Mistral Discord and platform docs, plus paid support via Mistral Studio."
      - key: deprecation
        title: "Deprecation / end-of-life policy"
        doc_type: reference
        source_type: aggregated
        coverage: partial
        refs: [ev-weights, ev-hf]
        summary: "Mistral operates dated model versioning and deprecates legacy models on its API platform, but the open-weight HF checkpoints carry no formal sunset commitment - older revisions remain downloadable. Marked partial."
      - key: known-issues
        title: "Tracked known issues"
        doc_type: reference
        source_type: aggregated
        coverage: partial
        refs: [ev-wiki, ev-moderation]
        summary: "From model-card and release caveats: lighter safety coverage than the largest US labs, residual prompt-injection susceptibility, and a licence split that catches teams expecting all models to be Apache."

# --- Ownership: the single closing verdict (methodology/ownership.md). One level built from
#     four factors; each factor grounded in the entry's documented evidence.
ownership:
  level: partial
  factors:
    use_modify:
      level: moderate
      rationale: "The Apache-2.0 flagship models (Mistral 7B, Mixtral, Nemo, Small 3.x) can be run, modified, redistributed and used commercially with no gate - but Ministral 8B, Mistral Large 2 and Pixtral Large are research-only MRL, and Codestral is non-production MNPL. Because the family is licence-split, you cannot treat the whole line as freely usable without checking each model, so use-and-modify is moderate rather than strong."
      # grounded in: ev-weights (docs, retrieved - per-model licence list verbatim), ev-mrl + ev-mnpl (license, retrieved - restriction clauses verbatim)
    transparency:
      level: moderate
      rationale: "You can download and inspect the safetensors weights and read good model cards, but training data and training code are closed - you can see the model but not how it was made."
      # grounded in: ev-weights, ev-hf (openness components: weights open, data/code closed)
    reliability:
      level: moderate
      rationale: "Runs dependably across every major runtime, but safety tuning is lighter than the largest US labs, so pair the instruct variant with the Moderation API and your own guardrails."
      # grounded in: ev-leaderboard (third_party), ev-moderation
    data_control:
      level: strong
      rationale: "Self-hosted, the open weights run on your own infrastructure and nothing leaves - your data and derived knowledge stay yours. Mistral's HOSTED services are different: per its help centre, Vibe Free, Pro, Teams and Student plans train on inputs by default unless you opt out (Enterprise is opted out by default), Studio Free mode may train, and Labs and Preview models may always train; Zero Data Retention exists only on pay-as-you-go stateless API endpoints. The DPA lets Mistral train as controller unless the customer has opted out (clause 2.3), applies SCCs Module 4 under French law where the customer is outside the EEA, and makes data inaccessible 30 days after termination."
      # grounded in: self-hosting (structural); ev-privacy, ev-training, ev-retention, ev-zdr, ev-dpa (all retrieved)
  verdict: "You own the Apache-licensed flagship models outright: self-host them and the model and your data are yours to run, modify and keep. Overall ownership is partial rather than substantial, for one concrete reason: the family is licence-split, so a meaningful subset (Ministral 8B, Mistral Large 2 and Pixtral Large are research-only MRL; Codestral is non-production MNPL; newer large releases use custom licences with their own conditions) needs a separately negotiated commercial licence, and you cannot treat the line as uniformly free without checking each model. Training is also not transparent (data and code are closed). If you use Mistral's hosted API instead of self-hosting, turn off training and consider Zero Data Retention."

