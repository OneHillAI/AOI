# --- Ownership: the single closing verdict (methodology/ownership.md). One level built from
#     four factors; each factor grounded in the entry's documented evidence.
ownership:
  level: partial
  factors:
    use_modify:
      level: moderate
      rationale: "The Apache-2.0 flagship models (Mistral 7B, Mixtral, Nemo, Small 3.x) can be run, modified, redistributed and used commercially with no gate - but Ministral 8B, Mistral Large and Pixtral Large are research-only MRL, and Codestral is non-production MNPL. Because the family is licence-split, you cannot treat the whole line as freely usable without checking each model, so use-and-modify is moderate rather than strong."
      # grounded in: ev-weights (docs, retrieved - per-model licence list verbatim), ev-mrl + ev-mnpl (license, retrieved - restriction clauses verbatim)
    transparency:
      level: moderate
      rationale: "You can download and inspect the safetensors weights and read good model cards, but training data and training code are closed - you can see the model but not how it was made."
      # grounded in: ev-weights, ev-hf (openness components: weights open, data/code closed)
    reliability:
      level: moderate
      rationale: "Runs dependably across every major runtime, but safety tuning is lighter than the largest US labs, so pair the instruct variant with the Moderation API and your own guardrails."
      # grounded in: ev-leaderboard (third_party), ev-moderation
    data_control:
      level: strong
      rationale: "Self-hosted, the open weights run on your own infrastructure and nothing leaves - your data and derived knowledge stay yours. Mistral's HOSTED API is different: per its Privacy Policy and help centre it trains on inputs by default unless you opt out (Team/Enterprise excepted), and offers Zero Data Retention; the DPA applies SCCs Module 4 under French law and makes data inaccessible 30 days after termination."
      # grounded in: self-hosting (structural); ev-privacy, ev-training, ev-retention, ev-zdr, ev-dpa (all retrieved)
  verdict: "You own the Apache-licensed flagship models outright: self-host them and the model and your data are yours to run, modify and keep. Overall ownership is partial rather than substantial, for one concrete reason: the family is licence-split, so a meaningful subset (Ministral 8B, Mistral Large and Pixtral Large are research-only MRL; Codestral is non-production MNPL) needs a separately negotiated commercial licence, and you cannot treat the line as uniformly free without checking each model. Training is also not transparent (data and code are closed). If you use Mistral's hosted API instead of self-hosting, turn off training and consider Zero Data Retention."

