# OneHill v2 MODEL library entry for Mistral AI's open-weight family.
# Validated against schema/model.v2.schema.json.
#   scores    -> scripts/score.py --write        (AOI headline/grade - computed, not hand-set)
#   meters    -> scripts/completeness.py --write  (per-domain completeness/originality)
#   prose     -> assess.md / implement.md / use.md / support.md (sections keyed <!-- item: KEY -->)

schema_version: "2.0"
id: mistral
name: Mistral AI (open-weight family)
aliases:
- Mistral
- Mistral 7B
- Mixtral
- Mixtral 8x7B
- Mixtral 8x22B
- Mistral Nemo
- Mistral Small
- Ministral
- Codestral
- mistralai
family:
  id: mistral
  name: Mistral
publisher:
  name: Mistral AI
  country: FR
  accountable_entity: true
  url: https://mistral.ai/
  security_contact: https://huggingface.co/mistralai
summary: 'Mistral AI is the Paris-based EU lab whose open-weight releases are the leading
  European alternative to the US open-model families. The line spans the dense Mistral
  7B, the Mixtral 8x7B / 8x22B sparse mixture-of-experts models, Mistral Nemo (12B, a
  128K-context collaboration with NVIDIA) and the 24B Mistral Small 3.x, plus specialist
  variants (Codestral for code, Mathstral, Pixtral for vision, Devstral). The licence
  split is what an adopter must get right. THIS entry is the genuine OSI-approved
  Apache-2.0 line: Mistral 7B, Mixtral, Nemo, Mistral Small 3.x, Pixtral 12B, and the
  Apache specialist models (Codestral Mamba, Mathstral, Devstral Small, Magistral Small) -
  all with unconditional commercial use. The non-commercial Mistral models (Ministral 8B,
  Mistral Large, Pixtral Large under the research-only MRL; Codestral under the
  non-production MNPL) are the separate mistral-research-license entry. Offsetting the
  split, Mistral''s EU domicile and its status as an early
  signatory of the EU GPAI Code of Practice give it the strongest regulatory posture of
  any non-US family here.

  '
variants:
- name: Mistral 7B
  params_total: 7B
  context_window: 8k-32k (by version)
  kind: instruct
  safety_tuned: true
- name: Mixtral 8x7B
  params_total: 46.7B
  params_active: 12.9B
  context_window: 32k
  kind: instruct
  safety_tuned: true
- name: Mixtral 8x22B
  params_total: 141B
  params_active: 39B
  context_window: 64k
  kind: instruct
  safety_tuned: true
- name: Mistral Nemo (12B)
  params_total: 12B
  context_window: 128k
  kind: instruct
  safety_tuned: true
- name: Mistral Small 3.x (24B)
  params_total: 24B
  context_window: 128k
  kind: instruct
  safety_tuned: true
- name: Codestral Mamba / Mathstral / Devstral Small (Apache)
  kind: code
  safety_tuned: false
- name: Pixtral 12B
  params_total: 12B
  kind: multimodal
  safety_tuned: true
openness:
  tier: open_weights
  components:
    weights: open
    training_data: closed
    training_code: closed
    evaluation: partial
    documentation: open
    license: partial
  license:
    spdx: Apache-2.0
    name: Apache 2.0 (flagship open-weight models); Mistral Research License / MNPL for some models
    classification: osi
    commercial_use: allowed_with_conditions
    notable_restrictions:
    - Flagship general-purpose models (Mistral 7B, Mixtral, Nemo, Mistral Small 3.x) are Apache-2.0 with unconditional commercial use
    - Ministral 8B, Mistral Large, Pixtral Large ship under the research-only Mistral Research Licence (MRL) - a commercial licence must be negotiated separately
    - Codestral was released under the non-production MNPL; check the licence per model and per version
    url: https://docs.mistral.ai/getting-started/models/weights
provenance:
  canonical_source: https://huggingface.co/mistralai
  verified_org_on_primary_host: true
  formats:
  - safetensors
  integrity:
    checksums: true
    signed: false
    signing_tech: ''
    provenance_attestation: false
  mirrors_and_quants:
    acknowledged: true
    notable:
    - name: bartowski / unsloth / lmstudio-community (GGUF, AWQ, FP8 quantizations)
      trust: community
      note: popular local-inference quants rather than the canonical weight source
    - name: Hosted on Bedrock / Azure AI / Vertex / Together / OpenRouter
      trust: provider
      note: served endpoints rather than the weight source
  checkpoint_checklist_score: 6
  scanner_result: {}
  incidents: []
eu_ai_act:
  is_gpai: true
  systemic_risk:
    designated: false
    training_flops_estimate: The Apache open-weight family (<=24B dense, Mixtral MoE) sits well under 1e25 FLOPs; only the largest models (e.g. Mistral Large 2, 123B) approach the threshold, and those are research-only MRL, not Apache open-weight releases.
    over_1e25_threshold: false
    article_55_docs_available: n/a
  open_source_exemption:
    license_qualifies: partial
    rationale: 'The flagship general-purpose models (Mistral 7B, Mixtral, Nemo, Mistral
      Small 3.x) are released under genuine OSI-approved Apache-2.0 with public parameters,
      architecture and usage information - so those models plausibly qualify for the
      Article 53 open-source exemption from the Annex XI/XII technical-documentation duties.
      The exemption does NOT extend to the research-only MRL models (Ministral 8B, Mistral
      Large, Pixtral Large), whose field-of-use restriction fails the Act''s "free and
      open-source" test. None of the open-weight releases is a designated systemic-risk
      model, so where the exemption applies it is not voided; the surviving copyright-policy
      and training-content-summary obligations still apply and are only partially met because
      Mistral does not publish its training corpus.

      '
  provider_package:
    technical_documentation: partial
    downstream_information: 'yes'
    copyright_policy: partial
    training_content_summary: partial
    code_of_practice_signatory: true
  deployer_notes: 'Mistral is EU-domiciled (Paris) and was among the first signatories of
    the EU GPAI Code of Practice in 2025 - the clearest regulatory posture of any non-US
    family in the registry, with no EU field-of-use ban of the kind that affects some
    competitors. A downstream EU deployer still inherits only a partial documentation set
    (training data and a full training-content summary are not published), and a fine-tuner
    placing a derivative on the EU market under its own name may become a provider for that
    derivative. Confirm the specific model''s licence: an MRL model may not be
    deployed commercially without a negotiated licence.

    '
  last_assessed: '2026-07-25'
performance:
  note: Third-party framing only.
  class_position: Competitive-to-strong within each size class on public leaderboards; the leading European open-weight family.
behaviour:
  refusals: Instruct variants refuse clearly-harmful requests but are historically tuned for lower over-refusal than the largest US labs.
  prompt_injection: Residual susceptibility like all current LLMs; treat retrieved/tool content as untrusted.
  failure_modes: Standard hallucination profile for its class; documented in model cards.
safety:
  variant_assessed: Instruct + Mistral Moderation API
  jailbreak_resistance: Withstands casual jailbreaks; deploy the instruct variant with the moderation classifier, never the base.
  guard_model: Mistral Moderation API (a fine-tuned Ministral 8B, offered as a hosted classifier) - not a broadly-shipped open guard-weight comparable to Llama Guard.
deployment:
  ceiling_tier: T2
  ceiling_conditional: true
  hardware_notes: '7B/12B run on a single modern GPU; the 24B Mistral Small fits a 24 GB
    card with modest quantization; Mixtral 8x22B and Mistral Large 2 (123B) need multi-GPU
    or heavy quantization for latency-sensitive serving.

    '
  serving_support:
  - vllm
  - mistral-inference
  - llama.cpp
  - ollama
  - tgi
  - hf-transformers
  controls_required:
  - Deploy the instruct (safety-tuned) variant, not the base checkpoint
  - Add input/output guardrails; the Mistral Moderation API can serve as the companion classifier
  - Add prompt-injection defences and treat retrieved/tool content as untrusted
  - Confirm the per-model licence (Apache vs research-only MRL) before commercial deployment
  - Pin the exact mistralai revision and verify checksums
score:
  rubric_version: '1.1'
  headline: 73.2
  grade: B
  hard_flags: []
  dimensions:
    openness:
      score: 3
      rationale: 'Open-weights tier: the flagship general-purpose models are downloadable
        under permissive OSI-approved Apache-2.0 - a genuinely open licence, unlike a
        click-through community gate - and documentation is good. The open-weights tier
        caps Dimension 1 at 3 per the openness framework, because training data and training
        code are closed (no reproduction path, unlike a fully-open family), evaluation is
        only partial, and a meaningful subset of the family ships under the research-only
        MRL, so the licence component is split rather than uniformly open. It sits at the
        top of the score-3 band, short of the recipe (4) and fully-open (5) tiers.

        '
      evidence_refs:
      - ev-small3
      - ev-weights
      - ev-mrl
      - ev-hf
    provenance:
      score: 4
      rationale: 'Verified mistralai org on Hugging Face, safetensors-only distribution
        with per-file checksums, a clear canonical source and no malicious-checkpoint
        incident on record (checklist ~6/8). Short of 5 only because weights are not
        cryptographically signed and there is no SLSA-style provenance attestation.

        '
      evidence_refs:
      - ev-hf
      - ev-weights
    legal:
      score: 4
      rationale: 'A strong legal posture for the Apache-2.0 flagship models: OSI-approved,
        unconditional commercial use, EU-domiciled and accountable publisher, and an early
        signatory of the EU GPAI Code of Practice with no EU field-of-use ban. Held to 4
        rather than 5 because the family carries a genuine licence split (research-only MRL
        models require a negotiated commercial licence) and, unlike a fully-open family, the
        training corpus is not published so the EU training-content-summary obligation is
        only partially satisfiable from released artifacts.

        '
      evidence_refs:
      - ev-small3
      - ev-cop
      - ev-mrl
    safety:
      score: 3
      rationale: 'Instruct variants are safety-tuned and Mistral ships a hosted Moderation
        API (a fine-tuned Ministral 8B) plus system-level guardrailing guidance - above a
        bare release. Held at 3 because safety tuning is historically lighter than the largest
        US labs, there is no broadly-distributed open guard-weight comparable to Llama Guard,
        and no broad independent third-party red-team across CBRN/cyber/prompt-injection
        domains has been published; base checkpoints are untuned.

        '
      evidence_refs:
      - ev-moderation
      - ev-wiki
    performance:
      score: 4
      rationale: 'Consistently competitive-to-strong within each size class on public
        leaderboards - Mistral 7B and Mixtral were class-leading at release and Mistral
        Small 3.x remains strong for a 24B - and the leading European open-weight family.
        Capped at 4 on third-party leaderboard evidence without independent reproduction.

        '
      evidence_refs:
      - ev-leaderboard
      - ev-wiki
    operational:
      score: 4
      rationale: 'Broad ecosystem support: an official inference library (mistral-inference)
        plus day-0/near-day-0 loading on vLLM, llama.cpp, Ollama, TGI and transformers,
        safetensors distribution, community quants and hosted endpoints on the major clouds.
        Short of 5 because the
        official first-party quantization program is narrower than the largest ecosystems.

        '
      evidence_refs:
      - ev-inference
      - ev-hf
      - ev-weights
    governance:
      score: 4
      rationale: 'Reputable, legally accountable EU publisher with a predictable, dated
        release cadence, published model cards, a moderation offering and - distinctively -
        an EU GPAI Code of Practice signature. Short of 5 because there is no formal
        cryptographic vulnerability-disclosure/signing process and no published deprecation
        policy for the open-weight checkpoints.

        '
      evidence_refs:
      - ev-cop
      - ev-hf

# --- Assessed signals: five cross-cutting attributes highlighted at the top of the entry
#     (like the EU AI Act flag). Not a scoring input - each ties back to one of the seven
#     AOI dimensions and summarises documentation that lives in the four domains.
signals:
  trainability:
    level: partial
    dimension: openness
    summary: "Fine-tunable but not reproducible: Apache-2.0 open weights support full SFT/LoRA and redistribution, but training data and code are closed and a subset of the family is research-only MRL, so trainability depends on the specific model's licence."
    refs: [ev-small3, ev-mrl, ev-hf]
  knowledge_structure:
    level: strong
    dimension: performance
    summary: "Strong grounding backbone: 128K context on Nemo and Mistral Small 3.x, documented tool-calling and improved structured output, and solid multilingual (esp. European) coverage support RAG and structured workflows."
    refs: [ev-small3, ev-leaderboard]
  specialization:
    level: strong
    dimension: openness
    summary: "Strong for specialisation: permissive Apache weights plus a large adapter/fine-tuning ecosystem, and the family already ships domain variants (Codestral, Mathstral, Devstral, Pixtral) as templates; continued pre-training is limited by closed data and code."
    refs: [ev-weights, ev-hf]
  exchangeability:
    level: high
    dimension: operational
    summary: "Highly exchangeable: safetensors on every major runtime plus an official mistral-inference library and OpenAI-compatible serving; the main gotcha when swapping is Mistral's own chat template and mistral-common/Tekken tokenization."
    refs: [ev-inference, ev-hf]
  misuse_exposure:
    level: unbenchmarked
    dimension: safety
    summary: "Not independently benchmarked for misuse: Mistral offers a hosted Moderation API and guardrailing guidance, but there is no broad third-party CBRN/cyber/prompt-injection red-team battery to aggregate."
    refs: [ev-moderation]

