        summary: "Use the model's chat template via apply_chat_template instead of hand-rolling role markers. mistral-common is the ground truth, and newer models use the Tekken tokenizer."
      - key: languages
        title: "Language coverage"
        doc_type: reference
        source_type: aggregated
        coverage: full
        refs: [ev-small3, ev-moderation]
        summary: "Multilingual, with strong European-language coverage (English, French, German, Italian, Spanish and more). The Moderation API alone spans 11 languages."
      - key: tool-use
        title: "Function / tool calling"
        doc_type: reference
        source_type: aggregated
        coverage: full
        refs: [ev-small3, ev-weights]
        summary: "Documented native function and tool calling on the instruct models. Mistral Small 3.2 improved tool-use accuracy over 3.1."
      - key: structured-output
        title: "Structured / JSON-constrained output"
        doc_type: reference
        source_type: aggregated
        coverage: partial
        refs: [ev-small3]
        summary: "Instruct models support JSON and structured output (Mistral Small 3.2 improved it). Hard schema-constrained decoding remains a serving-layer feature (grammars, guided decoding), hence partial."
  support:
    completeness: 55.6
    originality: 0.0
    items:
      - key: troubleshooting
        title: "Common problems & fixes"
        doc_type: troubleshooting
        source_type: aggregated
        coverage: partial
        refs: [ev-chat, ev-hf]
        summary: "Common pitfalls: chat-template or tokenizer mismatch, out-of-memory on Mixtral and Large, revision drift, and a wrong licence assumption. The list is not exhaustive."
      - key: release-versioning
        title: "Versions, changelog & cadence"
        doc_type: release_notes
        source_type: aggregated
        coverage: full
        refs: [ev-weights, ev-hf]
        summary: "Dated snapshot versions (for example -2407, -2410, -2506) tracked as immutable Hugging Face revisions on the mistralai org. The pinned revision is the changelog anchor."
      - key: security-disclosure
        title: "Security / vulnerability disclosure"
        doc_type: reference
        source_type: gap
        gap_reason: "No formal published vulnerability-disclosure or security policy (SECURITY.md or advisory process) exists for the open-weight checkpoints. The contact is the general Mistral and Hugging Face org presence, so there is no documented process to aggregate."
      - key: channels
        title: "Community & support channels"
        doc_type: reference
        source_type: aggregated
        coverage: full
        refs: [ev-hf, ev-inference, ev-wiki]
        summary: "Hugging Face model discussions on the mistralai org, GitHub issues on mistral-inference and the cookbook, the Mistral Discord and platform docs, plus paid support via Mistral Studio."
      - key: deprecation
        title: "Deprecation / end-of-life policy"
        doc_type: reference
        source_type: aggregated
        coverage: partial
        refs: [ev-weights, ev-hf]
        summary: "Mistral uses dated model versions and deprecates legacy models on its API platform. The open-weight Hugging Face checkpoints carry no formal sunset commitment, and older revisions remain downloadable. Coverage is partial."
      - key: known-issues
        title: "Tracked known issues"
        doc_type: reference
        source_type: aggregated
        coverage: partial
        refs: [ev-wiki, ev-moderation]
        summary: "Model-card and release caveats: lighter safety coverage than the largest US labs, residual prompt-injection susceptibility, and a licence split that catches teams expecting all models to be Apache."

# --- Ownership: the single closing verdict (methodology/ownership.md). One level built from
#     four factors; each factor grounded in the entry's documented evidence.
ownership:
  level: partial
  factors:
    use_modify:
      level: moderate
      rationale: "The Apache-2.0 flagship models (Mistral 7B, Mixtral, Nemo, Small 3.x) can be run, modified, redistributed and used commercially with no gate. Ministral 8B, Mistral Large 2 and Pixtral Large are research-only MRL, and Codestral is non-production MNPL. Because the family is licence-split, each model needs checking before use, so use-and-modify is moderate."
      # grounded in: ev-weights (docs, retrieved - per-model licence list verbatim), ev-mrl + ev-mnpl (license, retrieved - restriction clauses verbatim)
    transparency:
      level: moderate
      rationale: "The safetensors weights can be downloaded and inspected, and the model cards are good. Training data and training code are closed, so the model is visible but how it was made is not."
      # grounded in: ev-weights, ev-hf (openness components: weights open, data/code closed)
    reliability:
      level: moderate
      rationale: "The models run dependably across every major runtime. Safety tuning is lighter than at the largest US labs, so pair the instruct variant with the Moderation API and your own guardrails."
      # grounded in: ev-leaderboard (third_party), ev-moderation
    data_control:
      level: strong
      rationale: "Self-hosted, the open weights run on the deployer's own infrastructure and nothing leaves it, so data and derived knowledge stay with the deployer. Mistral's hosted services differ. Per its help centre, Vibe Free, Pro, Teams and Student plans train on inputs by default unless the user opts out (Enterprise is opted out by default), Studio Free mode may train, and Labs and Preview models may always train. Zero Data Retention exists only on pay-as-you-go stateless API endpoints. The DPA lets Mistral train as controller unless the customer has opted out (clause 2.3), applies SCCs Module 4 under French law where the customer is outside the EEA, and makes data inaccessible 30 days after termination."
      # grounded in: self-hosting (structural); ev-privacy, ev-training, ev-retention, ev-zdr, ev-dpa (all retrieved)
  verdict: "You own the Apache-licensed flagship models outright: self-hosted, the model and your data are yours to run, modify and keep. Overall ownership is partial because the family is licence-split. Ministral 8B, Mistral Large 2 and Pixtral Large are research-only MRL, Codestral is non-production MNPL, and newer large releases use custom licences with their own conditions. These models need a separately negotiated commercial licence, so each model must be checked before use. Training is also not transparent, since data and code are closed. If Mistral's hosted API is used instead of self-hosting, turn off training and consider Zero Data Retention."

