# OneHill v2 MODEL library entry for Mistral AI's open-weight family.
# Validated against schema/model.v2.schema.json.
#   scores    -> scripts/score.py --write        (AOI headline/grade - computed, not hand-set)
#   meters    -> scripts/completeness.py --write  (per-domain completeness/originality)
#   prose     -> assess.md / implement.md / use.md / support.md (sections keyed <!-- item: KEY -->)

schema_version: "2.0"
id: mistral
name: Mistral AI (open-weight family)
aliases:
- Mistral
- Mistral 7B
- Mixtral
- Mixtral 8x7B
- Mixtral 8x22B
- Mistral Nemo
- Mistral Small
- Ministral
- Codestral
- mistralai
family:
  id: mistral
  name: Mistral
publisher:
  name: Mistral AI
  country: FR
  accountable_entity: true
  url: https://mistral.ai/
  security_contact: https://huggingface.co/mistralai
summary: "Mistral AI is a Paris-based EU lab, and its open-weight releases are the leading European alternative to the US open-model families. The line spans the dense Mistral 7B, the Mixtral 8x7B and 8x22B sparse mixture-of-experts models, Mistral Nemo (12B, 128K context, built with NVIDIA), the 24B Mistral Small 3.x, and specialist variants (Codestral for code, Mathstral, Pixtral for vision, Devstral). This entry covers the OSI-approved Apache-2.0 line, with unconditional commercial use: Mistral 7B, Mixtral, Nemo, Mistral Small 3.x, Pixtral 12B and the Apache specialist models (Codestral Mamba, Mathstral, Devstral Small, Magistral Small). The non-commercial models are in the separate mistral-research-license entry: Ministral 8B, Mistral Large 2 and Pixtral Large under the research-only MRL, and Codestral under the non-production MNPL. Mistral's EU domicile and its status as an early signatory of the EU GPAI Code of Practice give it the strongest regulatory posture of any non-US family in the registry."
variants:
- name: Mistral 7B
  params_total: 7B
  context_window: 8k-32k (by version)
  kind: instruct
  safety_tuned: true
- name: Mixtral 8x7B
  params_total: 46.7B
  params_active: 12.9B
  context_window: 32k
  kind: instruct
  safety_tuned: true
- name: Mixtral 8x22B
  params_total: 141B
  params_active: 39B
  context_window: 64k
  kind: instruct
  safety_tuned: true
- name: Mistral Nemo (12B)
  params_total: 12B
  context_window: 128k
  kind: instruct
  safety_tuned: true
- name: Mistral Small 3.x (24B)
  params_total: 24B
  context_window: 128k
  kind: instruct
  safety_tuned: true
- name: Codestral Mamba / Mathstral / Devstral Small (Apache)
  kind: code
  safety_tuned: false
- name: Pixtral 12B
  params_total: 12B
  kind: multimodal
  safety_tuned: true
openness:
  tier: open_weights
  components:
    weights: open
    training_data: closed
    training_code: closed
    evaluation: partial
    documentation: open
    license: partial
  license:
    spdx: Apache-2.0
    name: Apache 2.0 (flagship open-weight models); Mistral Research License / MNPL for some models
    classification: osi
    commercial_use: allowed_with_conditions
    notable_restrictions:
    - "The flagship general-purpose models (Mistral 7B, Mixtral, Nemo, Mistral Small 3.x) are Apache-2.0 with unconditional commercial use."
    - "Ministral 8B (2410), Mistral Large 2 (2407, 2411) and Pixtral Large (2411) ship under the research-only Mistral Research Licence (MRL). A commercial licence must be negotiated separately. Later releases are not MRL: Mistral Large 3 (675B) and Ministral 3 (3B, 8B, 14B) are Apache-2.0 according to their raw model cards."
    - "Codestral-22B-v0.1 is under the non-production MNPL on Hugging Face. Check the licence per model and per version."
    - "From September 2026 Mistral has also released models under custom licences that are neither Apache-2.0 nor MRL: Mistral Large 4 (Mistral Ecosystem Open-Weight License), Timestral and Mistral Medium 3.5 (Modified MIT with a monthly-revenue cap). They are not covered by this entry."
    url: https://docs.mistral.ai/models/overview
provenance:
  canonical_source: https://huggingface.co/mistralai
  verified_org_on_primary_host: true
  formats:
  - safetensors
  integrity:
    checksums: true
    signed: false
    signing_tech: ''
    provenance_attestation: false
  mirrors_and_quants:
    acknowledged: true
    notable:
    - name: bartowski / unsloth / lmstudio-community (GGUF, AWQ, FP8 quantizations)
      trust: community
      note: popular local-inference quants, which are not the canonical weight source
    - name: Hosted on Bedrock / Azure AI / Vertex / Together / OpenRouter
      trust: provider
      note: served endpoints, which are not the weight source
  checkpoint_checklist_score: 6
  scanner_result: {}
  incidents: []
eu_ai_act:
  is_gpai: true
  systemic_risk:
    designated: false
    training_flops_estimate: The Apache open-weight family (<=24B dense, Mixtral MoE) sits well under 1e25 FLOPs. Mistral Large 2 (123B) is research-only MRL. Mistral Large 3 (675B MoE, 41B active, Apache-2.0) is far larger, but Mistral publishes no FLOP figure for it, so the 1e25 line cannot be checked from released artifacts. The Apache models tracked here are the small and mid-size ones.
    over_1e25_threshold: false
    article_55_docs_available: n/a
  open_source_exemption:
    license_qualifies: partial
    rationale: 'The flagship general-purpose models (Mistral 7B, Mixtral, Nemo, Mistral
      Small 3.x) are released under genuine OSI-approved Apache-2.0 with public parameters,
      architecture and usage information - so those models plausibly qualify for the
      Article 53 open-source exemption from the Annex XI/XII technical-documentation duties.
      The exemption does NOT extend to the research-only MRL models (Ministral 8B, Mistral
      Large, Pixtral Large), whose field-of-use restriction fails the Act''s "free and
      open-source" test. None of the open-weight releases is a designated systemic-risk
      model, so where the exemption applies it is not voided; the surviving copyright-policy
      and training-content-summary obligations still apply and are only partially met because
      Mistral does not publish its training corpus.

      '
  provider_package:
    technical_documentation: partial
    downstream_information: 'yes'
    copyright_policy: partial
    training_content_summary: partial
    code_of_practice_signatory: true
  deployer_notes: "Mistral is EU-domiciled (Paris) and was among the first signatories of the EU GPAI Code of Practice in 2025. Its regulatory posture is the strongest of any non-US family in the registry, with no EU field-of-use ban of the kind that affects some competitors. A downstream EU deployer receives only a partial documentation set, because training data and a full training-content summary are not published. A fine-tuner placing a derivative on the EU market under its own name may become a provider for that derivative. Confirm each model's licence: an MRL model may not be deployed commercially without a negotiated licence."
  last_assessed: '2026-07-25'
performance:
  note: Third-party framing only.
  class_position: Competitive-to-strong within each size class on public leaderboards; the leading European open-weight family.
behaviour:
  refusals: Instruct variants refuse clearly-harmful requests but are historically tuned for lower over-refusal than the largest US labs.
  prompt_injection: Residual susceptibility like all current LLMs; treat retrieved/tool content as untrusted.
  failure_modes: Standard hallucination profile for its class; documented in model cards.
safety:
  variant_assessed: Instruct + Mistral Moderation API
  jailbreak_resistance: Withstands casual jailbreaks; deploy the instruct variant with the moderation classifier, never the base.
  guard_model: Mistral Moderation API (a fine-tuned Ministral 8B, offered as a hosted classifier) - not a broadly-shipped open guard-weight comparable to Llama Guard.
deployment:
  ceiling_tier: T2
  ceiling_conditional: true
  hardware_notes: "The 7B and 12B models run on a single modern GPU. The 24B Mistral Small fits a 24 GB card with modest quantization. Mixtral 8x22B and Mistral Large 2 (123B) need multi-GPU or heavy quantization for latency-sensitive serving."
  serving_support:
  - vllm
  - mistral-inference
  - llama.cpp
  - ollama
  - tgi
  - hf-transformers
  controls_required:
  - "Deploy the instruct (safety-tuned) variant, not the base checkpoint."
  - "Add input/output guardrails. The Mistral Moderation API can serve as the companion classifier."
  - "Add prompt-injection defences and treat retrieved and tool content as untrusted."
  - "Confirm the per-model licence (Apache-2.0 or research-only MRL) before commercial deployment."
  - "Pin the exact mistralai revision and verify checksums."
score:
  rubric_version: '1.1'
  headline: 73.2
  grade: B
  hard_flags: []
  dimensions:
    openness:
      score: 3
      rationale: "The tier is open-weights, which caps Dimension 1 at 3. The flagship general-purpose models are downloadable under the permissive, OSI-approved Apache-2.0 licence, and the documentation is good. Training data and training code are closed, so there is no reproduction path. Evaluation is only partial, and a meaningful subset of the family ships under the research-only MRL, so the licence component is split. The score sits at the top of the 3 band, short of the recipe (4) and fully-open (5) tiers."
      evidence_refs:
      - ev-small3
      - ev-weights
      - ev-mrl
      - ev-hf
    provenance:
      score: 4
      rationale: "The mistralai org on Hugging Face is verified. Weights ship as safetensors only, with per-file checksums, from a clear canonical source, and no malicious-checkpoint incident is on record (checklist ~6/8). The score stops short of 5 because the weights are not cryptographically signed and there is no SLSA-style provenance attestation."
      evidence_refs:
      - ev-hf
      - ev-weights
    legal:
      score: 4
      rationale: "The Apache-2.0 flagship models are OSI-approved with unconditional commercial use. The publisher is EU-domiciled and accountable, an early signatory of the EU GPAI Code of Practice, with no EU field-of-use ban. The score is 4, not 5, for two reasons. The family has a licence split, and the research-only MRL models need a negotiated commercial licence. The training corpus is not published, so the EU training-content-summary obligation can be only partially met from released artifacts."
      evidence_refs:
      - ev-small3
      - ev-cop
      - ev-mrl
    safety:
      score: 3
      rationale: "Instruct variants are safety-tuned, and Mistral ships a hosted Moderation API (a fine-tuned Ministral 8B) and system-level guardrailing guidance, which is above a bare release. The score is 3 because safety tuning is historically lighter than at the largest US labs, no broadly distributed open guard-weight comparable to Llama Guard exists, and no broad independent third-party red-team across CBRN, cyber and prompt-injection domains has been published. Base checkpoints are untuned."
      evidence_refs:
      - ev-moderation
      - ev-wiki
    performance:
      score: 4
      rationale: "Mistral models are competitive to strong within each size class on public leaderboards. Mistral 7B and Mixtral were class-leading at release, Mistral Small 3.x remains strong for a 24B, and the family is the leading European open-weight line. The score is capped at 4 because the evidence is third-party leaderboards without independent reproduction."
      evidence_refs:
      - ev-leaderboard
      - ev-wiki
    operational:
      score: 4
      rationale: "Ecosystem support is broad: an official inference library (mistral-inference), day-0 or near-day-0 loading on vLLM, llama.cpp, Ollama, TGI and transformers, safetensors distribution, community quants and hosted endpoints on the major clouds. The score stops short of 5 because the official first-party quantization programme is narrower than the largest ecosystems."
      evidence_refs:
      - ev-inference
      - ev-hf
      - ev-weights
    governance:
      score: 4
      rationale: "Mistral is a reputable, legally accountable EU publisher with a predictable, dated release cadence, published model cards, a moderation offering and an EU GPAI Code of Practice signature. The score stops short of 5 because there is no formal cryptographic vulnerability-disclosure or signing process and no published deprecation policy for the open-weight checkpoints."
      evidence_refs:
      - ev-cop
      - ev-hf

# --- Assessed signals: five cross-cutting attributes highlighted at the top of the entry
#     (like the EU AI Act flag). Not a scoring input - each ties back to one of the seven
#     AOI dimensions and summarises documentation that lives in the four domains.
signals:
  trainability:
    level: partial
    dimension: openness
    summary: "Fine-tunable but not reproducible. Apache-2.0 open weights support full SFT, LoRA and redistribution, but training data and code are closed and a subset of the family is research-only MRL, so trainability depends on the model's licence."
    refs: [ev-small3, ev-mrl, ev-hf]
  knowledge_structure:
    level: strong
    dimension: performance
    summary: "The models are a strong grounding backbone. 128K context on Nemo and Mistral Small 3.x, documented tool-calling, improved structured output and solid multilingual (especially European) coverage support RAG and structured workflows."
    refs: [ev-small3, ev-leaderboard]
  specialization:
    level: strong
    dimension: openness
    summary: "Specialisation is a strength. Permissive Apache weights, a large adapter and fine-tuning ecosystem, and existing domain variants (Codestral, Mathstral, Devstral, Pixtral) serve as templates. Continued pre-training is limited by closed data and code."
    refs: [ev-weights, ev-hf]
  exchangeability:
    level: high
    dimension: operational
    summary: "Highly exchangeable: safetensors on every major runtime, an official mistral-inference library and OpenAI-compatible serving. The main gotcha when swapping is Mistral's own chat template and mistral-common/Tekken tokenization."
    refs: [ev-inference, ev-hf]
  misuse_exposure:
    level: unbenchmarked
    dimension: safety
    summary: "Not independently benchmarked for misuse. Mistral offers a hosted Moderation API and guardrailing guidance, but no broad third-party CBRN, cyber or prompt-injection red-team battery exists to aggregate."
    refs: [ev-moderation]

# --- Four documentation domains. Item keys match checklists/model.yaml and a
#     `<!-- item: KEY -->` section in the domain .md (except gap items).
#     completeness/originality are written by scripts/completeness.py --write.
#     No onehill_generated items this session: OneHill has run nothing, so every item
#     is `aggregated` (public source, >=1 ref) or an honest `gap`. Originality = 0.
documentation:
  assess:
    completeness: 93.3
    originality: 0.0
    items:
      - key: intended-use
        title: "Intended & out-of-scope use"
        doc_type: reference
        source_type: aggregated
        coverage: full
        refs: [ev-weights, ev-small3]
        summary: "General-purpose assistant, coding and multilingual use. Deploy the instruct variant, not the base, and confirm the per-model licence before commercial use."
      - key: limitations
        title: "Known limitations, bias & failure modes"
        doc_type: reference
        source_type: aggregated
        coverage: full
        refs: [ev-wiki, ev-moderation]
        summary: "Class-standard hallucination, residual prompt-injection susceptibility, historically lighter safety tuning, and a licence split that constrains commercial use of MRL models."
      - key: openness
        title: "Openness tier & components"
        doc_type: explanation
        source_type: aggregated
        coverage: full
        refs: [ev-small3, ev-weights, ev-mrl]
        summary: "open_weights tier: Apache-2.0 flagship weights and good documentation. Training data and code are closed, and research-only MRL models split the licence component."
      - key: license
        title: "License terms & permitted use"
        doc_type: reference
        source_type: aggregated
        coverage: full
        refs: [ev-small3, ev-mrl, ev-mnpl, ev-hf-cards, ev-overview]
        summary: "Apache-2.0 (OSI, unconditional commercial use) for the flagship models. Research-only MRL for Ministral 8B, Mistral Large 2 and Pixtral Large. MNPL for Codestral-22B, which still carries that tag. Mistral Large 3 and Ministral 3 are Apache-2.0, not MRL."
      - key: provenance
        title: "Supply-chain & provenance"
        doc_type: reference
        source_type: aggregated
        coverage: full
        refs: [ev-hf, ev-weights]
        summary: "Verified mistralai org on Hugging Face, safetensors with checksums, no signing or SLSA attestation. Community GGUF, AWQ and FP8 quants are separate artifacts."
      - key: eu-ai-act
        title: "EU AI Act posture"
        doc_type: explanation
        source_type: aggregated
        coverage: full
        refs: [ev-cop, ev-small3]
        summary: "GPAI; the open-weight family is well under 1e25 FLOPs (not systemic-risk); EU-domiciled and an early GPAI Code of Practice signatory. The Article 53 exemption applies to the Apache models, not the MRL ones."
      - key: evaluation
        title: "Benchmarks & evaluation"
        doc_type: reference
        source_type: aggregated
        coverage: full
        refs: [ev-leaderboard, ev-wiki]
        summary: "Competitive to strong in each size class on public leaderboards; the leading European open-weight family."
      - key: safety-eval
        title: "Independent safety evaluation"
        doc_type: reference
        source_type: gap
        gap_reason: "No broad independent adversarial evaluation across CBRN, cyber and prompt-injection domains has been published for the Mistral open-weight family. Mistral documents a Moderation API and guardrailing guidance, but no third-party red-team battery exists to aggregate."
  implement:
    completeness: 95.5
    originality: 0.0
    items:
      - key: install
        title: "Install & run"
        doc_type: howto
        source_type: aggregated
        coverage: full
        refs: [ev-hf, ev-inference]
        summary: "Hugging Face from_pretrained (safetensors), the official mistral-inference library, Ollama pull, vLLM serve or llama.cpp GGUF. Pin the exact mistralai revision."
      - key: hardware
        title: "Hardware & VRAM requirements"
        doc_type: reference
        source_type: aggregated
        coverage: full
        refs: [ev-weights, ev-hf]
        summary: "7B and 12B on a single modern GPU; 24B Mistral Small on a 24 GB card with modest quantization; Mixtral 8x22B and Mistral Large 2 (123B) need multi-GPU or heavy quantization."
      - key: serving
        title: "Serving stacks"
        doc_type: reference
        source_type: aggregated
        coverage: full
        refs: [ev-inference, ev-weights]
        summary: "The official mistral-inference library, vLLM, TGI, llama.cpp, Ollama and transformers load the standard safetensors checkpoints."
      - key: safe-deployment
        title: "Safe-deployment controls & Deployment Ceiling"
        doc_type: howto
        source_type: aggregated
        coverage: full
        refs: [ev-moderation, ev-small3]
        summary: "Deployment Ceiling T2 (conditional): instruct variant, input/output guardrails (the Moderation API as companion classifier), prompt-injection defences, a pinned revision and a per-model licence check."
      - key: quantization
        title: "Available quantizations"
        doc_type: reference
        source_type: aggregated
        coverage: partial
        refs: [ev-hf]
        summary: "A broad community GGUF, AWQ, GPTQ and FP8 ecosystem and some official low-bit releases. Coverage is partial because the first-party programme is narrower than the largest ecosystems. Verify the source before production use."
      - key: fine-tuning
        title: "Fine-tuning & adaptation"
        doc_type: howto
        source_type: aggregated
        coverage: full
        refs: [ev-inference, ev-hf]
        summary: "Standard SFT and LoRA via transformers, PEFT, TRL, Axolotl or Unsloth on the safetensors checkpoints. Pre-training data and code are not open, so continued pre-training from scratch cannot be reproduced."
      - key: integration
        title: "API / OpenAI-compatible integration"
        doc_type: howto
        source_type: aggregated
        coverage: full
        refs: [ev-inference, ev-weights, ev-privacy, ev-training, ev-retention, ev-zdr, ev-commercial-tos]
        summary: "Serve behind vLLM's OpenAI-compatible /v1 server (or TGI or Ollama), or use Mistral's hosted API (Mistral Studio). Hosted terms depend on the product. Vibe consumer plans (Free, Pro, Teams, Student) train on inputs by default unless the user opts out, Studio Free mode may train, and Labs and Preview models may always train. The Commercial Terms (4.2) allow training only on an opt-in, on feedback, or on Labs and Preview models. API data is kept for the time needed to generate the output plus 30 rolling days for abuse monitoring. EU hosting is the default, with a US endpoint option. Zero Data Retention is available only on pay-as-you-go stateless endpoints, at Mistral's discretion."
  use:
    completeness: 94.4
    originality: 0.0
    items:
      - key: capabilities
        title: "Capabilities & modalities"
        doc_type: reference
        source_type: aggregated
        coverage: full
        refs: [ev-small3, ev-leaderboard]
        summary: "Strong generalist, coding and multilingual text models. Pixtral adds vision. Mistral Small 3.x is competitive for a 24B, with tool use and structured output."
      - key: context-window
        title: "Context window & long-context behaviour"
        doc_type: reference
        source_type: aggregated
        coverage: full
