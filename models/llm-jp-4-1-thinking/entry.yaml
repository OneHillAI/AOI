    transparency:
      level: strong
      rationale: "Corpora, SFT and DPO data and pre-training scripts are public with per-source licences and a technical report, with named exclusions (NWJC, Ceek.jp News, ichikara, AnswerCarefully) and no confirmed 4.1 post-training code (ev-techreport, ev-corpus-v4, ev-sft-dpo, ev-code)."
    reliability:
      level: weak
      rationale: "Safety scores 2: one publisher-run Japanese benchmark, no independent evaluation or guard model, and the publisher says the models are not for direct production use; operational is 3 (ev-card-41, ev-blog, ev-cookbook)."
    data_control:
      level: strong
      rationale: "Self-hosted weights under Apache-2.0 with no telemetry or claw-back; review the two repository Python files that run under trust_remote_code (ev-license, ev-hub-api)."
  verdict: "You own the weights, the data lineage and the right to run and change them: Apache-2.0, ungated, with public corpora, SFT and DPO sets and pre-training scripts, so this is one of the most transparent models reviewed. You do not own a deployable safety case: the publisher says the models are for research and development and not for direct production use, offers one self-run Japanese safety benchmark, no guard model and no independent test. Ownership moves to substantial if an independent evaluation lifts safety to 3 or more, and you can reach that yourself by running your own safety and jailbreak tests behind your own guard."

