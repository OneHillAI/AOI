# OneHill v2 MODEL library entry for LLM-jp-4.1 (thinking models: 8B, 32B-A3B, 33B).
# Validated against schema/model.v2.schema.json.
#   scores    -> scripts/score.py --write        (AOI headline/grade)
#   meters    -> scripts/completeness.py --write  (per-domain completeness/originality)
#   prose     -> assess.md / implement.md / use.md / support.md (sections keyed <!-- item: KEY -->)
#
# Scope note: the entry id is `llm-jp-4-1-thinking` (named by release). The scored release is the
# LLM-jp-4.1 post-trained "thinking" series (llm-jp-4.1-8b-thinking, llm-jp-4.1-32b-a3b-thinking,
# llm-jp-4.1-33b-thinking). The three share one licence, one card, one corpus lineage and one
# safety posture. The LLM-jp-4 (4.0) thinking models carry a different Risks statement
# (not safety tuned) and the base, VL and speech models are separate releases; see the
# follow-ups in assess.md. Grounded 2026-11-19 against docs/primary-sources/llm-jp-4-1-thinking/.

schema_version: "2.0"
id: llm-jp-4-1-thinking
name: LLM-jp-4.1 thinking (8B, 32B-A3B, 33B)
aliases:
- LLM-jp-4.1
- llm-jp-4.1-33b-thinking
- llm-jp-4.1-32b-a3b-thinking
- llm-jp-4.1-8b-thinking
- LLM-jp-4
family:
  id: llm-jp
  name: LLM-jp
publisher:
  name: Research and Development Center for Large Language Models (LLMC), National Institute of Informatics (NII), Japan - LLM-jp consortium
  country: JP
  accountable_entity: true
  url: https://llm-jp.nii.ac.jp/en/
  security_contact: llm-jp(at)nii.ac.jp (general contact on the model cards; no security policy published)
summary: 'LLM-jp-4.1 is the most documented Japanese open model family reviewed so far, but its own cards
  say it is for research and development and not for direct use in production services. It is a
  from-scratch Japanese and English reasoning (thinking) model series from Japan''s National Institute
  of Informatics: an 8B dense, a 32B-A3B mixture-of-experts and a 33B dense model, each trained on
  11.7T tokens, with a 64K context window, Apache-2.0 weights, public pre-training and mid-training
  corpora (with named exclusions), published SFT and DPO datasets (with named exclusions) and released
  pre-training scripts. Post-training is SFT plus DPO only, with no reinforcement learning. 4.1 adds
  tool calling over the 4.0 series. Its safety evidence is a single publisher-run Japanese benchmark,
  there is no guard model and no independent evaluation, so the entry scores low on safety and
  performance evidence even though openness is high.

  '
variants:
- name: llm-jp-4.1-33b-thinking
  params_total: 33.2B
  context_window: 64k
  kind: reasoning
  safety_tuned: true
- name: llm-jp-4.1-32b-a3b-thinking
