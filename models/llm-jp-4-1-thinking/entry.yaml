    checksums: true
    signed: false
    signing_tech: ''
    provenance_attestation: false
  mirrors_and_quants:
    acknowledged: true
    notable:
    - name: llm-jp/llm-jp-4.1-*-thinking-gguf (BF16 and Q4_K_M, imatrix)
      trust: publisher
      note: official GGUF builds from the same org, created 2026-09-24; the card says llama.cpp needs a publisher fork while the cookbook says upstream v0.6.0 or later works
    - name: elyza/ELYZA-Thinking-1.0-llm-jp-4 (33b and 32b-a3b)
      trust: community
      note: third-party fine-tune built on LLM-jp-4, listed in an earlier research lead only; its card was not read here
  checkpoint_checklist_score: 4
  scanner_result:
    tool: Hugging Face repository scan
    clean: true
    date: '2026-11-19'
  incidents: []
eu_ai_act:
  is_gpai: true
  systemic_risk:
    designated: false
    training_flops_estimate: about 2.3e24 FLOPs for the 33B dense model (6 x 33.2B parameters x 11.7T tokens, OneHill estimate); far lower for the 8B and the 3.8B-active MoE
    over_1e25_threshold: false
    article_55_docs_available: n/a
  open_source_exemption:
    license_qualifies: 'yes'
    rationale: 'Apache-2.0 with public weights, architecture and usage information (model cards, cookbook, technical
      report), no monetisation found. The Article 53 exemption from Annex XI and XII documentation plausibly applies,
      and the models are far below the 1e25 systemic-risk threshold. The exemption does not remove the copyright
      policy and public training-content summary duties. LLM-jp documents a dataset release-level policy built on
      Japanese copyright law and lists every pre-training subcorpus with licence and token count, but it has not
      published a summary in the AI Office template, and it states no policy on EU text-and-data-mining opt-outs.

      '
  provider_package:
    technical_documentation: partial
    downstream_information: partial
    copyright_policy: partial
    training_content_summary: partial
    code_of_practice_signatory: unknown
  deployer_notes: 'The publisher states the models are not intended for direct production use, so a deployer who
    ships them in a product has no provider statement of intended purpose that supports production and carries
    the evaluation burden. A fine-tuner who places a derivative on the EU market under its own name may become a
    provider for that derivative. The technical report (arXiv 2610.19331) covers the LLM-jp-4 8B and 32B-A3B models and
    says 33B results will follow in a later revision; it does not describe the 4.1 post-training, which is
    documented only in the model cards and a Japanese blog post.

    '
  last_assessed: '2026-11-19'
performance: {}
behaviour: {}
safety: {}
deployment:
  ceiling_tier: T1
  ceiling_conditional: true
  hardware_notes: 'No minimum hardware is published; the cookbook records one test machine (RTX 6000 Ada, 32 GiB RAM)
    and says it is not a minimum. Weight size from the hub listing: the 33B GGUF is 66.4 GB in BF16 and 20.4 GB in
    Q4_K_M, so the BF16 33B needs roughly 70 GB of accelerator memory before the KV cache, and a Q4_K_M build fits
    a single 24 GB card with a short context. The 8B is about 17 GB in BF16 (safetensors shards total about 17.2 GB).
    The 32B-A3B holds 32B parameters in memory but computes with 3.8B.

    '
  serving_support:
  - hf-transformers
  - vllm
  - llama.cpp
  controls_required:
  - Treat the models as research and development models, as the publisher does, and keep a human reviewing outputs (T1 internal assistant) until you have run your own safety and jailbreak evaluation
  - Add input and output guardrails and your own guard classifier; the publisher ships none
  - Pin the exact Hugging Face revision, verify the LFS sha256 values and review llmjp4_tokenizer.py and llmjp4_harmony.py before using trust_remote_code=True
  - Use the publisher cookbook versions (Transformers 5.0.0 or later, vLLM 0.30.0 or later with llm-jp-vllm 0.1.1 or later, llama.cpp v0.6.0 or later) and test tool-call parsing before letting the model call tools
  - Sandbox any tool execution; tool calling was added in 4.1 and its safety behaviour has not been independently tested
score:
  rubric_version: '1.1'
  headline: 54.4
  grade: D
  hard_flags: []
  dimensions:
    openness:
      score: 4
      rationale: 'Open weights under Apache-2.0 plus a published recipe: pre-training and mid-training corpora on public GitLab with per-subcorpus licences, SFT and DPO datasets on Hugging Face, pre-training and mid-training scripts and installers on GitHub (Apache-2.0), and a technical report that states data-selection criteria. Held at 4, not 5, because the data release is partial (NWJC and Ceek.jp News are not redistributable; the SFT sets omit AnswerCarefully and ichikara, and two further subsets are marked "To be released"), no document confirms the post-training code used for 4.1, and the judge model for the published evaluations is a closed GPT model.

        '
      evidence_refs:
      - ev-card-41
      - ev-techreport
      - ev-corpus-v41
      - ev-corpus-v4
      - ev-corpus-mid2
      - ev-sft-dpo
      - ev-code
      - ev-license
    provenance:
      score: 2
      rationale: 'The canonical source is identifiable (the NII release page links to huggingface.co/llm-jp), weights are safetensors with per-file sha256, the hub scan reports no flagged files and the org publishes official GGUF builds. The Hugging Face organisation is not verified (isVerified false), nothing is signed, there is no attestation, and loading needs trust_remote_code=True so repository Python files run on your machine. Anchor 2 names an unverified org as the missing key control; about 4 of 8 checklist boxes are met.

        '
      evidence_refs:
      - ev-hub-api
      - ev-release-page
      - ev-cookbook
    legal:
      score: 3
      rationale: 'Apache-2.0 grants copyright and patent rights with no field-of-use clause, so commercial and production use is licensed. The publisher nevertheless says the models are "not intended for direct use in production services", so there is no provider statement of intended purpose that supports a production deployment. Documentation is partial: a good per-source training-data account but no AI Office summary, no Annex XI package, the report omits 33B and 4.1, and the Code of Practice status is unknown. Held at 3 and not 4 because the use-guidance wording and the missing EU-format package leave real residual gaps for a deployer.

        '
      evidence_refs:
      - ev-license
      - ev-card-41
      - ev-techreport
      - ev-corpus-v4
      - ev-release-page
    safety:
      score: 2
      rationale: 'The 4.1 models are safety post-trained (the card says SFT and DPO "for instruction following and safety", and the report describes an upsampled Japanese safety set and safety-judged preference pairs), and the residual risk is disclosed. The only published safety evaluation is AnswerCarefully (336 Japanese questions, LLM judge gpt-5.4), run by the publisher: 4.08 for 33B against 4.43 for gpt-5.4 and 4.00 for gpt-4o. There is no jailbreak test, no English or multi-domain safety evaluation, no red-team, no guard model and no independent result, and the publisher itself says the models are not for direct production use. Anchor 2. An independent evaluation with jailbreak coverage would move it to 3.

        '
      evidence_refs:
      - ev-card-41
      - ev-techreport
      - ev-blog
      - ev-sft-dpo
    performance:
      score: 2
      rationale: 'All figures are publisher-run and there is no independent re-run. The technical report puts LLM-jp-4-32b-a3b-thinking on par with Qwen3-8B and gpt-oss-20b on Japanese llm-jp-eval (0.605 against 0.608 and 0.604) but below both on English (0.650 against 0.714 and 0.704) and below both on GPQA Diamond and AIME. The 4.1 blog says large gains over 4.0 but a continuing gap to Qwen3.5 on tool calling, GPQA Diamond and AIME. Roughly mid-pack for its class with thin independent coverage, so anchor 2; strength is Japanese-language tasks.

        '
      evidence_refs:
      - ev-techreport
      - ev-blog
      - ev-card-41
    operational:
      score: 3
      rationale: 'Runs on Hugging Face Transformers, vLLM and llama.cpp with a maintained Apache-2.0 cookbook, official GGUF builds in BF16 and Q4_K_M, a 64K context and a Q4_K_M 33B validated on a local GPU. Held at 3: the custom tokenizer needs trust_remote_code=True, vLLM needs the llm-jp-vllm plugin and vLLM 0.30.0 or later, the GGUF card and cookbook disagree on whether llama.cpp needs a fork, no minimum hardware is published, and Ollama support is not documented.

        '
      evidence_refs:
      - ev-cookbook
      - ev-gguf
      - ev-hub-api
    governance:
      score: 3
      rationale: 'A national research institute with named authors and a public release record: 4.0 in March 2026, 33B in August, 4.1 in September, technical report in October. Issue reporting is a contact email on the cards and Hugging Face discussions. There is no security policy, no vulnerability-disclosure process and no deprecation or support-window policy, so it stays at 3.

        '
      evidence_refs:
      - ev-release-page
      - ev-hub-api
      - ev-pcwatch

# --- Assessed signals.
signals:
  trainability:
    level: partial
    dimension: openness
    summary: "Apache-2.0 weights, public corpora, SFT and DPO data and pre-training scripts support fine-tuning and continued pre-training; a full rebuild is not possible because several datasets are withheld and the post-training code is unconfirmed."
    refs: [ev-license, ev-corpus-v4, ev-sft-dpo, ev-code]
  knowledge_structure:
    level: moderate
    dimension: performance
    summary: "A 64K context, reasoning channel and tool calling make it usable for grounded Japanese and English work, but the publisher results trail Qwen3.5 on tool calling and hard reasoning."
    refs: [ev-card-41, ev-blog]
  specialization:
    level: moderate
    dimension: openness
    summary: "Base models, SFT data and DPO data are public so Japanese domain specialisation is practical; the custom Harmony-style template and tokenizer add work and 4.1 post-training code is unconfirmed."
    refs: [ev-sft-dpo, ev-cookbook]
  exchangeability:
    level: medium
    dimension: operational
    summary: "Standard Llama and Qwen3-MoE architectures load on common runtimes, but the custom tokenizer, Harmony-derived template and parser plugins make it less drop-in than a plain chat model."
    refs: [ev-cookbook, ev-hub-api]
  misuse_exposure:
    level: partial
    dimension: safety
    summary: "One publisher-run Japanese safety benchmark exists; no jailbreak, English, cyber or CBRN evaluation and no guard model, and the publisher says not to use it directly in production."
    refs: [ev-card-41, ev-blog]

