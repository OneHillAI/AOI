    - No LICENSE file is published in the model repositories; the grant rests on the card front matter, the card License section and the technical report.
    url: https://huggingface.co/llm-jp/llm-jp-4.1-33b-thinking
provenance:
  canonical_source: https://huggingface.co/llm-jp
  verified_org_on_primary_host: false
  formats:
