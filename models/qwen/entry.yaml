        refs: [ev-qwen-hf, ev-perf-coding]
        summary: >-
          General-purpose assistant use and especially coding and agentic workloads across a wide
          size range. Deploy behind your own guards, and treat the systemic-risk large variants as
          out of scope for EU high-stakes use.
      - key: limitations
        title: "Known limitations, bias & failure modes"
        doc_type: reference
        source_type: aggregated
        coverage: full
        refs: [ev-behaviour, ev-safety]
        summary: >-
          China-aligned topic censorship; lighter safety tuning than at Western frontier labs with
          no guard model; capability leadership concentrated in coding and agentic work.
      - key: openness
        title: "Openness tier & components"
        doc_type: reference
        source_type: aggregated
        coverage: full
        refs: [ev-qwen-hf, ev-license]
        summary: >-
          open_weights: Apache-2.0 weights and a good model card, with closed training data and
          code and only partially reproducible evaluation.
      - key: license
        title: "License terms & permitted use"
        doc_type: reference
        source_type: aggregated
        coverage: full
        refs: [ev-license]
        summary: >-
          Mainstream Qwen3 sizes are OSI Apache-2.0 with unconditional commercial use. Verify
          LICENSE per checkpoint, because some large or legacy variants use the Tongyi Qianwen
          community licence.
      - key: provenance
        title: "Supply-chain & provenance"
        doc_type: reference
        source_type: aggregated
        coverage: full
        refs: [ev-qwen-hf, ev-modelscope]
        summary: >-
          Verified Qwen org on Hugging Face plus official ModelScope dual-publication. Safetensors
          with checksums but no cryptographic signing, so verify checksums match across hubs.
      - key: eu-ai-act
        title: "EU AI Act posture"
        doc_type: explanation
        source_type: aggregated
        coverage: full
        refs: [ev-eu-gap, ev-license]
        summary: >-
          GPAI. The 235B and 480B-Coder likely exceed the 1e25 FLOPs systemic-risk threshold with
          no Article 55 documentation, which voids the open-source exemption for those variants.
      - key: evaluation
        title: "Benchmarks & evaluation"
        doc_type: reference
        source_type: aggregated
        coverage: partial
        refs: [ev-perf-coding]
        summary: >-
          Third-party evaluation shows strong general capability and class-leading open coding
          (Qwen3-Coder). The results are third-party and evaluation is only partially open.
      - key: safety-eval
        title: "Independent safety evaluation"
        doc_type: reference
        source_type: gap
        gap_reason: >-
          No broad independent red-team or safety battery (CBRN, cyber, prompt-injection) has been
