# OneHill v2 MODEL library entry for Qwen (Qwen3 family). Replaces data.yaml.
# Validated against schema/model.v2.schema.json.
#   scores    -> scripts/score.py --write        (AOI headline/grade - carried over unchanged)
#   meters    -> scripts/completeness.py --write  (per-domain completeness/originality)
#   prose     -> assess.md / implement.md / use.md / support.md (sections keyed <!-- item: KEY -->)

schema_version: '2.0'
id: qwen
name: Qwen (Qwen3 family)
aliases:
- Qwen3
- Qwen3-Coder
- Alibaba Qwen
- Tongyi Qianwen
family:
  id: qwen
  name: Qwen
publisher:
  name: Alibaba (Qwen team)
  country: China
  accountable_entity: true
  url: https://huggingface.co/Qwen
  security_contact: https://huggingface.co/Qwen
summary: >-
  Qwen is Alibaba's large, fast-moving open-weight family. The mainstream Qwen3 generation spans
  dense models from 0.6B to 32B plus Mixture-of-Experts variants, and includes
  Qwen3-Coder-480B-A35B, one of the strongest open coding models available. The mainstream Qwen3
  sizes ship under Apache-2.0, which is more permissive than the restrictive community licences
  some peers use. Two issues matter to an adopter. The largest variants likely cross the EU AI Act
  systemic-risk compute threshold with no Article 55 documentation, and the models show some
  China-aligned topic censorship, so deploy behind your own guards.
variants:
- name: Qwen3 dense
  params_total: 0.6B-32B
  context_window: 32,768 native, 131,072 with YaRN (per checkpoint)
  kind: instruct
  safety_tuned: true
- name: Qwen3 MoE
  params_total: up to 235B
  params_active: MoE - subset active per token
  context_window: 32,768 native, 131,072 with YaRN (per checkpoint)
  kind: instruct
  safety_tuned: true
- name: Qwen3-Coder-480B-A35B
  params_total: 480B
  params_active: 35B
  context_window: 262,144 native (per checkpoint)
  kind: code
  safety_tuned: true
openness:
  tier: open_weights
  components:
    weights: open
    training_data: closed
    training_code: closed
    evaluation: partial
    documentation: open
    license: open
  license:
    spdx: Apache-2.0
    name: Apache License 2.0 (mainstream Qwen3 sizes; verify per checkpoint)
    classification: osi
    commercial_use: allowed
    notable_restrictions:
    - >-
      Some legacy or very large variants use the Tongyi Qianwen community licence. Verify the
      LICENSE file per checkpoint.
    url: https://huggingface.co/Qwen
provenance:
  canonical_source: https://huggingface.co/Qwen
  verified_org_on_primary_host: true
  formats:
  - safetensors
  integrity:
    checksums: true
    signed: false
    signing_tech: ''
    provenance_attestation: false
  mirrors_and_quants:
    acknowledged: true
    notable:
    - name: ModelScope (Qwen official)
      trust: publisher
      note: Alibaba's own hub - dual-published; verify checksums match across hubs
    - name: Community GGUF quants (Ollama, etc.)
      trust: community
      note: many quants; not canonical
  checkpoint_checklist_score: 5
  scanner_result: {}
  incidents: []
eu_ai_act:
  is_gpai: true
  systemic_risk:
    designated: false
    training_flops_estimate: largest variants (235B, 480B-Coder) likely exceed 1e25;
      smaller Qwen3 under
    over_1e25_threshold: true
    article_55_docs_available: 'no'
  open_source_exemption:
    license_qualifies: 'no'
    rationale: >-
      On licence grounds the Apache-2.0 mainstream sizes plausibly qualify for the open-source
      exemption. The exemption does not apply to systemic-risk models, and the largest Qwen
      variants (235B, Qwen3-Coder-480B) likely exceed the 1e25 FLOPs threshold. For those variants
      the exemption is void and the full Article 55 package is owed, but it is not published.
      Recorded as "no" for the family because the systemic-risk variants dominate the compliance
      risk.
  provider_package:
    technical_documentation: partial
    downstream_information: partial
    copyright_policy: 'no'
    training_content_summary: 'no'
    code_of_practice_signatory: false
  deployer_notes: >-
    A China-based provider is unlikely to furnish an EU AI Office documentation package. For the
    smaller Qwen3 sizes, an EU deployer has a usable model card and a permissive licence but must
    write the copyright policy and training-content material itself. For the systemic-risk large
    variants there is an Article 55 gap that the deployer cannot close from upstream artifacts,
    which affects siting and use.
  last_assessed: '2026-07-25'
performance: {}
behaviour: {}
safety: {}
deployment:
  ceiling_tier: T3
  ceiling_conditional: true
  hardware_notes: >-
    Dense 0.6B-32B models cover laptop to single GPU. The 235B MoE and 480B-Coder need multi-GPU
    infrastructure or aggressive quantisation.
  serving_support:
  - vllm
  - llama.cpp
  - ollama
  - tgi
  - mlx
  - hf-transformers
  controls_required:
  - Deploy behind your own input/output guardrails; do not rely on built-in alignment
  - Add a guard/classifier model and prompt-injection defences for agentic/coding
    use
  - Verify checksums match across Hugging Face and ModelScope; pin the exact revision
  - For the systemic-risk large variants, close the EU Article 55 gap yourself or
    avoid EU high-stakes use
score:
  rubric_version: '1.1'
  headline: 67.6
  grade: C
  hard_flags:
  - 🚩 EU AI Act systemic-risk variants (Qwen3-235B, Qwen3-Coder-480B) likely exceed
    1e25 FLOPs with no Article 55 documentation
  dimensions:
    openness:
      score: 3
      rationale: >-
        Open-weights tier: weights are downloadable under Apache-2.0 with a good model card.
        Training data and training code are undisclosed, and evaluation is only partially
        reproducible. The weights are open and the training recipe is closed.
      evidence_refs:
      - ev-qwen-hf
      - ev-license
    provenance:
      score: 3
      rationale: >-
        The Qwen org on Hugging Face is verified, the models are also officially published on
        ModelScope, and checkpoints are safetensors with checksums and no canonical-org malicious
        incident (checklist 5/8). The dual-hub distribution is a supply-chain surface, so
        checksums must match across hubs. That meets the score-3 anchor (verified org,
        safetensors, checksums). A 4 needs a scanned checkpoint or a documented
        mirror/quantisation policy (~6-7 boxes), and a 5 needs cryptographic signing.
      evidence_refs:
      - ev-qwen-hf
      - ev-modelscope
    legal:
      score: 3
      rationale: >-
        The permissive Apache-2.0 licence on the mainstream sizes is better than a restricted
        community licence. There is no training-content summary or copyright policy, and the
        largest variants carry a systemic-risk Article 55 gap with no documentation. That caps
        legal readiness at competent-with-caveats.
      evidence_refs:
      - ev-license
      - ev-eu-gap
    safety:
      score: 3
      rationale: >-
        Instruct variants are safety-tuned and withstand casual jailbreaks. Tuning is lighter than
        at Western frontier labs, there is no companion guard model, and the models show
        China-aligned topic censorship. Deploy behind your own guards.
      evidence_refs:
      - ev-safety
      - ev-behaviour
    performance:
      score: 4
      rationale: >-
        Qwen3 has strong general capability and especially strong coding: Qwen3-Coder is among the
        best open coding models on independent evaluation. It does not earn a 5 for the family
        because leadership is concentrated in coding and agentic work, and the results are
        third-party.
      evidence_refs:
      - ev-perf-coding
    operational:
      score: 5
      rationale: >-
        Distribution is dual, on Hugging Face and ModelScope. Serving support is broad (vLLM,
        llama.cpp, Ollama, TGI, MLX), sizes run from laptop to datacentre, and community
        quantisations are abundant. Day-0 availability spans the stack.
      evidence_refs:
      - ev-qwen-hf
      - ev-ecosystem
    governance:
      score: 3
      rationale: >-
        Alibaba's Qwen team is an active, accountable publisher with a rapid release cadence and a
        verified presence on two hubs. There is no documented vulnerability-disclosure or
        deprecation policy and no Code of Practice signature.
      evidence_refs:
      - ev-qwen-hf
      - ev-eu-gap

# --- Assessed signals: five cross-cutting attributes highlighted at the top of the entry
#     (like the EU AI Act flag). Not a scoring input - each ties back to one of the seven
#     AOI dimensions and summarises documentation that lives in the four domains.
signals:
  trainability:
    level: partial
    dimension: openness
    summary: >-
      Fine-tuning is free under Apache-2.0 on the mainstream sizes. Training data and code are
      closed, so the weights can be adapted but training cannot be reproduced. Verify each
      checkpoint's LICENSE.
    refs: [ev-license, ev-qwen-hf]
  knowledge_structure:
    level: moderate
    dimension: performance
    summary: >-
      Long context (131k with YaRN; 262k native on Coder) makes a capable knowledge and coding
      backbone. China-aligned topic censorship distorts coverage of politically sensitive
      subjects.
    refs: [ev-perf-coding, ev-behaviour]
  specialization:
    level: strong
    dimension: openness
    summary: >-
      A wide size ladder (0.6B-480B, including a top open coder) under Apache-2.0 supports
      fine-tuning and distillation.
    refs: [ev-qwen-hf, ev-perf-coding]
  exchangeability:
    level: high
    dimension: operational
    summary: >-
      Safetensors weights run across vLLM, llama.cpp, Ollama, TGI and MLX behind OpenAI-compatible
      serving. The Qwen3 chat template and thinking-mode format need handling when swapping.
    refs: [ev-ecosystem, ev-qwen-hf]
  misuse_exposure:
    level: unbenchmarked
    dimension: safety
    summary: >-
      No independent misuse benchmark exists. Safety tuning is lighter than at Western frontier
      labs with no companion guard model, and no broad third-party red-team exists.
    refs: [ev-safety, ev-behaviour]

# --- Four documentation domains. Item keys match checklists/model.yaml and a
#     `<!-- item: KEY -->` section in the domain .md (except gap items).
#     completeness/originality are written by scripts/completeness.py --write.
#     Every credited item is `aggregated` (public source, >=1 ref); OneHill has run nothing,
#     so there are no onehill_generated items and originality = 0.
