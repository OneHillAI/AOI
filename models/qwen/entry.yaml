        doc_type: reference
        source_type: aggregated
        coverage: partial
        refs: [ev-behaviour, ev-safety]
        summary: >-
          China-aligned topic censorship, lighter safety coverage than at frontier labs, and an
          unclosed EU Article 55 gap on the largest variants.

ownership:
  level: partial
  factors:
    use_modify:
      level: strong
      rationale: >-
        The licence is per checkpoint. Mainstream Qwen3 (0.6B, 32B, 235B-A22B,
        Coder-480B-A35B-Instruct) is Apache-2.0 with unconditional commercial use and no MAU
        clause. The legacy and large Tongyi Qianwen checkpoints (Qwen-72B, Qwen2.5-72B-Instruct)
        carry a >100M-monthly-active-user licence trigger, a 'Built with Qwen' attribution
        requirement and export controls. Check the LICENSE file on the exact checkpoint before
        relying on Apache terms.
      # grounded in: ev-license (license, retrieved) - apache-2.0 verified across four Qwen3 checkpoints, no MAU clause; ev-license-tongyi (license, retrieved) - Sec 4 MAU>100M + Sec 5 attribution/export read verbatim on Qwen2.5-72B-Instruct
    transparency:
      level: weak
      rationale: >-
        The weights are held but cannot be inspected: training data and code are closed and
        China-aligned topic censorship is built into behaviour, so sensitive-topic coverage is
        distorted in ways that cannot be audited. On the hosted path, the binding Alibaba Cloud
        Product Terms (Sec 4.48, updated 19 Oct 2026) say Alibaba Cloud 'will not use your Member
        Content to develop or improve the models on Model Studio, unless you separately provide
        your consent'. The FAQ repeats a softer 'never uses your data for model training'. The
        Terms state no retention period, storage region or opt-out mechanism.
      # grounded in: ev-behaviour (third_party) - censorship; ev-terms (terms, retrieved 2026-11-19) - Product Terms Sec 4.48 binding no-training-without-consent, no retention period, region or opt-out stated; ev-modelstudio-faq (docs, retrieved) - FAQ no-training sentence
    reliability:
      level: moderate
      rationale: >-
        Qwen3 runs dependably with 32K native context (128K with YaRN; 256K native on Coder) and
        documented thinking modes. Safety tuning is lighter than at Western frontier labs and no
        companion guard model exists, so the deployer supplies that layer.
      # grounded in: ev-perf-coding (third_party) - class-leading open coding; ev-tech-report (technical_report, retrieved) - Qwen3 report, modes and multilingual coverage
    data_control:
      level: strong
      rationale: >-
        Self-hosted, the Apache-licensed weights run on the deployer's own infrastructure with no
        clawback or telemetry, so data stays with the deployer. On Alibaba's hosted Qwen, the
        binding Product Terms (Sec 4.48) commit that Alibaba Cloud will not use Member Content to
        develop or improve its Model Studio models without separate consent. They treat Input and
        Output as the customer's content, processed on the customer's behalf. The FAQ adds AES-256
        encryption of transmitted data. The general privacy policy documents Singapore storage
        (Philippines addendum), SCC/DPF cross-border transfers and 'ongoing legitimate business
        need' retention. No document states an exact retention period, a storage region for Model
        Studio content or an opt-out mechanism, and the Terms let Alibaba Cloud remove stored data
        from time to time.
      # grounded in: self-hosting (structural); ev-terms (terms, retrieved 2026-11-19) - Product Terms Sec 4.48 no-training-without-consent, Member Content processed on customer's behalf; ev-modelstudio-faq (docs, retrieved) - AES-256 for transmitted data; ev-privacy (privacy_policy, retrieved) - Singapore storage, SCC/DPF transfers, retention
  verdict: >-
    Qwen is partly owned. The Apache-licensed mainstream Qwen3 sizes can be run, modified and
    self-hosted, they perform strongly (especially at coding), and self-hosted data stays on the
    deployer's infrastructure. Two things cap ownership at partial. First, the licence is per
    checkpoint: Apache-2.0 on mainstream Qwen3, but the legacy and large Tongyi Qianwen
    checkpoints (Qwen-72B, Qwen2.5-72B-Instruct) carry a >100M-MAU trigger and 'Built with Qwen'
    attribution, so verify the LICENSE on the exact checkpoint. Second, transparency is weak:
    China-aligned censorship is built in and training is closed. The hosted path carries a binding
    no-training-without-consent term (Alibaba Cloud Product Terms Sec 4.48) alongside a privacy
    policy that documents Singapore storage, SCC/DPF transfers and retention, but no document
    gives an exact retention period, a Model Studio storage region or an opt-out. Adopt with hard
    limits: keep politically sensitive and regulated workloads off it, confirm the per-checkpoint
    licence, and close the Article 55 gap yourself if a systemic-risk-scale variant goes on the EU
    market.

# --- Evidence. Each item carries `doc_type` (which kind of primary document) and `retrieved`
#     (true = the document's substantive text was read; false = known to exist but not read).
#     Grounded 2026-07-25 against the primary-source clauses in
#     docs/primary-sources/qwen/_sources.md. The licence is per-checkpoint: mainstream Qwen3
#     (0.6B/32B/235B-A22B/Coder-480B) is Apache-2.0 (ev-license), while legacy/large Tongyi
#     Qianwen checkpoints (Qwen-72B, Qwen2.5-72B-Instruct) carry an MAU>100M clause
#     (ev-license-tongyi). The hosted-service posture is grounded via the Model Studio FAQ
#     (ev-modelstudio-faq, retrieved) - a no-training commitment plus AES-256 - and
#     the GENERAL Alibaba Cloud privacy policy (ev-privacy). Re-verified 2026-11-19: the binding
#     Alibaba Cloud Product Terms Sec 4.48 were read (ev-terms, retrieved) and state no-training-
#     without-consent; no document read states a Model Studio retention period, region or opt-out.
evidence:
- id: ev-qwen-hf
  claim: >-
    Qwen3 checkpoints are hosted on the verified Qwen org on Hugging Face in safetensors with
    checksums. None is gated: the Hugging Face API reports gated False on every Qwen3 checkpoint
    checked.
  source_type: publisher
  doc_type: model_card
  retrieved: true
  url: https://huggingface.co/Qwen
  date: '2026-11-19'
- id: ev-license
  claim: >-
    Mainstream Qwen3 checkpoints are released under Apache-2.0 with unconditional commercial use
    and no monthly-active-user clause. The raw LICENSE file of four checkpoints (Qwen3-0.6B,
    Qwen3-32B, Qwen3-235B-A22B, Qwen3-Coder-480B-A35B-Instruct) is byte-identical, unmodified
    Apache License 2.0 text, and the cards show "license: apache-2.0". The same text covers the
    wider Qwen3 line (2507 updates, FP8, MLX).
  source_type: publisher
