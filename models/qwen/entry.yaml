# OneHill v2 MODEL library entry for Qwen (Qwen3 family). Replaces data.yaml.
# Validated against schema/model.v2.schema.json.
#   scores    -> scripts/score.py --write        (AOI headline/grade - carried over unchanged)
#   meters    -> scripts/completeness.py --write  (per-domain completeness/originality)
#   prose     -> assess.md / implement.md / use.md / support.md (sections keyed <!-- item: KEY -->)

schema_version: '2.0'
id: qwen
name: Qwen (Qwen3 family)
aliases:
- Qwen3
- Qwen3-Coder
- Alibaba Qwen
- Tongyi Qianwen
family:
  id: qwen
  name: Qwen
publisher:
  name: Alibaba (Qwen team)
  country: China
  accountable_entity: true
  url: https://huggingface.co/Qwen
  security_contact: https://huggingface.co/Qwen
summary: 'Qwen is Alibaba''s large, fast-moving open-weight family. The mainstream
  Qwen3 generation spans dense models from ~0.5B to 32B plus Mixture-of-Experts variants,
  and includes Qwen3-Coder-480B-A35B, one of the strongest open coding models available.
  The mainstream Qwen3 sizes ship under Apache-2.0, which is a genuine advantage over
  the restrictive community licenses some peers use. The two things an adopter must
  weigh: the largest variants likely cross the EU AI Act systemic-risk compute threshold
  with no Article 55 documentation, and the models exhibit some China-aligned topic
  censorship - so deploy behind your own guards.

  '
variants:
- name: Qwen3 dense
  params_total: 0.5B-32B
  context_window: up to 128k (per checkpoint)
  kind: instruct
  safety_tuned: true
- name: Qwen3 MoE
  params_total: up to 235B
  params_active: MoE - subset active per token
  context_window: up to 128k (per checkpoint)
  kind: instruct
  safety_tuned: true
- name: Qwen3-Coder-480B-A35B
  params_total: 480B
  params_active: 35B
  context_window: long-context (per checkpoint)
  kind: code
  safety_tuned: true
openness:
  tier: open_weights
  components:
    weights: open
    training_data: closed
    training_code: closed
    evaluation: partial
    documentation: open
    license: open
  license:
    spdx: Apache-2.0
    name: Apache License 2.0 (mainstream Qwen3 sizes; verify per checkpoint)
    classification: osi
    commercial_use: allowed
    notable_restrictions:
    - Some historical/very-large variants used the Tongyi Qianwen community license
      - verify the LICENSE file per checkpoint
    url: https://huggingface.co/Qwen
provenance:
  canonical_source: https://huggingface.co/Qwen
  verified_org_on_primary_host: true
  formats:
  - safetensors
  integrity:
    checksums: true
    signed: false
    signing_tech: ''
    provenance_attestation: false
  mirrors_and_quants:
    acknowledged: true
    notable:
    - name: ModelScope (Qwen official)
      trust: publisher
      note: Alibaba's own hub - dual-published; verify checksums match across hubs
    - name: Community GGUF quants (Ollama, etc.)
      trust: community
      note: many quants; not canonical
  checkpoint_checklist_score: 5
  scanner_result: {}
  incidents: []
eu_ai_act:
  is_gpai: true
  systemic_risk:
    designated: false
    training_flops_estimate: largest variants (235B, 480B-Coder) likely exceed 1e25;
      smaller Qwen3 under
    over_1e25_threshold: true
    article_55_docs_available: 'no'
  open_source_exemption:
    license_qualifies: 'no'
    rationale: 'On license grounds the Apache-2.0 mainstream sizes plausibly qualify
      for the open-source exemption. But the exemption does not apply to systemic-risk
      models, and the largest Qwen variants (235B, Qwen3-Coder-480B) likely exceed
      the 1e25 FLOPs threshold, so for those the exemption is void and the full Article
      55 package would be owed - which is not published. Recorded as ''no'' for the
      family because the systemic-risk variants dominate the compliance risk.

      '
  provider_package:
    technical_documentation: partial
    downstream_information: partial
    copyright_policy: 'no'
    training_content_summary: 'no'
    code_of_practice_signatory: false
  deployer_notes: 'A China-based provider is unlikely to furnish an EU AI Office documentation
    package. For the smaller Qwen3 sizes an EU deployer inherits a usable model card
    and a permissive license but must self-assemble copyright policy and training-content
    material. For the systemic-risk large variants there is a real Article 55 gap
    that the deployer cannot close from upstream artifacts - factor this into siting
    and use.

    '
  last_assessed: '2026-07-25'
performance: {}
behaviour: {}
safety: {}
deployment:
  ceiling_tier: T3
  ceiling_conditional: true
  hardware_notes: 'Dense 0.5B-32B cover laptop-to-single-GPU; the 235B MoE and 480B-Coder
    need multi-GPU / serious infrastructure or aggressive quantization.

    '
  serving_support:
  - vllm
  - llama.cpp
  - ollama
  - tgi
  - mlx
  - hf-transformers
  controls_required:
  - Deploy behind your own input/output guardrails; do not rely on built-in alignment
  - Add a guard/classifier model and prompt-injection defences for agentic/coding
    use
  - Verify checksums match across Hugging Face and ModelScope; pin the exact revision
  - For the systemic-risk large variants, close the EU Article 55 gap yourself or
    avoid EU high-stakes use
score:
  rubric_version: '1.1'
  headline: 67.6
  grade: C
  hard_flags:
  - 🚩 EU AI Act systemic-risk variants (Qwen3-235B, Qwen3-Coder-480B) likely exceed
    1e25 FLOPs with no Article 55 documentation
  dimensions:
    openness:
      score: 3
      rationale: 'Open-weights tier: weights are downloadable under Apache-2.0 with
        a good model card, but training data and training code are undisclosed and
        evaluation is only partially reproducible. Open-weight distribution over a closed training recipe.

        '
      evidence_refs:
      - ev-qwen-hf
      - ev-license
    provenance:
      score: 3
      rationale: 'Verified Qwen org on Hugging Face plus official ModelScope publication,
        safetensors with checksums, and no canonical-org malicious incident (checklist
        5/8). The dual-hub distribution is a supply-chain surface - verify checksums
        match across hubs. Meets the score-3 anchor (verified org + safetensors +
        checksums); short of 4, which needs a scanned checkpoint or a documented
        mirror/quantization policy (~6-7 boxes), and of 5''s cryptographic signing.

        '
      evidence_refs:
      - ev-qwen-hf
      - ev-modelscope
    legal:
      score: 3
      rationale: 'The permissive Apache-2.0 license on the mainstream sizes is a real
        plus and better than a restricted community license. But there is no training-content
        summary or copyright policy, and the largest variants carry a systemic-risk
        Article 55 gap with no documentation - capping legal readiness at competent-with-caveats.

        '
      evidence_refs:
      - ev-license
      - ev-eu-gap
    safety:
      score: 3
      rationale: 'Instruct variants are safety-tuned and withstand casual jailbreaks,
        but tuning is lighter than Western frontier labs, there is no companion guard
        model, and the models exhibit China-aligned topic censorship - a behavioural
        quirk to account for. Deploy behind your own guards.

        '
      evidence_refs:
      - ev-safety
      - ev-behaviour
    performance:
      score: 4
      rationale: 'Strong general capability and especially strong coding: Qwen3-Coder
        is among the best open coding models on independent evaluation. Not marked
        5 for the family because leadership is domain-concentrated (coding/agentic)
        rather than uniform, and the results are third-party framed.

        '
      evidence_refs:
      - ev-perf-coding
    operational:
      score: 5
      rationale: 'First-class ecosystem support: dual distribution on Hugging Face
        and ModelScope, broad serving support (vLLM, llama.cpp, Ollama, TGI, MLX),
        a very wide size range from laptop to datacentre, and abundant community quantizations.
        Day-0 availability across the stack.

        '
      evidence_refs:
      - ev-qwen-hf
      - ev-ecosystem
    governance:
      score: 3
      rationale: 'Active, accountable publisher (Alibaba Qwen team) with a rapid release
        cadence and a verified presence on two hubs, but no documented vulnerability-disclosure
        or deprecation policy and no Code of Practice signature.

        '
      evidence_refs:
      - ev-qwen-hf
      - ev-eu-gap

# --- Assessed signals: five cross-cutting attributes highlighted at the top of the entry
#     (like the EU AI Act flag). Not a scoring input - each ties back to one of the seven
#     AOI dimensions and summarises documentation that lives in the four domains.
signals:
  trainability:
    level: partial
    dimension: openness
    summary: "Fine-tune freely under Apache-2.0 on the mainstream sizes, but training data and code are closed, so you can adapt the weights without reproducing training; verify each checkpoint's LICENSE."
    refs: [ev-license, ev-qwen-hf]
  knowledge_structure:
    level: moderate
    dimension: performance
    summary: "Capable long-context (up to 128k) knowledge and coding backbone, but China-aligned topic censorship distorts coverage on politically sensitive subjects."
    refs: [ev-perf-coding, ev-behaviour]
  specialization:
    level: strong
    dimension: openness
    summary: "Excellent for specialisation: an unusually wide size ladder (0.5B-480B, including a top open coder) under Apache-2.0 for fine-tuning and distillation."
    refs: [ev-qwen-hf, ev-perf-coding]
  exchangeability:
    level: high
    dimension: operational
    summary: "Highly portable: safetensors across vLLM/llama.cpp/Ollama/TGI/MLX behind OpenAI-compatible serving; mind the Qwen3 chat template and thinking-mode format when swapping."
    refs: [ev-ecosystem, ev-qwen-hf]
  misuse_exposure:
    level: unbenchmarked
    dimension: safety
    summary: "Not independently benchmarked for misuse: safety tuning is lighter than Western frontier labs with no companion guard model, and no broad third-party red-team exists."
    refs: [ev-safety, ev-behaviour]

