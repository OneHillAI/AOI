ownership:
  level: partial
  factors:
    use_modify:
      level: strong
      rationale: "The licence is per-checkpoint rather than a single grant across the family: mainstream Qwen3 (0.6B, 32B, 235B-A22B, Coder-480B-A35B-Instruct) is Apache-2.0 with unconditional commercial use and no MAU clause, but the legacy/large Tongyi Qianwen checkpoints (Qwen-72B, Qwen2.5-72B-Instruct) carry a >100M-monthly-active-user licence trigger, a 'Built with Qwen' attribution requirement and export controls - check the LICENSE file on the exact checkpoint before you rely on Apache terms."
      # grounded in: ev-license (license, retrieved) - apache-2.0 verified across four Qwen3 checkpoints, no MAU clause; ev-license-tongyi (license, retrieved) - Sec 4 MAU>100M + Sec 5 attribution/export read verbatim on Qwen2.5-72B-Instruct
    transparency:
      level: weak
      rationale: "You hold the weights but cannot inspect what is in them: training data and code are closed and China-aligned topic censorship is baked into behaviour, so sensitive-topic coverage is distorted in ways you cannot audit. On the hosted path, Alibaba's Model Studio FAQ grounds a no-training commitment ('never uses your data for model training'), while the binding specifics (exact retention, region and opt-out) sit in the formal Model Studio Service Agreement."
      # grounded in: ev-behaviour (third_party) - censorship; ev-modelstudio-faq (docs, retrieved) - hosted no-training commitment; ev-terms (terms, not retrieved) - formal Service Agreement specifics unread
    reliability:
      level: moderate
      rationale: "Runs dependably with 128K context and documented thinking modes, but safety tuning is lighter than Western frontier labs, with no companion guard model, so you supply that layer."
      # grounded in: ev-perf-coding (third_party) - class-leading open coding; ev-tech-report (technical_report, retrieved) - Qwen3 report, modes and multilingual coverage
    data_control:
      level: strong
      rationale: "Self-hosted, the Apache-licensed weights run on your own infrastructure with no clawback or telemetry, so your data stays yours. On Alibaba's hosted Qwen, the Model Studio FAQ grounds a no-training commitment ('never uses your data for model training'; call data stored, encrypted with AES-256 in transit), and the general privacy policy documents Singapore storage, SCC/DPF cross-border transfers and 'ongoing legitimate business need' retention; the binding specifics (exact retention, region, opt-out) sit in the formal Model Studio Service Agreement."
      # grounded in: self-hosting (structural); ev-modelstudio-faq (docs, retrieved) - hosted no-training + AES-256 in transit; ev-privacy (privacy_policy, retrieved) - Singapore storage, SCC/DPF transfers, retention; ev-terms (terms, not retrieved) - formal Service Agreement specifics unread
  verdict: "You partly own Qwen: the Apache-licensed mainstream Qwen3 sizes are yours to run, modify and self-host, they perform strongly (especially coding), and self-hosted your data stays on your infrastructure. Two things cap it at partial. First the licence is per-checkpoint - Apache-2.0 on mainstream Qwen3, but the legacy/large Tongyi Qianwen checkpoints (Qwen-72B, Qwen2.5-72B-Instruct) carry a >100M-MAU trigger and 'Built with Qwen' attribution - so verify the LICENSE on the exact checkpoint. Second, transparency: China-aligned censorship is baked in and training is closed; the hosted path carries a grounded no-training commitment (Model Studio FAQ) alongside the Singapore-storage/SCC-DPF/retention privacy policy, and the formal Model Studio Service Agreement holds the binding specifics (exact retention, region, opt-out). Adopt with hard limits: keep politically sensitive and regulated workloads off it, confirm the per-checkpoint licence, and if you place a systemic-risk-scale variant on the EU market, close the Article 55 gap yourself."

# --- Evidence. Each item carries `doc_type` (which kind of primary document) and `retrieved`
#     (true = the document's substantive text was read; false = known to exist but not read).
#     Grounded 2026-07-25 against the primary-source clauses in
#     docs/primary-sources/qwen/_sources.md. The licence is per-checkpoint: mainstream Qwen3
#     (0.6B/32B/235B-A22B/Coder-480B) is Apache-2.0 (ev-license), while legacy/large Tongyi
#     Qianwen checkpoints (Qwen-72B, Qwen2.5-72B-Instruct) carry an MAU>100M clause
#     (ev-license-tongyi). The hosted-service posture is grounded via the Model Studio FAQ
#     (ev-modelstudio-faq, retrieved) - a no-training commitment plus AES-256-in-transit - and
#     the GENERAL Alibaba Cloud privacy policy (ev-privacy); only the formal Model Studio
#     Service Agreement specifics (retention/region/opt-out) remain unread (ev-terms,
#     retrieved:false).
evidence:
- id: ev-qwen-hf
  claim: Qwen3 checkpoints are hosted on the verified Qwen org on Hugging Face in
    safetensors with checksums.
  source_type: publisher
  doc_type: model_card
  retrieved: true
  url: https://huggingface.co/Qwen
  date: '2026-07-25'
- id: ev-license
  claim: 'Mainstream Qwen3 checkpoints are released under Apache-2.0 with unconditional
    commercial use and NO monthly-active-user clause - metadata verified across four
    checkpoints (Qwen3-0.6B, Qwen3-32B, Qwen3-235B-A22B, Qwen3-Coder-480B-A35B-Instruct),
    each displaying "License: apache-2.0".'
  source_type: publisher
  doc_type: license
  retrieved: true
  url: https://huggingface.co/Qwen/Qwen3-235B-A22B
  date: '2026-07-25'
- id: ev-license-tongyi
  claim: 'Legacy/large Tongyi Qianwen checkpoints (Qwen-72B, Qwen2.5-72B-Instruct)
    are NOT Apache-2.0 - the Tongyi Qianwen community licence, read verbatim: Sec 4
    "If you are commercially using the Materials, and your product or service has more
    than 100 million monthly active users, you shall request a license from us"; Sec
    5.b "Built with Qwen"/"Improved using Qwen" attribution; Sec 5.a export controls
    (China/US/other).'
  source_type: publisher
  doc_type: license
  retrieved: true
  url: https://huggingface.co/Qwen/Qwen2.5-72B-Instruct/raw/main/LICENSE
  date: '2026-07-25'
- id: ev-tech-report
  claim: 'Qwen3 Technical Report (arXiv 2505.09388): documents the Qwen3 family,
    thinking/non-thinking modes, thinking budget, and multilingual coverage (~119
    languages).'
  source_type: publisher
  doc_type: technical_report
  retrieved: true
  url: https://arxiv.org/abs/2505.09388
  date: '2026-07-25'
- id: ev-privacy
  claim: 'General Alibaba Cloud International Website Privacy Policy, read: retention
    tied to "ongoing legitimate business need" (Sec F); cross-border transfers under
    SCCs (GDPR Art. 46) and the EU-US/UK/Swiss Data Privacy Framework (Sec D); "Your
    personal data will be stored in Singapore" (Philippines addendum). This general
    policy is SILENT on AI training.'
  source_type: publisher
  doc_type: privacy_policy
  retrieved: true
  url: https://www.alibabacloud.com/help/en/legal/latest/alibaba-cloud-international-website-privacy-policy
