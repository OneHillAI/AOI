ownership:
  level: partial
  factors:
    use_modify:
      level: moderate
      rationale: "Open weights, but on Meta's terms - an access gate, the Community License's 'Built with Llama' naming and the verbatim 700M-MAU commercial-licence trigger, and no licence for multimodal Llama 4 to EU-domiciled entities (a restriction the AUP carries for 3.2/3.3 too, but not 3.1); these are real conditions rather than a clean grant."
      # grounded in: ev1 (license, retrieved), ev-aup (terms, retrieved) - 700M-MAU + EU-multimodal clauses read verbatim via Meta's GitHub mirror
    transparency:
      level: moderate
      rationale: "You can inspect and self-guard the weights, and Meta publishes safety evaluations plus Llama Guard and Prompt Guard, but training data and code are closed and no broad independent red-team spans every harm domain: you see the finished model while its training stays hidden."
      # grounded in: ev3, ev6 (model_card); training data/code closed (structural)
    reliability:
      level: strong
      rationale: "Runs dependably on the largest fine-tuning and serving ecosystem of any open family, with documented safety tuning and an available companion guard model, so misuse is controllable off the shelf."
      # grounded in: ev4 (third_party leaderboard), ev6 (model_card)
    data_control:
      level: strong
      rationale: "Self-hosted, the weights run on your own infrastructure - the Community License adds naming and scale conditions but no telemetry or data clawback, so your data stays yours."
      # grounded in: self-hosting (structural); ev1 (license) - no clawback/telemetry clause
  verdict: "You own the self-hosted Llama weights in practice: they run on your infrastructure, perform at the top of the open field, and pair with Meta's Llama Guard and Prompt Guard. But overall ownership is only partial: the Community License is not a clean grant - an access gate, 'Built with Llama' attribution, a 700M-MAU commercial trigger, and no multimodal licence for EU-domiciled entities mean you cannot freely use and modify the whole family the way an OSI licence allows, and training is closed. Clear those conditions first: check the MAU trigger, honour the attribution terms, and if you are EU-domiciled avoid the multimodal variants entirely."

# --- Evidence. Each item carries `doc_type` (which kind of primary document) and `retrieved`
#     (true = the document's substantive text was read; false = known to exist but not read).
#     Grounded 2026-07-25 against the primary-source clauses in
#     docs/primary-sources/meta-llama/_sources.md. llama.com is JS-rendered, so the LICENSE and
#     AUP text was read verbatim from Meta's canonical GitHub mirror (meta-llama/llama-models);
#     the Hugging Face model cards were obtained via the fetch summariser (HF not raw-reachable).
evidence:
- id: ev1
  claim: 'Llama 4 Community License, read verbatim: the "Additional Commercial Terms"
    700M-MAU threshold ("greater than 700 million monthly active users in the preceding
    calendar month, you must request a license from Meta"), the "Built with Llama" attribution
    clause, California governing law, and - in the incorporated AUP - the EU multimodal
    restriction denying the licence to individuals domiciled in, or companies with a principal
    place of business in, the European Union.'
  source_type: publisher
  doc_type: license
  retrieved: true
  url: https://www.llama.com/llama4/license/
  date: '2026-07-25'
- id: ev-aup
  claim: 'Llama 4 Acceptable Use Policy, read verbatim: six prohibited-use categories
    (illegality/rights infringement; death or bodily harm incl. military/weapons/critical
    infrastructure; deception/fraud/impersonation; failure to disclose known AI dangers;
    generating third-party unlawful tooling), the EU multimodal restriction, and the
    LlamaUseReport@meta.com reporting path. The 3.1 AUP omits the EU clause; 3.2/3.3 carry it.'
  source_type: publisher
  doc_type: terms
  retrieved: true
  url: https://www.llama.com/llama4/use-policy/
  date: '2026-07-25'
- id: ev2
  claim: Llama family variants, EU multimodal licensing restriction, ecosystem/cloud
    availability, and Meta declining the EU GPAI Code of Practice.
  source_type: third_party
  doc_type: third_party
  retrieved: true
  url: https://en.wikipedia.org/wiki/Llama_(language_model)
  date: '2026-07-25'
- id: ev3
