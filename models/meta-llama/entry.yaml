schema_version: '2.0'
id: meta-llama
name: Meta Llama (Llama 3.x / Llama 4)
aliases:
- Llama
- Llama 3.1
- Llama 3.3
- Llama 4
family:
  id: meta-llama
  name: Meta Llama
publisher:
  name: Meta Platforms, Inc.
  country: US
  accountable_entity: true
  url: https://www.llama.com/
  security_contact: https://www.llama.com/responsible-use-guide/
summary: 'Meta''s Llama family is the most widely adopted open-weight LLM lineage,
  spanning dense Llama 3.1 (8B/70B/405B, 128K context) and Llama 3.3 70B. THIS entry is
  the Llama 3.x TEXT line, shipped alongside the companion Llama Guard and Prompt Guard
  safety classifiers; the natively multimodal Llama 4 mixture-of-experts models (Scout,
  Maverick, Behemoth) are the separate llama-4 entry, because Llama 4''s licence carries an
  EU-domiciled multimodal carve-out the 3.x text models do not. Weights are downloadable
  but gated behind a click-through acceptance of the restrictive Llama Community License
  - which is not OSI-approved, imposes a 700M-monthly-active-user threshold, an Acceptable
  Use Policy, and "Built with Llama" attribution. Llama 3.1 405B crosses the EU AI Act''s
  1e25-FLOP systemic-risk threshold, and Meta publicly declined to sign the EU GPAI
  Code of Practice - so the single most important thing for an adopter is that Llama
  is technically first-class and operationally trivial to run, but legally the most
  constrained "open" family in this class.

  '
variants:
- name: Llama 3.1 8B
  params_total: 8B
  context_window: 128K
  kind: instruct
  safety_tuned: true
- name: Llama 3.1 70B
  params_total: 70B
  context_window: 128K
  kind: instruct
  safety_tuned: true
- name: Llama 3.1 405B
  params_total: 405B
  context_window: 128K
  kind: instruct
  safety_tuned: true
- name: Llama 3.3 70B
  params_total: 70B
  context_window: 128K
  kind: instruct
  safety_tuned: true
- name: Llama Guard
  kind: guard
  safety_tuned: true
- name: Prompt Guard
  kind: guard
  safety_tuned: true
openness:
  tier: gated_open
  components:
    weights: open
    training_data: closed
    training_code: closed
    evaluation: partial
    documentation: open
    license: partial
  license:
    spdx: LicenseRef-Llama-Community
    name: Llama Community License
    classification: open_weight
    commercial_use: allowed_with_conditions
    notable_restrictions:
    - 700M monthly-active-users threshold requires a separate license from Meta
    - Acceptable Use Policy applies
    - '''Built with Llama'' attribution and naming requirements'
    - Multimodal Llama models are not licensed for EU-domiciled entities
    url: https://www.llama.com/llama4/license/
provenance:
  canonical_source: https://huggingface.co/meta-llama
  verified_org_on_primary_host: true
  formats:
  - safetensors
  integrity:
    checksums: true
    signed: false
    signing_tech: ''
    provenance_attestation: false
  mirrors_and_quants:
    acknowledged: true
    notable:
    - name: bartowski / unsloth (GGUF quantizations)
      trust: community
      note: popular local-inference quants rather than the canonical source
    - name: Served on Bedrock / Azure / Vertex / Together / Groq
      trust: provider
      note: hosted endpoints rather than the weight source
  checkpoint_checklist_score: 6
  scanner_result: {}
  incidents: []
eu_ai_act:
  is_gpai: true
  systemic_risk:
    designated: false
    training_flops_estimate: '>1e25 for Llama 3.1 405B and large Llama 4 models'
    over_1e25_threshold: true
    article_55_docs_available: partial
  open_source_exemption:
    license_qualifies: 'no'
    rationale: 'The Llama Community License is not a free-and-open-source license:
      it carries an Acceptable Use Policy, a 700M-MAU commercial threshold, attribution/naming
      terms, and a field-of-use restriction barring EU multimodal use - so it likely
      fails the Act''s "free and open-source" test for the Article 53 exemption. Independently,
      the largest Llama checkpoints exceed the 1e25-FLOP systemic-risk threshold,
      and systemic-risk models receive NO open-source exemption regardless of license,
      so the full Article 53 + 55 obligation set applies.

      '
  provider_package:
    technical_documentation: partial
    downstream_information: 'yes'
    copyright_policy: partial
    training_content_summary: partial
    code_of_practice_signatory: false
  deployer_notes: 'Meta publishes detailed model cards and safety evaluations (strong
    Annex-XII-style downstream information) but not a full Article 55 systemic-risk
    package, and publicly declined to sign the EU GPAI Code of Practice in 2025. A
    downstream EU deployer inherits a partial documentation set and must not use the
    multimodal variants at all; a fine-tuner placing a derivative on the EU market
    under its own name likely becomes a provider and must maintain its own Annex XI/XII
    docs.

    '
  last_assessed: '2026-07-25'
performance:
  note: Third-party framing only.
  class_position: Leader among open-weight generalist families on public leaderboards.
behaviour:
  refusals: Safety-tuned instruct variants refuse clearly-harmful requests; low over-refusal
    in general use.
  prompt_injection: Residual susceptibility like all current LLMs; treat retrieved/tool
    content as untrusted.
  failure_modes: Standard hallucination profile for its class; well documented in
    model cards.
safety:
  variant_assessed: Instruct + Llama Guard
  jailbreak_resistance: Withstands casual jailbreaks; deploy instruct + Llama Guard,
    never base.
  guard_model: Llama Guard and Prompt Guard shipped by the publisher.
deployment:
  ceiling_tier: T3
  ceiling_conditional: true
  hardware_notes: 8B runs on a single modern GPU; 70B needs multi-GPU or quantization;
    405B and large MoE need a serving cluster.
  serving_support:
  - vllm
  - llama.cpp
  - ollama
  - tgi
  - mlx
  controls_required:
  - Deploy the safety-tuned instruct variant, not base
  - Llama Guard input/output classification
  - Prompt-injection defences
  - Deterministic action-policy engine + kill switch for autonomous actions
score:
  rubric_version: '1.1'
  headline: 72.4
  grade: B
  hard_flags: []
  dimensions:
    openness:
      score: 3
      rationale: 'Gated-open tier: weights are downloadable and documentation is strong,
        but they sit behind a click-through gate and a restrictive community license,
        with training data and training code closed and evaluation only partial. The
        tier ceiling for gated-open is 3.

        '
      evidence_refs:
      - ev1
      - ev3
    provenance:
      score: 4
      rationale: 'Verified Meta org on Hugging Face, safetensors-only distribution,
        published checksums, clear canonical source, and no malicious-checkpoint incident
        on the canonical org (checklist ~6/8). Short of 5 only because weights are
        not cryptographically signed and there is no SLSA-style provenance attestation.

        '
      evidence_refs:
      - ev3
    legal:
      score: 2
      rationale: 'A restrictive, non-OSI community license with an MAU threshold,
        acceptable-use limits and an outright EU multimodal field-of-use ban; the
        largest models are systemic-risk (voiding any open-source exemption) with
        only a partial Article 55 package; and Meta declined the EU GPAI Code of Practice.
        These compound into a weak legal-readiness posture for a compliant EU deployment.

        '
      evidence_refs:
      - ev1
      - ev2
    safety:
      score: 4
      rationale: 'Safety-tuned instruct releases with published safety evaluations,
        a companion guard/classifier model (Llama Guard) and Prompt Guard, and documented
        residual risks - well above the score-3 anchor. Short of 5 without a published
        third-party red-team across all harm domains.

        '
      evidence_refs:
      - ev5
      - ev2
    performance:
      score: 4
      rationale: 'Consistently strong and competitive across reasoning, coding and
        instruction-following on public leaderboards, judged a leader among open-weight
        generalists. Capped at 4: performance is third-party framed on public
        leaderboards, with no independently reproduced benchmark.

        '
      evidence_refs:
      - ev4
    operational:
      score: 5
      rationale: 'First-class ecosystem support: day-0 availability across vLLM, llama.cpp,
        Ollama, TGI and MLX, official and community quantizations, long-context and
        tooling support, and hosted endpoints on every major cloud (Bedrock, Azure,
        Vertex, Together, Groq).

        '
      evidence_refs:
      - ev2
      - ev4
    governance:
      score: 4
      rationale: 'Reputable, legally accountable publisher with a predictable multi-generation
        release cadence, a Responsible Use Guide and a reporting path. Short of 5
        because there is no formal cryptographic vulnerability-disclosure/signing
        process and no published deprecation policy.

        '
      evidence_refs:
      - ev2
      - ev3

# --- Assessed signals: five cross-cutting attributes highlighted at the top of the entry
#     (like the EU AI Act flag). Not a scoring input - each ties back to one of the seven
#     AOI dimensions and summarises documentation that lives in the four domains.
signals:
  trainability:
    level: partial
    dimension: openness
    summary: "Fine-tune with full SFT/LoRA on the open weights; training data and code are closed, so training is not reproducible, and the Community License adds naming/attribution and 700M-MAU conditions."
    refs: [ev1, ev3]
  knowledge_structure:
    level: strong
    dimension: performance
    summary: "Strong knowledge/RAG backbone: 128K context, documented tool-calling and leading open-weight instruction-following support grounded, structured workflows."
    refs: [ev6, ev4]
  specialization:
    level: strong
    dimension: openness
    summary: "Strong for specialisation: open weights plus the largest fine-tuning/adapter ecosystem of any open family, though continued pre-training is limited by closed data and code."
    refs: [ev3, ev6]
  exchangeability:
    level: high
    dimension: operational
    summary: "Highly exchangeable: safetensors on every major runtime and cloud endpoint (Bedrock/Vertex/Together/Groq); mind the Llama-3 chat template and special tokens when swapping."
    refs: [ev6, ev2]
  misuse_exposure:
    level: partial
    dimension: safety
    summary: "Partially benchmarked: Meta publishes safety evaluations and ships Llama Guard + Prompt Guard companion classifiers, but there is no broad independent third-party red-team across all harm domains."
    refs: [ev5]
