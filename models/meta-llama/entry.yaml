ownership:
  level: partial
  factors:
    use_modify:
      level: moderate
      rationale: "Open weights, but on Meta's terms - an access gate, the Community License's 'Built with Llama' naming and the verbatim 700M-MAU commercial-licence trigger; these are real conditions rather than a clean grant. The EU-domicile restriction on multimodal models does not apply to these text-only 3.1 and 3.3 models (it sits in the Llama 3.2 and 3.3 AUPs and the Llama 4 licence; Llama 4 is the separate llama-4 entry)."
      # grounded in: ev1 (license, retrieved), ev-aup (terms, retrieved) - 700M-MAU clause read verbatim via Meta's GitHub mirror; ev-l3-license (license, retrieved - 3.1 and 3.3 licences)
    transparency:
      level: moderate
      rationale: "You can inspect and self-guard the weights, and Meta publishes safety evaluations plus Llama Guard and Prompt Guard, but training data and code are closed and no broad independent red-team spans every harm domain: you see the finished model while its training stays hidden."
      # grounded in: ev3, ev6 (model_card); training data/code closed (structural)
    reliability:
      level: strong
      rationale: "Runs dependably on the largest fine-tuning and serving ecosystem of any open family, with documented safety tuning and an available companion guard model, so misuse is controllable off the shelf."
      # grounded in: ev4 (third_party leaderboard), ev6 (model_card)
    data_control:
      level: strong
      rationale: "Self-hosted, the weights run on your own infrastructure - the Community License adds naming and scale conditions but no telemetry or data clawback, so your data stays yours."
      # grounded in: self-hosting (structural); ev1 (license) - no clawback/telemetry clause
  verdict: "You own the self-hosted Llama weights in practice: they run on your infrastructure, perform at the top of the open field, and pair with Meta's Llama Guard and Prompt Guard. But overall ownership is only partial: the Community License is not a clean grant - an access gate, 'Built with Llama' attribution, a 700M-MAU commercial trigger, mean you cannot freely use and modify these models the way an OSI licence allows, and training is closed. Clear those conditions first: check the MAU trigger and honour the attribution terms."

# --- Evidence. Each item carries `doc_type` (which kind of primary document) and `retrieved`
#     (true = the document's substantive text was read; false = known to exist but not read).
#     Grounded 2026-07-25 against the primary-source clauses in
#     docs/primary-sources/meta-llama/_sources.md. llama.com is JS-rendered, so the LICENSE and
#     AUP text was read verbatim from Meta's canonical GitHub mirror (meta-llama/llama-models);
#     the Hugging Face model cards were obtained via the fetch summariser (HF not raw-reachable).
evidence:
- id: ev1
  claim: 'Llama 4 Community License, read verbatim: the "Additional Commercial Terms"
    700M-MAU threshold ("greater than 700 million monthly active users in the preceding
    calendar month, you must request a license from Meta"), the "Built with Llama" attribution
    clause, California governing law, and - in the incorporated AUP - the EU multimodal
    restriction denying the licence to individuals domiciled in, or companies with a principal
    place of business in, the European Union. Re-read 2026-11-19 from Meta''s GitHub mirror and the
    live page (effective 5 April 2025, unchanged).'
  source_type: publisher
  doc_type: license
  retrieved: true
  url: https://dev.meta.ai/llama/llama4/license/
  date: '2026-11-19'
- id: ev-l3-license
  claim: 'Llama 3.1 (release date 23 July 2024) and Llama 3.3 (release date 6 December 2024) Community
    Licences, read verbatim 2026-11-19: Section 2 "Additional Commercial Terms" carries the same
    700M-MAU threshold ("greater than 700 million monthly active users in the preceding calendar
    month, you must request a license from Meta"), Section 1.b.i the same "Built with Llama" display and
    "Llama" model-name prefix, and neither licence body has an EU clause. The Llama 3.1 AUP has no EU
    clause; the 3.2 and 3.3 AUPs end with the multimodal EU paragraph (moot for text-only 3.3).'
  source_type: publisher
  doc_type: license
  retrieved: true
  url: https://github.com/meta-llama/llama-models/blob/main/models/llama3_3/LICENSE
