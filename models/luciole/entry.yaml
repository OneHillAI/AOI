# OneHill v2 MODEL library entry for Luciole 1.1 Instruct (LINAGORA / OpenLLM-France).
# Validated against schema/model.v2.schema.json.
#   scores    -> scripts/score.py --write        (AOI headline/grade)
#   meters    -> scripts/completeness.py --write  (per-domain completeness/originality)
#   prose     -> assess.md / implement.md / use.md / support.md (sections keyed <!-- item: KEY -->)
#
# Scope note: the entry id is `luciole`. The scored release is Luciole 1.1 Instruct in three sizes
# (23B, 8B, 1B), which share one licence declaration, one post-training dataset and one safety posture.
# Base, Thinking-1.1, KD-Math, Audio-1.0 and the ablation repos are separate releases listed as
# follow-ups in assess.md. Grounded against docs/primary-sources/luciole/ (see _sources.md). No OneHill
# evaluation has been run, so there is no onehill_verified evidence and every documentation item is
# aggregated or a gap.

schema_version: "2.0"
id: luciole
name: Luciole 1.1 Instruct (23B, 8B, 1B)
aliases:
- Luciole
- Luciole-23B-Instruct-1.1
- Luciole-8B-Instruct-1.1
- Luciole-1B-Instruct-1.1
- OpenLLM-France/Luciole-23B-Instruct-1.1
family:
  id: luciole
  name: Luciole
publisher:
  name: LINAGORA SAS, within the OpenLLM-France consortium
  country: FR
  accountable_entity: true
  url: https://openllm-france.fr/
  security_contact: contact@openllm-france.fr (given in the SECURITY.md of the training-code repository)
summary: "Luciole 1.1 Instruct is an Apache-2.0 French and English instruct model in three sizes, 23B, 8B and 1B, post-trained from LINAGORA's own Luciole base models. Training code, the pretraining corpus and the post-training data are public, which puts it at the open-weights-plus-recipe tier. The base was pretrained on about 4.9 trillion tokens of open-licensed text, a publisher claim. Most post-training data is output of Qwen3 and other open-weights models. No safety evaluation is published, no technical report exists, the Hugging Face organisation is unverified and the Instruct repos carry no LICENSE file."
variants:
- name: Luciole-23B-Instruct-1.1
  params_total: 23.2B
  context_window: 131k (base window; post-trained on 16,384-token sequences)
  kind: instruct
  safety_tuned: true
- name: Luciole-8B-Instruct-1.1
  params_total: 8.08B
  context_window: 131k (base window; post-trained on 16,384-token sequences)
  kind: instruct
  safety_tuned: true
- name: Luciole-1B-Instruct-1.1
  params_total: 1.32B
  context_window: 131k (base window; post-trained on 16,384-token sequences)
  kind: instruct
  safety_tuned: true
openness:
  tier: open_weights_recipe
  components:
    weights: open
    training_data: partial
    training_code: open
    evaluation: partial
    documentation: open
    license: open
  license:
    spdx: Apache-2.0
    name: Apache License 2.0 (declared in card metadata and the card licence section; no LICENSE file in the Instruct repos)
    classification: osi
    commercial_use: allowed
    notable_restrictions:
    - "The Instruct-1.1 repos contain no LICENSE file. The licence rests on the card front matter, a card licence section naming LINAGORA SAS as owner, and the GitHub NOTICE file."
    - "The Base repos ship a LICENSE.md that is the Apache-2.0 template with an unfilled copyright line."
    - "The post-training data was largely generated by Qwen3, Ministral-3 and other open-weights models. Their Hugging Face tags show Apache-2.0, and no output restriction was found."
    - "The training code is GPL-3.0, so a redistributed derivative of the code must stay GPL-3.0. The weights are not affected."
    url: https://huggingface.co/OpenLLM-France/Luciole-23B-Instruct-1.1
provenance:
  canonical_source: https://huggingface.co/OpenLLM-France/Luciole-23B-Instruct-1.1
  verified_org_on_primary_host: false
  formats:
  - safetensors
  - gguf
  integrity:
    checksums: true
    signed: false
    signing_tech: ''
    provenance_attestation: false
  mirrors_and_quants:
    acknowledged: true
    notable:
    - name: OpenLLM-France/Luciole-23B-Instruct-1.1-GGUF (BF16, Q8_0, Q5_K_M, Q4_K_M)
      trust: publisher
      note: official llama.cpp conversion from the same organisation, with a Modelfile for Ollama
    - name: OpenLLM-France/Luciole-23B-Instruct-1.1-FP8
      trust: publisher
      note: official compressed-tensors build made with LLM Compressor, for GPUs with native FP8
  checkpoint_checklist_score: 4
  scanner_result:
    scanner: Hugging Face repository scan
    result: scansDone true, filesWithIssues empty (23B Instruct repo)
  incidents: []
eu_ai_act:
  is_gpai: true
  systemic_risk:
    designated: false
    training_flops_estimate: about 6.8e23 FLOPs for the 23B base, from 6 x 23.2B parameters x 4.9T tokens (OneHill calculation from the base card figures)
    over_1e25_threshold: false
    article_55_docs_available: n/a
  open_source_exemption:
    license_qualifies: likely
    rationale: "Apache-2.0 is a free and open-source licence, and the weights, architecture and usage information are public. The exemption does not cover the copyright policy or the public training-content summary. The Instruct repos lack a LICENSE file."
  provider_package:
    technical_documentation: partial
    downstream_information: partial
    copyright_policy: partial
    training_content_summary: partial
    code_of_practice_signatory: unknown
  deployer_notes: "The base and post-training dataset cards list every source with its licence, and the base card gives compute, architecture and hyperparameters. This covers most of a training-content summary, though not in the AI Office template. The technical report is unpublished. The dataset cards describe robots.txt filtering and an opt-out form, but no separate copyright policy exists. Code of Practice signatory status is not stated. A fine-tuner who places a derivative on the EU market may become a provider for it. This is guidance, not legal advice."
  last_assessed: '2026-11-19'
performance: {}
behaviour: {}
safety: {}
deployment:
  ceiling_tier: T1
  ceiling_conditional: true
  hardware_notes: "The 23B bf16 weights are 46.4 GB. The official GGUF files are 14.5 GB (Q4_K_M), 16.7 GB (Q5_K_M), 24.7 GB (Q8_0) and 46.4 GB (BF16). The official FP8 build is 24.8 GB and needs a GPU with native FP8 (Hopper, Ada Lovelace or Blackwell). The 8B GGUF files run from 5.0 to 16.2 GB and the 1B files from 1.0 to 3.2 GB. The publisher gives no VRAM table, throughput or latency figures."
  serving_support:
  - vllm
  - ollama
  - llama.cpp
  - transformers
  controls_required:
  - Keep a human reading outputs for internal use (T1), because no safety evaluation is published
  - Run your own safety and misuse tests in each target language, since the post-training data is almost entirely English
  - Add input and output guardrails, since no guard model or acceptable-use policy ships
  - Test tool calling before relying on it, because the publisher marks it as work in progress
  - Pin the exact repo revision and verify the Hugging Face LFS hashes of the shards
  - Add the Apache-2.0 text and the LINAGORA SAS copyright notice to anything you redistribute
score:
  rubric_version: '1.1'
  headline: 51.2
  grade: D
  hard_flags: []
  dimensions:
    openness:
      score: 4
      rationale: "Weights, training and evaluation code, the pretraining corpus and the post-training data are public under Apache-2.0 for the weights, which fits the weights-plus-recipe anchor. It stops at 4 because three large English web subsets sit on a separate server, the dataset licence label covers sources under other licences, and no technical report exists."
      evidence_refs:
      - ev-card-instruct
      - ev-pretrain-data
      - ev-posttrain-data
      - ev-code-repo
      - ev-notice
    provenance:
      score: 2
      rationale: "Safetensors only, a clean Hugging Face scan, LFS hashes and one canonical source give about 4 of 8 checklist boxes. The score stays at 2 because the OpenLLM-France organisation is not verified on Hugging Face. Nothing is signed or attested, and no mirror policy exists."
      evidence_refs:
      - ev-hf-platform
      - ev-notice
    legal:
      score: 3
      rationale: "Apache-2.0 is declared and LINAGORA SAS is named as owner in the NOTICE file. The Instruct repos have no LICENSE file. The dataset cards list per-source licences, which supports a training-content summary. No technical report, copyright policy or Annex XI document exists, and the CC-BY-SA label sits over a CC BY-NC-SA source. Held at 3."
      evidence_refs:
      - ev-card-instruct
      - ev-licence-file
      - ev-notice
      - ev-pretrain-data
      - ev-report-absent
    safety:
      score: 1
      rationale: "The Instruct card has no safety section, no acceptable-use policy and no guard model. The post-training data includes 24K safety preference pairs in five languages, but no evaluation of their effect is published. RedTeachingBench is a misinformation test with no Luciole result. Held at 1."
      evidence_refs:
      - ev-card-instruct
      - ev-posttrain-data
      - ev-redteam
      - ev-card-thinking
    performance:
      score: 2
      rationale: "Publisher figures put the 23B second of five against 22B to 24B instruct models, at about 64 overall against about 67.5 for Mistral-Small-3.2, and first on ifeval and ifeval-fr. The comparison set is the publisher's choice and no independent run exists. The score stays at 2."
      evidence_refs:
      - ev-bench
      - ev-card-instruct
    operational:
      score: 3
      rationale: "vLLM, Ollama and llama.cpp routes are documented, with official GGUF and FP8 builds. The 23B uses the native Nemotron class in transformers and ships no repository code. No hardware table is published and no hosted provider lists it. The 8B needs repository code for its hybrid architecture."
      evidence_refs:
      - ev-card-instruct
      - ev-hf-platform
      - ev-siblings
    governance:
      score: 3
      rationale: "LINAGORA SAS is a named company, the project has Bpifrance funding and GENCI compute, and releases came in February, July, September, October and November 2026. A SECURITY.md covers the code repository. The funding runs two years, no deprecation policy exists and the model repos have no security process of their own."
      evidence_refs:
      - ev-notice
      - ev-code-repo
      - ev-website
      - ev-hf-platform

# --- Assessed signals.
signals:
  trainability:
    level: partial
    dimension: openness
    summary: "Apache-2.0 weights, GPL-3.0 training code and public pretraining and post-training data support retraining and fine-tuning. Three English web subsets are on a separate server and the recipes target the Jean Zay cluster, so a full rebuild is unproven."
    refs: [ev-card-base, ev-pretrain-data, ev-posttrain-data, ev-code-repo]
  knowledge_structure:
    level: moderate
    dimension: performance
    summary: "The base window is 131k tokens but post-training used 16,384-token sequences. RAG data is in the post-training mix, tool calling is marked work in progress, and the card advises a RAG pipeline for knowledge."
    refs: [ev-card-instruct, ev-posttrain-data]
  specialization:
    level: strong
    dimension: openness
    summary: "The card recommends further training for specific use cases. A base model, the post-training recipe folders and both datasets are public under permissive terms."
    refs: [ev-card-instruct, ev-card-base, ev-code-repo]
  exchangeability:
    level: high
    dimension: operational
    summary: "The 23B and 1B use the native Nemotron class with a ChatML-style template, official GGUF and FP8 builds, and documented vLLM and Ollama routes. The 8B hybrid needs repository code."
    refs: [ev-card-instruct, ev-hf-platform, ev-siblings]
  misuse_exposure:
    level: unbenchmarked
    dimension: safety
    summary: "Safety preference data was used in post-training, but the Instruct card makes no safety claim and no safety evaluation, jailbreak test or guard model is published."
    refs: [ev-card-instruct, ev-posttrain-data, ev-redteam]

