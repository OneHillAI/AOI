ownership:
  level: partial
  factors:
    use_modify:
      level: strong
      rationale: "Apache-2.0 is declared for the Instruct weights, which are ungated and fine-tunable, with commercial use allowed. The Instruct repos have no LICENSE file, and LINAGORA SAS is named as owner in the NOTICE file (ev-card-instruct, ev-notice)."
    transparency:
      level: strong
      rationale: "Weights, training and evaluation code, the pretraining corpus and the post-training data are public, and the cards are detailed. Gaps are the unpublished technical report and the external server for three web subsets (ev-pretrain-data, ev-posttrain-data, ev-code-repo)."
    reliability:
      level: weak
      rationale: "Operational readiness is 3, and safety is 1 because no safety evaluation, guard model or acceptable-use policy is published. The Thinking card states that safety alignment can still leave unsafe output (ev-card-instruct, ev-card-thinking)."
    data_control:
      level: strong
      rationale: "The weights run on your own hardware under Apache-2.0 with no clawback clause. The 23B repo ships only safetensors, tokenizer and configuration files, with no loader code (ev-card-instruct, ev-hf-platform)."
  verdict: "You own the use of the weights. Apache-2.0 is declared, the repos are ungated and your data stays on your hardware. Training code and both datasets are public, so most of what the model is can be inspected. You cannot rely on its safety, because no safety evaluation or guard model exists. The level rises when a safety evaluation, a LICENSE file in the Instruct repos and a technical report are published."

evidence:
- id: ev-card-instruct
  claim: "The 23B Instruct card declares Apache-2.0 and names LINAGORA SAS as copyright holder. It states three post-training phases (SFT with thinking, SFT without, DPO), post-training almost entirely in English on 16,384-token sequences, and 'Technical report: coming soon'. It has no safety section and no acceptable-use policy. The 8B and 1B cards match it."
  source_type: publisher
  doc_type: model_card
  retrieved: true
  url: https://huggingface.co/OpenLLM-France/Luciole-23B-Instruct-1.1
  date: '2026-11-19'
- id: ev-card-thinking
  claim: "The Thinking-1.1 card opens with a note that the model 'has undergone safety alignment during the DPO thinking phase' and can still produce unsafe output. It also reports over-refusal of tool calls and no identity training. This is a sibling release with a different safety statement."
  source_type: publisher
  doc_type: model_card
  retrieved: true
  url: https://huggingface.co/OpenLLM-France/Luciole-23B-Thinking-1.1
  date: '2026-11-19'
- id: ev-card-base
  claim: "The Luciole-23B-Base card declares Apache-2.0 and lists French, English, Italian, German, Spanish, Portuguese, Dutch and Arabic with token shares. It reports about 4.9 trillion tokens, 576,587 H100 GPU hours on Jean Zay, a Nemotron3-22B-recipe architecture and an initialiser range. It names no parent checkpoint and does not say 'from scratch'."
  source_type: publisher
  doc_type: model_card
  retrieved: true
  url: https://huggingface.co/OpenLLM-France/Luciole-23B-Base
  date: '2026-11-19'
- id: ev-licence-file
  claim: "The Base repos contain a LICENSE.md holding the full Apache License 2.0 text with the template front matter and an unfilled 'Copyright [yyyy] [name of copyright owner]' line. The Instruct-1.1, Thinking-1.1, GGUF, FP8, KD-Math and Audio repos contain no LICENSE file."
  source_type: publisher
  doc_type: license
  retrieved: true
  url: https://huggingface.co/OpenLLM-France/Luciole-23B-Base/raw/main/LICENSE.md
  date: '2026-11-19'
- id: ev-notice
  claim: "The NOTICE file of the Luciole-Training repository says the Luciole models, including Instruct-1.1 in all three sizes, are the property of LINAGORA SAS and released under Apache-2.0. It says the post-training dataset is jointly owned by LINAGORA SAS and OPINIONSCIENCE SAS under CC-BY-SA-4.0, and that the code is GPL-3.0."
