ownership:
  level: partial
  factors:
    use_modify:
      level: strong
      rationale: "Apache-2.0 is declared on the cards for base and instruct, ungated, with weights downloadable and the base recommended for fine-tuning; caveat: no LICENSE file ships and the Gemma Terms question on synthetic SFT data is open (ev-licence, ev-gemma-terms)."
    transparency:
      level: moderate
      rationale: "Open weights with a detailed paper, but the corpus, SFT corpus, configs and evaluation harness are not released, and the machine-translation and synthetic-data generators are unnamed (ev-paper, ev-trainer)."
    reliability:
      level: weak
      rationale: "Operational readiness is 2 (publisher code or llama.cpp GGUF only) and safety is 2 (publisher-only, model-judged evaluation, 41% of benign requests failed). The paper says the instruct model is not an assistant (ev-card-instruct, ev-paper)."
    data_control:
      level: strong
      rationale: "Self-hosted weights under a declared Apache-2.0 licence with no clawback clause. An outline read of the loader code found no network calls (ev-licence, ev-trainer)."
  verdict: "You own the use of the weights: Apache-2.0 is declared, ungated and commercial use is stated, and your data stays on your hardware. You do not own a finished assistant. The paper says the instruct model is not one, it cannot be rebuilt without the unreleased corpus and configs, and the evaluations are the publisher's own. The level rises if Vambo ships a LICENSE file, releases its corpus and harness, and clears the Gemma Terms question on the SFT data."

evidence:
- id: ev-card-instruct
  claim: "The instruct card declares Apache-2.0, names twelve languages, and gives 1.485B parameters and a 4,096-token context. It says the model was trained from scratch (a publisher claim). Every headline number is the publisher's own. The card states that every safety number is one model (gemma-3-12b-it) judging another, that 41% of benign requests are not answered well, and that the training corpus is not released. The repo files include safetensors, modeling_morena.py and SHA256SUMS."
  source_type: publisher
  doc_type: model_card
  retrieved: true
  url: https://huggingface.co/vamboai/morena-1.5b-instruct
  date: '2026-11-19'
- id: ev-card-base
  claim: "The base card describes a base checkpoint beside the instruct one (vamboai/morena-1.5b-base) with the same Apache-2.0 declaration. It says 'This is not a chat model' and 'No safety evaluation applies to this checkpoint', recommends the base as the starting point for fine-tuning, and gives 12,661 A100 GPU-hours."
  source_type: publisher
  doc_type: model_card
  retrieved: true
  url: https://huggingface.co/vamboai/morena-1.5b-base
  date: '2026-11-19'
- id: ev-licence
  claim: "Every MORENA repo declares Apache-2.0 in the front matter and the card 'Licence' section ('Commercial use is permitted, including fine-tuning and redistributing derivatives'). No LICENSE, NOTICE or copyright-holder file exists (raw LICENSE returns 404 for instruct and base). The licence wording was removed on 2026-09-17 and restored on 2026-09-18. The repos are ungated."
  source_type: publisher
  doc_type: license
  retrieved: true
  url: https://huggingface.co/vamboai/morena-1.5b-instruct
  date: '2026-11-19'
- id: ev-apache-text
  claim: "Canonical Apache License 2.0 text, the licence the MORENA declaration points to: section 2 grants copyright, section 3 grants patent rights, and section 4 governs redistribution and requires passing on a copy of the licence."
  source_type: third_party
  doc_type: license
  retrieved: true
  url: https://www.apache.org/licenses/LICENSE-2.0.txt
  date: '2026-11-19'
- id: ev-paper
  claim: "Paper 'MORENA: An African Foundation Model' (23 pages, 18 September 2026, single author). It states 'trained from scratch, with its own tokenizer and data mixture' and names pretraining sources with a per-source mixture table. English FineWeb-Edu was machine-translated into nine languages by an unnamed system. The SFT corpus is 'mostly synthetic', generated by 'Gemma-family and GPT-OSS-120b models'. The 3,341-prompt safety evaluation is judged by gemma-3-12b-it. Training took 12,834 A100 GPU-hours on CINECA Leonardo. The paper lists five harness defects and promises the corpus 'once the legal review is complete'. Mini and nano are pruned and distilled from the 1.5B base."
  source_type: publisher
