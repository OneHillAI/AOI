# OneHill v2 MODEL library entry for MORENA 1.5B (Vambo AI).
# Validated against schema/model.v2.schema.json.
#   scores    -> scripts/score.py --write        (AOI headline/grade)
#   meters    -> scripts/completeness.py --write  (per-domain completeness/originality)
#   prose     -> assess.md / implement.md / use.md / support.md (sections keyed <!-- item: KEY -->)
# Grounded 2026-11-19 against docs/primary-sources/morena/ (see _sources.md). No OneHill evaluation
# has been run, so there is no onehill_verified evidence and every documentation item is aggregated or a gap.

schema_version: "2.0"
id: morena
name: MORENA 1.5B (base and instruct)
aliases:
- MORENA
- MORENA 1.5B
- morena-1.5b-instruct
- morena-1.5b-base
- vamboai/morena-1.5b-instruct
family:
  id: morena
  name: MORENA
publisher:
  name: Vambo Technologies (Pty) Ltd, trading as Vambo AI
  country: South Africa
  accountable_entity: true
  url: https://vambo.ai/
  security_contact: none published
summary: "MORENA 1.5B is a small Apache-2.0 base and instruct pair for twelve African languages, best adopted as a fine-tuning starting point and not as a finished assistant. The publisher says it trained the 1.485B-parameter decoder from scratch (a publisher claim, repeated on the cards and in its paper). The model covers Shona, Swahili, Hausa, Yoruba, Igbo, isiZulu, isiXhosa, Kinyarwanda, Setswana, Afrikaans, isiNdebele and Nigerian Pidgin, plus English, French and code, with a 4,096-token context. Weights, tokenizer and a trainer file are public. The corpus, the SFT corpus, the training configs and the evaluation harness are not. Every benchmark and safety number is the publisher's own, and one model (gemma-3-12b-it) judges safety. The instruct model fails 41% of ordinary benign requests. The weights run only through publisher-written PyTorch code or an official GGUF, the repos have no LICENSE file, and the Hugging Face organisation is unverified."
variants:
- name: MORENA 1.5B base
  params_total: 1.485B
  context_window: 4k
  kind: base
  safety_tuned: false
- name: MORENA 1.5B instruct
  params_total: 1.485B
  context_window: 4k
  kind: instruct
  safety_tuned: true
openness:
  tier: open_weights
  components:
    weights: open
    training_data: partial
    training_code: partial
    evaluation: partial
    documentation: open
    license: open
  license:
    spdx: Apache-2.0
    name: Apache License 2.0 (declared in card metadata and card text; no LICENSE file in the repos)
    classification: osi
    commercial_use: allowed
    notable_restrictions:
    - "No LICENSE, NOTICE or copyright-holder file ships with the weights; the licence is declared only in the Hugging Face metadata and card text."
    - "Unresolved upstream question: the SFT data was synthetic output of Gemma-family models, and the Gemma Terms of Use can attach their use restrictions to models trained on such output (see ev-gemma-terms)."
    url: https://huggingface.co/vamboai/morena-1.5b-instruct
provenance:
  canonical_source: https://huggingface.co/vamboai
  verified_org_on_primary_host: false
  formats:
  - safetensors
  - gguf
  integrity:
    checksums: true
    signed: false
    signing_tech: ''
    provenance_attestation: false
  mirrors_and_quants:
    acknowledged: true
    notable:
    - name: vamboai/morena-1.5b-instruct-gguf (Q4_K_M, Q8_0, f16)
      trust: publisher
      note: official GGUF conversion from the same org; the publisher says it was checked for logit equivalence, and OneHill has not repeated the check
  checkpoint_checklist_score: 4
  scanner_result:
    scanner: Hugging Face repository scan
    result: scansDone true, filesWithIssues empty (instruct and GGUF repos)
  incidents: []
eu_ai_act:
  is_gpai: true
  systemic_risk:
    designated: false
    training_flops_estimate: about 2.8e21 FLOPs by the publisher's own 6 x parameters x tokens figure (paper p6)
    over_1e25_threshold: false
    article_55_docs_available: n/a
  open_source_exemption:
    license_qualifies: uncertain
    rationale: "Apache-2.0 is a free and open-source licence and the parameters, architecture and usage information are public, so the Article 53 exemption would normally be plausible. It is marked uncertain for three reasons. No licence text ships with the weights. The publisher sells services around its own models, though monetisation of the weights themselves is not evidenced. The unresolved Gemma Terms question could attach use restrictions to the instruct model. The exemption does not cover the copyright policy or the public training-content summary, and neither exists as a standalone document."
  provider_package:
    technical_documentation: partial
    downstream_information: partial
    copyright_policy: 'no'
    training_content_summary: partial
    code_of_practice_signatory: false
  deployer_notes: "The paper and cards give architecture, compute, a per-source mixture table and named sources, which helps a deployer assemble technical documentation. They do not name the machine-translation system behind 57.1B tokens or the generator behind the 1.1B synthetic mid-training tokens, and the corpus is promised only 'once the legal review is complete'. No document states code-of-practice signatory status, and the Commission list has not been checked. A fine-tuner placing a derivative on the EU market may become a provider for it."
  last_assessed: '2026-11-19'
performance: {}
behaviour: {}
safety: {}
deployment:
  ceiling_tier: T1
  ceiling_conditional: true
  hardware_notes: "bf16 weights are 2.97 GB; the official GGUF files are 0.92 GB (Q4_K_M), 1.58 GB (Q8_0) and 2.97 GB (f16), and the paper says the GGUF builds run on a laptop CPU offline (publisher statement, untested). The paper measured 4.44 ms per character on one A100, on the previous instruct version, which has the same architecture. No VRAM table is published. The 4,096-token context keeps KV-cache memory small."
  serving_support:
  - llama.cpp
  - pytorch-reference-code
  controls_required:
  - Treat the instruct model as a research and fine-tuning artefact; keep a human reading every output (T1)
  - Run your own native-speaker safety and quality evaluation per target language before any wider use
  - Expect and handle refusals, since the publisher reports 41% of ordinary benign requests are not answered well
  - Pin the exact repo revision and verify SHA256SUMS yourself, including the large weights file
  - Review and sandbox modeling_morena.py before running it, because the weights load only through that file
  - Add your own input and output guardrails, since no companion guard model or acceptable-use policy ships
score:
  rubric_version: '1.1'
  headline: 46.8
  grade: D
  hard_flags: []
  dimensions:
    openness:
      score: 3
      rationale: "Open weights, a detailed paper and cards, and an Apache-2.0 declaration put it at the open-weights anchor. It is short of 4 because the corpus and the SFT corpus are not released, the training configs, TRAIN_README, data pipeline and evaluation harness are absent, and the card does not mention the trainer file. Training data is partial: sources and per-source shares are named, but the machine-translation system and synthetic-data generators are not. Training code is partial: a full trainer script without a runnable recipe. Evaluation is partial: results and methods without a harness."
      evidence_refs:
      - ev-card-instruct
      - ev-paper
      - ev-trainer
      - ev-licence
    provenance:
      score: 2
      rationale: "Safetensors only, a published SHA256SUMS that matches the host's LFS hash for the weights, and a clean Hugging Face malware scan give about 4 of 8 checklist boxes. The score is 2 because the vamboai organisation is not verified on Hugging Face and has one member, nothing is signed or attested, and loading needs publisher-written Python (modeling_morena.py), with a stale 'preview weights' comment in load_example.py. Anchor 3 needs a verified publisher organisation."
      evidence_refs:
      - ev-hf-platform
      - ev-checksums
      - ev-trainer
    legal:
      score: 3
      rationale: "The declared licence is Apache-2.0 with commercial use stated and no gating, which is clear for common uses, and the paper documents mixture, compute and sources. The score is 3 and not 4 because there is no LICENSE file, no copyright policy or GPAI summary, the machine-translation and synthetic-data generators are unnamed, and the Gemma Terms question on the SFT data is unresolved. If it resolves against the publisher, the instruct model carries use restrictions that Apache-2.0 does not show."
      evidence_refs:
      - ev-licence
      - ev-apache-text
      - ev-paper
      - ev-gemma-terms
    safety:
      score: 2
      rationale: "The instruct model is safety-tuned, and the publisher reports a 3,341-prompt, 13-language, 11-category evaluation that includes its residual risks (89.0% handled well, 41% of benign requests failed, Igbo 75%). The evaluation is publisher-only. One model (gemma-3-12b-it) wrote the prompts and judged the answers, no native speaker rated anything, no jailbreak or red-team test is described and no outside model was run through it. There is no acceptable-use policy or guard model. The base model has no safety tuning."
      evidence_refs:
      - ev-card-instruct
      - ev-paper
    performance:
      score: 2
      rationale: "The publisher reports the lowest African bits per byte of 26 models (1.408 base, 1.441 instruct) and 45.8 chrF++ into five African languages against 37.8 for MADLAD-400-3B. Into English it trails MADLAD-400-3B (48.7 against 53.6). Retrieval QA and African multiple choice are near chance, grounded generation is 23% faithful and MMLU is 0.284. Every number comes from the publisher's own harness, which it says had five defects, and no independent re-run exists. The rating is 2 until someone reproduces the results."
      evidence_refs:
      - ev-card-instruct
      - ev-paper
      - ev-press
    operational:
      score: 2
      rationale: "The only mainstream route is the publisher's GGUF on llama.cpp (Q4_K_M, Q8_0, f16; Hugging Face reads it as architecture llama with 4,096 context). The safetensors load only through publisher PyTorch code with no generate() and no KV cache. No document covers vLLM, Ollama, TGI or transformers support. Hardware guidance is file sizes and one latency figure, and no inference provider hosts the model."
      evidence_refs:
      - ev-card-instruct
      - ev-trainer
      - ev-hf-platform
    governance:
      score: 2
      rationale: "A named company (Vambo Technologies (Pty) Ltd) with named founders, a prior public dataset (Fikira, December 2025) and a post-release fix (tokenizer_config.json, 2026-10-14). The model track record is a single release batch, the paper has one author and the Hugging Face organisation is unverified. No security contact, vulnerability process, terms or deprecation policy is published, and the company site does not state a country or registration number."
      evidence_refs:
      - ev-vambo-site
      - ev-hf-platform
      - ev-fikira

# --- Assessed signals.
signals:
  trainability:
    level: partial
    dimension: openness
    summary: "Apache-2.0 base and instruct weights, a full trainer file and the publisher's advice to fine-tune the base support adaptation and continued pretraining. The corpus, configs and data pipeline are unreleased, so a from-scratch rebuild is not possible."
    refs: [ev-card-base, ev-trainer, ev-paper]
  knowledge_structure:
    level: weak
    dimension: performance
    summary: "A 4,096-token context, retrieval QA at 0.325 against a 0.25 floor, grounded generation faithful in 23% of cases and MMLU 0.284 make it a weak RAG or knowledge backbone, despite strong African-language modelling."
    refs: [ev-card-instruct, ev-paper]
  specialization:
    level: moderate
    dimension: openness
    summary: "A small base checkpoint with a purpose-built 65,536-entry tokenizer for twelve African languages and an Apache-2.0 licence suits specialisation, but no fine-tuning recipe, configs or adaptation results are published."
    refs: [ev-card-base, ev-paper]
  exchangeability:
    level: medium
    dimension: operational
    summary: "The official GGUF drops into llama.cpp. The safetensors need publisher-written code, the chat format uses reserved tokens not found in other models, and no vLLM, Ollama, TGI or transformers path is documented."
    refs: [ev-card-instruct, ev-trainer, ev-hf-platform]
  misuse_exposure:
    level: partial
    dimension: safety
    summary: "The publisher benchmarked refusals and harm handling on 3,341 prompts in 13 languages. One model wrote and judged them, no jailbreak or red-team test exists, and nothing independent confirms the result."
    refs: [ev-card-instruct, ev-paper]

