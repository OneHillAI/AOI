    - key: limitations
      title: Known limitations, bias & failure modes
      doc_type: reference
      source_type: aggregated
      coverage: full
      refs:
      - ev2
      - ev1
      summary: Lighter safety tuning, easier jailbreaks, and topic censorship aligned
        with Chinese content rules; China-origin governance consideration.
    - key: openness
      title: Openness tier & components
      doc_type: explanation
      source_type: aggregated
      coverage: full
      refs:
      - ev1
      - ev3
      summary: open_weights tier - MIT weights + open technical reports, but closed
        training data and only partial training code/evaluation.
    - key: license
      title: License terms & what you may do
      doc_type: reference
      source_type: aggregated
      coverage: full
      refs:
      - ev1
      summary: OSI-approved MIT - permissive, commercial use and distillation allowed;
        verify the license per checkpoint (some earlier releases were custom).
    - key: provenance
      title: Supply-chain provenance
      doc_type: reference
      source_type: aggregated
      coverage: full
      refs:
      - ev3
      - ev2
      summary: Verified deepseek-ai org, safetensors + checksums; many R1 distills
        are separate-trust artifacts; hosted app/API is a distinct, privacy-scrutinised
        service.
    - key: eu-ai-act
      title: EU AI Act posture
      doc_type: explanation
      source_type: aggregated
      coverage: full
      refs:
      - ev1
      - ev2
      summary: GPAI; V3/R1 very likely systemic-risk (>1e25 FLOP) so the open-source
        exemption is VOID and no Article 55 package is supplied - a real compliance gap.
    - key: evaluation
      title: Benchmarks & evaluation
      doc_type: reference
      source_type: aggregated
      coverage: full
      refs:
      - ev4
      summary: Strong reasoning (R1) and competitive V3 on public leaderboards; third-party
        framing only, with no figures asserted.
    - key: safety-eval
      title: Independent safety evaluation
      doc_type: reference
      source_type: gap
      gap_reason: No independent, methodologically-documented red-team or safety benchmark
        for the self-hosted V3/R1 weights is available to aggregate; the publisher ships no first-party
        safety-eval card. The behavioural caveats (lighter tuning, easier jailbreaks,
        topic censorship) are recorded under limitations but do not constitute a citable
