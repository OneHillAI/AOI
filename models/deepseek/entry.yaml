        these are separate-trust artifacts whose trust equals their uploader.
    - key: fine-tuning
      title: Fine-tuning & adaptation
      doc_type: howto
      source_type: aggregated
      coverage: full
      refs:
      - ev1
      summary: MIT permits distillation and derivative training; standard SFT / LoRA
        adaptation applies to the open weights.
    - key: integration
      title: API / OpenAI-compatible integration
      doc_type: howto
      source_type: aggregated
      coverage: full
      refs:
      - ev3
      summary: Expose an OpenAI-compatible endpoint by self-hosting via vLLM or SGLang
        rather than calling DeepSeek's hosted API for sensitive data.
  use:
    completeness: 61.1
    originality: 0.0
    items:
    - key: capabilities
      title: Capabilities & modalities
      doc_type: reference
      source_type: aggregated
      coverage: full
      refs:
      - ev4
      - ev1
      summary: Strong reasoning and coding; R1 exposes an explicit reasoning mode,
        V3 is a competitive general instruct model. Text-only.
    - key: context-window
      title: Context window & long-context behaviour
      doc_type: reference
      source_type: aggregated
      coverage: partial
      refs:
      - ev1
      summary: Long context documented on the model card; confirm the exact window
        in each checkpoint's config as it varies by release.
    - key: chat-template
      title: Prompt format / chat template
      doc_type: reference
      source_type: aggregated
      coverage: full
      refs:
      - ev1
      summary: DeepSeek chat template shipped with the model card; R1 emits <think>
        reasoning tags that must be parsed/stripped downstream.
    - key: languages
      title: Multilingual coverage
      doc_type: reference
      source_type: aggregated
      coverage: partial
      refs:
      - ev1
      - ev2
      summary: Strong English and Chinese; other languages are supported but less
        thoroughly evaluated.
    - key: tool-use
      title: Function / tool calling
      doc_type: reference
      source_type: gap
      gap_reason: Function/tool-calling support for the self-hosted open weights is
        not cleanly documented in the canonical model card (it differs between V3 and
        R1 and is described mainly for DeepSeek's hosted API), so it cannot be aggregated
        for the open weights.
    - key: structured-output
      title: Structured / JSON output
      doc_type: reference
      source_type: gap
      gap_reason: No model-native JSON or structured-output mode is documented for
        the open weights; schema-constrained decoding is a serving-layer feature (vLLM
        / SGLang / outlines) rather than a property of the weights, so there is nothing
        model-specific to aggregate without independent testing.
  support:
    completeness: 66.7
    originality: 0.0
    items:
    - key: troubleshooting
      title: Common problems & fixes
      doc_type: troubleshooting
      source_type: aggregated
      coverage: full
      refs:
      - ev1
      summary: Handle R1 reasoning tokens / chat template correctly and plan for the
        large-model serving footprint (sharding, KV-cache, quantized distills).
    - key: release-versioning
      title: Versions & changelog
      doc_type: release_notes
      source_type: aggregated
      coverage: full
      refs:
      - ev3
      - ev1
      summary: Versioned families (V3 -> V3.1 -> V4, plus R1) tracked as Hugging Face
        repos/revisions on the deepseek-ai org; pin a revision to stay reproducible.
    - key: security-disclosure
      title: Security-disclosure process
      doc_type: reference
      source_type: gap
      gap_reason: DeepSeek publishes no formal vulnerability-disclosure policy or security
        contact for the model weights (publisher.security_contact is empty); there
        is no documented process, SLA, or advisory channel to aggregate. The hosted
        app/API is a separate service and any disclosure path it may have does not
        cover the open weights.
    - key: channels
      title: Support & community channels
      doc_type: reference
      source_type: aggregated
      coverage: full
      refs:
      - ev3
      summary: Hugging Face model-repo discussions, DeepSeek's GitHub, and community
        forums; no first-party enterprise support channel for the open weights.
    - key: deprecation
      title: Deprecation / end-of-life policy
      doc_type: reference
      source_type: gap
      gap_reason: No published deprecation, end-of-life, or checkpoint-retirement policy
        exists for the DeepSeek open-weight releases; superseded checkpoints simply
        remain on Hugging Face, so there is no lifecycle commitment to document.
    - key: known-issues
      title: Tracked known issues
      doc_type: troubleshooting
      source_type: aggregated
      coverage: full
      refs:
      - ev2
      - ev1
      summary: Topic censorship on certain political topics and lighter-safety-tuning
        caveats are the distinctive known issues, per the model card and third-party
        reporting.
ownership:
  level: partial
  factors:
    use_modify:
      level: strong
      rationale: "R1 weights are MIT - own, redistribute and (explicitly) distil them into smaller task-specific models with no field-of-use limit - but the family is not uniformly MIT: V3's WEIGHTS fall under the separate DeepSeek License Agreement v1.0 (V3 code stays MIT) with real use restrictions (no illegal/military use, no harm to minors, no false-info-to-harm, no PII misuse, no defamation/harassment/discrimination, no automated legal-rights decisions) - not a clean grant. Verify the per-checkpoint licence; R1 distills carry their base-model licence (Qwen = Apache-2.0; Llama = Llama 3.x)."
      # grounded in: ev1 (license, retrieved) - R1 model-card + MIT LICENSE read verbatim; ev1b (license, retrieved) - V3 code-vs-weights split and DeepSeek License Agreement use-restrictions read verbatim
    transparency:
      level: weak
      rationale: "You hold the weights but cannot see into them - China-aligned topic censorship is baked into behaviour, the training data is unreleased and code only partial, and misuse is unbenchmarked with no third-party red-team."
      # grounded in: ev7, ev8 (technical_report, retrieved) - V3/R1 reports document architecture + training compute but release no training data; training code only partial (structural); ev2 (third_party) - censorship / red-team gap
    reliability:
      level: moderate
      rationale: "Runs dependably, but baked-in censorship distorts sensitive-topic coverage and the safety tuning is light with no companion guard model, so you manage that layer yourself."
      # grounded in: ev4 (third_party leaderboard); ev8 (technical_report, retrieved) - R1 pure-RL reasoning
    data_control:
      level: strong
      rationale: "Self-hosted, the open weights run entirely on your own infrastructure with no clawback; the China-storage and PRC-governing-law clauses attach to DeepSeek's hosted service and do not touch the local weights."
      # grounded in: self-hosting (structural); ev5 (privacy_policy, retrieved) - "servers located in the People's Republic of China" and ev6 (terms, retrieved) - PRC governing law bind the hosted service only
  verdict: "You can own the R1 weights outright under MIT - run, redistribute and distil them self-hosted, and your data stays on your infrastructure - but the family is not uniformly MIT: V3's weights fall under the separate DeepSeek License Agreement with real use restrictions (military, minors, PII, discrimination, legal-rights automation), so check the per-checkpoint licence before assuming a clean grant. Transparency is the deeper cap that holds ownership at partial: China-aligned censorship is baked in and the training is opaque, so you cannot fully know what you are running. Adopt with eyes open for reasoning and distillation where that is acceptable, keep sensitive data off it, and avoid the hosted service - its Privacy Policy stores data on servers in the People's Republic of China and its Terms put disputes under PRC law."

# --- Evidence. Each item carries `doc_type` (which kind of primary document) and `retrieved`
#     (true = the document's substantive text was read; false = known to exist but not read).
#     Grounded 2026-07-25 against the primary-source clauses in
#     docs/primary-sources/deepseek/_sources.md. The R1 model card + MIT LICENSE and the V3
#     code-vs-weights split (code MIT; weights under the "DeepSeek License Agreement, Version 1.0")
#     were read verbatim; the hosted-service Privacy Policy and Terms of Use were read from the
#     chat.deepseek.com downloads mirror (the deepseek.com/privacy-policy and HF-root LICENSE URLs
#     404'd); the V3 and R1 technical reports were read on arXiv.
evidence:
- id: ev1
  claim: 'DeepSeek-R1, read verbatim: "This code repository and the model weights
    are licensed under the MIT License. DeepSeek-R1 series support commercial use,
    allow for any modifications and derivative works, including ... distillation for
    training other LLMs." The LICENSE file is standard MIT ("Copyright (c) 2023 DeepSeek",
    AS IS). R1 distilled variants instead carry their base-model licence (Qwen distills
    = Apache-2.0; Llama-8B = Llama 3.1; Llama-70B = Llama 3.3) - verify each distill card.'
  source_type: publisher
  doc_type: license
  retrieved: true
  url: https://huggingface.co/deepseek-ai/DeepSeek-R1
  date: '2026-07-25'
- id: ev1b
  claim: 'DeepSeek-V3 licensing splits code from weights (differs from R1): the code
    repository is MIT ("Copyright (c) 2023 DeepSeek"), but "The use of DeepSeek-V3
    Base/Chat models is subject to the Model License" - the separate "DeepSeek License
    Agreement, Version 1.0", which is NOT MIT. It grants "a perpetual, worldwide, non-exclusive,
    no-charge, royalty-free, irrevocable copyright license" (patent licence terminating
    on patent litigation against DeepSeek) but imposes use restrictions (Section 5
    / Attachment A) prohibiting: use violating "any applicable national or international
    law"; military applications; harm to minors; generating "verifiably false information
    and/or content with the purpose of harming others"; unauthorized distribution of
    PII; defamation/harassment; discrimination; and automated decisions affecting legal
    rights. Output ownership: "DeepSeek claims no rights in the Output You generate."
    Provided AS IS.'
  source_type: publisher
  doc_type: license
  retrieved: true
  url: https://github.com/deepseek-ai/DeepSeek-V3
  date: '2026-07-25'
- id: ev2
  claim: DeepSeek variants, MIT weights, hosted-service data-privacy scrutiny and
    bans, topic censorship aligned with Chinese content rules, and China-origin context.
  source_type: third_party
  doc_type: third_party
  retrieved: true
  url: https://en.wikipedia.org/wiki/DeepSeek_(chatbot)
  date: '2026-07-25'
