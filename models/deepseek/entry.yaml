schema_version: '2.0'
id: deepseek
name: DeepSeek (V3 / R1)
aliases:
- DeepSeek-V3
- DeepSeek-R1
family:
  id: deepseek
  name: DeepSeek
publisher:
  name: DeepSeek
  country: CN
  accountable_entity: true
  url: https://huggingface.co/deepseek-ai
  security_contact: ''
summary: 'DeepSeek''s V3 and R1 are large mixture-of-experts models (V3 is ~671B total
  / ~37B active) whose open weights are released under the OSI-approved MIT license
  - an unusually permissive posture that allows commercial use and even distillation,
  and which has produced a large family of R1 distills into Llama and Qwen bases.
  Adopters must separate the open weights (safetensors,
  run locally, no data leaves your infrastructure) from DeepSeek''s hosted app/API
  service, which has faced data-privacy scrutiny and government bans in several jurisdictions;
  those hosted-service concerns do not apply to locally-run weights; they apply if you
  call DeepSeek''s own API. On top of that, V3/R1 very likely cross the EU
  AI Act''s 1e25-FLOP systemic-risk threshold - which voids the MIT license''s open-source
  exemption and leaves a real Article 53/55 documentation gap - and the models show
  lighter safety tuning plus topic censorship aligned with Chinese content rules.

  '
variants:
- name: DeepSeek-V3
  params_total: ~671B
  params_active: ~37B
  context_window: long
  kind: instruct
  safety_tuned: true
- name: DeepSeek-R1
  params_total: ~671B
  params_active: ~37B
  context_window: long
  kind: reasoning
  safety_tuned: true
- name: DeepSeek-R1-Distill (Llama / Qwen bases)
  kind: reasoning
  safety_tuned: false
openness:
  tier: open_weights
  components:
    weights: open
    training_data: closed
    training_code: partial
    evaluation: partial
    documentation: open
    license: open
  license:
    spdx: MIT
    name: MIT License
    classification: osi
    commercial_use: allowed
    notable_restrictions:
    - Per-checkpoint licence split - R1 code+weights are MIT, but V3 weights are under
      the separate "DeepSeek License Agreement, Version 1.0" (V3 code MIT) with use
      restrictions; R1 distills carry their base-model licence. Verify each checkpoint.
    url: https://huggingface.co/deepseek-ai/DeepSeek-R1
provenance:
  canonical_source: https://huggingface.co/deepseek-ai
  verified_org_on_primary_host: true
  formats:
  - safetensors
  integrity:
    checksums: true
    signed: false
    signing_tech: ''
    provenance_attestation: false
  mirrors_and_quants:
    acknowledged: true
    notable:
    - name: DeepSeek-R1-Distill-Llama-70B and other distills/quants
      trust: mixed
      note: separate artifacts; trust equals the uploader rather than DeepSeek
  checkpoint_checklist_score: 5
  scanner_result: {}
  incidents: []
eu_ai_act:
  is_gpai: true
  systemic_risk:
    designated: false
    training_flops_estimate: very likely >1e25 for V3/R1
    over_1e25_threshold: true
    article_55_docs_available: 'no'
  open_source_exemption:
    license_qualifies: 'yes'
    rationale: 'On the license alone MIT is a genuine free-and-open-source license,
      so V3/R1 would qualify for the Article 53 open-source exemption. However the
      exemption is VOID because V3/R1 are systemic-risk models (training compute very
      likely exceeds the 1e25-FLOP threshold), and systemic-risk models receive no
      open-source exemption - so the full Article 53 + 55 obligations apply and are
      not met.

      '
  provider_package:
    technical_documentation: partial
    downstream_information: partial
    copyright_policy: 'no'
    training_content_summary: 'no'
    code_of_practice_signatory: false
  deployer_notes: 'DeepSeek publishes strong technical reports but not an EU Annex-XI
    package, no copyright policy and no training-content summary. For a downstream
    EU deployer this is a real compliance GAP: a systemic-risk GPAI model with no
    Article 55 documentation, so obligations cannot be assembled from what the provider
    supplies. Some organisations also restrict China-origin models by policy - noted
    here factually as a governance consideration.

    '
  last_assessed: '2026-07-25'
performance:
  note: Third-party framing only.
  class_position: R1 is a strong reasoning model; V3 competitive among large open-weight
    models.
behaviour:
  refusals: 'Exhibits topic censorship/refusals aligned with Chinese content rules
    on certain political topics - a documented behavioural characteristic that affects
    neutrality and factuality for some use cases.

    '
  prompt_injection: Residual susceptibility; lighter safety tuning makes known jailbreaks
    easier to elicit.
  failure_modes: Standard hallucination profile; censorship behaviour is the distinctive
    one.
safety:
  variant_assessed: V3/R1 instruct/reasoning weights, self-hosted
  jailbreak_resistance: Lighter safety tuning than Western frontier labs; known jailbreaks
    are easier - deploy behind your own guardrails.
  guard_model: No first-party guard model shipped; bring your own input/output classifiers.
deployment:
  ceiling_tier: T2
  ceiling_conditional: true
  hardware_notes: V3/R1 full weights need a multi-GPU serving cluster; distills run
    on far smaller hardware but are separate artifacts.
  serving_support:
  - vllm
  - sglang
  - llama.cpp
  - ollama
  controls_required:
  - Strong input/output guardrails (bring your own guard model)
  - Prompt-injection defences
  - Content/neutrality review given censorship behaviour
  - Self-host the safetensors weights; do not send sensitive data to the hosted API
score:
  rubric_version: '1.1'
  headline: 64.4
  grade: C
  hard_flags:
  - 🚩 EU AI Act systemic-risk model with no Article 55 documentation
  dimensions:
    openness:
      score: 3
      rationale: 'Open-weights tier: MIT-licensed weights and open documentation via
        detailed technical reports, but training data is closed and training code
        only partial, with evaluation partial. Meets the open-weights anchor (3),
        not the fully-open top anchor.

        '
      evidence_refs:
      - ev1
      - ev3
    provenance:
      score: 3
      rationale: 'Verified deepseek-ai org on Hugging Face, safetensors distribution
        with checksums, clear canonical source and no malicious-checkpoint incident
        on the canonical org (checklist ~5/8). The many third-party distills/quants
        are separate artifacts whose trust equals their uploader. Meets the score-3
        anchor (verified org + safetensors + checksums, ~4-5 of 8 boxes); short of 4,
        which needs a scanned checkpoint or a documented mirror/quantization policy
        (~6-7 boxes), and of 5''s cryptographic signing / provenance attestation.

        '
      evidence_refs:
      - ev3
    legal:
      score: 2
      rationale: 'The permissive MIT license is a genuine plus, but it is outweighed
        for compliance purposes by the systemic-risk exemption being void, no Article
        55 documentation, no copyright policy and no training-content summary - a
        concrete EU compliance gap for a downstream deployer.

        '
      evidence_refs:
      - ev1
      - ev1b
      - ev2
    safety:
      score: 3
      rationale: 'Released as instruct/reasoning variants with documented behaviour,
        meeting the score-3 anchor, but lighter safety tuning than Western frontier
        labs makes jailbreaks easier and the model exhibits topic censorship - no
        first-party guard model ships, so deployers must add their own guardrails.

        '
      evidence_refs:
      - ev2
      - ev4
    performance:
      score: 4
      rationale: 'R1 is a strong reasoning model and V3 is competitive among large
        open-weight models on public leaderboards. Capped at 4 on third-party
        leaderboard evidence without independent reproduction.

        '
      evidence_refs:
      - ev4
    operational:
      score: 5
      rationale: 'First-class ecosystem support: broad serving across vLLM, SGLang,
        llama.cpp and Ollama, an extensive family of community quantizations and distills,
        and wide third-party hosting availability shortly after release.

        '
      evidence_refs:
      - ev2
      - ev4
    governance:
      score: 3
      rationale: 'Active, named publisher with a verified org and a track record of
        technical reports and releases, meeting the score-3 anchor. Held down by the
        absence of a published security-contact/vulnerability-disclosure process,
        the hosted-service privacy scrutiny, and China-origin policy restrictions
        some organisations apply.

        '
      evidence_refs:
      - ev2
      - ev3
      - ev5
      - ev6

# --- Assessed signals: five cross-cutting attributes highlighted at the top of the entry
#     (like the EU AI Act flag). Not a scoring input - each ties back to one of the seven
#     AOI dimensions and summarises documentation that lives in the four domains.
signals:
  trainability:
    level: partial
    dimension: openness
    summary: "Fine-tune and distil freely under MIT - distillation is expressly permitted - but training data and code are unreleased, so full reproduction from scratch is not possible."
    refs: [ev1]
  knowledge_structure:
    level: moderate
    dimension: performance
    summary: "Strong reasoning (R1) makes it a capable knowledge/analysis backbone, but built-in topic censorship aligned with Chinese content rules distorts coverage on sensitive subjects."
    refs: [ev4, ev2]
  specialization:
    level: strong
    dimension: openness
    summary: "Excellent for specialisation: MIT weights permit fine-tuning and - explicitly - distillation into smaller task-specific models, a stated DeepSeek use case."
    refs: [ev1]
  exchangeability:
    level: high
    dimension: operational
    summary: "Highly exchangeable: safetensors with first-class serving (vLLM, SGLang and more); R1's reasoning / think-tag output format is the main behaviour to account for when swapping."
    refs: [ev3]
  misuse_exposure:
    level: unbenchmarked
    dimension: safety
    summary: "Not independently benchmarked for misuse; the hosted service has drawn data-privacy scrutiny and government bans, and no broad third-party red-team of the open weights exists."
    refs: [ev2]
documentation:
  assess:
    completeness: 93.3
    originality: 0.0
    items:
    - key: intended-use
      title: Intended & out-of-scope use
