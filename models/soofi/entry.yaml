changelog:
- date: '2026-07-25'
  change: Initial entry (v2 four-domain library format).
- date: '2026-07-25'
  change: Grounded evidence against primary sources (docs/primary-sources/soofi) - added doc_type/retrieved to every item; corrected that the model DOES exist; marked the licence unconfirmed/pending (LICENSE 401, no SPDX, retrieved:false) and the OSAID 1.0 line as a stated future intention; noted weights "coming soon" (preview, not yet downloadable); regrounded ownership factors and verdict.
- date: '2026-07-25'
  change: Corrected openness overclaim exposed by grounding - the read GitHub README says weights are "coming soon" and the licence is unconfirmed, so fully_open/openness-5 was not defensible. Downgraded openness tier fully_open->open_weights and its six components to partial (documentation stays open), openness dimension score 5->3 (headline 80.4->73.2, grade B unchanged), EU AI Act open-source exemption yes->uncertain (no confirmed free-and-open licence yet), and ownership level substantial->partial. Re-score when the OSAID release actually lands.
- date: '2026-09-21'
  change: 'Freshness re-verification (Cowork browser session). Independently re-confirmed, verbatim, the exact facts this entry''s 2026-07-25 correction was already built on: the Soofi-S-Base HF model card carries a "closed-beta" tag and the repo is gated, in tension with the project''s own "open-source" marketing framing. Cross-checked against this entry''s existing scoring before deciding whether to re-grade: openness is already held at the open_weights ceiling (3, not fully_open/5), the weights component is already "partial" (not "open"), and ownership is already "partial" with use_modify "moderate" - all specifically because the licence is unconfirmed and weights are not yet generally downloadable. The newly-confirmed "gated" detail (an access-request mechanism exists, distinct from no release path at all) does not change that picture, since no confirmed grant of unconditional access exists either way. No further downgrade is warranted: this entry does not take the project''s marketing framing at face value already, which is the exact failure mode the new research was checking for. The preview siblings it also flagged (Soofi-S-Instruct/Isar/Rhine) were already tracked as variants of this same entry, not new entities. Re-verified against the entry''s own already-corrected baseline, not against the marketing claim; last_verified honestly bumped with no score change.'
- date: '2026-11-19'
  change: 'Freshness re-verification and re-grade (score change, for maintainer review). Re-read the Soofi-Project org on the Hub (all 20 repos gated manual, no LICENSE file in any, none newer than 2026-08-24), the rendered Base and preview cards, soofi.info, the Soofi-Pretraining repo and arXiv 2607.09424 v3. The access status has not moved since July: the card says "It is not an open release" and describes a closed beta with selected partners, the licence tag reads closed-beta, the preview is "for research and development only", the GitHub README still says "Open model weights coming soon", and the project site says an open-source release is "planned" with no date. Marketing and binding text still conflict: the paper title and abstract, the organisation name and press say open-source, while the card, the tag and the gate say closed beta. The September decision (hold the grade because openness was already capped at 3) is reversed on a literal reading of the anchors: openness anchor 3 needs open weights plus a licence and neither exists, and legal anchor 4 needs a broadly permissive licence in force, which does not exist; the permissive licence is a promise. Changes: openness tier open_weights to gated_open and the licence component partial to closed; commercial_use allowed to allowed_with_conditions (no unconditional grant exists; the schema has no unknown value); openness score 3 to 2; legal score 4 to 2; ownership use_modify moderate to weak (hard access gate, per methodology/ownership.md) and transparency strong to moderate (tier-based rule); ownership level stays partial; trainability full to limited and specialization strong to weak; headline recomputed by score.py. Corrections: the training code IS released (Soofi-Pretraining, but with no licence file) and evaluation code sits at ellamind/base-eval (Apache-2.0); the earlier "LICENSE file returned HTTP 401" was the access gate, since the repos list no LICENSE file; the documentation item still said fully_open. New since September: only Soofi-S-Base-Megatron (gated, 2026-08-23). The 25T versus 27T token discrepancy was not re-checked. Provenance 4 (checklist 6/8) was not re-derived; the Hub reports no completed security scan.'
