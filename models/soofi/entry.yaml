        summary: "Verified Soofi-Project org, bf16 safetensors + first-party GGUF/FP8/3-bit, checksums, auditable pipeline; no crypto signing/SLSA, no completed Hub security scan; every repo manually gated."
      - key: eu-ai-act
        title: "EU AI Act posture"
        doc_type: explanation
        source_type: aggregated
        coverage: full
