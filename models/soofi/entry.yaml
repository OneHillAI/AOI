        source_type: aggregated
        coverage: full
        refs: [ev-github, ev-hf-base]
        summary: "Training code (Soofi-Pretraining, no licence file) and soofi-trainer (MIT) are public and the base is built for fine-tuning, but weights and the intermediate Megatron checkpoint are manually gated and no licence grants adaptation rights today."
      - key: integration
        title: "API / OpenAI-compatible integration"
        doc_type: howto
        source_type: aggregated
        coverage: full
        refs: [ev-hf-org]
        summary: "Serve behind vLLM's or llama-server's OpenAI-compatible endpoint; use --jinja to apply the embedded chat/tool template verbatim for native tool calling."
  use:
    completeness: 72.2
    originality: 0.0
    items:
      - key: capabilities
        title: "Capabilities & modalities"
        doc_type: reference
        source_type: aggregated
        coverage: full
        refs: [ev-arxiv, ev-perf]
        summary: "Text-only German+English generation, code and agentic/technical tasks; strongest fully-open model on English+German aggregates, best open code aggregates, at ~3B active params."
      - key: context-window
        title: "Context window & long-context behaviour"
        doc_type: reference
        source_type: aggregated
        coverage: partial
        refs: [ev-arxiv]
        summary: "Supports up to 256k tokens with flat decode throughput (near-constant cache) from 4k-256k; effective long-context recall at full length is not independently benchmarked."
      - key: chat-template
        title: "Prompt format & chat template"
        doc_type: reference
        source_type: aggregated
        coverage: full
        refs: [ev-hf-org]
        summary: "Instruct-Preview ships an embedded Jinja chat template (identity + tools); apply it (e.g. llama-server --jinja) rather than hand-rolling roles. Base has no chat template."
      - key: languages
        title: "Language coverage"
        doc_type: reference
        source_type: aggregated
        coverage: full
        refs: [ev-arxiv, ev-press]
        summary: "Primarily German and English, with German deliberately up-weighted in the ~27T-token mix; both are first-class supported targets."
      - key: tool-use
        title: "Function / tool calling"
        doc_type: reference
        source_type: aggregated
        coverage: partial
        refs: [ev-hf-org]
        summary: "A native tool-call format is embedded in the Instruct GGUF's Jinja template; run under llama-server --jinja to use it verbatim (Ollama's template omits tools)."
      - key: structured-output
        title: "Structured / JSON-constrained output"
        doc_type: reference
        source_type: gap
        gap_reason: "No published native JSON/schema-constrained output capability is documented for Soofi-S. Constrained decoding is possible at the serving layer (e.g. vLLM/llama.cpp grammars), which is a runtime feature rather than a model-documented behaviour."
  support:
    completeness: 50.0
    originality: 0.0
    items:
      - key: troubleshooting
        title: "Common problems & fixes"
        doc_type: troubleshooting
        source_type: aggregated
        coverage: partial
        refs: [ev-hf-base, ev-hf-org]
        summary: "Aggregated preview pitfalls (missing trust_remote_code, custom-arch runtime support, tool-template differences across runtimes, revision drift); not an exhaustive catalogue."
      - key: release-versioning
        title: "Versions, changelog & cadence"
        doc_type: release_notes
        source_type: aggregated
        coverage: full
        refs: [ev-hf-org, ev-arxiv]
        summary: "Preview/beta cadence: Base plus Instruct/Isar/Rhine previews and iteration checkpoints (e.g. iter_1056000) tracked as Soofi-Project Hugging Face revisions; pretraining report accompanies the release."
      - key: security-disclosure
        title: "Security / vulnerability disclosure"
        doc_type: reference
        source_type: gap
        gap_reason: "No formal, published vulnerability-disclosure or security policy (e.g. SECURITY.md / advisory process) exists for Soofi; contact is only the Soofi-Project Hugging Face/GitHub org presence, so there is no documented process to aggregate."
      - key: channels
        title: "Community & support channels"
        doc_type: reference
        source_type: aggregated
        coverage: full
        refs: [ev-hf-org, ev-github, ev-cairne]
        summary: "Soofi-Project Hugging Face model/dataset discussions, GitHub issues (Soofi-Pretraining, soofi-trainer, soofi-model-hosting), the soofi.info site and the KI-Bundesverband-coordinated consortium."
      - key: deprecation
        title: "Deprecation / end-of-life policy"
        doc_type: reference
        source_type: gap
        gap_reason: "No published deprecation or end-of-life policy for Soofi-S checkpoints; as an early preview, prior revisions remain downloadable but no formal support-window or sunset commitment is documented."
      - key: known-issues
        title: "Tracked known issues"
        doc_type: reference
        source_type: aggregated
        coverage: partial
        refs: [ev-hf-org, ev-arxiv]
        summary: "From model-card caveats: closed-beta preview status, manual access gate with no dated open release, incomplete safety/privacy features, tool-template inconsistencies across runtimes, and custom-architecture runtime-support maturity."

ownership:
  level: partial
  factors:
    use_modify:
      level: weak
      rationale: "A hard access gate with no licence in force: every repo is manually gated, the card says it is not an open release and that the preview is for research and development only, and no LICENSE file exists, so use, fine-tuning and commercial use are not granted by any published text. The permissive release is a promise without a date."
      # grounded in: ev-hf-base (license, retrieved 2026-11-19) - tag closed-beta, gated manual, card "not an open release", no LICENSE file; ev-github (docs, retrieved) - README "Open model weights coming soon", no LICENSE; ownership.md use_modify weak = hard access gate
    transparency:
      level: moderate
      rationale: "The report, the per-source data accounting and the training code are public and inspectable, which is more than most weight-only releases, but the weights are not publicly inspectable (manual gate, closed beta) and the training code has no licence file, so this stops at moderate until the weights and licence are released."
      # grounded in: ev-arxiv (technical_report, retrieved) - per-source data accounting; ev-github (docs, retrieved) - code released, no LICENSE; ev-hf-base (license, retrieved) - gated; ownership.md transparency moderate = gated_open tier, docs good
    reliability:
      level: moderate
      rationale: "Pre-release: the weights are available only through manual approval, so runtime dependability is unproven for most adopters and the documented-incomplete safety cannot yet be exercised. The reported ~3B-active-param strength counts as a capability point in the AOI score rather than an ownership factor."
      # grounded in: ev-perf (third_party) - strongest-fully-open benchmark framing; ev-arxiv (technical_report, retrieved) - ~27T tokens, per-task claims
    data_control:
      level: moderate
      rationale: "EU/Germany-domiciled and trained on sovereign German infrastructure, so once self-hosted your data would stay yours - but with weights manually gated and no licence in force, that self-hosting cannot yet be exercised from a settled grant."
      # grounded in: ev-github (docs, retrieved) - weights "coming soon", not downloadable; ev-hf-base (license, not retrieved) - licence pending
  verdict: "Today you do not own the use of these weights: they are manually gated in a closed beta, the card says it is not an open release, and no licence is in force, so use, modification and commercial use are not granted by any published text. What exists is exceptional documentation - a pretraining report with full per-source data accounting and a released training codebase - plus a stated OSAID 1.0 commitment with no date. The marketing says open-source; the binding text says closed beta. Treat the openness as promised rather than delivered, and re-assess when weights and a licence are published."

# --- Evidence. Each item carries `doc_type` (which kind of primary document) and `retrieved`
#     (true = the document's substantive text was read; false = known to exist but not read).
#     Grounded 2026-07-25 against the primary-source clauses in
#     docs/primary-sources/soofi/_sources.md. Only three documents were gathered and read this
#     round - the arXiv pretraining report (technical_report), the GitHub pretraining repo (docs)
#     and the Hugging Face Soofi-S-Base page (license) - so only those carry retrieved:true, and
#     the licence stays retrieved:false because the LICENSE file 401'd and no final SPDX exists.
#     This is a PREVIEW: weights are "coming soon" (not yet generally downloadable) and the OSAID
#     1.0 line in the report is a stated future intention, not a delivered release.
evidence:
- id: ev-arxiv
  claim: 'Real arXiv report ("A Sovereign, Open-Source Foundation Model for German and
    English" / PDF "Soofi S Pretraining Report v1.0"): a ~30B (30B-A3B) hybrid Mamba-2/Transformer
    MoE trained on ~27T primarily German+English tokens on Deutsche Telekom''s Industrial
    AI Cloud in Munich, with full per-source data accounting (public identifier + raw/effective
    token counts; the ~1.3% Genios corpus reported in aggregate). States an OSAID 1.0
    commitment as a future intention - "we will release weights, intermediate checkpoints,
    training and evaluation code, and exact per-source data accounting under permissive
    licenses" - which is not yet delivered.'
  source_type: publisher
  doc_type: technical_report
  retrieved: true
  url: https://arxiv.org/abs/2607.09424
  date: '2026-07-25'
- id: ev-hf-base
  claim: 'Soofi-S-Base (Hugging Face, rendered page and Hub API read 2026-11-19): the repo is
    gated "manual", the licence tag is "closed-beta" (license: other), the card says "This model
    is a beta preview and a research artifact. It is not an open release", that the checkpoint
    is "currently in a closed beta with already selected partners", and that "The final model
    will be released openly under a permissive license, without gated access" with no date. Its
    License/Terms of Use section says only "Will be released under a permissive license." and
    "This model is for research and development only (Preview)." No repo in the org lists a
    LICENSE file, and the raw files return HTTP 401 without approved access. Same disclaimer and
    tag on the Instruct, Isar and Rhine previews.'
  source_type: publisher
  doc_type: license
  retrieved: true
  url: https://huggingface.co/Soofi-Project/Soofi-S-Base
  date: '2026-11-19'
