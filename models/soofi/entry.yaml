      - key: openness
        title: "Openness tier & components"
        doc_type: reference
        source_type: aggregated
        coverage: full
        refs: [ev-arxiv, ev-github, ev-osaid]
        summary: "gated_open - not an open release today: weights manually gated in a closed beta, no licence in force; per-source data accounting and training code are published, and an OSAID 1.0 release is promised without a date."
      - key: license
        title: "License terms & permitted use"
        doc_type: reference
        source_type: aggregated
        coverage: full
