      - key: safety-eval
        title: "Independent safety evaluation"
        doc_type: reference
        source_type: gap
        gap_reason: "No broad third-party adversarial evaluation (CBRN/cyber/prompt-injection) has been published for this preview. The Instruct model card itself lists safety features as incomplete, so there is no independent safety battery to aggregate."
  implement:
    completeness: 90.9
    originality: 0.0
    items:
      - key: install
        title: "Install & run"
        doc_type: howto
        source_type: aggregated
        coverage: full
