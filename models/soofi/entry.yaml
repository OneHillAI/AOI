# OneHill v2 MODEL library entry for Soofi (Soofi-S).
# Validated against schema/model.v2.schema.json.
#   scores    -> scripts/score.py --write        (AOI headline/grade)
#   meters    -> scripts/completeness.py --write  (per-domain completeness/originality)
#   prose     -> assess.md / implement.md / use.md / support.md (sections keyed <!-- item: KEY -->)

schema_version: "2.0"
id: soofi
name: Soofi (Soofi-S)
aliases:
- Soofi S
- Soofi-S
- Soofi S 30B-A3B
- Soofi-Project/Soofi-S-Base
- Sovereign Open Source Foundation Models
family:
  id: soofi
  name: Soofi
publisher:
  name: Soofi Consortium (Sovereign Open Source Foundation Models)
  country: DE
  accountable_entity: true
  url: https://soofi.info
  security_contact: https://huggingface.co/Soofi-Project
summary: 'Soofi-S is an open-science project in the OLMo mould whose pretraining report
  commits it to the Open Source AI Definition (OSAID 1.0), a pledge to release weights,
  intermediate checkpoints, full per-source data accounting, hyperparameters and training+eval
  code. That release has not landed: the base weights are in a
  closed-beta phase ("open model weights coming soon"), the open licence is not yet finalised
  (the LICENSE file is access-restricted and carries no SPDX), and it remains an early
  preview/beta with a custom architecture and incomplete safety hardening. It is the first model from the Soofi
  consortium ("Sovereign Open Source Foundation Models"), a German public-private consortium
  coordinated by the KI Bundesverband and funded by the German Federal Ministry for Economic
  Affairs and Energy (BMWE) under the European IPCEI-CIS programme, with members including
  Fraunhofer IAIS/IIS, DFKI, TU Darmstadt and the L3S Research Centre (a CAIRNE Gold member).
  It is a ~30B hybrid Mamba-2/Transformer Mixture-of-Experts model (30B total, ~3B active
  per token) trained on ~27 trillion tokens of primarily German and English on Deutsche
  Telekom''s sovereign Industrial AI Cloud in Munich, aimed at industrial and regulated use.

  '
variants:
- name: Soofi-S-Base
  params_total: 30B (30B-A3B)
  params_active: ~3B
  context_window: up to 256k
  kind: base
  safety_tuned: false
- name: Soofi-S-Instruct-Preview
  params_total: 30B (30B-A3B)
  params_active: ~3B
  context_window: up to 256k
  kind: instruct
  safety_tuned: true
- name: Soofi-S-Isar-Preview
  params_total: 30B (30B-A3B)
  params_active: ~3B
  context_window: up to 256k
  kind: reasoning
  safety_tuned: true
- name: Soofi-S-Rhine-Preview
  params_total: 30B (30B-A3B)
  params_active: ~3B
  context_window: up to 256k
  kind: other
  safety_tuned: true
openness:
  tier: open_weights
  components:
    weights: partial
    training_data: partial
    training_code: partial
    evaluation: partial
    documentation: open
    license: partial
  license:
    name: Permissive open-source committed (OSAID 1.0) but not yet finalised - SPDX pending, LICENSE access-restricted
    classification: custom
    commercial_use: allowed
    notable_restrictions:
    - Base weights are in a closed-beta access phase; the committed permissive open release has not yet landed
    - Final open licence not yet published - no SPDX identifier and the LICENSE file returned HTTP 401 when read
    url: https://huggingface.co/Soofi-Project/Soofi-S-Base
provenance:
  canonical_source: https://huggingface.co/Soofi-Project
  verified_org_on_primary_host: true
  formats:
  - safetensors
  - gguf
  integrity:
    checksums: true
    signed: false
    signing_tech: ''
    provenance_attestation: false
  mirrors_and_quants:
    acknowledged: true
    notable:
    - Soofi-Project first-party GGUF and EntQuant 3-bit preview quantizations
  checkpoint_checklist_score: 6
  scanner_result: {}
  incidents: []
eu_ai_act:
  is_gpai: true
  systemic_risk:
    designated: false
    training_flops_estimate: well under 1e25 (30B total / ~3B active, ~27T tokens)
    over_1e25_threshold: false
    article_55_docs_available: n/a
  open_source_exemption:
    license_qualifies: uncertain
    rationale: 'Soofi is committed to a free/open-source release that would meet OSAID 1.0 -
      public parameters, architecture and usage information, permissively licensed and
      not monetised - which would qualify it for the Article 53 open-source exemption from
      the Annex XI/XII technical-documentation duties. But the exemption cannot yet be relied
      on: the open licence is not finalised (base weights in closed beta; no SPDX and the
      LICENSE file access-restricted), so there is no confirmed free-and-open
      licence to point to. The surviving obligations (copyright policy and a public
      training-content summary) would be unusually easy to meet because Soofi publishes full
      per-source data accounting; only ~1.3% of Phase 1 tokens (the commercially licensed
      Genios corpus) are reported in aggregate rather than redistributable. Well under the
      1e25-FLOPs systemic-risk threshold, so nothing would void the exemption once the open
      licence actually lands - that release is the gating item for a downstream provider.

      '
  provider_package:
    technical_documentation: 'yes'
    downstream_information: 'yes'
    copyright_policy: partial
    training_content_summary: 'yes'
    code_of_practice_signatory: false
  deployer_notes: 'Soofi-S is EU/Germany-domiciled, trained on sovereign German infrastructure,
    which simplifies data-residency and jurisdiction questions. A fine-tuner placing a
    derivative on the EU market under its own name may become a provider for that derivative,
    but the released per-source data accounting and pretraining technical report let a
    downstream provider assemble a training-content summary and much of the technical
    documentation from public artifacts rather than reconstructing them.

    '
  last_assessed: '2026-07-25'
performance: {}
behaviour: {}
safety: {}
deployment:
  ceiling_tier: T2
  ceiling_conditional: true
  hardware_notes: 'The MoE activates only ~3B of 30B parameters per token, so decode is
    cheap, but the full weight set (~30B in bf16) must be resident - plan for multi-GPU
    or first-party GGUF/3-bit quantization on a single high-VRAM card. The near-constant
    inference cache keeps long-context (up to 256k) serving affordable.

    '
  serving_support:
  - vllm
  - llama.cpp
  - ollama
  - hf-transformers
  controls_required:
  - Treat as an early preview/beta - pilot internally before any customer-facing use
  - Deploy the Instruct-Preview (post-trained) variant, not the base checkpoint
  - Add input/output guardrails and your own guard classifier - safety features are documented as incomplete
  - Load with trust_remote_code=True (custom hybrid Mamba-2/MoE modelling code) and pin the exact revision
score:
  rubric_version: '1.1'
  headline: 73.2
  grade: B
  hard_flags: []
  dimensions:
    openness:
      score: 3
      rationale: 'Openness here is documented and committed but not yet delivered, so it
        earns the open-weights ceiling (3) instead of the fully-open 5.
        The pretraining report publishes full per-source data
        accounting (raw/effective token counts, epoch multipliers, even excluded sources)
        and states the project will meet the Open Source AI Definition (OSAID 1.0) as a
        future-tense pledge. Not yet delivered: the base weights are in a closed-beta
        phase ("open model weights coming soon" on the GitHub README), the training/eval
        code is not yet released, and the open licence is unconfirmed (no SPDX; the LICENSE
        file returned HTTP 401). A 5 requires all six components actually Open (downloadable
        weights under a permissive licence with runnable code), which the preview does not
        yet meet.

        '
      evidence_refs:
      - ev-arxiv
      - ev-github
      - ev-osaid
    provenance:
      score: 4
      rationale: 'Distributed from the verified Soofi-Project org on Hugging Face in bf16
        safetensors (plus first-party GGUF/3-bit quants) with checksums, and because the
        data accounting, code and intermediate checkpoints are public the pipeline is highly
        auditable (checklist 6/8). Held below 5 by the absence of cryptographic weight signing /
        SLSA attestation and the current closed-beta access phase on the base weights.

        '
      evidence_refs:
      - ev-hf-base
      - ev-hf-org
    legal:
      score: 4
      rationale: 'Committed permissive OSAID-compliant licensing with unconditional commercial
        use, an EU/Germany jurisdiction, well under the systemic-risk compute threshold, and a
        published per-source data inventory that makes the EU AI Act training-content summary
        directly satisfiable. Short of 5 only because the final open license SPDX is not yet
        published (base weights are in closed beta) and ~1.3% of tokens are commercially licensed.

        '
      evidence_refs:
      - ev-arxiv
      - ev-github
    safety:
      score: 3
      rationale: 'A post-trained Instruct-Preview variant exists and the L3S Research Centre
        contributes safety/evaluation frameworks, but the Instruct model card documents several
        privacy and safety features as still incomplete, this is an early preview, and there is no
        companion guard model or broad independent red-team battery. Base checkpoints are honestly
        presented as research/fine-tuning artifacts.

        '
      evidence_refs:
      - ev-hf-org
      - ev-arxiv
    performance:
      score: 4
      rationale: 'Independent coverage and the pretraining report agree Soofi-S is the strongest
        fully-open model on aggregate English and German benchmarks - ahead of OLMo 3 32B, Apertus
        70B, EuroLLM 22B and Alia 40B - matching dense 14-27B models and winning code aggregates
        among open base models, at only ~3B active parameters. Strong for its class rather than a
        frontier-vs-closed claim, and still a preview.

        '
      evidence_refs:
      - ev-perf
      - ev-arxiv
    operational:
      score: 4
      rationale: 'Runs on mainstream stacks - HF transformers (trust_remote_code), vLLM,
        llama.cpp/llama-server and Ollama - with first-party GGUF and 3-bit quantizations and a
        near-constant long-context cache. Held short of 5 by the custom hybrid Mamba-2/MoE architecture
        (custom modelling code, maturing runtime support) and tool-template quirks across runtimes.

        '
      evidence_refs:
      - ev-hf-base
      - ev-hf-org
    governance:
      score: 4
      rationale: 'Accountable, well-identified publisher: a named government-funded consortium
        coordinated by the KI Bundesverband with reputable research members, a detailed pretraining
        technical report and open GitHub repositories. Short of 5 without a formally documented
        vulnerability-disclosure and deprecation policy, and given the early preview status.

        '
      evidence_refs:
      - ev-cairne
      - ev-press

# --- Assessed signals: five cross-cutting attributes highlighted at the top of the entry.
signals:
  trainability:
    level: full
    dimension: openness
    summary: "Fully retrainable: OSAID-compliant release of weights, intermediate checkpoints, full per-source data accounting, hyperparameters and open training/eval code (Soofi-Pretraining, soofi-trainer) supports fine-tune, continue-pretrain or reproduce."
    refs: [ev-github, ev-arxiv, ev-osaid]
  knowledge_structure:
    level: moderate
    dimension: performance
    summary: "Capable bilingual German/English backbone with a long context (up to 256k, near-constant cache) but a standard generative MoE LLM - strong retrieval/grounding capacity, no native structured-knowledge features."
    refs: [ev-arxiv, ev-perf]
  specialization:
    level: strong
    dimension: openness
    summary: "Ideal for specialisation: open training code, intermediate checkpoints and per-source data plus a base explicitly built for fine-tuning enable domain-adaptation and continued pre-training, well beyond LoRA."
    refs: [ev-github, ev-hf-base]
  exchangeability:
    level: medium
    dimension: operational
    summary: "Portable with caveats: the custom hybrid Mamba-2/MoE needs trust_remote_code and maturing runtime support, and tool-call templates differ across runtimes, so it takes more integration care than a plain Llama-class model."
    refs: [ev-hf-base, ev-hf-org]
  misuse_exposure:
    level: unbenchmarked
    dimension: safety
    summary: "Not independently benchmarked for misuse/exposure: the Instruct model card lists safety features as incomplete and no broad third-party CBRN/cyber/prompt-injection red-team battery exists for this preview."
    refs: [ev-hf-org]

