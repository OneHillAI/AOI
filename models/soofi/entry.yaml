ownership:
  level: partial
  factors:
    use_modify:
      level: moderate
      rationale: "The OSAID-compliant permissive licence is a stated future commitment, not yet in force: the licence is unconfirmed/pending (page inconsistent, LICENSE file 401'd, no final SPDX) and the model is a preview whose weights are 'coming soon' rather than generally downloadable - so unconditional commercial use, fine-tuning and continued pre-training cannot yet be fully exercised."
      # grounded in: ev-hf-base (license, not retrieved) - licence "not yet finalized", LICENSE 401, no SPDX; ev-github (docs, retrieved) - README "Open model weights coming soon"
    transparency:
      level: strong
      rationale: "Openness rests on a real, detailed pretraining technical report with full per-source data accounting plus a stated OSAID 1.0 commitment - you can already see what it is and how it is built - even though the full weights/checkpoints/data release is a future intention, not yet delivered."
      # grounded in: ev-arxiv (technical_report, retrieved) - per-source data accounting + OSAID 1.0 future-tense commitment; ev-osaid (third_party) - corroborating fully-open coverage
    reliability:
      level: moderate
      rationale: "Pre-release: the weights are not yet downloadable, so runtime dependability is unproven and the documented-incomplete safety cannot yet be exercised. The reported ~3B-active-param strength counts as a capability point in the AOI score rather than an ownership factor."
      # grounded in: ev-perf (third_party) - strongest-fully-open benchmark framing; ev-arxiv (technical_report, retrieved) - ~27T tokens, per-task claims
    data_control:
      level: moderate
      rationale: "EU/Germany-domiciled and trained on sovereign German infrastructure, so once self-hosted your data would stay yours - but with weights not yet downloadable and the licence unconfirmed, that self-hosting cannot yet actually be exercised from a settled grant."
      # grounded in: ev-github (docs, retrieved) - weights "coming soon", not downloadable; ev-hf-base (license, not retrieved) - licence pending
  verdict: "The documentation and openness intent here are exceptional: a genuine pretraining report with full per-source data accounting and a stated OSAID 1.0 commitment to release weights, checkpoints, code and data permissively, and the German-sovereign infrastructure is a real data-control draw. This is preview-stage: the weights are 'coming soon' rather than downloadable, and the licence is unconfirmed (page inconsistent, LICENSE file 401'd, no final SPDX), so use/modify and data-control cannot yet be fully exercised. Treat the openness as promised and well-documented rather than delivered."

# --- Evidence. Each item carries `doc_type` (which kind of primary document) and `retrieved`
#     (true = the document's substantive text was read; false = known to exist but not read).
#     Grounded 2026-07-25 against the primary-source clauses in
#     docs/primary-sources/soofi/_sources.md. Only three documents were gathered and read this
#     round - the arXiv pretraining report (technical_report), the GitHub pretraining repo (docs)
#     and the Hugging Face Soofi-S-Base page (license) - so only those carry retrieved:true, and
#     the licence stays retrieved:false because the LICENSE file 401'd and no final SPDX exists.
#     This is a PREVIEW: weights are "coming soon" (not yet generally downloadable) and the OSAID
#     1.0 line in the report is a stated future intention, not a delivered release.
evidence:
- id: ev-arxiv
  claim: 'Real arXiv report ("A Sovereign, Open-Source Foundation Model for German and
    English" / PDF "Soofi S Pretraining Report v1.0"): a ~30B (30B-A3B) hybrid Mamba-2/Transformer
    MoE trained on ~27T primarily German+English tokens on Deutsche Telekom''s Industrial
    AI Cloud in Munich, with full per-source data accounting (public identifier + raw/effective
    token counts; the ~1.3% Genios corpus reported in aggregate). States an OSAID 1.0
    commitment as a future intention - "we will release weights, intermediate checkpoints,
    training and evaluation code, and exact per-source data accounting under permissive
    licenses" - which is not yet delivered.'
  source_type: publisher
  doc_type: technical_report
  retrieved: true
  url: https://arxiv.org/abs/2607.09424
  date: '2026-07-25'
- id: ev-hf-base
  claim: 'Soofi-S-Base exists and is hosted on the verified Soofi-Project org on Hugging
    Face in bf16 safetensors (custom hybrid Mamba-2/MoE modelling code via trust_remote_code=True),
    but its licence is unconfirmed/pending: the page characterises it inconsistently
    ("Other"/TODO vs "closed-beta" and "will be released under a permissive license,
    without gated access"), terms are described as "not yet finalized", the LICENSE file
    returned HTTP 401, and no final SPDX has been published.'
  source_type: publisher
  doc_type: license
