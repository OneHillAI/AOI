# OneHill v2 MODEL library entry for MeditronFO (Apertus-70B-MeditronFO and Apertus-8B-MeditronFO).
# Validated against schema/model.v2.schema.json.
#   scores    -> scripts/score.py --write        (AOI headline/grade)
#   meters    -> scripts/completeness.py --write  (per-domain completeness/originality)
#   prose     -> assess.md / implement.md / use.md / support.md (sections keyed <!-- item: KEY -->)
#
# Scope: one release. The two Apertus-based MeditronFO checkpoints share a base, a licence tag, a corpus,
# a recipe, a card template and a safety posture. The OLMo-2, EuroLLM, Gemma-3 and Meditron3 checkpoints
# differ on base licence or base access terms and are follow-ups (see assess.md, license item).

schema_version: "2.0"
id: meditronfo
name: MeditronFO (Apertus-70B-MeditronFO / Apertus-8B-MeditronFO)
aliases:
- MeditronFO
- Fully Open Meditron
- Apertus-70B-MeditronFO
- Apertus-8B-MeditronFO
- EPFLiGHT/Apertus-70B-MeditronFO
family:
  id: meditron
  name: Meditron
publisher:
  name: LiGHT laboratory (Laboratory for Intelligent Global Health & Humanitarian Response Technologies), EPFL, School of Computer and Communication Sciences
  country: CH
  accountable_entity: true
  url: https://meditron.light-laboratory.org/
summary: "Adopt MeditronFO as a research, auditing and specialisation base and not as a clinical tool. The publisher states in plain words that the models are not medical devices, have not been tested in clinical practice and must not be used to make decisions about a patient. The release covers two Apertus-based checkpoints, Apertus-70B-MeditronFO (flagship) and Apertus-8B-MeditronFO. They are supervised fine-tunes of the Swiss AI Initiative Apertus-Instruct models on a released 533,888-example medical corpus whose answers were written by gpt-oss-120b. The openness is unusual for a medical model: weights, corpus, data-generation, decontamination, training and evaluation code are public under a declared Apache-2.0 licence. The legal footing is weaker than the headline. No LICENSE file ships with the weights. The arXiv paper says the corpus is under a research-use licence while the dataset card says Apache-2.0, some source datasets carry other terms, and the Apertus base card carries an acceptable-use policy with an indemnity clause. Medically it trails Google MedGemma-27B on the publisher's own five-benchmark average (54.56 against 63.75 for the 70B), and no independent evaluation or red-team exists."
variants:
- name: Apertus-70B-MeditronFO
  params_total: 70.6B
  context_window: 65,536 (config max_position_embeddings; fine-tuned on 8,192-token packed sequences)
  kind: instruct
  safety_tuned: false
- name: Apertus-8B-MeditronFO
  params_total: 8.05B
  context_window: 65,536 (config max_position_embeddings; fine-tuned on 8,192-token packed sequences)
  kind: instruct
  safety_tuned: false
openness:
  tier: open_weights_recipe
  components:
    weights: open
    training_data: partial
    training_code: open
    evaluation: partial
    documentation: open
    license: partial
  license:
    spdx: Apache-2.0
    name: Apache License 2.0 (declared in model card metadata and card header; no LICENSE file in the weight repositories)
    classification: osi
    commercial_use: allowed_with_conditions
    notable_restrictions:
    - Declared only in the card metadata and a link to apache.org; no LICENSE or NOTICE file and no copyright holder named in the weight repositories (raw LICENSE is HTTP 404).
    - The publisher states the models are for research, are not medical devices, have not been tested in clinical practice and must not be used to make decisions about a patient.
    - The arXiv paper (v2, 29 May 2026) says the corpus is released under a research-use licence and that source assets are restricted to research purposes; the dataset card (17 Nov 2026) says Apache-2.0 and flags two source datasets for upstream verification.
    - The Apertus base card carries an Acceptable Use Policy with an indemnity clause in its gate prompt (gate currently off); whether it binds the fine-tunes is not stated.
    url: https://huggingface.co/EPFLiGHT/Apertus-70B-MeditronFO
provenance:
  canonical_source: https://huggingface.co/EPFLiGHT/Apertus-70B-MeditronFO
  verified_org_on_primary_host: false
  formats:
  - safetensors
  integrity:
    checksums: true
    signed: false
    signing_tech: ''
    provenance_attestation: false
  mirrors_and_quants:
    acknowledged: true
    notable:
    - name: mradermacher (GGUF and i1-GGUF) for both sizes; loleg (MLX) and BrazosDeDios (GGUF) for 8B
      trust: community
      note: community conversions listed by Hugging Face search; none opened or verified by OneHill
  checkpoint_checklist_score: 3
  scanner_result: {}
  incidents: []
eu_ai_act:
  is_gpai: true
  systemic_risk:
    designated: false
    training_flops_estimate: about 6.4e24 for the Apertus-70B base by the 6ND rule (70.6B parameters, 15T tokens, both from the base card and HF metadata; a OneHill estimate, not a publisher figure); the fine-tune used 199 GH200 GPU-hours and adds a negligible amount
    over_1e25_threshold: false
    article_55_docs_available: n/a
  open_source_exemption:
    license_qualifies: unclear
    rationale: "The declared licence is Apache-2.0, which would normally qualify for the open-source exemption. The licence text is not shipped with the weights and the paper and dataset card disagree on the corpus licence, so qualification is not established. Whether a fine-tuner of a GPAI model becomes a provider depends on how much compute the modification uses relative to the base; that rule is not assessed here. The medical purpose is the larger regulatory question. The publisher says the models are not medical devices, and any adopter who builds a product that informs clinical decisions must assess medical-device and high-risk obligations for that product. Those instruments are not assessed here."
  provider_package:
    technical_documentation: partial
    downstream_information: partial
    copyright_policy: unknown
    training_content_summary: partial
    code_of_practice_signatory: unknown
  deployer_notes: "The base model publisher lists an EU AI Act public summary and a Code of Practice document on the Apertus card; neither PDF is verified, so nothing is scored on them. MeditronFO itself publishes a corpus with row-level source fields, a per-source licence table and a pipeline, which helps a deployer reconstruct a training-content summary, but it publishes no provider documentation package of its own."
  last_assessed: '2026-11-19'
performance: {}
behaviour: {}
safety: {}
deployment:
  ceiling_tier: T1
  ceiling_conditional: true
  hardware_notes: "The 70B checkpoint is 30 safetensors shards of BF16 weights, about 141 GB (70.6B parameters at 2 bytes), so serving it needs multiple 80 GB class GPUs or a quantised build. The 8B checkpoint is about 16 GB in BF16. Both sizes are derived from the Hugging Face file listing and not from publisher guidance, because the cards give training compute only (199 GH200 GPU-hours for 70B) and no serving requirements."
  serving_support:
  - hf-transformers
  - vllm
  - sglang
  - mlx
  - llama.cpp
  controls_required:
  - Use only for research, evaluation, auditing or as a specialisation base; keep a clinician in the loop and do not use any output to decide on a patient
  - Pin the exact repository revision and verify the per-file sha256 values, because the weights on main were replaced in September and October 2026
  - Add your own clinical safety evaluation and red-team for the target use before any wider exposure; the publisher's safety judging is explicitly not a deployment-readiness signal
  - Add input and output guardrails and a separate guard or classifier model; none ships with the release
  - Obtain legal review of the licence chain (no LICENSE file, corpus licence disagreement, inherited Apertus acceptable-use policy) before any commercial use
  - For any product that informs clinical decisions, assess medical-device and AI Act high-risk obligations before development, not after
score:
  rubric_version: '1.1'
  headline: 51.2
  grade: D
  hard_flags: []
  dimensions:
    openness:
      score: 4
      rationale: "Open weights plus recipe: BF16 safetensors, a released 533,888-example corpus with row-level source fields, public data-generation, decontamination, training (Axolotl configs) and evaluation code under Apache-2.0 on GitHub, and a fully open base (Apertus). The score stops short of 5 on the publisher's own record. The GitHub README says intermediate files and per-item evaluation outputs are not released yet and the MOOVE vignettes are non-public, which contradicts the project page line that outputs of every step are released. The weights carry no LICENSE file, and the paper and dataset card disagree on the corpus licence. Training data and evaluation are therefore partial and not open."
      evidence_refs:
      - ev-card-70b
      - ev-github-readme
      - ev-project-page
      - ev-data-card
      - ev-paper
    provenance:
      score: 2
      rationale: "Safetensors only with an LFS sha256 per shard, and a well-documented training lineage. The Hugging Face organisation EPFLiGHT is not a verified organisation (isVerified false), there are no signatures, attestations or scan results, and the weights on main were replaced in place on 2026-09-10 and 2026-10-06 with no tagged releases. The anchor for 2 is a canonical source with safetensors but an unverified org; 3 needs a verified publisher org. About 3 of 8 checklist boxes."
      evidence_refs:
      - ev-hf-meta
      - ev-card-70b
    legal:
      score: 2
      rationale: "A permissive licence is declared (Apache-2.0) with material caveats a deployer must resolve. No LICENSE file or copyright holder ships with the weights. The paper says the corpus is research-use while the dataset card says Apache-2.0. The dataset card flags AfriMed-QA (CC BY-SA 4.0) and LiveQA (open or research use) for upstream verification, and the paper lists the guidelines corpus and MOOVE training split as research use. The base card carries an acceptable-use policy with indemnity, and the publisher says the models are not medical devices and not for patient decisions. EU AI Act documentation is fragmentary (the base summary is unverified). This matches the 2 anchor and not 3."
      evidence_refs:
      - ev-card-70b
      - ev-data-card
      - ev-paper
      - ev-base-card
      - ev-hf-meta
    safety:
      score: 2
      rationale: "The models are supervised fine-tunes for medical accuracy and not safety tuning. Evaluation is publisher-only (HealthBench, AutoMOOVE LLM judges). The publisher says the judge agrees with clinicians on safety only at kappa 0.311, close to the 0.306 between clinicians, and that the judge is unsuitable as a deployment-readiness signal for safety criteria. There is no guard model, no independent evaluation and no red-team. General instruction following drops (IFEval down 17.6 to 31.4 points for four of six fine-tunes), and the project page says to treat the models as research only. The publisher discloses its residual risks, which keeps the score at 2 and not lower."
      evidence_refs:
      - ev-project-page
      - ev-paper
      - ev-card-70b
    performance:
      score: 2
      rationale: "Class-leading among fully open medical models on the publisher's numbers (Apertus-70B-MeditronFO 54.56 five-benchmark average against 48.35 for its base). It is behind the open-weight MedGemma-27B (63.75 average, 54.8 HealthBench against 49.3), a smaller model. Part of the HealthBench gain is a length effect (40.3 against 35.7 for the base after length adjustment). All figures are publisher-run with an LLM grader, no independent re-run exists, and the arXiv paper v2 reports different numbers (47.2 to 53.8) from the cards."
      evidence_refs:
      - ev-card-70b
      - ev-project-page
      - ev-paper
    operational:
      score: 3
      rationale: "Standard transformers architecture class supported since transformers 4.56 per the base card, BF16 safetensors, a chat template and recommended sampling settings in generation_config, and community GGUF and MLX conversions for both sizes. The score stops short of 4 because the publisher gives no serving or VRAM guidance (sizes here are derived from the file list), the 70B needs multi-GPU hardware, and the conversions are community-made and unverified."
      evidence_refs:
      - ev-card-70b
      - ev-base-card
      - ev-quants
      - ev-hf-meta
    governance:
      score: 3
      rationale: "An identifiable university laboratory (EPFL LiGHT) with a named team, Swiss AI Initiative and CSCS funding, a contact address, a community tab and commits through 2026-11-17. The score is held at 3. There is no security or vulnerability policy (SECURITY.md is 404) and no deprecation policy, weights were swapped in place without version tags, and the arXiv paper is out of step with the current cards and code."
      evidence_refs:
      - ev-hf-meta
      - ev-github-readme
      - ev-website

# --- Assessed signals: five cross-cutting attributes highlighted at the top of the entry.
signals:
  trainability:
    level: partial
    dimension: openness
    summary: "Most of the pipeline can be fine-tuned and rebuilt from public parts (weights, 533,888-row corpus, data-generation and training configs), but intermediate data and the MOOVE vignettes are not released, so full from-scratch reproduction is not yet possible."
    refs: [ev-github-readme, ev-data-card]
  knowledge_structure:
    level: moderate
    dimension: performance
    summary: "English-only medical knowledge in a standard decoder with a 65,536-token configured window but only 8,192-token fine-tuning sequences, so long-record retrieval behaviour is untested."
    refs: [ev-card-70b, ev-hf-meta]
  specialization:
    level: strong
    dimension: openness
    summary: "The release is itself a specialisation recipe: Apache-declared weights, an open corpus and Axolotl training configs that the publisher applied to five bases, so adapting it or the recipe to a local setting is well supported."
    refs: [ev-github-readme, ev-card-70b]
  exchangeability:
    level: medium
    dimension: operational
    summary: "Standard safetensors and a chat template make it portable across Hugging Face based stacks, but it needs a recent transformers for the Apertus architecture and the 70B is heavy; community GGUF and MLX conversions are unverified."
    refs: [ev-card-70b, ev-base-card, ev-quants]
  misuse_exposure:
    level: unbenchmarked
    dimension: safety
    summary: "No jailbreak, misuse or red-team evaluation exists, and the publisher's own clinical-safety judging is low-agreement; medical misuse and confident wrong advice are the exposed risks."
    refs: [ev-project-page, ev-paper]

