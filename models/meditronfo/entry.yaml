ownership:
  level: partial
  factors:
    use_modify:
      level: moderate
      rationale: "Apache-2.0 is declared and the weights are ungated and fine-tunable. The declaration sits in metadata only, with no LICENSE file, a paper that calls the corpus research-use, flagged source-dataset terms and a base acceptable-use policy of unclear reach, so the chain of title is unresolved."
    transparency:
      level: strong
      rationale: "Weights, a 533,888-row corpus with source fields and the generation, training and evaluation code are public on a fully open base (open_weights_recipe), with the unreleased intermediates and MOOVE vignettes listed in the README."
    reliability:
      level: weak
      rationale: "Safety is 2: no safety tuning, publisher-only low-agreement safety judging and no guard or red-team, and the publisher says not to use it for patient decisions, so it is not safe to deploy as presented."
    data_control:
      level: strong
      rationale: "Self-hosted BF16 safetensors run on the deployer's own hardware with no telemetry or licence clawback in the declared Apache-2.0 grant."
  verdict: "Ownership is partial. The release is an inspectable medical fine-tune that can be run, adapted and audited on the deployer's own hardware, and the pipeline behind it is public. It is not a clinically usable or clearly licensed product: the publisher bars patient decisions, there is no LICENSE file, the corpus licence is stated two ways, and safety evaluation is thin. Ownership moves to substantial if EPFL ships a LICENSE file and reconciles the corpus licence, and a deployer adds an independent clinical safety evaluation."

# --- Evidence. Grounded 2026-11-19 against docs/primary-sources/meditronfo/_sources.md.
evidence:
- id: ev-card-70b
  claim: "The Apertus-70B-MeditronFO model card declares licence tag apache-2.0 and an Apache 2.0 link in the header. The base is swiss-ai/Apertus-70B-Instruct-2509 as a finetune, trained on the 533,888-example Fully Open Meditron corpus with every answer written by gpt-oss-120b, for 1 epoch at learning rate 1e-5 on 16 nodes of 4 GH200 for 199 GPU-hours. The benchmark table gives an average of 54.56 against 48.35 for the base and HealthBench 49.3. A limitations paragraph says the content may be inaccurate or biased, the model is specialised for Medicine and intended for medicine related tasks evaluation, and it should be an assistive tool and not a definitive source."
  source_type: publisher
  doc_type: model_card
  retrieved: true
  url: https://huggingface.co/EPFLiGHT/Apertus-70B-MeditronFO
  date: '2026-11-19'
- id: ev-card-8b
  claim: "The Apertus-8B-MeditronFO model card (partial extracts) has the same template and licence tag, base swiss-ai/Apertus-8B-Instruct-2509, a five-benchmark average of 48.26 against 42.39 for the base, and preference over the base in 74.2 percent of AutoMOOVE comparisons."
  source_type: publisher
  doc_type: model_card
  retrieved: true
  url: https://huggingface.co/EPFLiGHT/Apertus-8B-MeditronFO
