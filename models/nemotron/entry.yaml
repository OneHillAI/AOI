# OneHill v2 MODEL library entry for NVIDIA Nemotron 3. New entry.
# Validated against schema/model.v2.schema.json.
#   scores    -> scripts/score.py --write        (AOI headline/grade)
#   meters    -> scripts/completeness.py --write  (per-domain completeness/originality)
#   prose     -> assess.md / implement.md / use.md / support.md (sections keyed <!-- item: KEY -->)

schema_version: '2.0'
id: nemotron
name: NVIDIA Nemotron 3
aliases:
- Nemotron 3
- Nemotron-3
- NVIDIA Nemotron
- nvidia/NVIDIA-Nemotron-3-Super-120B-A12B
- nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B
publisher:
  name: NVIDIA
  country: US
  accountable_entity: true
  url: https://huggingface.co/nvidia
  security_contact: https://www.nvidia.com/en-us/security/
summary: 'NVIDIA Nemotron 3 is a family of open, agent-focused Mixture-of-Experts hybrid
  Mamba-Transformer models spanning a real size ladder: Nano (30B total / 3.5B active),
  Super (120B / 12B), Ultra (550B / 55B) and the multimodal Nano Omni (31B / ~3B, video/
  audio/image in), most with a context window up to 1M tokens. It is one of the more genuinely
  open releases in the registry: ungated safetensors weights, runnable training recipes, a
  white paper, and post-training datasets under CC-BY-4.0 - so it reaches the open_weights_recipe
  tier, not merely open_weights. Two things stop it short of fully open and cap ownership. First,
  the training corpus is only PARTIALLY released: the official recipes "train exclusively on the
  open-sourced subset of training data" and NVIDIA''s commitment is hedged to "all data for which
  we hold redistribution rights", with the pretraining web corpus under a custom NVIDIA data
  licence, so the model is not reproducible. Second, the licence is not shared across the family
  and is not OSI: Super and Nano use the NVIDIA Nemotron Open Model License, Ultra uses OpenMDW 1.1,
  and Nano Omni uses the NVIDIA Open Model Agreement; the base NVIDIA licence is highly permissive
  commercially but revocable, carries a Trustworthy-AI use restriction, and auto-terminates on
  guardrail-circumvention or IP litigation. The standout strength is safety: NVIDIA ships downloadable
  guard classifiers (Nemotron-3-Content-Safety, Aegis), an Apache-2.0 guardrails toolkit (NeMo
  Guardrails) and an Apache-2.0 red-team scanner (garak), which exceed the open-weights norm - though
  the model-level safety scores are NVIDIA self-reported.

  '
variants:
- name: NVIDIA-Nemotron-3-Nano-30B-A3B
  params_total: 30B
  params_active: 3.5B
  context_window: 1M
  kind: reasoning
  safety_tuned: true
- name: NVIDIA-Nemotron-3-Super-120B-A12B
  params_total: 120B
  params_active: 12B
  context_window: 1M
  kind: reasoning
  safety_tuned: true
- name: NVIDIA-Nemotron-3-Ultra-550B-A55B
  params_total: 550B
  params_active: 55B
  context_window: 1M
  kind: reasoning
  safety_tuned: true
- name: Nemotron-3-Nano-Omni-30B-A3B
  params_total: 31B
  params_active: 3B
  context_window: 256k
  kind: instruct
  safety_tuned: true
openness:
  tier: open_weights_recipe
  components:
    weights: open
    training_data: partial
    training_code: open
    evaluation: partial
    documentation: open
    license: partial
  license:
    spdx: ''
    name: 'Family split: NVIDIA Nemotron Open Model License (Super/Nano); OpenMDW 1.1 (Ultra);
      NVIDIA Open Model Agreement (Nano Omni). All source-available, not OSI.'
    classification: open_weight
    commercial_use: allowed_with_conditions
    notable_restrictions:
    - Licence is NOT shared across the family (three distinct licences), so verify per variant -
      Super/Nano NVIDIA Nemotron Open Model License, Ultra OpenMDW 1.1, Nano Omni NVIDIA Open
      Model Agreement
    - Base NVIDIA Open Model License is highly permissive commercially (perpetual, royalty-free,
      sell/distribute; NVIDIA claims no output ownership) but REVOCABLE and source-available, not OSI
    - Use must stay consistent with NVIDIA's Trustworthy AI terms; the licence auto-terminates on
      circumventing safety guardrails or initiating IP litigation over the Model; NVIDIA reserves
      the right to update terms
    url: https://www.nvidia.com/en-us/agreements/enterprise-software/nvidia-nemotron-open-model-license/
provenance:
  canonical_source: https://huggingface.co/nvidia
  verified_org_on_primary_host: true
  formats:
  - safetensors
  integrity:
    checksums: true
    signed: false
    signing_tech: ''
    provenance_attestation: false
  mirrors_and_quants:
    acknowledged: true
    notable:
    - name: Official BF16 / FP8 / NVFP4 quantizations (nvidia)
      trust: publisher
      note: NVIDIA publishes official BF16, FP8 and NVFP4 variants for each model; pin the revision
        and verify checksums
  checkpoint_checklist_score: 4
  scanner_result: {}
  incidents: []
eu_ai_act:
  is_gpai: true
  systemic_risk:
    designated: false
    training_flops_estimate: 'Not published. Only training-token counts are disclosed (conflicting:
      Super/Nano ~25T, Ultra ~20T, Nano Omni ~717B); no absolute FLOP or GPU-hour figure appears in
      the white paper abstract, model cards, or blogs read. The Ultra 550B / 55B-active systemic-risk
      (1e25 FLOP) question is UNDETERMINABLE from the disclosed figures.'
    over_1e25_threshold: null
    article_55_docs_available: n/a
  open_source_exemption:
    license_qualifies: uncertain
    rationale: 'NVIDIA publishes weights, recipes, a white paper and partial training data, which is
      more than most, but the governing licences are source-available and not OSI, the base NVIDIA
      licence is revocable and carries a Trustworthy-AI use restriction, and Ultra sits under a
      different licence (OpenMDW 1.1) again. A revocable, use-restricted, non-OSI licence most likely
      does NOT reach the EU AI Act open-source exemption; and the systemic-risk duties would still bind
      if Ultra crosses 1e25 FLOP, which is undeterminable because the training compute is unpublished.
      Recorded as ''uncertain'' pending the full Article 53/55 analysis and the per-variant licence
      texts.

      '
  provider_package:
    technical_documentation: partial
    downstream_information: partial
    copyright_policy: 'no'
    training_content_summary: partial
    code_of_practice_signatory: false
  deployer_notes: 'NVIDIA (US-based) provides more than most - a white paper, runnable recipes, and
    partially released, partly CC-BY-4.0 training data - so an EU deployer inherits a real information
    base. But there is no formal EU AI Act GPAI documentation package, no copyright policy, NVIDIA is
    not a GPAI Code of Practice signatory, the training corpus is not fully released, and the licence
    is revocable with a Trustworthy-AI use restriction. The per-variant licence split (Super/Nano vs
    Ultra vs Nano Omni) means an EU deployer must map obligations per variant. Ultra''s systemic-risk
    status is unresolved because training compute is undisclosed.

    '
  last_assessed: '2026-08-02'
performance: {}
behaviour: {}
safety: {}
deployment:
  ceiling_tier: T3
  ceiling_conditional: true
  hardware_notes: 'A real size ladder, unlike most frontier-scale families: Nano (30B / 3.5B active)
    is genuinely portable and runs on modest single-GPU hardware; Super (120B / 12B) is mid-tier;
    Ultra (550B / 55B) needs a multi-GPU / multi-node cluster. Official BF16 / FP8 / NVFP4
    quantizations are published for each. Exact per-GPU VRAM is not restated here; size against the
    variant.

    '
  serving_support:
  - vllm
  - sglang
  - ollama
  - llama.cpp
  - nim
  controls_required:
  - Use NVIDIA's own safety stack, which is downloadable and Apache-licensed where noted - a guard
    classifier (Nemotron-3-Content-Safety / Aegis), the NeMo Guardrails toolkit for input/output/
    action rails, and the garak red-team scanner for pre-deployment testing
  - Run garak (or equivalent) red-team for THIS use case before autonomous deployment; the base-model
    safety methodology is not independently verified and the guard-classifier scores are NVIDIA
    self-reported
  - Confirm which licence governs the exact variant (Super/Nano NVIDIA Nemotron OML, Ultra OpenMDW 1.1,
    Nano Omni NVIDIA Open Model Agreement) and note the Trustworthy-AI use restriction and the
    revocable, auto-terminating grant
  - Verify checksums and pin the exact nvidia revision; for Ultra, treat EU AI Act systemic-risk status
    as unresolved (training compute undisclosed) and assess before high-stakes EU use
score:
  rubric_version: '1.1'
  headline: 69.2
  grade: C
  hard_flags: []
  dimensions:
    openness:
      score: 4
      rationale: 'Open weights plus recipe: ungated safetensors weights, runnable training recipes on
        GitHub, a white paper, and post-training datasets genuinely under CC-BY-4.0 put this at the
        open_weights_recipe tier - materially more open than the open-weights norm. Short of 5 (fully
        open) because the training corpus is only partially released: the official recipes "train
        exclusively on the open-sourced subset of training data", NVIDIA''s commitment is hedged to
        "all data for which we hold redistribution rights", and the pretraining web corpus is under a
        custom NVIDIA data licence, so the model is not reproducible.

        '
      evidence_refs:
      - ev-nem-data
      - ev-nem-report
    provenance:
      score: 3
      rationale: 'Distributed from the verified nvidia org on Hugging Face as ungated safetensors with
        official BF16 / FP8 / NVFP4 quantization variants and a clear canonical source (checklist
        ~4/8). Meets the score-3 anchor; short of 4 because published checksums, checkpoint scanning
        and a documented signing/attestation policy were not verified this pass, and short of 5''s
        cryptographic weight signing / SLSA provenance.

        '
      evidence_refs:
      - ev-nem-provenance
      - ev-nem-cards
    legal:
      score: 3
      rationale: 'A clear, commercially permissive grant for common uses (perpetual, royalty-free,
        sell/distribute, NVIDIA claims no output ownership) with partially released and partly CC-BY
        training data - better documented than most. Held at 3 by real caveats: the licences are
        source-available not OSI and split three ways across the family, the base grant is revocable
        with a Trustworthy-AI use restriction and a guardrail-circumvention/IP-litigation
        auto-termination, there is no copyright policy or formal EU training-content summary, and
        NVIDIA is not a GPAI Code of Practice signatory.

        '
      evidence_refs:
      - ev-nem-oml
      - ev-nem-eu
    safety:
      score: 4
      rationale: 'A genuine strength for an open family. NVIDIA ships downloadable, commercially usable
        guard/moderation classifiers (Nemotron-3-Content-Safety on Gemma-3-4B, 23 categories / 12
        languages; Aegis), an Apache-2.0 programmable-guardrails toolkit (NeMo Guardrails), and an
        Apache-2.0 red-team scanner (garak), with published taxonomies and datasets - meeting the
        companion-guard-model anchor with residual-risk disclosure across domains. Short of 5 because
        the classifier and model-level safety scores are NVIDIA self-reported (no independent
        third-party red-team) and the base card lacks a filled safety/alignment section.

        '
      evidence_refs:
      - ev-nem-safety
      - ev-nem-cards
    performance:
      score: 3
      rationale: 'Competitive frontier-scale open family (hybrid Mamba-Transformer LatentMoE, up to 1M
        context, trained on ~25T tokens) presented across a Nano-to-Ultra ladder. Held at 3, not
        higher, because the evidence here is publisher and architectural (model cards + white paper);
        OneHill has not reproduced benchmarks and no independent third-party re-runs were gathered this
        pass, so class-leading claims are not verified.

        '
      evidence_refs:
      - ev-nem-cards
      - ev-nem-report
    operational:
      score: 4
      rationale: 'Broad, mature serving story: vLLM, SGLang, Ollama, llama.cpp and NVIDIA''s own NIM
        self-hosted microservices, with official BF16 / FP8 / NVFP4 quantizations and, crucially, a
        real size ladder including a genuinely small Nano (30B / 3.5B active) that runs on modest
        hardware. Short of 5 because exact hardware/scaling guidance was not verified per variant and
        day-0 ecosystem breadth is publisher-reported.

        '
      evidence_refs:
      - ev-nem-nim
      - ev-nem-cards
    governance:
      score: 3
      rationale: 'A reputable, accountable publisher (NVIDIA) with a white paper, a verified hub
        presence and an active release cadence, and a general corporate security-reporting path. Held
        at 3 because a model-specific vulnerability-disclosure and deprecation policy was not confirmed
        and NVIDIA is not a GPAI Code of Practice signatory.

        '
      evidence_refs:
      - ev-nem-cards
      - ev-nem-eu

# --- Assessed signals: five cross-cutting attributes highlighted at the top of the entry.
signals:
  trainability:
    level: partial
    dimension: openness
    summary: "Fine-tune and even run NVIDIA's released recipes, with post-training data under CC-BY-4.0 - but the recipes train on the open subset only and the full corpus is under custom NVIDIA data licences, so you can adapt, not fully reproduce."
    refs: [ev-nem-data, ev-nem-report]
  knowledge_structure:
    level: moderate
    dimension: performance
    summary: "Frontier-scale hybrid Mamba-Transformer MoE with up to 1M context across a Nano-to-Ultra ladder; capable and well-documented, but not independently benchmarked in this pass, so treat class-leading claims as publisher-reported."
    refs: [ev-nem-cards, ev-nem-report]
  specialization:
    level: strong
    dimension: openness
    summary: "Built for agent specialisation: released runnable recipes, CC-BY post-training datasets, downloadable guard models, and a small Nano variant make domain adaptation genuinely accessible, not just theoretically permitted."
    refs: [ev-nem-data, ev-nem-safety]
  exchangeability:
    level: high
    dimension: operational
    summary: "Portable safetensors across vLLM/SGLang/Ollama/llama.cpp/NIM with official quantizations and a real size ladder - the Nano (30B / 3.5B active) is a near-drop-in single-GPU model, unusual at this capability level."
    refs: [ev-nem-nim, ev-nem-cards]
  misuse_exposure:
    level: partial
    dimension: safety
    summary: "Misuse is actively mitigated and partly characterised: downloadable guard classifiers, a guardrails toolkit and the garak red-team scanner exist, but the evaluations are NVIDIA self-reported and no independent red-team was gathered."
    refs: [ev-nem-safety, ev-nem-cards]

