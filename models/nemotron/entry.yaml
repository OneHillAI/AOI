ownership:
  level: partial
  factors:
    use_modify:
      level: moderate
      rationale: "The NVIDIA licences are commercially permissive (perpetual, royalty-free, sell/distribute; NVIDIA claims no output ownership) and weights are ungated and fine-tunable, but they are source-available community licences with real restrictions - revocable, a Trustworthy-AI use requirement, guardrail-circumvention/IP-litigation auto-termination - and they are split three ways across the family (Super/Nano vs Ultra's OpenMDW 1.1 vs Nano Omni), which is exactly the open-weight-with-conditions case, not a clean permissive grant."
      # grounded in: ev-nem-oml (license, retrieved operative clauses) - revocable Section 2.2 grant + Trustworthy-AI Section 2.3 + auto-termination; ev-nem-cards - per-variant licence tags
    transparency:
      level: strong
      rationale: "Unusually inspectable for the registry: ungated weights, a white paper, runnable training recipes, and partially released post-training data under CC-BY-4.0 let you see a great deal of how the model was built. The limit is reproducibility, not visibility - the full corpus is not released - which caps the openness tier, not transparency."
      # grounded in: ev-nem-data (training_data, retrieved) - released recipes + CC-BY post-training datasets; ev-nem-report (technical_report, retrieved abstract/blogs) - white paper
    reliability:
      level: strong
      rationale: "Performance, operational and safety all sit at or above 3 with operational and safety at 4: a competitive frontier-scale family, broad serving with a small portable variant, and downloadable guard/guardrail/red-team tooling. Under the ownership rule (all three >= 3, two at >= 4, none <= 2) this is strong; the caveat is that safety scores are self-reported."
      # grounded in: dimension scores performance 3 / operational 4 / safety 4; ev-nem-safety, ev-nem-nim
    data_control:
      level: moderate
      rationale: "Self-hosted via NIM the weights and inference run on your own infrastructure and data never leaves your enclave, which would be strong - but the base NVIDIA licence is explicitly revocable and reserves NVIDIA's right to update terms and to auto-terminate, a rights claw-back that holds this at moderate. The hosted build.nvidia.com preview is worse (reserves use of content to improve NVIDIA models) and is an evaluation surface only."
      # grounded in: ev-nem-nim (deployment, retrieved) - self-hosted, data stays in your enclave; ev-nem-oml (license, retrieved) - revocable grant / right to update; ev-nem-nim - preview API 3.3 reserves use to improve models
  verdict: "You get unusually strong transparency for an open model - ungated weights, a white paper, runnable recipes and CC-BY post-training data - and a reliable, well-served family with a rare genuinely-small variant and real, downloadable safety tooling. Ownership stays partial, not substantial, because the corpus is only partly released (not reproducible) and the governing licences are source-available, split three ways, and revocable with a Trustworthy-AI use restriction, which caps both use-and-modify and data-control at moderate. Self-host via NIM for data control, confirm which of the three licences governs your exact variant, and treat Ultra's EU systemic-risk status as unresolved until NVIDIA discloses training compute."

