    by PRC law. No open-source exemption on the licence axis, no copyright policy or training-content
    summary, and the commercial-use registration and "Built with glm-4" / name-prefix duties bind
    downstream. For new work prefer the MIT GLM line (the `glm` entry), where none of this applies.

    '
  last_assessed: '2026-08-03'
