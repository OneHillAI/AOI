summary: 'The original GLM-4-9B-Chat (THUDM, mid-2024) is a 9B dense chat model (with a 128K variant and a 1M-context GLM-4-9B-Chat-1M) that predates Zhipu''s move to MIT. It is a separate entry from the current MIT GLM line (the `glm` entry) because its weights are governed by the custom, non-OSI "glm-4" licence, which is materially more restrictive than anything in the MIT cluster. The copyright grant is "non-exclusive, worldwide, non-transferable, non-sublicensable, REVOCABLE, royalty-free". It is free for academic research, but users who want commercial use must complete a registration form ("Registered users are free to use this model for commercial activities"). On distribution or provision it requires displaying "Built with glm-4" and prefixing derived AI model names with "glm-4". It forbids military/illegal/national-security-endangering use and is governed by PRC law, with disputes to Beijing''s Haidian District People''s Court. A revocable, registration-gated grant with a name-prefix rule takes use-and-modify to weak and ownership to limited, the low end of the GLM family. The model is also dated: a 2024 9B succeeded for new work by GLM-4-9B-0414 and the 4.5/4.6 line. Use it only if you specifically need this checkpoint, complete the commercial registration, and honour the licence.'
variants:
- name: GLM-4-9B-Chat
  params_total: 9B
  context_window: 128k
  kind: instruct
  safety_tuned: true
- name: GLM-4-9B-Chat-1M
  params_total: 9B
  context_window: 1M
  kind: instruct
  safety_tuned: true
