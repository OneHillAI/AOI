        variant''s memory demands add friction.

        '
      evidence_refs:
      - ev-glm9-card
    governance:
      score: 3
      rationale: 'Active, named publisher (Zhipu AI / THUDM) with a verified org and a licence contact
        (license@zhipuai.cn), meeting the score-3 anchor. Held down by the absence of a published
        vulnerability-disclosure process, the revocable licence, and China-origin policy restrictions
        some organisations apply.

        '
      evidence_refs:
      - ev-glm9-card
      - ev-glm9-license
