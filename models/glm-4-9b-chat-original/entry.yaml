    legal:
      score: 2
      rationale: 'The worst legal position in the GLM family: a non-OSI licence that is REVOCABLE, gates commercial use behind registration, restricts fields of use, mandates "Built with glm-4" and a name prefix, and is governed by PRC law (Haidian court). There is no EU copyright policy or training-content summary and no open-source exemption. Commercial use is possible after registration, which is why the score is 2 and not 1. Revocability is the key risk and the reason ownership is only limited.'
      evidence_refs:
      - ev-glm9-license
      - ev-glm9-eu
    safety:
