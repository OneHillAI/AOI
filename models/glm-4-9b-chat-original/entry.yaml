    license_qualifies: 'no'
    rationale: "The glm-4 licence is not a free-and-open-source licence: it is revocable, gates commercial use behind registration, and imposes field-of-use and naming restrictions. The Article 53 open-source exemption therefore does not apply on the licence axis. The model is not systemic-risk. The transparency obligations are not exemption-covered, and no copyright policy or public training-content summary is published."
