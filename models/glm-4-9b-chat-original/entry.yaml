    classification: custom
    commercial_use: allowed_with_conditions
    notable_restrictions:
    - 'Non-OSI custom licence. The grant is REVOCABLE ("non-exclusive, worldwide, non-transferable, non-sublicensable, revocable, royalty-free"), so the publisher can withdraw it'
    - 'Commercial use is registration-gated: "For users who wish to use the models for commercial purposes, please do so [here] Complete registration. Registered users are free to use this model for commercial activities, but must comply with all terms and conditions of this license." Academic research is free. The registration form (open.bigmodel.cn/mla/form) resolves.'
    - 'On distributing or providing the materials, or products or services using them, the licence says you "should" provide a copy of the agreement and prominently display "Built with glm-4". If you use the materials to create, train or improve a distributed or available AI model, you "should also add ''glm-4'' to the beginning of any such AI model name". The licence also bars military or illegal purposes and endangering national security and unity.'
    - "Governed by PRC law; disputes to Beijing's Haidian District People's Court; contact license@zhipuai.cn"
    url: https://huggingface.co/THUDM/glm-4-9b-chat/raw/main/LICENSE
