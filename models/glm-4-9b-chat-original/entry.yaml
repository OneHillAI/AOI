summary: 'The original GLM-4-9B-Chat (THUDM, mid-2024) - a 9B dense chat model (with a 128K variant and a
  1M-context GLM-4-9B-Chat-1M) that predates Zhipu''s move to MIT. It is a separate entry from the
  current MIT GLM line because its weights are governed by the custom, non-OSI "glm-4" licence, which is
  materially more restrictive than anything in the MIT cluster (the `glm` entry): the copyright grant is
  "non-exclusive, worldwide, non-transferable, non-sublicensable, REVOCABLE, royalty-free" - free for
  academic research, but "commercial users must complete registration" before any business use - and it
  requires displaying "Built with glm-4", prefixing derivative model names with "glm-4", forbids
  military/illegal/national-security-endangering use, and is governed by PRC law with disputes to
  Beijing''s Haidian District People''s Court. A revocable, registration-gated grant with a name-prefix
  rule takes use-and-modify to weak and ownership to limited - the low end of the GLM family. The model
  is also simply dated: a 2024 9B superseded by the GLM-4-9B-0414 and the 4.5/4.6 line for new work.
  Use it only if you specifically need this checkpoint, complete the commercial registration, and honour
  the licence.

  '
