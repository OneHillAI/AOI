# OneHill v2 MODEL library entry for the ORIGINAL GLM-4-9B-Chat (THUDM, mid-2024). Split from the
# aggregate glm entry on the LICENCE axis: the original 9B chat models are governed by the custom,
# NON-OSI "glm-4" licence - revocable, commercial-registration-gated, with use restrictions and a
# name-prefix rule - NOT the MIT licence of the GLM-4.5/4.6/0414 series (the `glm` entry). That licence
# is the divergence, and it is severe enough to drop use-and-modify to weak and ownership to limited.
# Validated against schema/model.v2.schema.json.

