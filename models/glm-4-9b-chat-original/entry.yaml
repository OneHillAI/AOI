ownership:
  level: limited
  factors:
    use_modify:
      level: weak
      rationale: "The glm-4 licence is non-OSI and REVOCABLE, gates commercial use behind a registration form, forbids military/illegal/national-security use, and forces every derivative to display 'Built with glm-4' and to prefix its name with 'glm-4'. This is the weakest use-and-modify position in the GLM family."
      # grounded in: ev-glm9-license (license, retrieved) - glm-4 licence Sec 2/3, revocable + commercial registration + naming
    transparency:
      level: moderate
      rationale: "Weights are inspectable and there is a model card, but training data and code are closed and the model carries China-aligned alignment you cannot inspect - open weights but closed process, so moderate."
      # grounded in: ev-glm9-card (model_card) - open weights, closed data/code; ev-glm9-behaviour (third_party) - China-aligned alignment
    reliability:
      level: moderate
      rationale: "Performance 2 (dated, succeeded by newer models), operational 4, safety 3: runnable and broadly supported, but the below-average current capability holds reliability to moderate."
      # grounded in: dimension scores performance 2 / operational 4 / safety 3
    data_control:
      level: moderate
      rationale: "Self-hosting keeps your processing local, but the licence grant is revocable and commercial use hinges on a registration the publisher controls, so your control over continued use is contingent and not assured. Moderate and not strong."
      # grounded in: ev-glm9-license (license, retrieved) - revocable grant, registration-gated commercial use
  verdict: "You have only limited ownership of the original GLM-4-9B-Chat. The custom glm-4 licence is revocable, gates commercial use behind registration, restricts fields of use, and forces a 'glm-4' name prefix and 'Built with glm-4' attribution on every derivative. Use-and-modify is therefore weak and continued-use control is contingent. Combined with dated capability, ownership lands at limited, the low end of the GLM family and well below the MIT GLM line (the `glm` entry, substantial). Use this checkpoint only if you specifically need it: complete the commercial registration, honour the naming and field-of-use terms, and account for the revocable grant. Otherwise adopt the MIT GLM models."
