ownership:
  level: partial
  factors:
    use_modify:
      level: moderate
      rationale: "Non-EU users may use and modify commercially below 700M MAU, subject to the AUP and \"Built with Llama\" naming, so moderate. For EU-domiciled individuals and companies the multimodal licence is not granted, so their use and modification is effectively none. Moderate is the global score; the EU carve-out applies on top for EU entities."
      # grounded in: ev-l4-license + ev-l4-aup (license/terms, retrieved) - EU-multimodal carve-out, 700M-MAU, naming
    transparency:
      level: moderate
      rationale: "Weights are inspectable and documentation is strong, but training data and code are closed. Open weights with a closed process score moderate."
      # grounded in: ev-l4-card (model_card) - open weights + strong docs; data/code closed
    reliability:
      level: strong
      rationale: "Performance 4, operational 5 and safety 4: capable multimodal models, the broadest serving support and a first-party guard stack (Llama Guard, Prompt Guard). All three are at or above 4, so reliability is strong."
      # grounded in: dimension scores performance 4 / operational 5 / safety 4
    data_control:
      level: moderate
      rationale: "Self-hosting keeps data local, with no telemetry or clawback. The access gate and the EU-multimodal carve-out make the right to use the model conditional on domicile and licence acceptance, so moderate."
      # grounded in: ev-l4-license (license, retrieved) - access gate + EU carve-out; self-host no telemetry
  verdict: "For non-EU users you partially own self-hosted Llama 4. It runs on your infrastructure, performs strongly and pairs with Llama Guard and Prompt Guard, so reliability is strong. The 700M-MAU trigger, naming conditions and access gate keep use-and-modify at moderate, so ownership is partial. For EU-domiciled individuals and companies the licence grants nothing for the multimodal models, so effective ownership is none; prefer the Llama 3.1 text line (the meta-llama entry, no EU clause) or a non-Llama family. All users should check the 700M-MAU trigger, honour the Llama attribution terms and confirm domicile against the AUP."
evidence:
- id: ev-l4-license
  claim: "The Llama 4 Community License (version effective 5 April 2025) sets a 700M-MAU threshold under Section 2, \"Additional Commercial Terms\" (\"greater than 700 million monthly active users in the preceding calendar month, you must request a license from Meta\"). It also has a \"Built with Llama\" attribution clause, California governing law and the incorporated AUP, which carries the EU multimodal restriction. The licence body contains no EU clause. The text is the same on Meta's GitHub mirror (meta-llama/llama-models) and the live dev.meta.ai page."
  source_type: publisher
  doc_type: license
  retrieved: true
  url: https://dev.meta.ai/llama/llama4/license/
  date: '2026-11-19'
- id: ev-l4-aup
  claim: "The Llama 4 Acceptable Use Policy states: \"With respect to any multimodal models included in Llama 4, the rights granted under Section 1(a) ... are not being granted to you if you are an individual domiciled in, or a company with a principal place of business in, the European Union. This restriction does not apply to end users of a product or service that incorporates any such multimodal models.\" The paragraph sits in the AUP, not in the licence body. The AUP also lists five prohibited-use categories (numbered 1, 3, 4, 5, 6 in the source file) and the LlamaUseReport@meta.com reporting path. The 3.1 AUP omits the EU clause. The 3.2 and 3.3 AUPs carry it, and 3.3 is text-only, so it is moot there."
  source_type: publisher
  doc_type: terms
  retrieved: true
  url: https://dev.meta.ai/llama/llama4/use-policy/
  date: '2026-11-19'
- id: ev-l4-card
  claim: "The verified, access-gated meta-llama Hugging Face org hosts Llama 4: Scout (109B/17B, very long context), Maverick (400B/17B) and Behemoth (larger), all natively multimodal MoE models in safetensors with checksums. Hub metadata shows gated: manual and license: other with license_name: llama4. Scout and Maverick Instruct were last modified 2025-05-22, and the org has no Behemoth repo or newer repo. Bedrock, Vertex, Together and Groq host the models."
  source_type: publisher
  doc_type: model_card
  retrieved: true
  url: https://huggingface.co/meta-llama
  date: '2026-11-19'
- id: ev-l4-perf
  claim: "On public leaderboards Llama 4 Maverick is competitive among open multimodal models, and the family adds native multimodality and very long context. OneHill has not reproduced the results."
  source_type: third_party
  doc_type: third_party
  retrieved: false
  url: https://lmarena.ai/leaderboard
  date: '2026-08-03'
- id: ev-l4-safety
  claim: "Meta ships Llama Guard (input/output moderation) and Prompt Guard (prompt-injection and jailbreak detection) with the Llama family and documents safety tuning. No broad independent multimodal red-team is aggregated here."
  source_type: publisher
  doc_type: model_card
  retrieved: false
  url: https://huggingface.co/meta-llama
  date: '2026-08-03'
changelog:
- date: '2026-08-03'
  change: Initial entry - split from the aggregate `meta-llama` entry. Llama 4 (Scout/Maverick/Behemoth) is scored apart from the Llama 3.x text line because of a licence + scored divergence that bites - the incorporated AUP denies EU-domiciled individuals/companies any licence to the multimodal models (verbatim), and the large Llama 4 models are systemic-risk (>1e25) - dropping legal to 2 with a hard flag, and making EU-domiciled ownership effectively none. Non-EU ownership is partial. Licence/AUP read verbatim from Meta's canonical mirror; grounded 2026-08-03.
- date: '2026-09-21'
  change: 'Freshness re-verification. Llama 4 Community License''s 700M-MAU threshold and gating re-confirmed unchanged. One tool-limitation caveat: the licence''s EU-domicile multimodal carve-out in the Additional Terms section was truncated by the fetch tool and could not be re-read verbatim this pass - treated as unchanged pending a manual eyeball, not evidence of a change. No Behemoth GA or newer point release.'
- date: '2026-11-19'
  change: 'Freshness re-verification (59 days since the last check). Re-read the Llama 4 Community License and Acceptable Use Policy verbatim from Meta''s GitHub repository and the live dev.meta.ai pages (llama.com now redirects there). Resolved the September open item: the EU-domicile multimodal carve-out is the final paragraph of the AUP, not of the licence, and its text is unchanged; the licence body has no "Additional Terms" section (Section 2 is "Additional Commercial Terms", the 700M-MAU clause, unchanged). Built with Llama, the "Llama" model-name prefix and California law are unchanged. Hub metadata: both Instruct repos still gated manual, last modified 2025-05-22, no Behemoth and no newer repo in the meta-llama org. Corrections to wording only: the licence tag reads license: other with license_name llama4, and the AUP has five prohibited-use items (numbered 1, 3, 4, 5, 6), not six. No score, flag or ownership change. Meta''s newer open weights (Muse Glimmer, Muse Spark Open) are under the Muse name and are not Llama releases; see the refresh report.'
