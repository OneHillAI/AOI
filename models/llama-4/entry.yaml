# OneHill v2 MODEL library entry for Meta Llama 4. Split from the aggregate meta-llama entry on a
# LICENCE + scored divergence: Llama 4's Community Licence carries a restriction the Llama 3.x text
# models do not - the incorporated AUP denies EU-domiciled individuals/companies any licence to the
# MULTIMODAL models - and the large Llama 4 models exceed 1e25 FLOP (systemic-risk). That EU-multimodal
# carve-out drops legal to 2 and is a hard flag. Validated against schema/model.v2.schema.json.

schema_version: '2.0'
id: llama-4
name: Meta Llama 4 (multimodal)
aliases:
- Llama 4
- Llama 4 Scout
- Llama 4 Maverick
- Llama 4 Behemoth
- meta-llama/Llama-4
family:
  id: meta-llama
  name: Meta Llama
publisher:
  name: Meta
  country: United States
  accountable_entity: true
  url: https://huggingface.co/meta-llama
  security_contact: LlamaUseReport@meta.com
summary: "Llama 4 is Meta's natively multimodal mixture-of-experts generation: Scout and Maverick are released and Behemoth is the larger sibling. It has its own entry because the incorporated Acceptable Use Policy (AUP) states: \"with respect to any multimodal models included in Llama 4, the rights granted under Section 1(a) ... are not being granted to you if you are an individual domiciled in, or a company with a principal place of business in, the European Union\". End users of a downstream product are exempt. Llama 4 is multimodal, so EU-domiciled organisations have no licence to the models; the Llama 3.1 text models carry no such clause. The licence also keeps the 700M monthly-active-user commercial trigger and \"Built with Llama\" naming and attribution. The large models exceed the 1e25 FLOP systemic-risk threshold, which voids the open-source exemption. For non-EU users Llama 4 is a capable, well-supported multimodal family that pairs with Meta's Llama Guard and Prompt Guard. Ownership is partial, and effectively none for EU-domiciled use."
variants:
- name: Llama 4 Scout
  params_total: 109B
  params_active: 17B
  context_window: 10M
  kind: multimodal
  safety_tuned: true
- name: Llama 4 Maverick
  params_total: 400B
  params_active: 17B
  context_window: 1M
  kind: multimodal
  safety_tuned: true
- name: Llama 4 Behemoth
  params_total: ~2T
  params_active: 288B
  context_window: unspecified
  kind: multimodal
  safety_tuned: true
openness:
  tier: gated_open
  components:
    weights: open
    training_data: closed
    training_code: closed
    evaluation: partial
    documentation: open
    license: partial
  license:
    spdx: LicenseRef-Llama-Community
    name: Llama 4 Community License
    classification: open_weight
    commercial_use: allowed_with_conditions
    notable_restrictions:
    - "Incorporated AUP, EU multimodal carve-out: the rights granted \"are not being granted to you if you are an individual domiciled in, or a company with a principal place of business in, the European Union\" for any multimodal models in Llama 4. Llama 4 is multimodal, so EU-domiciled entities get no licence. Downstream end users are exempt."
    - '700M-MAU commercial trigger: "if ... the monthly active users ... is greater than 700 million
      monthly active users in the preceding calendar month, you must request a license from Meta"'
    - "Naming and attribution: display \"Built with Llama\" and prefix derivative model names with \"Llama\". The AUP has five prohibited-use categories. California law governs, and download is access-gated (click-through) on Hugging Face."
    url: https://dev.meta.ai/llama/llama4/license/
provenance:
  canonical_source: https://huggingface.co/meta-llama
  verified_org_on_primary_host: true
  formats:
  - safetensors
  integrity:
    checksums: true
    signed: false
    signing_tech: ''
    provenance_attestation: false
  mirrors_and_quants:
    acknowledged: true
    notable:
    - name: bartowski / unsloth (GGUF quantizations)
      trust: community
      note: Widely mirrored/quantized; each mirror is a separate artifact whose trust equals its
        uploader, and use remains bound by the Llama 4 licence (including the EU-multimodal carve-out) -
        pin the meta-llama revision and verify checksums
    - name: Served on Bedrock / Azure / Vertex / Together / Groq
      trust: verified
      note: Major clouds host Llama 4; a hosted end-user product is the AUP-exempted path for EU end
        users (but not for EU-domiciled entities building on the weights)
  checkpoint_checklist_score: 5
  scanner_result: {}
  incidents: []
eu_ai_act:
  is_gpai: true
  systemic_risk:
    designated: false
    training_flops_estimate: '>1e25 FLOP for the large Llama 4 models (Maverick, Behemoth), placing them
      in systemic-risk territory; Scout is smaller. Meta publishes no absolute figures. The largest Llama 4 models are broadly understood to cross the presumption.'
    over_1e25_threshold: true
    article_55_docs_available: partial
  open_source_exemption:
    license_qualifies: 'no'
    rationale: "The Article 53 open-source exemption does not apply, for two reasons. The Llama 4 Community Licence is not FOSS: it carries the 700M-MAU trigger, naming and attribution, an AUP and the EU-multimodal carve-out. The large Llama 4 models are also systemic-risk (>1e25), which voids the exemption whatever the licence. The EU-multimodal carve-out leaves EU-domiciled entities with no licence to the models."
  provider_package:
    technical_documentation: partial
    downstream_information: partial
    copyright_policy: 'no'
    training_content_summary: 'no'
    code_of_practice_signatory: false
  deployer_notes: "The Llama 4 multimodal licence is not granted to individuals domiciled in, or companies with a principal place of business in, the EU, so an EU-domiciled organisation cannot license these models. Only downstream end users of someone else's product are exempt. Meta declined the EU GPAI Code of Practice and publishes no copyright policy or training-content summary, and the large models are systemic-risk. For EU-domiciled use, prefer the Llama 3.1 text models (the meta-llama entry, no EU clause) or a non-Llama family."
  last_assessed: '2026-08-03'
performance: {}
behaviour: {}
safety: {}
deployment:
  ceiling_tier: T3
  ceiling_conditional: true
  hardware_notes: "Mixture-of-experts multimodal models. Scout (109B total / 17B active) fits a single high-memory node or aggressive quantization. Maverick (400B/17B) needs multi-GPU infrastructure. Behemoth (~2T/288B active) is data-centre scale. Scout advertises up to 10M tokens of context, which is memory-intensive."
  serving_support:
  - vllm
  - transformers
  - bedrock
  - vertex
  controls_required:
  - "EU-domiciled entities: do not use the Llama 4 multimodal weights, because the licence is not granted to them. Confirm domicile and principal place of business against the AUP."
  - Check the 700M-MAU commercial trigger and honour the "Built with Llama" naming/attribution and the
    Acceptable Use Policy
  - Pair with Meta's Llama Guard and Prompt Guard (shipped with the family) and add your own
    input/output guardrails
  - Add prompt-injection defences and treat retrieved/tool content and input images as untrusted for
    agentic/multimodal use
score:
  rubric_version: '1.1'
  headline: 70.8
  grade: C
  hard_flags:
  - '🚩 EU AI Act / licence - the Llama 4 Community Licence denies EU-domiciled individuals and companies
    any licence to the multimodal models (verbatim AUP carve-out); the large Llama 4 models also exceed
    1e25 FLOP (systemic-risk), voiding the open-source exemption. Llama 3.x text models do not carry the
    EU carve-out.'
  dimensions:
    openness:
      score: 3
      rationale: "Weights are downloadable after click-through acceptance and documentation is strong, but training data and code are closed and the licence is conditional. That meets the gated-open anchor at 3 on access. Licence conditions are scored under legal."
      evidence_refs:
      - ev-l4-license
      - ev-l4-card
    provenance:
      score: 4
      rationale: "The canonical meta-llama org on Hugging Face is verified and access-gated. It distributes safetensors with checksums and per-version licence tags and has no malicious-checkpoint incident. The score is short of 5 because there is no cryptographic signing or provenance attestation."
      evidence_refs:
      - ev-l4-card
    legal:
      score: 2
      rationale: "The Community Licence is not OSI-approved and carries a 700M-MAU trigger and an AUP. Unlike the Llama 3.x text models, it denies EU-domiciled entities any licence to the multimodal models, and the large models are systemic-risk, which voids the open-source exemption. Non-EU users below 700M MAU can use it commercially, hence 2 and not 1. The EU carve-out is a hard flag and makes EU-domiciled ownership effectively none."
      evidence_refs:
      - ev-l4-license
      - ev-l4-aup
    safety:
      score: 4
      rationale: "Meta ships a first-party guard stack: Llama Guard for input/output moderation and Prompt Guard for prompt-injection and jailbreak detection, alongside documented safety tuning. The score is short of 5 because no independent, methodologically documented red-team is available to aggregate."
      evidence_refs:
      - ev-l4-safety
    performance:
      score: 4
      rationale: "Llama 4 Maverick is competitive among open multimodal models, and the family adds native multimodality and very long context. Capped at 4 because OneHill has not reproduced the benchmarks."
      evidence_refs:
      - ev-l4-perf
    operational:
      score: 5
      rationale: "Safetensors run on every major runtime and cloud endpoint (Bedrock, Vertex, Together, Groq), quantization is extensive and the toolchain is the broadest of any open family. The largest models need serious infrastructure, but tooling coverage is complete."
      evidence_refs:
      - ev-l4-card
      - ev-l4-perf
    governance:
      score: 3
      rationale: "Meta is a named, accountable US provider with a verified org and a reporting path (LlamaUseReport@meta.com), which meets the score-3 anchor. Meta declining the EU GPAI Code of Practice, the access gate and the EU-multimodal licensing restriction hold the score down."
      evidence_refs:
      - ev-l4-card
      - ev-l4-aup
