ownership:
  level: partial
  factors:
    use_modify:
      level: moderate
      rationale: "For non-EU users the Community Licence permits commercial use and modification below 700M MAU, with an AUP and 'Built with Llama' naming - moderate. But for EU-domiciled individuals/companies the multimodal licence is NOT granted at all, so their use-and-modify is effectively none. Scored moderate as the global position, with the EU carve-out flagged as decisive for EU entities."
      # grounded in: ev-l4-license + ev-l4-aup (license/terms, retrieved) - EU-multimodal carve-out, 700M-MAU, naming
    transparency:
      level: moderate
      rationale: "Weights are inspectable and documentation is strong, but training data and code are closed - open weights, closed process, so moderate."
      # grounded in: ev-l4-card (model_card) - open weights + strong docs; data/code closed
    reliability:
      level: strong
      rationale: "Performance 4, operational 5 and safety 4 (with first-party Llama Guard / Prompt Guard): capable multimodal models with the broadest serving and a real guard stack; all at or above 4, so reliability is strong."
      # grounded in: dimension scores performance 4 / operational 5 / safety 4
    data_control:
      level: moderate
      rationale: "Self-hosting keeps your data local with no telemetry or clawback, but the access gate and the EU-multimodal carve-out mean your right to use the model is conditional on domicile and licence acceptance - moderate."
      # grounded in: ev-l4-license (license, retrieved) - access gate + EU carve-out; self-host no telemetry
  verdict: "For non-EU users you partially own self-hosted Llama 4: it runs on your infrastructure, performs strongly as a multimodal family, and pairs with Meta's Llama Guard and Prompt Guard (reliability strong), but the Community Licence's 700M-MAU trigger, naming conditions, and access gate keep use-and-modify at moderate - ownership partial. For EU-domiciled individuals and companies the picture is worse: the licence denies you any grant to the multimodal models, so your effective ownership is none - prefer the Llama 3.1 text line (the meta-llama entry, no EU clause) or a non-Llama family. Either way, check the 700M-MAU trigger, honour the Llama attribution terms, and confirm your domicile against the AUP before use."
