  rubric_version: '1.1'
  headline: 70.8
  grade: C
  hard_flags:
  - '🚩 EU AI Act / licence - the Llama 4 Community Licence denies EU-domiciled individuals and companies
    any licence to the multimodal models (verbatim AUP carve-out); the large Llama 4 models also exceed
    1e25 FLOP (systemic-risk), voiding the open-source exemption. Llama 3.x text models do not carry the
    EU carve-out.'
  dimensions:
    openness:
      score: 3
      rationale: 'Gated-open tier: weights are downloadable (after click-through acceptance) with strong
        documentation, but training data and code are closed and the licence is conditional. Meets the
        gated-open/open-weights anchor at 3 on access, with the licence conditions scored under legal.

        '
      evidence_refs:
      - ev-l4-license
      - ev-l4-card
    provenance:
      score: 4
      rationale: 'Canonical, verified (and access-gated) meta-llama org on Hugging Face distributing
        safetensors with checksums and per-version licence tags; no malicious-checkpoint incident on the
        canonical org. Short of 5 for the absence of cryptographic signing / provenance attestation.

        '
      evidence_refs:
      - ev-l4-card
    legal:
      score: 2
      rationale: 'The weakest legal position in the Llama family: the Community Licence is non-OSI with a
        700M-MAU trigger and AUP, AND - unlike the Llama 3.x text models - denies EU-domiciled entities
        any licence to the multimodal models, AND the large models are systemic-risk (voiding the
        open-source exemption). Usable commercially for non-EU users below 700M MAU (hence a 2, not a
        1), but the EU carve-out is a hard flag and the reason EU-domiciled ownership is effectively
        none.

        '
      evidence_refs:
      - ev-l4-license
      - ev-l4-aup
    safety:
      score: 4
      rationale: 'A genuine strength: the family ships a first-party guard stack - Llama Guard
        (input/output moderation) and Prompt Guard (prompt-injection/jailbreak detection) - alongside
        documented safety tuning. Short of 5 without an independent, methodologically-documented
        red-team OneHill can aggregate.

        '
      evidence_refs:
      - ev-l4-safety
    performance:
      score: 4
      rationale: 'Llama 4 Maverick is competitive among open multimodal models, and the family adds
        native multimodality and very long context. Capped at 4 because OneHill has not independently
        re-run the benchmarks.

        '
      evidence_refs:
      - ev-l4-perf
    operational:
      score: 5
      rationale: 'First-class ecosystem support: safetensors on every major runtime and cloud endpoint
        (Bedrock, Vertex, Together, Groq), extensive quantization, and the broadest toolchain of any
        open family. The largest models need serious infrastructure but tooling coverage is complete.

        '
      evidence_refs:
      - ev-l4-card
      - ev-l4-perf
    governance:
      score: 3
      rationale: 'A named, accountable US provider (Meta) with a verified org and a reporting path
        (LlamaUseReport@meta.com), meeting the score-3 anchor. Held down by Meta declining the EU GPAI
        Code of Practice, the access gate, and the EU-multimodal licensing restriction.

        '
      evidence_refs:
      - ev-l4-card
      - ev-l4-aup
