# OneHill v2 MODEL library entry for Meta Llama 4. Split from the aggregate meta-llama entry on a
# LICENCE + scored divergence: Llama 4's Community Licence carries a restriction the Llama 3.x text
# models do not - the incorporated AUP denies EU-domiciled individuals/companies any licence to the
# MULTIMODAL models - and the large Llama 4 models exceed 1e25 FLOP (systemic-risk). That EU-multimodal
# carve-out drops legal to 2 and is a hard flag. Validated against schema/model.v2.schema.json.

schema_version: '2.0'
id: llama-4
name: Meta Llama 4 (multimodal)
aliases:
- Llama 4
- Llama 4 Scout
- Llama 4 Maverick
- Llama 4 Behemoth
- meta-llama/Llama-4
family:
  id: meta-llama
  name: Meta Llama
publisher:
  name: Meta
  country: United States
  accountable_entity: true
  url: https://huggingface.co/meta-llama
  security_contact: LlamaUseReport@meta.com
summary: 'Meta Llama 4 - the natively multimodal, mixture-of-experts generation: Scout and Maverick
  (released) and the larger Behemoth. It is a separate entry from the Llama 3.x text line (the
  meta-llama entry) because of a licence divergence that actually bites: the Llama 4 Community Licence
  incorporates an Acceptable Use Policy whose EU clause, read verbatim, states that "with respect to any
  multimodal models included in Llama 4, the rights granted under Section 1(a) ... are not being granted
  to you if you are an individual domiciled in, or a company with a principal place of business in, the
  European Union" (end users of a downstream product are exempted). Because Llama 4 is genuinely
  multimodal, that carve-out denies EU-domiciled organisations any licence to use these models at all -
  a hard restriction the Llama 3.1 text models do not carry. On top of that, the licence keeps the 700M
  monthly-active-users commercial trigger and "Built with Llama" naming/attribution, and the large Llama
  4 models exceed the 1e25-FLOP systemic-risk threshold, voiding the open-source exemption. For non-EU
  users Llama 4 is a strong, well-supported multimodal family paired with Meta''s Llama Guard / Prompt
  Guard; for EU-domiciled entities the multimodal licence gap is decisive. Ownership is partial (and
  effectively none for EU-domiciled use).

  '
variants:
- name: Llama 4 Scout
  params_total: 109B
  params_active: 17B
  context_window: 10M
  kind: multimodal
  safety_tuned: true
- name: Llama 4 Maverick
  params_total: 400B
  params_active: 17B
  context_window: 1M
  kind: multimodal
  safety_tuned: true
- name: Llama 4 Behemoth
  params_total: ~2T
  params_active: 288B
  context_window: unspecified
  kind: multimodal
  safety_tuned: true
openness:
  tier: gated_open
  components:
    weights: open
    training_data: closed
    training_code: closed
    evaluation: partial
    documentation: open
    license: partial
  license:
    spdx: LicenseRef-Llama-Community
    name: Llama 4 Community License
    classification: open_weight
    commercial_use: allowed_with_conditions
    notable_restrictions:
    - 'EU multimodal carve-out (verbatim, in the incorporated AUP): the rights granted "are not being
      granted to you if you are an individual domiciled in, or a company with a principal place of
      business in, the European Union" for any multimodal models in Llama 4. Since Llama 4 is
      multimodal, EU-domiciled entities get no licence (downstream end users are exempted)'
    - '700M-MAU commercial trigger: "if ... the monthly active users ... is greater than 700 million
      monthly active users in the preceding calendar month, you must request a license from Meta"'
    - 'Naming/attribution - display "Built with Llama" and prefix derivative model names with "Llama";
      Acceptable Use Policy with six prohibited-use categories; California governing law; download is
      access-gated (click-through) on Hugging Face'
    url: https://www.llama.com/llama4/license/
provenance:
  canonical_source: https://huggingface.co/meta-llama
  verified_org_on_primary_host: true
  formats:
  - safetensors
  integrity:
    checksums: true
    signed: false
    signing_tech: ''
    provenance_attestation: false
  mirrors_and_quants:
    acknowledged: true
    notable:
    - name: bartowski / unsloth (GGUF quantizations)
      trust: community
      note: Widely mirrored/quantized; each mirror is a separate artifact whose trust equals its
        uploader, and use remains bound by the Llama 4 licence (including the EU-multimodal carve-out) -
        pin the meta-llama revision and verify checksums
    - name: Served on Bedrock / Azure / Vertex / Together / Groq
      trust: verified
      note: Major clouds host Llama 4; a hosted end-user product is the AUP-exempted path for EU end
        users (but not for EU-domiciled entities building on the weights)
  checkpoint_checklist_score: 5
  scanner_result: {}
  incidents: []
eu_ai_act:
  is_gpai: true
  systemic_risk:
    designated: false
    training_flops_estimate: '>1e25 FLOP for the large Llama 4 models (Maverick, Behemoth), placing them
      in systemic-risk territory; Scout is smaller. Meta does not publish absolute figures, but the
      largest Llama 4 models are broadly understood to cross the presumption.'
    over_1e25_threshold: true
    article_55_docs_available: partial
  open_source_exemption:
    license_qualifies: 'no'
    rationale: 'Two independent reasons the Article 53 open-source exemption does not apply. First, the
      Llama 4 Community Licence is not FOSS - it carries the 700M-MAU trigger, naming/attribution, an
      AUP, and the EU-multimodal carve-out. Second, the large Llama 4 models are systemic-risk (>1e25),
      which voids the exemption regardless of licence. And the EU-multimodal carve-out means
      EU-domiciled entities have no licence to the models at all.

      '
  provider_package:
    technical_documentation: partial
    downstream_information: partial
    copyright_policy: 'no'
    training_content_summary: 'no'
    code_of_practice_signatory: false
  deployer_notes: 'Decisive for EU deployers: the Llama 4 multimodal licence is NOT granted to
    individuals domiciled in, or companies with a principal place of business in, the EU - so an
    EU-domiciled organisation cannot licence these models (only downstream end users of someone else''s
    product are exempted). Meta also declined the EU GPAI Code of Practice, publishes no copyright policy
    or training-content summary, and the large models are systemic-risk. For EU-domiciled use, prefer the
    Llama 3.1 text models (the meta-llama entry, no EU clause) or a non-Llama family.

    '
  last_assessed: '2026-08-03'
performance: {}
behaviour: {}
safety: {}
deployment:
  ceiling_tier: T3
  ceiling_conditional: true
  hardware_notes: 'Mixture-of-experts multimodal models: Scout (109B total / 17B active) fits a single
    high-memory node or aggressive quantization; Maverick (400B/17B) needs serious multi-GPU
    infrastructure; Behemoth (~2T/288B active) is data-centre-scale. Very long context (Scout advertises
    up to 10M tokens) is memory-intensive in practice.

    '
  serving_support:
  - vllm
  - transformers
  - bedrock
  - vertex
  controls_required:
  - 'EU-domiciled entities: do not use the Llama 4 multimodal weights - the licence is not granted to
    you (confirm your domicile/principal place of business against the AUP)'
  - Check the 700M-MAU commercial trigger and honour the "Built with Llama" naming/attribution and the
    Acceptable Use Policy
  - Pair with Meta's Llama Guard and Prompt Guard (shipped with the family) and add your own
    input/output guardrails
  - Add prompt-injection defences and treat retrieved/tool content and input images as untrusted for
    agentic/multimodal use
