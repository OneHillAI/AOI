# OneHill v2 MODEL library entry for the NON-COMMERCIAL Mistral models. Split from the aggregate
# mistral entry on the LICENCE axis: these ship under Mistral's research/non-production licences (MRL
# research-only: Ministral 8B, Mistral Large, Pixtral Large; MNPL non-production: Codestral) - NOT the
# Apache-2.0 of the flagship line (the `mistral` entry). The non-commercial restriction takes
# use-and-modify to weak and ownership to limited - that is the divergence.
# Validated against schema/model.v2.schema.json.

schema_version: '2.0'
id: mistral-research-license
name: Mistral (research / non-production licence)
aliases:
- Ministral 8B
- Mistral Large 2
- Pixtral Large
- Codestral
- mistralai/Mistral-Large-Instruct-2411
family:
  id: mistral
  name: Mistral
publisher:
  name: Mistral AI
  country: France
  accountable_entity: true
  url: https://huggingface.co/mistralai
  security_contact: https://mistral.ai/terms
summary: 'The Mistral models that are NOT Apache-2.0 - shipped under Mistral''s two non-commercial
  licences. Under the Mistral Research Licence (MRL, research-only): Ministral 8B, Mistral Large (2,
  123B) and the multimodal Pixtral Large. Under the Mistral AI Non-Production Licence (MNPL,
  non-production-only): Codestral. They are a separate entry from the Apache-2.0 flagship line (the
  `mistral` entry) because the licence is the divergence: the MRL grants use "solely for (a) personal,
  scientific or academic research, and (b) for non-profit and non-commercial purposes", excluding
  revenue activity and SaaS distribution; the MNPL permits only "testing, research, Personal, or
  evaluation purposes in Non-Production Environments". In both cases production or commercial use
  requires a separately negotiated commercial licence from Mistral. That bar takes use-and-modify to
  weak and ownership to limited - well below the Apache line. What keeps the rest of the profile strong
  is the provider: Mistral is an EU-domiciled, accountable lab and an early GPAI Code of Practice
  signatory, and the models themselves (Mistral Large 2, Pixtral Large) are highly capable. Weights are
  openly downloadable and inspectable for research; the restriction is on deployment, not access.

  '
variants:
- name: Ministral 8B (MRL)
  params_total: 8B
  context_window: 128k
  kind: instruct
  safety_tuned: true
- name: Mistral Large 2 (123B, MRL)
  params_total: 123B
  context_window: 128k
  kind: instruct
  safety_tuned: true
- name: Pixtral Large (124B, multimodal, MRL)
  params_total: 124B
  context_window: 128k
  kind: multimodal
  safety_tuned: true
- name: Codestral (22B, MNPL non-production)
