ownership:
  level: limited
  factors:
    use_modify:
      level: weak
      rationale: "The MRL restricts use to research/academic/non-profit purposes, and the MNPL to non-production testing/evaluation; any commercial or production use of the model or a derivative requires a separately negotiated Mistral licence. A blanket non-commercial bar is the weakest use-and-modify position - weak."
      # grounded in: ev-mrl-license (license, retrieved) - MRL-0.1 research-only / MNPL-0.1 non-production-only
    transparency:
      level: moderate
      rationale: "Weights are inspectable and Mistral documents its models well, but training data and code are closed - open weights, closed process, so moderate."
      # grounded in: ev-mrl-card (model_card) - open weights + good docs; data/code closed
    reliability:
      level: strong
      rationale: "Performance 4, operational 4 and safety 3 from an accountable EU provider: capable models with strong serving; all at or above 3, two at 4, so reliability is strong. The caveat is the absence of a first-party guard model."
      # grounded in: dimension scores performance 4 / operational 4 / safety 3
    data_control:
      level: strong
      rationale: "Self-hosted for research, the weights run entirely on your own infrastructure with no telemetry or clawback, so your data stays yours - the constraint is on permitted use, not data residency."
      # grounded in: ev-mrl-license (license, retrieved) - self-host, no telemetry; EU-domiciled provider
  verdict: "You have only limited ownership of these Mistral models: self-hosting keeps your data yours and the models are capable and well-supported (data-control and reliability strong), but the MRL/MNPL bar commercial and production use without a separately negotiated licence, so use-and-modify is weak - ownership is limited. For anything beyond research or evaluation, either negotiate a commercial licence with Mistral or use the Apache-2.0 Mistral models (the `mistral` entry), which carry none of these restrictions and reach substantial ownership."
