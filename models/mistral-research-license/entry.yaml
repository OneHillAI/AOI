    name: Mistral Research Licence 0.1 (MRL) / Mistral AI Non-Production Licence 0.1 (MNPL for Codestral)
    classification: research_only
    commercial_use: prohibited
    notable_restrictions:
    - 'MRL (Ministral 8B, Mistral Large, Pixtral Large) - research-only: use "solely for (a) personal,
      scientific or academic research, and (b) for non-profit and non-commercial purposes"; excludes
      revenue activity and SaaS distribution. France/Paris jurisdiction'
    - 'MNPL (Codestral) - non-production only: "You shall only use the Mistral Models and Derivatives for
      testing, research, Personal, or evaluation purposes in Non-Production Environments"; no commercial
      supply including SaaS/cloud instances'
    - Production or commercial use of any of these models requires a separately negotiated commercial
      licence from Mistral. Outputs are not claimed by Mistral
    url: https://mistral.ai/licenses/MRL-0.1.md
provenance:
