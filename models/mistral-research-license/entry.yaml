  systemic_risk:
    designated: false
    training_flops_estimate: 'Mistral Large 2 (123B) and Pixtral Large (124B) are the largest here;
      Mistral does not publish absolute FLOP figures, but these dense models plausibly sit below or near
      the 1e25 threshold rather than clearly above it. Ministral 8B and Codestral are well below.'
    over_1e25_threshold: null
    article_55_docs_available: partial
  open_source_exemption:
    license_qualifies: 'no'
    rationale: 'The MRL and MNPL are NOT free-and-open-source licences - they bar commercial /
      production use - so the Article 53 open-source exemption does not apply on the licence axis
      (unlike the Apache Mistral models). That said, Mistral is EU-domiciled, an early GPAI Code of
      Practice signatory, and publishes fuller technical documentation than most, so the surviving GPAI
      obligations are partially met.

      '
  provider_package:
    technical_documentation: 'yes'
    downstream_information: partial
    copyright_policy: partial
    training_content_summary: partial
    code_of_practice_signatory: true
  deployer_notes: 'EU-domiciled provider with a Code-of-Practice posture and good documentation, but the
    licence bars production/commercial use without a negotiated commercial agreement. An EU research or
    evaluation user is well served; a commercial deployer must negotiate a licence first, and should
    otherwise use the Apache Mistral models (the `mistral` entry).

    '
  last_assessed: '2026-08-03'
performance: {}
behaviour: {}
safety: {}
deployment:
  ceiling_tier: T2
  ceiling_conditional: true
  hardware_notes: 'A wide range: Ministral 8B and Codestral 22B run on one or two GPUs, while Mistral
