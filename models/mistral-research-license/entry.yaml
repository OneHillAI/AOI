    quantization. Note that any production deployment is licence-barred without a commercial agreement.

    '
  serving_support:
  - vllm
  - transformers
  - llama.cpp
  - ollama
  controls_required:
  - Do not deploy in production or for commercial purposes without a separately negotiated commercial
    licence from Mistral - the MRL/MNPL bar it
  - Add your own input/output guardrails and a guard/classifier model - historically lighter safety
    tuning and no first-party guard
  - Add prompt-injection defences and treat retrieved/tool content as untrusted for agentic use;
    for Pixtral Large treat images as untrusted input too
  - Verify checksums and pin the exact mistralai revision
