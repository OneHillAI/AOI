    legal:
      score: 2
      rationale: 'A clear licence from an EU-domiciled provider (France law) with good documentation, but
        it bars commercial / production use without a separately negotiated agreement, so the
        open-source exemption does not apply and a commercial adopter cannot use it as released. Usable
        for research (hence a 2, not a 1), but the non-commercial bar is the reason ownership is only
