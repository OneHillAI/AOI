    level: limited
    dimension: openness
    summary: "You may fine-tune for research, but any commercial or production use of the model or a derivative needs a separately negotiated Mistral licence, and training data and code are closed - so trainability is legally boxed in."
    refs: [ev-mrl-license]
  knowledge_structure:
    level: strong
    dimension: performance
    summary: "Capable knowledge/analysis and coding backbones (Mistral Large 2, Codestral, Pixtral Large's vision) - but only usable as such in research/non-production settings without a commercial licence."
    refs: [ev-mrl-perf, ev-mrl-license]
  specialization:
    level: weak
    dimension: openness
    summary: "Poorly suited to friction-free specialisation for deployment: derivatives inherit the non-commercial bar, so a specialised production model needs a negotiated commercial licence."
    refs: [ev-mrl-license]
  exchangeability:
    level: high
    dimension: operational
    summary: "Mechanically easy to swap (safetensors, broad serving), but the non-commercial licence, not the tooling, is what constrains real-world adoption."
    refs: [ev-mrl-card]
  misuse_exposure:
    level: unbenchmarked
    dimension: safety
    summary: "Not independently benchmarked for misuse; historically lighter safety tuning and no companion guard, with no broad third-party red-team to aggregate."
    refs: [ev-mrl-behaviour]
