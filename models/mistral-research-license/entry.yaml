    operational:
      score: 4
      rationale: 'Strong serving mechanics (vLLM, transformers, llama.cpp, Ollama) and community quants,
        but the largest models (123B/124B) need serious infrastructure and, decisively, production
        deployment is licence-barred - so the practical operational ceiling is lower than the Apache
        line. A 4.

        '
      evidence_refs:
      - ev-mrl-card
      - ev-mrl-perf
    governance:
      score: 4
      rationale: 'A strong governance posture: a named, accountable, EU-domiciled provider (Mistral AI),
        an early GPAI Code of Practice signatory with a public licence table and good documentation.
        Short of 5 for the absence of a formal published vulnerability-disclosure process.

        '
      evidence_refs:
      - ev-mrl-card
      - ev-mrl-eu
signals:
