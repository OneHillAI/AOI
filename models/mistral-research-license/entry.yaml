      evidence_refs:
      - ev-mrl-behaviour
    performance:
      score: 4
      rationale: 'These include some of Mistral''s most capable models - Mistral Large 2 (123B) was a
        flagship, Pixtral Large a strong multimodal, Ministral 8B strong-for-size. Capped at 4 because
