ownership:
  level: partial
  factors:
    use_modify:
      level: strong
      rationale: "Apache-2.0 is declared on both cards, ungated, with weights downloadable and the exact training dataset public; caveat: no LICENSE file ships and the Llama 3.3 question on the classifier chain is open (ev-licence, ev-llama-terms)."
    transparency:
      level: moderate
      rationale: "Weights, training dataset, filter classifiers and a detailed paper are public, but training code, configs, the label set and an evaluation harness are not, so the models cannot be rebuilt exactly (ev-paper, ev-dataset)."
    reliability:
      level: weak
      rationale: "Safety is 1 (no safety evaluation, stated by the publisher) and operational readiness is 2 (transformers sample only, no quantised builds or hardware guidance); these are base models, not deployable assistants (ev-card-1b, ev-paper)."
    data_control:
      level: strong
      rationale: "Self-hosted weights under a declared Apache-2.0 licence with no clawback clause, standard Llama architecture files and no custom code in the repos (ev-licence, ev-hf-platform)."
  verdict: "You own the use of the weights: Apache-2.0 is declared, ungated, commercial use is allowed and your data stays on your hardware. You do not own a deployable German assistant, because these are small base models with no safety evaluation, you cannot rebuild them without the unreleased training code, and every benchmark is the publisher's own. The level rises if the group ships a LICENSE file, releases its training code and configs, and settles the Llama 3.3 question on the classifiers."

evidence:
- id: ev-card-350m
  claim: "The Boldt-DC-350M card declares Apache-2.0 in its metadata only, says the Boldt series is 'trained from scratch' (a publisher claim), calls the model a base model not optimised for chat, and says no systematic toxicity, bias or stereotype evaluation was done. The card says 'three models' but lists four and names the model 'Boldt-DC-300M' in its table."
  source_type: publisher
  doc_type: model_card
  retrieved: true
  url: https://huggingface.co/Boldt/Boldt-DC-350M
  date: '2026-11-19'
- id: ev-card-1b
  claim: "The Boldt-DC-1B card declares Apache-2.0 in its metadata only, gives a 2,048-token context and 200B training tokens of the German Dense-Core subset, reports a 44.05 average on the publisher's German benchmark suite, and carries the same no-safety-evaluation statement. Its code sample loads the sibling Boldt/Boldt-1B instead of this model."
  source_type: publisher
  doc_type: model_card
  retrieved: true
  url: https://huggingface.co/Boldt/Boldt-DC-1B
  date: '2026-11-19'
- id: ev-licence
  claim: "Both repos declare 'license: apache-2.0' in front matter and are not gated. No LICENSE file exists in either repo or any other Boldt model repo (the raw LICENSE path returns HTTP 404), and neither card body names a licence or copyright holder."
  source_type: publisher
  doc_type: license
  retrieved: true
  url: https://huggingface.co/api/models/Boldt/Boldt-DC-1B
  date: '2026-11-19'
- id: ev-paper
  claim: "The EMNLP 2026 paper 'Repetition over Diversity' (arXiv 2604.28075, Aynetdinov, Haller and Akbik, Humboldt-Universitaet zu Berlin) describes training models 'from scratch' on filtered German FineWeb-2. It gives the Llama-3.3-70B-Instruct annotation recipe, the training setup and the upstream licences. The authors state they ran no toxicity or bias evaluation. The paper names no base model, links no code repository and describes no contamination check."
  source_type: publisher
  doc_type: technical_report
  retrieved: true
  url: https://arxiv.org/abs/2604.28075
  date: '2026-11-19'
- id: ev-dataset
  claim: "Boldt/fineweb2-de-dc is a public ODC-By 1.0 dataset of 24.4M German documents (28B tokens) subject to Common Crawl's Terms of Use, selected by three released classifiers trained on Llama-3.3-70B-Instruct labels; the classifier repos have no README, no licence and no LICENSE file. The FineWeb-2 card gives the same ODC-By terms for the upstream corpus."
  source_type: publisher
  doc_type: docs
  retrieved: true
  url: https://huggingface.co/datasets/Boldt/fineweb2-de-dc
  date: '2026-11-19'
- id: ev-llama-terms
  claim: "Llama 3.3 Community License section 1.b.i says that anyone who uses Llama Materials or any outputs of them to train or improve a distributed AI model shall include 'Llama' at the beginning of that model's name. This is an upstream document, not a Boldt one; Boldt does not say whether it applies to its classifiers."
  source_type: third_party
  doc_type: terms
  retrieved: true
  url: https://www.llama.com/llama3_3/license/
  date: '2026-11-19'
- id: ev-hf-platform
  claim: "The Boldt organisation is not verified on Hugging Face and has two members. Both DC repos are ungated, hold safetensors only, and have no discussions and no inference provider. The scan flagged no files, though scansDone is false on the 1B repo. The 350M config is a Llama model with 468M parameters. Third-party fine-tunes of the DC models exist on the Hub."
  source_type: third_party
