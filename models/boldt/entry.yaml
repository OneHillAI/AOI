# OneHill v2 MODEL library entry for Boldt-DC (350M and 1B base models, HU Berlin).
# Validated against schema/model.v2.schema.json.
#   scores    -> scripts/score.py --write        (AOI headline/grade)
#   meters    -> scripts/completeness.py --write  (per-domain completeness/originality)
#   prose     -> assess.md / implement.md / use.md / support.md (sections keyed <!-- item: KEY -->)
# Grounded 2026-11-19 against docs/primary-sources/boldt/ (see _sources.md). No OneHill evaluation
# has been run, so there is no onehill_verified evidence and every documentation item is aggregated or a gap.
# Scope: only Boldt-DC-350M and Boldt-DC-1B (FineWeb-2 German Dense-Core only, 2,048 context). Boldt-1B (adds
# news data), Boldt-1B-IT-Preview (Qwen-generated SFT data), the 15 research checkpoints and the three
# classifiers differ on training data or provenance and are follow-ups.

schema_version: "2.0"
id: boldt
name: Boldt-DC (350M and 1B base models)
aliases:
- Boldt
- Boldt-DC-350M
- Boldt-DC-1B
- Boldt/Boldt-DC-350M
- Boldt/Boldt-DC-1B
family:
  id: boldt
  name: Boldt
publisher:
  name: Chair of Machine Learning, Humboldt-Universitaet zu Berlin (Alan Akbik; authors Ansar Aynetdinov and Patrick Haller)
  country: Germany
  accountable_entity: true
  url: https://alanakbik.github.io/research/boldt
  security_contact: none published
summary: "Boldt-DC is a pair of small German-only base models (350M and 1B) under a declared Apache-2.0 licence, best adopted as a German research and fine-tuning starting point and not as an assistant. Both were trained on the German Dense-Core subset of FineWeb-2 (28B unique tokens repeated to 200B), which the publisher also releases with its three quality-filter classifiers and a paper that describes the filter recipe. The publisher says the models were trained from scratch (a claim in the cards and paper; no base model is named). Training code, configs and the Llama-written label set are not released, every benchmark is the publisher's own on a translated suite it built, and there is no safety evaluation. The licence is a front-matter declaration with no LICENSE file in any repo, and the filter classifiers were trained on Llama-3.3-70B-Instruct labels, a Llama 3.3 licence question the publisher does not address. The Hugging Face organisation is unverified."
variants:
- name: Boldt-DC-350M
  params_total: 468M
  context_window: 2k
  kind: base
  safety_tuned: false
- name: Boldt-DC-1B
  params_total: 1.205B
  context_window: 2k
  kind: base
  safety_tuned: false
openness:
  tier: open_weights
  components:
    weights: open
    training_data: open
    training_code: partial
    evaluation: partial
    documentation: open
    license: open
  license:
    spdx: Apache-2.0
    name: Apache License 2.0 (declared in card metadata only; no LICENSE file in the repos and no licence text in the card bodies)
    classification: osi
    commercial_use: allowed
    notable_restrictions:
    - "No LICENSE, NOTICE or copyright-holder file ships with the weights; Apache-2.0 appears only in the Hugging Face front matter."
    - "The training data is ODC-By 1.0 web text subject to Common Crawl's Terms of Use; the weights carry the Apache-2.0 declaration without mentioning either."
    - "Open upstream question, unresolved: the released filter classifiers were trained on Llama-3.3-70B-Instruct labels, and the Llama 3.3 licence asks that models trained on its outputs carry 'Llama' in their name (see ev-llama-terms). The Boldt base models themselves were trained on filtered web text, not on Llama outputs."
    url: https://huggingface.co/Boldt/Boldt-DC-1B
provenance:
  canonical_source: https://huggingface.co/Boldt
  verified_org_on_primary_host: false
  formats:
  - safetensors
  integrity:
    checksums: true
    signed: false
    signing_tech: ''
    provenance_attestation: false
  mirrors_and_quants:
    acknowledged: false
    notable:
    - name: mayflowergmbh/boldt-dc-1b-german-it-16k (and a DPO variant, and Boldt-Embed-DE-350M)
      trust: community
      note: third-party fine-tunes of the Boldt-DC models on the Hub, not mirrors or quantisations and not assessed
  checkpoint_checklist_score: 4
  scanner_result:
    scanner: Hugging Face repository scan
    result: filesWithIssues empty on both repos (scansDone true on the 350M repo, false on the 1B repo)
  incidents: []
eu_ai_act:
  is_gpai: true
  systemic_risk:
    designated: false
    training_flops_estimate: about 1.4e21 FLOPs for the 1B model (OneHill arithmetic, 6 x 1.2B parameters x 200B tokens; the publisher gives no figure)
    over_1e25_threshold: false
    article_55_docs_available: n/a
  open_source_exemption:
    license_qualifies: uncertain
    rationale: "Apache-2.0 is a free and open-source licence and weights, architecture and a usage example are public, so the Article 53 exemption would normally be plausible for a non-monetised university release. It is marked uncertain because no licence text ships with the weights and the Llama 3.3 question on the classifier chain is unresolved. The exemption does not cover the copyright policy or the public training-content summary, and neither exists as a standalone document."
  provider_package:
    technical_documentation: partial
    downstream_information: partial
    copyright_policy: 'no'
    training_content_summary: partial
    code_of_practice_signatory: false
  deployer_notes: "The paper and the Dense-Core dataset card name the corpus, the filter recipe, the architecture and the hyperparameters, which helps a deployer assemble technical documentation. There is no copyright policy and no template-format training-content summary; the web data comes from Common Crawl and the opt-out position is the upstream FineWeb-2 card's, not Boldt's. No code-of-practice signatory status appears in any document examined (the Commission list was not checked). A fine-tuner placing a derivative on the EU market may become a provider for it."
  last_assessed: '2026-11-19'
performance: {}
behaviour: {}
safety: {}
deployment:
  ceiling_tier: T0
  ceiling_conditional: true
  hardware_notes: "The bf16 weights are 0.94 GB (350M, 468M parameters) and 2.41 GB (1B, 1.205B parameters). The context is 2,048 tokens and the architecture is plain Llama, so both should fit on a laptop GPU or CPU (OneHill inference from file sizes). The publisher gives no VRAM, latency or throughput figure and no quantised builds. The paper names training hardware (8xA100 and 4xH100) and no GPU-hours."
  serving_support:
  - transformers
  controls_required:
  - Treat these as base models for German research and fine-tuning; do not expose them to end users without instruction tuning and your own safety evaluation (T0, conditional on a human reviewing any output that leaves a sandbox)
  - Run your own toxicity, bias and factuality evaluation, because the publisher states it has done none
  - Add the Apache-2.0 text and a notice yourself when you redistribute, since no LICENSE file ships
  - Pin the exact repo revision and check the LFS SHA256 yourself, because nothing is signed
  - Check which repo your code loads, since the Boldt-DC-1B card sample loads Boldt/Boldt-1B, a different model trained on news data
  - Add input and output guardrails, since no companion guard model or acceptable-use policy ships
score:
  rubric_version: '1.1'
  headline: 45.2
  grade: D
  hard_flags: []
  dimensions:
    openness:
      score: 3
      rationale: "Open weights, a public training dataset (the 28B-token Dense-Core subset), public filter classifiers, a thorough paper and cards, and an Apache-2.0 declaration put it at the top of the open-weights anchor. It is short of 4 because no training code, configs or evaluation harness is released or linked anywhere, the 500k Llama-written label set is not published, and the card bodies carry no licence text. Training data is open (the exact dataset the models were trained on is public), training code is partial (frameworks and hyperparameters are named in the paper, no runnable recipe) and evaluation is partial (translated benchmarks are public, no harness)."
      evidence_refs:
      - ev-card-1b
      - ev-paper
      - ev-dataset
      - ev-licence
    provenance:
      score: 2
      rationale: "Safetensors only, Hugging Face LFS hashes, a scan that flagged nothing and plain Llama-architecture files with no custom code give about 4 of 8 checklist boxes. It stays at 2 because the Boldt organisation is not verified on Hugging Face and has two members, nothing is signed or attested, no mirror or quantisation policy exists, and the 1B repo's scan shows scansDone false. 'Trained from scratch' is the publisher's claim and no base model is named, but nothing independent confirms it. Anchor 3 needs a verified publisher organisation."
      evidence_refs:
      - ev-hf-platform
      - ev-card-350m
      - ev-paper
    legal:
      score: 3
      rationale: "The declared licence is Apache-2.0, ungated, which is clear for common uses, and the paper and dataset card document corpus, filter recipe and upstream licences (ODC-By and Common Crawl terms). It stays at 3 because no LICENSE file or licence text ships, there is no copyright policy or training-content summary in the AI Office format, and the Llama 3.3 labelling chain behind the released classifiers is unaddressed."
      evidence_refs:
      - ev-licence
      - ev-dataset
      - ev-llama-terms
      - ev-paper
    safety:
      score: 1
      rationale: "These are base models and say so; the cards and the paper state plainly that no toxicity, bias or stereotype evaluation was done and that repeated epochs may amplify biases. There is no acceptable-use policy, no guard model and no safety-tuned release in scope (the IT-Preview sibling also has no systematic safety evaluation). The plain disclosure of that gap keeps it above 0, and nothing supports a higher anchor."
      evidence_refs:
      - ev-card-350m
      - ev-card-1b
      - ev-paper
    performance:
      score: 2
      rationale: "The publisher reports a 44.05 average on its own translated German suite for the 1B model against 40.78 for LLaMmlein-1B, 39.77 for Gemma-3-1B and 37.90 for Llama-3.2-1B, and 40.16 for the 350M model. Every number is the authors' own on a benchmark suite they re-translated themselves, the paper describes no contamination check, absolute scores are low (MMLU 29 to 31 against a 25 floor), and no independent re-run was found, so it stays at 2."
      evidence_refs:
      - ev-card-1b
      - ev-paper
      - ev-no-independent
    operational:
      score: 2
      rationale: "The weights are standard safetensors with a plain Llama architecture and load through transformers (the cards show only that route). No quantised build, hardware table, serving guidance or inference provider exists, the 1B card's code sample loads the wrong repo, and the 350M card miscounts its own release list. Small size makes it easy to run, but nothing is documented beyond the Python sample."
      evidence_refs:
      - ev-card-1b
      - ev-card-350m
      - ev-hf-platform
    governance:
      score: 3
      rationale: "An accountable university chair with named authors, a peer-reviewed paper (EMNLP 2026), a project page, two release batches (May and August 2026) and README edits as late as 2026-11-01. Against that, the track record is seven months, there is no security contact, vulnerability process, deprecation policy or terms, discussions are empty, and the Hugging Face organisation is unverified."
      evidence_refs:
      - ev-project
      - ev-paper
      - ev-hf-platform

# --- Assessed signals.
signals:
  trainability:
    level: partial
    dimension: openness
    summary: "Apache-2.0 base weights, the exact training dataset and filter classifiers are public and the paper gives hyperparameters, so adaptation and continued pretraining are practical; training code and configs are unreleased, so an exact rebuild is not possible."
    refs: [ev-card-1b, ev-dataset, ev-paper]
  knowledge_structure:
    level: weak
    dimension: performance
    summary: "2,048-token context, German only, MMLU about 29 to 31 on the publisher's suite and no retrieval or grounding test make it a weak knowledge or RAG backbone as released."
    refs: [ev-card-1b, ev-paper]
  specialization:
    level: moderate
    dimension: openness
    summary: "Small German base checkpoints with a German 32k tokenizer, an open corpus and an Apache-2.0 declaration are a sensible specialisation start; the paper shows supervised fine-tuning on SmolTalk2 German and outside parties have published fine-tunes, but no adaptation recipe ships."
    refs: [ev-card-1b, ev-paper, ev-hf-platform]
  exchangeability:
    level: medium
    dimension: operational
    summary: "Standard Llama-architecture safetensors should drop into common runtimes, but the publisher documents only transformers, ships no quantised builds and no inference provider hosts them."
    refs: [ev-card-1b, ev-hf-platform]
  misuse_exposure:
    level: unbenchmarked
    dimension: safety
    summary: "The publisher states it has run no toxicity, bias or stereotype evaluation and nothing independent exists."
    refs: [ev-card-350m, ev-paper]

