  integrity:
    checksums: true
    signed: false
    signing_tech: ''
    provenance_attestation: false
  mirrors_and_quants:
    acknowledged: true
    notable:
    - name: Official BF16 / FP8 / NVFP4 quantizations (nvidia)
      trust: publisher
