  - vllm
  - sglang
  - ollama
  - llama.cpp
  - nim
  controls_required:
  - Add NVIDIA's own downloadable safety stack - a guard classifier (Nemotron-3-Content-Safety), the
    Apache-2.0 NeMo Guardrails toolkit for input/output/action rails, and the Apache-2.0 garak
    red-team scanner - because there is no published model-level safety evaluation to rely on
  - Run garak (or equivalent) red-team for THIS use case before autonomous deployment; the base cards
    carry only a data-filtering note, so misuse characterisation is your responsibility
  - Honour the NVIDIA Nemotron Open Model License attribution notice on redistribution; the grant is
    irrevocable and carries no field-of-use restriction, so ordinary commercial use and modification
    are unencumbered
  - Verify checksums and pin the exact nvidia revision
