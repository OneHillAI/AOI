schema_version: '2.0'
id: nemotron-3
name: NVIDIA Nemotron 3 (Super + Nano)
aliases:
- Nemotron 3 Super
- Nemotron 3 Nano
- Nemotron-3-Super
- Nemotron-3-Nano
- nvidia/NVIDIA-Nemotron-3-Super-120B-A12B
- nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B
family:
  id: nemotron
  name: NVIDIA Nemotron
publisher:
  name: NVIDIA
  country: US
  accountable_entity: true
  url: https://huggingface.co/nvidia
  security_contact: https://www.nvidia.com/en-us/security/
summary: 'NVIDIA Nemotron 3 Super and Nano are the text flagships of NVIDIA''s open, agent-focused
  hybrid Mamba-Transformer Mixture-of-Experts family: Super (120B total / 12B active) and Nano (30B
  / 3.5B active), both with a context window up to 1M tokens and both trained on roughly 25T tokens.
  They are among the more genuinely open releases in the registry: ungated safetensors weights,
  runnable training recipes, a white paper, and post-training datasets under CC-BY-4.0, so they reach
  the open_weights_recipe tier, not merely open_weights. Both are governed by the NVIDIA Nemotron
  Open Model License (v. 2025-12-15), an Apache-2.0-derived, source-available (non-OSI) licence whose
  grant is perpetual, worldwide, royalty-free and IRREVOCABLE, with commercial use allowed and no
  acceptable-use or field-of-use restriction; it terminates only if the licensee brings patent or
  copyright litigation over the Work or an output from it. Two things cap ownership at partial. First,
  the training corpus is only PARTIALLY released: the official recipes "train exclusively on the
  open-sourced subset of training data", so the model is not reproducible. Second, on the safety side
  there is no published model-level safety evaluation or independent red-team for the base models -
  safety appears only as post-training data curation - though NVIDIA does ship a genuinely
  downloadable companion guard classifier (Nemotron-3-Content-Safety) plus the Apache-2.0 NeMo
  Guardrails and garak tooling at the family level.

  '
variants:
- name: NVIDIA-Nemotron-3-Super-120B-A12B
  params_total: 120B
  params_active: 12B
  context_window: 1M
  kind: reasoning
  safety_tuned: true
- name: NVIDIA-Nemotron-3-Nano-30B-A3B
  params_total: 30B
  params_active: 3.5B
  context_window: 1M
  kind: reasoning
  safety_tuned: true
openness:
