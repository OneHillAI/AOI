ownership:
  level: partial
  factors:
    use_modify:
      level: moderate
      rationale: "The NVIDIA Nemotron Open Model License is permissive: perpetual, royalty-free, irrevocable, commercial use allowed, no acceptable-use or field-of-use restriction, weights ungated and fine-tunable. It is rated moderate and not strong because it is Apache-2.0-derived but non-OSI: the termination reaches 'an output from the Work' (broader than Apache-2.0) and redistribution must carry the NVIDIA attribution notice. It is an open_weight community licence with conditions, short of Ultra's unconditional OpenMDW 'deal without restriction' grant."
      # grounded in: ev-n3-oml (license, retrieved) - irrevocable grant + output-reaching termination + attribution notice
    transparency:
      level: strong
      rationale: "Ungated weights, a white paper, runnable training recipes and partially released post-training data under CC-BY-4.0 let a reader see much of how the model was built (open_weights_recipe tier). The limit is reproducibility and not visibility: the full corpus is not released, which caps the openness tier and not transparency."
      # grounded in: ev-n3-data (training_data, retrieved) - released recipes + CC-BY post-training datasets; ev-n3-report (technical_report, retrieved) - white paper
    reliability:
      level: moderate
      rationale: "Operational is strong (4: broad serving, official quantizations, a small portable Nano), but safety is only 3: there is no published model-level safety evaluation or independent red-team, so misuse control is a gap you must fill yourself with the downloadable guard stack. Under the ownership rule a safety score of 3 caps this factor at moderate, however capable the models are."
      # grounded in: dimension scores operational 4 / safety 3; ev-n3-safety
    data_control:
      level: strong
      rationale: "Self-hosted via NIM, the weights and inference run on the deployer's own infrastructure and data never leaves the enclave. The licence claws back no rights: the grant is explicitly irrevocable and terminates only on the licensee's own IP litigation."
      # grounded in: ev-n3-nim (deployment, retrieved) - self-hosted, data stays in your enclave; ev-n3-oml (license, retrieved) - irrevocable grant, no revocation claw-back
  verdict: "You get strong transparency for an open model (ungated weights, a white paper, runnable recipes and CC-BY post-training data) and a clean irrevocable grant with no field-of-use restriction, so self-hosting keeps your data and rights yours. Ownership stays partial and not substantial for three reasons. The corpus is only partly released (not reproducible). The non-OSI licence with its attribution notice and output-reaching termination holds use-and-modify at moderate. The absence of a published model-level safety evaluation holds reliability at moderate. Self-host via NIM, assemble the downloadable guard stack, and red-team for your own use case."

# --- Evidence. Each item carries doc_type and retrieved (true = substantive text obtained).
#     Primary-source clauses are in docs/primary-sources/nemotron-3/.
evidence:
- id: ev-n3-cards
  claim: 'Nemotron 3 Super and Nano model cards on the verified nvidia HF org: Super 120B/12B, Nano 30B/3.5B active; hybrid Mamba-Transformer LatentMoE + MTP; up to 1M context; ~25T training tokens; ungated safetensors with BF16/FP8/NVFP4 variants. Both cards state "a family of open models with open weights, training data, and recipes" and carry the licence tag nvidia-nemotron-open-model-license. The repos were last modified 2026-08-24 and 2026-08-25 (README edits only), and the Super card links a separate MTPv2 head checkpoint.'
  source_type: publisher
  doc_type: model_card
  retrieved: true
  url: https://huggingface.co/nvidia/NVIDIA-Nemotron-3-Super-120B-A12B-BF16
