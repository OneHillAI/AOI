        revision and verify checksums
  checkpoint_checklist_score: 4
  scanner_result: {}
  incidents: []
eu_ai_act:
  is_gpai: true
  systemic_risk:
    designated: false
    training_flops_estimate: 'Not published. Only training-token counts are disclosed (~25T tokens
      for both Super and Nano); no absolute FLOP or GPU-hour figure appears in the white paper
      abstract, model cards or blogs read.'
    over_1e25_threshold: null
    article_55_docs_available: n/a
  open_source_exemption:
    license_qualifies: uncertain
    rationale: 'NVIDIA publishes weights, recipes, a white paper and partial training data, which is
      more than most, and the corrected licence reading removes the earlier revocable / use-restricted
      concern: the NVIDIA Nemotron Open Model License is irrevocable and carries no field-of-use
      restriction. But it is source-available and not OSI, there is no formal GPAI documentation
      package, no public training-content summary and no copyright policy, and NVIDIA is not a GPAI
      Code of Practice signatory. A non-OSI licence without the GPAI documentation package most likely
      does NOT cleanly reach the EU AI Act open-source exemption. Recorded as ''uncertain'' pending
      the full Article 53 analysis.

      '
  provider_package:
    technical_documentation: partial
    downstream_information: partial
    copyright_policy: 'no'
    training_content_summary: partial
    code_of_practice_signatory: false
  deployer_notes: 'NVIDIA (US-based) provides more than most - a white paper, runnable recipes, and
    partially released, partly CC-BY-4.0 training data - so an EU deployer inherits a real information
    base, and the governing licence is irrevocable and carries no acceptable-use restriction. But
    there is no formal EU AI Act GPAI documentation package, no copyright policy, NVIDIA is not a GPAI
    Code of Practice signatory, and the training corpus is not fully released. Training compute is
    undisclosed, but at ~25T tokens on a 120B / 30B scale a systemic-risk designation is not
    indicated for these two models.

    '
  last_assessed: '2026-08-03'
performance: {}
behaviour: {}
safety: {}
deployment:
  ceiling_tier: T3
  ceiling_conditional: true
  hardware_notes: 'A real size step: Nano (30B / 3.5B active) is genuinely portable and runs on
    modest single-GPU hardware; Super (120B / 12B) is a mid-tier multi-GPU target. Official BF16 /
    FP8 / NVFP4 quantizations are published for each. Exact per-GPU VRAM is not restated here; size
    against the variant.

    '
