        is NO published model-level safety evaluation or independent red-team: the base cards carry
        only a data-filtering note and the white paper''s safety section is a contributor list. The
        downloadable companion guard stack is what keeps it from dropping to 2.

        '
      evidence_refs:
      - ev-n3-safety
      - ev-n3-cards
    performance:
      score: 3
      rationale: 'Competitive frontier-scale open models (hybrid Mamba-Transformer LatentMoE, up to 1M
