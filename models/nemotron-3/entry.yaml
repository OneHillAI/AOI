    scores), the Apache-2.0 NeMo Guardrails toolkit and the Apache-2.0 garak red-team scanner at the
    family level.'
  source_type: publisher
  doc_type: model_card
  retrieved: true
  url: https://huggingface.co/nvidia/Nemotron-3-Content-Safety
