        field-of-use restriction, terminating only on the licensee bringing IP litigation over the
        Work or an output from it - more permissive than the earlier aggregate reading claimed. Held
        at 3, not 4, by the regulatory-readiness half: the licence is source-available and not OSI,
        there is no formal GPAI documentation package, no public training-content summary and no
        copyright policy, and NVIDIA is not a GPAI Code of Practice signatory.

        '
