ownership:
  level: partial
  factors:
    use_modify:
      level: moderate
      rationale: "The NVIDIA Nemotron Open Model License is genuinely permissive - perpetual, royalty-free, IRREVOCABLE, commercial use allowed, no acceptable-use or field-of-use restriction, weights ungated and fine-tunable - which is a real improvement on the earlier reading. It is held at moderate, not strong, because it is Apache-2.0-derived but non-OSI: the termination reaches 'an output from the Work' (broader than Apache-2.0) and redistribution must carry the NVIDIA attribution notice, so it is an open_weight community licence with conditions, short of Ultra's unconditional OpenMDW 'deal without restriction' grant."
      # grounded in: ev-n3-oml (license, retrieved) - irrevocable grant + output-reaching termination + attribution notice
    transparency:
      level: strong
      rationale: "Unusually inspectable for the registry: ungated weights, a white paper, runnable training recipes, and partially released post-training data under CC-BY-4.0 let you see a great deal of how the model was built (open_weights_recipe tier). The limit is reproducibility, not visibility - the full corpus is not released - which caps the openness tier, not transparency."
      # grounded in: ev-n3-data (training_data, retrieved) - released recipes + CC-BY post-training datasets; ev-n3-report (technical_report, retrieved) - white paper
    reliability:
      level: moderate
      rationale: "Operational is strong (4: broad serving, official quantizations, a small portable Nano), but safety is only 3: there is no published model-level safety evaluation or independent red-team, so misuse control is a gap you must fill yourself with the downloadable guard stack. Under the ownership rule a safety score of 3 caps this factor at moderate, however capable the models are."
      # grounded in: dimension scores operational 4 / safety 3; ev-n3-safety
    data_control:
      level: strong
      rationale: "Self-hosted via NIM, the weights and inference run on your own infrastructure and data never leaves your enclave, and the licence claws back no rights - the grant is explicitly IRREVOCABLE, terminating only on the licensee's own IP litigation. That is the strong case for a self-hostable model."
      # grounded in: ev-n3-nim (deployment, retrieved) - self-hosted, data stays in your enclave; ev-n3-oml (license, retrieved) - irrevocable grant, no revocation claw-back
  verdict: "You get unusually strong transparency for an open model - ungated weights, a white paper, runnable recipes and CC-BY post-training data - and, on the corrected licence reading, a clean irrevocable grant with no field-of-use restriction, so self-hosting keeps your data and rights yours. Ownership stays partial, not substantial, because the corpus is only partly released (not reproducible), the non-OSI licence with its attribution notice and output-reaching termination holds use-and-modify at moderate, and the absence of a published model-level safety evaluation holds reliability at moderate. Self-host via NIM, assemble the downloadable guard stack, and red-team for your own use case."

