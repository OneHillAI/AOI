    training_data: partial
    training_code: open
    evaluation: partial
    documentation: open
    license: partial
  license:
    spdx: ''
    name: NVIDIA Nemotron Open Model License (v. 2025-12-15)
    classification: open_weight
    commercial_use: allowed
    notable_restrictions:
    - Apache-2.0-derived and source-available, not OSI (the termination reaches "an output from the
      Work", broader than Apache-2.0)
    - Redistribution must carry the attribution notice "Licensed by NVIDIA Corporation under the
      NVIDIA Nemotron Model License"
    - Terminates only on the licensee filing patent or copyright litigation over the Work or an
      output from it; otherwise perpetual and IRREVOCABLE, with no acceptable-use or field-of-use
      restriction and no guardrail clause
    url: https://www.nvidia.com/en-us/agreements/enterprise-software/nvidia-nemotron-open-model-license/
provenance:
  canonical_source: https://huggingface.co/nvidia
  verified_org_on_primary_host: true
  formats:
