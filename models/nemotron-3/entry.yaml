schema_version: '2.0'
id: nemotron-3
name: NVIDIA Nemotron 3 (Super + Nano)
aliases:
- Nemotron 3 Super
- Nemotron 3 Nano
- Nemotron-3-Super
- Nemotron-3-Nano
- nvidia/NVIDIA-Nemotron-3-Super-120B-A12B
- nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B
family:
  id: nemotron
  name: NVIDIA Nemotron
publisher:
  name: NVIDIA
  country: US
  accountable_entity: true
  url: https://huggingface.co/nvidia
  security_contact: https://www.nvidia.com/en-us/security/
summary: 'NVIDIA Nemotron 3 Super and Nano are the text flagships of NVIDIA''s open, agent-focused hybrid Mamba-Transformer Mixture-of-Experts family. Super has 120B total / 12B active parameters and Nano has 30B / 3.5B active. Both have a context window up to 1M tokens and were trained on roughly 25T tokens. Ungated safetensors weights, runnable training recipes, a white paper and post-training datasets under CC-BY-4.0 place them in the open_weights_recipe tier. Both are governed by the NVIDIA Nemotron Open Model License (v. 2025-12-15), an Apache-2.0-derived, source-available (non-OSI) licence. The grant is perpetual, worldwide, royalty-free and irrevocable, with commercial use allowed and no acceptable-use or field-of-use restriction. It terminates only if the licensee brings patent or copyright litigation over the Work or an output from it. Two things cap ownership at partial. The training corpus is only partly released: the official recipes "train exclusively on the open-sourced subset of training data", so the model is not reproducible. And no model-level safety evaluation or independent red-team is published for the base models; safety appears only as post-training data curation. NVIDIA does ship a downloadable companion guard classifier (Nemotron-3-Content-Safety) plus the Apache-2.0 NeMo Guardrails and garak tooling at the family level.'
variants:
- name: NVIDIA-Nemotron-3-Super-120B-A12B
  params_total: 120B
  params_active: 12B
  context_window: 1M
  kind: reasoning
  safety_tuned: true
- name: NVIDIA-Nemotron-3-Nano-30B-A3B
  params_total: 30B
  params_active: 3.5B
  context_window: 1M
  kind: reasoning
  safety_tuned: true
openness:
  tier: open_weights_recipe
  components:
    weights: open
    training_data: partial
    training_code: open
    evaluation: partial
    documentation: open
    license: partial
  license:
    spdx: ''
    name: NVIDIA Nemotron Open Model License (v. 2025-12-15)
    classification: open_weight
    commercial_use: allowed
    notable_restrictions:
    - 'Apache-2.0-derived and source-available, not OSI (the termination reaches "an output from the Work", broader than Apache-2.0)'
    - 'Redistribution must carry the attribution notice "Licensed by NVIDIA Corporation under the NVIDIA Nemotron Model License"'
    - "Terminates only on the licensee filing patent or copyright litigation over the Work or an output from it; otherwise perpetual and irrevocable, with no acceptable-use or field-of-use restriction and no guardrail clause"
    - "Section 7 carries a general indemnity sentence (the licensee indemnifies NVIDIA against third-party claims arising from its use or distribution). The Nano safety.md subcard links the generic NVIDIA Open Model License instead of this one, but the README and licence tag name this licence"
    url: https://www.nvidia.com/en-us/agreements/enterprise-software/nvidia-nemotron-open-model-license/
provenance:
  canonical_source: https://huggingface.co/nvidia
  verified_org_on_primary_host: true
  formats:
  - safetensors
  integrity:
    checksums: true
    signed: false
    signing_tech: ''
    provenance_attestation: false
  mirrors_and_quants:
    acknowledged: true
    notable:
    - name: Official BF16 / FP8 / NVFP4 quantizations (nvidia)
      trust: publisher
      note: NVIDIA publishes official BF16, FP8 and NVFP4 variants for Super and Nano, and a separate
        MTPv2 head checkpoint for Super; pin the revision and verify checksums
  checkpoint_checklist_score: 4
  scanner_result: {}
  incidents: []
eu_ai_act:
  is_gpai: true
  systemic_risk:
    designated: false
    training_flops_estimate: "Not published. Only training-token counts are disclosed (~25T tokens for both Super and Nano). No absolute FLOP or GPU-hour figure appears in the white paper abstract, model cards or blogs."
    over_1e25_threshold: null
    article_55_docs_available: n/a
  open_source_exemption:
    license_qualifies: uncertain
    rationale: "NVIDIA publishes weights, recipes, a white paper and partial training data, which is more than most. The NVIDIA Nemotron Open Model License is irrevocable and carries no field-of-use restriction. But it is source-available and not OSI, there is no formal GPAI documentation package, no public training-content summary and no copyright policy, and NVIDIA is not a GPAI Code of Practice signatory. A non-OSI licence without the GPAI documentation package most likely does not cleanly reach the EU AI Act open-source exemption. Recorded as 'uncertain' pending the full Article 53 analysis."
  provider_package:
    technical_documentation: partial
    downstream_information: partial
    copyright_policy: 'no'
    training_content_summary: partial
    code_of_practice_signatory: false
  deployer_notes: "NVIDIA (US-based) provides more than most: a white paper, runnable recipes, and partially released, partly CC-BY-4.0 training data. An EU deployer has a real information base, and the governing licence is irrevocable with no acceptable-use restriction. But there is no formal EU AI Act GPAI documentation package, no copyright policy, NVIDIA is not a GPAI Code of Practice signatory, and the training corpus is not fully released. Training compute is undisclosed, but at ~25T tokens on a 120B / 30B scale a systemic-risk designation is not indicated for these two models."
  last_assessed: '2026-08-03'
performance: {}
behaviour: {}
safety: {}
deployment:
  ceiling_tier: T3
  ceiling_conditional: true
  hardware_notes: "Nano (30B / 3.5B active) is portable and runs on modest single-GPU hardware. Super (120B / 12B) is a mid-tier multi-GPU target. Official BF16 / FP8 / NVFP4 quantizations are published for each. Exact per-GPU VRAM is not stated; size against the variant."
  serving_support:
  - vllm
  - sglang
  - ollama
  - llama.cpp
  - nim
  controls_required:
  - "Add NVIDIA's downloadable safety stack: a guard classifier (Nemotron-3-Content-Safety), the Apache-2.0 NeMo Guardrails toolkit for input/output/action rails, and the Apache-2.0 garak red-team scanner. No published model-level safety evaluation exists to rely on"
  - "Run garak (or equivalent) red-team for this use case before autonomous deployment. The base cards carry only a data-filtering note, so misuse characterisation is the deployer's responsibility"
  - "Honour the NVIDIA Nemotron Open Model License attribution notice on redistribution. The grant is irrevocable and carries no field-of-use restriction, so ordinary commercial use and modification are unencumbered"
  - "Verify checksums and pin the exact nvidia revision"
score:
  rubric_version: '1.1'
  headline: 66.0
  grade: C
  hard_flags: []
  dimensions:
    openness:
      score: 4
      rationale: 'Ungated safetensors weights, runnable training recipes on GitHub, a white paper and post-training datasets under CC-BY-4.0 put Super and Nano at the open_weights_recipe tier, materially more open than the open-weights norm. The score is below 5 (fully open) because the training corpus is only partially released. The official recipes "train exclusively on the open-sourced subset of training data", and the pretraining web corpus is under a custom NVIDIA data licence, so the model is not reproducible.'
      evidence_refs:
      - ev-n3-data
      - ev-n3-report
    provenance:
      score: 3
      rationale: "Distributed from the verified nvidia org on Hugging Face as ungated safetensors with official BF16 / FP8 / NVFP4 quantization variants and a clear canonical source (checklist ~4/8). That meets the score-3 anchor. The score is below 4 because published checksums, checkpoint scanning and a documented signing/attestation policy are unconfirmed, and below 5 for lack of cryptographic weight signing / SLSA provenance."
      evidence_refs:
      - ev-n3-provenance
      - ev-n3-cards
    legal:
      score: 3
      rationale: "A commercially permissive grant for common uses: the NVIDIA Nemotron Open Model License is perpetual, royalty-free and irrevocable, with no acceptable-use or field-of-use restriction, and terminates only on the licensee bringing IP litigation over the Work or an output from it. The score is 3 and not 4 because of regulatory readiness. The licence is source-available and not OSI, there is no formal GPAI documentation package, no public training-content summary and no copyright policy, and NVIDIA is not a GPAI Code of Practice signatory."
      evidence_refs:
      - ev-n3-oml
      - ev-n3-eu
    safety:
      score: 3
      rationale: "A safety-tuned release (Nemotron-SFT-Safety post-training data plus keyword/regex filtering) with a downloadable, multi-domain companion guard classifier (Nemotron-3-Content-Safety, 23 categories / 12 languages) and the Apache-2.0 NeMo Guardrails and garak tooling at the family level. The score is 3 because no model-level safety evaluation or independent red-team is published: the base cards carry only a data-filtering note and the white paper's safety section is a contributor list. The downloadable companion guard stack keeps the score from dropping to 2."
      evidence_refs:
      - ev-n3-safety
      - ev-n3-cards
    performance:
      score: 3
      rationale: "Competitive frontier-scale open models (hybrid Mamba-Transformer LatentMoE, up to 1M context, ~25T training tokens) across a Super and Nano pair. The score is 3 because the evidence is publisher and architectural (model cards and white paper). OneHill has not reproduced the benchmarks, and no independent third-party re-runs exist, so class-leading claims are unverified."
      evidence_refs:
      - ev-n3-cards
      - ev-n3-report
    operational:
      score: 4
      rationale: "Broad, mature serving story: vLLM, SGLang, Ollama, llama.cpp and NVIDIA's own NIM self-hosted microservices, with official BF16 / FP8 / NVFP4 quantizations and a small Nano (30B / 3.5B active) that runs on modest hardware. The score is below 5 because exact hardware/scaling guidance is unverified per variant and day-0 ecosystem breadth is publisher-reported."
      evidence_refs:
      - ev-n3-nim
      - ev-n3-cards
    governance:
      score: 3
      rationale: "A reputable, accountable publisher (NVIDIA) with a white paper, a verified hub presence, an active release cadence and a general corporate security-reporting path. The score is 3 because a model-specific vulnerability-disclosure and deprecation policy is unconfirmed and NVIDIA is not a GPAI Code of Practice signatory."
      evidence_refs:
      - ev-n3-cards
      - ev-n3-eu

# --- Assessed signals: five cross-cutting attributes highlighted at the top of the entry.
signals:
  trainability:
    level: partial
    dimension: openness
    summary: "Fine-tune and run NVIDIA's released recipes, with post-training data under CC-BY-4.0. The recipes train on the open subset only and the full corpus is under a custom NVIDIA data licence, so the model can be adapted and not fully reproduced."
    refs: [ev-n3-data, ev-n3-report]
  knowledge_structure:
    level: moderate
    dimension: performance
    summary: "Frontier-scale hybrid Mamba-Transformer MoE with up to 1M context across a Super/Nano pair; capable and well-documented, but not independently benchmarked, so class-leading claims are publisher-reported."
    refs: [ev-n3-cards, ev-n3-report]
  specialization:
    level: strong
    dimension: openness
    summary: "Runnable recipes, CC-BY post-training datasets, a downloadable guard model and a small Nano variant support agent specialisation and make domain adaptation accessible as well as permitted."
    refs: [ev-n3-data, ev-n3-safety]
  exchangeability:
    level: high
    dimension: operational
    summary: "Portable safetensors across vLLM/SGLang/Ollama/llama.cpp/NIM with official quantizations and a real size step - the Nano (30B / 3.5B active) is a near-drop-in single-GPU model, unusual at this capability level."
    refs: [ev-n3-nim, ev-n3-cards]
  misuse_exposure:
    level: partial
    dimension: safety
    summary: "Misuse is partly mitigated and not characterised at the model level. A downloadable guard classifier, a guardrails toolkit and the garak red-team scanner exist, but there is no published model-level safety evaluation or independent red-team."
    refs: [ev-n3-safety, ev-n3-cards]

