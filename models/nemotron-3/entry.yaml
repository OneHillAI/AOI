changelog:
- date: '2026-08-03'
  change: Initial entry (NVIDIA Nemotron 3 Super + Nano), split out of the former aggregate nemotron entry so each per-licence release is scored on its own. Governed by the NVIDIA Nemotron Open Model License (v. 2025-12-15); the corrected reading records it as Apache-2.0-derived, perpetual, royalty-free and IRREVOCABLE with no acceptable-use / field-of-use restriction and no guardrail clause (the earlier revocable / Trustworthy-AI reading was wrong and belonged to a different, generic NVIDIA licence). open_weights_recipe (tier 4, partial corpus). Safety scored 3, not the old aggregate 4, because there is no published model-level safety evaluation - only post-training data curation plus a downloadable family guard stack. AOI 66.0, grade C, ownership partial.
