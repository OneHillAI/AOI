# --- Assessed signals: five cross-cutting attributes highlighted at the top of the entry.
signals:
  trainability:
    level: partial
    dimension: openness
    summary: "Fine-tune and even run NVIDIA's released recipes, with post-training data under CC-BY-4.0 - but the recipes train on the open subset only and the full corpus is under a custom NVIDIA data licence, so you can adapt, not fully reproduce."
    refs: [ev-n3-data, ev-n3-report]
  knowledge_structure:
    level: moderate
    dimension: performance
    summary: "Frontier-scale hybrid Mamba-Transformer MoE with up to 1M context across a Super/Nano pair; capable and well-documented, but not independently benchmarked in this pass, so treat class-leading claims as publisher-reported."
    refs: [ev-n3-cards, ev-n3-report]
  specialization:
    level: strong
    dimension: openness
    summary: "Built for agent specialisation: released runnable recipes, CC-BY post-training datasets, a downloadable guard model, and a small Nano variant make domain adaptation genuinely accessible, not just theoretically permitted."
    refs: [ev-n3-data, ev-n3-safety]
  exchangeability:
    level: high
    dimension: operational
    summary: "Portable safetensors across vLLM/SGLang/Ollama/llama.cpp/NIM with official quantizations and a real size step - the Nano (30B / 3.5B active) is a near-drop-in single-GPU model, unusual at this capability level."
    refs: [ev-n3-nim, ev-n3-cards]
  misuse_exposure:
    level: partial
    dimension: safety
    summary: "Misuse is partly mitigated but not characterised at the model level: a downloadable guard classifier, a guardrails toolkit and the garak red-team scanner exist, but there is no published model-level safety evaluation or independent red-team."
    refs: [ev-n3-safety, ev-n3-cards]

