    ungated safetensors with BF16/FP8/NVFP4 variants; both cards state "a family of open models with
    open weights, training data, and recipes"; licence tag nvidia-nemotron-open-model-license.'
  source_type: publisher
  doc_type: model_card
  retrieved: true
  url: https://huggingface.co/nvidia/NVIDIA-Nemotron-3-Super-120B-A12B-BF16
  date: '2026-08-03'
- id: ev-n3-oml
  claim: 'NVIDIA Nemotron Open Model License (v. 2025-12-15), read: "perpetual, worldwide,
    non-exclusive, no-charge, royalty-free, irrevocable license to reproduce, prepare Derivative
    Works of, publicly display, publicly perform, sublicense, and distribute the Work ... in source
    or object form." Terminates ONLY if the licensee institutes patent or copyright litigation
    alleging the Work or an output from the Work infringes. NO Trustworthy-AI clause, NO acceptable-use
    restriction, NO guardrail clause. Attribution notice "Licensed by NVIDIA Corporation under the
    NVIDIA Nemotron Model License". Governing law US / Delaware. NOT OSI. Commercial use allowed.'
