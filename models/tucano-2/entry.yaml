# OneHill v2 MODEL library entry for Tucano 2 (Qwen-derived 0.5B, 1.5B and 3.7B suite, Polygl0t).
# Validated against schema/model.v2.schema.json.
#   scores    -> scripts/score.py --write        (AOI headline/grade)
#   meters    -> scripts/completeness.py --write  (per-domain completeness/originality)
#   prose     -> assess.md / implement.md / use.md / support.md (sections keyed <!-- item: KEY -->)
# Grounded 2026-11-19 against docs/primary-sources/tucano-2/ (see _sources.md). No OneHill evaluation
# has been run, so there is no onehill_verified evidence and every documentation item is aggregated or a gap.

schema_version: "2.0"
id: tucano-2
name: Tucano 2 (Qwen-derived 0.5B, 1.5B and 3.7B; Base, Instruct and Think)
family:
  id: tucano
  name: Tucano
aliases:
- Tucano2
- Tucano2-qwen
- Tucano2-qwen-3.7B-Instruct
- Polygl0t/Tucano2-qwen-3.7B-Instruct
publisher:
  name: Polygl0t (University of Bonn research groups)
  country: Germany
  accountable_entity: true
  url: https://huggingface.co/Polygl0t
  security_contact: kluge@uni-bonn.de (SECURITY.md of the llm-foundry code repository; the model repos publish none)
summary: "Tucano 2 is an Apache-2.0 suite of nine Portuguese models (0.5B, 1.5B and 3.7B, each as Base, Instruct and Think) with public corpora, training code, configs and logs, and it suits adoption as a Portuguese base for fine-tuning. All nine continue pretraining from Qwen3 base models with a transplanted 49K-token tokenizer, so none is trained from scratch. The GigaVerbo-v2 corpus has no single licence and includes two CC-BY-NC sources. Every benchmark is the publisher's own, no safety evaluation is published, and the context is 4,096 tokens. A separate from-scratch 0.6B base exists and is listed as a follow-up."
