  is_gpai: true
  systemic_risk:
    designated: false
    training_flops_estimate: "Estimate of about 8.6e23 FLOPs for the Qwen3-4B base (6 x 4B parameters x 36T tokens, from the Qwen3 card), plus 0.13% more for the Tucano continual pretraining (paper). This is a OneHill estimate, not a publisher figure."
    over_1e25_threshold: false
    article_55_docs_available: n/a
  open_source_exemption:
    license_qualifies: "yes"
    rationale: "Apache-2.0 is a free and open-source licence, the weights, architecture and usage information are public, and no monetisation is documented. The exemption does not cover the copyright policy or the public training-content summary, and no standalone version of either exists."
  provider_package:
    technical_documentation: partial
    downstream_information: partial
    copyright_policy: 'no'
    training_content_summary: partial
    code_of_practice_signatory: false
  deployer_notes: "The paper and dataset cards give compute, energy, data sources with licences, generator models and training recipes, so a deployer can assemble most technical documentation for the Tucano stages. The Qwen3 base stage is documented only by the Qwen3 card, which gives 36T tokens in 119 languages and no data list. The paper does not mention the EU AI Act, and no code-of-practice signatory status appears in any document. A fine-tuner who places a derivative on the EU market may become a provider for it."
  last_assessed: '2026-11-19'
performance: {}
behaviour: {}
safety: {}
deployment:
  ceiling_tier: T1
  ceiling_conditional: true
  hardware_notes: "The bf16 weights are 7.52 GB (3.7B Instruct, two shards), 3.02 GB (1.5B) and 0.98 GB (0.5B). A third-party vLLM run served the 3.7B Instruct in bf16 on an RTX 3080 with 8.7 GiB of VRAM, 4,096 context and a 1 GiB KV cache, at 79.4 tokens per second for one request. The publisher gives no requirements table."
  serving_support:
  - transformers
  - vllm
  - mlx
  controls_required:
  - Keep a human reading every output (T1), because no safety evaluation is published
  - Run your own Portuguese safety, bias and toxicity evaluation before wider use
  - Add input and output guardrails, since no guard model or acceptable-use policy ships
  - Pin the repo revision and record the Hugging Face LFS sha256 of each safetensors shard
  - Add the Apache-2.0 text to anything you redistribute, since Tucano2-qwen-1.5B-Base ships none
  - Record the mixed GigaVerbo-v2 source licences, including the CC-BY-NC sources, in your AI-BOM
  - Keep prompts and context within 4,096 tokens
score:
  rubric_version: '1.1'
  headline: 54.4
  grade: D
  hard_flags: []
  dimensions:
    openness:
      score: 4
      rationale: "Weights, training code (llm-foundry), configs, logs, evaluation harness and four datasets (GigaVerbo-v2, Synth, SFT, Preferences) are public and ungated under Apache-2.0 or other stated licences. The score stops at 4 because the Qwen3 base stage has no public data or code, and the corpus has no unified licence."
      evidence_refs:
      - ev-card-instruct
      - ev-card-base
      - ev-paper
      - ev-gv2
      - ev-gv2-post
      - ev-code
      - ev-licence-files
    provenance:
      score: 2
      rationale: "Safetensors only, with a Hugging Face LFS sha256 per file, and a clear lineage to Qwen3 base models. The Polygl0t organisation is unverified, nothing is signed or attested, no checksum file ships, and the scan result could not be determined. Anchor 3 needs a verified publisher organisation."
      evidence_refs:
      - ev-hf-platform
      - ev-card-base
      - ev-qwen3-licence
    legal:
      score: 3
      rationale: "Apache-2.0 LICENSE files, a stated commercial-use grant, and a paper that lists sources, generators, compute and energy support common uses. Gaps hold it at 3: the corpus has no unified licence and lists two CC-BY-NC sources, there is no copyright policy or EU AI Act statement, the Qwen3 base data is undisclosed, and Tucano2-qwen-1.5B-Base has no LICENSE file."
      evidence_refs:
      - ev-licence-files
      - ev-gv2
      - ev-gv2-post
      - ev-paper
      - ev-qwen3-licence
      - ev-qwen25-licence
    safety:
      score: 2
      rationale: "The Instruct and Think models are safety-tuned with a published 28,437-pair preference set built from written constitutions, and the cards list hallucination, bias, toxicity and repetition. No safety, jailbreak or red-team evaluation is published, no acceptable-use policy or guard model ships, and the Base models have no safety tuning."
      evidence_refs:
      - ev-card-instruct
      - ev-paper
      - ev-gv2-post
      - ev-configs
    performance:
      score: 2
      rationale: "The publisher reports the top Knowledge and Reasoning score in the 3 to 4B class (NPM 56.22) and weaker instruction following (41.67) and coding (47.56) than Qwen3-4B. All figures come from the publisher's own harness. One third-party run on 393 ENEM questions gave 74.6% for the 3.7B Instruct, which covers one benchmark only."
      evidence_refs:
      - ev-card-instruct
      - ev-paper
      - ev-community
    operational:
      score: 3
      rationale: "The weights use the standard Qwen3 architecture in transformers with safetensors. A third party ran the 3.7B Instruct on vLLM in 8.7 GiB of VRAM and made an MLX 4-bit build. The publisher documents no serving stack beyond transformers, ships no quantised weights and gives no hardware table."
      evidence_refs:
      - ev-card-instruct
      - ev-configs
      - ev-community
      - ev-hf-platform
    governance:
      score: 3
      rationale: "A named University of Bonn team with a funded project (BMBF and the NRW science ministry), an arXiv paper, a prior Tucano series and a 2026-08-13 update to the post-trained repos. The Hugging Face organisation is unverified, the model repos have no security contact or discussions, the copyright holders are individuals, and there is no deprecation policy."
      evidence_refs:
      - ev-paper
      - ev-hf-platform
      - ev-code

# --- Assessed signals.
signals:
  trainability:
    level: full
    dimension: openness
    summary: "Apache-2.0 weights, the full training code, YAML configs, logs, intermediate base checkpoints and four open datasets allow fine-tuning, continued pretraining and rerunning the Tucano stages. Only the Qwen3 stage below them is closed."
    refs: [ev-card-base, ev-configs, ev-code, ev-gv2-post]
  knowledge_structure:
    level: moderate
    dimension: performance
    summary: "The 3.7B Instruct scores 85.22 on Belebele and 64.64 on MMLU (publisher figures), and the SFT dataset holds 1.0B tokens of retrieval-augmented data, of which the Instruct mix draws about 2.2 million. The 4,096-token context and a RULER-PT score of 0.686 at 4,096 tokens (Qwen3-4B 0.979) limit long-document use."
    refs: [ev-card-instruct, ev-paper]
  specialization:
    level: strong
    dimension: openness
    summary: "The recipe for adapting a Qwen3 base to Portuguese is published end to end: tokenizer transplantation, data mixtures, hyperparameters, code and datasets, with 0.5B, 1.5B and 3.7B examples."
    refs: [ev-paper, ev-configs, ev-code]
  exchangeability:
    level: medium
    dimension: operational
    summary: "The Qwen3 architecture loads in transformers, and third parties report a vLLM deployment and an MLX 4-bit build. The tokenizer is a custom 49K vocabulary, and the publisher ships no GGUF, other quantised weights or hosted endpoint."
    refs: [ev-card-instruct, ev-community, ev-hf-platform]
  misuse_exposure:
    level: unbenchmarked
    dimension: safety
    summary: "Safety tuning uses refusal preference pairs, but no safety, jailbreak or toxicity benchmark of the models is published. The paper tells users to run their own risk assessment."
    refs: [ev-paper, ev-gv2-post]

# --- Four documentation domains.
documentation:
