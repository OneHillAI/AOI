        title: "Licence terms & permitted use"
        doc_type: reference
        source_type: aggregated
        coverage: full
        refs: [ev-licence-files, ev-qwen3-licence, ev-qwen25-licence, ev-gv2]
        summary: "Apache-2.0 on every Tucano 2 weights repo, with a LICENSE file in all but Tucano2-qwen-1.5B-Base. Upstream Qwen3 and Qwen2.5 models are Apache-2.0. The corpus licence is mixed."
      - key: provenance
        title: "Supply-chain & provenance"
        doc_type: reference
        source_type: aggregated
        coverage: full
        refs: [ev-hf-platform, ev-card-base, ev-card-06b, ev-qwen3-licence, ev-paper]
