        doc_type: reference
        source_type: aggregated
        coverage: full
        refs: [ev-card-instruct, ev-card-base, ev-card-think]
        summary: "Research and development on Portuguese language modelling, and fine-tuning for deployment under Apache-2.0. The Base models are not for deployment or human-facing use, and all models are for Portuguese only."
      - key: limitations
        title: "Known limitations, bias & failure modes"
        doc_type: reference
        source_type: aggregated
        coverage: full
        refs: [ev-card-instruct, ev-paper, ev-community]
        summary: "Hallucination, social bias, toxicity, repetition loops, weaker instruction following and coding than Qwen3-4B, and weak long-context scores. A third party saw a fabricated fact and a wrong self-description."
      - key: openness
        title: "Openness tier & components"
        doc_type: reference
        source_type: aggregated
        coverage: full
        refs: [ev-card-base, ev-paper, ev-gv2, ev-gv2-post, ev-code, ev-qwen3-licence]
        summary: "open_weights_recipe: weights, code, configs, logs, harness and four datasets are public. The Qwen3 base data is not, and GigaVerbo-v2 has no single licence."
