ownership:
  level: partial
  factors:
    use_modify:
      level: strong
      rationale: "Apache-2.0 LICENSE files, ungated weights and open training code, configs and data let you run, modify and redistribute the models commercially (ev-licence-files, ev-configs, ev-code). Tucano2-qwen-1.5B-Base lacks a LICENSE file."
    transparency:
      level: moderate
      rationale: "The Tucano stages are documented down to configs, logs and datasets (ev-paper, ev-configs). The Qwen3 base stage and its 36T-token data are undisclosed (ev-qwen3-licence), and the corpus carries no single licence (ev-gv2)."
    reliability:
      level: weak
      rationale: "Safety is rated 2 because no safety evaluation, acceptable-use policy or guard model is published (ev-card-instruct, ev-paper). Operational readiness is 3, with no official quantisation or serving guide."
    data_control:
      level: strong
      rationale: "The weights run on your own hardware under Apache-2.0 with no clawback clause, and the architecture is the standard Qwen3 class with no remote code (ev-licence-files, ev-configs)."
  verdict: "You own the weights: Apache-2.0, ungated, commercial use allowed, with the code and data to retrain the Tucano stages on your own hardware. You do not own a verified safe assistant, because no safety evaluation exists, and you cannot rebuild the Qwen3 stage underneath. The level rises if Polygl0t publishes a safety evaluation and resolves the mixed licence of the training corpus."

evidence:
- id: ev-card-instruct
  claim: "The 3.7B Instruct card declares Apache-2.0, 3,759,341,056 parameters and a 4,096-token context, and describes one SFT round and one APO round on gigaverbo-v2-sft and gigaverbo-v2-preferences. It lists hallucination, bias, toxicity and repetition as limitations. All benchmark figures are the publisher's own."
  source_type: publisher
  doc_type: model_card
  retrieved: true
  url: https://huggingface.co/Polygl0t/Tucano2-qwen-3.7B-Instruct
  date: '2026-11-19'
- id: ev-card-base
  claim: "The 3.7B Base card says the model is continually pretrained from Qwen3-4B-Base on about 50 billion tokens, with the Tucano2 tokenizer transplanted by Orthogonal Matching Pursuit. It declares Apache-2.0, says the model is not intended for deployment, and states that all data, code and recipes are open."
  source_type: publisher
  doc_type: model_card
  retrieved: true
  url: https://huggingface.co/Polygl0t/Tucano2-qwen-3.7B-Base
  date: '2026-11-19'
- id: ev-card-think
  claim: "The 3.7B Think card declares Apache-2.0 and describes a reasoning model trained with SFT and APO that writes chain-of-thought inside think tags. It reports total NPM 51.27, and its limitations match the Instruct card."
  source_type: publisher
  doc_type: model_card
  retrieved: true
  url: https://huggingface.co/Polygl0t/Tucano2-qwen-3.7B-Think
