summary: 'DeepSeek-V3 (MIT) is the general-purpose instruct line of DeepSeek-V3 as released under a
  clean MIT licence - the V3-0324 refresh and the V3.1 hybrid generation, both 671B-total / 37B-active
  Mixture-of-Experts models with a 128K context. It is a separate entry from the original December-2024
  DeepSeek-V3 because the licence changed: the original V3 weights shipped under the custom "DeepSeek
  License Agreement v1.0" (with RAIL-style use restrictions), whereas V3-0324 and later moved the
  weights to MIT, permitting commercial use and modification without field-of-use limits. That licence
  change is a scored divergence, so the two V3 generations are scored apart. Under MIT, use-and-modify
  is strong and ownership is substantial. What holds it short of full is the rest of the profile,
  carried from the family: closed training data and only partial training code (open_weights, not
  reproducible), safety tuning lighter than Western frontier labs with China-aligned topic filtering
  and no first-party guard model, and no EU AI Act documentation package, with the 671B scale putting
  the systemic-risk question in play. Serving support is first-class (vLLM, SGLang, llama.cpp, Ollama).

  '
