      H800 GPU-hours over 14.8T tokens for the original run; a 671B-total / 37B-active MoE at this scale
      plausibly sits near systemic-risk territory, but DeepSeek discloses no FLOP budget, so the 1e25
      crossing is not a grounded figure.'
    over_1e25_threshold: null
    article_55_docs_available: 'no'
  open_source_exemption:
    license_qualifies: partial
    rationale: 'The MIT licence is genuinely free and open-source, so on the licence axis the MIT V3
      generations are a strong candidate for the Article 53 open-source exemption. But the surviving
      obligations are unmet: no copyright policy and no public training-content summary are published,
      the training corpus is closed, and a China-based provider is unlikely to furnish an EU
      documentation package. If a generation crosses the systemic-risk threshold the exemption does not
      apply to those duties. Recorded as partial.

      '
