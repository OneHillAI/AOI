summary: "DeepSeek-V3 (MIT) covers the V3-0324 refresh and the V3.1 hybrid generation, both 671B-total / 37B-active Mixture-of-Experts instruct models with a 128K context, released under the MIT licence. The original December-2024 V3 weights carry the custom DeepSeek License Agreement v1.0 with RAIL-style use restrictions, so that generation is scored apart as deepseek-v3-original. MIT permits commercial use and modification without field-of-use limits, so use-and-modify is strong and ownership is substantial. Ownership stops short of full: the model is open_weights and not reproducible (training data closed, training code partial), safety tuning is lighter than at Western frontier labs, topic filtering follows Chinese content rules, and no first-party guard model ships. No EU AI Act documentation package exists, and the 671B scale leaves the systemic-risk question open. Serving support is first-class (vLLM, SGLang, llama.cpp, Ollama)."
