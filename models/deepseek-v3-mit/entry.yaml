ownership:
  level: substantial
  factors:
    use_modify:
      level: strong
      rationale: "The V3-0324 and V3.1 generations are MIT-licensed (OSI, permissive, ungated), with commercial use and any modifications permitted and no field-of-use limit - a clean permissive grant, so use-and-modify is strong."
      # grounded in: ev-dsv3m-license (license, retrieved) - MIT for V3-0324/V3.1
    transparency:
      level: moderate
      rationale: "Weights are inspectable and there is a detailed technical report, but the training data and code are closed, and the weights carry China-aligned topic filtering you cannot inspect - open_weights, so moderate."
      # grounded in: ev-dsv3m-card (model_card) - open_weights; ev-dsv3m-behaviour (third_party) - China-aligned filtering
    reliability:
      level: strong
      rationale: "Performance 4, operational 5 and safety 3: a strong instruct model with first-class serving; all three at or above 3 with two at or above 4, so reliability is strong. The caveat is the absence of a first-party guard model."
      # grounded in: dimension scores performance 4 / operational 5 / safety 3
    data_control:
      level: strong
      rationale: "Self-hosted, the MIT weights run entirely on your own infrastructure with no telemetry and no licence claw-back, so your data stays yours. (The hosted DeepSeek API is a separate matter with its own data terms.)"
      # grounded in: ev-dsv3m-license (license, retrieved) - MIT, no claw-back; self-hosting structural
  verdict: "You substantially own the self-hosted MIT DeepSeek-V3 generations: MIT permits commercial use and modification, and self-hosting keeps your data yours, so use-and-modify and data-control are both strong - ownership is substantial. It stops short of full because the training corpus and code are closed (not reproducible), the weights carry China-aligned filtering you cannot inspect, and there is no first-party guard model. Note the original Dec-2024 V3 weights are the more restrictive deepseek-v3-original entry - confirm you are on a V3-0324-or-later MIT checkpoint. Deploy behind your own guardrails, and treat EU high-stakes use as needing a self-assembled compliance package."
