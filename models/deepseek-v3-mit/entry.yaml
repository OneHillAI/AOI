# OneHill v2 MODEL library entry for the MIT-licensed DeepSeek-V3 generations (V3-0324, V3.1).
# Split from the aggregate deepseek entry: the general-instruct V3 line AFTER it moved to MIT.
# The original Dec-2024 V3 weights (custom DeepSeek License Agreement) are the separate
# deepseek-v3-original entry - that licence divergence is the split axis.
# Validated against schema/model.v2.schema.json.

schema_version: '2.0'
