ownership:
  level: substantial
  factors:
    use_modify:
      level: strong
      rationale: "The V3-0324 and V3.1 generations are MIT-licensed (OSI, permissive, ungated), with commercial use and modification permitted and no field-of-use limit, so use-and-modify is strong."
      # grounded in: ev-dsv3m-license (license, retrieved) - MIT for V3-0324/V3.1
    transparency:
      level: moderate
      rationale: "Weights are inspectable and a detailed technical report exists. Training data and code are closed, and the weights carry China-aligned topic filtering that cannot be inspected. The open_weights tier gives moderate transparency."
      # grounded in: ev-dsv3m-card (model_card) - open_weights; ev-dsv3m-behaviour (third_party) - China-aligned filtering
    reliability:
      level: strong
      rationale: "Performance 4, operational 5 and safety 3: all three are at or above 3 and two at or above 4, so reliability is strong. The caveat is that no first-party guard model ships."
      # grounded in: dimension scores performance 4 / operational 5 / safety 3
    data_control:
      level: strong
      rationale: "Self-hosted, the MIT weights run entirely on the deployer's own infrastructure with no telemetry and no licence claw-back, so data stays with the deployer. The hosted DeepSeek API is separate and has its own data terms."
      # grounded in: ev-dsv3m-license (license, retrieved) - MIT, no claw-back; self-hosting structural
  verdict: "Ownership is substantial for the self-hosted MIT DeepSeek-V3 generations. MIT permits commercial use and modification, and self-hosting keeps data with the deployer, so use-and-modify and data-control are both strong. Ownership stops short of full because the training corpus and code are closed, the weights carry China-aligned filtering that cannot be inspected, and no first-party guard model ships. The original Dec-2024 V3 weights fall under the more restrictive deepseek-v3-original entry, so deployers need a V3-0324-or-later MIT checkpoint. Deployment needs the deployer's own guardrails, and EU high-stakes use needs a self-assembled compliance package."
