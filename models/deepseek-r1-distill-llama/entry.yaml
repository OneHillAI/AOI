# OneHill v2 MODEL library entry for the DeepSeek-R1-Distill (Llama base) checkpoints. Split from the
# aggregate deepseek entry on the LICENCE axis: these distils are built on Meta Llama bases (Llama-8B
# = Llama 3.1, Llama-70B = Llama 3.3) and carry the Llama Community Licence - use restrictions, the
# 700M-MAU clause, naming/attribution - distinct from the Apache-2.0 Qwen-base distils
# (deepseek-r1-distill-qwen). The use restrictions drop use-and-modify to moderate and ownership to
# partial. Validated against schema/model.v2.schema.json.

schema_version: '2.0'
id: deepseek-r1-distill-llama
name: DeepSeek-R1-Distill (Llama base)
aliases:
- DeepSeek-R1-Distill-Llama-8B
- DeepSeek-R1-Distill-Llama-70B
family:
  id: deepseek
  name: DeepSeek
publisher:
