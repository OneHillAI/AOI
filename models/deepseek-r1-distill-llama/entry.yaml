ownership:
  level: partial
  factors:
    use_modify:
      level: moderate
      rationale: "The Llama Community Licence permits commercial use and modification. It is non-OSI, with an Acceptable Use Policy, the 700M-MAU clause (a separate Meta licence above that threshold) and naming and attribution duties (\"Built with Llama\"; derivative names must include \"Llama\") that pass to derivatives. Use-and-modify is therefore moderate, below the Apache-2.0 Qwen distils."
      # grounded in: ev-dsrl-license (license, retrieved) - Llama Community Licence AUP + 700M-MAU + naming
    transparency:
      level: moderate
      rationale: "Weights are inspectable. The distillation data and code are closed, and the weights carry R1's China-aligned topic filtering, which cannot be inspected. Open-weights tier, so moderate."
      # grounded in: ev-dsrl-card (model_card) - open_weights; ev-dsrl-behaviour (third_party) - inherited filtering
    reliability:
      level: strong
      rationale: "Performance 3, operational 5 and safety 3: solid reasoning for the size and the broadest serving support of the distils. All three scores are at or above 3 and operational is 5, so reliability is strong. The gap is the absence of own safety tuning or a first-party guard model."
      # grounded in: dimension scores performance 3 / operational 5 / safety 3
    data_control:
      level: strong
      rationale: "Self-hosted, the weights run entirely on the deployer's own infrastructure, on-device at 8B, with no telemetry and no claw-back. The licence restrictions limit use, not data residency."
      # grounded in: ev-dsrl-license (license, retrieved) - self-host, no telemetry; small sizes enable on-device
  verdict: "You partially own these self-hosted Llama-base R1-Distill models. Self-hosting keeps your data yours (data-control strong, reliability strong). The Llama Community Licence's acceptable-use policy, 700M-MAU clause and naming and attribution duties hold use-and-modify at moderate. Ownership is therefore partial, one step below the Apache-2.0 Qwen distils (deepseek-r1-distill-qwen), which reach substantial. Prefer the Qwen distils unless the Llama toolchain is needed. Where these models are used, honour the Llama terms and deploy behind your own guardrails. No EU open-source exemption applies on the licence axis."
