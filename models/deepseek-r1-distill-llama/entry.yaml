ownership:
  level: partial
  factors:
    use_modify:
      level: moderate
      rationale: "The Llama Community Licence permits commercial use and modification, but it is non-OSI with an Acceptable Use Policy, the 700M-MAU clause (a separate Meta licence above that threshold), and naming/attribution duties ('Built with Llama', derivative names must include 'Llama') that flow down to derivatives - so use-and-modify is moderate, not strong. Below the Apache-2.0 Qwen distils."
      # grounded in: ev-dsrl-license (license, retrieved) - Llama Community Licence AUP + 700M-MAU + naming
    transparency:
      level: moderate
      rationale: "Weights are inspectable, but the distillation data and code are closed and the weights inherit R1's China-aligned topic filtering you cannot inspect - open_weights, so moderate."
      # grounded in: ev-dsrl-card (model_card) - open_weights; ev-dsrl-behaviour (third_party) - inherited filtering
    reliability:
      level: strong
      rationale: "Performance 3, operational 5 and safety 3: solid reasoning-for-size with the broadest serving support of the distils; all three at or above 3, operational at 5, so reliability is strong. The caveat is the absence of own safety tuning / a first-party guard model."
      # grounded in: dimension scores performance 3 / operational 5 / safety 3
    data_control:
      level: strong
      rationale: "Self-hosted, the weights run entirely on your own infrastructure - including on-device at 8B - with no telemetry and no claw-back, so your data stays yours. The licence restrictions constrain use, not data residency."
      # grounded in: ev-dsrl-license (license, retrieved) - self-host, no telemetry; small sizes enable on-device
  verdict: "You partially own these self-hosted Llama-base R1-Distill models: self-hosting keeps your data yours (data-control strong, reliability strong), but the Llama Community Licence's acceptable-use policy, 700M-MAU clause, and naming/attribution duties hold use-and-modify to moderate - so ownership is partial, one step below the Apache-2.0 Qwen distils (deepseek-r1-distill-qwen), which reach substantial. For friction-free ownership prefer the Qwen distils unless you specifically need the Llama toolchain; where you use these, honour the Llama terms, deploy behind your own guardrails, and note there is no EU open-source exemption on the licence axis."
