  url: https://huggingface.co/deepseek-ai
  security_contact: https://huggingface.co/deepseek-ai
summary: 'The DeepSeek-R1-Distill checkpoints built on Meta Llama bases - Llama-8B (Llama 3.1) and
  Llama-70B (Llama 3.3) - dense reasoning models distilled from DeepSeek-R1. They are a separate entry
  from the Qwen-base distils because they inherit a different, more restrictive licence: the Llama
  Community Licence, which (unlike Apache-2.0) is non-OSI and carries RAIL-style acceptable-use
  restrictions, the "700M monthly active users" threshold above which you must obtain a separate licence
  from Meta, and naming/attribution requirements ("Built with Llama", derivative names must include
  "Llama"). Those field-of-use restrictions hold use-and-modify to moderate and ownership to partial -
  the material difference from the Apache-2.0 Qwen distils, which reach substantial. Like all the
  distils they are small (not systemic-risk), carry no safety tuning of their own, inherit R1''s
  China-aligned filtering, and are scored strong-for-size rather than frontier-absolute. Trivial to serve
  (llama.cpp, Ollama, vLLM), with the widest hardware and toolchain support of any base thanks to the
  Llama ecosystem.

  '
