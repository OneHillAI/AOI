    training-content summary. You must also honour Meta''s Acceptable Use Policy, the 700M-MAU clause,
    and the "Built with Llama" naming/attribution downstream. Prefer the Apache-2.0 Qwen distils
    (deepseek-r1-distill-qwen) where the use-restriction burden does not apply.

    '
