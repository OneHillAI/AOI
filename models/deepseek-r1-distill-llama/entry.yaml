      free-and-open-source licence (it carries acceptable-use and 700M-MAU field-of-use restrictions), so
      the Article 53 open-source exemption does not apply on the licence axis. The models are not
      systemic-risk, so the systemic-risk duties do not arise, but the transparency obligations are not
      exemption-covered here, and DeepSeek publishes no copyright policy or training-content summary.

      '
