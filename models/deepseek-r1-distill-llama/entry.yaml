summary: "DeepSeek-R1-Distill-Llama-8B (Llama 3.1 base) and -70B (Llama 3.3 base) are dense reasoning models distilled from DeepSeek-R1. They carry the Llama Community Licence, which is not OSI-approved. It includes an acceptable-use policy, a \"700M monthly active users\" threshold above which a separate Meta licence is required, and naming duties (\"Built with Llama\"; derivative names must include \"Llama\"). These restrictions hold use-and-modify at moderate and ownership at partial, one step below the Apache-2.0 Qwen-base distils, which reach substantial. The models are small and not systemic-risk. They have no safety tuning of their own and carry R1's China-aligned filtering. Scores reflect strong performance for the size, not frontier performance. They are easy to serve (llama.cpp, Ollama, vLLM) and have the widest hardware and toolchain support of any distil base."
