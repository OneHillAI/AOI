# OneHill v2 MODEL library entry for Jais 3 (six Arabic-centric agentic models, 0.9B to 375B-A23B).
# Validated against schema/model.v2.schema.json.
#   scores    -> scripts/score.py --write        (AOI headline/grade)
#   meters    -> scripts/completeness.py --write  (per-domain completeness/originality)
#   prose     -> assess.md / implement.md / use.md / support.md (sections keyed <!-- item: KEY -->)
#
# Scope: the entry id is `jais-3`. The scored release is the six inception42/Jais-3-* weights repositories
# (0.9B, 3.7B, 7B, 32B, MoVA-36B-A4B, 375B-A23B). They share one licence declaration, one card text,
# one base lineage (K2 Horizon) and one safety posture. Follow-ups listed in assess.md: K2 Horizon (base),
# the Jais-3 Uno adapters, Jais-ASR. Grounded against docs/primary-sources/jais-3/.

schema_version: "2.0"
id: jais-3
name: Jais 3 (0.9B, 3.7B, 7B, 32B, MoVA-36B-A4B, 375B-A23B)
aliases:
- Jais-3
- inception42/Jais-3-375B-A23B
- inception42/Jais-3-32B
- inception42/Jais-3-MoVA-36B-A4B
- inception42/Jais-3-7B
- inception42/Jais-3-3.7B
- inception42/Jais-3-0.9B
family:
  id: jais
  name: Jais
publisher:
  name: Institute of Foundation Models (IFM), Mohamed bin Zayed University of Artificial Intelligence (MBZUAI), with Inception42 and Cerebras Systems
  country: AE
  accountable_entity: true
  url: https://huggingface.co/inception42
  security_contact: None published. The technical report lists correspondence addresses at mbzuai.ac.ae and no security policy exists in the ifm-ai code repositories.
summary: 'Jais 3 is a set of six open Arabic and English reasoning models from 0.9B to 375B-A23B parameters, adapted from the K2 Horizon base fleet and not trained from scratch. The weights are Apache-2.0 by card declaration, with no LICENSE file in any weights repository. The release includes stage checkpoints for every size, public code and a 23.8B-token data sample. The full corpus is not released, and the data was partly generated by other models, one under a non-commercial licence. Safety and performance figures are the publisher''s own. It scores 57.6 (grade C) because safety and performance have no independent evidence.

  '
