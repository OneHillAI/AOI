  safety_tuned: true
- name: IFM/Jais-3-*-FP8, -GGUF and -MLX builds
  context_window: 512k
  kind: quantized
  safety_tuned: true
openness:
  tier: open_weights_recipe
  components:
    weights: open
    training_data: partial
    training_code: partial
    evaluation: open
    documentation: open
    license: open
  license:
    spdx: Apache-2.0
    name: Apache License 2.0
    classification: osi
    commercial_use: allowed
    notable_restrictions:
    - The Apache-2.0 grant for the weights is declared in card front matter and the hub tag only. None of the six weights repositories contains a LICENSE file.
    - The cards list out-of-scope uses, including high-stakes decisions without human oversight and languages other than Arabic and English. These are intended-use statements and not licence clauses.
    - The training data includes outputs of other models, among them MiniMax-M3 under a non-commercial community licence. The report does not say whether any generator licence restricts use of its outputs.
    url: https://huggingface.co/inception42/Jais-3-32B
provenance:
  canonical_source: https://huggingface.co/inception42
  verified_org_on_primary_host: true
  formats:
  - safetensors
  - gguf
  - mlx
  integrity:
    checksums: true
    signed: false
    signing_tech: ''
    provenance_attestation: false
  mirrors_and_quants:
    acknowledged: true
    notable:
    - name: IFM/Jais-3-*-FP8, IFM/Jais-3-*-MLX-*, IFM/Jais-3-*-GGUF
      trust: publisher
      note: official quantised builds in the IFM organisation, which is not verified on Hugging Face; each card tags Apache-2.0 and links the base repository
    - name: IFM/K2-Horizon-32B
      trust: publisher
      note: the base model each Jais 3 size starts from; a separate entity, not scored here
  checkpoint_checklist_score: 5
  scanner_result:
    tool: Hugging Face repository scan
    clean: true
    date: '2026-11-19'
  incidents: []
eu_ai_act:
  is_gpai: true
  systemic_risk:
    designated: false
    training_flops_estimate: about 2.2e24 FLOPs for the 375B-A23B model (6 x 23.59B active backbone parameters x 15.1T base tokens plus 245B adaptation tokens, OneHill estimate; reinforcement learning and synthetic-data generation excluded); far lower for the other five
    over_1e25_threshold: false
    article_55_docs_available: n/a
  open_source_exemption:
    license_qualifies: 'yes'
    rationale: 'Apache-2.0 with public weights, architecture, usage information and a technical report. The Article 53 exemption from Annex XI and XII documentation plausibly applies, and every size is below the 1e25 FLOP systemic-risk line. The exemption leaves the copyright policy and the public training-content summary in force. The report names its data sources and token counts but gives no summary in the AI Office template and no policy on text-and-data-mining opt-outs. The report links a jaischat.ai web service, whose terms are unavailable, so no monetisation test is made.

      '
  provider_package:
    technical_documentation: partial
    downstream_information: partial
    copyright_policy: unknown
    training_content_summary: partial
    code_of_practice_signatory: unknown
  deployer_notes: 'The cards state an intended use (Arabic and English assistant and agentic applications) and list out-of-scope uses, so a deployer has a provider statement of purpose. Fine-tuning and placing a derivative on the EU market under its own name may make the fine-tuner a provider. The 11.9B-token set of partner-supplied Arabic books has no named source, and some generator models carry their own licences. A deployer needs to ask the publisher about both.

    '
  last_assessed: '2026-11-19'
performance: {}
behaviour: {}
safety: {}
deployment:
  ceiling_tier: T1
  ceiling_conditional: true
  hardware_notes: 'The cards give tested SGLang layouts on H100 GPUs. They use one GPU for 0.9B, 3.7B and 7B, and two GPUs for 32B and MoVA-36B-A4B (tensor parallel 2, expert parallel 2). The 375B-A23B needs 16 H100 GPUs across two nodes, or one 8xH200 node. Safetensors parameter counts imply about 2 GB (0.9B), 10 GB (3.7B), 18 GB (7B), 70 GB (32B), 75 GB (MoVA-36B-A4B) and 758 GB (375B-A23B) of BF16 weights before the KV cache. FP8, GGUF and MLX builds shrink these. A 512K context needs large additional memory, and no figure is published.

    '
  serving_support:
  - hf-transformers
  - vllm
  - sglang
  - llama.cpp
  - mlx
  controls_required:
  - Keep a human reviewing outputs (T1 internal assistant) until you have run your own safety and jailbreak evaluation, because every safety result is the publisher's own
  - Add input and output guardrails and a guard classifier of your own, because no text guard model is released with the family
  - Sandbox every tool, terminal and file action and test tool-call parsing before an unattended run, because no result tests the safety of agent actions
  - Pin the exact Hugging Face revision or branch, verify the LFS sha256 values and read configuration_k2_horizon.py and modeling_k2_horizon.py before using trust_remote_code=True
  - Use the serving versions on the card (vLLM 0.30.0 or later, SGLang 0.5.20 or later) with the k2_horizon reasoning and tool-call parsers, and set reasoning effort to high as the card advises
score:
  rubric_version: '1.1'
  headline: 57.6
  grade: C
  hard_flags: []
  dimensions:
    openness:
      score: 4
      rationale: 'Weights, checkpoints from the CPT, Cooldown, FTPO and SFT stages for every size, training and RL code, evaluation code and a 23.8B-token data sample are public under Apache-2.0 (ev-report-release, ev-branches, ev-code, ev-data-sample). The report documents every data source with token counts. The score stays at 4 for four reasons. The full corpus is not released. The sample covers about 10% of continual-pretraining and SFT tokens and holds only Arabic web text and one SFT set. Partner-supplied books and internal dialect data are not shared. No Jais-3 run configuration was found in the code repositories. The cards say the code is "Coming soon" while the report names three repositories.'
      evidence_refs:
      - ev-card-32b
      - ev-report-release
      - ev-report-data
      - ev-branches
      - ev-code
      - ev-data-sample
      - ev-license
    provenance:
      score: 3
      rationale: 'The weights sit in the verified inception42 organisation as safetensors with LFS sha256 values, a completed hub scan with no flagged files, and a documented lineage from K2 Horizon (ev-hub, ev-report-lineage). Nothing is signed and there is no attestation. Each repository runs custom Python under trust_remote_code. The official quantised builds are in the IFM organisation, which is not verified. Some training data came from other models and from partner-supplied books with no named source, so the data supply chain is only partly documented (ev-report-data, ev-report-generators, ev-teachers). Anchor 3.'
      evidence_refs:
      - ev-hub
      - ev-quants
      - ev-report-lineage
      - ev-report-data
      - ev-report-generators
      - ev-teachers
    legal:
      score: 3
      rationale: 'Apache-2.0 allows commercial use without a field-of-use clause, but the grant for the weights is declared in card metadata and the report only, with no LICENSE file in the weights repositories (ev-license). The report lists data sources with licences and token counts and the data sample has its own licences (ev-report-data, ev-data-sample). There is no EU AI Act summary, no copyright policy and no Code of Practice statement. The report does not address whether generator-model licences, such as the MiniMax-M3 community licence, reach outputs used for training (ev-teachers). Anchor 3.'
      evidence_refs:
      - ev-license
      - ev-card-32b
      - ev-report-data
      - ev-data-sample
      - ev-teachers
    safety:
      score: 2
      rationale: 'The models are safety tuned and the report publishes results on four benchmarks in two languages (ev-report-safety). Every size refuses more than 92% of 1,254 harmful AraSafe prompts, scores above 89% on HarmBench standard and contextual prompts and between 87.8% and 93.6% on XSTest. All results come from the publisher, and the judge is gemma-4-26B-A4B-it. No independent evaluation, text guard model or test of tool, terminal or file actions exists, and the cards describe residual risk in two sentences. Anchor 2 names a publisher-only evaluation.'
      evidence_refs:
      - ev-card-32b
      - ev-report-safety
      - ev-report-generators
    performance:
      score: 2
      rationale: 'Every figure is the publisher''s own and no independent re-run was found. The report says Jais 3 leads or matches open models of its size on Arabic benchmarks and has the largest margins at small sizes (ev-report-eval). At 32B and above the Qwen3.8 models lead most agentic benchmarks, by 8.6 to 25.7 points on three of them, and each frontier model beats the 375B on at least eight of ten. The evaluation code and cleaned benchmarks are public, but some benchmarks are marked as released soon. Anchor 2.'
      evidence_refs:
      - ev-report-eval
      - ev-report-dialect
      - ev-card-32b
    operational:
      score: 3
      rationale: 'The cards give validated vLLM, SGLang and Transformers recipes, parsers for reasoning and tool calls, tested GPU layouts and a 512K context for five of the six sizes (ev-card-32b, ev-hub). Official FP8, GGUF and MLX builds exist for most sizes, and GGUF appeared two weeks after the weights (ev-quants). Held at 3 because loading needs trust_remote_code, serving needs the k2_horizon parsers and recent engine versions, no GGUF exists for the 375B, and OneHill has not run the models on any runtime.'
      evidence_refs:
      - ev-card-32b
      - ev-hub
      - ev-quants
    governance:
      score: 3
      rationale: 'MBZUAI, Inception42 and Cerebras are accountable institutions, and the report names its authors and contributors (ev-report-release). The weights were published on 2026-09-29, the report followed on 2026-11-06 and 2026-11-12, and the weights repositories were updated on 2026-11-12 (ev-hub, ev-announce). The ifm-ai repositories accept GitHub issues. There is no security policy, no deprecation policy and no stated support window.'
      evidence_refs:
      - ev-report-release
      - ev-hub
      - ev-code
      - ev-announce

# --- Assessed signals.
signals:
  trainability:
    level: full
    dimension: openness
    summary: "Apache-2.0 weights, checkpoints from every stage, training and RL code and the recipe in the report allow continued pretraining, SFT and RL from any stage. The full data is not available and no Jais-3 run configuration was found."
    refs: [ev-license, ev-branches, ev-code, ev-report-release]
  knowledge_structure:
    level: moderate
    dimension: performance
    summary: "A 512K context (128K for the 0.9B), reasoning effort control and tool calling support long Arabic documents and agent tasks. All results are the publisher's own, and the 375B trails frontier and Qwen3.8 models on agentic benchmarks."
    refs: [ev-card-32b, ev-report-eval, ev-hub]
  specialization:
    level: strong
    dimension: openness
    summary: "The report documents the full adaptation recipe from K2 Horizon, stage checkpoints are public, and the same recipe is offered for adapting K2 Horizon to other languages. The full corpus is not available."
    refs: [ev-report-release, ev-report-lineage, ev-branches]
  exchangeability:
    level: medium
    dimension: operational
    summary: "vLLM and SGLang serve the models through OpenAI-compatible endpoints, but the k2_horizon architecture, parsers and remote code make a swap with a plain chat model more work."
    refs: [ev-card-32b, ev-hub]
  misuse_exposure:
    level: partial
    dimension: safety
    summary: "The report benchmarks refusal on AraSafe, Arabic regional topics, HarmBench and XSTest, all run by the publisher. No guard model, no independent result and no agent-action test exists."
    refs: [ev-report-safety, ev-card-32b]

