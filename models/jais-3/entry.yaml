ownership:
  level: partial
  factors:
    use_modify:
      level: strong
      rationale: "Apache-2.0 by card declaration, ungated, with every stage checkpoint, training and RL code and a data sample, so you can run, fine-tune and commercialise it. The licence text is absent from the weights repositories (ev-license, ev-branches, ev-code)."
    transparency:
      level: strong
      rationale: "Weights, stage checkpoints, code, evaluation suite, a data sample and a detailed report with named sources are public. The full corpus, partner-supplied books and generator-model outputs are not shared (ev-report-release, ev-report-data, ev-data-sample)."
    reliability:
      level: weak
      rationale: "Safety scores 2: every result is the publisher's own, there is no guard model, and no test covers agent actions. Operational scores 3 (ev-report-safety, ev-card-32b, ev-hub)."
    data_control:
      level: strong
      rationale: "Self-hosted Apache-2.0 weights with no telemetry or claw-back in the licence. Read the two custom Python files that run under trust_remote_code (ev-license, ev-hub)."
