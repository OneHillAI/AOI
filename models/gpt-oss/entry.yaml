ownership:
  level: substantial
  factors:
    use_modify:
      level: strong
      rationale: "A clean, OSI-approved Apache-2.0 grant - own, run, modify and redistribute freely with no access gate and no field-of-use limit - and the only usage constraint is a single-sentence policy asking you to obey applicable law, an unusually light AUP for an open-weight release."
      # grounded in: ev-apache (license, retrieved) - LICENSE is standard Apache-2.0 boilerplate, copyright left as a template placeholder, no bespoke restrictions in the file; ev-usage-policy (terms, retrieved) - the entire USAGE_POLICY is one sentence read verbatim
    transparency:
      level: moderate
      rationale: "Weights are open and inspectable and OpenAI published a safety report whose worst-case malicious-fine-tuning methodology was independently reviewed by METR, but the training data and pre-training code are closed, so you adapt rather than reproduce and cannot see how it was made."
      # grounded in: ev-safety-pdf (security, retrieved) - SAG concluded even aggressive fine-tuning did not reach High capability in Bio/Chem or Cyber; ev-metr (third_party, retrieved) - OpenAI at least partially addressed each of METR's 6 high-urgency items; training data/code closed (structural)
    reliability:
      level: strong
      rationale: "Runs dependably across every major runtime and hosted endpoint, and misuse is well controlled: an independently reviewed worst-case safety study backs the safety tuning."
      # grounded in: ev-hf-blog, ev-ollama (third_party) - day-0 ecosystem across vLLM/llama.cpp/Ollama/transformers/MLX and hosted providers; ev-metr (third_party, retrieved) - external methodology review
    data_control:
      level: strong
      rationale: "Self-hosted, the ungated Apache weights run entirely on your own infrastructure with no clawback or telemetry - your data stays yours."
      # grounded in: self-hosting (structural); ev-apache (license, retrieved) - no telemetry/clawback clause in the LICENSE
  verdict: "You substantially own gpt-oss: ungated Apache-2.0 weights you run, modify and self-host, governed by a one-sentence usage policy (obey applicable law) that is about as light as an open-weight AUP gets. The safety posture is a genuine differentiator - a published worst-case malicious-fine-tuning study whose methodology METR independently reviewed, with OpenAI at least partially addressing each of METR's six high-urgency items. What holds it below full is transparency: the training data and pre-training code are closed, so you adapt rather than reproduce. Adopt it for general open-weight deployment, building to the harmony response format it requires and adding standard input/output guardrails for customer-facing use."

