ownership:
  level: substantial
  factors:
    use_modify:
      level: strong
      rationale: "The Apache-2.0 grant is OSI-approved: the weights can be owned, run, modified and redistributed freely, with no access gate and no field-of-use limit. The only usage constraint is a two-sentence policy asking users to obey applicable law, an unusually light AUP for an open-weight release."
      # grounded in: ev-apache (license, retrieved) - LICENSE is standard Apache-2.0 boilerplate, copyright left as a template placeholder, no bespoke restrictions in the file; ev-usage-policy (terms, retrieved) - the entire USAGE_POLICY is one sentence read verbatim
    transparency:
      level: moderate
      rationale: "Weights are open and inspectable, and OpenAI published a safety report whose worst-case malicious-fine-tuning methodology was independently reviewed by METR. Training data and pre-training code are closed, so the weights can be adapted but not reproduced, and how the model was made cannot be seen."
      # grounded in: ev-safety-pdf (security, retrieved) - SAG concluded even aggressive fine-tuning did not reach High capability in Bio/Chem or Cyber; ev-metr (third_party, retrieved) - OpenAI at least partially addressed each of METR's 6 high-urgency items; training data/code closed (structural)
    reliability:
      level: strong
      rationale: "The models run dependably across every major runtime and hosted endpoint, and misuse is well controlled: an independently reviewed worst-case safety study backs the safety tuning."
      # grounded in: ev-hf-blog, ev-ollama (third_party) - day-0 ecosystem across vLLM/llama.cpp/Ollama/transformers/MLX and hosted providers; ev-metr (third_party, retrieved) - external methodology review
    data_control:
      level: strong
      rationale: "Self-hosted, the ungated Apache weights run entirely on the deployer's own infrastructure with no clawback or telemetry, so data stays with the deployer."
      # grounded in: self-hosting (structural); ev-apache (license, retrieved) - no telemetry/clawback clause in the LICENSE
  verdict: "You substantially own gpt-oss: ungated Apache-2.0 weights that you run, modify and self-host, governed by a two-sentence usage policy (obey applicable law) that is about as light as an open-weight AUP gets. The safety posture is a differentiator: a published worst-case malicious-fine-tuning study whose methodology METR independently reviewed, with OpenAI at least partially addressing each of METR's six high-urgency items. Transparency holds ownership below full: training data and pre-training code are closed, so the weights can be adapted but not reproduced. Adopt it for general open-weight deployment, building to the harmony response format it requires and adding standard input/output guardrails for customer-facing use."

# --- Evidence. Each item carries `doc_type` (which kind of primary document) and `retrieved`
#     (true = the document's substantive text was read; false = known to exist but not read).
#     Grounded 2026-07-25 against the primary-source clauses in
#     docs/primary-sources/gpt-oss/_sources.md - the Apache-2.0 LICENSE, the two-sentence
#     USAGE_POLICY, the arXiv 2508.10925 model card, the OpenAI safety-report PDF and the
#     METR third-party methodology review were all read verbatim; the remaining publisher
#     pages and third-party ecosystem sources are known-to-exist but not re-read this session.
evidence:
- id: ev-openai-intro
  claim: OpenAI introduces gpt-oss-120b and gpt-oss-20b as open-weight reasoning models
    under Apache-2.0 with configurable reasoning effort, native agentic tool use and
    structured outputs, running on 80GB / 16GB hardware.
  source_type: publisher
  doc_type: marketing
  retrieved: false
  url: https://openai.com/index/introducing-gpt-oss/
  date: '2026-07-25'
- id: ev-model-card
  claim: "The gpt-oss-120b & gpt-oss-20b Model Card (arXiv 2508.10925) describes two open-weight reasoning models on an efficient mixture-of-expert transformer architecture, trained with large-scale distillation and reinforcement learning. All model weights, inference code, tools and tokenizers are released under an Apache-2.0 license. The card documents the MoE architecture (~117B/5.1B and ~21B/3.6B, 128/32 experts), 128K context, MXFP4, the harmony format and the Preparedness-Framework safety and malicious-fine-tuning evaluations."
  source_type: publisher
  doc_type: technical_report
  retrieved: true
  url: https://arxiv.org/abs/2508.10925
  date: '2026-07-25'
- id: ev-hf-openai
  claim: "gpt-oss weights are hosted on the verified openai organisation on Hugging Face as safetensors under Apache-2.0 with a 128K context window. gpt-oss-120b and gpt-oss-20b are not gated, carry the apache-2.0 tag, contain LICENSE and USAGE_POLICY files, report max_position_embeddings 131072 and MXFP4 quantisation, and the organisation page reports isVerified true."
  source_type: publisher
  doc_type: model_card
  retrieved: true
  url: https://huggingface.co/openai/gpt-oss-120b
  date: '2026-11-19'
- id: ev-apache
  claim: "The gpt-oss LICENSE is a standard Apache License 2.0 (January 2004) boilerplate with the copyright line left as a template placeholder and no bespoke restrictions in the file itself: unconditional commercial use. Any use guidance lives separately in the two-sentence USAGE_POLICY, not the licence."
  source_type: publisher
  doc_type: license
  retrieved: true
  url: https://github.com/openai/gpt-oss
