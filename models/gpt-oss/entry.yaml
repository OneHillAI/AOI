#     docs/primary-sources/gpt-oss/_sources.md - the Apache-2.0 LICENSE, the one-sentence
#     USAGE_POLICY, the arXiv 2508.10925 model card, the OpenAI safety-report PDF and the
#     METR third-party methodology review were all read verbatim; the remaining publisher
#     pages and third-party ecosystem sources are known-to-exist but not re-read this session.
evidence:
- id: ev-openai-intro
  claim: OpenAI introduces gpt-oss-120b and gpt-oss-20b as open-weight reasoning models
    under Apache-2.0 with configurable reasoning effort, native agentic tool use and
    structured outputs, running on 80GB / 16GB hardware.
  source_type: publisher
  doc_type: marketing
  retrieved: false
  url: https://openai.com/index/introducing-gpt-oss/
  date: '2026-07-25'
- id: ev-model-card
  claim: 'gpt-oss-120b & gpt-oss-20b Model Card (arXiv 2508.10925), read verbatim: two
    open-weight reasoning models on an efficient mixture-of-expert transformer architecture,
    trained with large-scale distillation and reinforcement learning, releasing all model
    weights, inference code, tools and tokenizers under an Apache-2.0 license; documents
    the MoE architecture (~117B/5.1B and ~21B/3.6B, 128/32 experts), 128K context, MXFP4,
    harmony format and the Preparedness-Framework safety and malicious-fine-tuning evaluations.'
  source_type: publisher
  doc_type: technical_report
  retrieved: true
  url: https://arxiv.org/abs/2508.10925
  date: '2026-07-25'
- id: ev-hf-openai
  claim: gpt-oss weights are hosted on the verified openai organisation on Hugging Face
    as safetensors under Apache-2.0 with a 128K context window.
  source_type: publisher
