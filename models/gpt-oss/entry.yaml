# OneHill v2 MODEL library entry for OpenAI gpt-oss.
# Validated against schema/model.v2.schema.json.
#   scores    -> scripts/score.py --write        (AOI headline/grade)
#   meters    -> scripts/completeness.py --write  (per-domain completeness/originality)
#   prose     -> assess.md / implement.md / use.md / support.md (sections keyed <!-- item: KEY -->)

schema_version: "2.0"
id: gpt-oss
name: OpenAI gpt-oss (gpt-oss-120b / gpt-oss-20b)
aliases:
- gpt-oss
- gpt-oss-120b
- gpt-oss-20b
- openai/gpt-oss
family:
  id: gpt-oss
  name: OpenAI gpt-oss
publisher:
  name: OpenAI
  country: US
  accountable_entity: true
  url: https://openai.com/index/introducing-gpt-oss/
  security_contact: https://github.com/openai/gpt-oss
summary: 'gpt-oss is OpenAI''s first open-weight release since GPT-2 (August 2025):
  two mixture-of-experts reasoning models - gpt-oss-120b (~117B total / 5.1B active,
  128 experts) and gpt-oss-20b (~21B total / 3.6B active, 32 experts) - both with a
  128K context window, configurable low/medium/high reasoning effort, native agentic
  tool use (function calling, browsing, Python) and structured outputs, shipped under
  a clean OSI-approved Apache-2.0 license with no click-through gate. The models are
  distributed as safetensors on the verified openai org on Hugging Face and ship natively
  quantized in MXFP4, so gpt-oss-120b fits on a single 80GB GPU and gpt-oss-20b runs
  in 16GB. These are
  genuinely open weights rather than an open recipe: the Apache-2.0 license, ungated distribution
  and first-class serving ecosystem are excellent, but the training data and training
  code are not released, so this sits at the open_weights tier rather than fully_open. Prompts must
  use OpenAI''s "harmony" response format, and OpenAI is the source
  of the published safety evaluation.

  '
variants:
- name: gpt-oss-120b
  params_total: ~117B
  params_active: 5.1B
  context_window: 128K
  kind: reasoning
  safety_tuned: true
- name: gpt-oss-20b
  params_total: ~21B
  params_active: 3.6B
  context_window: 128K
  kind: reasoning
  safety_tuned: true
openness:
  tier: open_weights
  components:
    weights: open
    training_data: closed
    training_code: closed
    evaluation: partial
    documentation: open
    license: open
  license:
    spdx: Apache-2.0
    name: Apache License 2.0
    classification: osi
    commercial_use: allowed
    notable_restrictions: []
    url: https://huggingface.co/openai/gpt-oss-120b
provenance:
  canonical_source: https://huggingface.co/openai/gpt-oss-120b
  verified_org_on_primary_host: true
  formats:
  - safetensors
  integrity:
    checksums: true
    signed: false
    signing_tech: ''
    provenance_attestation: false
  mirrors_and_quants:
    acknowledged: true
    notable:
    - name: Ollama / LM Studio / llama.cpp (MXFP4 + GGUF)
      trust: community
      note: local-inference distributions of the same weights rather than the canonical source
    - name: Hosted on Together / Fireworks / Groq / cloud providers
      trust: provider
      note: hosted endpoints rather than the weight source
  checkpoint_checklist_score: 6
  scanner_result: {}
  incidents: []
eu_ai_act:
  is_gpai: true
  systemic_risk:
    designated: false
    training_flops_estimate: estimated under 1e25 (gpt-oss-120b trained on ~2.1M H100-hours)
    over_1e25_threshold: false
    article_55_docs_available: n/a
  open_source_exemption:
    license_qualifies: 'yes'
    rationale: 'Released under genuine OSI-approved Apache-2.0 with public parameters,
      architecture and usage information, ungated and not monetised - so it plausibly
      qualifies for the Article 53 open-source exemption from the Annex XI/XII technical-documentation
      duties. The two obligations that survive the exemption - a copyright policy and
      a public training-content summary - are harder to satisfy from public artifacts
      than for a fully-open family, because gpt-oss does NOT publish its training data:
      the training-content summary must be authored by OpenAI rather than reconstructed
      from a released corpus. Estimated training compute is under the 1e25-FLOP threshold,
      so the model is not a systemic-risk GPAI and the exemption is not voided.

      '
  provider_package:
    technical_documentation: 'yes'
    downstream_information: 'yes'
    copyright_policy: partial
    training_content_summary: partial
    code_of_practice_signatory: true
  deployer_notes: 'OpenAI publishes a detailed model card / arXiv report and a substantial
    safety evaluation (strong downstream information), and has committed to the EU GPAI
    Code of Practice. Because the training data is not released, a downstream EU deployer
    cannot assemble the training-content summary from public artifacts and depends on
    OpenAI''s own summary. A fine-tuner placing a derivative on the EU market under
    its own name may become a provider for that derivative and must maintain its own
    documentation, but inherits an unusually permissive Apache-2.0 upstream to build on.

    '
  last_assessed: '2026-07-25'
performance:
  note: Third-party / publisher framing only.
  class_position: Strong open-weight reasoning models; gpt-oss-120b reported near OpenAI
    o4-mini and gpt-oss-20b near o3-mini on core reasoning benchmarks.
behaviour:
  refusals: Safety-tuned reasoning variants refuse clearly-harmful requests; raw chain-of-thought
    is unfiltered and should not be shown to end users.
  prompt_injection: Residual susceptibility like all current LLMs; treat retrieved/tool
    content as untrusted.
  failure_modes: Standard hallucination profile for its class; documented in the model card.
safety:
  variant_assessed: gpt-oss (safety-tuned reasoning)
  jailbreak_resistance: Withstands casual jailbreaks; OpenAI tested worst-case malicious
    fine-tuning under its Preparedness Framework.
  guard_model: No guard model in the base release; OpenAI later published the separate
    gpt-oss-safeguard safety-classifier family.
deployment:
  ceiling_tier: T2
  ceiling_conditional: true
  hardware_notes: 'gpt-oss-120b fits on a single 80GB GPU (H100/MI300-class); gpt-oss-20b
    runs in ~16GB thanks to native MXFP4 quantization. Both are cheaper to serve than
    their total-parameter counts suggest because only 3.6B-5.1B parameters are active
    per token.

    '
  serving_support:
  - vllm
  - llama.cpp
  - ollama
  - hf-transformers
  - mlx
  controls_required:
  - Render prompts with the harmony response format (models are trained only for it)
  - Add input/output guardrails and a companion guard classifier for customer-facing use
  - Do not surface raw chain-of-thought to end users
  - Pin the exact openai revision and verify checksums
score:
  rubric_version: '1.1'
  headline: 78.8
  grade: B
  hard_flags: []
  dimensions:
    openness:
      score: 3
      rationale: 'Open-weights tier: ungated, downloadable Apache-2.0 weights with strong
        public documentation (model card + arXiv report), which is materially more open
        than a gated community license. The open-weights tier caps Dimension 1 at 3 per
        the openness framework, because the training data and training code are not
        released and evaluation is only partially open - it is genuinely open weights rather than
        the open-weights-plus-recipe (4) or fully-open "open science" (5) tier. It sits at
        the top of the score-3 band on the strength of its pristine licence and docs.

        '
      evidence_refs:
      - ev-apache
      - ev-hf-openai
      - ev-hf-blog
    provenance:
      score: 4
      rationale: 'Verified openai org on Hugging Face, safetensors-only distribution
        with checksums, a clear canonical source and no malicious-checkpoint incident
        on the canonical org (checklist ~6/8). Short of 5 only because the weights are
        not cryptographically signed and there is no SLSA-style provenance attestation.

        '
      evidence_refs:
      - ev-hf-openai
    legal:
      score: 4
      rationale: 'A pristine, OSI-approved Apache-2.0 license - ungated, no acceptable-use
        policy, no MAU threshold, unconditional commercial use - well above a restrictive
        community license, and the model is under the systemic-risk FLOP threshold. Capped
        at 4 rather than 5 because the training data is not published, so the surviving
        EU AI Act obligation (a training-content summary) cannot be reconstructed from
        public artifacts the way a fully-open family allows.

        '
      evidence_refs:
      - ev-apache
      - ev-model-card
    safety:
      score: 4
      rationale: 'Safety-tuned reasoning releases with a published safety evaluation,
        Preparedness-Framework capability testing, and a worst-case malicious-fine-tuning
        study whose methodology was independently reviewed by external experts (METR,
        SecureBio, Daniel Kang). Above the score-3 anchor and cited to a third-party
        review; short of 5 because there is no shipped guard model in the base release
        and no broad independent third-party red-team across all harm domains.

        '
      evidence_refs:
      - ev-metr
      - ev-model-card
    performance:
      score: 4
      rationale: 'Strong reasoning models: gpt-oss-120b is reported near OpenAI o4-mini
        and gpt-oss-20b near o3-mini on core reasoning benchmarks, and they rank well
        among open-weight models on public leaderboards. Capped at 4 on reported and
        leaderboard evidence without independent reproduction.

        '
      evidence_refs:
      - ev-perf
      - ev-model-card
    operational:
      score: 5
      rationale: 'First-class ecosystem support from day 0: safetensors on the verified
        openai org shipped in native MXFP4, with support across vLLM, llama.cpp, Ollama,
        Hugging Face transformers and MLX, plus hosted endpoints on major providers.
        Backed by third-party sources (the Hugging Face launch guide and the Ollama library)
        beyond publisher marketing.

        '
      evidence_refs:
      - ev-hf-blog
      - ev-ollama
    governance:
      score: 4
      rationale: 'Reputable, legally accountable US publisher with a detailed model card
        / arXiv report, a public reference repository, a documented Preparedness-Framework
        process and coordinated external safety testing. Short of 5 because there is no
        formal cryptographic weight-signing / vulnerability-disclosure process for the
        weights and no published deprecation policy.

        '
      evidence_refs:
      - ev-openai-intro
      - ev-github

# --- Assessed signals: five cross-cutting attributes highlighted at the top of the entry
#     (like the EU AI Act flag). Not a scoring input - each ties back to one of the seven
#     AOI dimensions and summarises documentation that lives in the four domains.
signals:
  trainability:
    level: partial
    dimension: openness
    summary: "Fine-tunable but not reproducible: Apache-2.0 open weights support full SFT/LoRA and OpenAI documents fine-tuning, but the training data and pre-training code are closed, so you cannot reproduce the models from scratch."
    refs: [ev-apache, ev-github]
  knowledge_structure:
    level: strong
    dimension: performance
    summary: "Strong knowledge/RAG backbone: 128K context, native tool use (function calling, browsing, Python), structured outputs and configurable reasoning effort make it well suited to grounded, structured workflows."
    refs: [ev-model-card, ev-openai-intro]
  specialization:
    level: strong
    dimension: openness
    summary: "Strong for specialisation: ungated Apache-2.0 open weights plus documented fine-tuning and a fast-growing adapter/serving ecosystem, though continued pre-training is limited by the closed training data and code."
    refs: [ev-github, ev-hf-blog]
  exchangeability:
    level: high
    dimension: operational
    summary: "Highly exchangeable: MXFP4 safetensors on every major runtime and many hosted endpoints; the main gotcha when swapping is that gpt-oss is trained exclusively for the harmony response format."
    refs: [ev-hf-blog, ev-harmony]
  misuse_exposure:
    level: partial
    dimension: safety
    summary: "Partially benchmarked: OpenAI published a safety evaluation and a worst-case malicious-fine-tuning study whose methodology was independently reviewed (METR, SecureBio, Daniel Kang), but no broad independent third-party red-team across all harm domains exists."
    refs: [ev-metr, ev-model-card]

