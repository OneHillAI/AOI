# OneHill v2 MODEL library entry for Gemma 4 (the April 2026 Apache-2.0 release).
# Validated against schema/model.v2.schema.json.
#   scores    -> scripts/score.py --write        (AOI headline/grade)
#   meters    -> scripts/completeness.py --write  (per-domain completeness/originality)
#   prose     -> assess.md / implement.md / use.md / support.md (sections keyed <!-- item: KEY -->)
# Scope: ONE release. Gemma 1, 1.1, 2, 3 and 3n and the listed sibling models are under the older
# Gemma Terms of Use and are NOT part of this entry (see assess.md, license item).

schema_version: "2.0"
id: gemma-4
name: Gemma 4 (E2B, E4B, 12B, 26B A4B, 31B)
aliases:
- Gemma 4
- gemma-4-31B-it
- gemma-4-26B-A4B-it
- gemma-4-12B-it
- gemma-4-E4B-it
- gemma-4-E2B-it
- google/gemma-4
family:
  id: gemma
  name: Gemma
publisher:
  name: Google DeepMind (Google LLC; EU provider of record Google Ireland Limited)
  country: US
  accountable_entity: true
  url: https://deepmind.google/models/gemma/
  security_contact: https://github.com/google/.github/blob/master/SECURITY.md (Google-wide GitHub policy, intake at g.co/vulnz; whether it covers model weights is unconfirmed)
summary: >-
  Gemma 4 is the first Gemma generation under a plain Apache-2.0 licence (per the trade press)
  and, unlike Gemma 3, is published ungated. The older Gemma Terms of Use and their Prohibited Use
  Policy do not bind any Gemma 4 checkpoint. It is a multimodal, open-weight family from Google
  DeepMind in five sizes (E2B, E4B, 12B Unified, 26B A4B mixture of experts, 31B dense), each as a
  base and an instruction-tuned checkpoint. It offers 128K to 256K context, a thinking mode,
  native function calling, and official quantised and speculative-decoding drafter checkpoints. It
  stays at the open-weights tier: training data and the pre-training pipeline are not released,
  and the training-content summary names no dataset. That summary states that user data from
  Google products (Gemini Apps chats are named) was used in training. Safety evidence is
  publisher-only and qualitative, and independent capability evidence is mixed.
