ownership:
  level: substantial
  factors:
    use_modify:
      level: strong
      rationale: >-
        Plain Apache-2.0 on every Gemma 4 checkpoint, ungated, with no field-of-use limit, no use
        policy and no remote-restriction right. Users may run, fine-tune, redistribute and sell
        derivatives (ev-license, ev-hf-inventory).
    transparency:
      level: moderate
      rationale: >-
        Weights, model card and technical report are open and a training-content summary exists.
        The training data is closed (the summary names no dataset), the pre-training pipeline is
        not released, and the summary discloses user-data and Gemini 3 synthetic-data use that
        cannot be inspected (ev-eu-summary, ev-tech-report).
    reliability:
      level: moderate
      rationale: >-
        Operational readiness is good (score 4), but the safety evidence is publisher-only and
        qualitative (score 3) and no guard model has been identified, so the deployer supplies the
        safety layer (ev-tech-report, ev-docs-overview).
    data_control:
      level: strong
      rationale: >-
        Self-hosted weights under Apache-2.0 with no clawback of rights, so prompts and outputs
        stay on the deployer's infrastructure. The licence carries no telemetry or
        remote-restriction clause (ev-license).
  verdict: >-
    Use of these weights is owned outright: plain Apache-2.0, no gate, no use policy and no remote
    shut-off, which the older Gemma Terms of Use did have. What the weights are is not owned: the
    training data is closed, Google states that user data from its products went into training,
    and safety evidence is publisher-only. Adopt the instruction-tuned checkpoints behind your own
    guardrails and check the licence per checkpoint, because Gemma 1 to 3n and the Gemma 3
    derivatives you may already run remain under the old terms.

