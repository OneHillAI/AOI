openness:
  tier: open_weights
  components:
    weights: open
    training_data: closed
    training_code: partial
    evaluation: partial
    documentation: open
    license: open
  license:
    spdx: Apache-2.0
    name: Apache License 2.0
    classification: osi
    commercial_use: allowed
    notable_restrictions:
    - No trademark licence (Apache-2.0 section 6)
    - Patent licence ends for a user who sues alleging the Work infringes a patent (Apache-2.0 section 3)
    url: https://ai.google.dev/gemma/docs/gemma_4_license
provenance:
  canonical_source: https://huggingface.co/google (collection google/gemma-4)
  verified_org_on_primary_host: true
  formats:
  - safetensors
  - gguf
  integrity:
    checksums: true
    signed: false
    signing_tech: ''
    provenance_attestation: false
  mirrors_and_quants:
    acknowledged: true
    notable:
    - name: Google official QAT checkpoints (-qat-q4_0-gguf, -qat-w4a16-ct, -qat-mobile-ct, -qat-mobile-transformers, -qat-q4_0-unquantized)
      trust: vendor
      note: published by the same verified google org and routed by use case in the Gemma 4 overview page; all carry the Apache-2.0 tag and are ungated
    - name: Ollama library gemma4 (e2b, e4b, 12b, 26b, 31b)
      trust: vendor
      note: third-party distribution channel; not the canonical weight source and not checked for byte equality with the Google weights
  checkpoint_checklist_score: 6
  scanner_result:
    provider: Hugging Face
    scans_done: true
    files_with_issues: []
  incidents: []
eu_ai_act:
  is_gpai: true
  systemic_risk:
    designated: false
    training_flops_estimate: "not disclosed. Lower-bound arithmetic only. The training-content summary bands text at more than 10 trillion tokens, and 6 x 30.7e9 x 1e13 is about 1.8e24 FLOPs for the 31B, below 1e25. 1e25 would need about 54 trillion tokens, which no cited document rules out or states."
    over_1e25_threshold: unknown
    article_55_docs_available: unknown
  open_source_exemption:
    license_qualifies: 'yes'
    rationale: >-
      Apache-2.0 is an OSI licence and the weights and architecture are public, so the licence
      meets the Article 53(2) condition. The exemption does not cover the public training-content
      summary or the copyright policy, and it does not apply to a monetised model. Google sells
      hosted access (Vertex AI is named in the launch blog), so whether the exemption applies is a
      legal question that stays open. Google published the summary regardless.
  provider_package:
    technical_documentation: partial
    downstream_information: 'yes'
    copyright_policy: unknown
    training_content_summary: 'yes'
    code_of_practice_signatory: true
  deployer_notes: >-
    A deployer who fine-tunes Gemma 4 and places the result on the EU market under its own name
    may become the provider of that derivative. Upstream, Google published an EU template
    training-content summary (v1, 31 July 2026) and is a listed signatory of the GPAI Code of
    Practice. The summary names no dataset or domain, states that Gemini Apps user data was used,
    and states that Gemini 3 outputs were used as synthetic data. Keep the summary, the model card
    and the technical report in the AI-BOM. The Google compute figure is not disclosed.
  last_assessed: '2026-11-19'
performance: {}
behaviour: {}
safety: {}
deployment:
  ceiling_tier: T2
  ceiling_conditional: true
  hardware_notes: >-
    Google's overview table gives weight-load memory with 20 percent overhead. The 31B needs 69.9
    GB (BF16), 34.9 GB (8-bit) and 17.5 GB (Q4_0). The 26B A4B needs 57.7, 28.8 and 14.4 GB,
    because all 25.2B parameters must be resident. The 12B needs 26.7, 13.4 and 6.7 GB, the E4B
    17.9, 8.9 and 4.5 GB, and the E2B 11.4, 5.7 and 2.9 GB. KV cache at 128K to 256K context comes
    on top. The launch blog says the 31B BF16 weights fit one 80 GB H100.
  serving_support:
  - hf-transformers
  - vllm
  - llama.cpp
  - ollama
  - sglang
  - lm-studio
  controls_required:
  - >-
    Deploy an instruction-tuned checkpoint, not a base checkpoint
  - >-
    Add your own input and output guardrails and a guard classifier; no Gemma 4 guard model has
    been identified
  - >-
    Run your own safety evaluation per language and per modality; the publisher evaluation is
    qualitative
  - >-
    Pin the exact Hugging Face revision and verify the LFS checksums
  - >-
    Apply the model card chat-template rules (no thinking content in history, image before text,
    audio after text)
score:
  rubric_version: '1.1'
  headline: 68.8
  grade: C
  hard_flags: []
  dimensions:
    openness:
      score: 3
      rationale: >-
        Open weights under an OSI licence, with a model card, a technical report and a Hugging
        Face weight release for every size. The pre-training data is only described (web, code,
        mathematics, images, audio), the training pipeline is not released (the
        google-deepmind/gemma library is for inference and fine-tuning), and the EU training
        summary names no dataset. That is the open-weights anchor and not open weights plus
        recipe.
      evidence_refs:
      - ev-license
      - ev-tech-report
      - ev-card-31b
      - ev-eu-summary
      - ev-gemma-lib
    provenance:
      score: 4
      rationale: >-
        The google organisation on Hugging Face is verified, the core checkpoints are safetensors
        only, each shard has an LFS sha256, the Hugging Face scan flags no files, and official
        quantised and drafter checkpoints are documented by use case. The score is short of 5
        because no cryptographic signature or build attestation is evident, and Kaggle is
        unchecked. The training-content summary says user data from Google products was used in
        training, which is a data-provenance point outside this checkpoint-trust score.
      evidence_refs:
      - ev-hf-inventory
      - ev-hf-scan
      - ev-docs-overview
      - ev-eu-summary
    legal:
      score: 4
      rationale: >-
        Plain Apache-2.0 with no use policy, field-of-use limit, gate or remote-restriction right,
        plus a model card, a technical report, a published EU Article 53 training-content summary
        (v1, 31 July 2026) and Google listed as a Code of Practice signatory. Residual gaps keep
        the score at 4: the summary names no dataset or domain, no compute figure is disclosed, no
        copyright policy document has been identified, and no Annex XI style form is evident.
      evidence_refs:
      - ev-license
      - ev-eu-summary
      - ev-ec-cop
      - ev-tech-report
    safety:
      score: 3
      rationale: >-
        Instruction-tuned checkpoints with a publisher safety evaluation and stated policies
        (child safety, dangerous content, sexually explicit content, hate speech, harassment),
        documented risks and mitigations, and a Responsible Generative AI Toolkit pointer. The
        evaluation is qualitative: no violation rates, no named red-team, no CBRN or cyber
        results, no jailbreak figures, no independent evaluation and no Gemma 4 guard model
        identified. The Prohibited Use Policy does not bind Gemma 4, so there is no contractual
        use policy either.
      evidence_refs:
      - ev-tech-report
      - ev-card-31b
      - ev-pup
    performance:
      score: 3
      rationale: >-
        Independent evidence is mixed. At launch the trade press relayed an Artificial Analysis
        GPQA Diamond result placing the 31B second among open models under 40B, and the technical
        report names a human-preference leaderboard where the 31B is the leading dense open model
        (publisher-reported). The Artificial Analysis Intelligence Index v5.0.1 page rates the 31B
        at the lower end of comparable open-weights models (4, rank 14 of 15). Publisher benchmark
        tables are strong but are not independent.
      evidence_refs:
      - ev-decoder
      - ev-aa
      - ev-tech-report
      - ev-card-31b
    operational:
      score: 4
      rationale: >-
        Standard safetensors on Transformers, with Google documenting official quantised routes
        for llama.cpp, vLLM and SGLang, drafter checkpoints for speculative decoding, a memory
        table per precision and 128K to 256K context. Ollama lists all five sizes with vision,
        tools, thinking and audio tags. The score is short of 5 because day-0 ecosystem support
        rests on the launch blog (publisher claim) and the chat template has needed repeated fixes
        since release.
      evidence_refs:
      - ev-docs-overview
      - ev-ollama
      - ev-hf-scan
      - ev-blog
    governance:
      score: 3
      rationale: >-
        Accountable, reputable publisher with a visible cadence (Gemma 1 to 4, dated chat-template
        and QAT updates, technical report v2) and open community discussions. The score is held at
        3 because no Gemma-specific security-reporting path is identified (only the Google-wide
        GitHub policy, whose coverage of weights is unconfirmed) and no deprecation or
        support-window policy is published.
      evidence_refs:
      - ev-hf-scan
      - ev-security-policy
      - ev-tech-report

# --- Assessed signals: five cross-cutting attributes highlighted at the top of the entry.
signals:
  trainability:
    level: partial
    dimension: openness
    summary: "Freely adaptable but not reproducible: Apache-2.0 weights, a fine-tuning library and a documented recipe outline, but the pre-training data and pipeline are not released."
    refs: [ev-license, ev-gemma-lib, ev-tech-report]
  knowledge_structure:
    level: moderate
    dimension: performance
    summary: "128K to 256K context, native function calling and a thinking mode, but long-context retrieval is publisher-reported and falls steeply with size (8-needle 128K: 66.4 percent for the 31B, 19.1 percent for the E2B)."
    refs: [ev-card-31b, ev-tech-report]
  specialization:
    level: strong
    dimension: openness
    summary: "Apache-2.0, ungated, five sizes with base checkpoints and an official fine-tuning library; derivatives may carry their own licence terms subject to Apache-2.0 section 4."
    refs: [ev-license, ev-hf-inventory, ev-gemma-lib]
  exchangeability:
    level: high
    dimension: operational
    summary: >-
      Standard safetensors and official GGUF, compressed-tensors and mobile builds on the main
      runtimes; the points to handle when swapping are the thinking-mode control tokens and the
      template rules.
    refs: [ev-docs-overview, ev-ollama, ev-card-31b]
  misuse_exposure:
    level: partial
    dimension: safety
    summary: >-
      Publisher-only, qualitative safety evaluation across five harm areas; no independent
      red-team, no numbers and no Gemma 4 guard model identified.
    refs: [ev-tech-report, ev-card-31b]

