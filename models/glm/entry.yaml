# OneHill v2 MODEL library entry for GLM (Zhipu AI / Z.ai).
# Validated against schema/model.v2.schema.json.
#   scores    -> scripts/score.py --write        (AOI headline/grade)
#   meters    -> scripts/completeness.py --write  (per-domain completeness/originality)
#   prose     -> assess.md / implement.md / use.md / support.md (sections keyed <!-- item: KEY -->)

schema_version: '2.0'
id: glm
name: GLM (Zhipu AI / Z.ai)
aliases:
- GLM-4.6
- GLM-4.5
- GLM-4.5-Air
- GLM-4-0414
- ChatGLM
- zai-org/GLM
- THUDM/GLM
family:
  id: glm
  name: GLM
publisher:
  name: Zhipu AI (Z.ai)
  country: China
  accountable_entity: true
  url: https://huggingface.co/zai-org
  security_contact: https://huggingface.co/zai-org
summary: 'GLM is Zhipu AI''s open-weight family - Zhipu AI is the Beijing company (spun
  out of Tsinghua''s THUDM lab) that ships internationally under the "Z.ai" brand.
  The current flagship GLM-4.6 is a 355B-total / 32B-active Mixture-of-Experts model
  with a 200K context window, tuned for coding and agentic use, alongside the earlier
  GLM-4.5 (355B/32B) and the lighter GLM-4.5-Air (106B/12B) plus dense GLM-4-32B-0414
  and GLM-4-9B-0414. The headline advantage over some China peers is a genuine, OSI-approved
  MIT license on the GLM-4.5/4.6 and 0414 series. The two things an adopter must weigh:
  the 355B MoE may approach the EU AI Act 1e25 systemic-risk compute threshold (unconfirmed,
  with no Article 55 documentation published), and the hosted API applies Chinese content
  moderation while the models carry China-aligned alignment - so deploy behind your
  own guards and verify the LICENSE per checkpoint. This entry is the MIT GLM line
  (GLM-4.6/4.5/4.5-Air and the GLM-4-0414 series, including GLM-4-9B-0414); the original
  glm-4-9b-chat, under the custom non-OSI "glm-4" licence, is the separate
  glm-4-9b-chat-original entry.

  '
variants:
- name: GLM-4.6
  params_total: 355B
  params_active: 32B (MoE)
  context_window: 200K
  kind: instruct
  safety_tuned: true
- name: GLM-4.5
  params_total: 355B
  params_active: 32B (MoE)
  context_window: up to 128k (per checkpoint)
  kind: instruct
  safety_tuned: true
- name: GLM-4.5-Air
  params_total: 106B
  params_active: 12B (MoE)
  context_window: up to 128k (per checkpoint)
  kind: instruct
  safety_tuned: true
- name: GLM-4-32B-0414 (dense)
  params_total: 32B
  context_window: 32K native, up to 128K extended
  kind: instruct
  safety_tuned: true
- name: GLM-4-9B-0414 (dense)
  params_total: 9B
  context_window: up to 128k (per checkpoint)
  kind: instruct
  safety_tuned: true
openness:
  tier: open_weights
  components:
    weights: open
    training_data: closed
    training_code: closed
    evaluation: partial
    documentation: open
    license: open
  license:
    spdx: MIT
    name: MIT License (GLM-4.5 / GLM-4.6 / GLM-4-0414 series; verify per checkpoint)
    classification: osi
    commercial_use: allowed
    notable_restrictions:
    - Per-variant licensing - the GLM-4.5/4.6 and GLM-4-0414 series are MIT, but the
      original glm-4-9b used a custom non-OSI "glm-4" license; verify the LICENSE file
      per checkpoint
    url: https://huggingface.co/zai-org/GLM-4.6
provenance:
  canonical_source: https://huggingface.co/zai-org
  verified_org_on_primary_host: true
  formats:
  - safetensors
  integrity:
    checksums: true
    signed: false
    signing_tech: ''
    provenance_attestation: false
  mirrors_and_quants:
    acknowledged: true
    notable:
    - name: ModelScope (Zhipu official)
      trust: publisher
      note: Zhipu's own hub - dual-published; verify checksums match across hubs
    - name: Legacy THUDM org on Hugging Face
      trust: publisher
      note: Older GLM/ChatGLM checkpoints live under the legacy THUDM org; the current
        org is zai-org
    - name: Community GGUF quants (Ollama, bartowski, etc.)
      trust: community
      note: many quants for the dense 0414 sizes; not canonical
  checkpoint_checklist_score: 5
  scanner_result: {}
  incidents: []
eu_ai_act:
  is_gpai: true
  systemic_risk:
    designated: false
    training_flops_estimate: the 355B GLM-4.5/4.6 MoE may approach the 1e25 threshold;
      not publicly confirmed either way. Smaller dense 9B/32B are well under
    over_1e25_threshold: false
    article_55_docs_available: 'no'
  open_source_exemption:
    license_qualifies: partial
    rationale: 'On license grounds the MIT-licensed GLM-4.5/4.6 and 0414 series are
      genuine OSI-approved free/open-source releases with public parameters and usage
      information, so they plausibly qualify for the Article 53 open-source exemption
      from the Annex XI/XII technical-documentation duties. Two caveats. First, the
      exemption is void for any systemic-risk model, and it cannot be confirmed whether
      the 355B MoE crosses the 1e25 FLOPs threshold - if it does, the full Article 55
      package (not published) would be owed. Second, the surviving obligations (a copyright
      policy and a public training-content summary) are not published, and because the
      training corpus is not released a downstream provider cannot assemble the training-content
      summary from upstream artifacts. Recorded as ''partial'' to reflect the clean license
      offset against the unresolved systemic-risk and missing training-content package.

      '
  provider_package:
    technical_documentation: partial
    downstream_information: partial
    copyright_policy: 'no'
    training_content_summary: 'no'
    code_of_practice_signatory: false
  deployer_notes: 'A China-based provider is unlikely to furnish an EU AI Office documentation
    package. An EU deployer inherits a clean MIT license and a usable model card / technical
    report for the mainstream sizes, but must self-assemble the copyright policy and
    training-content material (the corpus is not released). For the 355B MoE there is
    an unresolved systemic-risk question and no Article 55 documentation the deployer
    can rely on - factor this into siting and high-stakes use, and note the hosted-API
    content moderation and China-aligned alignment when assessing behaviour.

    '
  last_assessed: '2026-07-25'
performance: {}
behaviour: {}
safety: {}
deployment:
  ceiling_tier: T3
  ceiling_conditional: true
  hardware_notes: 'The dense 9B runs on a single modern GPU and the 32B on a single
    high-memory or dual GPU (heavier at long context); the 106B/12B Air MoE needs a
    multi-GPU node or aggressive quantization, and the 355B/32B GLM-4.5/4.6 MoE needs
    serious multi-GPU infrastructure (or heavy quantization) to serve.

    '
  serving_support:
  - vllm
  - sglang
  - llama.cpp
  - ollama
  - hf-transformers
  controls_required:
  - Deploy behind your own input/output guardrails; do not rely on built-in alignment
  - Add a guard/classifier model and prompt-injection defences for agentic/coding use
  - Account for China-aligned alignment and hosted-API content moderation in behaviour
    testing
  - Verify checksums match across Hugging Face (zai-org) and ModelScope; pin the exact
    revision and confirm the per-checkpoint LICENSE
  - For the 355B MoE, resolve or avoid the EU systemic-risk / Article 55 question yourself
    before EU high-stakes use
score:
  rubric_version: '1.1'
  headline: 65.2
  grade: C
  hard_flags:
  - '🚩 EU AI Act - the 355B GLM-4.5/4.6 MoE may approach the 1e25-FLOPs systemic-risk
    threshold (unconfirmed) and no Article 55 / training-content documentation is published'
  dimensions:
    openness:
      score: 3
      rationale: 'Open-weights tier: weights are downloadable under a genuine MIT license
        with model cards and technical reports, but the training data and training code
        are not released (only inference code) and evaluation is only partially reproducible.
        Solidly open-weight rather than open-science.

        '
      evidence_refs:
      - ev-hf-zai
      - ev-license-mit
      - ev-github
    provenance:
      score: 3
      rationale: 'Verified zai-org on Hugging Face plus official ModelScope publication,
        safetensors with checksums, and no canonical-org malicious incident (checklist
        5/8). The dual-hub distribution and the legacy THUDM org are supply-chain surfaces
        - verify checksums match across hubs. Meets the score-3 anchor (verified org +
        safetensors + checksums); short of 4, which needs a scanned checkpoint or a
        documented mirror/quantization policy (~6-7 boxes), and of 5''s cryptographic
        signing.

        '
      evidence_refs:
      - ev-hf-zai
      - ev-modelscope
    legal:
      score: 3
      rationale: 'The OSI-approved MIT license on the GLM-4.5/4.6 and 0414 series is
        a real plus - cleaner than a restricted community license. But licensing is
        per-variant (the original glm-4-9b used a custom non-OSI license), there is no
        training-content summary or copyright policy, and the 355B MoE carries an unresolved
        systemic-risk question with no Article 55 documentation - capping legal readiness
        at competent-with-caveats.

        '
      evidence_refs:
      - ev-license-mit
      - ev-license-split
      - ev-eu-gap
    safety:
      score: 3
      rationale: 'Instruct variants are safety-tuned and withstand casual jailbreaks,
        but tuning is lighter than Western frontier labs, there is no companion guard
        model, the hosted API applies Chinese content moderation, and the models carry
        China-aligned alignment - behavioural factors to account for. Deploy behind your
        own guards.

        '
      evidence_refs:
      - ev-safety
      - ev-behaviour
    performance:
      score: 4
      rationale: 'Strong general capability and especially strong coding/agentic performance:
        third-party evaluation places GLM-4.6 among the more capable open models for
        real-world coding and tool use. Not marked 5 because leadership is domain-concentrated
        (coding/agentic) rather than uniform, and the coding/agentic results come from
        third-party evaluation.

        '
      evidence_refs:
      - ev-perf-coding
    operational:
      score: 4
      rationale: 'Strong ecosystem support: dual distribution on Hugging Face and ModelScope,
        first-class vLLM and SGLang serving, community GGUF quants, and a size range
        from a 9B dense model to the 355B MoE. Short of 5 because the largest MoE needs
        serious infrastructure and day-0 llama.cpp/edge support for the big MoE lags
        the dense sizes.

        '
      evidence_refs:
      - ev-ecosystem
      - ev-hf-zai
    governance:
      score: 3
      rationale: 'Active, accountable publisher (Zhipu AI / Z.ai) with a rapid release
        cadence and a verified presence on Hugging Face and ModelScope, but no documented
        vulnerability-disclosure or deprecation policy and no EU Code of Practice signature.

        '
      evidence_refs:
      - ev-hf-zai
      - ev-eu-gap

# --- Assessed signals: five cross-cutting attributes highlighted at the top of the entry
#     (like the EU AI Act flag). Not a scoring input - each ties back to one of the seven
#     AOI dimensions and summarises documentation that lives in the four domains.
signals:
  trainability:
    level: partial
    dimension: openness
    summary: "Fine-tune freely under MIT on the GLM-4.5/4.6 and 0414 series, but training data and code are closed - you can adapt these weights but cannot reproduce them from scratch; verify each checkpoint's LICENSE (original glm-4-9b was custom-licensed)."
    refs: [ev-license-mit, ev-hf-zai]
  knowledge_structure:
    level: moderate
    dimension: performance
    summary: "Capable long-context (up to 200K on GLM-4.6) coding and knowledge backbone, but China-aligned alignment and hosted-API moderation distort coverage on politically sensitive subjects."
    refs: [ev-perf-coding, ev-behaviour]
  specialization:
    level: strong
    dimension: openness
    summary: "Excellent for specialisation: an MIT-licensed ladder from a 9B dense model to a 355B/32B MoE for fine-tuning and distillation, with released inference code and technical reports."
    refs: [ev-hf-zai, ev-0414]
  exchangeability:
    level: high
    dimension: operational
    summary: "Highly portable: safetensors served on vLLM and SGLang behind OpenAI-compatible endpoints; mind the GLM chat template and thinking/agentic output format when swapping."
    refs: [ev-ecosystem, ev-hf-zai]
  misuse_exposure:
    level: unbenchmarked
    dimension: safety
    summary: "Not independently benchmarked for misuse: safety tuning is lighter than Western frontier labs with no companion guard model, the hosted API applies Chinese moderation, and no broad third-party red-team exists."
    refs: [ev-safety, ev-behaviour]

