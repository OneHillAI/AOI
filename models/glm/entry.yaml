ownership:
  level: partial
  factors:
    use_modify:
      level: strong
      rationale: "Per-variant, but clean on the current line: GLM-4.6 ships a real checked-in MIT LICENSE ('Copyright (c) 2026 Zhipu AI', no custom clauses) and the GLM-4.5 and GLM-4-0414 siblings declare the same MIT via HF metadata/README, so you can run, fine-tune, distill, redistribute and commercialise the 9B-to-355B ladder with no gate. The exception is the legacy glm-4-9b, which is NOT plain MIT - a custom 'glm-4' licence with commercial-use registration, 'Built with glm-4' attribution and a name-prefix requirement under PRC law - so verify the LICENSE per checkpoint."
      # grounded in: ev-license-glm52 (license, retrieved) - real in-repo MIT LICENSE on GLM-5.2, confirming the family MIT is genuine; ev-license-mit (license, retrieved) - 4.5/4.6/0414 MIT declared via metadata/README only, no checked-in LICENSE file; ev-license-split (license, retrieved) - glm-4-9b custom glm-4 licence read verbatim (registration, 'Built with glm-4', name-prefix, PRC law/Haidian court)
    transparency:
      level: weak
      rationale: "You hold the weights but cannot see what they are: training data and training code are closed, the models carry China-aligned alignment you cannot inspect, and the hosted Z.ai API applies Chinese content moderation."
      # grounded in: training data/code closed (structural); ev-behaviour (third_party) - China-aligned alignment and hosted-API content moderation
    reliability:
      level: moderate
      rationale: "Runs dependably, but safety tuning is lighter than Western frontier labs, there is no companion guard model, and the 355B MoE carries an unresolved EU systemic-risk question."
      # grounded in: ev-perf-coding (third_party) - coding/agentic capability; ev-safety (third_party) - lighter safety tuning, no companion guard model
    data_control:
      level: strong
      rationale: "Self-hosted, the MIT-licensed weights run on your own infrastructure and nothing phones home - your data and derived knowledge stay yours. The hosted Z.ai API is the only path that exposes inputs, and it is a Singapore regime distinct from the PRC: API content is 'not saved on our servers' and not used to train unless you agree, though consumer chat content is used to improve the models."
      # grounded in: self-hosting (structural, no clawback/telemetry in MIT); ev-zai-terms (terms, retrieved) - Singapore law/SIAC, API carve-out 'We will not use End User Content ... unless you explicitly agree'; ev-zai-privacy (privacy_policy, retrieved) - Singapore processing, API content 'not saved on our servers', consumer content used 'when we train and improve our models'
  verdict: "You substantially but not uniformly own the GLM line, and the split is per-variant. The current line is genuine MIT: GLM-4.6 ships a real checked-in MIT LICENSE ('Copyright (c) 2026 Zhipu AI') and the GLM-4.5 and GLM-4-0414 siblings declare the same MIT via HF metadata/README, so you can run, fine-tune, distill, redistribute and commercialise them with no gate. The caveat is the legacy glm-4-9b: NOT plain MIT, a custom 'glm-4' licence requiring commercial-use registration, 'Built with glm-4' attribution and a name prefix, governed by PRC law with disputes to Beijing's Haidian District court, so verify the LICENSE per checkpoint. Two things hold it at partial: training is opaque (closed data/code, China-aligned alignment you cannot inspect) and no safety battery is benchmarked, so supply your own guards. The weights you self-host are yours, but the hosted Z.ai service is Singapore-governed (SIAC arbitration), a different legal regime from the PRC glm-4-9b weights licence; do not conflate the two."

