  security_contact: https://huggingface.co/deepseek-ai
summary: "DeepSeek-R1-Distill checkpoints built on Qwen2.5 bases (1.5B, 7B, 14B, 32B): dense reasoning models distilled from DeepSeek-R1 into small weights that run on a single GPU. They are a separate entry from the flagship R1 and from the Llama-base distils because they are small dense models on Qwen2.5 bases. DeepSeek releases them under the MIT licence, an OSI-approved permissive licence with no field-of-use restriction. The Qwen2.5 base weights are Apache-2.0 per their cards. Use-and-modify is strong and ownership substantial, a step above the Llama-base distils. At 1.5B-32B the models fall well below any systemic-risk threshold, so the open-source exemption applies and the EU legal profile is better than for the 671B family models, though DeepSeek still publishes no copyright policy or training-content summary. They share the DeepSeek family caveats: China-aligned topic filtering, no safety tuning of their own and no first-party guard model. They are scored as strong-for-size reasoning models, not frontier-absolute. They serve easily with llama.cpp, Ollama and vLLM on a single GPU."
