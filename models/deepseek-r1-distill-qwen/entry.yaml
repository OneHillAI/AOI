ownership:
  level: substantial
  factors:
    use_modify:
      level: strong
      rationale: "Apache-2.0 (OSI, permissive, patent grant, ungated) inherited from the Qwen2.5 bases, with commercial use and any modification permitted and no field-of-use limit - a clean permissive grant, so use-and-modify is strong. A step above the Llama-base distils."
      # grounded in: ev-dsrq-license (license, retrieved) - Apache-2.0
    transparency:
      level: moderate
      rationale: "Weights are inspectable under Apache-2.0, but the distillation data and code are closed and the weights inherit R1's China-aligned topic filtering you cannot inspect - open_weights, so moderate."
      # grounded in: ev-dsrq-card (model_card) - open_weights; ev-dsrq-behaviour (third_party) - inherited filtering
    reliability:
      level: strong
      rationale: "Performance 3, operational 5 and safety 3: solid reasoning-for-size with the easiest serving in the family; all three at or above 3, operational at 5, so reliability is strong. The caveat is the absence of own safety tuning / a first-party guard model."
      # grounded in: dimension scores performance 3 / operational 5 / safety 3
    data_control:
      level: strong
      rationale: "Self-hosted, the Apache-2.0 weights run entirely on your own infrastructure - including on-device at the small sizes - with no telemetry and no claw-back, so your data stays yours."
      # grounded in: ev-dsrq-license (license, retrieved) - Apache-2.0, no claw-back; small sizes enable on-device
  verdict: "You substantially own these self-hosted Apache-2.0 R1-Distill (Qwen) models: a clean permissive licence makes use-and-modify strong, and self-hosting - including on-device at the small sizes - keeps your data yours, so data-control is strong too. Ownership is substantial, a step above the Llama-base distils. It stops short of full because the distillation data and code are closed (not reproducible) and the weights inherit R1's China-aligned filtering and carry no safety tuning of their own - deploy behind your own guardrails."
