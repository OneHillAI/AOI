summary: 'The DeepSeek-R1-Distill checkpoints built on Qwen2.5 bases (1.5B, 7B, 14B, 32B) - dense
  reasoning models distilled from DeepSeek-R1 into far smaller, single-GPU-friendly weights. They are a
  separate entry from the flagship R1 and from the Llama-base distils because they inherit a different
  licence: the Qwen2.5 bases they build on are Apache-2.0, so these distils carry Apache-2.0 - a clean,
  OSI-approved, permissive licence with no field-of-use restriction. That makes use-and-modify strong
  and ownership substantial, a step above the Llama-base distils. Because they are small (1.5B-32B),
  they fall well below any systemic-risk threshold, so their EU legal profile is cleaner than the 671B
  family models (the FOSS open-source exemption applies, though DeepSeek still publishes no copyright
  policy or training-content summary). They inherit the family behavioural caveats - China-aligned topic
  filtering, lighter safety tuning, no first-party guard model - and are scored as strong-for-size
  reasoning models rather than frontier-absolute. Trivial to serve (llama.cpp, Ollama, vLLM, single GPU).

  '
