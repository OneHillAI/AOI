ownership:
  level: substantial
  factors:
    use_modify:
      level: strong
      rationale: "MIT (OSI-approved, permissive, ungated), granted by DeepSeek over Apache-2.0 Qwen2.5 base weights. Commercial use and any modification are permitted with no field-of-use limit, so use-and-modify is strong, a step above the Llama-base distils."
      # grounded in: ev-dsrq-license (license, retrieved) - MIT
    transparency:
      level: moderate
      rationale: "Weights are inspectable under the MIT licence, but the distillation data and code are closed and the weights carry R1's China-aligned topic filtering, which cannot be inspected. Open-weights tier, so moderate."
      # grounded in: ev-dsrq-card (model_card) - open_weights; ev-dsrq-behaviour (third_party) - inherited filtering
    reliability:
      level: strong
      rationale: "Performance 3, operational 5 and safety 3: solid reasoning for the size and the easiest serving in the family. All three are at or above 3 and operational is 5, so reliability is strong. The gap is the absence of safety tuning and of a first-party guard model."
      # grounded in: dimension scores performance 3 / operational 5 / safety 3
    data_control:
      level: strong
      rationale: "Self-hosted, the MIT-licensed weights run entirely on your own infrastructure, including on-device at the small sizes, with no telemetry and no claw-back. Your data stays yours."
      # grounded in: ev-dsrq-license (license, retrieved) - MIT, no claw-back; small sizes enable on-device
  verdict: "You substantially own these self-hosted MIT-licensed R1-Distill (Qwen) models. The permissive licence makes use-and-modify strong, and self-hosting, including on-device at the small sizes, keeps your data yours, so data-control is strong too. Ownership stops short of full because the distillation data and code are closed (not reproducible) and the weights carry R1's China-aligned filtering and no safety tuning of their own. Deploy behind your own guardrails."
