# OneHill v2 MODEL library entry for the DeepSeek-R1-Distill (Qwen base) checkpoints. Split from the
# aggregate deepseek entry on the LICENCE axis: DeepSeek releases these distils under the MIT licence
# over Apache-2.0 Qwen2.5 base weights, distinct from the Llama-base distils (Llama Community Licence ->
# deepseek-r1-distill-llama). Small scale (1.5B-32B) means not systemic-risk, so the EU legal profile
# is cleaner than the 671B family models. Validated against schema/model.v2.schema.json.

schema_version: '2.0'
id: deepseek-r1-distill-qwen
name: DeepSeek-R1-Distill (Qwen base)
aliases:
- DeepSeek-R1-Distill-Qwen-1.5B
- DeepSeek-R1-Distill-Qwen-7B
- DeepSeek-R1-Distill-Qwen-14B
- DeepSeek-R1-Distill-Qwen-32B
