# OneHill v2 MODEL library entry for the DeepSeek-R1-Distill (Qwen base) checkpoints. Split from the
# aggregate deepseek entry on the LICENCE axis: these distils are built on Apache-2.0 Qwen2.5 bases
# and inherit Apache-2.0, distinct from the Llama-base distils (Llama Community Licence ->
# deepseek-r1-distill-llama). Small scale (1.5B-32B) means not systemic-risk, so the EU legal profile
# is cleaner than the 671B family models. Validated against schema/model.v2.schema.json.

schema_version: '2.0'
