deployment:
  ceiling_tier: T1
  ceiling_conditional: true
  hardware_notes: 'No minimum hardware is stated for the March builds. Sizes on disk: sarvam-105b 424.2 GB in float32, sarvam-105b-fp8 112.6 GB, 105B Q4_K_M GGUF 64.2 GB, 105B-1711 BF16 218.3 GB, 105B-1711 NVFP4 70.2 GB; sarvam-30b 128.6 GB in float32, 30B FP8 38.7 GB, 30B Q4_K_M 19.6 GB. The 1711 card gives throughput tables for one B200 and one 96 GB RTX PRO 6000 Blackwell with vLLM 0.33.0. The card examples for the March builds use tensor parallelism of 4 to 8 for the 105B and 2 for the 30B.'
  serving_support:
  - hf-transformers
  - vllm
  - sglang
  - llama.cpp
  controls_required:
  - Keep a human reviewing every output (T1 internal assistant) until you have run your own safety and jailbreak tests, because Sarvam publishes no safety evaluation.
  - Add input and output guardrails and your own guard classifier. Sarvam ships none.
  - Pin the Hugging Face revision, verify the LFS sha256 values and review the custom Python files and hotpatch_vllm.py before using trust_remote_code=True.
  - Test tool-call and reasoning parsing on your serving stack before allowing tool use, and sandbox any tool execution.
  - Treat the Terms of Service and EULA clauses on derivative works and training as an open question for legal review before building a derivative.
score:
  rubric_version: '1.1'
  headline: 44.4
  grade: D
  hard_flags: []
  dimensions:
    openness:
      score: 3
      rationale: Weights are open under an Apache-2.0 declaration, with cards, a blog and a public 22-language evaluation prompt set. Training data, training code, post-training recipes, base checkpoints and a technical report are not published. That is the open-weights anchor.
      evidence_refs:
      - ev-card-105b
      - ev-blog
      - ev-quant-code
      - ev-indivibe
      - ev-no-report
    provenance:
      score: 2
      rationale: The canonical source is the sarvamai Hugging Face organisation, which is not verified. Weights are safetensors with LFS checksums and a clean hub scan on the main repos, and nothing is signed. Loading needs trust_remote_code, and the 30B and 105B repos ship a script that patches a vLLM install. The from-scratch claim has no independent support. About 3 of 8 checklist boxes are met.
      evidence_refs:
      - ev-hub
      - ev-blog
      - ev-aa
    legal:
      score: 2
      rationale: Apache-2.0 is declared but no repo holds a LICENSE file, and Sarvam's Terms and EULA add limits on derivative works and training that do not mention the weights. No technical report, training-data summary, copyright policy or GPAI documentation exists. The models are far below the 1e25 FLOP line. The open-source exemption is uncertain because Sarvam sells API access to the same models.
      evidence_refs:
      - ev-license
      - ev-tos
      - ev-eula
      - ev-no-report
      - ev-token-factory
    safety:
      score: 1
      rationale: The blog says the fine-tuning data covered India-specific risks and red-team prompts. No card states a safety result, risk or limitation, no safety evaluation is published for any build and there is no guard model. The 1711 cards are silent on safety. No third-party safety test was found. The acceptable-use policy sits in the hosted Terms. Any published safety evaluation would move this to 2.
      evidence_refs:
      - ev-blog
      - ev-card-105b
      - ev-card-1711
      - ev-tos
    performance:
      score: 2
      rationale: Every card and blog number is the publisher's own, and the blog and the 30B card disagree on one cell. Artificial Analysis puts the 105B at 18 and the 30B at 12 on its index, below every peer it lists, and reports high hallucination. The score is 2 because independent coverage is one index at one date. The 1711 build has no third-party score.
      evidence_refs:
      - ev-aa
      - ev-card-105b
      - ev-card-30b
      - ev-card-1711
      - ev-blog
    operational:
      score: 3
      rationale: The models run on Transformers with trust_remote_code, SGLang and vLLM. Official FP8 and Q4_K_M GGUF builds exist, and the 1711 cards give vLLM 0.33.0 commands, an NVFP4 build and throughput tables. The March models need a vLLM fork or hot-patch and ship as float32 weights of 128.6 GB and 424.2 GB. Open threads report loading and reasoning-toggle faults, and Ollama and MLX are undocumented.
      evidence_refs:
      - ev-card-105b
      - ev-card-1711
      - ev-hub
      - ev-quant-code
      - ev-discussions
    governance:
      score: 3
      rationale: 'Sarvam AI is an accountable company in Bengaluru with a release record: the March release, fix pull requests in September and November, and the 1711 build in November. Staff merge pull requests on the repos. Issues go through Hugging Face discussions and several stay unanswered. No security policy, deprecation policy or technical report covers the weights.'
      evidence_refs:
      - ev-hub
      - ev-discussions
      - ev-api-docs
      - ev-no-report
signals:
  trainability:
    level: partial
    dimension: openness
    summary: Apache-2.0 weights allow fine-tuning, and Prism is a Sarvam LoRA fine-tune of the 105B. Data, base checkpoints and post-training code are withheld, so a rebuild is impossible.
