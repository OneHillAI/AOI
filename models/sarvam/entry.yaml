    - ev-license
    - ev-token-factory
    - ev-no-report
  knowledge_structure:
    level: moderate
    dimension: performance
    summary: A 128K context on the 105B, a reasoning mode and tool calling suit grounded work. Independent scores are low for the class and hallucination is high.
    refs:
    - ev-card-105b
    - ev-aa
  specialization:
    level: moderate
    dimension: openness
    summary: Fine-tuning is possible and a public Indic prompt set exists for evaluation. The custom architecture needs custom code and no post-training recipe is published.
    refs:
    - ev-indivibe
    - ev-discussions
  exchangeability:
    level: medium
    dimension: operational
    summary: The models load on common runtimes with custom code. The March builds need a vLLM fork or hot-patch and the 1711 build needs vLLM 0.33.0 with a glm45 parser.
    refs:
    - ev-card-105b
    - ev-card-1711
  misuse_exposure:
    level: unbenchmarked
    dimension: safety
    summary: No safety, jailbreak or red-team result is published for any build, and no guard model exists.
    refs:
    - ev-blog
    - ev-card-1711
