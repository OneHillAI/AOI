# OneHill v2 MODEL library entry for Sarvam-30B, Sarvam-105B and Sarvam-105B-1711 (Sarvam AI).
# Validated against schema/model.v2.schema.json.
#   scores    -> scripts/score.py --write
#   meters    -> scripts/completeness.py --write
#   prose     -> assess.md / implement.md / use.md / support.md (sections keyed <!-- item: KEY -->)
# Scope: one entry for the three builds because they share the Apache-2.0 declaration, the weights-only
# openness tier and the same base. Sarvam-105B-1711 is a further post-trained finetune of Sarvam-105B.
# Grounded 2026-11-19 against docs/primary-sources/sarvam/. No OneHill evaluation has been run, so there
# is no onehill_verified evidence and every documentation item is aggregated or a gap.

