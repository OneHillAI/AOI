ownership:
  level: partial
  factors:
    use_modify:
      level: moderate
      rationale: Apache-2.0 is declared, the weights are ungated and fine-tuning is possible. The licence is a card declaration with no LICENSE file, and Sarvam's Terms and EULA add limits on derivative works and training that do not mention the weights (ev-license, ev-tos, ev-eula).
    transparency:
      level: moderate
      rationale: Weights, cards and a blog are public. Training data, training code, post-training recipes, base checkpoints and a technical report are not (ev-card-105b, ev-blog, ev-no-report).
    reliability:
      level: weak
      rationale: 'Safety scores 1: no safety evaluation, no guard model and silent 1711 cards. Operational scores 3 (ev-blog, ev-card-1711, ev-hub).'
    data_control:
      level: moderate
      rationale: Weights run on your own hardware. The custom Python and the vLLM hot-patch script need review, and the hosted API terms conflict on training and retention (ev-hub, ev-privacy, ev-eula).
  verdict: You can run and fine-tune Apache-2.0-declared weights, but you get no data, code, recipes or safety case, and the licence is a card declaration with no LICENSE file. Sarvam's own Terms and EULA restrict derivative works and training without mentioning the weights. Ownership rises if Sarvam adds a LICENSE file, clarifies those documents and publishes a safety evaluation.
evidence:
- id: ev-card-105b
  claim: The 105B card declares Apache-2.0 and lists 22 language codes plus English. It describes a mixture-of-experts model with 10.3B active parameters and a 128K context through YaRN. Every benchmark table is the publisher's own. The card has no section on training data, safety or limitations.
  source_type: publisher
  doc_type: model_card
  retrieved: true
  url: https://huggingface.co/sarvamai/sarvam-105b
  date: '2026-11-19'
- id: ev-card-30b
  claim: The 30B card declares Apache-2.0 and the same language codes. It describes 2.4B non-embedding active parameters and a 65,536-token evaluation length. Its AIME 25 cell for the 30B reads 88.3 where the publisher blog table reads 80.0. It has no safety or limitations section.
  source_type: publisher
  doc_type: model_card
  retrieved: true
  url: https://huggingface.co/sarvamai/sarvam-30b
  date: '2026-11-19'
- id: ev-card-1711
  claim: The 105B-1711 cards declare Apache-2.0 and say the model shares the Sarvam-105B base and is further post-trained for tool calling, instruction following, agentic tasks and Indian languages. The BF16 repo lists sarvamai/sarvam-105b as its base model (finetune). Benchmarks are the publisher's own and include an internal Indic Suite judged by Gemini 3.1 Pro. The cards have no language list, safety section or data section.
  source_type: publisher
  doc_type: model_card
