  security_contact: Email address on the Trust Center for the hosted platform; no security policy covers the weights
summary: 'Sarvam-30B and Sarvam-105B are Apache-2.0 reasoning models from Sarvam AI in Bengaluru, released as weights only. No training data, training code or technical report is published and no safety evaluation exists. Both are mixture-of-experts models: the 105B has 10.3B active parameters and a 128K context, the 30B has 2.4B active parameters. The 105B-1711 build shares the base, licence and openness tier and is covered here. No weights repo holds a LICENSE file, so the licence is a card declaration. Sarvam''s own API documentation lists 10 Indian languages plus English where the cards claim 22. Training from scratch is a publisher claim. The headline is D because safety evidence is absent and legal documentation is thin.'
