# OneHill v2 MODEL library entry for Kimi (Moonshot AI - Kimi K2). New entry.
# Validated against schema/model.v2.schema.json.
#   scores    -> scripts/score.py --write        (AOI headline/grade)
#   meters    -> scripts/completeness.py --write  (per-domain completeness/originality)
#   prose     -> assess.md / implement.md / use.md / support.md (sections keyed <!-- item: KEY -->)

schema_version: '2.0'
id: kimi
name: Kimi (Moonshot AI - Kimi K2)
aliases:
- Kimi K2
- Kimi-K2-Base
- Kimi-K2-Instruct
- moonshotai/Kimi-K2
- Moonshot Kimi
publisher:
  name: Moonshot AI
  country: China
  accountable_entity: true
  url: https://huggingface.co/moonshotai
  security_contact: https://huggingface.co/moonshotai
summary: 'Kimi is Moonshot AI''s (Beijing) model/product line; its confirmed open
  release is Kimi K2 - a very large Mixture-of-Experts model with 1T total / 32B active
  parameters (384 experts, 8+1 selected), a 128K context window, and an explicit agentic/coding
  focus (trained with the MuonClip optimiser). Base and Instruct variants ship on the
  verified moonshotai org as block-FP8 safetensors and serve on vLLM, SGLang, KTransformers
  and TensorRT-LLM. The two things an adopter must weigh: the trillion-parameter scale
  makes self-hosting a multi-node exercise even quantized (no small variants exist),
  and as a China-based release it carries a modified (non-OSI) MIT license, China-aligned
  topic censorship, and no EU AI Act documentation package - so deploy behind your own
  guards.

  '
variants:
- name: Kimi-K2-Base
  params_total: 1T
  params_active: 32B
  context_window: 128k
  kind: base
  safety_tuned: false
- name: Kimi-K2-Instruct
  params_total: 1T
  params_active: 32B
  context_window: 128k
  kind: instruct
  safety_tuned: true
openness:
  tier: open_weights
  components:
    weights: open
    training_data: closed
    training_code: closed
    evaluation: partial
    documentation: open
    license: open
  license:
    spdx: ''
    name: Modified MIT License (MIT plus a large-scale attribution clause)
    classification: permissive_open
    commercial_use: allowed_with_conditions
    notable_restrictions:
    - Products/services with more than 100M monthly active users OR more than $20M USD
      monthly revenue must prominently display "Kimi K2" on the product user interface
      (Modified MIT attribution clause)
    - Modified MIT is not OSI-certified - verify the LICENSE file per checkpoint
    url: https://github.com/moonshotai/Kimi-K2/blob/main/LICENSE
provenance:
  canonical_source: https://huggingface.co/moonshotai
  verified_org_on_primary_host: true
  formats:
  - safetensors
  integrity:
    checksums: true
    signed: false
    signing_tech: ''
    provenance_attestation: false
  mirrors_and_quants:
    acknowledged: true
    notable:
    - name: Block-FP8 native weights (moonshotai)
      trust: publisher
      note: Weights are distributed in block-FP8; verify checksums and pin the revision
    - name: Community GGUF / lower-bit quants
      trust: community
      note: Community quants circulate to make the 1T model tractable; not canonical
  checkpoint_checklist_score: 5
  scanner_result: {}
  incidents: []
eu_ai_act:
  is_gpai: true
  systemic_risk:
    designated: false
    training_flops_estimate: '~3e24 FLOPs (32B active params x 15.5T training tokens,
      MoE active-parameter compute); under the 1e25 threshold, though a total-parameter
      framing of a 1T model is contested'
    over_1e25_threshold: false
    article_55_docs_available: n/a
  open_source_exemption:
    license_qualifies: partial
    rationale: 'Kimi K2 publishes its parameters, architecture and usage information
      under a broadly permissive (if modified, non-OSI) MIT license, and on the active-parameter
      compute estimate it sits under the 1e25 systemic-risk threshold - so unlike the
      largest systemic-risk peers it plausibly reaches the Article 53 open-source exemption
      from the Annex XI/XII technical-documentation duties. Two things introduce uncertainty:
      the modified MIT attribution-at-scale clause is not an OSI-certified free/open-source
      license, and the surviving obligations (a copyright policy and a public training-content
      summary) are not published - the 15.5T-token corpus is not released. Recorded
      as ''partial'' to reflect the genuine gap.

      '
  provider_package:
    technical_documentation: partial
    downstream_information: partial
    copyright_policy: 'no'
    training_content_summary: 'no'
    code_of_practice_signatory: false
  deployer_notes: 'A China-based provider is unlikely to furnish an EU AI Office documentation
    package. An EU deployer inherits a detailed technical report and a permissive-ish
    license but must self-assemble the copyright policy and training-content material,
    which cannot be reconstructed from released artifacts because the training corpus
    is closed. A fine-tuner placing a derivative on the EU market may become a provider
    for that derivative and inherits these gaps.

    '
  last_assessed: '2026-07-25'
performance: {}
behaviour: {}
safety: {}
deployment:
  ceiling_tier: T2
  ceiling_conditional: true
  hardware_notes: 'A 1T-parameter MoE: even in block-FP8 the weights are on the order
    of ~1 TB, so serving requires a multi-GPU / multi-node cluster (or heavy CPU-offload
    via KTransformers). There are no small variants - single-GPU or laptop deployment
    is not possible.

    '
  serving_support:
  - vllm
  - sglang
  - ktransformers
  - tensorrt-llm
  controls_required:
  - Deploy the Instruct (safety-tuned) variant, not the Base checkpoint
  - Add your own input/output guardrails and a guard/classifier model; do not rely on
    built-in alignment
  - Account for China-aligned topic censorship on politically sensitive prompts
  - Add prompt-injection defences and treat retrieved/tool content as untrusted for
    agentic/tool-use deployments
  - Verify checksums, pin the exact moonshotai revision, and budget multi-node serving
    infrastructure
score:
  rubric_version: '1.1'
  headline: 62.8
  grade: C
  hard_flags: []
  dimensions:
    openness:
      score: 3
      rationale: 'Open-weights tier: Base and Instruct weights are downloadable under
        a permissive (modified) MIT license with a solid model card and technical report,
        but the 15.5T-token training data and training code are undisclosed and evaluation
        is only partially reproducible. Solidly open-weight rather than open-science.

        '
      evidence_refs:
      - ev-kimi-hf
      - ev-license
    provenance:
      score: 3
      rationale: 'Distributed from the verified moonshotai org on Hugging Face as block-FP8
        safetensors with checksums and no canonical-org malicious incident on record
        (checklist 5/8). Meets the score-3 anchor (verified org + safetensors + checksums);
        short of 4, which needs a scanned checkpoint or a documented mirror/quantization
        policy (~6-7 boxes), and of 5''s cryptographic weight signing / SLSA attestation.

        '
      evidence_refs:
      - ev-kimi-hf
      - ev-github
    legal:
      score: 3
      rationale: 'The broadly permissive modified MIT license is a real plus over a
        restrictive community license, but it is not OSI-certified and carries a large-scale
        attribution clause; there is no training-content summary or copyright policy;
        and a China-based provider is unlikely to furnish EU documentation. Not a systemic-risk
        model, so no Article 55 hard flag - but competent-with-caveats at best.

        '
      evidence_refs:
      - ev-license
      - ev-eu-gap
    safety:
      score: 3
      rationale: 'The Instruct variant is safety-tuned and withstands casual jailbreaks,
        but tuning is lighter than Western frontier labs, there is no companion guard
        model, and the model exhibits China-aligned topic censorship on politically
        sensitive prompts. Deploy behind your own guards.

        '
      evidence_refs:
      - ev-safety
      - ev-behaviour
    performance:
      score: 4
      rationale: 'Frontier-adjacent open capability, especially in agentic tool use
        and coding: on independent evaluation Kimi K2 (e.g. SWE-bench Verified ~65.8)
        is among the strongest open-weight models. Short of 5 because leadership is
        concentrated in agentic/coding and the results are third-party without independent reproduction.

        '
      evidence_refs:
      - ev-perf
    operational:
      score: 3
      rationale: 'Good serving support (vLLM, SGLang, KTransformers, TensorRT-LLM) with
        an OpenAI/Anthropic-compatible API, but the trillion-parameter scale is a heavy
        operational burden: minimum viable deployment is a multi-GPU / multi-node cluster
        even in block-FP8, and there are no small variants - so it is far less portable
        than a laptop-to-datacentre size ladder.

        '
      evidence_refs:
      - ev-github
      - ev-ecosystem
    governance:
      score: 3
      rationale: 'Active, accountable publisher (Moonshot AI) with a detailed technical
        report and a verified hub presence, but no documented vulnerability-disclosure
        or deprecation policy and no EU Code of Practice signature.

        '
      evidence_refs:
      - ev-kimi-hf
      - ev-eu-gap

# --- Assessed signals: five cross-cutting attributes highlighted at the top of the entry
#     (like the EU AI Act flag). Not a scoring input - each ties back to one of the seven
#     AOI dimensions and summarises documentation that lives in the four domains.
signals:
  trainability:
    level: partial
    dimension: openness
    summary: "Fine-tune/adapt freely under the modified MIT license and a released Base variant, but the 15.5T-token training data and training code are closed - you can adapt but not reproduce - and full fine-tuning of a 1T MoE is very heavy."
    refs: [ev-license, ev-kimi-hf]
  knowledge_structure:
    level: strong
    dimension: performance
    summary: "Frontier-adjacent knowledge/reasoning backbone with a 128K context and top agentic/coding scores, but China-aligned topic censorship distorts coverage on politically sensitive subjects."
    refs: [ev-perf, ev-behaviour]
  specialization:
    level: moderate
    dimension: openness
    summary: "A Base checkpoint and permissive license invite specialisation, but the trillion-parameter scale gates it behind serious compute - LoRA is feasible, full domain adaptation or distillation is costly."
    refs: [ev-kimi-hf, ev-license]
  exchangeability:
    level: medium
    dimension: operational
    summary: "Portable safetensors behind OpenAI/Anthropic-compatible serving, but with ~1 TB of block-FP8 weights and no small variants, swapping Kimi K2 in or out requires multi-node infrastructure rather than a drop-in single-GPU model."
    refs: [ev-github, ev-ecosystem]
  misuse_exposure:
    level: unbenchmarked
    dimension: safety
    summary: "Not independently benchmarked for misuse: Instruct safety tuning is lighter than Western frontier labs with no companion guard model, China-aligned censorship is present, and no broad third-party red-team exists."
    refs: [ev-safety, ev-behaviour]

