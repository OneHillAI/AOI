ownership:
  level: substantial
  factors:
    use_modify:
      level: strong
      rationale: "DeepSeek-R1 is MIT-licensed (OSI, permissive, ungated), with commercial use, any modifications and derivative works, and distillation expressly permitted - a clean permissive grant, so use-and-modify is strong."
      # grounded in: ev-dsr1-license (license, retrieved) - MIT; commercial + distillation permitted
    transparency:
      level: moderate
      rationale: "Weights are inspectable and there is a detailed technical report, but the training data and code are closed, and the weights carry China-aligned topic filtering you cannot inspect - open_weights, so moderate."
      # grounded in: ev-dsr1-card (model_card) - open_weights; ev-dsr1-behaviour (third_party) - China-aligned filtering
    reliability:
      level: strong
      rationale: "Performance 4, operational 5 and safety 3: a strong reasoner with first-class serving; all three at or above 3 with two at or above 4, so reliability is strong. The caveat is the absence of a first-party guard model."
      # grounded in: dimension scores performance 4 / operational 5 / safety 3
    data_control:
      level: strong
      rationale: "Self-hosted, the MIT weights run entirely on your own infrastructure with no telemetry and no licence claw-back, so your data stays yours. (The hosted DeepSeek API is a separate matter with its own data terms.)"
      # grounded in: ev-dsr1-license (license, retrieved) - MIT, no claw-back; self-hosting structural
  verdict: "You substantially own self-hosted DeepSeek-R1: MIT permits commercial use, modification and distillation, and self-hosting keeps your data yours, so use-and-modify and data-control are both strong - ownership is substantial. It stops short of full because the training corpus and code are closed (not reproducible), the weights carry China-aligned filtering you cannot inspect, and there is no first-party guard model. Deploy behind your own guardrails, and treat EU high-stakes use as needing a self-assembled compliance package."
