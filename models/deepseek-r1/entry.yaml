safety: {}
deployment:
  ceiling_tier: T2
  ceiling_conditional: true
  hardware_notes: >-
    A 671B-total / 37B-active MoE. Even quantised, the weights are large, so serving needs
    multiple GPUs or nodes. The community quant ecosystem makes lower-bit deployment tractable.
    Context is 128K.
  serving_support:
  - vllm
  - sglang
  - llama.cpp
  - ollama
  controls_required:
  - Add your own input/output guardrails and a guard/classifier model - no first-party guard ships and
    safety tuning is lighter than Western frontier labs
  - Account for China-aligned topic filtering on politically sensitive prompts
  - Add prompt-injection defences and treat retrieved/tool content as untrusted for agentic use
  - Verify checksums and pin the exact deepseek-ai revision; account for R1's reasoning / think-tag
    output format
score:
  rubric_version: '1.1'
  headline: 64.4
  grade: C
  hard_flags: []
  dimensions:
    openness:
      score: 3
      rationale: >-
        Open-weights tier: MIT-licensed weights and open documentation through a detailed
        technical report. Training data is closed, training code is partial and evaluation is
        partial. That meets the open-weights anchor (3) and falls short of the fully-open top
        anchor.
      evidence_refs:
      - ev-dsr1-license
      - ev-dsr1-card
    provenance:
      score: 3
      rationale: >-
        The deepseek-ai org on Hugging Face is verified, ships safetensors with checksums and has
        a clear canonical source with no malicious-checkpoint incident (checklist ~5/8). A 4 needs
        a scanned checkpoint or documented mirror policy, and a 5 needs cryptographic signing.
      evidence_refs:
      - ev-dsr1-card
    legal:
      score: 2
      rationale: >-
        The MIT licence is permissive and the least restricted in the DeepSeek family, but EU
        compliance gaps outweigh it for a downstream deployer: no Article 55 documentation, no
        copyright policy and no training-content summary. At 671B the open-source exemption may
        not apply if the model is classed as systemic-risk.
      evidence_refs:
      - ev-dsr1-license
      - ev-dsr1-eu
    safety:
      score: 3
      rationale: >-
        Released as reasoning variants with documented behaviour, which meets the score-3 anchor.
        Safety tuning is lighter than at Western frontier labs, the model applies China-aligned
        topic censorship, and no first-party guard model ships. Deployers must add their own
        guardrails.
      evidence_refs:
      - ev-dsr1-behaviour
    performance:
      score: 4
      rationale: >-
        R1 is a strong reasoning model, among the most capable open-weight reasoners on public
        leaderboards. The score is capped at 4 because the benchmark results are third-party and
        OneHill has not reproduced them.
      evidence_refs:
      - ev-dsr1-perf
    operational:
      score: 5
      rationale: >-
        Serving is supported across vLLM, SGLang, llama.cpp and Ollama. A large family of
        community quantisations and distils exists, and third-party hosting was widespread shortly
        after release.
      evidence_refs:
      - ev-dsr1-card
      - ev-dsr1-perf
    governance:
      score: 3
      rationale: >-
        DeepSeek is an active, named publisher with a verified org and a record of technical
        reports, which meets the score-3 anchor. The score is held down by the lack of a published
        security-contact or vulnerability-disclosure process and by China-origin policy
        restrictions that some organisations apply.
      evidence_refs:
      - ev-dsr1-card
      - ev-dsr1-behaviour
signals:
  trainability:
    level: partial
    dimension: openness
    summary: >-
      MIT permits fine-tuning and expressly permits distillation. Training data and code are
      unreleased, so full reproduction from scratch is not possible.
    refs: [ev-dsr1-license]
  knowledge_structure:
    level: moderate
    dimension: performance
    summary: >-
      Strong reasoning makes it a capable knowledge and analysis backbone. Built-in topic
      censorship aligned with Chinese content rules distorts coverage of sensitive subjects.
    refs: [ev-dsr1-perf, ev-dsr1-behaviour]
  specialization:
    level: strong
    dimension: openness
    summary: >-
      MIT weights permit fine-tuning and explicitly permit distillation into smaller task-specific
      models, a stated DeepSeek use case.
    refs: [ev-dsr1-license]
  exchangeability:
    level: high
    dimension: operational
    summary: >-
      Safetensors weights and first-class serving (vLLM, SGLang and more) make swapping easy. R1's
      reasoning / think-tag output format is the main behaviour to handle when swapping.
    refs: [ev-dsr1-card]
  misuse_exposure:
    level: unbenchmarked
    dimension: safety
    summary: >-
      No independent misuse benchmark exists, and no broad third-party red-team of the open
      weights has been published. The hosted service has drawn data-privacy scrutiny.
    refs: [ev-dsr1-behaviour]
