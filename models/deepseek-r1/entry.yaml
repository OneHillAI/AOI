summary: 'DeepSeek-R1 is DeepSeek''s open-weight reasoning line - the 671B-total / 37B-active
  Mixture-of-Experts R1 (128K context) and the R1-0528 refresh - released under a clean MIT licence
  that expressly permits commercial use and distillation. It is a separate entry from DeepSeek-V3 and
  the R1 distils because it is the pure-MIT reasoning release: "This code repository and the model
  weights are licensed under the MIT License. DeepSeek-R1 series support commercial use, allow for any
  modifications and derivative works, including, but not limited to, distillation for training other
  LLMs." The MIT grant makes use-and-modify strong and lifts ownership to substantial. What holds it
  short of full is the rest: the training data and code are unreleased (open_weights, not reproducible),
  safety tuning is lighter than Western frontier labs with China-aligned topic filtering and no guard
  model, and as a China-based release there is no EU AI Act documentation package, with the 671B scale
  putting the systemic-risk question in play. Serving support is first-class (vLLM, SGLang, llama.cpp,
  Ollama) with an extensive community quant/distil ecosystem.

  '
