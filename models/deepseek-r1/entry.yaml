        own entries (deepseek-r1-distill-llama / -qwen) with the base model's licence
  checkpoint_checklist_score: 5
  scanner_result: {}
  incidents: []
eu_ai_act:
  is_gpai: true
  systemic_risk:
    designated: false
    training_flops_estimate: 'Not published as an absolute figure. A 671B-total / 37B-active MoE at
      the R1 scale plausibly sits in systemic-risk territory, but DeepSeek discloses no FLOP budget, so
      the 1e25 crossing is not a grounded figure.'
    over_1e25_threshold: null
    article_55_docs_available: 'no'
  open_source_exemption:
    license_qualifies: partial
    rationale: >-
      The MIT licence is free and open-source, so on the licence axis DeepSeek-R1 is a strong
      candidate for the Article 53 open-source exemption. The surviving obligations are unmet: no
      copyright policy and no public training-content summary are published, the training corpus
      is closed, and a China-based provider is unlikely to furnish an EU documentation package. If
      R1 crosses the systemic-risk threshold, the exemption does not apply to those duties at all.
      Recorded as partial.
  provider_package:
    technical_documentation: partial
    downstream_information: partial
    copyright_policy: 'no'
    training_content_summary: 'no'
    code_of_practice_signatory: false
  deployer_notes: >-
    The MIT grant is permissive, but a China-based provider is unlikely to furnish an EU AI Office
    documentation package. An EU deployer has a detailed technical report but must write the
    copyright policy and training-content material itself, and cannot reconstruct them from
    released artifacts because the corpus is closed. At 671B the systemic-risk question is open on
    disclosed figures.
  last_assessed: '2026-08-03'
performance: {}
