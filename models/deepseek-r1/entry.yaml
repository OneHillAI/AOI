ownership:
  level: substantial
  factors:
    use_modify:
      level: strong
      rationale: >-
        DeepSeek-R1 is MIT-licensed (OSI, permissive, ungated). Commercial use, any modifications
        and derivative works, and distillation are expressly permitted, so use-and-modify is
        strong.
      # grounded in: ev-dsr1-license (license, retrieved) - MIT; commercial + distillation permitted
    transparency:
      level: moderate
      rationale: >-
        Weights are inspectable and a detailed technical report exists. Training data and code are
        closed, and the weights carry China-aligned topic filtering that cannot be inspected, so
        transparency is moderate (open_weights).
      # grounded in: ev-dsr1-card (model_card) - open_weights; ev-dsr1-behaviour (third_party) - China-aligned filtering
    reliability:
      level: strong
      rationale: >-
        Performance 4, operational 5 and safety 3: a strong reasoner with first-class serving. All
        three score at least 3 and two score at least 4, so reliability is strong. No first-party
        guard model ships.
      # grounded in: dimension scores performance 4 / operational 5 / safety 3
    data_control:
      level: strong
      rationale: >-
        Self-hosted, the MIT weights run on the deployer's own infrastructure with no telemetry
        and no licence claw-back, so data stays with the deployer. The hosted DeepSeek API has
        separate data terms.
      # grounded in: ev-dsr1-license (license, retrieved) - MIT, no claw-back; self-hosting structural
  verdict: >-
    Self-hosted DeepSeek-R1 is substantially owned. MIT permits commercial use, modification and
    distillation, and self-hosting keeps data with the deployer, so use-and-modify and
    data-control are both strong. Ownership stops short of full because the training corpus and
    code are closed, the weights carry China-aligned filtering that cannot be inspected, and no
    first-party guard model exists. Deploy behind your own guardrails, and treat EU high-stakes
    use as needing a self-assembled compliance package.
