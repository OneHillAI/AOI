# OneHill v2 MODEL library entry for DeepSeek-R1. Split from the aggregate deepseek entry: the MIT
# reasoning line. Shared dimensional grounding carried from the deepseek family entry; licence and
# licence-driven scores are per this release.
# Validated against schema/model.v2.schema.json.

schema_version: '2.0'
id: deepseek-r1
name: DeepSeek-R1
aliases:
- DeepSeek-R1
- DeepSeek-R1-0528
- deepseek-ai/DeepSeek-R1
family:
  id: deepseek
  name: DeepSeek
publisher:
  name: DeepSeek
  country: China
  accountable_entity: true
  url: https://huggingface.co/deepseek-ai
  security_contact: https://huggingface.co/deepseek-ai
summary: >-
  DeepSeek-R1 is DeepSeek's open-weight reasoning line: the 671B-total, 37B-active
  Mixture-of-Experts R1 with 128K context, and the R1-0528 refresh. It has its own entry, separate
  from DeepSeek-V3 and the R1 distils, because it is the pure-MIT reasoning release. The model
  card states: "This code repository and the model weights are licensed under the MIT License.
  DeepSeek-R1 series support commercial use, allow for any modifications and derivative works,
  including, but not limited to, distillation for training other LLMs." The MIT grant makes
  use-and-modify strong and ownership substantial. Three gaps hold ownership below full. Training
  data is unreleased and training code is partial, so the model is open_weights and not
  reproducible. Safety tuning is lighter than at Western frontier labs, with China-aligned topic
  filtering and no guard model. As a China-based release it has no EU AI Act documentation
  package, and at 671B the systemic-risk question is open. Serving support covers vLLM, SGLang,
  llama.cpp and Ollama, with a large community quant and distil ecosystem.
variants:
- name: DeepSeek-R1
  params_total: 671B
  params_active: 37B
  context_window: 128k
  kind: reasoning
  safety_tuned: true
- name: DeepSeek-R1-0528
  params_total: 671B
  params_active: 37B
  context_window: 128k
  kind: reasoning
