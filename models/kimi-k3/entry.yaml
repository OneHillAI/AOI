#     and privacy policy were read; the technical report PDF was fetched and text-extracted
#     locally. Benchmark positioning is corroborated by reputable secondary coverage.
evidence:
- id: ev-k3-card
  claim: "The Kimi K3 model card on the verified moonshotai Hugging Face org lists a 2.8T total / 104B active MoE (16 of 896 experts), 1M context, MXFP4 weights / MXFP8 activations, native text+image+video, and serving on vLLM/SGLang/TokenSpeed. It discloses no training data, code, tokens or safety tuning. Kimi K3.1 Pro, post-trained from K3, is a separate release."
  source_type: publisher
  doc_type: model_card
  retrieved: true
  url: https://huggingface.co/moonshotai/Kimi-K3
  date: '2026-11-19'
- id: ev-k3-license
  claim: "The Kimi K3 License grants use, copying, modification, merging, publication, distribution, sublicensing and sale. A Licensee that operates a Model as a Service business with aggregate revenue over $20M in any consecutive 12 months \"must enter into a separate agreement with Moonshot AI before using the Software or its derivative works for any commercial purpose\". Model as a Service means giving a third party inference or fine-tuning access with meaningful control over inputs, parameters or training data, and excludes end-user products with embedded model features and mere relaying to models hosted by others. A \"display Kimi K3\" branding clause applies at 100M MAU or $20M monthly revenue. Internal use and official or certified-partner use are exempt from both. The licence is not OSI-certified."
  source_type: publisher
  doc_type: license
  retrieved: true
  url: https://huggingface.co/moonshotai/Kimi-K3/raw/main/LICENSE
  date: '2026-11-19'
- id: ev-k3-report
  claim: "Moonshot's technical report \"Kimi K3: Open Frontier Intelligence\" (GitHub PDF) describes a 2.8T/104B MoE with Kimi Delta Attention and Per-Head Muon, and a context curriculum of 8K to 64K (pretrain) and 256K to 1M (cooldown). It states no total training-token count and no absolute pretraining-FLOP figure. The report's section 6.2.2 documents offensive-cyber capability (Tier-1 vulnerability discovery, Tier-2 exploit development) and notes that Anthropic and OpenAI models refuse such tasks while K3 does not. The report cites a UK AI Security Institute / NIST CAISI assessment that it calls consistent; that assessment is unverified."
  source_type: publisher
  doc_type: technical_report
  retrieved: true
  url: https://github.com/MoonshotAI/Kimi-K3/blob/main/k3_tech_report.pdf
  date: '2026-11-19'
- id: ev-k3-terms
  claim: "The platform.kimi.ai model-use agreement, dated \"Last Updated: July 30th, 2026\", allows user Content to be used to develop and improve the Services, with opt-out only via an enterprise arrangement on request. It is governed by the laws of Singapore with SIAC arbitration."
  source_type: publisher
  doc_type: terms
  retrieved: true
  url: https://platform.kimi.ai/docs/agreement/modeluse.md
  date: '2026-11-19'
- id: ev-k3-privacy
  claim: "The platform.kimi.ai privacy policy states that the hosted service trains on user prompts, audio, images, videos and files by default (\"helps us optimize our models\"). The controller is MOONSHOT AI PTE. LTD, with Singapore servers and open-ended retention."
  source_type: publisher
  doc_type: privacy_policy
  retrieved: true
  url: https://platform.kimi.ai/docs/agreement/userprivacy
  date: '2026-11-19'
- id: ev-k3-models
  claim: "The hosted Kimi API Platform model list calls kimi-k3.1-pro \"the first model of the new K3.1 series and Kimi's most capable flagship to date\" and kimi-k3 \"Kimi's previous-generation flagship\"; both are live. Moonshot's Kimi K3.1 Pro model card says it is post-trained from Kimi K3 (HF repo created 2026-11-02, own licence file, see docs/primary-sources/kimi-k3/_sources.md)."
  source_type: publisher
  doc_type: docs
  retrieved: true
  url: https://platform.kimi.ai/docs/models.md
  date: '2026-11-19'
- id: ev-k3-coverage
  claim: "Tom's Hardware (reputable coverage) reports on the 2.8T Kimi K3 release. It covers the architecture (16/896 experts), MXFP4/MXFP8 QAT, a K2 comparison and 1st place on the Frontend Code Arena. It positions K3 behind only Claude Fable 5 and GPT-5.6 Sol overall, while ahead of other open models on coding and agentic benchmarks."
  source_type: third_party
  doc_type: third_party
  retrieved: true
  url: https://www.tomshardware.com/tech-industry/artificial-intelligence/moonshot-releases-2-8-trillion-parameter-kimi-k3
  date: '2026-07-28'
- id: ev-k3-eu-gap
  claim: "No public EU AI Act training-content summary, copyright policy or provider documentation package exists for Kimi K3, and the training corpus, training code and training-compute figures are not released."
  source_type: third_party
  doc_type: third_party
  retrieved: false
  url: https://huggingface.co/moonshotai/Kimi-K3
  date: '2026-07-28'
changelog:
- date: '2026-07-28'
  change: Initial entry (Kimi K3 - Moonshot AI). Classified open-weights (not closed-frontier); grounded against primary sources in docs/primary-sources/kimi-k3 - Kimi K3 License read verbatim (new $20M Model-as-a-Service separate-agreement gate), technical report PDF text-extracted (no training-token/FLOP figure published; section 6.2.2 offensive-cyber, no refusal), hosted platform terms + privacy (train-by-default, Singapore/SIAC).
- date: '2026-09-21'
  change: 'Freshness re-verification. The Kimi K3 License''s load-bearing $20M MaaS separate-agreement gate and branding thresholds re-read verbatim, unchanged - the K3 risk finding stands. No K4 or point release that alters the tracked terms.'
- date: '2026-11-19'
  change: 'Freshness re-verification against primary sources. Kimi K3 License re-read raw: byte-identical to the 2026-07-27 initial commit, so the $20M / 12-month Model-as-a-Service separate-agreement gate and the 100M-MAU / $20M-monthly-revenue branding clause stand unchanged, repo ungated. Evidence wording corrected: the earlier extract quoted a paraphrase as verbatim; the clause reads "must enter into a separate agreement with Moonshot AI before using the Software or its derivative works for any commercial purpose", and the gate applies only to a Model as a Service business as the licence defines it, with internal-use and official-partner exemptions. Technical report re-downloaded and re-read: section 6.2.2 offensive-cyber and no-refusal finding unchanged, no safety-tuning section, so the safety score of 1 and the reliability factor stand. Model card unchanged apart from eval results. Hosted platform.kimi.ai terms re-read (dated July 30th 2026, same train-by-default and enterprise-only opt-out clauses) and privacy policy re-read (dated April 30 2025, unchanged). New: Kimi K3.1 Pro (moonshotai, HF 2026-11-02, post-trained from K3, same licence text under a K3.1-Pro title) exists as a separate release; not folded in here. No score, factor or level change.'
last_verified: '2026-11-19'
