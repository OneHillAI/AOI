schema_version: '2.0'
id: kimi-k3
name: Kimi K3 (Moonshot AI)
aliases:
- Kimi K3
- Kimi-K3
- moonshotai/Kimi-K3
family:
  id: kimi
  name: Kimi
publisher:
  name: Moonshot AI
  country: China
  accountable_entity: true
  url: https://huggingface.co/moonshotai
  security_contact: https://huggingface.co/moonshotai/Kimi-K3
summary: "Kimi K3 is Moonshot AI's (Beijing) frontier open-weights release: a natively multimodal Mixture-of-Experts model with 2.8T total / 104B active parameters (16 of 896 routed experts per token), a 1M-token context window, and native text, image and video understanding. It is built on Kimi Delta Attention and Attention Residuals, with a claimed 2.5x scaling-efficiency gain over Kimi K2. The report titles it \"Open Frontier Intelligence\". It benchmarks close to the closed frontier: behind Claude Fable 5 and GPT-5.6 Sol overall, ahead of other open models on coding and agentic tasks, and 1st on the Frontend Code Arena. It is open-weights and not closed-frontier because the weights are downloadable (MXFP4 weights / MXFP8 activations, ~1.4TB). Three facts matter to an adopter. The custom \"Kimi K3 License\" is not OSI-certified and adds a $20M/12-month Model-as-a-Service separate-agreement gate on top of the K2-style branding threshold. No safety tuning, guard model or refusal training is described, and the technical report documents offensive-cyber capability (vulnerability discovery and exploit development) on tasks that frontier labs refuse. The 2.8T scale forces multi-node serving with no small variant. Deploy the weights behind a full external control stack."
variants:
- name: Kimi-K3
  params_total: 2.8T
  params_active: 104B
  context_window: 1M
  kind: reasoning
  safety_tuned: false
openness:
  tier: open_weights
  components:
    weights: open
    training_data: closed
    training_code: closed
    evaluation: partial
    documentation: open
    license: partial
  license:
    spdx: ''
    name: Kimi K3 License (custom, modified-MIT with commercial thresholds)
    classification: open_weight
    commercial_use: allowed_with_conditions
    notable_restrictions:
    - "A Model-as-a-Service business with more than $20M USD aggregate revenue over any consecutive 12 months must enter into a separate agreement with Moonshot AI before using the Software for any commercial purpose (new vs Kimi K2). Model-as-a-Service means third-party inference or fine-tuning access with meaningful control over inputs, parameters or training data; end-user products with embedded features and mere relaying are excluded. Internal use and use through Moonshot's official products or certified inference partners are exempt"
    - "Products/services with more than 100M monthly active users OR more than $20M USD monthly revenue must prominently display \"Kimi K3\" on the product user interface"
    - "Custom \"Kimi K3 License\" is not OSI-certified - verify the LICENSE file per checkpoint"
    url: https://huggingface.co/moonshotai/Kimi-K3/blob/main/LICENSE
provenance:
  canonical_source: https://huggingface.co/moonshotai/Kimi-K3
  verified_org_on_primary_host: true
  formats:
  - safetensors
  integrity:
    checksums: true
    signed: false
    signing_tech: ''
    provenance_attestation: false
  mirrors_and_quants:
    acknowledged: true
    notable:
    - name: Native MXFP4 weights / MXFP8 activations (moonshotai, QAT)
      trust: publisher
      note: Quantization-aware-trained weights ship natively; verify checksums and pin
        the revision
    - name: Community MXFP4 / GGUF quants
      trust: community
      note: Community quants circulate to make the 2.8T model tractable; not canonical
  checkpoint_checklist_score: 4
  scanner_result: {}
  incidents: []
eu_ai_act:
  is_gpai: true
  systemic_risk:
    designated: false
    training_flops_estimate: 'Not published. The technical report gives only a context-length
      curriculum (8K to 64K pretrain, 256K to 1M cooldown) and relative scaling-law FLOPs;
      no total training-token count and no absolute pretraining-FLOP figure are stated.
      Analytical note only: a 2.8T-total / 104B-active frontier pre-train plausibly approaches
      or exceeds the 1e25-FLOP threshold, but this is not a grounded figure.'
    over_1e25_threshold: null
    article_55_docs_available: n/a
  open_source_exemption:
    license_qualifies: uncertain
    rationale: "Kimi K3 publishes its parameters, architecture and usage information, but under a custom \"Kimi K3 License\" that is not an OSI-certified free/open-source licence and carries monetisation-linked commercial restrictions: a $20M/12-month Model-as-a-Service separate-agreement gate and a 100M-MAU / $20M-monthly-revenue branding condition. The EU AI Act open-source exemption does not extend to models released under non-free or monetised terms, so it most likely does not apply. Even if it did, the systemic-risk duties would bind if the model crosses 1e25 FLOP, which is unknown because the training compute is unpublished. Recorded as 'uncertain', leaning negative, pending the full Article 53/55 analysis."
  provider_package:
    technical_documentation: partial
    downstream_information: partial
    copyright_policy: 'no'
    training_content_summary: 'no'
    code_of_practice_signatory: false
  deployer_notes: "A China-based provider is unlikely to furnish an EU AI Office documentation package. An EU deployer receives a detailed technical report but must self-assemble the copyright policy and training-content material, which cannot be reconstructed because the training corpus, the training code and the training-token and FLOP figures are undisclosed. A fine-tuner placing a derivative on the EU market may become a provider for that derivative and takes on these gaps."
  last_assessed: '2026-07-28'
performance: {}
behaviour: {}
safety: {}
deployment:
  ceiling_tier: T2
  ceiling_conditional: true
  hardware_notes: "A 2.8T-parameter MoE (104B active). Even with native MXFP4 weights the full weights are ~1.4 TB, so serving needs a multi-GPU or multi-node cluster. There are no small variants, so single-GPU or laptop deployment is not possible. The card documents vLLM, SGLang and TokenSpeed; exact per-GPU VRAM is not stated."
  serving_support:
  - vllm
  - sglang
  - tokenspeed
  controls_required:
  - "The weights ship with no safety tuning, guard model or refusal training. Supply the entire control stack externally (guard or classifier model, input and output guardrails, conservative decoding) and do not rely on built-in alignment"
  - "Sandbox and tightly bound any agentic, tool-use or code-execution deployment; the technical report documents offensive-cyber capability (vulnerability discovery and exploit development) that the model does not refuse"
  - "Add prompt-injection defences and treat retrieved and tool content as untrusted"
  - "Account for possible China-aligned topic filtering on politically sensitive prompts (observed in the K2 lineage, unconfirmed for K3)"
  - "Verify checksums, pin the exact moonshotai revision and budget multi-node serving infrastructure; confirm the $20M Model-as-a-Service threshold before commercial deployment"
score:
  rubric_version: '1.1'
  headline: 53.2
  grade: D
  hard_flags: []
  dimensions:
    openness:
      score: 3
      rationale: "Open-weights tier: the weights are downloadable (native MXFP4/MXFP8 QAT) with a model card and a technical report, so weights, documentation and licence are Open or Partial. Training data and training code are undisclosed (the report does not state the training-token count) and evaluation is only partially reproducible. The model is open-weight and not open-science."
      evidence_refs:
      - ev-k3-card
      - ev-k3-report
    provenance:
      score: 3
      rationale: "The weights are distributed from the verified moonshotai org on Hugging Face as native MXFP4/MXFP8 weights (not pickle), with a clear canonical source and no malicious-mirror incident on record (checklist ~4/8). This meets the score-3 anchor (verified org, clear canonical source, integrity metadata). The score stops short of 4 because the base tensor format is not stated on the card and no scanned-checkpoint or documented mirror/quantization policy exists, and short of 5 for lack of cryptographic signing or SLSA attestation."
      evidence_refs:
      - ev-k3-card
      - ev-k3-report
    legal:
      score: 2
      rationale: "The licence permits many uses but carries material conditions. The custom \"Kimi K3 License\" is not OSI-certified and adds a $20M/12-month Model-as-a-Service separate-agreement gate on top of the 100M-MAU / $20M-revenue branding threshold. There is no training-content summary and no copyright policy, GPAI documentation is fragmentary, and a China-based provider is unlikely to furnish an EU package. The score is lower than for the K2 lineage because of the new commercial gate and the custom licence (not modified-MIT)."
      evidence_refs:
      - ev-k3-license
      - ev-k3-eu-gap
    safety:
      score: 1
      rationale: "No safety-tuned release, companion guard model, refusal training or content filtering is described in the model card or report. The technical report's section 6.2.2 documents offensive-cyber capability (Tier-1 vulnerability discovery and Tier-2 end-to-end exploit development) and notes that frontier Anthropic and OpenAI models refuse these tasks while K3 does not. The model is presented as deployable with readily elicited harmful behaviour and no mitigation, so it sits at the low end of the anchor. A hosted-platform acceptable-use policy and a publisher capability evaluation exist, but no safety-tuned variant."
      evidence_refs:
      - ev-k3-report
      - ev-k3-card
    performance:
      score: 4
      rationale: "Frontier-competitive open capability. The technical report and reputable coverage place Kimi K3 behind only Claude Fable 5 and GPT-5.6 Sol overall, ahead of every other open model on coding and agentic benchmarks, and 1st on the public Frontend Code Arena (1679). It is toward the top of its open-weights class across reasoning, coding, agentic and vision. The score stops short of 5 because the figures come from the publisher and secondary coverage, not from OneHill re-runs."
      evidence_refs:
      - ev-k3-coverage
      - ev-k3-card
    operational:
      score: 3
      rationale: "K3 runs on mainstream serving stacks (vLLM, SGLang, TokenSpeed) with native MXFP4 quantization and community quants, so a practical path exists. The 2.8T-parameter scale is a heavy burden. Minimum viable deployment is a multi-GPU or multi-node cluster (~1.4 TB of weights), there are no small variants, and exact hardware guidance is sparse. The documented stack is narrower than the K2 lineage (no KTransformers or TensorRT-LLM listed). The score is at the low end of a 3."
      evidence_refs:
      - ev-k3-card
      - ev-k3-coverage
    governance:
      score: 3
      rationale: "Moonshot AI is an active, accountable publisher with a detailed technical report and a verified hub presence. The report is a GitHub PDF and not an archival venue, no vulnerability-disclosure or deprecation policy is documented, and there is no EU Code of Practice signature."
      evidence_refs:
      - ev-k3-card
      - ev-k3-eu-gap

# --- Assessed signals: five cross-cutting attributes highlighted at the top of the entry.
signals:
  trainability:
    level: partial
    dimension: openness
    summary: "The downloadable weights can be fine-tuned and adapted under the Kimi K3 License, but training data, code and the token/FLOP counts are closed, so the model can be adapted and not reproduced. Full fine-tuning of a 2.8T MoE is a heavy multi-node exercise."
    refs: [ev-k3-license, ev-k3-card]
  knowledge_structure:
    level: strong
    dimension: performance
    summary: "Frontier-competitive knowledge, reasoning, coding and agentic backbone with a 1M-token context and native vision; ahead of other open models on coding/agentic and 1st on the Frontend Code Arena."
    refs: [ev-k3-coverage, ev-k3-card]
  specialization:
    level: moderate
    dimension: openness
    summary: "Downloadable weights and a broadly commercial licence allow specialisation, but the 2.8T scale gates it behind serious compute: LoRA is feasible, while full domain adaptation or distillation is costly."
    refs: [ev-k3-card, ev-k3-license]
  exchangeability:
    level: medium
    dimension: operational
    summary: "Weights are portable behind vLLM/SGLang, but ~1.4 TB of weights, no small variant and a narrower serving stack than K2 mean that swapping Kimi K3 in or out needs multi-node infrastructure. It is not a drop-in single-GPU model."
    refs: [ev-k3-card, ev-k3-coverage]
  misuse_exposure:
    level: partial
    dimension: safety
    summary: "Misuse exposure is elevated and partly characterised. The technical report benchmarks offensive-cyber capability (vulnerability discovery, exploit development) that K3 does not refuse. No independent red-team, no CBRN or child-safety battery and no mitigation or guard offset it."
    refs: [ev-k3-report, ev-k3-card]

