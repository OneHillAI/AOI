ownership:
  level: partial
  factors:
    use_modify:
      level: moderate
      rationale: "The custom Kimi K3 License grants use, modification, redistribution and sale of the downloadable weights, with scale-linked restrictions: a Model-as-a-Service business over $20M/12-month revenue must secure a separate agreement before commercial deployment, and large-scale products must display 'Kimi K3'. Most adopters can use it commercially, while large Model-as-a-Service operators are gated. It is open-weight with conditions and not a clean permissive grant."
      # grounded in: ev-k3-license (license, retrieved) - $20M/12mo MaaS separate-agreement gate + 100M-MAU/$20M-revenue branding clause read verbatim from the raw mirror
    transparency:
      level: moderate
      rationale: "The weights can be inspected and a detailed technical report is available, but the training corpus, the training code and the training-token and FLOP figures are closed, so how the model was made cannot be seen or reproduced."
      # grounded in: ev-k3-report (technical_report, retrieved) - 2.8T/104B MoE architecture read directly; training data/code closed and no token/FLOP count stated; ev-k3-card (model_card, retrieved) - weights-only release
    reliability:
      level: weak
      rationale: "Capability is frontier-competitive, but safety scores 1: no safety tuning, guard or refusal training exists, and the report documents offensive-cyber capability the model does not refuse. The model is presented as deployable while safety is left entirely to the adopter. Under the ownership rule, safety <= 1 for a deployable model makes reliability weak regardless of benchmark strength."
      # grounded in: ev-k3-report (technical_report, retrieved) - section 6.2.2 offensive-cyber, no refusal; ev-k3-card (model_card, retrieved) - no safety tuning described
    data_control:
      level: strong
      rationale: "Self-hosted, the weights run entirely on the deployer's own infrastructure with no telemetry or licence claw-back, so data stays with the deployer. The hosted platform.kimi.ai service differs: its terms and privacy policy train on user prompts, images, video and files by default, with opt-out only via an enterprise arrangement on request (Singapore law / SIAC). Data control therefore requires the weights and not the hosted API. Self-hosting is constrained by the ~1.4 TB footprint, which forces multi-node serving."
      # grounded in: ev-k3-license (license, retrieved) - grant with no data claw-back; ev-k3-terms (terms, retrieved) - train-to-improve, enterprise-only opt-out, Singapore/SIAC; ev-k3-privacy (privacy_policy, retrieved) - trains on user content by default, Singapore servers
  verdict: "Ownership is partial. The self-hosted Kimi K3 weights can be used, modified and commercialised, and they run entirely on the deployer's own infrastructure, so data stays with the deployer. The custom, non-OSI licence adds a $20M Model-as-a-Service separate-agreement gate on top of the branding threshold. The training corpus, code and compute are closed. Most consequentially, the model ships with no safety tuning or guard while its own report shows it performing offensive-cyber tasks that frontier labs refuse. Self-host behind a full external control stack, avoid the train-by-default hosted API where data control matters, and confirm the LICENSE and the Model-as-a-Service threshold before commercial deployment."

