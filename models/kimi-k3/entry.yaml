# OneHill v2 MODEL library entry for Kimi K3 (Moonshot AI). New entry.
# Validated against schema/model.v2.schema.json.
#   scores    -> scripts/score.py --write        (AOI headline/grade)
#   meters    -> scripts/completeness.py --write  (per-domain completeness/originality)
#   prose     -> assess.md / implement.md / use.md / support.md (sections keyed <!-- item: KEY -->)

schema_version: '2.0'
id: kimi-k3
name: Kimi K3 (Moonshot AI)
aliases:
- Kimi K3
- Kimi-K3
- moonshotai/Kimi-K3
family:
  id: kimi
  name: Kimi
publisher:
  name: Moonshot AI
  country: China
  accountable_entity: true
  url: https://huggingface.co/moonshotai
  security_contact: https://huggingface.co/moonshotai/Kimi-K3
summary: 'Kimi K3 is Moonshot AI''s (Beijing) frontier open-weights release: a natively
  multimodal Mixture-of-Experts model with 2.8T total / 104B active parameters (16 of
  896 routed experts per token), a 1M-token context window, and native text + image +
  video understanding, built on Kimi Delta Attention and Attention Residuals with a
  claimed 2.5x scaling-efficiency gain over Kimi K2. The report titles it "Open Frontier
  Intelligence" and it benchmarks close to the closed frontier (behind Claude Fable 5
  and GPT-5.6 Sol overall, ahead of other open models on coding/agentic, and 1st on the
  Frontend Code Arena). It stays open-weights, not closed-frontier, because the weights
  are downloadable (MXFP4 weights / MXFP8 activations, ~1.4TB). The three things an adopter
  must weigh: the custom "Kimi K3 License" is not OSI-certified and adds a $20M/12-month
  Model-as-a-Service separate-agreement gate on top of the K2-style branding threshold;
  no safety tuning, guard model, or refusal training is described and the technical report
  documents offensive-cyber capability (vulnerability discovery and exploit development)
  on tasks that frontier labs refuse; and the 2.8T scale forces multi-node serving with
  no small variant. Deploy the weights behind your own full control stack.

  '
variants:
- name: Kimi-K3
  params_total: 2.8T
  params_active: 104B
  context_window: 1M
  kind: reasoning
  safety_tuned: false
openness:
  tier: open_weights
  components:
    weights: open
    training_data: closed
    training_code: closed
    evaluation: partial
    documentation: open
    license: partial
  license:
    spdx: ''
    name: Kimi K3 License (custom, modified-MIT with commercial thresholds)
    classification: open_weight
    commercial_use: allowed_with_conditions
    notable_restrictions:
    - A Model-as-a-Service business with more than $20M USD aggregate revenue over any
      consecutive 12 months must secure a separate agreement with Moonshot AI before
      commercial deployment (new vs Kimi K2)
    - Products/services with more than 100M monthly active users OR more than $20M USD
      monthly revenue must prominently display "Kimi K3" on the product user interface
    - Custom "Kimi K3 License" is not OSI-certified - verify the LICENSE file per checkpoint
    url: https://huggingface.co/moonshotai/Kimi-K3/blob/main/LICENSE
provenance:
  canonical_source: https://huggingface.co/moonshotai/Kimi-K3
  verified_org_on_primary_host: true
  formats:
  - safetensors
  integrity:
    checksums: true
    signed: false
    signing_tech: ''
    provenance_attestation: false
  mirrors_and_quants:
    acknowledged: true
    notable:
    - name: Native MXFP4 weights / MXFP8 activations (moonshotai, QAT)
      trust: publisher
      note: Quantization-aware-trained weights ship natively; verify checksums and pin
        the revision
    - name: Community MXFP4 / GGUF quants
      trust: community
      note: Community quants circulate to make the 2.8T model tractable; not canonical
  checkpoint_checklist_score: 4
  scanner_result: {}
  incidents: []
eu_ai_act:
  is_gpai: true
  systemic_risk:
    designated: false
    training_flops_estimate: 'Not published. The technical report gives only a context-length
      curriculum (8K to 64K pretrain, 256K to 1M cooldown) and relative scaling-law FLOPs;
      no total training-token count and no absolute pretraining-FLOP figure are stated.
      Analytical note only: a 2.8T-total / 104B-active frontier pre-train plausibly approaches
      or exceeds the 1e25-FLOP threshold, but this is not a grounded figure.'
    over_1e25_threshold: null
    article_55_docs_available: n/a
  open_source_exemption:
    license_qualifies: uncertain
    rationale: 'Kimi K3 publishes its parameters, architecture and usage information, but
      under a custom "Kimi K3 License" that is not an OSI-certified free/open-source licence
      and that carries monetisation-linked commercial restrictions - a $20M/12-month
      Model-as-a-Service separate-agreement gate and a 100M-MAU / $20M-monthly-revenue
      branding condition. The EU AI Act open-source exemption does not extend to models
      released under non-free or monetised terms, so the exemption most likely does NOT
      apply; and even if it did, the systemic-risk duties would still bind if the model
      crosses 1e25 FLOP, which is unknown because the training compute is unpublished.
      Recorded as ''uncertain'' leaning negative, pending the full Article 53/55 analysis.

      '
  provider_package:
    technical_documentation: partial
    downstream_information: partial
    copyright_policy: 'no'
    training_content_summary: 'no'
    code_of_practice_signatory: false
  deployer_notes: 'A China-based provider is unlikely to furnish an EU AI Office documentation
    package. An EU deployer inherits a detailed technical report but must self-assemble the
    copyright policy and training-content material, which cannot be reconstructed because the
    training corpus, the training code and even the training-token/FLOP figures are undisclosed.
    A fine-tuner placing a derivative on the EU market may become a provider for that derivative
    and inherits these gaps.

    '
  last_assessed: '2026-07-28'
performance: {}
behaviour: {}
safety: {}
deployment:
  ceiling_tier: T2
  ceiling_conditional: true
  hardware_notes: 'A 2.8T-parameter MoE (104B active): even with native MXFP4 weights the full
    weights are ~1.4 TB, so serving requires a multi-GPU / multi-node cluster. There are no
    small variants - single-GPU or laptop deployment is not possible. The card documents
    vLLM, SGLang and TokenSpeed; exact per-GPU VRAM is not stated.

    '
  serving_support:
  - vllm
  - sglang
  - tokenspeed
  controls_required:
  - The weights ship with NO safety tuning, guard model, or refusal training - supply the
    entire model/input/output control stack externally (guard/classifier model, input and
    output guardrails, conservative decoding), do not rely on built-in alignment
  - Sandbox and tightly bound any agentic / tool-use / code-execution deployment - the technical
    report documents offensive-cyber capability (vulnerability discovery and exploit development)
    that the model does not refuse
  - Add prompt-injection defences and treat retrieved/tool content as untrusted
  - Account for possible China-aligned topic filtering on politically sensitive prompts (observed
    in the K2 lineage; not independently confirmed for K3 this session)
  - Verify checksums, pin the exact moonshotai revision, and budget multi-node serving
    infrastructure; confirm the $20M Model-as-a-Service threshold before commercial deployment
score:
  rubric_version: '1.1'
  headline: 53.2
  grade: D
  hard_flags: []
  dimensions:
    openness:
      score: 3
      rationale: 'Open-weights tier: the weights are downloadable (native MXFP4/MXFP8 QAT)
        with a model card and a technical report, so weights, documentation and licence are
        Open/Partial, but the training data and training code are undisclosed (the report does
        not even state the training-token count) and evaluation is only partially reproducible.
        Solidly open-weight, not open-science.

        '
      evidence_refs:
      - ev-k3-card
      - ev-k3-report
    provenance:
      score: 3
      rationale: 'Distributed from the verified moonshotai org on Hugging Face as native
        MXFP4/MXFP8 weights (not pickle) with the canonical source clear and no malicious-mirror
        incident on record (checklist ~4/8). Meets the score-3 anchor (verified org + clear
        canonical source + integrity metadata); short of 4 because the base tensor format is
        not explicitly stated on the card and there is no scanned-checkpoint or documented
        mirror/quantization policy, and short of 5''s cryptographic signing / SLSA attestation.

        '
      evidence_refs:
      - ev-k3-card
      - ev-k3-report
    legal:
      score: 2
      rationale: 'Permissive-enough for many uses but with material caveats: the custom "Kimi
        K3 License" is not OSI-certified and adds a $20M/12-month Model-as-a-Service
        separate-agreement gate on top of the 100M-MAU / $20M-revenue branding threshold, so
        the commercial grant carries real scale-linked conditions. There is no training-content
        summary and no copyright policy, GPAI documentation is fragmentary, and a China-based
        provider is unlikely to furnish an EU package. Lower than the K2 lineage because of the
        new commercial gate and the custom (not modified-MIT) licence.

        '
      evidence_refs:
      - ev-k3-license
      - ev-k3-eu-gap
    safety:
      score: 1
      rationale: 'No safety-tuned release, companion guard model, refusal training, or content
        filtering is described (model card and report), and the technical report''s section
        6.2.2 documents offensive-cyber capability - Tier-1 vulnerability discovery and Tier-2
        end-to-end exploit development - explicitly noting that frontier Anthropic and OpenAI
        models refuse these tasks while K3 does not. That is a model presented as deployable
        with readily elicited harmful behaviour and no mitigation, so it sits at the low end of
        the anchor: there is a hosted-platform acceptable-use policy and a publisher capability
        evaluation, but no safety-tuned variant to deploy.

        '
      evidence_refs:
      - ev-k3-report
      - ev-k3-card
    performance:
      score: 4
      rationale: 'Frontier-competitive open capability: the technical report and reputable
        coverage place Kimi K3 behind only Claude Fable 5 and GPT-5.6 Sol overall, ahead of
        every other open model on coding and agentic benchmarks, and 1st on the public Frontend
        Code Arena (1679). Toward the top of its open-weights class across several domains
        (reasoning, coding, agentic, vision). Short of 5 because the figures are publisher plus
        secondary coverage rather than OneHill-reproduced independent re-runs.

        '
      evidence_refs:
      - ev-k3-coverage
      - ev-k3-card
    operational:
      score: 3
      rationale: 'Runs on mainstream serving stacks (vLLM, SGLang, TokenSpeed) with native
        MXFP4 quantization and community quants available, so there is a practical path to run
        it - but the 2.8T-parameter scale is a heavy operational burden: minimum viable
        deployment is a multi-GPU / multi-node cluster (~1.4 TB of weights), there are no small
        variants, exact hardware guidance is sparse, and the documented stack is narrower than
        the K2 lineage (no KTransformers / TensorRT-LLM listed). Low end of a 3.

        '
      evidence_refs:
      - ev-k3-card
      - ev-k3-coverage
    governance:
      score: 3
      rationale: 'Active, accountable publisher (Moonshot AI) with a detailed technical report
        and a verified hub presence, but the report is a GitHub PDF rather than an archival
        venue, there is no documented vulnerability-disclosure or deprecation policy, and there
        is no EU Code of Practice signature.

        '
      evidence_refs:
      - ev-k3-card
      - ev-k3-eu-gap

# --- Assessed signals: five cross-cutting attributes highlighted at the top of the entry.
signals:
  trainability:
    level: partial
    dimension: openness
    summary: "Fine-tune and adapt the downloadable weights under the Kimi K3 License, but the training data, code and even the token/FLOP counts are closed - you can adapt, not reproduce - and full fine-tuning of a 2.8T MoE is a heavy multi-node exercise."
    refs: [ev-k3-license, ev-k3-card]
  knowledge_structure:
    level: strong
    dimension: performance
    summary: "Frontier-competitive knowledge, reasoning, coding and agentic backbone with a 1M-token context and native vision; ahead of other open models on coding/agentic and 1st on the Frontend Code Arena."
    refs: [ev-k3-coverage, ev-k3-card]
  specialization:
    level: moderate
    dimension: openness
    summary: "Downloadable weights and a broadly commercial licence invite specialisation, but the 2.8T scale gates it behind serious compute - LoRA is feasible, full domain adaptation or distillation is costly."
    refs: [ev-k3-card, ev-k3-license]
  exchangeability:
    level: medium
    dimension: operational
    summary: "Portable weights behind vLLM/SGLang, but with ~1.4 TB of weights, no small variant, and a narrower serving stack than K2, swapping Kimi K3 in or out requires multi-node infrastructure - not a drop-in single-GPU model."
    refs: [ev-k3-card, ev-k3-coverage]
  misuse_exposure:
    level: partial
    dimension: safety
    summary: "Misuse exposure is elevated and partly characterised: the technical report benchmarks offensive-cyber capability (vulnerability discovery, exploit development) that K3 does not refuse, but there is no independent red-team, no CBRN/child-safety battery, and no mitigation/guard to offset it."
    refs: [ev-k3-report, ev-k3-card]

