ownership:
  level: partial
  factors:
    use_modify:
      level: moderate
      rationale: "The custom Kimi K3 License grants use, modification, redistribution and sale of the downloadable weights, but it is a community-style licence with real scale-linked restrictions: a Model-as-a-Service business over $20M/12-month revenue must secure a separate agreement before commercial deployment, and large-scale products must display 'Kimi K3'. Commercially usable for most adopters, gated for large Model-as-a-Service operators - open-weight with conditions, not a clean permissive grant."
      # grounded in: ev-k3-license (license, retrieved) - $20M/12mo MaaS separate-agreement gate + 100M-MAU/$20M-revenue branding clause read verbatim from the raw mirror
    transparency:
      level: moderate
      rationale: "You can inspect the weights and read a detailed technical report, but the training corpus, the training code and even the training-token and FLOP figures are closed, so you cannot see how it was made or reproduce it."
      # grounded in: ev-k3-report (technical_report, retrieved) - 2.8T/104B MoE architecture read directly; training data/code closed and no token/FLOP count stated; ev-k3-card (model_card, retrieved) - weights-only release
    reliability:
      level: weak
      rationale: "Capability is frontier-competitive, but safety scores 1: no safety tuning, guard, or refusal training, and the report documents offensive-cyber capability the model does not refuse - a model presented as deployable whose safety is left entirely to the adopter. Under the ownership rule, safety <= 1 for a deployable model makes reliability weak regardless of benchmark strength."
      # grounded in: ev-k3-report (technical_report, retrieved) - section 6.2.2 offensive-cyber, no refusal; ev-k3-card (model_card, retrieved) - no safety tuning described
    data_control:
      level: strong
      rationale: "Self-hosted, the weights run entirely on your own infrastructure with no telemetry or licence claw-back, so your data stays yours. The hosted platform.kimi.ai service is the opposite: its terms and privacy policy train on user prompts, images, video and files BY DEFAULT (opt-out only via an enterprise arrangement on request, Singapore law / SIAC), so keep to the weights if data control is the point. The practical constraint on self-hosting is the ~1.4 TB footprint that forces multi-node serving."
      # grounded in: ev-k3-license (license, retrieved) - grant with no data claw-back; ev-k3-terms (terms, retrieved) - train-to-improve, enterprise-only opt-out, Singapore/SIAC; ev-k3-privacy (privacy_policy, retrieved) - trains on user content by default, Singapore servers
  verdict: "You substantially use, modify and commercialise the self-hosted Kimi K3 weights and run them entirely on your own infrastructure, so your data stays yours - but ownership is only partial. The custom, non-OSI licence adds a $20M Model-as-a-Service separate-agreement gate on top of the branding threshold, the training corpus/code/compute are closed, and, most consequentially, the model ships with no safety tuning or guard while its own report shows it performing offensive-cyber tasks that frontier labs refuse. Self-host behind a full external control stack, keep off the train-by-default hosted API if data control matters, and confirm the LICENSE and the Model-as-a-Service threshold before commercial deployment."

