# OneHill v2 MODEL library entry for EuroLLM.
# Validated against schema/model.v2.schema.json.
#   scores    -> scripts/score.py --write        (AOI headline/grade)
#   meters    -> scripts/completeness.py --write  (per-domain completeness/originality)
#   prose     -> assess.md / implement.md / use.md / support.md (sections keyed <!-- item: KEY -->)

schema_version: "2.0"
id: eurollm
name: EuroLLM (EuroLLM-9B / EuroLLM-1.7B)
aliases:
- EuroLLM
- EuroLLM-9B
- EuroLLM-9B-Instruct
- EuroLLM-1.7B
- utter-project/EuroLLM
family:
  id: eurollm
  name: EuroLLM
publisher:
  name: EuroLLM consortium (Unbabel, Instituto Superior Técnico / Instituto de Telecomunicações,
    University of Edinburgh, and partners) - EU-funded
  country: EU
  accountable_entity: true
  url: https://eurollm.io/
  security_contact: https://huggingface.co/utter-project
summary: "EuroLLM trades frontier scale for a European, Apache-2.0, all-EU-language model with a strong EU AI Act posture. It is an open-weight model designed in and for the EU, well under any systemic-risk threshold, and its natural home is multilingual EU-facing workloads, not beating the largest labs on English reasoning. EuroLLM is an EU-funded, open-weight multilingual language-model family (EuroLLM-9B and EuroLLM-1.7B, each in base and instruction-tuned form) built on EuroHPC compute (MareNostrum5) under Horizon Europe. The builders are a European academic-industrial consortium: Unbabel, Instituto Superior Técnico / Instituto de Telecomunicações, the University of Edinburgh and partners. The models are trained from scratch to cover all 24 official EU languages plus roughly 11 more (Arabic, Catalan, Chinese, Galician, Hindi, Japanese, Korean, Norwegian, Russian, Turkish, Ukrainian)."
variants:
- name: EuroLLM-9B (base)
  params_total: 9B
  context_window: 4k
  kind: base
  safety_tuned: false
- name: EuroLLM-9B-Instruct
  params_total: 9B
  context_window: 4k
  kind: instruct
  safety_tuned: true
- name: EuroLLM-1.7B (base)
  params_total: 1.7B
  context_window: 4k
  kind: base
  safety_tuned: false
- name: EuroLLM-1.7B-Instruct
  params_total: 1.7B
  context_window: 4k
  kind: instruct
  safety_tuned: true
openness:
  tier: open_weights_recipe
  components:
    weights: open
    training_data: partial
    training_code: partial
    evaluation: partial
    documentation: open
    license: open
  license:
    spdx: Apache-2.0
    name: Apache License 2.0
    classification: osi
    commercial_use: allowed
    notable_restrictions:
    - "The 9B repos (EuroLLM-9B, EuroLLM-9B-Instruct) sit behind an auto-approved Hugging Face contact-sharing gate (username and email shared with the publisher). The gate adds no licence term, and the 1.7B repos are not gated."
    url: https://huggingface.co/utter-project/EuroLLM-9B-Instruct
provenance:
  canonical_source: https://huggingface.co/utter-project
  verified_org_on_primary_host: true
  formats:
  - safetensors
  integrity:
    checksums: true
    signed: false
    signing_tech: ''
    provenance_attestation: false
  mirrors_and_quants:
    acknowledged: true
    notable:
    - name: QuantFactory / bartowski (GGUF), stelterlab (MLX 4-bit), kaitchup (GPTQ)
      trust: community
      note: popular local-inference quants, which are not the canonical utter-project weight source
    - name: NVIDIA NIM (utter-project/eurollm-9b-instruct)
      trust: vendor
      note: hosted API endpoint, which is not the canonical weight source
  checkpoint_checklist_score: 5
  scanner_result: {}
  incidents: []
eu_ai_act:
  is_gpai: true
  systemic_risk:
    designated: false
    training_flops_estimate: well under 1e25 (9B params, ~4T training tokens ~= 2e23 FLOPs)
    over_1e25_threshold: false
    article_55_docs_available: n/a
  open_source_exemption:
    license_qualifies: 'yes'
    rationale: "EuroLLM is released under OSI-approved Apache-2.0, with public parameters, architecture and usage information via the model cards and the EuroLLM-9B technical report, and is not monetised. It therefore qualifies for the Article 53 open-source exemption from the Annex XI/XII technical-documentation duties. The technical report partly discharges the surviving copyright-policy and public training-content-summary obligations: it documents the data mixture (FineWeb-edu, HPLT, MADLAD-400, CulturaX, mC4, The Stack) and the EuroFilter pipeline. The full pre-training corpus is not published as a single downloadable artifact. The model is not systemic-risk, so the exemption is not voided."
  provider_package:
    technical_documentation: 'yes'
    downstream_information: 'yes'
    copyright_policy: partial
    training_content_summary: partial
    code_of_practice_signatory: false
  deployer_notes: "A fine-tuner placing a derivative on the EU market under its own name may become a provider for that derivative. EuroLLM is EU-domiciled, Apache-2.0 and well under the systemic-risk compute threshold, so the underlying posture is strong. The detailed technical report lets a downstream provider assemble much of the technical documentation and a training-content summary from published artifacts, though not from a fully released corpus as with a fully-open model."
  last_assessed: '2026-07-25'
performance: {}
behaviour: {}
safety: {}
deployment:
  ceiling_tier: T2
  ceiling_conditional: true
  hardware_notes: "EuroLLM-9B runs on a single modern 24 GB GPU (tight at full precision, comfortable with light quantization). EuroLLM-1.7B runs on modest GPUs and is viable on CPU or edge via GGUF. The short 4k context keeps KV-cache pressure low."
  serving_support:
  - vllm
  - llama.cpp
  - ollama
  - tgi
  - hf-transformers
  controls_required:
  - "Deploy the Instruct (safety-tuned) variant, not the base checkpoint."
  - "Add input/output guardrails and a companion classifier for customer-facing use."
  - "Add your own per-language safety evaluation before relying on any specific language."
  - "Pin the exact utter-project revision and verify checksums."
score:
  rubric_version: '1.1'
  headline: 69.2
  grade: C
  hard_flags: []
  dimensions:
    openness:
      score: 4
      rationale: "Open-weight-plus-recipe: Apache-2.0 base and Instruct weights, a detailed technical report (arXiv 2506.04079) documenting the tokenizer, architecture, data mixture and training procedure, plus the released EuroFilter classifier and the EuroBlocks-Synthetic post-training dataset. Short of the top fully-open tier because the complete pre-training corpus and an end-to-end training repository are not released as downloadable artifacts (training built on the open Megatron-LM codebase). Training_data, training_code and evaluation are therefore partial, not open."
      evidence_refs:
      - ev-tech-report
      - ev-blog
      - ev-apache
    provenance:
      score: 3
      rationale: "Distributed from the verified utter-project org on Hugging Face in safetensors with per-file checksums (checklist ~5/8). The technical report documents the pipeline and names the data sources. Meets the score-3 anchor (verified org, safetensors, checksums). Short of 4, which needs a scanned checkpoint or a documented mirror and quantization policy (~6-7 boxes), and of 5, which needs cryptographic weight signing or SLSA attestation."
      evidence_refs:
      - ev-hf-9b-instruct
      - ev-tech-report
    legal:
      score: 4
      rationale: "OSI-approved Apache-2.0 with unconditional commercial use and no field-of-use limits, across base and Instruct weights. The publisher is EU-domiciled and the model is well under the systemic-risk compute threshold, which gives a strong Article 53 open-source-exemption posture. Short of 5 because the training-content-summary obligation can only be partly satisfied from the technical report; a fully-open model that publishes its corpus can satisfy it from the released dataset."
      evidence_refs:
      - ev-apache
      - ev-ec-osor
    safety:
      score: 3
      rationale: "The Instruct variants are instruction-tuned on EuroBlocks and behave as ordinary safety-tuned assistants. Published safety and alignment coverage is light and there is no companion guard model. Multilingual coverage means safety behaviour varies by language and is not uniformly evaluated. Base checkpoints are untuned research artifacts."
      evidence_refs:
      - ev-hf-9b-instruct
      - ev-tech-report
    performance:
      score: 3
      rationale: "Leading for its niche: independent and publisher benchmarks put EuroLLM-9B on par with Gemma-2-9B on multilingual EU-language tasks, ahead on WMT24++ translation, and matching Mistral-7B on English. It is a 9B model, and its raw single-language reasoning ceiling is well below frontier. The value is breadth of EU-language coverage, not category-topping capability."
      evidence_refs:
      - ev-moonlight
      - ev-index-bench
    operational:
      score: 4
      rationale: "Standard safetensors with a conventional architecture load on all mainstream stacks (vLLM, llama.cpp, Ollama, TGI, transformers). Community GGUF, MLX and GPTQ quants and a hosted NVIDIA NIM endpoint exist. Short of 5 mainly on the short 4k context window and the breadth of official day-0 tooling versus the largest ecosystems."
      evidence_refs:
      - ev-ops
      - ev-hf-9b-instruct
    governance:
      score: 3
      rationale: "An EU-funded consortium with named academic and industrial partners, detailed technical reports and a clear release cadence (1.7B -> 9B -> 22B). Held to 3 because accountability is distributed across many consortium partners, not held by a single accountable vendor, and no vulnerability-disclosure or deprecation/EoL policy is formally published."
      evidence_refs:
      - ev-eurollm-site
      - ev-ec-osor

# --- Assessed signals: five cross-cutting attributes highlighted at the top of the entry.
signals:
  trainability:
    level: partial
    dimension: openness
    summary: "Freely adaptable but not fully reproducible. Apache-2.0 weights, a documented recipe (Megatron-LM) and the released EuroFilter and EuroBlocks-Synthetic support fine-tuning and continued pre-training, but the full pre-training corpus is not published for from-scratch reproduction."
    refs: [ev-tech-report, ev-apache]
  knowledge_structure:
    level: moderate
    dimension: performance
    summary: "Broad multilingual knowledge across 35 languages in a standard decoder LLM with a short 4k context, so it is a capable multilingual RAG and grounding backbone only within that window."
    refs: [ev-tech-report, ev-hf-9b-instruct]
  specialization:
    level: moderate
    dimension: openness
    summary: "A strong multilingual base for specialisation via SFT/LoRA on Apache-2.0 weights, aided by the released synthetic post-training set. A full-recipe rebuild is out of reach because the pre-training data and end-to-end training code are not fully released."
    refs: [ev-tech-report, ev-blog]
  exchangeability:
    level: high
    dimension: operational
    summary: "Drop-in portable: standard safetensors on mainstream runtimes behind an OpenAI-compatible endpoint. The points to watch when swapping are the 4k context and EuroLLM's own chat template."
    refs: [ev-ops, ev-hf-9b-instruct]
  misuse_exposure:
    level: unbenchmarked
    dimension: safety
    summary: "Not independently benchmarked for misuse or exposure: the team documents instruction tuning but no broad third-party CBRN, cyber or prompt-injection red-team battery exists, and multilingual safety coverage is uneven."
    refs: [ev-hf-9b-instruct]

