changelog:
- date: '2026-07-25'
  change: Initial v2 four-domain library entry.
- date: '2026-07-25'
  change: Grounded evidence against primary sources (docs/primary-sources/eurollm) - Apache-2.0 licence (9B/1.7B/22B-Instruct-2512), the EuroLLM-9B technical report, and the 9B/1.7B/22B-Instruct-2512 model cards read verbatim; added doc_type + retrieved to all evidence and a docs item pinning the partial-openness nuance (SFT set released, ~4T pretraining corpus not); ownership factors and verdict grounded to clean Apache-2.0 + partial (not full) data openness.
- date: '2026-09-21'
  change: 'Freshness re-verification. EuroLLM-9B''s Apache-2.0 licence and gated access re-confirmed unchanged. Flag (not folded): a newer, larger EuroLLM-22B-2512 has shipped - a new sibling for a future build pass; its licence tag (expected Apache-2.0) needs confirming from its own raw repo file before scoring.'
- date: '2026-11-19'
  change: 'Freshness re-verification against primary sources, no score change. Re-read the licence statement (card front matter and card text; no standalone LICENSE file exists in any EuroLLM repo) and the Hub API for the 9B, 9B-Instruct, 1.7B and 1.7B-Instruct repos: Apache-2.0 is unchanged and uniform across the tracked line. Gating is not uniform and is now recorded: the 9B repos are gated auto (a Hugging Face contact-sharing click-through that adds no licence term), the 1.7B repos are ungated. The 4,096-token context is unchanged on the tracked models. Resolved the September manual-eyeball item: EuroLLM-22B-2512 carries apache-2.0 in its raw card front matter and card text, is not gated, has 32,768 context and 22.6B parameters; it is reported as a new entity, not folded in. Corrected the openness evidence (ev-openness): the July wording that the 22B-generation pretraining corpus was not published was incomplete, because arXiv 2602.05879 and the Hub (utter-project/EuroWeb-2512) release a web pretraining corpus plus pretraining and evaluation code; for the tracked 2024 9B and 1.7B line the corpus is still only described, so the openness, transparency and ownership ratings stand. Newer releases not covered here: EuroLLM-9B-2512 and Instruct-2512 (32k context, ungated), EuroLLM-22B-2512 and Instruct-2512, EuroMoE-2.6B-A0.6B, and the EuroLLM1.5-9B-Base (apache-2.0) and EuroLLM1.5-9B-SFT (preview, no licence declared) repos. No EuroLLM release newer than 2026-11-16 was found.'
