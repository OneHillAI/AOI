# OneHill v2 MODEL library entry for EuroLLM.
# Validated against schema/model.v2.schema.json.
#   scores    -> scripts/score.py --write        (AOI headline/grade)
#   meters    -> scripts/completeness.py --write  (per-domain completeness/originality)
#   prose     -> assess.md / implement.md / use.md / support.md (sections keyed <!-- item: KEY -->)

schema_version: "2.0"
id: eurollm
name: EuroLLM (EuroLLM-9B / EuroLLM-1.7B)
aliases:
- EuroLLM
- EuroLLM-9B
- EuroLLM-9B-Instruct
- EuroLLM-1.7B
- utter-project/EuroLLM
family:
  id: eurollm
  name: EuroLLM
publisher:
  name: EuroLLM consortium (Unbabel, Instituto Superior Técnico / Instituto de Telecomunicações,
    University of Edinburgh, and partners) - EU-funded
  country: EU
  accountable_entity: true
  url: https://eurollm.io/
  security_contact: https://huggingface.co/utter-project
summary: 'EuroLLM trades frontier scale for a genuinely European, Apache-2.0, all-EU-language
  model with the cleanest possible EU AI Act posture - an open-weight model designed in
  and for the EU, well under any systemic-risk threshold, whose natural home is multilingual
  EU-facing workloads rather than beating the largest labs on English reasoning. It is an
  EU-funded, open-weight multilingual language-model family (EuroLLM-9B and EuroLLM-1.7B,
  each in base and instruction-tuned form) built by a European academic-industrial consortium
  - Unbabel, Instituto Superior Técnico / Instituto de Telecomunicações, the University of
  Edinburgh and partners - on EuroHPC compute (MareNostrum5) under Horizon Europe. It is
  trained from scratch to cover all 24 official EU languages plus roughly 11 more (Arabic,
  Catalan, Chinese, Galician, Hindi, Japanese, Korean, Norwegian, Russian, Turkish, Ukrainian).

  '
variants:
- name: EuroLLM-9B (base)
  params_total: 9B
  context_window: 4k
  kind: base
  safety_tuned: false
- name: EuroLLM-9B-Instruct
  params_total: 9B
  context_window: 4k
  kind: instruct
  safety_tuned: true
- name: EuroLLM-1.7B (base)
  params_total: 1.7B
  context_window: 4k
  kind: base
  safety_tuned: false
- name: EuroLLM-1.7B-Instruct
  params_total: 1.7B
  context_window: 4k
  kind: instruct
  safety_tuned: true
openness:
  tier: open_weights_recipe
  components:
    weights: open
    training_data: partial
    training_code: partial
    evaluation: partial
    documentation: open
    license: open
  license:
    spdx: Apache-2.0
    name: Apache License 2.0
    classification: osi
    commercial_use: allowed
    notable_restrictions: []
    url: https://huggingface.co/utter-project/EuroLLM-9B-Instruct
provenance:
  canonical_source: https://huggingface.co/utter-project
  verified_org_on_primary_host: true
  formats:
  - safetensors
  integrity:
    checksums: true
    signed: false
    signing_tech: ''
    provenance_attestation: false
  mirrors_and_quants:
    acknowledged: true
    notable:
    - name: QuantFactory / bartowski (GGUF), stelterlab (MLX 4-bit), kaitchup (GPTQ)
      trust: community
      note: popular local-inference quants rather than the canonical utter-project weight source
    - name: NVIDIA NIM (utter-project/eurollm-9b-instruct)
      trust: vendor
      note: hosted API endpoint rather than the canonical weight source
  checkpoint_checklist_score: 5
  scanner_result: {}
  incidents: []
eu_ai_act:
  is_gpai: true
  systemic_risk:
    designated: false
    training_flops_estimate: well under 1e25 (9B params, ~4T training tokens ~= 2e23 FLOPs)
    over_1e25_threshold: false
    article_55_docs_available: n/a
  open_source_exemption:
    license_qualifies: 'yes'
    rationale: 'Released under OSI-approved Apache-2.0 with public parameters, architecture
      and usage information via the model cards and the EuroLLM-9B technical report, and
      not monetised - so it qualifies for the Article 53 open-source exemption from the
      Annex XI/XII technical-documentation duties. The surviving copyright policy and
      public training-content summary obligations are partly discharged by the technical
      report, which documents the data mixture (FineWeb-edu, HPLT, MADLAD-400, CulturaX,
      mC4, The Stack) and the EuroFilter filtering pipeline, though the full pre-training
      corpus is not published as a single downloadable artifact. Not a systemic-risk model,
      so the exemption is not voided.

      '
  provider_package:
    technical_documentation: 'yes'
    downstream_information: 'yes'
    copyright_policy: partial
    training_content_summary: partial
    code_of_practice_signatory: false
  deployer_notes: 'A fine-tuner placing a derivative on the EU market under its own name
    may become a provider for that derivative. EuroLLM is EU-domiciled, Apache-2.0 and
    well under the systemic-risk compute threshold, so the underlying posture is unusually
    clean; the detailed technical report lets a downstream provider assemble much of the
    technical documentation and a training-content summary from published artifacts,
    though not from a fully released corpus as with a fully-open model.

    '
  last_assessed: '2026-07-25'
performance: {}
behaviour: {}
safety: {}
deployment:
  ceiling_tier: T2
  ceiling_conditional: true
  hardware_notes: 'EuroLLM-9B runs on a single modern 24 GB GPU (full precision tight,
    comfortable with light quantization); EuroLLM-1.7B runs on modest GPUs and is viable
    on CPU/edge via GGUF. The short 4k context keeps KV-cache pressure low.

    '
  serving_support:
  - vllm
  - llama.cpp
  - ollama
  - tgi
  - hf-transformers
  controls_required:
  - Deploy the Instruct (safety-tuned) variant, not the base checkpoint
  - Add input/output guardrails and a companion classifier for customer-facing use
  - Add your own per-language safety evaluation before relying on any specific language
  - Pin the exact utter-project revision and verify checksums
score:
  rubric_version: '1.1'
  headline: 69.2
  grade: C
  hard_flags: []
  dimensions:
    openness:
      score: 4
      rationale: 'Genuinely open-weight-plus-recipe: Apache-2.0 base and Instruct weights,
        a detailed technical report (arXiv 2506.04079) documenting tokenizer, architecture,
        the data mixture and training procedure, plus the released EuroFilter classifier
        and the EuroBlocks-Synthetic post-training dataset. Short of the top fully-open
        tier only because the complete pre-training corpus and an end-to-end training
        repository are not released as downloadable artifacts (training built on the
        open Megatron-LM codebase), so training_data / training_code / evaluation are
        partial rather than open.

        '
      evidence_refs:
      - ev-tech-report
      - ev-blog
      - ev-apache
    provenance:
      score: 3
      rationale: 'Distributed from the verified utter-project org on Hugging Face in
        safetensors with per-file checksums (checklist ~5/8); the technical report makes
        the pipeline well-documented and the data sources are named. Meets the score-3
        anchor (verified org + safetensors + checksums); short of 4, which needs a scanned
        checkpoint or a documented mirror/quantization policy (~6-7 boxes), and of 5''s
        cryptographic weight signing / SLSA attestation.

        '
      evidence_refs:
      - ev-hf-9b-instruct
      - ev-tech-report
    legal:
      score: 4
      rationale: 'OSI-approved Apache-2.0 with unconditional commercial use and no
        field-of-use limits, across base and Instruct weights; EU-domiciled and well
        under the systemic-risk compute threshold, giving a clean Article 53
        open-source-exemption posture. Short of 5 because - unlike a fully-open model
        that publishes its corpus - the training-content-summary obligation can only be
        partly satisfied from the technical report rather than reconstructed from a released
        dataset.

        '
      evidence_refs:
      - ev-apache
      - ev-ec-osor
    safety:
      score: 3
      rationale: 'The Instruct variants are instruction-tuned on EuroBlocks and behave
        as ordinary safety-tuned assistants, but published safety/alignment coverage is
        light, there is no companion guard model, and multilingual coverage means safety
        behaviour varies by language and is not uniformly evaluated. Base checkpoints are
        untuned research artifacts.

        '
      evidence_refs:
      - ev-hf-9b-instruct
      - ev-tech-report
    performance:
      score: 3
      rationale: 'Best-in-class for its niche: independent and publisher benchmarks put
        EuroLLM-9B on par with Gemma-2-9B on multilingual EU-language tasks, ahead on
        WMT24++ translation, and matching Mistral-7B on English. But it is a 9B model -
        its raw single-language reasoning ceiling is well below frontier; the value is
        breadth of EU-language coverage rather than category-topping capability.

        '
      evidence_refs:
      - ev-moonlight
      - ev-index-bench
    operational:
      score: 4
      rationale: 'Standard safetensors with a conventional architecture load on all
        mainstream stacks (vLLM, llama.cpp, Ollama, TGI, transformers); community GGUF /
        MLX / GPTQ quants and a hosted NVIDIA NIM endpoint exist. Short of 5 mainly on
        the short 4k context window and the breadth of official day-0 tooling versus the
        largest ecosystems.

        '
      evidence_refs:
      - ev-ops
      - ev-hf-9b-instruct
    governance:
      score: 3
      rationale: 'An EU-funded consortium with named academic and industrial partners,
        detailed technical reports and a clear release cadence (1.7B -> 9B -> 22B). Held
        to 3 because accountability is distributed across many consortium partners rather
        than a single accountable vendor, and there is no formally published
        vulnerability-disclosure or deprecation/EoL policy.

        '
      evidence_refs:
      - ev-eurollm-site
      - ev-ec-osor

# --- Assessed signals: five cross-cutting attributes highlighted at the top of the entry.
signals:
  trainability:
    level: partial
    dimension: openness
    summary: "Freely adaptable but not fully reproducible: Apache-2.0 weights, a documented recipe (Megatron-LM), released EuroFilter and EuroBlocks-Synthetic support fine-tuning and continued pre-training, but the full pre-training corpus is not published for from-scratch reproduction."
    refs: [ev-tech-report, ev-apache]
  knowledge_structure:
    level: moderate
    dimension: performance
    summary: "Broad multilingual knowledge across 35 languages but a standard decoder LLM with a short 4k context, so it is a capable multilingual RAG/grounding backbone only within that limited window."
    refs: [ev-tech-report, ev-hf-9b-instruct]
  specialization:
    level: moderate
    dimension: openness
    summary: "A strong multilingual base for specialisation via SFT/LoRA on Apache-2.0 weights, aided by the released synthetic post-training set - short of full-recipe rebuild since the pre-training data and end-to-end training code are not fully released."
    refs: [ev-tech-report, ev-blog]
  exchangeability:
    level: high
    dimension: operational
    summary: "Drop-in portable: standard safetensors on mainstream runtimes behind an OpenAI-compatible endpoint; the gotchas when swapping are the 4k context and EuroLLM's own chat template."
    refs: [ev-ops, ev-hf-9b-instruct]
  misuse_exposure:
    level: unbenchmarked
    dimension: safety
    summary: "Not independently benchmarked for misuse/exposure: the team documents instruction tuning but no broad third-party CBRN/cyber/prompt-injection red-team battery exists, and multilingual safety coverage is uneven."
    refs: [ev-hf-9b-instruct]

