ownership:
  level: substantial
  factors:
    use_modify:
      level: strong
      rationale: "OSI-approved Apache-2.0 across base and Instruct weights with unconditional commercial use and no field-of-use limits - run, fine-tune, redistribute and commercialise it freely."
      # grounded in: ev-apache (license, retrieved), ev-hf-9b-instruct (model_card, retrieved) - clean Apache-2.0 grant across 9B/1.7B/22B-Instruct-2512, unconditional commercial use, no field-of-use limits
    transparency:
      level: moderate
      rationale: "Open-weights-plus-recipe, but only partial data openness: the technical report documents the tokenizer, architecture, data mixture and training procedure, and the released SFT dataset (EuroBlocks-SFT-2512) plus the EuroFilter artifact make the recipe inspectable - yet the ~4T-token pre-training corpus is described rather than published as one dataset, so this is stronger than weights-only but weaker than a fully-open model (cf. OLMo) and not reproducible from a released corpus."
      # grounded in: ev-openness (docs, retrieved) - 22B-Instruct-2512 card: EuroBlocks-SFT-2512 released, ~4T pretraining corpus described but not published as one dataset; ev-tech-report (technical_report, retrieved) - recipe documented
    reliability:
      level: moderate
      rationale: "Runs dependably, but per-language safety coverage is thin and uneven, so you supply the safety layer."
      # grounded in: ev-moonlight (third_party) - Gemma-2-9B parity / WMT24++ lead / Mistral-7B on English; ev-hf-9b-instruct (model_card, retrieved) - 4k context, not preference-aligned
    data_control:
      level: strong
      rationale: "Self-hosted and EU-domiciled, the Apache weights run on your own infrastructure and nothing leaves - your data and derived knowledge stay yours."
      # grounded in: ev-apache (license, retrieved) - Apache-2.0 grant carries no telemetry/clawback; self-hosting (structural) and EU-domiciled consortium publisher
  verdict: "You fully own the use of these Apache-2.0 weights - clean across 9B, 1.7B and 22B-Instruct-2512, with unconditional commercial use and no field-of-use limits - and, self-hosted and EU-domiciled, you keep your data entirely. It stays short of full because data openness is partial rather than full: the SFT set (EuroBlocks-SFT-2512) is released but the ~4T-token pre-training corpus is only described, so you can inspect the recipe but not reproduce it from a released corpus as with a fully-open model; the 9B size, 4k context and uneven multilingual safety also cap reliability. Adopt it for multilingual EU-facing work that fits inside 4k, behind your own guardrails; look elsewhere for a long-context or frontier engine."

# --- Evidence. Each item carries `doc_type` (which kind of primary document) and `retrieved`
#     (true = the document's substantive text was read; false = known to exist but not read).
#     Grounded 2026-07-25 against the primary-source clauses in
#     docs/primary-sources/eurollm/_sources.md - the Apache-2.0 licence (9B/1.7B/22B-Instruct-2512),
#     the EuroLLM-9B technical report (arXiv 2506.04079), the 9B and 1.7B model cards, and the
#     22B-Instruct-2512 card that pins the openness nuance (SFT set released, pretraining corpus not).
evidence:
- id: ev-eurollm-site
  claim: EuroLLM is presented as an open-source European multilingual LLM suite covering
    all 24 official EU languages plus additional strategic languages, developed by an
    EU-funded consortium.
  source_type: publisher
  doc_type: marketing
  retrieved: false
  url: https://eurollm.io/
  date: '2026-07-25'
- id: ev-hf-9b-instruct
  claim: 'EuroLLM-9B-Instruct model card, read verbatim: hosted on the verified utter-project
    org on Hugging Face in safetensors under Apache-2.0, trained on 4T tokens, instruction-tuned
    on EuroBlocks, a 4k context and a documented chat template (BOS id 1 / EOS id 4); noted
    as not preference-aligned (may hallucinate or produce harmful content); comparable to
    Gemma-2-9B on EU languages and Mistral-7B on English.'
  source_type: publisher
  doc_type: model_card
  retrieved: true
  url: https://huggingface.co/utter-project/EuroLLM-9B-Instruct
  date: '2026-07-25'
- id: ev-1.7b-card
  claim: 'EuroLLM-1.7B-Instruct model card, read verbatim: 1.7B parameters, a 4,096-token
    context, coverage of 35 languages, Apache-2.0, and comparable to Gemma-7B on machine-translation
    benchmarks.'
  source_type: publisher
  doc_type: model_card
  retrieved: true
  url: https://huggingface.co/utter-project/EuroLLM-1.7B-Instruct
  date: '2026-07-25'
- id: ev-tech-report
  claim: 'EuroLLM-9B: Technical Report (arXiv 2506.04079), read verbatim: EuroLLM is trained
    from scratch to cover all 24 official EU languages plus 11 more, and documents the
    tokenizer, architecture, ~4T-token data mixture, EuroFilter pipeline, EuroBlocks-Synthetic
    post-training set and Megatron-LM training; the report frames its "Open release" as the
    "Public availability of models, filters, and datasets."'
  source_type: publisher
  doc_type: technical_report
  retrieved: true
  url: https://arxiv.org/abs/2506.04079
  date: '2026-07-25'
- id: ev-openness
