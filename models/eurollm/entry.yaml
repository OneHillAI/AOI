ownership:
  level: substantial
  factors:
    use_modify:
      level: strong
      rationale: "OSI-approved Apache-2.0 across base and Instruct weights, with unconditional commercial use and no field-of-use limits. The weights can be run, fine-tuned, redistributed and commercialised freely."
      # grounded in: ev-apache (license, retrieved), ev-hf-9b-instruct (model_card, retrieved) - clean Apache-2.0 grant across 9B/1.7B/22B-Instruct-2512, unconditional commercial use, no field-of-use limits
    transparency:
      level: moderate
      rationale: "Open-weights-plus-recipe with only partial data openness. The technical report documents the tokenizer, architecture, data mixture and training procedure, and the released SFT dataset (EuroBlocks-SFT-2512) and the EuroFilter artifact make the recipe inspectable. For the tracked 9B and 1.7B line the ~4T-token pre-training corpus is described, not published as one dataset. Transparency is stronger than for weights-only releases and weaker than for a fully-open model (cf. OLMo), and the model cannot be reproduced from a released corpus. The later 2512 generation released a web pre-training corpus and its training and evaluation code; it is a separate entity and is not scored here."
      # grounded in: ev-tech-report (technical_report, retrieved) - 9B and 1.7B recipe documented, EuroFilter and EuroBlocks-Synthetic released, corpus described not published; ev-openness (docs, retrieved) - corrected 2026-11-19, see changelog
    reliability:
      level: moderate
      rationale: "Runs dependably, but per-language safety coverage is thin and uneven, so you supply the safety layer."
      # grounded in: ev-moonlight (third_party) - Gemma-2-9B parity / WMT24++ lead / Mistral-7B on English; ev-hf-9b-instruct (model_card, retrieved) - 4k context, not preference-aligned
    data_control:
      level: strong
      rationale: "Self-hosted and EU-domiciled, the Apache weights run on your own infrastructure and nothing leaves, so your data and derived knowledge stay yours."
      # grounded in: ev-apache (license, retrieved) - Apache-2.0 grant carries no telemetry/clawback; self-hosting (structural) and EU-domiciled consortium publisher
  verdict: "You fully own the use of these Apache-2.0 weights, across 9B, 1.7B and 22B-Instruct-2512, with unconditional commercial use and no field-of-use limits. Self-hosted and EU-domiciled, you keep your data entirely. Ownership stays short of full because data openness is partial. The SFT set (EuroBlocks-SFT-2512) is released but the ~4T-token pre-training corpus is only described, so the recipe can be inspected but not reproduced from a released corpus as with a fully-open model. The 9B size, 4k context and uneven multilingual safety also cap reliability. Adopt it for multilingual EU-facing work that fits inside 4k, behind your own guardrails; look elsewhere for a long-context or frontier engine."

# --- Evidence. Each item carries `doc_type` (which kind of primary document) and `retrieved`
#     (true = the document's substantive text was read; false = known to exist but not read).
#     Grounded 2026-07-25 against the primary-source clauses in
#     docs/primary-sources/eurollm/_sources.md - the Apache-2.0 licence (9B/1.7B/22B-Instruct-2512),
#     the EuroLLM-9B technical report (arXiv 2506.04079), the 9B and 1.7B model cards, and the
#     22B-Instruct-2512 card that pins the openness nuance (SFT set released, pretraining corpus not).
evidence:
- id: ev-eurollm-site
  claim: "The project site eurollm.io presents EuroLLM as a fully open source European multilingual LLM suite. It lists a 22B flagship (32K context, Instruct and Base), the 9B (Base, plus Instruct as a demonstration) and the 1.7B for edge devices, with EuroVLM and EuroMoE listed as \"Soon\". It names no licence, gives no release dates and shows no news after September 2026. The page is marketing only; the binding licence is the Hugging Face card."
  source_type: publisher
  doc_type: marketing
  retrieved: true
  url: https://eurollm.io/
  date: '2026-11-19'
- id: ev-hf-9b-instruct
  claim: "The EuroLLM-9B-Instruct model card on the verified utter-project org on Hugging Face shows safetensors under Apache-2.0, 4T training tokens, instruction tuning on EuroBlocks, a 4k context (Sequence Length 4,096) and a documented chat template (BOS id 1 / EOS id 4). The card notes the model is not preference-aligned (it may hallucinate or produce harmful content) and comparable to Gemma-2-9B on EU languages and Mistral-7B on English. The repo is gated \"auto\": the page says \"You need to agree to share your Hugging Face information to access this model\", and username and email are shared. No standalone LICENSE file exists in the repo."
  source_type: publisher
  doc_type: model_card
  retrieved: true
  url: https://huggingface.co/utter-project/EuroLLM-9B-Instruct
  date: '2026-11-19'
- id: ev-1.7b-card
  claim: "The EuroLLM-1.7B-Instruct model card states 1.7B parameters, a 4,096-token context, coverage of 35 languages and Apache-2.0, and is comparable to Gemma-7B on machine-translation benchmarks. The repo is not gated."
  source_type: publisher
  doc_type: model_card
  retrieved: true
  url: https://huggingface.co/utter-project/EuroLLM-1.7B-Instruct
  date: '2026-11-19'
- id: ev-tech-report
  claim: "EuroLLM-9B: Technical Report (arXiv 2506.04079) says EuroLLM is trained from scratch to cover all 24 official EU languages plus 11 more. It documents the tokenizer, architecture, ~4T-token data mixture, EuroFilter pipeline, EuroBlocks-Synthetic post-training set and Megatron-LM training. The report frames its \"Open release\" as the \"Public availability of models, filters, and datasets.\""
  source_type: publisher
  doc_type: technical_report
  retrieved: true
  url: https://arxiv.org/abs/2506.04079
  date: '2026-07-25'
- id: ev-openness
