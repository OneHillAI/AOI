schema_version: '2.0'
id: berget
name: Berget AI
profile: inference
hq_country: Sweden
summary: 'A Stockholm-based, Swedish-owned EU-sovereign inference provider serving
  open-weight models (Llama, Mistral-Small, Gemma, gpt-oss, GLM, plus embedding/reranking
  models) over an OpenAI-compatible API. Its standout facts are jurisdictional and are
  confirmed against binding documents: the Terms of Service state Berget never stores
  prompt input or model output content (zero data retention), the customer retains all
  title and IP in its data under a licence scoped only to providing the Service, and a
  30-day post-termination export window precedes irreversible deletion; the Privacy and
  Security pages place all processing on EU/Sweden-only servers, and Swedish ownership
  puts Berget outside the US CLOUD Act. The GDPR DPA has now been read (2026-08-06) and
  names an entirely-EEA sub-processor list, and the Terms carry a mutual confidentiality
  clause (Sec 18). The main caveat is verification depth: there is no independent
  attestation of the data-handling guarantees (no SOC 2 / ISO 27001), the never-train
  commitment rests on the service-scoped licence plus the DPA purpose-limitation rather than
  an express anti-training clause, and the Terms reserve a right to aggregated, anonymised,
  non-identifying usage data. This is a strong, document-grounded governance posture that
  stops short of audited assurance.

  '
models_served:
- Llama 3.1-8B / Llama 3.3-70B
- Mistral-Small-3.2-24B
- Gemma
- gpt-oss-120B
- GLM-4.7
- embedding & reranking models
hardware: NVIDIA GPU (EU/Sweden datacenters)
pricing:
  model: per-token
  notes: 'Pay-as-you-go per-token pricing plus prepaid token packs. Zero data retention
    is the default on pay-as-you-go. Per-model rates are not published here; confirm
    live on the provider pricing page.

    '
  example_rates:
  - 'Pay-as-you-go per-token; prepaid token packs also offered (see provider pricing page)'
data_governance:
  default_retention: 'none by default - the Terms state Berget never stores prompt input
    content or model output content (zero data retention on pay-as-you-go)'
  trains_on_inputs: never
  zdr_available: yes_default
  zdr_scope_caveats: 'ZDR is the default on pay-as-you-go, with no action required, and
    is stated in the Terms of Service (never store prompt input or model output content).
    Distinct from inference retention: on account termination, Customer Data is retained
    for 30 days to allow export/recovery and then irreversibly deleted. The Terms also
    reserve a right to process aggregated, anonymised data that does not identify the
    customer or any natural person. No independent attestation corroborates the data-handling
    guarantees; the DPA (read 2026-08-06) does disclose an entirely-EEA sub-processor list.

    '
  customer_data_ownership: customer_retains
  outputs_used_to_improve_service: "no"
  third_party_routing_leakage: 'Serves open-weight models only; no closed third-party
    model routing, so no other vendor''s data terms attach to routed inference.

    '
  subprocessors_disclosed: true
  confidentiality: explicit
  confidentiality_caveats: 'Terms Sec 18 is a mutual confidentiality clause covering each
    party''s non-public information, expressly "including in particular Customer Data", with a
    keep-confidential and purpose-limitation duty and standard carve-outs. Weaknesses versus a
    dedicated NDA: no express post-termination survival term, and the Sec 19.1 aggregated,
    anonymised usage-data reservation sits outside the confidentiality perimeter.'
compliance:
  soc2: unknown
  iso_27001: unknown
  iso_27701: unknown
  hipaa_baa: unknown
  gdpr_dpa: "yes"
  fedramp: ''
  trust_center_url: https://berget.ai/en/security
residency:
  eu_region_available: "yes"
  regions:
  - Sweden
  - European Union
  sovereign_option: 'EU-sovereign by design: Swedish-owned, infrastructure entirely
    in Sweden/EU per the Privacy and Security pages, no US data transfers.'
  region_pinning: "yes"
  cloud_act_exposure: false
  provider_can_restrict_access: 'Low switch-off risk: Swedish/EU jurisdiction with
    no US reach, so no CLOUD Act / US export-control exposure. Standard commercial
    termination applies, with a 30-day post-termination export window per the Terms.'
reliability:
  sla: ''
  uptime_notes: No public uptime SLA or status page surfaced; independent press reports
    production customers (Riksbanken, 300+ pilot/commercial customers) but availability
    is not independently observable.
  incidents: []
lock_in:
  openai_compatible_api: true
  portability_notes: 'OpenAI-compatible API (api.berget.ai/v1) serving portable open-weight
    models and working with LangChain/LlamaIndex; migrate by switching the base URL
    and API key. Low switching cost since the same open checkpoints run on other providers
    or self-hosted.

    '
dedicated_availability: coming_soon
dedicated_notes: 'The advertised "Dedicated Inference" product ("run your own fine-tuned models
  on dedicated capacity") is marked Coming Soon, with no contract language, docs or pricing. The
  only shipped dedicated pool is Berget Code, which is dedicated to that product, not reserved
  per customer. Treat per-customer single-tenancy and first-party fine-tuning as not yet generally
  available (as of 2026-08).'
trust_considerations:
- ZDR-by-default, no-training, customer-retained ownership and a 30-day export window
  are confirmed in Berget''s binding Terms of Service, a real upgrade from a
  marketing-only basis, but no SOC 2 / ISO 27001 attestation and no independent audit
  of the data-handling guarantees exists.
- Swedish ownership and EU-only infrastructure mean no US CLOUD Act exposure - a genuine
  sovereignty advantage over US-headquartered providers, independently reported by EU
  tech press.
- The GDPR DPA (read 2026-08-06) names an entirely-EEA sub-processor list - 6G AI Sweden,
  Acebit, Toriv, Obenet (Swedish) and Stripe Payments Europe (Ireland) - with all data
  centres in the EEA (Sec 10.1); still no SOC 2 / ISO 27001 attestation, so contractualise
  the data terms and request current attestation status for regulated procurement.
- Terms Sec 18 is a mutual confidentiality clause covering each party's non-public
  information (customer data included) - a real contractual protection beyond the
  retention and ownership terms.
- The never-train commitment rests on the service-scoped licence plus the DPA
  purpose-limitation ("not... for any other purposes other than providing the Service"),
  not an express anti-training sentence - a slightly weaker evidence tier than an explicit clause.
- A dedicated / reserved-capacity ("Dedicated Inference") product is signalled but not yet
  shipped - the Terms describe only serverless per-token inference, with no dedicated pricing
  or terms.
- The Terms reserve a right to process aggregated, anonymised, non-identifying usage
  data - standard, but note it alongside the zero-retention-of-content guarantee.
- No public uptime SLA or status history is published.
