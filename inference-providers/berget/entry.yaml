# OneHill v2 INFERENCE-PROVIDER library entry for Berget AI.
# Validated against schema/inference-provider.v2.schema.json.
#   scores  -> scripts/score.py --write        (provider AOI)
#   meters  -> scripts/completeness.py --write  (per-domain completeness/originality)
#   prose   -> assess.md / implement.md / use.md / support.md (sections keyed <!-- item: KEY -->)

schema_version: '2.0'

id: berget

name: Berget AI

profile: inference

hq_country: Sweden

summary: >-
  A Stockholm-based, Swedish-owned inference provider serving open-weight models (Gemma 4,
  Mistral-Small 3.2, GLM-5.3-Flash, Kimi K3.1 Pro, Swedish-tuned Whisper, multilingual E5
  embeddings and a BGE reranker) over an OpenAI-compatible API. Its strongest facts are in the
  binding documents, which take precedence over the marketing: the DPA (updated 2026-10-22,
  first in the order of precedence) states a true Zero Data Retention policy for serverless
  inference with prompts, files and outputs not written to persisted disk even during
  inference, and an express sentence that Berget does not train any models on inference input
  or output; the Terms keep customer ownership of Customer Data, a mutual confidentiality
  clause naming Customer Data (Sec 18) and a 30-day post-termination export window. Residency
  is narrower than the marketing: the binding text promises that all data centres are in the
  EEA and that nothing leaves the EEA without written instruction (DPA Sec 10), not Sweden-only
  processing, and the customer can choose a data centre only for compute and storage, not for
  serverless inference. A new SLA gives serverless inference a best-effort level with no
  compensation, and a 99.5% commitment with credits only for sales-contracted Dedicated
  Inference. The main caveat is verification depth: no SOC 2 or ISO 27001 attestation exists
  (the Terms say ISO 27001 is being worked toward), and the status page could not be read.

models_served:
- Gemma 4 31B
- Mistral-Small-3.2-24B
- GLM-5.3-Flash
- Kimi K3.1 Pro
- Whisper speech-to-text (kb-whisper, nb-whisper, faster-whisper, pianissimo)
- multilingual-e5 embeddings
- bge-reranker-v2-m3
- Preview models (Qwen3.5-2B, laya, clef-flash)

hardware: 'GPU bare metal in EEA data centres (sub-processor AI Iron AB, DPA Appendix 1); the only GPU model named on a Berget page is AMD MI300X (Dedicated Inference page); NVIDIA is not confirmed'

pricing:
  model: mixed
  notes: >-
    Per-token serverless pricing is published per model through the API listing (EUR per
    million tokens, for example Mistral-Small-3.2 0.30 in and 0.30 out, Gemma 4 31B 0.25 and
    0.50, Kimi K3.1 Pro 3.00 and 10.00 with cached input 0.90), but API access needs an active
    plan: the pricing FAQ says "we don't offer pure pay-as-you-go without a plan". Plans are
    Trial (EUR 5 free credits), Starter EUR 25, Team EUR 50 and Enterprise EUR 500 per month,
    each a prepaid top-up. Credits are non-refundable and expire after 12 months. Berget Code is
    per seat (EUR 150 to 500 per month). Dedicated Inference is quoted, with small models from
    about EUR 2,500 per GPU per month. Numeric rate limits are not published.
  example_rates:
  - 'Mistral-Small-3.2-24B: EUR 0.30 / 0.30 per M tokens (in / out)'
  - 'Gemma 4 31B and GLM-5.3-Flash: EUR 0.25 / 0.50 (GLM) per M tokens'
  - 'Kimi K3.1 Pro: EUR 3.00 / 10.00 per M tokens, cached input 0.90'
  - 'Whisper models: EUR 0.000033 per second'
  - 'Plans: Trial EUR 0 (EUR 5 credit), Starter EUR 25, Team EUR 50, Enterprise EUR 500 per month'

data_governance:
  default_retention: >-
    none by default for serverless inference. DPA Appendix 2: "Berget AI applies a true Zero
    Data Retention policy on its serverless inference services, including Berget Code" and does
    not store prompts, uploaded files or outputs "after completed inference calls, and none of it
    is stored on persisted disks even during inference processing". ToS Sec 7 says the same for
    prompt and output content. Metadata is kept: service admin logs, API request metadata and
    token counts with API key and subscription ID for billing.
  trains_on_inputs: never
  zdr_available: yes_default
  zdr_scope_caveats: >-
    ZDR is the default for serverless inference (including Berget Code), with no action
    required, and is stated in both the DPA (Appendix 2) and the ToS (Sec 7). It is a contractual
    statement with no independent audit or attestation behind it. Distinct from inference
    retention: on account termination Customer Data is kept 30 days for export or recovery and
    then irreversibly deleted (ToS Sec 12; DPA Sec 13.2). The ToS also reserves a right to
    aggregated, anonymised data that identifies neither the customer nor any natural person
    (Sec 19.1). The DPA purpose clause (Sec 3.1(c)) lists "improving the contracted
    infrastructure services" but Appendix 2 limits what is collected to logs, request metadata
    and token counts. The Trial plan and Preview models are outside the SLA, but no document
    read gives them different data terms.
  customer_data_ownership: customer_retains
  outputs_used_to_improve_service: "no"
  third_party_routing_leakage: >-
    Serves open-weight models only; no closed third-party model routing, so no other vendor's
    data terms attach to routed inference. DPA Appendix 2 adds that Berget does not "share the
    data with any model providers for model training".
  subprocessors_disclosed: true
  confidentiality: explicit
  confidentiality_caveats: >-
    ToS Sec 18 is a mutual confidentiality clause covering each party's non-public information,
    "including in particular Customer Data", with a keep-confidential and purpose-limitation duty
    (Sec 18.2), standard carve-outs (Sec 18.3), and on termination a duty to cease use and destroy
    (Sec 18.5, with carve-outs for legally required copies and routine backups). It has no express
    survival period. The Sec 19.1 aggregated, anonymised usage-data reservation sits outside the
    confidentiality perimeter.

compliance:
  soc2: unknown
  iso_27001: unknown
  iso_27701: unknown
  hipaa_baa: unknown
  gdpr_dpa: "yes"
  fedramp: ''
  trust_center_url: https://berget.ai/en/security

residency:
  eu_region_available: "yes"
  regions:
  - 'European Economic Area (binding, DPA Sec 10.1, all Berget data centres)'
  - 'Sweden (marketing, Dedicated Inference page and Berget Code post; not stated in the DPA or Terms)'
  sovereign_option: >-
    Swedish-owned with EEA-only data centres. The binding position is DPA Sec 10.1 ("All Berget
    AI data centres are within the European Economic Area") and Sec 10.2 (no transfer outside
    the EEA without the customer's written instruction, then only under a Chapter V transfer
    mechanism such as the EU SCCs). Sweden-only processing, "Your data never crosses borders" and
    "no US entity involvement" are marketing statements; no clause read promises them. The
    payment sub-processor Stripe Payments Europe, Limited is in Ireland and is used only for card
    payments.
  region_pinning: "no"
  cloud_act_exposure: false
  provider_can_restrict_access: >-
    Low switch-off risk: Swedish and EU jurisdiction with no US parent. Standard commercial
    terms apply: either party can end the Agreement for convenience (customer on 5 days' notice,
    Berget on 30 days'), and Berget may suspend or remove content under the Illegal Content
    clause (ToS Sec 14). Customer Data is retained 30 days after termination for export.

reliability:
  sla: >-
    SLA page dated 2026-10-23, part of the Agreement. Serverless Inference (including Berget
    Code): best effort, "no compensation is payable for interruptions". Dedicated Inference with
    an HA setup: 99.5% monthly uptime with credits of 10% (below 99.5%) or 25% (below 99.0%) of
    the impacted service fees, claimed within 30 days. Single-instance dedicated: best effort
    with a 99.5% SLO. The SLA excludes Trial plan and Preview models.
  uptime_notes: >-
    The SLA names https://status.berget.ai as the place incidents are published, but that page is
    a JavaScript shell that this session could not read, so no incident history or uptime figure
    was verified. The tech.eu article cited for production use says the first service launched
    before summer 2025 with strong customer interest; it does not name customers.
  incidents: []

lock_in:
  openai_compatible_api: true
  portability_notes: 'OpenAI-compatible API (api.berget.ai/v1) serving portable open-weight
    models and working with LangChain/LlamaIndex; migrate by switching the base URL
    and API key. Low switching cost since the same open checkpoints run on other providers
    or self-hosted.

    '

dedicated_availability: available

dedicated_notes: >-
  Dedicated Inference is now offered, sales-led ("Talk to us"): reserved GPUs in Swedish data
  centres running a chosen or customer-supplied model, with a published SLA (99.5% monthly uptime
  for an HA setup, SLA Sec 4) and an indicative price of about EUR 2,500 per GPU per month for
  smaller models. The 2026-08 entry recorded it as Coming Soon; that is out of date. There are no
  self-serve provisioning terms or price list, so it counts as available, not self-serve. The
  Kubernetes Cluster product (managed cluster on Berget hardware) is also priced on the pricing
  page.

trust_considerations:
- 'The DPA (updated 2026-10-22, first in precedence under ToS Sec 3.2) now contains an express
  no-training sentence for serverless inference and states that prompts, files and outputs are
  not stored on persisted disks even during inference. This resolves the earlier caveat that the
  never-train commitment rested only on the service-scoped licence. It remains a contractual
  statement: no SOC 2 or ISO 27001 attestation and no independent audit corroborates it.'
- 'Residency in the binding text is EEA-wide, not Sweden-only. DPA Sec 10.1 lets the customer
  choose a data centre for compute and storage but expressly excludes serverless inference, so a
  serverless customer cannot pin a data centre. The Sweden-only and "never crosses borders" claims
  are on the landing page, the docs and the Berget Code post, not in any clause read. Swedish
  ownership keeps Berget outside US CLOUD Act reach, but that is a jurisdiction argument from
  ownership, not a contractual guarantee.'
- 'The Privacy page is a website privacy policy dated 2025-03-10. It does not state EU-only
  inference servers or zero retention; those statements are in the DPA and Terms.'
- 'Sub-processors are named in DPA Appendix 1: AI Iron AB (GPU bare metal), Acebit AB (network
  and operations), Obenet AB (colocation) and Stripe Payments Europe, Limited (payments), with 30
  days advance notice and an objection and termination right (Sec 9.3). Toriv AB, listed on
  2026-09-21, is no longer named.'
- 'Terms Sec 18 is a mutual confidentiality clause naming Customer Data, with a cease-use and
  destroy duty on termination (Sec 18.5). Sec 19.1 still reserves aggregated, anonymised
  usage data.'
- 'There is no SOC 2, ISO 27001 or ISO 27701 attestation. ToS Sec 6.7 says Berget "is actively
  working toward ISO 27001 certification". The Security page is a responsible-disclosure page
  (PGP key, Signal, safe harbour), not a trust centre.'
- 'Reliability: serverless inference is best effort with no compensation under the new SLA; the
  99.5% commitment with credits applies only to sales-contracted Dedicated Inference with an HA
  setup. The status page could not be read.'
- 'Pricing is not pure pay-as-you-go: API access needs an active plan (from EUR 25 per month in
  prepaid credits), credits are non-refundable and expire after 12 months. Per-model rates are
  published through the API listing.'
- 'Catalogue churn is real: Llama 3.1 8B, Llama 3.3 70B, gpt-oss-120B and GLM-4.7 have all been
  retired since June 2026, with 2 to 3 weeks notice for Active models and none for Preview models.
  Pin to checkpoints you can also run elsewhere.'

score:
  rubric_version: '1.2'
  headline: 67.2
  grade: C
  hard_flags: []
  dimensions:
    data_governance:
      score: 4
      rationale: >-
        Zero data retention for serverless inference (DPA Appendix 2: no storage after completed
        calls and no persisted disk even during inference; ToS Sec 7), an express no-training
        sentence in the DPA (Appendix 2), customer-retained title and IP under a service-scoped
        licence (ToS Sec 17.1), a 30-day export window, a mutual confidentiality clause naming
        Customer Data (ToS Sec 18), named sub-processors with notice and objection rights (DPA
        Sec 9) and open-weight-only routing. This meets every written element of the anchor 5.
        Held at 4 because the shared evidence rules require a 5 to rest on onehill_verified or
        third_party support, and the zero-retention guarantee has no independent attestation or
        audit behind it (it is a publisher statement in a binding contract, not verified), and the
        Sec 19.1 aggregated usage-data right remains. Moves to 5 when an independent attestation
        of the retention controls exists.
      evidence_refs:
      - ev-terms
      - ev-dpa
      - ev-code
    compliance:
      score: 2
      rationale: >-
        A GDPR DPA is published and read (Art. 28(3) controller-processor terms, named
        sub-processors, 24-hour breach notice, audit right, EEA-only transfer clause), and the
        Terms say ISO 27001 is being worked toward (Sec 6.7). No SOC 2, ISO 27001, ISO 27701 or
        HIPAA attestation exists on any page read, and the Security page is a disclosure policy.
        Meets the score-2 anchor (a DPA plus one certification in progress, no completed
        independent audit) and falls short of the score-3 bar.
      evidence_refs:
      - ev-dpa
      - ev-terms
      - ev-security
    residency:
      score: 4
      rationale: >-
        The binding position is an EEA boundary: all Berget data centres are in the EEA and no
        transfer leaves the EEA without the customer's written instruction (DPA Sec 10.1, 10.2),
        and Swedish ownership puts Berget outside US CLOUD Act reach. Lowered from 5 because the
        2026-10-22 DPA states that customer data-centre choice covers compute and storage "not
        including serverless inference", so the main workload has no region pinning, and because
        the Sweden-only and "never crosses borders" statements are marketing (landing page, docs,
        Berget Code post) rather than clauses. Anchor 4 fits: an EU boundary with pinning for
        some services, short of guarantees across all services.
      evidence_refs:
      - ev-dpa
      - ev-landing
      - ev-techeu
    security:
      score: 3
      rationale: >-
        ToS Sec 6.7 states encryption in transit, network isolation, access controls and system
        monitoring, and DPA Sec 8 lists access controls, pseudonymisation and encryption,
        resilience, restore capability and regular testing of measures; the Security page itself
        is a responsible-disclosure policy (PGP key, Signal, safe harbour, 48-hour response). No
        independent pen-test report or ISO 27001 or SOC 2 attestation exists. Held to 3 on
        stated measures without independent testing.
      evidence_refs:
      - ev-terms
      - ev-dpa
      - ev-security
    reliability:
      score: 2
      rationale: >-
        A published SLA now exists (2026-10-23) but gives serverless inference best effort with no
        compensation; the 99.5% commitment with credits covers only sales-contracted Dedicated
        Inference with an HA setup. The SLA points to status.berget.ai, which is a JavaScript
        shell this session could not read, so no uptime history or incident record is verified.
        The tech.eu article supports production use since 2025 but names no customers. Meets
        the score-2 anchor; a readable status page with history would reach 3, which is not scored
        on an unread page.
      evidence_refs:
      - ev-sla
      - ev-techeu
    transparency_lockin:
      score: 5
      rationale: >-
        OpenAI-compatible API over open-weight models with published licences and a published
        lifecycle policy (docs.berget.ai: 2 to 3 weeks notice for Active models, named successor,
        retired-model list), independently listed by the Mastra model directory as an
        OpenAI-compatible /chat/completions provider at api.berget.ai/v1. The same checkpoints run
        elsewhere or self-hosted, and Dedicated Inference is now offered for customer-supplied
        models. Kimi K3.1 Pro carries a licence listed only as "Other" in the API, which is the
        one non-standard entry.
      evidence_refs:
      - ev-mastra
      - ev-catalogue
      - ev-dedicated
    cost:
      score: 4
      rationale: >-
        Per-model per-token rates are published through the API listing, plans are public (EUR 0
        to 500 per month) and Dedicated Inference has an indicative starting price. Held below 5
        because API access needs a paid plan with non-refundable prepaid credits that expire after
        12 months, numeric rate limits are not published, and no independent cost benchmark was run.
      evidence_refs:
      - ev-pricing
      - ev-catalogue

documentation:
  assess:
    completeness: 80.8
    originality: 0.0
    items:
      - key: data-governance
        title: "Data governance - retention, ZDR & training"
        doc_type: reference
        source_type: aggregated
        coverage: full
        refs: [ev-terms, ev-dpa, ev-code]
        summary: "The DPA (first in precedence) states a true Zero Data Retention policy for serverless inference, with prompts, files and outputs not stored after completed calls or on persisted disks during inference, and an express sentence that Berget does not train any models on inference input or output (Appendix 2). The ToS Sec 7 says Berget never stores prompt or output content. Distinct from inference retention: Customer Data is kept 30 days post-termination for export, then irreversibly deleted. The ToS reserve aggregated, anonymised usage data (Sec 19.1). No independent audit corroborates the retention controls."
      - key: data-ownership
        title: "Data & IP ownership"
        doc_type: reference
        source_type: aggregated
        coverage: full
        refs: [ev-terms, ev-dpa]
        summary: "Per ToS Sec 17.1 the Customer retains all title and intellectual property rights in its Customer Data and Berget's licence is limited to hosting, processing and transmitting it to provide the Service. Sec 18 is a mutual confidentiality clause naming Customer Data, with a cease-use and destroy duty on termination (Sec 18.5). The DPA names four sub-processors, with 30 days notice and an objection right. The customer feedback licence (Sec 19.2) covers suggestions only."
      - key: residency
        title: "Data residency & jurisdiction"
        doc_type: reference
        source_type: aggregated
        coverage: full
        refs: [ev-dpa, ev-landing, ev-techeu]
        summary: "Binding text: all Berget data centres are in the EEA and nothing leaves the EEA without the customer's written instruction (DPA Sec 10.1, 10.2). The customer can choose a data centre for compute and storage but the DPA excludes serverless inference, so serverless has no region pinning. Sweden-only and 'never crosses borders' statements are marketing, not clauses. Swedish ownership puts Berget outside US CLOUD Act reach."
      - key: compliance
        title: "Compliance & attestations"
        doc_type: reference
        source_type: aggregated
        coverage: partial
        refs: [ev-dpa, ev-terms, ev-security]
        summary: "A GDPR DPA is published at berget.ai/en/dpa and read (Art. 28(3); four named sub-processors in Appendix 1; personnel confidentiality Sec 7.1; EEA-only data centres Sec 10.1; 24-hour breach notice Sec 12.1; audit right Sec 11). No SOC 2, ISO 27001, ISO 27701 or HIPAA-BAA attestation exists on any page read; ToS Sec 6.7 says Berget is actively working toward ISO 27001. Request current attestation status directly for regulated procurement."
      - key: security
        title: "Security controls"
        doc_type: reference
        source_type: aggregated
        coverage: partial
        refs: [ev-terms, ev-dpa, ev-security]
        summary: "ToS Sec 6.7 states encryption in transit, network isolation, access controls and system monitoring; DPA Sec 8 adds pseudonymisation and encryption, restore capability and regular testing of measures. The Security page is a responsible-disclosure policy (PGP key, Signal, safe harbour). No independent pen-test or SOC 2 / ISO 27001 attestation surfaced."
      - key: pricing
        title: "Pricing & cost model"
        doc_type: reference
        source_type: aggregated
        coverage: full
        refs: [ev-pricing, ev-catalogue]
        summary: "Per-model per-token rates are published through the API (for example Mistral-Small-3.2 EUR 0.30 / 0.30, Kimi K3.1 Pro EUR 3.00 / 10.00 per million tokens). API access needs an active plan (Trial EUR 5 credits, Starter EUR 25, Team EUR 50, Enterprise EUR 500 per month); there is no pure pay-as-you-go, and prepaid credits are non-refundable and expire after 12 months. Dedicated Inference is quoted from about EUR 2,500 per GPU per month."
      - key: reliability
        title: "Reliability posture"
        doc_type: reference
        source_type: aggregated
        coverage: partial
        refs: [ev-sla, ev-techeu]
        summary: "A published SLA (2026-10-23) gives serverless inference best effort with no compensation; 99.5% monthly uptime with 10% or 25% fee credits applies only to Dedicated Inference with an HA setup. The status page named in the SLA is an unreadable JavaScript shell, so no incident history or uptime record is verified."
  implement:
    completeness: 75.0
    originality: 0.0
    items:
      - key: integration
        title: "API integration"
        doc_type: howto
        source_type: aggregated
        coverage: full
        refs: [ev-mastra, ev-docs]
        summary: "OpenAI-compatible chat/completions API at https://api.berget.ai/v1 - point an existing OpenAI client at the base URL; independently listed by the Mastra directory and works with LangChain, LlamaIndex and standard OpenAI SDKs."
      - key: authentication
        title: "Authentication & account setup"
        doc_type: howto
        source_type: aggregated
        coverage: partial
        refs: [ev-docs, ev-mastra]
        summary: "Bearer API keys; migrate from OpenAI by switching the API key and endpoint. Fine-grained org/project key scoping and rotation policy are not documented."
      - key: region-config
        title: "Region & ZDR configuration"
        doc_type: howto
        source_type: aggregated
        coverage: full
        refs: [ev-privacy, ev-terms]
        summary: "No region toggle needed - all inference runs in Sweden/EU by default per the Privacy page, and zero data retention is the default under the Terms, so EU residency and no-store behaviour are the out-of-the-box posture rather than a gated add-on."
      - key: portability
        title: "Portability & exit"
        doc_type: explanation
        source_type: aggregated
        coverage: full
        refs: [ev-mastra, ev-terms, ev-catalogue]
        summary: "OpenAI-compatible endpoint over open-weight checkpoints (Gemma 4, Mistral-Small, GLM-5.3-Flash, Kimi K3.1 Pro) - the same models run on other providers or self-hosted, so switching cost is low. On exit, the Terms give a 30-day post-termination export window for Customer Data before irreversible deletion; the lifecycle policy retires Active models with 2 to 3 weeks notice, so pin to checkpoints you can run elsewhere."
      - key: rate-limits
        title: "Rate limits, tiers & quotas"
        doc_type: reference
        source_type: gap
        gap_reason: "Specific per-tier rate limits, throughput quotas and concurrency ceilings are not published; confirm from the account console / developer docs."
  use:
    completeness: 42.9
    originality: 0.0
    items:
      - key: models-served
        title: "Models served"
        doc_type: reference
        source_type: aggregated
        coverage: full
        refs: [ev-catalogue, ev-mastra]
        summary: "15 listed entries (2026-11-19): Gemma 4 31B, Mistral-Small-3.2-24B, GLM-5.3-Flash and Kimi K3.1 Pro for text, bge-reranker-v2-m3, two multilingual-e5 embedding models, four Whisper-family speech-to-text models and three Preview models. Llama 3.1 8B, Llama 3.3 70B, gpt-oss-120B and GLM-4.7 have been retired."
      - key: features
        title: "Inference features"
        doc_type: reference
        source_type: aggregated
        coverage: partial
        refs: [ev-catalogue, ev-code]
        summary: "OpenAI-compatible chat completions plus embedding, reranking and speech-to-text endpoints. The API listing flags per model whether function calling, JSON mode, streaming and vision are supported (for example Kimi K3.1 Pro and Gemma 4 have function calling and vision). Berget Code is a seat-priced coding-assistant product under the same zero-retention terms."
      - key: context-limits
        title: "Context & token limits"
        doc_type: reference
        source_type: gap
        gap_reason: "Per-model maximum context and token limits on Berget's endpoints are not published; they track each served model's native window and should be confirmed on the model's Berget page."
      - key: fine-tuning
        title: "Fine-tuning / custom models"
        doc_type: reference
        source_type: gap
        gap_reason: "No first-party fine-tuning / custom-model-hosting documentation is published, so its availability and scope are not verified here."
  support:
    completeness: 42.9
    originality: 0.0
    items:
      - key: security-disclosure
        title: "Security disclosure & trust surface"
        doc_type: reference
        source_type: aggregated
        coverage: partial
        refs: [ev-security]
        summary: "The Security page is a responsible-disclosure policy: GitHub private vulnerability reporting, security@berget.ai with a PGP key and a Signal number, a typical 48-hour response and a safe-harbour statement. It is not a trust centre and states no technical controls or attestations; a bug-bounty programme is not stated."
      - key: channels
        title: "Support & community channels"
        doc_type: reference
        source_type: aggregated
        coverage: partial
        refs: [ev-docs, ev-pricing]
        summary: "Developer documentation at docs.berget.ai (with llms.txt and Markdown pages) and a community link; support level follows the plan (community on Trial, email on Starter, priority on Team, dedicated on Enterprise). Response-time commitments are not published."
      - key: status-uptime
        title: "Status page & uptime history"
        doc_type: reference
        source_type: gap
        gap_reason: "The SLA names https://status.berget.ai for incident information, but the page is a JavaScript shell that could not be read, so no incident history or uptime figure is verified."
      - key: deprecation
        title: "Model deprecation policy"
        doc_type: reference
        source_type: aggregated
        coverage: full
        refs: [ev-docs, ev-catalogue]
        summary: "docs.berget.ai publishes a lifecycle policy: Preview models may be removed without notice; Active models pass through Upgrading or Deprecated with 2 or 3 weeks notice depending on usage, and the API exposes lifecycle_status, upgrade_to and end_of_life. Seven models are listed as retired between 2026-06-24 and 2026-09-18."

