    reliability:  { level: moderate, rationale: "Serverless inference is best effort with no compensation under the SLA; only sales-contracted Dedicated Inference with an HA setup carries 99.5% with credits. The status page is unreadable here, and there is no independent pen-test or attestation." }
      # grounded in: ev-sla (retrieved:true), ev-techeu (third_party)
    data_control: { level: strong,   rationale: "The DPA states true Zero Data Retention with no persisted disk during inference and an express no-training sentence, the ToS keep title and IP with the customer under a licence scoped to providing the Service, and Customer Data is exportable for 30 days after termination then deleted; all data centres are in the EEA and Berget has no US parent. Pinning is not available for serverless inference." }
      # grounded in: ev-terms (retrieved:true, doc_type terms), ev-dpa (retrieved:true, doc_type dpa)
  verdict: "You substantially own workloads here: the binding DPA and Terms state zero retention of prompts and outputs, an express no-training sentence, customer-retained ownership under a service-scoped licence, a mutual confidentiality clause and a 30-day export window, while an EEA-only data-centre boundary and Swedish ownership keep you outside US CLOUD Act reach and a portable open-weight exit keeps switching cheap. What holds it below full is verification depth and operating terms: no independent audit or SOC 2 or ISO 27001 attests the guarantees, serverless inference is best effort with no SLA credits, and the Sweden-only marketing is not what the contract promises (the binding boundary is the EEA, with no data-centre choice for serverless). Adopt as an EU-based default for non-critical availability, and contractualise Dedicated Inference if you need an uptime commitment."

evidence:
- id: ev-terms
  claim: >-
    Berget AI Terms of Service (page stamp 2026-10-16, re-read 2026-11-19). Sec 7: "Berget will
    never store any of the actual prompt content used as model input, or any of the output
    content generated by the LLMs we host" (metadata such as logs, request metadata and token
    counts may be collected). Sec 17.1: the Customer retains all title and intellectual property
    rights in Customer Data and grants Berget the right to host, use, process, display and
    transmit it "to provide the Service". Sec 12: Customer Data is kept 30 days after termination
    for export or recovery, then irreversibly deleted. Sec 18 is a mutual confidentiality clause
    whose definition includes "in particular Customer Data", with a cease-use and destroy duty on
    termination (Sec 18.5). Sec 19.1 reserves aggregated, anonymised data that does not identify
    the Customer or any natural person. Sec 6.7 states encryption in transit, network
    isolation, access controls and monitoring and that Berget "is actively working toward ISO
    27001 certification". Sec 3.2 puts the DPA first in the order of precedence. The Terms
    contain no express no-training sentence and no residency clause.
  source_type: publisher
  doc_type: terms
  retrieved: true
  url: https://berget.ai/en/terms
  date: '2026-11-19'
- id: ev-privacy
  claim: >-
    Berget AI Data Privacy Policy (last updated 2025-03-10, re-read 2026-11-19): a website
    privacy policy for visitors, listing website data, cookies and website retention periods.
    Sec 10 says Berget sees "no reason whatsoever to transfer data outside of the EEA" and would
    use SCCs or adequacy decisions if a customer ordered a transfer. It does not state Sweden-only
    servers or zero retention of prompts; the 2026-07-25 claim to that effect was not supported
    by this page and has been removed.
  source_type: publisher
  doc_type: privacy_policy
  retrieved: true
  url: https://berget.ai/en/privacy
  date: '2026-11-19'
- id: ev-security
  claim: >-
    Berget AI Security page (re-read 2026-11-19): a "Responsible Disclosure" policy with GitHub
    private vulnerability reporting, security@berget.ai with a PGP key and a Signal number, a
    typical 48-hour response, a scope list and a safe-harbour statement. It describes no technical
    controls and states no SOC 2, ISO 27001 or pen-test; the stored claim that the page documents
    encryption and access controls was wrong (those measures are in ToS Sec 6.7 and DPA Sec 8).
  source_type: publisher
  doc_type: security
  retrieved: true
  url: https://berget.ai/en/security
  date: '2026-11-19'
- id: ev-dpa
  claim: >-
    Berget AI Data Processing Agreement (last updated 2026-10-22, re-read 2026-11-19), an
    Art. 28(3) GDPR controller-processor agreement that ranks first in the Terms' order of
    precedence. Appendix 2: "Berget AI applies a true Zero Data Retention policy on its serverless
    inference services, including Berget Code", with prompts, uploaded or streamed files and
    outputs not stored after completed calls and "none of it is stored on persisted disks even
    during inference processing"; and "Berget AI does not train any models on the input or output
    from serverless inference endpoints, nor does it share the data with any model providers for
    model training". Sec 10.1: for compute and storage services "(not including serverless
    inference)" the customer may choose the data centre, and "All Berget AI data centres are
    within the European Economic Area". Sec 10.2: no transfer outside the EEA without the
    customer's written instruction. Appendix 1 names four sub-processors: AI Iron AB, Acebit AB,
    Obenet AB and Stripe Payments Europe, Limited (Toriv AB is no longer listed); Sec 9.3 gives 30
    days notice and an objection right; Sec 12.1 gives breach notice within 24 hours where
    feasible; Sec 7.1 binds personnel to confidentiality.
  source_type: publisher
  doc_type: dpa
  retrieved: true
  url: https://berget.ai/en/dpa
  date: '2026-11-19'
- id: ev-sla
  claim: >-
    Berget AI Service Level Agreement (last updated 2026-10-23, re-read 2026-11-19), part of the
    Agreement under ToS Sec 3.1. Serverless Inference including Berget Code is "Best effort" and
    "no compensation is payable for interruptions". Dedicated Inference with an HA setup carries
    99.5% monthly uptime with credits of 10% (below 99.5%) or 25% (below 99.0%) of the fees for the
    impacted service, claimed within 30 days; single-instance dedicated is best effort with a 99.5%
    SLO. The SLA excludes the Trial plan and Preview models and names https://status.berget.ai for
    incident information; that page is a JavaScript shell this session could not read, so no
    uptime history is verified.
  source_type: publisher
  doc_type: sla
  retrieved: true
  url: https://berget.ai/en/sla
  date: '2026-11-19'
- id: ev-landing
  claim: >-
    Berget AI landing page (marketing, re-read 2026-11-19): "Open models running under Swedish
    jurisdiction with zero data retention", "never stores the content of your prompts or generated
    output, and never trains on your data", "EU-only infrastructure, no US entity involvement".
    Sweden-only processing is not stated in the DPA or Terms, which say EEA.
