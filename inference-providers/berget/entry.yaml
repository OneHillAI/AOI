      - ev-security
    residency:
      score: 5
      rationale: 'Infrastructure entirely on EU/Sweden-only servers with no US data
        transfers per the Privacy and Security pages, Swedish ownership (a public-record
        jurisdictional fact) placing Berget outside the US CLOUD Act, and independent
        EU tech-press corroboration of the sovereign-infrastructure positioning. Full
        EU data sovereignty with no extraterritorial exposure.

        '
      evidence_refs:
      - ev-privacy
      - ev-security
      - ev-techeu
    security:
      score: 3
      rationale: 'The Security page documents industry-standard technical/organisational
        measures - encryption in transit, network isolation, access controls, monitoring -
