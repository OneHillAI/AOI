evidence:
- id: ev-terms
  claim: 'Berget AI Terms of Service (re-read 2026-08-06): Berget will never store any of the
    actual prompt content used as model input or any of the output content generated by the
    LLMs it hosts (zero data retention); as between Berget and the Customer, the Customer
    retains all title and intellectual property rights in the Customer Data and grants Berget
    a licence limited to hosting, processing and transmitting it to provide the Service;
    Customer Data is retained for 30 days after termination for export/recovery then
    irreversibly deleted; Berget may process aggregated, anonymised data that does not
    identify the Customer or any natural person. Sec 18 is a mutual confidentiality clause:
    each party must keep the other''s non-public information confidential and use it only for
    the Agreement''s purposes (standard carve-outs for public / pre-known / independently
    developed information). Note Sec 7 addresses storage ("never store... prompt... or output
    content"), not training - the anti-training basis is the service-scoped licence plus the
    DPA purpose-limitation, not an express "will not train" sentence.'
  source_type: publisher
  doc_type: terms
  retrieved: true
  url: https://berget.ai/en/terms
  date: '2026-08-06'
- id: ev-privacy
  claim: 'Berget AI Data Privacy Policy: all data stays within EU-based servers in Sweden
    and never leaves Berget''s infrastructure; zero retention; GDPR-compliant by design.'
  source_type: publisher
  doc_type: privacy_policy
  retrieved: true
  url: https://berget.ai/privacy
  date: '2026-07-25'
- id: ev-security
  claim: 'Berget AI Security page: industry-standard technical and organisational measures
    including encryption in transit, network isolation, access controls and system
    monitoring, plus a PGP key for encrypted vulnerability reporting; no SOC 2 / ISO 27001
    certification is stated.'
  source_type: publisher
  doc_type: security
  retrieved: true
  url: https://berget.ai/en/security
  date: '2026-07-25'
- id: ev-dpa
  claim: 'Berget AI Data Processing Agreement (read 2026-08-06): an Art. 28(3) GDPR
    controller-processor agreement. Appendix 1 names the sub-processors - 6G AI Sweden AB,
    Acebit AB, Toriv AB, Obenet AB (all Swedish) and Stripe Payments Europe Ltd (Ireland) -
    so the sub-processor list IS disclosed and is entirely EEA (no US hyperscaler); Sec 10.1
