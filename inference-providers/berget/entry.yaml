        content), customer retains all title and IP under a service-scoped licence, a
        30-day post-termination export window, a mutual confidentiality clause (Terms Sec 18)
        and open-weight-only routing are all confirmed in the Terms of Service, and the DPA
        (read 2026-08-06) names an entirely-EEA sub-processor list - a strong, document-grounded
        posture. Held to 4 rather than 5 because no independent third-party attestation or audit
        (SOC 2 / ISO 27001) corroborates the data-handling guarantees, the never-train commitment
        rests on the service-scoped licence and DPA purpose-limitation rather than an express
        anti-training clause, and the Terms reserve an aggregated/anonymised usage-data right.

        '
