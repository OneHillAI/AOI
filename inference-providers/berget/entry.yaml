      score: 2
      rationale: 'Independent press reports production customers (the Swedish central bank
        Riksbanken as flagship, 300+ pilot/commercial customers), but no public uptime
        SLA, status page or failover documentation is available, so availability is not
        independently observable. Meets the score-2 anchor (serving in production, but no
