  change: 'Primary-source re-audit. Read the binding Terms of Service (ZDR ''never store
    prompt input or model output content'', customer-retained ownership under a service-scoped
    licence, 30-day export, aggregated/anonymised usage-data right), Privacy and Security
    pages (EU/Sweden-only, TOMs, PGP disclosure) via search extraction; added doc_type +
    retrieved to all evidence. Dropped data_governance 5 to 4 (binding-Terms-grounded but
    no independent attestation of the data-handling guarantees). Removed the Opper listing
    as it is a commercial partner, not an independent attestation; regrounded residency on
    retrieved Privacy/Security + independent tech press. DPA published but its clauses were
    not reachable (retrieved:false).'
- date: '2026-08-06'
  change: 'Confidentiality + dedicated-availability pass (OpenSpec provider-confidentiality-dedicated,
    rubric 1.2). Read the DPA (Appendix 1: entirely-EEA sub-processor list - 6G AI Sweden, Acebit,
    Toriv, Obenet, Stripe Payments Europe/Ireland; Sec 10.1 EEA-only; Sec 7.1 personnel
    confidentiality) and re-read the ToS (Sec 18 mutual confidentiality; Sec 7 storage not training),
    both retrieved:true (doc effective dates ToS 2025-10-16 / DPA 2026-04-08). Corrected
    subprocessors_disclosed false -> true. Added confidentiality: explicit and dedicated_availability:
    coming_soon. No dimension score changed (never-train rests on the service-scoped licence + DPA
    purpose-limitation, not an express clause; still no independent attestation).'
- date: '2026-09-21'
  change: 'Freshness re-verification (Cowork browser session). Confidentiality (explicit, ToS Sec 18) and content ZDR by default (ToS Sec 7) re-confirmed verbatim, unchanged. Positive delta: the DPA was refreshed 2026-09-10 (after the prior grounding) and now states verbatim all data centres are within the EEA, and the customer may choose which Berget data centre(s) process their data; Appendix 1 now names five sub-processors (Acebit AB, AI Iron AB, Obenet AB, Stripe Payments Europe Limited, Toriv AB) with 30-day advance notice and objection rights - both eu_region_available and subprocessors_disclosed were already coded correctly and residency was already at ceiling (5), so this strengthens the grounding without moving the score. ISO 27001 remains a stated claim ("actively working toward" per ToS 6.7), not a dated certificate - unchanged. No incidents or SLA changes found. No score change; grade holds at B.'
- date: '2026-11-19'
  change: >-
    Freshness re-verification (code session, curl against live pages; rubric 1.2). Re-read the ToS
    (page stamp 2026-10-16), DPA (2026-10-22), SLA (2026-10-23, new), Privacy page (2025-03-10),
    Security page, Acceptable Use Policy (2026-04-14), pricing, landing, Dedicated Inference page,
    docs (now readable) and the API model listing. Changes. (1) The DPA now has an express
    no-training sentence and states prompts, files and outputs are not stored on persisted disks
    even during inference (Appendix 2); this resolves the earlier caveat, but data_governance stays
    4 because the 5 anchor needs independent support for zero retention and none exists. (2)
    residency 5 to 4: DPA Sec 10.1 excludes serverless inference from customer data-centre choice
    and promises an EEA boundary, while the Sweden-only and "never crosses borders" statements are
    marketing; region_pinning yes to no. (3) A published SLA now exists: serverless is best
    effort with no compensation, 99.5% with credits only for Dedicated Inference with an HA setup;
    reliability stays 2 because status.berget.ai is an unreadable JavaScript shell
    (retrieved:false). (4) dedicated_availability coming_soon to available (offered sales-led with
    a published SLA and an indicative price). (5) Sub-processors now four (Toriv AB dropped). (6)
    Pricing: per-model rates are published through the API, but there is no pure pay-as-you-go and
    API access needs a plan. (7) Catalogue replaced: Llama, gpt-oss-120B and GLM-4.7 retired, Gemma
    4, GLM-5.3-Flash and Kimi K3.1 Pro added; lifecycle policy now documented. (8) Corrections to
    earlier evidence: the Privacy page is a website policy and does not state EU-only inference
    servers or zero retention; the Security page is a disclosure page and does not list technical
    controls; the tech.eu article does not name Riksbanken or 300+ customers. Headline and grade
    recomputed with scripts/score.py: 70.4 (B) to 67.2 (C), driven only by residency 5 to 4. Ownership
    level unchanged (substantial). SOC 2 or ISO 27001: none found, ISO 27001 is stated as
    being worked toward (ToS Sec 6.7).

