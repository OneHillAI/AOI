ownership:
  level: substantial
  factors:
    use_modify:   { level: strong,   rationale: "OpenAI/Anthropic-compatible APIs over a predominantly open-weight Model Library keep workloads
      portable. The Terms & Conditions confirm the customer retains all IP in Customer Content, including
      deployed model weights and outputs (Sec 6.1). The deployment ladder (shared, dedicated,
      single-tenant, self-hosted, hybrid) gives control over where and how the workload runs." }
    transparency: { level: moderate, rationale: "The Terms & Conditions, DPA, Security Practices, SLA and docs are legible, and the Trust Center
      renders in a browser (13-row sub-processor list, dated updates feed). Held at moderate because every
      certificate and report behind it (SOC 2 and SOC 3, ISO 27001, HIPAA, pen test, PCI AOC,
      compute-provider roster) is access-gated. The Security Practices have no explicit 'ZDR is the
      default' sentence and carry a customer-controlled-factors carve-out, and the docs do not say where
      the control plane runs." }
    reliability:  { level: strong,   rationale: "The SLA commits to 99.9% with service credits capped at 40% and a 24h claim window, and is worded
      as commercially reasonable measures. It is measured on a public status page that logs 7 major or
      critical incidents between 2026-09-20 and 2026-11-18, all resolved, including a 21-minute outage of
      all Model APIs on 2026-11-11. Reliability dimension 4 maps to strong." }
    data_control: { level: strong,   rationale: "Terms Sec 6.3 and DPA 4.4 bar training, and the Security Practices state a ZDR posture for Model
      APIs and Dedicated Inference (docs: 'Synchronous requests run under ZDR by default'). Customer
      Content is customer-owned, and Sec 11 sets a mutual confidentiality duty (data_governance 4).
      Caveats: Async Inference queues inputs for up to 72 hours, the Security Practices exempt retention
      that follows from customer configuration or customer code, and Model APIs residency needs a
      support-enabled policy." }
  verdict: "You substantially own inference here. The binding Terms and DPA bar training on your content
    (including deployed model weights), the Security Practices commit Model APIs and Dedicated Inference
    to Zero Data Retention, and confidentiality is mutual, a stronger standard-terms posture than most
    peers. A committed 99.9% SLA with credits adds reliability. Ownership falls short of full for four
    reasons. ISO 27001, PCI DSS and the SOC reports are vendor claims behind an access gate. The ZDR
    wording is a posture with a customer-controlled-factors carve-out and no explicit default. Async
    Inference keeps inputs for up to 72 hours. A self-serve EU region exists only for dedicated model
    deployments, and Model APIs residency needs a support-enabled policy. For EU residency of serverless
    traffic, or certificates confirmed first, deploy dedicated in the eu region or request the Trust
    Center documents."

