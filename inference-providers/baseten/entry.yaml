        strong, binding posture: Zero Data Retention by default for Model APIs and Dedicated
        Inference, a contractual never-train clause covering Customer Content (including
        deployed model weights and outputs), customer ownership of Customer Content, and a
        MUTUAL confidentiality duty (same care as own information, three-year survival). Held
        below 5 because Async Inference queues inputs for up to 72 hours before deletion (a
        lifecycle exception), and the sub-processor list''s actual contents were not
        independently read (the Trust Center portal is JS-gated).

        '
      evidence_refs:
      - ev-tc
      - ev-dpa
      - ev-security
    compliance:
      score: 4
      rationale: 'CORRECTED 2026-09-21: SOC 2 Type II is confirmed with a named audit firm
        (Sensiba San Filippo LLP, clean opinion across Security/Availability/Processing
        Integrity/Confidentiality/Privacy criteria); HIPAA and GDPR are independently confirmed
        on the Security Practices and DPA pages. A prior claim of ISO 27001 certification is
        RETRACTED - an independent Cowork browser pass found no trace of it (or of ISO 27701,
        PCI DSS, FedRAMP, or CSA STAR) on any retrievable Baseten page; the Vanta Trust Center
        that would carry such certificates is fully JS-gated and unreadable. Score held at 4
        (not lower) because SOC 2 Type II + HIPAA already satisfy the anchor-4 "two of
        {SOC2 II, ISO 27001, HIPAA/BAA}" bar on their own, plus GDPR documented; short of 5
        pending independent verification of anything beyond these three.

        '
      evidence_refs:
      - ev-soc2
      - ev-dpa
      - ev-security
    residency:
      score: 2
      rationale: 'A "regional environments" feature exists, routing a deployment exclusively to
        a designated geographic region, but no published list of available regions - including
        whether an EU region is among them - was found; the docs direct customers to contact
        support. The practical EU-residency path is the enterprise Baseten Self-Hosted tier
        (workload plane inside the customer''s own VPC, any region), which is a real option but
        not a documented, named managed-region boundary. Meets the score-2 anchor (an EU-capable
        path exists for some workloads, without pinning guarantees or a documented data
        boundary on the managed service).

        '
      evidence_refs:
      - ev-regions
      - ev-selfhosted
    security:
      score: 4
      rationale: 'CORRECTED 2026-09-21 (description, not score): independently browser-confirmed
        isolation is logical namespace separation for shared use (access controls, unique
        customer identifiers, namespace isolation) plus single-tenant dedicated Kubernetes
        namespaces with Calico/Cilium network policies ("GPUs never shared across users") and
        self-hosted deployment inside the customer''s own VPC - not an explicit "three-tier"
        model as an earlier draft described it, though the practical effect is similar. Plus TLS
        1.2+ in transit, AES-256 at rest, enforced MFA for all personnel, and periodic
        third-party penetration testing (independently confirmed verbatim). Held at 4, not 5,
        because no public bug-bounty programme was found and the pen-testing attestation is a
        general claim rather than a named, independently published report; the three logged
        incidents this period were brief availability degradations, resolved same/next day, not
        security breaches.

        '
      evidence_refs:
      - ev-security
    reliability:
      score: 4
      rationale: 'UPGRADED 2026-09-21: an independent Cowork browser session found and directly
        read a real, committed SLA (baseten.co/service-level-agreement, Sec 2.0) - 99.9% uptime
        for both Dedicated Inference and Model APIs, with a service-credit remedy (capped at 40%
        of monthly fees, Sec 4.2) and a 24-hour claim window (Sec 4.3). A prior draft held this at
        3 because no SLA document had been located; one now has been. The status page
        (independently browser-read) shows all systems operational with three brief,
        same/next-day-resolved incidents in the current window. Meets the score-4 anchor
        (contractual SLA with credits, a solid public uptime record, documented incident
        communication) - short of a long multi-year track record, which keeps it below 5.

        '
      evidence_refs:
      - ev-sla-verified
      - ev-status
    transparency_lockin:
      score: 4
      rationale: 'An OpenAI-compatible API (plus a beta Anthropic-compatible API) over a
        predominantly open-weight catalogue keeps workloads portable, and the Terms & Conditions
        give a documented 30-day post-termination export window plus an on-request deletion
        right. Held below 5 because the sub-processor list''s actual routing/vendor detail was
        not independently confirmed this pass.

        '
      evidence_refs:
      - ev-tc
      - ev-docs
    cost:
      score: 4
      rationale: 'Detailed, public per-token rates for Model APIs and per-GPU-minute rates
        across a wide range of GPU classes (T4 through B200) are both published directly on
        Baseten''s pricing page, with clear tier definitions (Basic/Pro/Enterprise). Held below
