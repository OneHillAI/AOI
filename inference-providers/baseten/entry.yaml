# OneHill v2 INFERENCE-PROVIDER library entry for Baseten.
# Validated against schema/inference-provider.v2.schema.json.
#   scores  -> scripts/score.py --write        (provider AOI)
#   meters  -> scripts/completeness.py --write  (per-domain completeness/originality)
#   prose   -> assess.md / implement.md / use.md / support.md (sections keyed <!-- item: KEY -->)

schema_version: '2.0'
id: baseten
name: Baseten
profile: inference
hq_country: United States
summary: "A US-headquartered (San Francisco) inference platform combining a curated serverless \"Model APIs\"
  catalogue with a bring-your-own-model deploy platform on dedicated GPUs. The Terms and DPA set a
  Zero Data Retention posture, a contractual never-train clause, a mutual confidentiality duty over
  Customer Content and a 99.9% SLA with service credits. The Security Practices page (last updated
  2026-11-12) has no explicit \"ZDR is the default configuration\" sentence and carves out
  customer-controlled factors. The docs publish an EU region (slug \"eu\") that a customer can select
  per dedicated deployment, while Model APIs residency needs a support-enabled compliance policy. The
  Vanta Trust Center renders only in a browser. It lists SOC 2, ISO 27001:2022 (announced 2026-08-24),
  HIPAA, GDPR, PCI DSS SAQ D and a 13-row sub-processor list, but every certificate and report behind
  it is access-gated, so these are publisher claims. Async Inference queues inputs for up to 72 hours,
  and the status page records a 21-minute Model APIs outage for all models (2026-11-11)."
models_served:
- DeepSeek V4.1 Flash (and 1017 / Fast variants), DeepSeek V4 Pro 0813, DeepSeek V4 Flash 0731
- GLM-5.2 / GLM-5.3 / GLM-5.3 Fast / GLM-5.3 Flash
- Kimi K3, Kimi K3.1 Pro
- Nemotron 3 Ultra, Nemotron 3.5 Super VL
- GPT OSS 120B, Muse Spark Open, Beam, and the Base Labs system-decision models mammoth-1, elephant-1 and joey-1 (priced on the Model APIs list)
- Whisper Large V3 and other transcription models, Flux.2 [dev] and other image models
- EmbeddingGemma, Nomic Embed Code, BGE Embedding ICL, Qwen3 8B Embedding / Reranker
- Plus a general bring-your-own/custom/fine-tuned-model deploy platform on dedicated
  GPUs (not limited to the curated Model Library)
hardware: NVIDIA GPU
pricing:
  model: mixed
  notes: "Per-token pricing for hosted Model APIs and per-GPU-minute pricing for dedicated deployments, both
    published on Baseten's pricing page. The page offers pay as you go and a \"Production scale\" route
    (capacity planning, volume discounts, reserved and priority compute, custom regions and SLAs, custom
    pricing). Default Model API rate limits are published by account tier in the docs (Basic unverified
    15 RPM / 100k TPM, Basic verified 120 RPM / 500k TPM, Pro 120 RPM / 1M TPM, Enterprise custom)."
  example_rates:
  - 'GLM-5.3: $1.40/M in, $0.14/M cached-in, $4.40/M out'
  - 'GLM-5.3-Flash: $0.15/M in, $0.03/M cached-in, $0.50/M out'
  - 'DeepSeek V4.1 Flash: $0.30/M in, $0.007/M cached-in, $1.20/M out'
  - 'Kimi K3: $3.00/M in, $0.30/M cached-in, $15.00/M out'
  - 'Kimi K3.1 Pro: $2.00/M in, $0.20/M cached-in, $10.00/M out'
  - 'Dedicated GPU per minute: T4 16GB $0.01052, A100 80GB $0.06667, H100 80GB $0.10833
    (~$6.50/hr), B200 180GB $0.16633'
data_governance:
  default_retention: "The Security Practices page (Last Updated November 12, 2026) states \"Baseten adheres to a Zero
    Data Retention posture across the below inference products\" (Model APIs, Dedicated Inference).
    It also states that Baseten \"will not store, retain, or otherwise make a persistent copy of
    model inputs or outputs\". docs.baseten.co/security.md adds \"Synchronous requests run under ZDR
    by default\". The page does not say \"ZDR is the default configuration\". A separate paragraph
    says customers \"may elect to enable logging, traffic recording, retention, abuse monitoring, or
    other changes to the applicable ZDR configuration for their workloads by written notice\". Terms
    Sec 2.5 honours the posture by reference. Async Inference (an elective Dedicated Inference
    feature) queues inputs for up to 72 hours before deletion, and outputs are never stored.
    Training (Loops) data is queued until processed, then deleted. Checkpoints are kept until the
    customer deletes them."
  trains_on_inputs: never
  zdr_available: yes_default
  zdr_scope_caveats: "ZDR is the stated posture for Model APIs and Dedicated Inference in the Security Practices,
    incorporated by reference into Terms Sec 2.5. It is not an opt-in or enterprise-gated feature.
    There are three carve-outs. The first is the Async Inference 72-hour input queue. The second is
    a \"Customer-Controlled Factors\" clause. Under it Baseten \"will not be in breach of these
    Security Practices (including the ZDR commitments)\" where retention arises from customer
    configurations, customer runtime code or dependencies, a customer-enabled Third-Party Product or
    a written customer direction. The third is customer-requested changes to the ZDR configuration.
    Backups may hold residual copies of Customer Content for a limited period after deletion."
  customer_data_ownership: customer_retains
  outputs_used_to_improve_service: 'no'
  third_party_routing_leakage: 'Serves an open-weight Model Library plus customer-supplied
    models on Baseten''s own infrastructure; no closed third-party model routing identified.

    '
  subprocessors_disclosed: true
  confidentiality: mutual
  confidentiality_caveats: "Terms Sec 11.1 names Customer Content and Customer Models as the Customer's Confidential
    Information, symmetric with Baseten's own. Sec 11.2 requires both parties to protect confidential
    information \"with the same degree of care it uses for its own (but no less than reasonable care)\".
    Sec 11.4 keeps the obligations in force for three years after termination, and indefinitely for
    trade secrets. DPA Sec 7.1 commits to 15 days' pre-notification of new sub-processors. The list at
    trust.baseten.co has 13 rows: AWS, Google Cloud, WorkOS, Pylon, Slack, Orb, Hugging Face,
    ClickHouse, Cloudflare, OVH Cloud, PostHog, SigNoz and a gated compute-providers PDF. The updates
    feed announces six further cloud-compute entrants since 2026-08-14 (Argentum AI, QumulusAI, Global
    AI, Mistral AI, Datasection, Buzz HPC) and Parallel AI for web search; the page does not itemise
    them. Terms Sec 2.6 says Infrastructure Providers (cloud, GPU and colocation operators) are not
    sub-processors unless they have logical access to Customer Content containing personal data. A list
    of material Infrastructure Providers is available on request."
compliance:
  soc2: type_ii
  iso_27001: "yes"
  iso_27701: unknown
  hipaa_baa: "yes"
  gdpr_dpa: "yes"
  fedramp: "No FedRAMP authorisation is stated. The trust centre lists a FedRAMP 20x document package (the
    overview PDF does not render and the rest is access-gated), which is not a FedRAMP authorisation."
  trust_center_url: https://trust.baseten.co/
  # ISO 27001:2022 and PCI DSS SAQ D are labelled on the vendor's own rendered trust centre
  # (ISO announced 2026-08-24). The certificate, the SOC 2 / SOC 3 reports (5.31.26), the HIPAA report,
  # the October 2026 penetration test and the PCI AOC are all behind "Request access", so every one
  # of these is a publisher claim and none is a retrieved attestation.
residency:
  eu_region_available: "yes"
  regions:
  - "United States (us) and European Union (eu): the two region slugs in the published \"Available
    regions\" table of the Regional deployments docs. A customer selects one region per dedicated model
    deployment (baseten model push --region eu, or the region field of the Management API). All replicas
    then run in that region behind a regional endpoint (model-{model_id}-region-eu.api.baseten.co). GPU
    model deployments only; Chains and training jobs cannot select a region."
  - "Regional environments (multi-region fallbacks, region exclusion rules) require configuration by
    Baseten (\"Contact support to confirm availability for the region you need\")."
  - 'Model APIs use a shared endpoint and "the regions serving a model can change"; staying in specific
    regions needs a Model APIs compliance policy enabled by support, subject to capacity in an allowed
    region.'
  - 'Baseten Sandboxes (a separate agent-execution product) show per-region components on the status page
    (Oregon us-pdx-1, Virginia us-was-1, Frankfurt eu-fra-1); these are not inference regions and the
    docs do not tie them to Model APIs or Dedicated Inference.'
  sovereign_option: 'Baseten Self-Hosted runs the workload plane inside the customer''s own VPC/cloud, in any
    region the customer chooses (including the EU), and Single-tenant hosting gives an isolated VPC in
    Baseten Cloud; both are Enterprise-tier with custom pricing. Baseten operates the control plane for every
    hosting option, and the docs do not state where the control plane runs.'
  region_pinning: "yes"
  cloud_act_exposure: true
  provider_can_restrict_access: 'US-headquartered (San Francisco); standard US jurisdiction
    (CLOUD Act, export controls) applies to the managed service, including a deployment pinned to the
    EU region.'
reliability:
  sla: "Baseten Service Level Agreement (page stamped Last Updated September 15, 2026). Sec 2: \"Baseten
    will undertake commercially reasonable measures to ensure that System Availability of the SLA
    Service equals or exceeds ninety-nine point nine percent (99.9%) during each calendar month\". It
    applies to Dedicated Inference and Model APIs on Baseten-managed infrastructure (not self-hosted).
    Credits: 10% below 99.9%, 15% below 99.5%, 30% below 99.0%. Sec 4.2 caps monthly Service Credits at
    \"forty percent (40%)\". Sec 4.3 requires an e-mail claim with evidence within 24 hours. The
    Enterprise plan offers \"Custom SLAs.\" The undertaking is limited to commercially reasonable
    measures and is not an unqualified guarantee."
  uptime_notes: "The public status page (status.baseten.co) shows \"All Systems Operational\" across Dedicated
    Inference, Model APIs, Training, Model Management API, Web Application, Homepage and Docs, and
    Sandboxes (with Oregon, Virginia and Frankfurt Sandboxes sub-components). Between 2026-09-20 and
    2026-11-18 it lists 7 major or critical incidents (2026-09-21, 09-24, 09-29, 10-05, 10-20, 11-11 and
    11-18), all resolved. The longest lasted 11 h 45 min (2026-09-29, elevated 500s in one us-central
    region). One was critical (2026-11-11, \"Model APIs are down for all models\", 21 min) and one was a
    major web-app outage (2026-11-18, 11 min, inference not affected). The page also lists 13 minor
    incidents. The SLA measures availability against this page."
  incidents:
  - date: '2026-09-09'
    summary: 'Nemotron Ultra partial degradation (Dedicated Inference unaffected); resolved
      10:49 PDT same day.'
  - date: '2026-09-14'
    summary: 'India cluster elevated errors plus a Kimi K3 non-US partial issue; resolved same
      day.'
  - date: '2026-09-20'
    summary: 'Kimi K3 US endpoint outage; restored 01:13 PDT.'
  - date: '2026-09-21'
    summary: 'Elevated inference 500s for a subset of models on GCP central1 (major); about 7 min.'
  - date: '2026-09-24'
    summary: 'Elevated inference 500s for a subset of models in one US-East cluster (major); about 43 min.'
  - date: '2026-09-29'
    summary: 'Elevated 500s in a single us-central region (major); resolved after about 11 h 45 min.'
  - date: '2026-10-05'
    summary: 'DeepSeek V4.1 outage on Model APIs (major, Dedicated Inference not affected); about 13 min.'
  - date: '2026-10-20'
    summary: 'DeepSeek V4.1 Flash Fast outage on Model APIs (major); about 6 min.'
  - date: '2026-11-11'
    summary: 'Model APIs down for all models (critical); recovered after about 21 min.'
  - date: '2026-11-18'
    summary: 'Outage of the web application (major); inference not affected; about 11 min.'
lock_in:
  openai_compatible_api: true
  portability_notes: "Hosted Model APIs support the OpenAI Chat Completions, OpenAI Responses and Anthropic Messages
    APIs. The Model Library is predominantly open-weight, and custom deploys use customer-authored
    Docker/Truss configs, not a Baseten-proprietary format. Terms & Conditions give a documented exit
    right: Customer Content may be exported for 30 days after the Term ends, and Baseten will delete
    Customer Content on written request."
dedicated_availability: self_serve
dedicated_notes: "Deployment options run from shared serverless Model APIs (self-serve, multi-tenant) to
  Dedicated Deployments. Dedicated Deployments are single-tenant GPU clusters priced per minute on
  the public pricing page with no sales gate found (\"Baseten never shares GPUs across users,\"
  per-customer Kubernetes namespace). They also offer a self-serve regional option (us or eu).
  Single-tenant hosting (an isolated VPC in Baseten Cloud) and Baseten Self-Hosted (the workload
  plane inside the customer's own VPC) are Enterprise-tier with custom pricing, and a Hybrid mode
  exists. Rated self_serve for the broadly available Dedicated Deployments tier; true self-hosted
  or air-gapped isolation is an enterprise-only path."
trust_considerations:
- "The Terms & Conditions (Sec 2.5, 6.3, 11) and DPA incorporate the ZDR posture by reference in Sec
  2.5 and set a never-train clause (Sec 6.3) covering Customer Content, Customer Models (deployed
  weights) and Model Outputs. The Security Practices page (rewritten 2026-11-12) does not contain the
  sentence \"ZDR is the default configuration\". It adds a clause under which Baseten is \"not in
  breach\" of the ZDR commitments where retention follows from customer configuration, customer code
  or a customer-enabled Third-Party Product. The commitment is real but scoped, so read both documents
  together."
- "Confidentiality is mutual (Sec 11.1-11.2, same-care-as-own-information standard, surviving three
  years post-termination, trade secrets indefinitely per Sec 11.4). Several peer providers have
  one-directional or disclaimed clauses."
- 'Async Inference (an elective Dedicated Inference feature) is the one retention exception: inputs queue for up
  to 72 hours and outputs are never stored. Loops training data is queued until processed and checkpoints persist
  until the customer deletes them.'
- "The Vanta Trust Center, rendered in a browser, labels ISO 27001:2022 and PCI DSS SAQ D next to SOC
  2 and HIPAA. Its updates feed announces the ISO 27001 certification on 2026-08-24. Pages readable
  without JavaScript show no trace of ISO 27001. The certificate, SOC 2 / SOC 3 reports, HIPAA report,
  October 2026 penetration test and PCI AOC are all behind \"Request access\", so these are the
  vendor's own claims. ISO 27701 and CSA STAR are not listed, and the FedRAMP 20x package is not an
  authorisation. The Security Practices page lists only SOC 2 Type II, HIPAA and GDPR."
- "SLA: 99.9% target with service credits (10/15/30%, capped at 40%) and a 24-hour claim window. The
  standard is worded as \"commercially reasonable measures to ensure\" 99.9%, not an unqualified
  guarantee. Between 2026-09-20 and 2026-11-18 the status page logs 7 major or critical incidents
  (longest 11 h 45 min in one US region; a 21-minute outage of all Model APIs on 2026-11-11), all
  resolved."
- "The docs publish an EU region (slug \"eu\") selectable per dedicated deployment by CLI or API, with
  a regional endpoint. Model APIs residency needs a support-enabled compliance policy and capacity in
  an allowed region, and the docs do not say where the control plane runs."
- "The trust centre lists 13 sub-processors (AWS and Google Cloud global; WorkOS, Pylon, Slack, Orb,
  Hugging Face US; Sandboxes-only ClickHouse, Cloudflare, OVH, PostHog, SigNoz) plus a gated
  compute-providers PDF. The updates feed adds Mistral AI, Global AI, Argentum AI, QumulusAI,
  Datasection and Buzz HPC as cloud-compute sub-processors since 2026-08-14. The GPU supply chain is
  widening, and its full roster needs a Request-access."
- US HQ implies standing CLOUD Act exposure for the managed service, including EU-pinned deployments.
- "The deployment ladder (shared, dedicated, single-tenant, self-hosted, hybrid) gives exit and
  control options, though true single-tenant or self-hosted isolation is Enterprise-tier."
score:
  rubric_version: '1.2'
  headline: 76.8
  grade: B
  hard_flags: []
  dimensions:
    data_governance:
      score: 4
      rationale: "The binding documents set a strong posture. They commit Model APIs and Dedicated Inference to a
        Zero Data Retention posture and bar training on Customer Content, including deployed model weights
        and outputs. Customers own Customer Content, and confidentiality is mutual (same care as own
        information, three-year survival). Held below 5 because Async Inference queues inputs for up to 72
        hours before deletion (a lifecycle exception). The Security Practices of 2026-11-12 carry no
        explicit \"ZDR is the default\" sentence and add a customer-controlled-factors carve-out. The
        compute-provider roster behind the 13-row sub-processor list is gated, and six further compute
        sub-processors have been announced since August."
      evidence_refs:
      - ev-tc
      - ev-dpa
      - ev-security
      - ev-trustcenter
    compliance:
      score: 4
      rationale: "SOC 2 Type II is confirmed with a named audit firm (Sensiba San Filippo LLP, clean opinion across
        Security/Availability/Processing Integrity/Confidentiality/Privacy criteria). The Security Practices
        of 2026-11-12 restate periodic SOC 2 Type II examinations and a report under NDA. HIPAA (BAAs with
        qualifying customers) and GDPR (DPA) are confirmed on the Security Practices and DPA pages. The
        Trust Center labels ISO 27001:2022 (announced 2026-08-24) and PCI DSS SAQ D and lists a FedRAMP 20x
        package. The certificate, the 5.31.26 SOC reports and the PCI AOC are access-gated, so those are
        vendor claims. Score 4: SOC 2 Type II and HIPAA (plus ISO 27001 as claimed) clear the anchor-4 bar
        of two of {SOC2 II, ISO 27001, HIPAA/BAA} with GDPR documented. A 5 needs a retrieved third-party
        attestation (check_grounding), and none is publicly retrievable. ISO 27701 and CSA STAR are not
        listed."
      evidence_refs:
      - ev-soc2
      - ev-dpa
      - ev-security
      - ev-trustcenter
    residency:
      score: 3
      rationale: "An EU region is available for at least some workloads, which is the score-3 anchor. The Regional
        deployments docs publish a region table with \"eu | European Union\" next to \"us | United States\",
        selectable per GPU model deployment through the CLI or Management API, with a regional endpoint. Not
        scored higher because Model APIs residency is support-enabled and not self-serve (\"the regions
        serving a model can change\"). Chains and training jobs cannot select a region, the docs do not say
        where the Baseten-operated control plane runs, and no data-boundary statement beyond the regional
        endpoint is published. The Enterprise Self-Hosted and Single-tenant tiers are the stronger residency
        path. US HQ carries CLOUD Act exposure, which is disclosed and not scored."
      evidence_refs:
      - ev-regional
      - ev-regions
      - ev-selfhosted
    security:
      score: 4
      rationale: "Isolation is logical namespace separation for shared use (access controls, unique customer
        identifiers, namespace isolation), single-tenant dedicated Kubernetes namespaces with Calico/Cilium
        network policies (\"GPUs never shared across users\") and self-hosted deployment inside the
        customer's own VPC. Controls include TLS 1.2+ in transit (mTLS between clusters), AES-256 at rest,
        enforced MFA for all personnel, quarterly access reviews, a 48-hour customer breach notification
        commitment and periodic third-party penetration testing (the docs say annual tests by independent
        firms). The trust centre lists a \"Baseten Penetration Test - October 2026\" PDF, which is gated.
        Held at 4, not 5, because no public bug-bounty programme was found and the pen-testing attestation
        is a general claim, not an independently published report. Status-page incidents are availability
        events, not security breaches."
      evidence_refs:
      - ev-security
      - ev-docs-security
      - ev-trustcenter
    reliability:
      score: 4
      rationale: "A committed SLA (baseten.co/service-level-agreement, stamped September 15, 2026) undertakes
        \"commercially reasonable measures\" to reach 99.9% monthly availability for both Dedicated
        Inference and Model APIs. Credits are 10/15/30%, capped at 40% of monthly fees (Sec 4.2), with a
        24-hour claim window (Sec 4.3). The status page shows all systems operational and logs 7 major or
        critical incidents between 2026-09-20 and 2026-11-18, all resolved. The longest lasted 11 h 45 min
        in one us-central region (2026-09-29), and one was a 21-minute outage of all Model APIs
        (2026-11-11). This meets the score-4 anchor (contractual SLA with credits, a public uptime record
        with incident communication, multi-cloud failover documented in the Security Practices). The
        incident log and the qualified SLA wording keep it from 5."
      evidence_refs:
      - ev-sla-verified
      - ev-status
    transparency_lockin:
      score: 4
      rationale: "An OpenAI-compatible API (plus Responses and Anthropic Messages endpoints) over a predominantly
        open-weight catalogue keeps workloads portable. The Terms & Conditions give a documented 30-day
        post-termination export window and an on-request deletion right. Model API rate limits (15 to 120
        RPM, 100k to 1M TPM by tier) and a 30-day model deprecation policy are published, and the
        sub-processor list is readable. Held below 5 because the compute-provider roster is a gated PDF
        (Terms Sec 2.6 says a list of material Infrastructure Providers is available on request) and six
        cloud-compute sub-processors were added since August."
      evidence_refs:
      - ev-tc
      - ev-docs
      - ev-limits
      - ev-trustcenter
    cost:
      score: 4
      rationale: "Public per-token rates for Model APIs and per-GPU-minute rates across a wide range of GPU classes
        (T4 through B200) are published on Baseten's pricing page, with defined tiers (Basic/Pro/Enterprise)
        and published default rate limits. Held below 5 because Enterprise-tier custom pricing is not
        public."
      evidence_refs:
      - ev-pricing

