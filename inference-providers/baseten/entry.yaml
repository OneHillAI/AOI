# OneHill v2 INFERENCE-PROVIDER library entry for Baseten.
# Validated against schema/inference-provider.v2.schema.json.
#   scores  -> scripts/score.py --write        (provider AOI)
#   meters  -> scripts/completeness.py --write  (per-domain completeness/originality)
#   prose   -> assess.md / implement.md / use.md / support.md (sections keyed <!-- item: KEY -->)

schema_version: '2.0'
id: baseten
name: Baseten
profile: inference
hq_country: United States
summary: 'A US-headquartered (San Francisco) inference platform combining a curated
  serverless "Model Library" (Model APIs) with a bring-your-own-model deploy platform
  on dedicated GPUs. A Cowork browser session (2026-09-21) independently confirmed, on
  two separate live fetches, Baseten''s Zero Data Retention default (via the Security
  Practices page), a contractual never-train clause, a MUTUAL confidentiality duty over
  Customer Content (an unusually strong finding for this index), and a real, committed
  99.9% SLA with service credits. The same pass RETRACTED an earlier ISO 27001 claim -
  no trace of it was found on any retrievable page, and the Vanta Trust Center that
  would carry such a certificate is fully JS-gated. The biggest caveats are that Async
  Inference queues inputs for up to 72 hours, PCI DSS/FedRAMP/CSA STAR status and the
  named sub-processor list remain unverified behind that same JS-gated portal, and no
  published, named EU region exists for the managed service - EU residency is only
  available via the enterprise self-hosted tier.

  '
models_served:
- DeepSeek V4.1 Flash (552B MoE, multimodal, 1M-token context)
- GLM-5 / GLM-5.3 / GLM-5.3 Fast
- Kimi K3
- Llama 3.3 70B Instruct
- Qwen3.5 35B-A3B, Qwen3 TTS, Qwen3 8B Reranker/Embedding, Qwen Image
- Whisper Large V3 (transcription)
- Flux.2 [dev] (image generation)
- EmbeddingGemma, Nomic Embed Code, BGE Embedding ICL
- Plus a general bring-your-own/custom/fine-tuned-model deploy platform on dedicated
  GPUs (not limited to the curated Model Library)
hardware: NVIDIA GPU
pricing:
  model: mixed
  notes: 'Per-token pricing for hosted Model APIs; per-GPU-minute pricing for dedicated
    deployments. Read directly from Baseten''s own pricing page. Tiers: Basic
    (pay-as-you-go), Pro (priority GPU access, volume discounts), Enterprise (custom
    SLAs, self-host, volume discounts).

    '
  example_rates:
  - 'GLM-5.3: $1.40/M in, $0.14/M cached-in, $4.40/M out'
  - 'DeepSeek V4.1 Flash: $0.30/M in, $0.03/M cached-in, $1.20/M out'
  - 'Kimi K3: $3.00/M in, $0.30/M cached-in, $15.00/M out'
  - 'Dedicated GPU per minute: T4 16GB $0.01052, A100 80GB $0.06667, H100 80GB $0.10833
    (~$6.50/hr), B200 180GB $0.16633'
data_governance:
  default_retention: 'CORRECTED 2026-09-21 (location, not substance): Zero Data Retention is the
    default per the Security Practices page - "Unless a customer, acting through an authorized
    representative, requests otherwise in writing, ZDR is the default configuration for the
    customer''s use of the inference products" - which the Terms & Conditions Sec 2.5 merely
    honours by reference ("Where the Services or a product are designated as operating under a
    ''Zero Data Retention'' posture in the Security Practices, Baseten will not log, record, or
    save Customer Content..."). A prior draft attributed the default to the Terms directly; the
    default actually lives in the Security Practices page. Async Inference is the one exception -
    inputs are queued for up to 72 hours before deletion, outputs are never stored.'
  trains_on_inputs: never
  zdr_available: yes_default
  zdr_scope_caveats: 'ZDR is the default per the Security Practices page (independently
    browser-confirmed verbatim, two fetches), incorporated by reference into Terms Sec 2.5 - not
    an opt-in or enterprise-gated feature. The one carve-out is Async Inference''s 72-hour input
    queue before deletion (outputs are never stored on that path either).

    '
  customer_data_ownership: customer_retains
  outputs_used_to_improve_service: 'no'
  third_party_routing_leakage: 'Serves an open-weight Model Library plus customer-supplied
    models on Baseten''s own infrastructure; no closed third-party model routing identified.

    '
  subprocessors_disclosed: true
  confidentiality: mutual
  confidentiality_caveats: 'CONFIRMED 2026-09-21 by an independent Cowork browser session on TWO
    separate live fetches of the Terms & Conditions: Sec 11.1 names Customer Content and Customer
    Models as the Customer''s Confidential Information (symmetric with Baseten''s own); Sec 11.2 -
    both parties must protect confidential information "with the same degree of care it uses for
    its own (but no less than reasonable care)"; Sec 11.4 - obligations survive three years after
    termination, and trade secrets survive indefinitely. This is independently verified as a
    genuine mutual duty, not a one-directional clause - a legitimate, differentiating finding for
    this index. Caveat: the sub-processor list (trust.baseten.co) exists and a 15-day
    pre-notification commitment is documented (DPA Sec 7.1), but the list''s actual named
    contents remain unread - the Trust Center is a JS-gated Vanta portal that returns only a meta
    description on every path tried.'
compliance:
  soc2: type_ii
  iso_27001: unknown
  iso_27701: unknown
  hipaa_baa: "yes"
  gdpr_dpa: "yes"
  fedramp: ''
  trust_center_url: https://trust.baseten.co/
residency:
  eu_region_available: unknown
  regions:
  - United States (managed default)
  - '"Regional environments" exist as a feature (routing a deployment exclusively to a
    designated geographic region), but no published list of available region names -
    including whether an EU region is among them - was found; the docs direct customers
    to "contact support to confirm availability for the region you need."'
  sovereign_option: 'Baseten Self-Hosted runs the entire workload plane inside the
    customer''s own VPC/cloud, in any region the customer chooses (including the EU) -
    "inference I/O never touching Baseten''s premises." This is the practical EU-residency
    path, not a named managed-region offering.'
  region_pinning: unknown
  cloud_act_exposure: true
  provider_can_restrict_access: 'US-headquartered (San Francisco); standard US jurisdiction
    (CLOUD Act, export controls) applies to the managed service.'
reliability:
  sla: 'CORRECTED 2026-09-21: a real, committed SLA was found and independently browser-read at
    baseten.co/service-level-agreement (a prior draft said none was located). Sec 2.0: "ninety-nine
    point nine percent (99.9%)" committed uptime, applying to BOTH Dedicated Inference and Model
    APIs on Baseten-managed infrastructure. Sec 4.2 caps monthly Service Credits at "forty percent
    (40%)"; Sec 4.3 requires a claim within 24 hours with evidence. Enterprise plan offers "Custom
    SLAs."'
  uptime_notes: 'A public status page (status.baseten.co, independently browser-read) shows "All
    Systems Operational" across 6 components (Dedicated Inference, Model APIs, Training, Model
    Management API, Web Application, Homepage and Docs), measured against the SLA''s System
    Availability definition (Sec 1.5). Three incidents in the current 90-day window, all
    resolved same-day or next-day (see incidents below).

    '
  incidents:
  - date: '2026-09-09'
    summary: 'Nemotron Ultra partial degradation (Dedicated Inference unaffected); resolved
      10:49 PDT same day.'
  - date: '2026-09-14'
    summary: 'India cluster elevated errors plus a Kimi K3 non-US partial issue; resolved same
      day.'
  - date: '2026-09-20'
    summary: 'Kimi K3 US endpoint outage; restored 01:13 PDT.'
lock_in:
  openai_compatible_api: true
  portability_notes: 'Hosted Model APIs support the OpenAI Chat Completions API and the
    Anthropic Messages API (beta); the Model Library is predominantly open-weight, and custom
    deploys use customer-authored Docker/Truss configs rather than a Baseten-proprietary format.
    Terms & Conditions give a documented exit right: Customer Content may be exported for 30
    days after the Term ends, and Baseten will delete Customer Content on written request.

    '
dedicated_availability: self_serve
dedicated_notes: 'A genuine three-tier deployment spectrum: shared serverless Model APIs
  (self-serve, multi-tenant); Dedicated Deployments - single-tenant GPU clusters priced
  per-minute directly on the public pricing page, no sales gate found for that tier
  ("Baseten never shares GPUs across users," per-customer Kubernetes namespace); and Baseten
  Self-Hosted - the full workload plane inside the customer''s own VPC, marketed toward the
  Enterprise tier and effectively enterprise-negotiated. Coded self_serve for the
  broadly-available Dedicated Deployments tier, with true self-hosted/air-gapped isolation
  remaining an enterprise-only path.'
trust_considerations:
- 'CONFIRMED 2026-09-21 by an independent Cowork browser session, on TWO separate live fetches of
  the Terms & Conditions: Zero Data Retention is the default for Model APIs and Dedicated
  Inference (via the Security Practices page, incorporated by reference into Terms Sec 2.5 -
  a location correction from a prior draft that cited the Terms directly), with a documented
  never-train clause (Sec 6.3) covering Customer Content, Customer Models (deployed weights),
  and Model Outputs alike - a strong, binding baseline, now independently verified.'
- Confidentiality is MUTUAL (Sec 11.1-11.2, same-care-as-own-information standard, surviving
  three years post-termination, trade secrets indefinitely per Sec 11.4) - independently
  confirmed on two separate fetches. A genuine positive, stronger than several peer providers'
  one-directional or disclaimed clauses.
- Async Inference is the one retention exception (72-hour input queue before deletion; outputs
  never stored).
- 'CORRECTION 2026-09-21: a prior ISO 27001 claim is RETRACTED - an independent browser pass
  found no trace of it, or of ISO 27701/PCI DSS/FedRAMP/CSA STAR, on any retrievable Baseten
  page; the Vanta Trust Center that would carry such certificates is fully JS-gated (every path
  tried returns only a meta description). Compliance remains strong on what IS independently
  confirmed: SOC 2 Type II with a named audit firm (Sensiba San Filippo LLP), HIPAA, and GDPR.'
- 'CORRECTION 2026-09-21: a real, committed SLA was found and independently read - 99.9% uptime
  for Dedicated Inference and Model APIs, service credits capped at 40% of monthly fees, a
  24-hour claim window. A prior draft said no SLA document had been located.'
- No published, named EU region exists for the managed service; "Regional environments" is a
  real feature but region availability (including whether EU is offered) requires a sales
  conversation. EU residency in practice means the enterprise Self-Hosted tier, not the managed
  product.
- US HQ implies standing CLOUD Act exposure for the managed service.
- The three-tier deployment ladder (shared, dedicated, self-hosted) is a genuine strength for
  exit/control, though true self-hosted isolation is enterprise-only.
