# OneHill v2 INFERENCE-PROVIDER library entry for Together AI. Replaces data.yaml.
# Validated against schema/inference-provider.v2.schema.json.
#   scores  -> scripts/score.py --write        (provider AOI - carried over unchanged)
#   meters  -> scripts/completeness.py --write  (per-domain completeness/originality)
#   prose   -> assess.md / implement.md / use.md / support.md (sections keyed <!-- item: KEY -->)

schema_version: '2.0'
id: together-ai
name: Together AI
profile: inference
hq_country: United States
summary: "A US-headquartered inference provider serving a broad, fast-moving open-model catalogue over
  per-token serverless, provisioned-throughput and dedicated GPU endpoints. The catalogue has 24
  serverless chat models, including DeepSeek V4, GLM-5.3, Kimi K3 and K3.1 Pro, Qwen 3.5 to 4,
  gpt-oss-120B and MiniMax M3.1 Flash, plus image, video and audio models including wrapped
  third-party APIs. Prompt storage is ON by default and the product docs say Together \"may use them
  for product improvements\". Zero data retention (ZDR) is an organisation-admin opt-in that also
  switches off passthrough models. Passthrough third-party models are ON by default and send prompts
  to the upstream provider under its own policy. Training is opt-in and off by default. The Terms (Sec
  9) expressly disclaim confidentiality, which caps the data-governance score at 3. Residency is thin:
  a US-only processing endpoint at +25%, no EU serverless endpoint, and EU only through sales-led
  dedicated or VPC deployments. SOC 2 Type II and ISO 27001:2022 are vendor announcements, and the
  trust centre has no readable content. There is a public status page with per-model uptime but no
  self-serve SLA."
models_served:
- "Serverless chat, 24 models (docs.together.ai/docs/serverless-models). DeepSeek V4 Pro 0813,
  V4.1 Flash, V4.1 Flash 1017; GLM-5.2, GLM-5.3, GLM-5.3 Flash; Kimi K3, Kimi K3.1 Pro; MiniMax
  M3.1 Flash. Qwen3.5 9B, Qwen3.6 Plus, Qwen3.7 Max and Plus, Qwen3.8 Flash, Qwen4 Max;
  gpt-oss-120B. Meta Muse Glimmer 30B and Muse Spark Open 816B A42B; Reflection Beam 1.0 501B
  A23B; Thinking Machines Inkling 2 Small. NVIDIA Nemotron 3.5 Super VL; Elorian Glimpse 1.0;
  Ricursive Ripple 65B Preview. Ternary Bonsai 27B (free); Together Tev1 4B Experimental"
- "Not on serverless chat: Llama 3.3 70B, Gemma 4 31B, Cogito v2.1 671B, MiniMax M3 and M2.7,
  Qwen3.5-397B, Qwen3-235B. Llama 3.3, Llama 4, Gemma 4 and Mixtral are fine-tuning base models only"
- 'Vision on serverless: Kimi K3, Kimi K3.1 Pro, Nemotron 3.5 Super VL, Qwen3.5 9B, Qwen4 Max, Inkling 2 Small'
- 'Image, video and audio: dozens, including wrapped third-party APIs (GPT Image 1.5 and 2, Gemini image variants, Veo 3.1,
  Cartesia Sonic) and Whisper Large v3, Orpheus, Kokoro and Qwen3 TTS'
- 'Embeddings, rerank, moderation: NONE on serverless (docs: "There are currently no embedding models offered via
  serverless"); embeddings and rerank are dedicated-only'
hardware: NVIDIA GPU
pricing:
  model: mixed
  notes: "Per-token serverless pricing (cached-input rates published for most models), a 25% premium for the
    US-only endpoint, provisioned throughput and on-demand dedicated GPU endpoints per GPU hour, GPU
    clusters and fine-tuning. Rates are published at together.ai/pricing and in the docs catalogue; they
    change often, and a Qwen4 Max promotion runs to 2026-11-23."
  example_rates:
  - "gpt-oss-120B: $0.15/M in, $0.60/M out"
  - "DeepSeek V4 Pro 0813: $1.32/M in, $3.96/M out"
  - "DeepSeek V4.1 Flash: $0.30/M in, $1.20/M out"
  - "Kimi K3: $3.00/M in, $15.00/M out; Kimi K3.1 Pro: $2.00/M in, $10.00/M out"
  - "GLM-5.3: $1.40/M in, $4.40/M out; GLM-5.3 Flash: $0.15/M in, $0.50/M out"
  - "MiniMax M3.1 Flash: $0.15/M in, $0.60/M out"
  - 'US-only endpoint (us-api.together.ai): 1.25x the standard rate, e.g. GLM-5.3 $1.75/M in, $5.50/M out'
  - 'Dedicated HGX H100 on demand: $5.49 per GPU hour; GPU Clusters H100 on demand $3.99 per GPU hour'
data_governance:
  default_retention: "Retention is not zero by default. The product docs state: \"By default, Together stores the prompts
    you send and the responses models return, and may use them for product improvements. This data is
    not shared with third parties, and you can delete it at any time.\" Prompt storage is a toggle that
    is ON by default. Privacy Policy Sec 2.7 shows prompts and responses held as playground user history
    by default. ZDR, the organisation-admin setting that turns prompt storage off, is opt-in (Privacy
    Policy Sec 2.6, ToS Sec 3, docs: \"ZDR is not enabled by default\"). It applies only to requests
    after it is enabled, and under ZDR request metadata, account data and uploaded files are still
    retained."
  trains_on_inputs: opt_in_only
  zdr_available: yes_optional
  zdr_scope_caveats: "ZDR is an organisation-level opt-in, not the default (Privacy Policy Sec 2.6; docs
    zero-data-retention page). Turning prompt storage off also turns off passthrough models, because
    passthrough needs retained prompts. Under ZDR \"Request content may pass through volatile memory and
    temporary caches\" but is not persisted. Metadata (token counts, model IDs, timestamps), account
    data and files uploaded for fine-tuning or batch are retained. ZDR does not reach back to data
    processed before it was enabled. Training on your data is a separate opt-in, off by default, whether
    or not ZDR is on. All of this is Together's self-attestation in its own documents, and none of it is
    independently audited."
  customer_data_ownership: customer_retains
  outputs_used_to_improve_service: opt_out
  third_party_routing_leakage: "The docs describe \"passthrough\" models that forward prompts and responses to an upstream
    provider, which \"handles that data under its own data policy\". The Passthrough models toggle is ON
    by default. The catalogue includes wrapped proprietary APIs (GPT Image, Gemini image variants, Veo,
    Cartesia), and the DPA Annex III names OpenAI OpCo, LLC for \"Generative AI\". Passthrough models
    are not individually labelled in the public pages. Turning ZDR on switches passthrough off. ToS Sec
    2 also makes third-party model terms govern where they conflict."
  subprocessors_disclosed: true
  confidentiality: disclaimed
  confidentiality_caveats: "ToS Sec 9 expressly disclaims confidentiality: \"The parties will have no confidentiality
    obligations to each other unless otherwise agreed in writing\" (ToS \"Updated May 19, 2026\"). That
    is an express waiver. On self-serve terms Together owes no duty of confidence over your prompts;
    they are protected only by the narrow content licence and the ZDR use-limitations. For trade-secret
    material an enterprise MSA with a negotiated confidentiality clause (or a standalone NDA) is a
    prerequisite."
compliance:
  soc2: type_ii
  iso_27001: unknown
  iso_27701: unknown
  hipaa_baa: "yes"
  gdpr_dpa: "yes"
  fedramp: ''
  trust_center_url: https://trust.together.ai/
residency:
  eu_region_available: "yes"
  regions:
  - 'United States (serverless; us-api.together.ai guarantees US inference processing for 8 models at 1.25x)'
  - "European Union (dedicated endpoints and VPC deployments through sales, per the docs and a support
    article marked \"Last updated 1 year ago\" that gates them to Scale and Enterprise tiers)"
  sovereign_option: "None self-serve. The only region guarantee on serverless is US-only processing (us-api.together.ai,
    +25%), and it covers \"where your request is processed\", not \"where data is stored, where logs are
    written, or how network traffic is routed\". Requests to api.together.ai \"do not guarantee US
    processing\", and the docs say DeepSeek models are hosted in North America data centres. No EU
    serverless endpoint is documented. EU residency means a dedicated endpoint or VPC deployment
    arranged with sales. The DPA PDF has no sentence on \"default routing through North America\"."
  region_pinning: "yes"
  cloud_act_exposure: true
reliability:
  sla: 'None on serverless: ToS Sec 1 disclaims uptime guarantees and the docs call serverless "best-effort". Provisioned throughput
    is sold "with a defined service level agreement" through sales; the SLA text is not public.'
  uptime_notes: "Public status page at status.together.ai (Better Stack) with per-model 90-day uptime from 99.28%
    (Kimi K3) to 100%, e.g. gpt-oss-120B 99.66%, GLM-5.3 99.91%, MiniMax M3.1 Flash 99.95%. The feed
    shows two network-maintenance notices in 2026 and no incident posts since January 2025."
  incidents: []
lock_in:
  openai_compatible_api: true
  portability_notes: 'OpenAI-compatible API serving portable open-weight models; low
    switching cost since the same open checkpoints run on other providers or self-hosted
    stacks.

    '
dedicated_availability: self_serve
dedicated_notes: "Together has the fullest deployment ladder of the providers here. The rungs are shared
  serverless, provisioned throughput, dedicated endpoints (single-tenant GPU instances, on-demand
  per GPU hour on the pricing page, H100 $5.49), self-serve and reserved bare-metal GPU clusters,
  and private networking or VPC deployments including EU regions through sales. Caveats: EU-region
  dedicated endpoints go through sales. A support article marked a year old gates them to Scale
  and Enterprise tiers, which the rate-limit docs call legacy contracts. Single-tenancy is
  described in product docs and is not warranted in the contract."
trust_considerations:
- "ToS Sec 9 EXPRESSLY DISCLAIMS confidentiality (\"The parties will have no confidentiality
  obligations to each other unless otherwise agreed in writing\"). This is a gap for trade-secret
  material on self-serve terms; an enterprise MSA with a negotiated confidentiality clause, or a
  standalone NDA, is a prerequisite. Under rubric 1.2 it caps data_governance at 3."
- 'ZDR is an organisation-admin opt-in, not the default. By default Together stores prompts and responses
  and, per its own docs, "may use them for product improvements". Turn prompt storage off to enable ZDR.
  Training on your data is a separate opt-in that is off by default.'
- "Passthrough third-party models are ON by default: they forward your prompts and responses to the
  upstream provider, which handles them under its own policy. ZDR switches passthrough off. The DPA
  Annex III also names OpenAI OpCo, LLC (\"Generative AI\") as a sub-processor."
- "Residency is thin. The only region guarantee on serverless is US-only processing (+25%), covering
  processing but not storage or logs. Requests to api.together.ai carry no region guarantee, and there
  is no EU serverless endpoint. EU residency means a sales-led dedicated or VPC deployment. The DPA
  PDF does not confirm default North America routing."
- 'Together''s own docs say models are "hosted at full precision" while its catalogue lists FP4, FP8, NVFP4
  and MXFP4 quantisation for most models. Treat the full-precision line as marketing.'
- "SOC 2 Type II (blog, 2025-07-08) and ISO 27001:2022 from A-LIGN (blog, 2026-06-10) are vendor
  announcements. The SOC 2 report and ISO certificate are available only on request, and the trust
  centre is a JavaScript-only page with no readable content. HIPAA/BAA is stated in the SOC 2 blog,
  yet ToS Sec 4 bars sending financial, medical or sensitive personal data under the standard terms."
- 'Public status page with per-model 90-day uptime (99.28% to 100%) and no recent incident posts, but no
  self-serve SLA: ToS Sec 1 disclaims uptime and the docs call serverless best-effort. SLAs come with
  provisioned throughput through sales.'
- "The catalogue turns over quickly. Llama 3.3 70B, Gemma 4 31B, Cogito, MiniMax M3 and M2.7 and
  Qwen3-235B have left serverless chat, and Kimi K3.1 Pro, MiniMax M3.1 Flash, Qwen4 Max and several
  new labs' models arrived between September and November 2026. There is no embedding, rerank or
  moderation model on serverless."
- 'US HQ implies standing CLOUD Act exposure, including for any EU-hosted dedicated workload.'
- 'The DPA Annex III names 9 sub-processors (AWS, Mailgun, Amplitude, Sentry, OpenAI OpCo, Together
  Software Canada, Hotjar, Intercom, Absorb). The DPA Annex 1 scope is account and employee data (contact
  and employment information), not inference content, so check what personal data in prompts the DPA is
  meant to cover.'
score:
  rubric_version: '1.2'
  headline: 69.6
  grade: C
  hard_flags: []
  dimensions:
    data_governance:
      score: 3
      rationale: "Held at 3 by the confidentiality cap, and the posture earns a 3 on the merits. ToS Sec 9 expressly
        DISCLAIMS confidentiality (\"no confidentiality obligations ... unless otherwise agreed in
        writing\"), so under rubric 1.2 D1 is capped at 3. Underneath the cap the posture is a solid 3, not
        higher. Prompt storage is on by default and the docs say Together \"may use them for product
        improvements\" (ev-docs). ZDR is an organisation-admin opt-in that still retains metadata, account
        data and uploads. Passthrough third-party models are on by default and send prompts to the upstream
        provider under its own policy. Training is opt-in and off by default, and customers own Content and
        Output (ev1, ev7). Sub-processors are named only in the DPA Annex III (ev9). All of it is
        self-attested and unaudited."
      evidence_refs:
      - ev1
      - ev7
      - ev-docs
      - ev9
    compliance:
      score: 4
      rationale: "SOC 2 Type II (ev3) and ISO 27001:2022 from A-LIGN, an ANAB-accredited body (ev-iso), are both
        vendor announcements of independent audits. The report and certificate are available only on
        request, and the trust centre (ev-trust) is a JavaScript-only page. A GDPR DPA with EU SCCs and the
        UK Addendum is published (ev9). HIPAA/BAA is stated in the SOC 2 blog, although ToS Sec 4 bars
        sending medical or sensitive personal data under standard terms. This meets the score-4 anchor on
        two named attestations plus a DPA, as announced. It cannot reach 5: no third-party or
        onehill-verified evidence is available, ISO 27701 is absent, and the attestations themselves are
        unverified."
      evidence_refs:
      - ev3
      - ev-iso
      - ev9
      - ev2
    residency:
      score: 3
      rationale: "Score 3. Per the docs (ev-geo) the only serverless region guarantee is US-only processing at
        us-api.together.ai (+25%, 8 models). It covers processing but \"doesn't cover where data is stored,
        where logs are written, or how network traffic is routed\". Requests to api.together.ai \"do not
        guarantee US processing\", and no EU serverless endpoint is documented. EU residency is available
        for some workloads only through dedicated or VPC deployments arranged with sales (ev-docs, and a
        support KB marked a year old that gates them to Scale and Enterprise, ev4). That is the score-3
        anchor (EU region for at least some workloads). It does not reach the score-4 anchor: the main
        serverless workload has no EU option, there is no documented data boundary, and US CLOUD Act
        exposure remains."
      evidence_refs:
      - ev-geo
      - ev-docs
      - ev4
    security:
      score: 4
      rationale: "The DPA Annex 2 (ev9) commits to a written security programme, MFA for remote access, and
        encryption in transit and storage. It also commits to daily internal and external vulnerability
        scans, annual external penetration tests, 30-day remediation of critical findings and USD 2 million
        cyber insurance. The docs add a private HackerOne vulnerability programme (ev-docs), and the SOC 2
        and ISO announcements describe independent audits (ev3, ev-iso). Held below 5 because no pen-test
        report, SOC 2 report or ISO certificate is public, and because the HackerOne programme is private
        and its bounty terms are not public."
      evidence_refs:
      - ev9
      - ev-docs
      - ev3
      - ev-iso
    reliability:
      score: 3
      rationale: "A public status page exists at status.together.ai (ev-status). It publishes per-model 90-day uptime
        (99.28% to 100%) and a maintenance and incident feed with two network-maintenance notices in 2026
        and no incident posts since January 2025. That meets the score-3 anchor (operational track record,
        public status page, documented incident communication). Short of 4: there is no self-serve SLA (ToS
        Sec 1 disclaims uptime, docs say serverless is best-effort), the provisioned-throughput SLA is
        sales-only and unpublished, and some models sit near 99.3% over 90 days."
      evidence_refs:
      - ev-status
      - ev7
      - ev-docs
    transparency_lockin:
      score: 4
      rationale: "OpenAI-compatible /v1 API (ev6; embeddings and moderation are not served on serverless) over
        portable open-weight models (DeepSeek, GLM, Kimi, Qwen, gpt-oss, MiniMax). Third-party analysis
        (ev8) lists 18 Together models, and the deployment ladder runs from serverless to VPC. Held at 4:
        portability rests on Together's own docs, routing is not fully transparent because passthrough
        models send prompts upstream and are not individually labelled, and the catalogue turns over
        quickly."
      evidence_refs:
      - ev6
      - ev8
      - ev-docs
    cost:
      score: 4
      rationale: "Pricing is published directly (ev5): per-token serverless rates with cached-input prices for 24
        chat models, a published 25% premium for US-only processing, on-demand per-GPU-hour dedicated and
        cluster rates, fine-tuning and PTU pricing, with dated promotions. Competitive for the class
        (gpt-oss-120B $0.15/$0.60; DeepSeek V4.1 Flash $0.30/$1.20) and corroborated by Artificial Analysis
        (ev8). Held at 4: reserved and large-scale capacity is contact-sales, and rates move often."
      evidence_refs:
      - ev5
      - ev8

