ownership:
  level: partial
  factors:
    use_modify:   { level: strong,   rationale: "OpenAI-compatible /v1 API serving portable open-weight models - the same checkpoints run on other
      providers or self-hosted, so exit cost is low." }
    # grounded in: ev6 (docs, OpenAI-compat, retrieved), ev8 (third_party portability)
    transparency: { level: moderate, rationale: "The Terms, Privacy Policy and DPA are published, but the posture is Together's own
      self-attestation. Sub-processors appear only in the DPA Annex III, and the trust centre has no
      readable content. Some docs claims are contradicted by Together's own catalogue (full precision
      versus FP4 and FP8 quantisation)." }
    # grounded in: ev1 (privacy_policy, retrieved), ev7 (terms, retrieved), ev9 (dpa, retrieved), ev-docs (docs, retrieved); ev-trust retrieved:false
    reliability:  { level: moderate, rationale: "A public status page shows per-model 90-day uptime of 99.28% to 100%, and SOC 2 Type II and ISO
      27001:2022 are announced. The terms disclaim uptime, serverless is best-effort, and the only SLA is
      sales-only provisioned throughput." }
    # grounded in: ev-status (publisher, retrieved), ev3 and ev-iso (vendor announcements), ev7 Sec 1; reliability dim 3
    data_control: { level: moderate, rationale: "You own Your Content and Output and training is opt-in. Prompt storage is on by default and
      Together may use stored prompts for product improvements, and ZDR is an admin opt-in. Passthrough
      models send prompts to third parties by default, ToS Sec 9 disclaims confidentiality, and US HQ
      carries standing CLOUD Act exposure." }
    # grounded in: ev7 (terms, retrieved), ev-docs (default storage and passthrough, retrieved), ev1 (privacy_policy ZDR, retrieved), ev9 (dpa, retrieved)
  verdict: "You own your inputs and outputs under the Terms, training is opt-in, and the open-weight catalogue
    on an OpenAI-compatible API gives a clean portable exit. Ownership is partial. By default Together
    stores your prompts and may use them for product improvements, and zero data retention is an admin
    opt-in. Passthrough models send prompts to third parties until you switch them off, and the Terms
    disclaim any duty of confidence. Residency is US-only on serverless, with EU limited to sales-led
    dedicated deployments. Turn prompt storage off for ZDR, negotiate confidentiality and EU terms in an
    enterprise contract, and do not rely on the default terms for trade secrets or regulated data."

