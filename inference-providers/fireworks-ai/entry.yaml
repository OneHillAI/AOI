# OneHill v2 INFERENCE-PROVIDER library entry for Fireworks AI.
# Validated against schema/inference-provider.v2.schema.json.
#   scores  -> scripts/score.py --write        (provider AOI)
#   meters  -> scripts/completeness.py --write  (per-domain completeness/originality)
#   prose   -> assess.md / implement.md / use.md / support.md (sections keyed <!-- item: KEY -->)

schema_version: '2.0'
id: fireworks-ai
name: Fireworks AI
profile: inference
hq_country: United States
summary: 'A US-headquartered (Delaware-domiciled) inference provider serving a broad,
  fast-moving open-model catalogue (Kimi K3, DeepSeek V4-generation, GLM-5.3, Qwen3.8,
  Llama 3.x, Mistral, NVIDIA Nemotron, gpt-oss 120B, plus embeddings and FLUX image
  models) over per-token serverless and per-GPU-second dedicated deployments. A
  Cowork browser session (2026-09-20) found that Fireworks'' Terms of Service and DPA -
  the two most contractually load-bearing documents - are page-level noindexed and
  return ROBOTS_DISALLOWED to a real browser pass, so the ToS-level Zero Data Retention
  clause, the exact confidentiality-clause direction, and the DPA sub-processor Schedule
  (including a prior claim that Anthropic is named as a sub-processor) could NOT be
  independently verified and are coded accordingly. What IS independently confirmed via
  readable docs pages: a Zero Data Retention posture for all services except the
  Response API (which stores conversation data by default, 30-day auto-delete,
  store=false opt-out), and via the Privacy Policy: no training on prompts/inputs
  without the customer''s explicit opt-in. Compliance (SOC 2 Type II, HIPAA, ISO
  27001/27701/42001) remains publisher/blog-grade only - the Trust Center is fully
  JS-gated and returns no dated certificate.

  '
models_served:
- Kimi K3 / K2.7 (Code) / K2.6
- DeepSeek V4.1 Flash / V4 Pro / V4 Flash (incl. Vision Exp)
- GLM-5.3 (Flash/Fast/US variants) / GLM-5.2 / GLM-4.5V (vision)
- Qwen3.8 Max / Flash, Qwen3 VL, Qwen3 Embedding/Reranker
- Llama 3.3 70B, 3.2 (incl. Vision), 3.1 family
- Mistral Large 3 / Ministral 3 / Nemo
- NVIDIA Nemotron 3 Ultra / 3.5 Lightning
- gpt-oss 120B
- Embeddings (BGE-M3, Voyage 4 Lite/Large/Nano) and image (FLUX.1 schnell/dev + ControlNet)
hardware: NVIDIA GPU
pricing:
  model: mixed
  notes: 'Per-token serverless pricing (input / discounted cached-input / output),
    billed per-GPU-second for on-demand dedicated deployments, and a 50% discount for
    batch inference. Generic (non-featured) models are priced by parameter size. A
    "US-only serverless" residency option carries a 1.5x price premium (effective
    2026-09-01). Read directly from Fireworks'' own pricing docs.

    '
  example_rates:
  - 'Kimi K3 (standard): $3.00/M in, $0.30/M cached-in, $15.00/M out'
  - 'DeepSeek V4.1 Flash: $0.30/M in, $0.006/M cached-in, $1.20/M out'
  - 'GLM-5.3 Flash: $0.15/M in, $0.03/M cached-in, $0.50/M out'
  - 'gpt-oss-120B: read from the featured-model pricing table (rate not independently
    re-confirmed this pass - see gpt-oss line item on docs.fireworks.ai/serverless/pricing)'
data_governance:
  default_retention: 'Zero Data Retention for serverless/dedicated inference (docs.fireworks.ai
    data_handling page, independently browser-read): Content is not logged for human review nor
    retained beyond generating and delivering Output. Exception is the Response API, which
    stores conversation data by default (store=true) with 30-day auto-deletion - store=false
    disables retention entirely, and stored responses can be force-deleted by response_id. This
    retention posture is grounded in the readable docs pages, not the unreadable ToS.'
  trains_on_inputs: opt_in_only
  zdr_available: yes_default
  zdr_scope_caveats: 'ZDR is the posture for serverless/dedicated inference per the readable
    data_handling docs page. The one carve-out is the Response API''s default-on conversation
    storage (30-day auto-delete, opt-out via store=false) - a lifecycle exception similar in
    shape to Groq''s batch/fine-tune retention, not a general retention default. Separately, the
    Privacy Policy (independently browser-read) states Fireworks does not use prompts/API inputs
    to train or improve its models "without your explicit opt-in" - i.e. training is opt-in, not
    a flat "never." The ToS-level ZDR clause number could not be independently confirmed (see
    confidentiality_caveats below).

    '
  customer_data_ownership: customer_retains
  outputs_used_to_improve_service: 'no'
  third_party_routing_leakage: 'Serves an overwhelmingly open-weight catalogue on its own
    infrastructure; no closed third-party model routing identified.

    '
  subprocessors_disclosed: false
  confidentiality: unknown
  confidentiality_caveats: 'CORRECTION (2026-09-20, independent Cowork browser verification):
    an earlier automated pass claimed to have downloaded and parsed the Terms of Service and DPA
    as PDFs, citing a one-directional Sec 8 Confidential Information clause and coding
    confidentiality as functional_only. A real browser session could NOT reach either document -
    both fireworks.ai/terms-of-service and fireworks.ai/dpa are page-level noindexed and return
    ROBOTS_DISALLOWED, and the Trust Center that also hosts the DPA is fully JS-gated. The
    confidentiality-clause direction (one-directional vs mutual vs covers customer data) is
    therefore NOT independently established, and per AOI''s evidence rules a classification must
    not be asserted on unverifiable grounding. Coded unknown pending a rendered PDF or
    authenticated access. Separately, the DPA''s prior claim of a full named sub-processor
    Schedule (including Anthropic as an "AI services" sub-processor) is likewise unconfirmed -
    subprocessors_disclosed corrected from true to false. The substance of no-training-by-default
    is independently corroborated via the Privacy Policy, a different, readable document - see
    trains_on_inputs.'
compliance:
  soc2: type_ii
  iso_27001: 'yes'
  iso_27701: 'yes'
  hipaa_baa: "yes"
  gdpr_dpa: "yes"
  fedramp: ''
  trust_center_url: https://trust.fireworks.ai/
residency:
  eu_region_available: "yes"
  regions:
  - United States (default)
  - Europe (on-demand/dedicated deployments; region selection beyond default requires
    a sales-granted quota)
  - Asia-Pacific (on-demand/dedicated deployments, same sales-quota gating)
  sovereign_option: 'Fireworks Virtual Cloud (BYOC): the inference engine runs inside the
    customer''s own VPC so "data never leaves your secure environment" (GA June 2025); access
    is enterprise/sales-negotiated, not self-serve.'
  region_pinning: "yes"
  cloud_act_exposure: true
  provider_can_restrict_access: 'Fireworks is contractually domiciled in Delaware, USA (ToS
    governing-law clause); standard US jurisdiction (CLOUD Act, export controls) applies even
    to EU/APAC-hosted on-demand workloads.'
reliability:
  sla: ''
  uptime_notes: 'A public status page (status.fireworks.ai) shows per-endpoint 90-day uptime
    in the ~99.67-100% range across roughly 28 tracked serverless model endpoints; no SLA or
    service-credit clause was found in the standard Terms of Service (an enterprise contract
    may carry a separate, non-public SLA).

    '
  incidents: []
lock_in:
  openai_compatible_api: true
  portability_notes: 'An OpenAI-compatible API (base URL api.fireworks.ai/inference/v1, Chat
    Completions + Completions) over a predominantly open-weight catalogue keeps workloads
    portable - independently browser-confirmed 2026-09-20. CORRECTED: a prior claim of a
    Responses API with MCP support was not found on the compatibility docs page and is not
    independently confirmed. A prior claim of a DPA Sec 11.2 30-day data-return right is also
    unconfirmed - fireworks.ai/dpa is noindexed and unreachable to a real browser.

    '
dedicated_availability: self_serve
dedicated_notes: 'Basic on-demand dedicated GPU deployments are self-serve (firectl / REST /
  SDKs / console), billed per-GPU-second, with default/US region available without a sales
  gate. The fuller isolation tiers - non-default regions (Europe/APAC) and the Virtual Cloud
  (BYOC, full customer-VPC) option - are enterprise/sales-negotiated ("contact sales"), so the
  strongest isolation guarantee is not itself self-serve.'
trust_considerations:
- 'CORRECTION (2026-09-20, independent Cowork browser verification): an earlier automated pass
  claimed to have downloaded and parsed the Terms of Service and DPA as PDFs, citing a specific
  ToS Sec 3.6 Zero Data Retention/never-train clause, a one-directional Sec 8 confidentiality
  clause, and a DPA Schedule 4 sub-processor list naming Anthropic. A real browser session found
  BOTH fireworks.ai/terms-of-service and fireworks.ai/dpa to be page-level noindexed, returning
  ROBOTS_DISALLOWED, and the Trust Center that also hosts the DPA is fully JS-gated - none of
  these three claims could be independently verified. They are not necessarily false (the code
  session''s PDF read may be genuine and simply unreachable to a robots.txt-respecting browser),
  but AOI''s evidence rules do not permit asserting a classification or a specific clause number
  on unverifiable grounding, so confidentiality is now coded unknown (was functional_only) and
  subprocessors_disclosed is now false (was true, with the Anthropic claim unconfirmed).'
- The Response API is the one confirmed retention exception (docs.fireworks.ai/guides/security_
  compliance/data_handling, independently browser-read) - conversation data is stored by default
  (store=true) with 30-day auto-deletion; store=false disables it entirely. All other services
  follow Zero Data Retention per the same readable page.
- 'The Privacy Policy (independently browser-read, a different document from the unreadable ToS)
  states: "We do not use your prompts, training data, or API inputs to train or improve our AI
  models without your explicit opt-in." This corroborates the SUBSTANCE of no-training-by-default,
  which is why trains_on_inputs is coded opt_in_only (not "never," since training can occur with
  opt-in, and not "unclear," since the substance is independently confirmed via a readable
  document) rather than resting on the unreadable ToS.'
- SOC 2 Type II and triple ISO certification (27001 / 27701 / 42001) are corroborated only via
  Fireworks' own blog announcements (exact dates now confirmed - SOC 2/HIPAA blog 2023-10-27, ISO
  blog 2025-11-19; auditor not named in either) - the JS-rendered Trust Center portal and the
  underlying audit reports were not independently read this pass. No compliance upgrade from this
  finding.
- Full VPC/BYOC deployment and non-default-region on-demand deployments are sales-gated, not
  self-serve; the default self-serve product is the shared/regional-default serverless and
  on-demand tiers (independently confirmed).
- US (Delaware) domicile implies standing CLOUD Act exposure even for EU/APAC-hosted on-demand
  workloads.
