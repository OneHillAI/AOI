# OneHill v2 INFERENCE-PROVIDER library entry for Fireworks AI.
# Validated against schema/inference-provider.v2.schema.json.
#   scores  -> scripts/score.py --write        (provider AOI)
#   meters  -> scripts/completeness.py --write  (per-domain completeness/originality)
#   prose   -> assess.md / implement.md / use.md / support.md (sections keyed <!-- item: KEY -->)

schema_version: '2.0'
id: fireworks-ai
name: Fireworks AI
profile: inference
hq_country: United States
summary: 'A US-headquartered (Delaware-domiciled) inference provider serving a broad,
  fast-moving open-model catalogue (Kimi K3 and K3.1 Pro, DeepSeek V4.1-generation,
  GLM-5.3, Qwen 3.8, MiniMax M3.1, Llama 3.x and 4, Mistral, NVIDIA Nemotron, gpt-oss 120B,
  plus embeddings and FLUX image models) over per-token serverless and per-GPU-second
  dedicated deployments. Re-read 2026-11-19: the Terms of Service (Last Updated 2026-07-10)
  and the DPA (v3.4) ARE readable - both page URLs redirect to text PDFs, so the 2026-09-20
  "unreachable" finding was a limit of the browser route, not an absence of text. They confirm a
  contractual Zero Data Retention clause (ToS Sec 3.6, with no training on Content and carve-outs
  for the Response API and training, fine-tuning and agent features), customer ownership of
  Content, a one-directional confidentiality clause that protects only Fireworks'' own information
  (functional_only for customer data), a GDPR Art. 28-style processor DPA with SCCs, a UK
  Addendum, 48-hour breach notice and a 30-day data-return right. Still unread: the sub-processor
  list (a JavaScript-only Vanta trust centre) and the SOC 2 and ISO reports, so the compliance
  claims stay publisher-grade. There is no standard SLA; a 99.9 percent uptime term exists only
  for enterprise Reserved Throughput contracts.

  '
models_served:
- Kimi K3.1 Pro / K3 / K2.7 (Code) / K2.6
- DeepSeek V4.1 Flash (+ 1017 variant) / V4 Pro / V4 Flash (incl. Vision Exp)
- GLM-5.3 (Flash/Fast/US variants) / GLM-5.2 / GLM-4.5V (vision)
- Qwen 3.8 Max / Flash, Qwen3 VL, Qwen3 Embedding/Reranker
- MiniMax M3.1 Flash / M3
- Llama 3.3 70B, 3.2 (incl. Vision), 3.1 family, Llama 4 Scout and Maverick
- Mistral Large 3 / Ministral 3 / Nemo
- NVIDIA Nemotron 3 Ultra / 3.5 Lightning
- gpt-oss 120B / 20B
- Muse Spark Open, Ember-1, Rune 26B-A4B, Ultramarine 1 Flash (listings new since September)
- Embeddings (BGE-M3, Voyage 4 Lite/Large/Nano) and image (FLUX.1 schnell/dev + ControlNet)
hardware: NVIDIA GPU
pricing:
  model: mixed
  notes: 'Per-token serverless pricing (input / discounted cached-input / output), billed
    per-GPU-second for on-demand dedicated deployments (H100 80GB 8.00 USD per hour, B200
    13.00, GB300 20.00), a 50% discount for batch inference, a Priority tier at 1.25x
    Standard, and a Spot tier at 30% off on select models. Generic (non-featured) models
    are priced by parameter size. "US-only serverless" is a 50% premium on select models
    (the US column is 1.5x Standard) and region-restricted on-demand deployments cost 1.5x.
    Read directly from Fireworks'' own pricing docs 2026-11-19; the earlier "effective
    2026-09-01" date for the US premium is no longer stated on the page.

    '
  example_rates:
  - 'Kimi K3 (standard): $3.00/M in, $0.30/M cached-in, $15.00/M out (US: $4.50/$0.45/$22.50)'
  - 'DeepSeek V4.1 Flash: $0.30/M in, $0.006/M cached-in, $1.20/M out'
  - 'GLM-5.3 Flash: $0.15/M in, $0.03/M cached-in, $0.50/M out'
  - 'gpt-oss-120b: $0.15/M in, $0.015/M cached-in, $0.60/M out (no US row)'
data_governance:
  default_retention: 'Zero Data Retention for inference, stated in the binding Terms (Sec 3.6: "we will
    not ... (i) log your Content for human review; or (ii) retain your Content, beyond the time it
    takes to generate Output and deliver that Output to you") and in DPA 4.5. Carve-outs named in
    the contract: the Response API (stores conversation data by default, store=true, up to 30 days,
    store=false disables it), prompt caching (data kept in volatile memory for several minutes per
    the docs), and "any training, fine-tuning, or agent features". The Batch API is also excluded
    from ZDR per the data_handling docs. Usage metadata such as token counts is still logged.'
  trains_on_inputs: never
  zdr_available: yes_default
  zdr_scope_caveats: 'ToS Sec 3.6 (read 2026-11-19): "We will not use your Content to train our own
    models or to improve the Service." The commitment is unconditional in the contract, which is
    stronger than the Privacy Notice''s looser "without your explicit opt-in" wording (the Notice is
    stated not to be a contract). ZDR applies to inference; Sec 3.6 expressly excludes the Response
    API and training, fine-tuning and agent features, and reserves "safety screening tools" on
    Content. DPA 4.5 adds prompt caching to the list of features that retain data and makes ZDR
    conditional on the customer using the service "in accordance with" the ZDR configuration
    documentation. Enterprise account admins can enable a ZDR policy that rejects requests that
    would persist content (docs).

    '
  customer_data_ownership: customer_retains
  outputs_used_to_improve_service: 'no'
  third_party_routing_leakage: 'Serves an overwhelmingly open-weight catalogue on its own
    infrastructure; no closed third-party model routing identified. ToS Sec 11.3 states it uses
    third-party "vendors and hosting partners" for hardware and hosting and disclaims liability
    for their acts, and DPA 6.1 lets it process Covered Data "anywhere" its sub-processors maintain
    facilities, so processing location is not pinned for serverless.

    '
  subprocessors_disclosed: true
  confidentiality: functional_only
  confidentiality_caveats: 'ToS Sec 8 (read 2026-11-19) is a one-directional clause: it defines Confidential
    Information as that "of Fireworks ane [sic] its licensors" and binds only the customer. Customer
    Content (Input, Output) is not named as Confidential Information and Fireworks owes no express duty
    of confidence over it; no clause disclaims confidentiality either. What protects the content is
    functional: customer ownership (Sec 3.2 and 7), a licence limited to providing the Service (Sec
    3.4), no training or improvement use and zero retention (Sec 3.6), and the DPA processor duties.
    This restores the functional_only coding from the first (2026-09-20) pass, which the 2026-09-21
    browser pass had downgraded to unknown only because the document could not be reached. For
    trade-secret material, use an enterprise agreement with an express confidentiality term.
    Sub-processors: DPA 6.2 incorporates a published list at trust.fireworks.ai/subprocessors with 30
    days'' notice of changes and a 10-day objection right. That page is a JavaScript-only Vanta app and
    could not be read, so the names on it (including whether Anthropic appears, as the first pass
    claimed) are unverified. The DPA text itself contains no Schedule 4 and no Anthropic reference.'
compliance:
  soc2: type_ii
  iso_27001: 'yes'
  iso_27701: 'yes'
  hipaa_baa: "yes"
  gdpr_dpa: "yes"
  fedramp: ''
  trust_center_url: https://trust.fireworks.ai/
residency:
  eu_region_available: "yes"
  regions:
  - United States (default for US-only serverless)
  - Europe (on-demand/dedicated deployments; "Quota for US, CANADA, EUROPE, APAC, and single regions
    must be granted by Fireworks")
  - Canada and Asia-Pacific (on-demand/dedicated deployments, same quota gating)
  - GLOBAL multi-region (the only on-demand option available by default)
  sovereign_option: 'Fireworks Sovereign (product page, read 2026-11-19): "Fireworks operates the
    inference engine, and you retain ownership of the environment, cluster, GPUs, and networking",
    inference runs in the customer cluster; offered to Enterprise customers and priced by contract;
    training is "coming soon". It sits alongside the 2025 Virtual Cloud / BYOC option. Not self-serve.'
  region_pinning: "yes"
  cloud_act_exposure: true
  provider_can_restrict_access: 'Fireworks is contractually domiciled in Delaware, USA (ToS
    governing-law clause); standard US jurisdiction (CLOUD Act, export controls) applies even
    to EU/APAC-hosted on-demand workloads.'
reliability:
  sla: 'None in the standard Terms (Sec 14 provides the Service "as is" and "as available"; no uptime or credit clause). The pricing page says enterprise Reserved Throughput includes a "Throughput SLA and 99.9% uptime terms"; those terms are not public and overage above the reservation is not covered.'
  uptime_notes: 'A public status page (status.fireworks.ai, read 2026-11-19) reports "fully operational"
    with 23 tracked serverless endpoints: 22 at 100 percent and the lowest, Kimi K3.1 Pro, at 99.50
    percent over the 90-day window (Aug to Nov 2026), and no listed incidents. No SLA or service-credit
    clause exists in the standard Terms; the enterprise Reserved Throughput SLA is non-public.

    '
  incidents: []
lock_in:
  openai_compatible_api: true
  portability_notes: 'An OpenAI-compatible API (base URL api.fireworks.ai/inference/v1, Chat
    Completions + Completions, re-confirmed 2026-11-19) over a predominantly open-weight catalogue
    keeps workloads portable. A Responses API with MCP support is still not documented on the
    compatibility page. The DPA Sec 11.2 exit right is now confirmed from the DPA text: on request
    within 30 days of expiry Fireworks provides a copy of Covered Data in a commonly used format or a
    self-service download, then deletes all copies (other than Administration Data and Usage Data).

    '
dedicated_availability: self_serve
dedicated_notes: 'Basic on-demand dedicated GPU deployments are self-serve (firectl / REST /
  SDKs / console), billed per-GPU-second (H100 8.00 USD per hour, B200 13.00, GB300 20.00),
  with the GLOBAL multi-region available without a sales gate. The fuller isolation tiers -
  pinned regions (US, Canada, Europe, APAC, which need a quota granted by Fireworks and cost 1.5x)
  and Fireworks Sovereign / Virtual Cloud (customer-cluster deployment) - are enterprise/sales-negotiated,
  so the strongest isolation guarantee is not itself self-serve.'
trust_considerations:
- 'RESOLVED 2026-11-19: the Terms of Service and DPA are readable (both URLs redirect to text PDFs
  on cdn.sanity.io; robots.txt now allows all). The 2026-09-20 browser pass saw noindex and
  ROBOTS_DISALLOWED and recorded them unreachable, and the entry was downgraded on that basis.
  Reading the documents confirms the first code-session pass on ToS Sec 3.6 (Zero Data Retention
  and never-train), Sec 8 (one-directional confidentiality) and Delaware law, and on DPA Sec 11.2
  (30-day return). It does NOT confirm the claimed DPA "Schedule 4" sub-processor list naming
  Anthropic: the DPA has three schedules, no Schedule 4, and no Anthropic reference. The
  sub-processor list is held at trust.fireworks.ai/subprocessors, a JavaScript-only page that
  could not be read.'
- 'The Zero Data Retention clause has contractual carve-outs worth knowing: ToS Sec 3.6 excludes the
  Response API and "any training, fine-tuning, or agent features", DPA 4.5 names prompt caching
  and the Response API (unless store=false), and the docs also exclude the Batch API. Set
  store=false on the Response API if you need zero retention there.'
- 'The Privacy Notice says it does not train "without your explicit opt-in"; the binding Terms say
  Fireworks "will not use your Content to train our own models or to improve the Service" with no
  opt-in route. The Terms govern, so trains_on_inputs is coded never. A fine-tuning or training
  product is a separate feature set outside the inference ZDR commitment.'
- 'SOC 2 Type II and triple ISO certification (27001 / 27701 / 42001) are claimed on Fireworks''
  docs, blogs, pricing page and in DPA Schedule 2 ("annual SOC 2 Type II audits and maintains ISO
  27001, ISO 27701, and ISO 42001 certifications"), but no auditor, certificate or report date was
  read; the Trust Center is JS-gated. Publisher-grade only, so no compliance upgrade.'
- 'There is no SLA in the standard Terms. Enterprise Reserved Throughput advertises a throughput
  SLA and 99.9 percent uptime terms that are not public.'
- Full customer-cluster deployment (Fireworks Sovereign, enterprise, priced by contract) and
  pinned-region on-demand deployments (quota granted by Fireworks) are sales-gated, not
  self-serve; the default self-serve product is serverless plus GLOBAL on-demand.
- US (Delaware) domicile implies standing CLOUD Act exposure even for EU/APAC-hosted on-demand
  workloads, and DPA 6.1 lets Covered Data be processed wherever sub-processors have facilities.
score:
  rubric_version: '1.2'
  headline: 71.6
  grade: B
  hard_flags: []
  dimensions:
    data_governance:
      score: 4
      rationale: 'RE-SCORED 2026-11-19 (3 to 4) after reading the binding Terms and DPA, which the
        2026-09-20 pass could not reach. ToS Sec 3.6 contractually commits that Fireworks "will not
        use your Content to train our own models or to improve the Service" and runs Zero Data
        Retention for inference (no human-review logging, no retention beyond generating and
        delivering Output); Sec 3.2 gives the customer ownership of Content; DPA 4.5 repeats the
        no-retention duty and DPA 6 binds a published sub-processor list with 30 days'' notice and
        an objection right. Held at 4, not 5: retention is bounded but not zero for the Response
        API, prompt caching, Batch and training or fine-tuning features, the contract has no express
        confidentiality duty over Content (functional_only), the sub-processor list itself is
        unreadable (JS-only trust centre) so its names are unverified, and the Privacy Notice and
        Terms differ on opt-in training. The score would fall back to 3 if the list proves
        undisclosed or routes content to a model vendor.

        '
      evidence_refs:
      - ev-tos
      - ev-dpa
      - ev-datahandling
      - ev-privacy-verified
    compliance:
      score: 4
      rationale: 'Fireworks'' own docs certifications FAQ, pricing page and blogs announce SOC 2 Type II
        (2023-10-27) plus HIPAA compliance (BAA on enterprise), and triple ISO certification
        (27001/27701/42001, 2025-11-19); DPA Schedule 2 repeats the SOC 2 Type II and ISO
        27001/27701/42001 claims in a contract. The DPA is a GDPR Art. 28-style processor agreement
        with SCCs Module Two (Irish law) and a UK Addendum, confirming the earlier unverified SCC
        claim. Held below 5 because no auditor, certificate or report date was read and the trust
        centre (trust.fireworks.ai) is a JavaScript-only page that rendered nothing, so the
        attestations are the vendor''s own statements rather than third-party artefacts.

        '
      evidence_refs:
      - ev-blog-soc2hipaa
      - ev-blog-iso
      - ev-trust
      - ev-dpa
    residency:
      score: 3
      rationale: 'On-demand/dedicated deployments can be pinned to US, Canada, Europe or APAC, but
        "Only GLOBAL is available by default" and quota for any pinned region "must be granted by
        Fireworks", with a 1.5x price for region-restricted deployments. A US-only serverless tier
        exists at a 50% premium on select models, and Fireworks Sovereign (customer-cluster
        deployment) is enterprise and by contract. DPA 6.1 lets Covered Data be processed
        "anywhere" Fireworks or its sub-processors have facilities. Held at 3: an EU region exists
        for some workloads but the default is global and EU pinning is sales-gated.

        '
      evidence_refs:
      - ev-ondemand
      - ev-byoc
      - ev-dpa
    security:
      score: 3
      rationale: 'Dedicated workloads run in "logically isolated environments, preventing
        cross-customer access or data leakage" per the data-security docs (re-read 2026-11-19),
        with TLS 1.2+ in transit and AES-256 at rest, least-privilege access controls, and
        customer-managed keys. "Regular penetration testing validates controls." DPA Schedule 2
        lists the technical and organisational measures. Held at 3 rather than 4 because no
        independent pen-test attestation or public bug-bounty programme was found, and the serverless
        multi-tenancy isolation model is not documented (only the dedicated tier is).

        '
      evidence_refs:
      - ev-security-verified
      - ev-dpa
    reliability:
      score: 3
      rationale: 'A public status page (status.fireworks.ai, re-read 2026-11-19) shows 23 tracked
        serverless endpoints with 90-day uptime of 100 percent on 22 and 99.50 percent on the
        lowest (Kimi K3.1 Pro), and no listed incidents. Meets the score-3 anchor (operational
        track record, public status page, SLA absent or informal): the standard Terms (Sec 14) give
        no uptime or credit commitment, and the "99.9% uptime terms" for Reserved Throughput are
        enterprise-only and not public.

        '
      evidence_refs:
      - ev-status
      - ev-tos
    transparency_lockin:
      score: 4
      rationale: 'RE-SCORED 2026-11-19 (3 to 4). An OpenAI-compatible API (Chat Completions and
        Completions) over a predominantly open-weight catalogue keeps workloads portable, and the
        DPA now supplies the documented exit path the 2026-09-20 pass could not confirm: Sec 11.2
        gives a copy of Covered Data (or a self-service download) on request within 30 days of
        expiry, then deletion. Self-serve dedicated deployments and a customer-cluster option add
        control. Held at 4, not 5: sub-processor names are unverified (JS-only list), the
        Responses API is not documented, and the strongest isolation tiers are sales-gated.

        '
      evidence_refs:
      - ev-openai
      - ev-models
      - ev-dpa
    cost:
      score: 4
      rationale: 'Per-token serverless pricing (cached-input rate, Priority tier, a 50% batch
        discount, a 30% spot discount on select models) and per-GPU-second dedicated pricing are all
        public in Fireworks'' own pricing docs (re-read 2026-11-19) and broadly competitive for the
        class (e.g. DeepSeek V4.1 Flash $0.30/$1.20, GLM-5.3 Flash $0.15/$0.50, gpt-oss-120b
        $0.15/$0.60). Held below 5 because of the parameter-size generic-model tiers, the 1.5x US-only
        and region-restricted premiums, and enterprise terms priced by contract.

        '
      evidence_refs:
      - ev-pricing
      - ev-ondemand

