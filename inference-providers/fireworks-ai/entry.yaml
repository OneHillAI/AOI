changelog:
- date: '2026-09-20'
  change: 'Initial entry. Primary-source research: downloaded and parsed the Terms of Service
    and DPA PDFs directly for retention/training/ownership/confidentiality/sub-processor
    clauses; read the data-handling, data-security, on-demand-deployment, pricing and models
    pages directly; corroborated SOC 2/ISO/HIPAA certification via Fireworks'' own blog posts
    (Trust Center portal itself is JS-rendered and was not independently read). Confidentiality
    coded functional_only (one-directional Confidential Information clause; protection rests on
    ownership + purpose-limitation + zero-retention terms instead). Dedicated availability coded
    self_serve for on-demand deployments, with the fuller BYOC/non-default-region tiers flagged
    as sales-gated in dedicated_notes.'
- date: '2026-09-21'
  change: 'CORRECTION - independent Cowork browser verification pass. The initial entry''s claim
    of having downloaded and parsed the Terms of Service and DPA as PDFs could not be
    independently reproduced: a real browser session found both fireworks.ai/terms-of-service and
    fireworks.ai/dpa to be page-level noindexed, returning ROBOTS_DISALLOWED. Per AOI''s
    evidence-first rule, an unverifiable classification is not asserted: confidentiality changed
    from functional_only to unknown, subprocessors_disclosed changed from true to false (the
    Anthropic sub-processor claim is unconfirmed), and trains_on_inputs changed from never to
    opt_in_only (independently corroborated via the Privacy Policy instead of the unreadable
