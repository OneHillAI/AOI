ownership:
  level: substantial
  factors:
    use_modify:   { level: strong,   rationale: "An OpenAI-compatible API (re-confirmed 2026-11-19) over a predominantly open-weight catalogue keeps workloads portable - the same checkpoints run elsewhere or self-hosted, independent of Fireworks' own contract terms." }
    transparency: { level: strong,   rationale: "The Terms of Service (Last Updated 2026-07-10), the DPA (v3.4) and the Privacy Notice are all published and were read in full on 2026-11-19: the Terms and DPA are served as PDFs behind a redirect that the earlier browser pass could not render, so they are legible but not easy to find. Caveats that keep this from being airtight: the sub-processor list and Trust Center are JavaScript-only and unread, and the SOC 2 and ISO attestations are vendor statements with no auditor or certificate date." }
    reliability:  { level: moderate, rationale: "A public status page (re-read 2026-11-19) shows 22 of 23 endpoints at 100 percent and the lowest at 99.50 percent over 90 days with no listed incidents, but the standard Terms carry no SLA or credit clause and the enterprise 99.9 percent uptime terms are not public." }
    data_control: { level: strong,   rationale: "Read from the binding Terms: Fireworks will not use Content to train or improve the Service, runs Zero Data Retention for inference with no human-review logging (Sec 3.6), the customer owns Content (Sec 3.2) and the licence is limited to providing the Service (Sec 3.4); DPA 11.2 gives a 30-day return and then deletion. Exceptions are named in the contract: the Response API, prompt caching and training, fine-tuning or agent features. Residency is not pinned for serverless and the sub-processor list is unread." }
  verdict: "You substantially own inference here: the binding Terms commit Fireworks not to train on or improve the Service with your Content and to run Zero Data Retention for inference, you own the Content, and the DPA gives a 30-day return and deletion right. The contract has no express confidentiality duty over your Content, retention exceptions exist for the Response API (set store=false), prompt caching and fine-tuning, serverless processing is not region-pinned, and the sub-processor list and compliance reports sit behind a JavaScript-only trust centre that could not be read. This reverses the 2026-09-21 downgrade, which rested on the Terms and DPA being unreachable to a browser; they are reachable as PDFs and the first-pass claims about Sec 3.6 and Sec 8 hold, while the claimed DPA Schedule 4 naming Anthropic does not exist in the DPA."

evidence:
