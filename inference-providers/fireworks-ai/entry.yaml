  rubric_version: '1.2'
  headline: 64.8
  grade: C
  hard_flags: []
  dimensions:
    data_governance:
      score: 3
      rationale: 'CORRECTED 2026-09-20 after independent Cowork browser verification could not
        reach the Terms of Service or DPA (both page-level noindexed/ROBOTS_DISALLOWED; the Trust
        Center hosting the DPA is JS-gated). What IS independently confirmed via readable docs
        pages: Zero Data Retention for serverless/dedicated inference (with the Response API
        default-store exception), and via the Privacy Policy, no training on inputs without the
        customer''s explicit opt-in. What is NOT independently confirmed: the exact ToS-level ZDR
        clause, the confidentiality-clause direction, and the DPA''s sub-processor Schedule
        (including a prior claim that Anthropic is a named sub-processor). This matches the
        anchor-3 pattern ("no training by default; ZDR available; retention documented; some
        caveats") rather than anchor 4, which additionally requires sub-processors disclosed and
        routing terms clear - neither is independently established here.

        '
      evidence_refs:
      - ev-datahandling
      - ev-privacy-verified
      - ev-security-verified
    compliance:
      score: 4
      rationale: 'Fireworks'' own docs certifications FAQ and blog announce SOC 2 Type II
        (2023-10-27) plus HIPAA compliance, and a separate blog announces triple ISO
        certification (27001/27701/42001, 2025-11-19) - both independently browser-read; a
        trust centre exists at trust.fireworks.ai. Held below 5 because none of these claims
        name an auditor or a certificate/report date, the trust-centre portal is fully
        JS-gated and was not independently read this pass, and a prior claim that the DPA
        references GDPR SCCs and a UK Addendum could not be independently verified (the DPA
        itself is unreadable - see data_governance).

        '
      evidence_refs:
      - ev-blog-soc2hipaa
      - ev-blog-iso
      - ev-trust
    residency:
      score: 3
      rationale: 'On-demand/dedicated deployments offer a selectable Europe (and
        Asia-Pacific) region with pinning, and a BYOC/Virtual-Cloud option keeps data
        entirely in the customer''s own VPC. Held at 3, not higher, because the EU/APAC
        region selection is gated behind a sales-granted quota rather than self-serve,
        BYOC is enterprise-only, and the existence of a separate "US-only serverless"
        residency tier implies default serverless residency is not itself EU-pinned.

        '
      evidence_refs:
      - ev-ondemand
      - ev-byoc
    security:
      score: 3
      rationale: 'Dedicated workloads run in "logically isolated environments, preventing
        cross-customer access or data leakage" per the data-security docs (independently
        browser-confirmed verbatim), with TLS 1.2+ in transit and AES-256 at rest,
        least-privilege access controls, and customer-managed keys (CMEK). "Regular
        penetration testing validates controls" is now confirmed verbatim. Held at 3 rather
        than 4 because no public bug-bounty programme was found, and the serverless
        multi-tenancy isolation model was not documented in the sources read (only the
        dedicated-tier isolation is described).

        '
      evidence_refs:
      - ev-security-verified
    reliability:
      score: 3
      rationale: 'A public status page (status.fireworks.ai) shows an operational track
        record with per-endpoint 90-day uptime around 99.67-100% and documented incident
        communication. Meets the score-3 anchor (operational track record, public status
        page, informal/absent SLA) - no contractual SLA or service-credit clause was found
        in the standard Terms.

        '
      evidence_refs:
      - ev-status
    transparency_lockin:
      score: 3
      rationale: 'CORRECTED 2026-09-20: an OpenAI-compatible API over a predominantly
        open-weight catalogue keeps workloads portable - the base URL and chat/completions
        support are independently browser-confirmed. Held at 3, not 4, because the two
        supports for the prior 4 (a documented 30-day DPA data-return right, and sub-processors
        disclosed in full) both traced to the DPA, which an independent browser pass could not
        reach (page-level noindexed). Matches the anchor-3 bar (OpenAI-compatible, standard open
        models, portable) without an independently confirmed documented exit path.

        '
      evidence_refs:
      - ev-openai
      - ev-models
    cost:
      score: 4
      rationale: 'Per-token serverless pricing (with a discounted cached-input rate and a
        50% batch discount) and per-GPU-second dedicated pricing are both public and
        documented in detail, read directly from Fireworks'' own pricing docs, and are
        broadly competitive for the class (e.g. DeepSeek V4.1 Flash $0.30/$1.20, GLM-5.3
        Flash $0.15/$0.50). Held below 5 because of the added complexity of the
        parameter-size generic-model tiers and the 1.5x "US-only serverless" premium.

        '
      evidence_refs:
      - ev-pricing
      - ev-ondemand

