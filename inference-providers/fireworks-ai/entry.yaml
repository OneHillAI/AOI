    OpenAI-compatibility docs page, which the browser session DID independently confirm for base
    Chat Completions/Completions support - upgraded that evidence to retrieved:true). Scores
    changed: data_governance 4->3, transparency_lockin 4->3 (71.6 -> 64.8; grade B -> C).
    Ownership level: substantial->partial. What survived independent
    verification: the Response API retention exception, ZDR for other services, security posture
    (encryption/isolation/pen-testing, now confirmed verbatim), and the publisher-grade
    SOC2/ISO/HIPAA claims (still not independently certificate-verified). See
    docs/primary-sources/fireworks-ai/browser-verified/ for the full capture.'
- date: '2026-11-19'
  change: 'Freshness re-verification with the Terms of Service and DPA now READ. Both fireworks.ai/terms-of-service and fireworks.ai/dpa answer with an HTTP 308 redirect to a text PDF on cdn.sanity.io (robots.txt allows all), so the 2026-09-20 "page-level noindexed, unreachable" finding was a limit of the browser route; the clause text decodes. Confirmed from the Terms (Last Updated 2026-07-10): Sec 3.6 Zero Data Retention and never-train, Sec 3.2 customer ownership, Sec 3.4 purpose-limited licence, Sec 8 one-directional confidentiality, Sec 16.1 Delaware law; from the DPA (v3.4): processor role, 4.5 retention (Response API and prompt caching named), 6.2 sub-processors by reference to a published list with 30 days notice, 10.1 48-hour breach notice, 11.2 30-day return then deletion, SCCs Module Two plus UK Addendum. NOT confirmed: the first-pass claim of a DPA Schedule 4 naming Anthropic (the DPA has three schedules and no Anthropic reference; the real list is on a JavaScript-only trust-centre page, still unread). Field changes: trains_on_inputs opt_in_only to never (contract is stronger than the Privacy Notice), confidentiality unknown to functional_only, subprocessors_disclosed false to true (disclosure mechanism read, names unverified). Scores: data_governance 3 to 4 and transparency_lockin 3 to 4 (reversing the 2026-09-21 downgrades whose cause was the unreachable documents); other dimensions unchanged with updated rationale. Headline and grade recomputed by score.py; ownership level partial to substantial (transparency moderate to strong, data_control moderate to strong). Also re-read: pricing (Priority, spot and region-restricted tiers added; US premium now 1.5x on select models, no effective date shown), catalogue (Kimi K3.1 Pro, MiniMax M3.1 Flash, Muse Spark Open, Ember-1, Rune, Ultramarine 1 Flash added), on-demand regions (GLOBAL default, US/Canada/Europe/APAC need granted quota), Fireworks Sovereign (enterprise, by contract), status (23 components, lowest 99.50 percent, no incidents), data-handling docs (Batch API and prompt caching exclusions added). Trust Center and sub-processor list still JavaScript-only (retrieved false). Extracts under docs/primary-sources/fireworks-ai/ dated 2026-11-19.'
