documentation:
  assess:
    completeness: 80.8
    originality: 0.0
    items:
      - key: data-governance
        title: "Data governance - retention, ZDR & training"
        doc_type: reference
        source_type: aggregated
        coverage: full
        refs: [ev-terms, ev-dpa, ev-yourdata]
        summary: "Per the Groq Services Agreement (2026-06-22) and the your-data docs, inference is not retained by default. Inputs and outputs may be logged for up to 30 days when troubleshooting or investigating abuse unless ZDR is on. Groq may not use Inputs/Outputs to train or fine-tune models. The docs say ZDR is available to all customers, though the agreement says 'Eligible Customers'. Batch retains files 30 days and fine-tuning retains weights/datasets until deleted, both in US GCP storage."
      - key: data-ownership
        title: "Data & IP ownership"
        doc_type: reference
        source_type: aggregated
        coverage: full
        refs: [ev-terms, ev-dpa]
        summary: "The Services Agreement states the customer retains all IP rights in Customer Data, Inputs and Outputs, and that Groq does not access/store/retain Inputs or Outputs except to provide the service. The customer's data and derived knowledge stay with the customer. The DPA discloses a published sub-processor list (trust.groq.com/subprocessors) with a 15-day objection right. Batch (30-day) and fine-tuning features retain data in US GCP storage until deleted."
      - key: compliance
