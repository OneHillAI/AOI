        title: "Fine-tuning / custom models"
        doc_type: reference
        source_type: aggregated
        coverage: partial
        refs: [ev-yourdata, ev-terms]
        summary: "A fine-tuning feature exists. Per the your-data docs and Services Agreement it retains weights/datasets until the customer deletes them (US GCP storage). Its scope (methods, formats, supported models) is not documented in public sources."
      - key: context-limits
        title: "Context & token limits"
        doc_type: reference
        source_type: gap
        gap_reason: "Groq does not publish per-model maximum context and token limits on its endpoints; they track each served model's native window and should be confirmed on the model's Groq page."
  support:
    completeness: 57.1
    originality: 0.0
    items:
