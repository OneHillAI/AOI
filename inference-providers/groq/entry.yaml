# OneHill v2 INFERENCE-PROVIDER library entry for Groq. Replaces data.yaml.
# Validated against schema/inference-provider.v2.schema.json.
#   scores  -> scripts/score.py --write        (provider AOI - carried over unchanged)
#   meters  -> scripts/completeness.py --write  (per-domain completeness/originality)
#   prose   -> assess.md / implement.md / use.md / support.md (sections keyed <!-- item: KEY -->)

schema_version: '2.0'
id: groq
name: Groq
profile: inference
hq_country: United States
summary: "A US-headquartered inference provider that runs open models on custom LPU hardware for very low latency and serves a narrow, fast-changing catalogue. The self-serve (free and developer tier) production text models are gpt-oss 120B and 20B plus Whisper. Qwen3.8-27B, gpt-oss-safeguard, Orpheus TTS and Prompt Guard are in preview. Llama 3.1 8B and Llama 3.3 70B were retired for self-serve on 2026-08-16 and survive only on enterprise contracts. The R1 distill, Gemma, Mixtral and Qwen3-32B models are gone. The binding Groq Services Agreement (last modified 2026-06-22) and DPA (2025-10-15) give the customer all IP in Inputs and Outputs, bar Groq from training on them, and add a mutual confidentiality clause naming Customer Data. Inference is not retained by default. The docs say inputs and outputs may be logged for up to 30 days when troubleshooting or investigating abuse unless ZDR is switched on. The biggest caveats are that batch and fine-tuning features retain data in US GCP storage, the catalogue is narrow, and the EU footprint (Finland, with a London site) has no customer-selectable region-pinning clause while the DPA permits US processing. A public status page exists. The trust centre and sub-processor list are JavaScript-only and unreadable."
models_served:
- gpt-oss 120B and 20B (production, self-serve)
- gpt-oss-safeguard 20B (preview)
- Qwen3.8-27B (preview)
- Whisper large v3 and v3 turbo (speech to text); Orpheus TTS (preview)
- Llama Prompt Guard 2 22M and 86M (preview)
- Llama 3.1 8B Instant and Llama 3.3 70B Versatile (enterprise contract only since 2026-08-16)
- Muse Spark Open (Meta) and MiniMax M2.7 (preview, contact sales)
hardware: Custom LPU racks (lock-in signal; open models remain API-portable); Groq site copy now mentions LPX racks linked to NVIDIA hardware once released
pricing:
  model: per-token
  notes: 'Per-token pricing with a rate-limited free/developer tier. Rates come from the docs models
    page, and groq.com/pricing redirects to the home page. Llama 3.1 8B and Llama 3.3 70B are
    "Contact Sales".

    '
  example_rates:
  - 'gpt-oss-120B: $0.15/M in, $0.60/M out'
  - 'gpt-oss-20B: $0.075/M in, $0.30/M out'
  - 'Qwen3.8-27B (preview): $0.80/M in, $4.00/M out'
  - 'Whisper large v3: $0.111 per hour'
data_governance:
  default_retention: 'Inference is not retained by default. The your-data docs add that inputs and
    outputs may be logged for up to 30 days when troubleshooting platform errors or investigating suspected
    abuse, unless ZDR is enabled. Batch input/output files are kept 30 days unless deleted, fine-tune
    weights and datasets until the customer deletes them, and all retained data sits in US GCP buckets.
    On termination Customer Data is deleted within 30 days (Services Agreement Sec 11.5).'
  trains_on_inputs: never
  zdr_available: yes_optional
  zdr_scope_caveats: 'Enabling ZDR stops the 30-day reliability and abuse logs and disables persistence
    features (batch, LoRA and fine-tune storage). The your-data docs say all customers may enable ZDR in
    Data Controls, but Services Agreement Sec 4.2 (last modified 2026-06-22) limits it to "Eligible
    Customers", a term defined in neither the agreement nor the DPA, so check eligibility before relying
    on it.

    '
  customer_data_ownership: customer_retains
  outputs_used_to_improve_service: "no"
  third_party_routing_leakage: 'Serves open-weight models on its own hardware; no closed third-party model
    routing found. Services Agreement Sec 3.7 and 4.1 allow Third-Party Offerings with their own terms,
    and Groq may tell the model provider about your usage, but not Customer Data.

    '
  subprocessors_disclosed: true
  confidentiality: mutual
  confidentiality_caveats: 'Services Agreement Sec 10 is a mutual confidentiality clause: Customer
    Data is expressly the customer''s Confidential Information, protected with "reasonable care" and
    disclosed only to representatives under equivalent written confidentiality obligations, with
    standard carve-outs. Two watch-outs: the Customer-Data-as-confidential sentence is drafted
    conditionally, and the Sec 8.3 feedback clause lets Groq use anything framed as "feedback"
    without restriction. Free/beta-tier liability is capped at $5,000, so the remedy behind the
    promise is thin off paid/enterprise terms.'
compliance:
  soc2: type_ii
  iso_27001: unknown
  iso_27701: unknown
  hipaa_baa: "yes"
  gdpr_dpa: "yes"
  fedramp: ''
  trust_center_url: https://trust.groq.com/
residency:
  eu_region_available: "yes"
  regions:
  - United States (default; retained data is stored in US GCP buckets)
  - Finland (EU-1, Vantaa; launched as Helsinki in July 2025) and United Kingdom (EU-2, London)
  - Canada, Australia and Saudi Arabia sites also listed on the platform page
  sovereign_option: 'Equinix Fabric sovereign infrastructure referenced in the Helsinki
    launch; not independently verified as a contracted sovereign tier.'
  region_pinning: unknown
  cloud_act_exposure: true
  provider_can_restrict_access: 'US-headquartered (Groq LLC for most customers); EEA and Swiss customers
    contract with Groq UK Limited, and Saudi customers with Groq Limited. The DPA states Personal Data may
    be Processed in the United States and other countries, so US jurisdiction (CLOUD Act, export controls)
    is a standing switch-off and access consideration. Groq may terminate for convenience on 30 days'' notice
    (Sec 11.3).'
reliability:
  sla: ''
  uptime_notes: 'A public status page exists (groqstatus.com, incident.io): "fully
    operational" on 2026-11-19, Aug to Nov 2026 uptime 100% for the API and all six production model
    components, 99.98% across seven preview components. No SLA is published; the Services Agreement
    mentions service level commitments only as a paid add-on.'
  incidents: []
lock_in:
  openai_compatible_api: true
  portability_notes: 'OpenAI-compatible API (base URL https://api.groq.com/openai/v1)
    and open-weight models keep workloads portable at the API level, but the custom
    LPU hardware and a narrower/curated catalogue (no full DeepSeek/GLM/Mistral or arbitrary
    fine-tunes) are lock-in/coverage considerations.

    '
dedicated_availability: enterprise_only
dedicated_notes: 'Dedicated options are enterprise, sales-negotiated: GroqMetal (dedicated bare
  metal), GroqRack (on-prem hardware) and private Equinix connectivity. No public contract terms
  exist for these, so the isolation guarantee is whatever is negotiated; the standard GroqCloud API
  is shared.'
trust_considerations:
- "Batch (30-day) and fine-tuning retention default to US GCP storage even though inference is not retained. Inference may also be logged for up to 30 days for troubleshooting or abuse investigation unless ZDR is on (your-data docs)."
- "The EU footprint (Finland, with a London site) has about 16 months of track record but carries no customer-selectable region-pinning clause. Default storage is US and the DPA permits US processing."
- "The catalogue is narrow and shifting: Llama 3.1 8B and 3.3 70B went enterprise-only on 2026-08-16, and most earlier models (R1 distill, Gemma, Mixtral, Qwen3-32B) were retired. Preview models can be withdrawn at short notice and sit outside the BAA."
- "Custom LPU hardware and a narrower catalogue limit model coverage relative to GPU providers."
- "Region pinning is unconfirmed."
- "US HQ implies standing CLOUD Act exposure, and the DPA permits US processing."
- "Services Agreement Sec 10 gives a mutual confidentiality duty over Customer Data (reasonable-care standard), a contractual protection beyond the retention and training terms."
- 'ZDR is described as available to "all customers" in the docs, but the agreement limits it to undefined "Eligible Customers". Free/beta-tier liability is capped at $5,000, and anything framed as "feedback" (Sec 8.3) may be used by Groq without restriction.'
- "Dedicated hardware (GroqMetal bare metal) exists but is enterprise-negotiated with no public contract terms. The standard GroqCloud API is shared."
- "The trust centre (SOC 2 claim, sub-processor list) is a JavaScript-only page that cannot be read, and the SOC 2 report is gated. SOC 2 is a claim."
score:
  rubric_version: '1.2'
  headline: 72.4
  grade: B
  hard_flags: []
  dimensions:
    data_governance:
      score: 4
      rationale: 'The binding Groq Services Agreement (last modified 2026-06-22) and DPA (2025-10-15) state that the customer retains all IP in Inputs/Outputs and that Groq may not use Inputs/Outputs to train or fine-tune models (Sec 4.2, all tiers). A mutual confidentiality clause (Sec 10) treats Customer Data as the customer''s Confidential Information. This is a strong standard-terms posture. Inference is not retained by default, though the your-data docs allow up-to-30-day troubleshooting and abuse logs unless ZDR is on. The score is below 5 because those logs and the batch (30-day) and fine-tuning retention sit in US GCP storage, the DPA permits US processing (CLOUD Act exposure), and the agreement limits ZDR to undefined "Eligible Customers".'
      evidence_refs:
      - ev-terms
      - ev-dpa
      - ev-yourdata
    compliance:
      score: 4
      rationale: "The DPA covers GDPR, UK and Swiss transfers via deemed-signed SCCs and points to a sub-processor list. A HIPAA BAA is offered for generally available services. SOC 2 Type II is a trust-centre claim: trust.groq.com is a JavaScript-only page that cannot be read, so the claim is unconfirmed. The score is below 5 because the SOC 2 report itself is gated and ISO 27001/27701 is unconfirmed."
      evidence_refs:
      - ev-trust
      - ev-dpa
      - ev-baa
    residency:
      score: 3
      rationale: 'EU capacity exists (Vantaa, Finland, launched as Helsinki in July 2025, plus a London site per the platform page), satisfying the "EU region available" anchor. The score is 3 because neither the Services Agreement nor the DPA has a customer-selectable region-pinning clause, the docs say all retained customer data is stored in US GCP buckets, and the DPA expressly permits US processing.'
      evidence_refs:
      - ev-eudc
      - ev-dpa
      - ev-yourdata
    security:
      score: 4
      rationale: "SOC 2 Type II controls per the trust-centre claim, DPA Annex II measures (ZTNA, subprocessor assessments, regular security and vulnerability testing), a private HackerOne vulnerability programme (groq.com/security), and ZDR/Data Controls documented in the Services Agreement and docs. The score is below 5 because no independently reviewed pen-test is surfaced, the SOC 2 report is gated and the trust centre is unreadable."
      evidence_refs:
      - ev-trust
      - ev-terms
      - ev-dpa
      - ev-status
    reliability:
      score: 3
      rationale: 'A public status page exists (groqstatus.com, incident.io) showing Aug to Nov 2026 uptime of 100% for the API and the six production model components and 99.98% for preview models, with a "fully operational" banner. That meets the score-3 anchor (public status page and operational record). The score is 3 because no SLA is published (service level commitments are a paid add-on), there is no service-credit or failover documentation, and the self-serve catalogue changes quickly.'
      evidence_refs:
      - ev-status
      - ev-terms
    transparency_lockin:
      score: 3
      rationale: "An OpenAI-compatible API over open-weight models keeps workloads portable. Custom LPU hardware and a narrow, shifting catalogue (Llama models now enterprise only; arbitrary fine-tunes and larger open models absent) limit coverage and add lock-in."
      evidence_refs:
      - ev-openai
      - ev-models
    cost:
      score: 4
      rationale: "Per-token rates on the docs models page are low (gpt-oss-120B $0.15/$0.60, gpt-oss-20B $0.075/$0.30, Qwen3.8-27B $0.80/$4.00), and the developer tier is rate-limited (250K TPM, 1K RPM for gpt-oss). Pricing is clear and public for the self-serve models. The Llama models are contact-sales, and groq.com/pricing redirects to the home page."
      evidence_refs:
      - ev-models
      - ev-ratelimits

# --- Four documentation domains. Item keys match checklists/inference-provider.yaml and a
#     `<!-- item: KEY -->` section in the domain .md (except gap items).
#     completeness/originality are written by scripts/completeness.py --write.
#     Every credited item is `aggregated` (public source, >=1 ref); OneHill has run nothing,
