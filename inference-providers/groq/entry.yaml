changelog:
- date: '2026-07-25'
  change: Initial entry.
- date: '2026-07-25'
  change: Migrated to v2 four-domain library format (added documentation block; score
    carried over unchanged).
- date: '2026-07-25'
  change: 'Primary-source grounding pass. Read Groq''s Services Agreement (terms), DPA and BAA,
    the your-data / OpenAI-compat / supported-models / rate-limits / deprecation docs, the trust
    centre, the Helsinki EU-DC newsroom and the pricing page via search extraction; added
    doc_type/retrieved to all evidence and reframed retention/training/ownership onto the binding
    Services Agreement + DPA. Corrected subprocessors_disclosed to true (DPA publishes a list) and
    converted the deprecation gap to a documented item. SOC 2 report and sub-processor list
    contents remain retrieved:false. Scores unchanged; data_control ownership factor raised to
    strong now that the binding terms were actually read.'
- date: '2026-08-06'
  change: 'Confidentiality + dedicated-availability pass (OpenSpec provider-confidentiality-dedicated,
    rubric 1.2). Re-read the Services Agreement (eff. 2026-06-22): added Sec 10 mutual confidentiality
    over Customer Data, the Sec 8.3 feedback clause, the $5,000 free/beta liability cap, and the "all
    customers (docs) vs Eligible Customers (contract)" ZDR discrepancy. Added confidentiality: mutual
    and dedicated_availability: enterprise_only (GroqMetal/GroqRack). No dimension score changed - the
    Sec 10 confidentiality positive is offset by the ZDR-eligibility caveat; data_governance stays 4.'
- date: '2026-09-21'
  change: 'Freshness re-verification. Sec 10.1 mutual confidentiality clause re-read verbatim, unchanged, on the same Services Agreement version (Last Modified 2026-06-22) underlying the prior grounding - still the entry''s differentiating strength. Sec 4.2 training prohibition re-confirmed unchanged. The "Eligible Customers" ZDR-eligibility gap persists: that term remains undefined in both the Services Agreement and the DPA (Effective 2025-10-15), so ZDR is not universally self-serve per the contract text. Trust Center (trust.groq.com) remains Vanta-gated; SOC 2 stays claim-grade (secondary corroboration only) pending a direct certificate read - no compliance upgrade. Residency wording corrected below: the Helsinki EU data centre now has an approximately 14-month track record (launched 2025-07-06), no longer accurately described as "very recent" - but no customer-selectable region-pinning clause exists in the Services Agreement or DPA (which still permits US transfer), so residency stays at 3 per the research''s own explicit caution against over-crediting D3 on track-record length alone. No incidents since Aug 2026. No score change; grade holds at B.'
- date: '2026-11-19'
  change: 'Freshness re-verification (59 days past the fast-moving SLA), real re-read of live sources. Services
    Agreement (Last Modified 2026-06-22), DPA, BAA and AUP (all 2025-10-15) re-read: no clause changed, Sec 4.2
    no-training, Sec 10 mutual confidentiality and the undefined "Eligible Customers" ZDR gap are as before. The
    AUP, which earlier passes could not read, is now read (ev-aup retrieved). New facts: the your-data docs say
    inference inputs and outputs may be logged up to 30 days for troubleshooting or abuse unless ZDR is on
    (default_retention and trust_considerations updated, data_governance stays 4); the catalogue moved again -
    Llama 3.1 8B and 3.3 70B retired for free and developer tiers on 2026-08-16 and now contact-sales, R1 distill,
    Gemma, Mixtral and Qwen3-32B retired, gpt-oss 120B/20B now the self-serve production models, Qwen3.8-27B
    and others in preview - and prices refreshed from the docs models page because groq.com/pricing now
    redirects to the home page; a public status page exists (groqstatus.com), earlier passes recorded none
    (reliability 2 -> 3, headline 70.0 -> 72.4, grade B unchanged); EU capacity now listed as Vantaa
    (Finland) plus London, EEA customers contract with Groq UK Limited. Ownership level unchanged
    (substantial). Not readable: trust.groq.com and its sub-processor list (JavaScript-only, retrieved false),
    so the SOC 2 claim is not re-confirmed and no compliance score was changed on it; the SOC 2 report is
    gated. last_verified bumped because every fast-moving field that can be read was re-checked.'
