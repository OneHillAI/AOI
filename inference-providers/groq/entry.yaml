        source_type: aggregated
        coverage: partial
        refs: [ev-status]
        summary: "A public status page (groqstatus.com, incident.io) shows per-model uptime for Aug to Nov 2026 (API 100%, production components 100%, preview components 99.98%). No SLA or service credits are published; the page's history URL returned 404."
ownership:
  level: substantial
  factors:
    use_modify:   { level: strong,   rationale: "An OpenAI-compatible API (base URL https://api.groq.com/openai/v1) over open-weight models keeps workloads portable, since the same checkpoints run elsewhere or self-hosted, and the Services Agreement confirms the customer retains all IP in Inputs/Outputs. The custom LPU and a narrow, shifting catalogue are coverage limits and do not block exit." }
    # grounded in: ev-openai (docs, retrieved), ev-terms (terms, retrieved: customer retains IP)
    transparency: { level: moderate, rationale: "The governing Services Agreement, DPA, BAA and AUP are legible and state customer IP retention, never-train, retention windows and the sub-processor list location. The sub-processor list and trust centre are JavaScript-only and unreadable, the SOC 2 report is gated, and ISO 27001 and region pinning are unconfirmed." }
    # grounded in: ev-terms, ev-dpa, ev-baa, ev-aup (binding docs retrieved); trust centre unreadable
    reliability:  { level: moderate, rationale: "A public status page shows 100% uptime for the API and production models for Aug to Nov 2026, but no SLA is published (service level commitments are a paid add-on) and the self-serve catalogue turns over quickly." }
    # grounded in: ev-status (status page), ev-terms (SLA add-on wording)
    data_control: { level: strong,   rationale: "The binding Services Agreement states the customer retains IP in Inputs/Outputs, Groq may not train on them, and Inputs/Outputs are not accessed, stored or retained except to provide the service. The your-data docs confirm no default inference retention and ZDR for all via Data Controls. Caveats: up-to-30-day troubleshooting and abuse logs unless ZDR is on, and the opt-in batch (30-day) and fine-tuning features retain data in US GCP storage." }
    # grounded in: ev-terms (terms, retrieved: customer IP + never-train + no-retain), ev-yourdata (docs, retrieved: no default retention + ZDR)
  verdict: "You substantially own low-latency inference here. The Groq Services Agreement (last modified 2026-06-22) and the your-data docs confirm you keep all IP in Inputs/Outputs, Groq never trains on your data, inference is not retained by default, and ZDR is available via Data Controls. The OpenAI-compatible API gives a portable exit. The level falls short of full for four reasons. Inference can be logged for up to 30 days for troubleshooting or abuse unless ZDR is on. The opt-in batch and fine-tuning paths retain data in US GCP storage. The SOC 2 report, trust centre and ISO posture are unverified. The US HQ (DPA permits US processing) carries CLOUD Act exposure. Turn on ZDR, keep sensitive data out of the batch and fine-tuning paths, and use an EU-sovereign provider if you need mature EU residency."

# --- Evidence. Each item carries `doc_type` (which kind of primary document) and `retrieved`
#     (true = the document's substantive content was obtained; false = documented or known but
#     its content was not obtained). console.groq.com, groq.com and groqstatus.com are server-rendered.
#     trust.groq.com is a JavaScript-only single-page app, so the SOC 2 claim, the gated SOC 2 report
#     and the sub-processor list contents are retrieved:false.
evidence:
- id: ev-yourdata
  claim: "Your Data in GroqCloud docs: by default Groq does not retain customer data for inference requests. Inputs and outputs may be logged for up to 30 days only when troubleshooting errors or investigating suspected abuse, and ZDR stops that. Groq is not permitted to use Inputs or Outputs to train or fine-tune AI Model Services or other models. Batch input/output files are retained 30 days unless deleted, and fine-tuning weights/datasets are retained until deleted. All customers may enable ZDR in Data Controls. All retained customer data sits in US GCP buckets with SCCs for transfers."
  source_type: publisher
  doc_type: docs
  retrieved: true
  url: https://console.groq.com/docs/your-data
  date: '2026-11-19'
- id: ev-terms
  claim: "Groq Services Agreement (Last Modified 2026-06-22). The Customer retains all Intellectual Property Rights in Customer Data (including Inputs and Outputs). Sec 4.2: Groq is not permitted to use Inputs or Outputs for training or fine-tuning any AI Model Services or other models (all tiers, free included) unless the Customer grants permission. Groq does not access/store/retain Inputs/Outputs except to provide the Cloud Services, and on termination Customer Data is deleted within 30 days. Sec 10 is a mutual confidentiality clause, and the definitions state Customer Data is considered Customer's Confidential Information (subject to the carve-out sentence before it), protected with 'reasonable care'. Sec 8.3: feedback may be used without restriction. Liability is capped at fees paid in the prior 12 months, and at $5,000 for beta / free Cloud Services. The docs say all customers may enable ZDR, but the agreement limits it to undefined 'Eligible Customers'. EEA and Swiss customers contract with Groq UK Limited. Service level commitments are mentioned only as a paid add-on."
  source_type: publisher
  doc_type: terms
  retrieved: true
  url: https://console.groq.com/docs/legal/services-agreement
  date: '2026-11-19'
- id: ev-dpa
  claim: "GroqCloud Data Processing Addendum (Effective 2025-10-15). It covers GDPR/CCPA/PDPL, and the EU SCCs, UK Addendum and Swiss terms are deemed signed. Groq maintains a sub-processor list at trust.groq.com/subprocessors (unreadable) with a 15-day objection right. Personal Data may be transferred to and Processed in the United States and other countries. Deletion on request takes place within 180 days. Annex II security measures: ZTNA, subprocessor assessments, regular security testing."
  source_type: publisher
  doc_type: dpa
  retrieved: true
  url: https://console.groq.com/docs/legal/customer-data-processing-addendum
  date: '2026-11-19'
- id: ev-baa
  claim: "GroqCloud Business Associate Addendum (Effective 2025-10-15) supplements the Services Agreement. Groq acts as business associate/subcontractor for PHI for Covered Cloud Services, which exclude beta, preview and not-generally-available features."
