        summary: "Per-token rates on the docs models page: gpt-oss-120B $0.15/$0.60, gpt-oss-20B $0.075/$0.30, Qwen3.8-27B $0.80/$4.00. Llama 3.1 8B and 3.3 70B are contact-sales. groq.com/pricing redirects to the home page. The developer tier is rate-limited (250K TPM, 1K RPM for gpt-oss)."
      - key: reliability
        title: "Reliability posture"
        doc_type: reference
        source_type: aggregated
        coverage: partial
        refs: [ev-status]
        summary: "A public status page (groqstatus.com) shows Aug to Nov 2026 uptime of 100% for the API and six production model components and 99.98% for preview models. No SLA is published; service level commitments are a paid add-on."
