        refs: [ev-deprecation]
        summary: "A published deprecation process: email and docs announcement, a transition phase, optional automatic upgrade, then end of life. Production models get a migration path and replacement, and preview models may be withdrawn at short notice. Recent history shows frequent retirements (Llama pair for free and developer tiers on 2026-08-16, Compound on 2026-09-21), with enterprise committed-spend contracts exempt."
