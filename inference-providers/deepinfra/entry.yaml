      - key: channels
        title: "Support & community channels"
        doc_type: reference
        source_type: aggregated
        coverage: partial
        refs: [ev1]
        summary: "Product documentation exists (deepinfra.com/docs); support-tier response commitments and community-channel breadth were not detailed in the sources reviewed."
      - key: status-uptime
        title: "Status page & uptime history"
        doc_type: reference
        source_type: gap
        gap_reason: "No public status page or verified uptime/SLA history was found for DeepInfra; reliability is asserted but not independently observable."
      - key: deprecation
        title: "Model deprecation policy"
        doc_type: reference
        source_type: gap
        gap_reason: "No published model-deprecation or end-of-life policy was surfaced; because most of the catalogue is open-weight, a removed model can generally be self-hosted, but no formal notice window is documented."

ownership:
  level: partial
  factors:
    use_modify:   { level: strong,   rationale: "OpenAI-compatible API over ~77-90+ portable open-weight checkpoints on NVIDIA GPUs - the same models run elsewhere or self-hosted, so switching cost for the open catalogue is low." }
      # grounded in: ev6 (served catalogue + OpenAI-compatible API, third_party)
    transparency: { level: moderate, rationale: "The Terms and data-privacy docs are legible and the open catalogue is clear, but re-selling closed models under other vendors' terms adds routing opacity, sub-processors are undisclosed, and the SOC 2 Type designation sits on an unretrieved trust centre." }
      # grounded in: ev2 (privacy_policy, retrieved), ev7 (terms, retrieved), ev3 (security, not retrieved)
    reliability:  { level: moderate, rationale: "SOC 2 and ISO 27001 certification give baseline controls, but the Type designation is unverified and no public uptime SLA, status page or independent pen-test was found." }
      # grounded in: ev1 (docs, retrieved - no SLA), ev3 (security, not retrieved)
    data_control: { level: moderate, rationale: "For DeepInfra's own open-model serving the retrieved Terms and data-privacy docs confirm zero-retention, no-training and customer-retained IP (customer_retains). It falls short of strong because closed models (Claude, Google) re-sold through it are transferred to those vendors under their storage/training terms, sub-processors are undisclosed, and residency is US-only with CLOUD Act exposure." }
      # grounded in: ev7 (terms, retrieved - IP retention), ev2 (privacy_policy, retrieved - no-train + closed-model routing), ev5 (docs, retrieved - US-only)
  verdict: "You substantially control your data on DeepInfra's own open-model serving: the retrieved Terms let you keep IP over your Submissions, and zero-retention plus no-training keep inputs and outputs yours, with the open checkpoints a clean portable exit. Ownership is capped at partial because that control is not uniform - the re-sold closed models (Claude, Google) are transferred to those vendors and carry their data terms rather than DeepInfra's, so route no sensitive data through them - and US-only residency rules it out where EU data sovereignty is required."

