# OneHill v2 INFERENCE-PROVIDER library entry for DeepInfra. Replaces data.yaml.
# Validated against schema/inference-provider.v2.schema.json.
#   scores  -> scripts/score.py --write        (provider AOI - carried over unchanged)
#   meters  -> scripts/completeness.py --write  (per-domain completeness/originality)
#   prose   -> assess.md / implement.md / use.md / support.md (sections keyed <!-- item: KEY -->)

schema_version: '2.0'
id: deepinfra
name: DeepInfra
profile: inference
hq_country: United States
summary: 'A US-headquartered, low-cost inference provider serving ~77-90+ open models
  (Llama 3.x/4.x, DeepSeek V3/V3.2/V4 variants, Qwen3, Kimi K2, GLM-5, gpt-oss-120B,
  MiniMax-M2, Nemotron, Gemma) over pay-as-you-go per-token pricing plus by-the-hour
  dedicated GPUs, and is among the cheapest providers available. Its standout fact
  is aggressive cost with a zero-retention policy; the biggest caveat is that its
  zero-retention covers only its own open-model serving, while closed models (Anthropic
  Claude, Google) routed through it fall under those vendors'' terms - and no EU data-residency
  option was surfaced.

  '
models_served:
- Llama 3.x / 4.x
- DeepSeek V3 / V3.2 / V4 variants
- Qwen3
- Kimi K2
- GLM-5
- gpt-oss-120B
- MiniMax-M2
- Nemotron
- Gemma
- '(also re-sells some closed models: Anthropic Claude, Google)'
hardware: NVIDIA GPU (+ per-hour dedicated GPU instances)
pricing:
  model: mixed
  notes: 'Among the cheapest providers: pay-as-you-go per-token plus dedicated GPU
    by the hour. Rates are approximate (third-party research).

    '
  example_rates:
  - 'Llama 3.1 8B: ~$0.02/M'
  - 'Llama 3.3 70B: ~$0.35/M'
  - 'gpt-oss-120B: ~$0.08/M (blended)'
  - 'GPU/hr: A100 $0.89, H100 $1.79, H200 $2.19, B200 $2.79'
data_governance:
  default_retention: zero-retention for inputs/outputs; batch may store data temporarily
    (encrypted on disk) then delete after inference
  trains_on_inputs: never
  zdr_available: yes_default
  zdr_scope_caveats: 'Batch requests may store data temporarily, encrypted on disk, and delete
    it after inference. Beyond batch, the ToS permits storing Submissions (content) "for a limited
    time for the purpose of debugging" with no numeric limit, and the content licence has an "other
    internal uses only" tail - so "zero retention" is not absolute. There is no ZDR toggle.
    Zero-retention covers DeepInfra''s OWN open-model serving only.

    '
  customer_data_ownership: customer_retains
  outputs_used_to_improve_service: "no"
  third_party_routing_leakage: 'When using Google or Anthropic (closed) models THROUGH
    DeepInfra, data is subject to THAT vendor''s storage and training policy - DeepInfra''s
    Terms state it transfers data to those endpoints to fulfil the request, and its
    zero-retention/no-training does NOT extend to third-party model routing. This is a
    key finding, grounded in the Terms of Service and the data-privacy documentation.

    '
  subprocessors_disclosed: false
  confidentiality: functional_only
  confidentiality_caveats: 'No confidentiality clause; the ToS states only that Submissions "will
    remain private" (a privacy statement, not a duty of confidence). Read 2026-08-06, two soft spots
    beyond it: the no-store/no-train commitment carries an open-ended debugging carve-out - "We might
    store some Submissions for a limited time for the purpose of debugging our Services" with no
    numeric limit (Submissions = content, not only metadata) - and the content licence has an
    "other internal uses only" tail. For trade-secret material, negotiate an NDA/enterprise terms.'
compliance:
  soc2: type_i
  iso_27001: "yes"
  iso_27701: unknown
  hipaa_baa: unknown
  gdpr_dpa: "no"
  fedramp: ''
  trust_center_url: https://trust.deepinfra.com/compliance
residency:
  eu_region_available: "no"
  regions:
  - United States
  sovereign_option: ''
  region_pinning: unknown
  cloud_act_exposure: true
reliability:
  sla: ''
  uptime_notes: No specific incidents surfaced; no public uptime SLA independently
    verified.
  incidents: []
lock_in:
  openai_compatible_api: true
  portability_notes: 'OpenAI-compatible API serving portable open-weight models on
    NVIDIA GPUs; open checkpoints run elsewhere or self-hosted. Note that some closed
    models are re-sold, which are not portable and carry different data terms.

    '
dedicated_availability: self_serve
dedicated_notes: 'Genuinely self-serve dedicated: dedicated instances billed per GPU-hour (A100
  through B300, four-GPU self-serve limit), raw dedicated GPU rental with SSH, and negotiated DGX
  clusters via sales. BYO weights: private custom LLMs pulled from public or private Hugging Face
  repos plus LoRA adapters on dedicated GPU allocations ("your weights, your endpoint, your
  isolation"). Single-tenancy is described in docs, not warranted in the contract.'
trust_considerations:
- No confidentiality clause - the ToS says only that Submissions "will remain private". Combined
  with an open-ended "debugging" carve-out that may store Submissions (content) with no time limit
  and an "other internal uses only" licence tail, "zero retention" is not absolute; negotiate an
  NDA/enterprise terms for trade-secret material. Under rubric 1.2 this holds data_governance at 3.
- Zero-retention covers DeepInfra's own open-model serving only; closed models (Claude,
  Google) routed through it fall under those vendors' storage/training terms.
- SOC 2 is Type 1 only (not Type II) and self-attested on an unreachable trust centre; HIPAA/BAA is
  not a formal attestation. No signable DPA and no SCCs / EU transfer mechanism are offered (verified
  2026-08-06) - the Privacy Policy names a DPO and acknowledges GDPR rights but processes data in the
  US with no transfer instrument - a blocker for EU controllers, and it drops compliance to 2.
- No EU data-residency option surfaced; US-only data centres.
- US HQ implies standing CLOUD Act exposure.
score:
  rubric_version: '1.2'
  headline: 52.0
  grade: D
  hard_flags: []
  dimensions:
    data_governance:
      score: 3
      rationale: 'Explicit no-store/no-sell/no-train on Submissions and customer-retained IP are a
        genuine strength, grounded in the retrieved Terms and data-privacy docs. But the
        zero-retention claim is not clean: the ToS (re-read 2026-08-06) permits storing SUBMISSIONS
        (content, not only metadata) "for a limited time for the purpose of debugging" with NO
        numeric limit, the content licence has an "other internal uses only" tail, there is no
        express confidentiality duty (only "will remain private"), and the guarantee covers only
        DeepInfra''s own open-model serving - Google/Anthropic closed models routed through it fall
        under those vendors'' terms. Under rubric 1.2 that unbounded debugging-content carve-out
        misses the score-4 "short bounded retention" bar, so 3.

        '
      evidence_refs:
      - ev1
      - ev2
      - ev7
    compliance:
      score: 2
      rationale: 'SOC 2 (Type 1 only, not Type II) and ISO 27001 appear as claims on the
        Sprinto-powered trust centre, which is unreachable - self-attested, not independently
        verified. Decisively, NO signable DPA and NO Standard Contractual Clauses / EU transfer
        mechanism are offered: the Privacy Policy (verified 2026-08-06) names a DPO and
        acknowledges GDPR rights but states data is "transferred, stored, and processed ... in the
        United States" with no transfer instrument. Without a DPA the score-3 "GDPR/DPA available"
        bar is not met; the self-attested cert claims keep it above the score-1 floor, so 2.

        '
      evidence_refs:
      - ev1
      - ev3
    residency:
      score: 1
      rationale: 'The retrieved data-privacy documentation states DeepInfra runs on
        secure US-based data centres; no EU data-residency option was surfaced and
        region pinning is unconfirmed, so it sits near the single-region floor.

        '
      evidence_refs:
      - ev5
    security:
      score: 3
      rationale: 'ISO 27001 and SOC 2 certification indicate baseline controls, and the
        retrieved data-privacy documentation confirms batch data is held encrypted on
        disk then deleted. Held to 3 because the SOC 2 Type-1-vs-Type-II distinction
        rests on the unretrieved trust centre and no independent pen-test was surfaced.

        '
      evidence_refs:
      - ev1
      - ev3
    reliability:
      score: 2
      rationale: 'No incidents surfaced, but no public uptime SLA, status page or failover
        documentation was independently verified. Meets the score-2 anchor (serving in
        production, but no status page or published uptime history); a public status page
        would reach 3.

        '
      evidence_refs:
      - ev1
    transparency_lockin:
      score: 4
      rationale: 'OpenAI-compatible API serving portable open-weight models with clear
        per-token and per-GPU-hour options. Held below 5 because the Terms and data-privacy
        documentation confirm it also re-sells closed models (Anthropic, Google) that are
        not portable and route data under those vendors'' terms, adding governance and
        routing opacity - and the served-catalogue count rests on third-party research.

        '
      evidence_refs:
      - ev6
      - ev2
    cost:
      score: 5
      rationale: 'Among the cheapest providers on the market, with very low per-token
        rates and competitive by-the-hour dedicated GPUs. Rests on third-party pricing
        research (ev4, a third-party attestation); exact rates are approximate and
        should be confirmed against live pricing.

        '
      evidence_refs:
      - ev4

# --- Four documentation domains. Item keys match checklists/inference-provider.yaml and a
#     `<!-- item: KEY -->` section in the domain .md (except gap items).
#     completeness/originality are written by scripts/completeness.py --write.
#     Every credited item is `aggregated` (public source, >=1 ref); OneHill has run nothing,
#     so there are no onehill_generated items and originality = 0.
documentation:
  assess:
    completeness: 80.8
    originality: 0.0
    items:
      - key: data-governance
        title: "Data governance - retention, ZDR & training"
        doc_type: reference
        source_type: aggregated
        coverage: full
        refs: [ev1, ev2]
        summary: "Zero-retention for inputs/outputs by default, only debugging metadata (request ID, cost, sampling parameters) logged, and no training on submitted data (batch data held encrypted on disk, then deleted). Key caveat, per the retrieved Terms and data-privacy docs: this covers DeepInfra's own open-model serving only - closed models (Claude, Google) routed through it fall under those vendors' terms."
      - key: data-ownership
        title: "Data & IP ownership"
        doc_type: reference
        source_type: aggregated
        coverage: partial
        refs: [ev1, ev2, ev7]
        summary: "The retrieved Terms state customers retain IP rights over their Submissions, which remain private, and DeepInfra does not train on or share that data - so for its own open-model serving your data and outputs stay yours (customer_retains). Ownership is not uniform, though: closed models (Anthropic Claude, Google) re-sold through DeepInfra are transferred to those vendors and fall under their storage/training terms. Sub-processors are not disclosed."
      - key: compliance
        title: "Compliance & attestations"
        doc_type: reference
        source_type: aggregated
        coverage: full
        refs: [ev1, ev3]
        summary: "SOC 2 (Type 1 only) and ISO 27001 appear as self-attested claims on the Sprinto-powered trust centre, which is unreachable (documented but unverified). No signable DPA and no SCCs / EU transfer mechanism are offered (verified 2026-08-06): the Privacy Policy names a DPO and acknowledges GDPR rights but processes data in the US with no transfer instrument. HIPAA is framed as measures, not a BAA."
      - key: residency
        title: "Data residency & jurisdiction"
        doc_type: reference
        source_type: aggregated
        coverage: full
        refs: [ev5]
        summary: "The retrieved data-privacy documentation states DeepInfra runs on secure US-based data centres; no EU data-residency option surfaced and region pinning is unconfirmed. US HQ carries standing CLOUD Act exposure."
      - key: security
        title: "Security controls"
        doc_type: reference
        source_type: aggregated
        coverage: partial
        refs: [ev1, ev3]
        summary: "ISO 27001 and SOC 2 certification indicate baseline controls, and the retrieved data-privacy docs confirm batch data is held encrypted on disk then deleted; the SOC 2 Type-1-vs-Type-II distinction rests on the unretrieved trust centre and no independent pen-test was surfaced."
      - key: pricing
        title: "Pricing & cost model"
        doc_type: reference
        source_type: aggregated
        coverage: full
        refs: [ev4]
        summary: "Among the cheapest providers: pay-as-you-go per-token (e.g. Llama 3.1 8B ~$0.02/M, Llama 3.3 70B ~$0.35/M, gpt-oss-120B ~$0.08/M blended) plus dedicated GPU/hr (A100 $0.89, H100 $1.79, H200 $2.19, B200 $2.79); rates approximate."
      - key: reliability
        title: "Reliability posture"
        doc_type: reference
        source_type: aggregated
        coverage: partial
        refs: [ev1]
        summary: "No incidents surfaced, but no public uptime SLA or failover documentation was independently verified."
  implement:
    completeness: 43.8
    originality: 0.0
    items:
      - key: integration
        title: "API integration"
        doc_type: howto
        source_type: aggregated
        coverage: full
        refs: [ev6]
        summary: "OpenAI-compatible API over NVIDIA GPUs plus per-hour dedicated GPU instances - point an existing OpenAI client at DeepInfra's base URL and key to integrate against ~77-90+ served models."
      - key: region-config
        title: "Region & ZDR configuration"
        doc_type: howto
        source_type: aggregated
        coverage: partial
        refs: [ev1, ev5]
        summary: "Zero-retention is the default posture, so no toggle is needed for the core no-store behaviour; there is no EU region to select (US-only) and region pinning is unconfirmed."
      - key: portability
        title: "Portability & exit"
        doc_type: explanation
        source_type: aggregated
        coverage: partial
        refs: [ev6, ev2]
        summary: "OpenAI-compatible endpoint over portable open-weight checkpoints keeps switching cost low, but the re-sold closed models (Claude, Google) are not portable and carry different data terms."
      - key: authentication
        title: "Authentication & account setup"
        doc_type: reference
        source_type: gap
        gap_reason: "API-key issuance and org/project key-scoping details are not documented in the public sources reviewed; confirm the available granularity in the DeepInfra console."
      - key: rate-limits
        title: "Rate limits, tiers & quotas"
        doc_type: reference
