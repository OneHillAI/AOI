# OneHill v2 INFERENCE-PROVIDER library entry for DeepInfra. Replaces data.yaml.
# Validated against schema/inference-provider.v2.schema.json.
#   scores  -> scripts/score.py --write        (provider AOI - carried over unchanged)
#   meters  -> scripts/completeness.py --write  (per-domain completeness/originality)
#   prose   -> assess.md / implement.md / use.md / support.md (sections keyed <!-- item: KEY -->)

schema_version: '2.0'

id: deepinfra

name: DeepInfra

profile: inference

hq_country: United States

summary: >-
  A US-headquartered, low-cost inference provider with a public catalogue of 232 entries across
  modalities (93 text-generation), mostly open-weight (DeepSeek V4 and V4.1, Kimi K3 and K3.1 Pro,
  GLM-5.x, Qwen3.5, gpt-oss, Gemma 4, Nemotron 3, Llama), over per-token pricing plus by-the-hour
  dedicated GPUs. Its Terms of Service (last modified 2026-10-15) make Zero Data Retention
  contractual and controlling (Sec 7(b), Sec 5(a)), with a no-training commitment, a mutual
  confidentiality clause (Sec 17) and exceptions that now include feature-elected retention such
  as batch and paid cache. The Terms also now incorporate a DPA by reference (Sec 5(a)), and the
  trust centre lists it (dated 2026-10-05) and says it contains the EU SCCs, UK IDTA and Swiss
  terms; the PDF itself was WAF-blocked, so the SCC content is a publisher FAQ statement. This
  reverses the earlier finding of no DPA and no SCCs. The caveats are unchanged in kind: ZDR
  covers DeepInfra-hosted models only, and 94 of 232 public entries are flagged partner models
  (Anthropic, Google and others) that run on the partner's infrastructure under the partner's
  data policy; all processing is in the US with no EU region and no region choice; SOC 2 is Type 1
  and the ISO 27001 certificate, pen-test report and SOC 2 report were not opened. A public
  status page with measured uptime now exists, but there is no uptime SLA.

models_served:
- DeepSeek V4 / V4.1 (Flash, Pro) and V3.x
- Kimi K3 / K3.1 Pro
- GLM-5.x
- Qwen3.5
- gpt-oss-120B / 20B
- Gemma 4
- Nemotron 3
- MiMo V2.6
- Llama 3.1 / 3.3
- "Partner models on the partner's infrastructure and terms (Anthropic Claude, Google Gemini and others)"

hardware: 'NVIDIA GPUs: the pricing page says public models run on H100 or A100; dedicated A100, H100, H200, B200 and B300 are rentable per GPU-hour'

pricing:
  model: mixed
  notes: >-
    Per-token list prices are published first-party on the pricing page (USD per million tokens,
    input / output, some with a marked discount), plus service tiers (Priority 1.5x, Flex 0.8x)
    and dedicated GPUs billed per minute at A100 $1.49, H100 $2.90, H200 $3.49, B200 $4.89 and
    B300 $5.89 per GPU-hour. Dedicated GPU-hour rates are 59% to 75% above the figures recorded
    on 2026-07-25. A card or prepayment is required and a spending limit can be set.
  example_rates:
  - 'Llama 3.1 8B Turbo: $0.02 / $0.04 per M tokens (in / out)'
  - 'Llama 3.3 70B Turbo: $0.10 / $0.32'
  - 'gpt-oss-120B: $0.037 / $0.17'
  - 'DeepSeek V4 Flash: $0.09 / $0.18; Kimi K3.1 Pro: $2.00 / $10.00 (5% off shown)'
  - 'GPU/hr: A100 $1.49, H100 $2.90, H200 $3.49, B200 $4.89, B300 $5.89'

data_governance:
  default_retention: >-
    ToS Sec 7(b), last modified 2026-10-15 (verbatim): "Provider will not retain, store, or log
    any Customer Data submitted to or generated by the Services beyond the period strictly necessary
    to process and return the applicable request, after which such Customer Data is deleted from
    Provider's systems in the ordinary course of operations ('Zero Data Retention')." Sec 5(a)
    says this commitment "controls over the Privacy Policy and any other Provider policy,
    webpage, or documentation" and applies "to all Customer Data". Exceptions, all bounded: (i)
    support data kept at the customer's written request and deleted within 30 days of resolution;
    (ii) non-content operational metadata; (iii) records kept for legal compliance or abuse and
    security investigation; (iv) data kept for a feature the customer elects (batch requests,
    asynchronous media outputs, third-party integrations, paid cache retention) for no longer than
    the documented retention period. The docs say inference input is held in memory only and bulk
    batch data is encrypted on disk then deleted after a short retention period.
  trains_on_inputs: never
  zdr_available: yes_default
  zdr_scope_caveats: >-
    Sec 7(b) also states "Provider will not use Customer Data to train, fine-tune, or otherwise
    improve any model, except as necessary to provide the Services (e.g., fine-tuning a model for
    Customer's use)". Zero Data Retention "applies to models hosted by Provider"; data sent to a
    third-party (partner) model is governed by Sec 18 and the third party's terms. The earlier
    open caveat, that the Terms read as an enterprise MSA (they still refer to an Order Form and a
    Service Order), is answered by the publisher in the trust-centre FAQ: ZDR and the DPA "apply to
    every account, including pay-as-you-go, with no setting or contract needed" (Terms Sec 7(b)
    and Sec 5). That is a publisher statement about its own Terms, not independent confirmation.
    Neither ZDR nor the DPA has independent attestation behind it.
  customer_data_ownership: customer_retains
  outputs_used_to_improve_service: "no"
  third_party_routing_leakage: >-
    94 of the 232 public catalogue entries are flagged partner models. The trust-centre FAQ says
    partner models "run on the partner's infrastructure, and the partner's data policy applies"
    (named: Anthropic and Google models, Qwen Max and Qwen3.8-Flash). The docs add that Google
    stores output under its Privacy Notice and Anthropic under its Trust Center, and Terms Sec 7(b)
    now carves third-party models out of Zero Data Retention in the binding text. DeepInfra's own
    zero-retention and no-training promise does not extend to them. Hosted open-weight models
    "never send your data to the company that built the model" (FAQ).
  subprocessors_disclosed: true
  confidentiality: mutual
  confidentiality_caveats: >-
    ToS Sec 17 is bilateral: each Party (as Disclosing Party) may disclose non-public information,
    and the Receiving Party "shall maintain the Confidential Information in strict confidence and
    disclose the Confidential Information only to its employees, subcontractors, consultants, and
    representatives who have a need to know", with at least reasonable care and a three-year
    survival period (Sec 17(e)). Two limits: the definition is general and does not name Customer
    Data as Confidential Information (compare Berget Sec 18.1 and Baseten Sec 11), and Sec 17(f)
    lets the provider use the customer's name and logo for marketing. Sec 6(a) lets the provider
    engage sub-processors "without Customer's consent"; the FAQ says the DPA gives 7 days notice,
    which could not be checked in the DPA text.

compliance:
  soc2: type_i
  iso_27001: "yes"
  iso_27701: unknown
  hipaa_baa: "yes"
  gdpr_dpa: "yes"
  fedramp: ''
  trust_center_url: https://trust.deepinfra.com/compliance

residency:
  eu_region_available: "no"
  regions:
  - United States
  sovereign_option: >-
    None. The trust-centre FAQ says "All DeepInfra inference runs in data centers in the United
    States. ... There is no EU or other non-US region, and you cannot choose a specific US
    region", for both the serverless API and dedicated deployments. The Privacy Policy says data
    is processed "specifically in the United States". The DPA reportedly includes the EU SCCs
    (Modules 1 to 3), the UK IDTA and Swiss terms, so a transfer mechanism now exists, but it
    does not create EU residency; DeepInfra is not certified under the EU-US Data Privacy
    Framework.
  region_pinning: "no"
  cloud_act_exposure: true

reliability:
  sla: >-
    No uptime SLA or credit schedule. Terms Sec 4(b) gives only a 24-hour repair or replacement
    undertaking for a confirmed hardware failure on a provided server; https://deepinfra.com/sla
    returns 404.
  uptime_notes: >-
    A public status page (status.deepinfra.com) shows measured 90-day uptime, read 2026-11-19: the
    API and website 100% over 86.4 of 90 days measured, per-model figures from 99.98% to 100%, all
    172 monitored models operational, a maintenance page and one scheduled deprecation with a named
    replacement. It has no incident-history page, so past incident narratives were not found; the
    states shown are automated health-check results. No incidents were found elsewhere.
  incidents: []

lock_in:
  openai_compatible_api: true
  portability_notes: >-
    OpenAI-compatible API serving portable open-weight models on NVIDIA GPUs; open checkpoints
    run elsewhere or self-hosted. Partner models (94 of 232 public entries are flagged partner,
    including Anthropic Claude and Google Gemini) are not portable and carry the partner's data
    terms. Older model entries carry a deprecated timestamp and a replaced_by pointer, and the
    status page lists scheduled deprecations with a replacement.

dedicated_availability: self_serve

dedicated_notes: 'Genuinely self-serve dedicated: dedicated instances billed per GPU-hour (A100
  through B300, four-GPU self-serve limit), raw dedicated GPU rental with SSH, and negotiated DGX
  clusters via sales. BYO weights: private custom LLMs pulled from public or private Hugging Face
  repos plus LoRA adapters on dedicated GPU allocations ("your weights, your endpoint, your
  isolation"). Single-tenancy is described in docs, not warranted in the contract.'

trust_considerations:
- >-
  The Terms (last modified 2026-10-15) make Zero Data Retention contractual and controlling (Sec
  7(b), Sec 5(a)) with a no-training clause and a mutual confidentiality clause (Sec 17, three-year
  survival). The exceptions now include feature-elected retention (batch, asynchronous media,
  integrations, paid cache retention) for the documented period, and the third-party-model carve-out
  is stated in the binding text.
- >-
  DPA and SCCs, the 2026-08-06 blocker, are resolved on paper: Terms Sec 5(a) incorporates a DPA
  by reference, the trust centre lists it (dated 2026-10-05) and states it includes the EU SCCs
  (Modules 1 to 3), UK IDTA and Swiss terms, with no separate signature. The DPA PDF returned HTTP
  403 and was not read, so the SCC content and the 7-day sub-processor notice rest on a publisher
  FAQ. The trust centre still shows GDPR as "In progress", and DeepInfra is not certified under the
  EU-US Data Privacy Framework.
- >-
  Partner models are the main data-governance gap: 94 of 232 public entries are flagged partner
  (Anthropic Claude, Google Gemini, Qwen Max and others) and run on the partner's infrastructure
  under the partner's data policy. Route no sensitive data through them and segregate that traffic.
- >-
  Sub-processors are now disclosed (AWS, Google Cloud Platform, Stripe, all United States), but Sec
  6(a) lets DeepInfra add sub-processors without the customer's consent.
- >-
  Compliance rests on publisher claims: the trust centre states SOC 2 and ISO 27001 as "Compliant"
  and lists a SOC 2 Type 1 report with a bridge letter, an ISO 27001 certificate, a pen-test report
  and a BAA, but none was opened (attachments gated or WAF-blocked). SOC 2 is Type 1, not Type II,
  and the BAA needs an enterprise agreement and covers hosted models only.
- >-
  All inference is in United States data centres with no EU region and no choice of US region;
  US headquarters carries standing CLOUD Act exposure. A transfer mechanism is not residency.
- >-
  A public status page with measured 90-day uptime now exists, but there is no uptime SLA, only a
  24-hour hardware replacement undertaking for dedicated servers.
- >-
  Dedicated GPU-hour rates are 59% to 75% above the July record (A100 $1.49 to B300 $5.89), so the
  earlier "among the cheapest" claim is no longer supported for dedicated capacity; serverless
  list prices remain very low.

score:
  rubric_version: '1.2'
  headline: 61.6
  grade: C
  hard_flags: []
  dimensions:
    data_governance:
      score: 4
      rationale: >-
        Zero Data Retention is contractual and controlling (ToS Sec 7(b), Sec 5(a)), the no-train
        clause is scoped to "except as necessary to provide the Services", Sec 17 is a mutual
        confidentiality clause with three-year survival, customer IP is retained, sub-processors
        are now disclosed on the trust centre (AWS, GCP, Stripe) and a DPA is incorporated by Sec
        5(a). Held at 4, not 5: ZDR applies only to DeepInfra-hosted models and 94 of 232 public
        entries are partner models under the partner's data policy (now stated in Sec 7(b));
        exception (iv) permits feature-elected retention; the 5 anchor needs independent support
        for zero retention and none exists; and Sec 6(a) allows new sub-processors without consent
        while the 7-day notice appears only in an FAQ.
      evidence_refs:
      - ev1
      - ev2
      - ev7
      - ev-tos-rewrite
      - ev3
    compliance:
      score: 3
      rationale: >-
        The 2026-08-06 score of 2 rested on there being no signable DPA and no SCCs. Terms Sec 5(a)
        (read) now incorporates a DPA by reference that applies to personal data in Customer Data
        without a separate signature, the trust centre lists it (dated 2026-10-05), and its FAQ
        states it contains the EU SCCs (Modules 1 to 3), UK IDTA and Swiss terms (the PDF returned
        HTTP 403, so that content is a publisher statement). The trust centre also states SOC 2 and
        ISO 27001 as "Compliant" and lists an ISO 27001 certificate, a SOC 2 Type 1 report with
        bridge letter and a pen-test report, none opened. That meets the score-3 anchor (ISO 27001
        and a DPA) on publisher claims only, which is the cap for unverified claims. Not 4: no
        certificate or report was read, SOC 2 is Type 1, GDPR is shown as "In progress", and the BAA
        is enterprise-only.
      evidence_refs:
      - ev3
      - ev-tos-rewrite
      - ev-dpa
    residency:
      score: 1
      rationale: >-
        The trust-centre FAQ states all inference runs in United States data centres for both the
        serverless API and dedicated deployments, with no EU or other non-US region and no choice of
        US region; the Privacy Policy says processing is in the United States. A transfer mechanism
        (SCCs in the DPA) does not create residency. Single region with no residency option sits at
        the floor; 1 rather than 0 because the data boundary and transfer terms are now documented.
      evidence_refs:
      - ev5
    security:
      score: 3
      rationale: >-
        The trust centre states SOC 2 and ISO 27001 as "Compliant", lists a pen-test report and ISMS
        manual, and shows control families (MFA, network and endpoint controls, vulnerability
        remediation); the docs and FAQ say batch data is held encrypted on disk then deleted and
        cache is in memory per account and model. Held to 3 because no certificate, SOC 2 report or
        pen-test report was opened, SOC 2 is Type 1, and tenant isolation on shared endpoints is not
        documented in the pages read.
      evidence_refs:
      - ev1
      - ev3
    reliability:
      score: 3
      rationale: >-
        A public status page (status.deepinfra.com) shows measured 90-day uptime for the API and
        website (100%) and per model (99.98% to 100%), a maintenance page and scheduled deprecations
        with replacements, which replaces the earlier finding that no status page existed. There is
        no uptime SLA or credits (Terms Sec 4(b) is a 24-hour hardware undertaking) and no incident
        history page, only automated health states. Meets the score-3 anchor (track record and
        public status page, SLA absent); 4 needs a contractual SLA with credits.
      evidence_refs:
      - ev-status
    transparency_lockin:
      score: 4
      rationale: >-
        OpenAI-compatible API over portable open-weight models with published per-token and
        per-GPU-hour prices, a model listing that flags partner models, and a status page that
        names deprecations and replacements. Held below 5 because 94 of 232 public entries are
        partner models that are not portable and run under the partner's data terms, and
        sub-processors can be added without customer consent.
      evidence_refs:
      - ev6
      - ev2
      - ev-subprocessors
    cost:
      score: 4
      rationale: >-
        Per-token and per-GPU-hour prices, service tiers, billing method and a spending limit are
        published first-party, and serverless list prices are very low (Llama 3.1 8B $0.02 / $0.04,
        gpt-oss-120B $0.037 / $0.17 per million tokens). Lowered from 5: the earlier 5 rested on
        third-party research that is no longer retrievable, and dedicated GPU-hour rates are 59% to
        75% above the July record (A100 $1.49 to B300 $5.89), so competitiveness across serverless
        and dedicated is not shown. Moves back to 5 with an independent price comparison.
      evidence_refs:
      - ev4

documentation:
  assess:
    completeness: 80.8
    originality: 0.0
    items:
      - key: data-governance
        title: "Data governance - retention, ZDR & training"
        doc_type: reference
        source_type: aggregated
        coverage: full
        refs: [ev1, ev2, ev-tos-rewrite]
        summary: "ToS Sec 7(b) (last modified 2026-10-15) makes Zero Data Retention contractual, with Sec 5(a) stating it controls over the Privacy Policy, and forbids training except as necessary to provide the Services. Exceptions are bounded: support data kept at the customer's written request for up to 30 days after resolution, non-content metadata, legal and abuse records, and data kept for a feature the customer elects (batch, asynchronous media, integrations, paid cache) for its documented period. Key caveat: ZDR covers DeepInfra-hosted models only; partner models (94 of 232 public entries) fall under the partner's terms."
      - key: data-ownership
        title: "Data & IP ownership"
        doc_type: reference
        source_type: aggregated
        coverage: full
        refs: [ev1, ev2, ev7, ev-tos-rewrite]
        summary: "Sec 7(b) keeps all IP in Customer Data with the customer, grants the provider only a licence to host and process it to provide the Services, and bars sale or model training. Sec 17 is a mutual confidentiality duty with three-year survival, though it does not name Customer Data and Sec 17(f) allows marketing use of the customer's name and logo. Ownership is not uniform: partner models route data under the partner's terms. Sub-processors are AWS, GCP and Stripe, and Sec 6(a) lets new ones be added without consent."
      - key: compliance
        title: "Compliance & attestations"
        doc_type: reference
        source_type: aggregated
        coverage: partial
        refs: [ev3, ev-tos-rewrite, ev-dpa]
        summary: "Terms Sec 5(a) incorporates a DPA by reference, and the trust centre lists it (dated 2026-10-05) and states it includes the EU SCCs (Modules 1 to 3), UK IDTA and Swiss terms; the PDF was WAF-blocked, so that content is a publisher statement. The trust centre shows SOC 2 and ISO 27001 as Compliant and lists a SOC 2 Type 1 report with bridge letter, an ISO 27001 certificate, a pen-test report and a BAA, none opened; GDPR shows as In progress, there is no EU-US Data Privacy Framework certification, and the BAA needs an enterprise agreement."
      - key: residency
        title: "Data residency & jurisdiction"
        doc_type: reference
        source_type: aggregated
        coverage: full
        refs: [ev5, ev2]
        summary: "The trust-centre FAQ states all inference runs in United States data centres for both serverless and dedicated deployments, with no EU or other non-US region and no choice of US region; the Privacy Policy says processing is in the United States. A transfer mechanism (SCCs in the DPA) does not create residency. US headquarters carries standing CLOUD Act exposure."
      - key: security
        title: "Security controls"
        doc_type: reference
        source_type: aggregated
        coverage: partial
        refs: [ev1, ev3]
        summary: "The trust centre states SOC 2 and ISO 27001 as Compliant and lists control families (MFA, network and endpoint controls, vulnerability remediation), an ISMS manual and a pen-test report; the docs and FAQ say batch data is held encrypted on disk then deleted and cache is in memory per account and model. No certificate, SOC 2 report or pen-test report was opened, and SOC 2 is Type 1."
      - key: pricing
        title: "Pricing & cost model"
        doc_type: reference
        source_type: aggregated
        coverage: full
        refs: [ev4, ev6]
        summary: "First-party list prices (USD per million tokens, input / output): Llama 3.1 8B Turbo 0.02 / 0.04, Llama 3.3 70B Turbo 0.10 / 0.32, gpt-oss-120B 0.037 / 0.17, DeepSeek V4 Flash 0.09 / 0.18, Kimi K3.1 Pro 2.00 / 10.00, with Priority (1.5x) and Flex (0.8x) tiers. Dedicated GPUs per GPU-hour: A100 1.49, H100 2.90, H200 3.49, B200 4.89, B300 5.89, which is 59% to 75% above the July record. Card or prepayment required; a spending limit is available."
      - key: reliability
        title: "Reliability posture"
        doc_type: reference
        source_type: aggregated
        coverage: partial
        refs: [ev-status, ev-tos-rewrite]
        summary: "A public status page shows measured 90-day uptime (API and website 100%, per-model 99.98% to 100%), a maintenance page and scheduled deprecations with replacements. There is no uptime SLA or credit schedule (Terms Sec 4(b) is a 24-hour hardware replacement undertaking for provided servers) and no incident-history page."
  implement:
    completeness: 81.2
    originality: 0.0
    items:
      - key: integration
        title: "API integration"
        doc_type: howto
        source_type: aggregated
        coverage: full
        refs: [ev6, ev4]
        summary: "OpenAI-compatible API over NVIDIA GPUs plus per-hour dedicated GPU instances - point an existing OpenAI client at DeepInfra's base URL and key to reach the public catalogue (232 entries across modalities, 93 text-generation)."
      - key: region-config
        title: "Region & ZDR configuration"
        doc_type: howto
        source_type: aggregated
        coverage: full
        refs: [ev-tos-rewrite, ev5]
        summary: "Zero Data Retention is contractual for every account on hosted models, so no toggle is needed; feature-elected retention (batch, asynchronous media, paid cache) is opt-in. Region control is absent: the FAQ states US only, no EU region and no choice of US region."
      - key: portability
        title: "Portability & exit"
        doc_type: explanation
        source_type: aggregated
        coverage: partial
        refs: [ev6, ev2]
        summary: "OpenAI-compatible endpoint over portable open-weight checkpoints keeps switching cost low, but partner models (94 of 232 public entries, including Anthropic Claude and Google Gemini) are not portable and carry the partner's data terms. Older entries carry a deprecated timestamp and a replaced_by pointer."
      - key: authentication
        title: "Authentication & account setup"
        doc_type: reference
        source_type: aggregated
        coverage: partial
        refs: [ev-docs-auth]
        summary: "API keys sent as a bearer token, each limited to scopes chosen at creation and editable later (a new key starts with inference, models:read, account:read, lora:read and voice:read), plus short-lived scoped JWTs for third parties. Organisation-level controls beyond that were not read."
      - key: rate-limits
        title: "Rate limits, tiers & quotas"
        doc_type: reference
        source_type: aggregated
        coverage: full
        refs: [ev-docs-rate, ev4]
        summary: "Public models: a default of 200 concurrent requests per model per account, raisable on request; private dedicated endpoints have no account rate limit and are bounded by their GPUs (429 Model busy when overloaded). Service tiers: Standard best effort at peak, Priority 1.5x price, Flex 0.8x price with occasional unavailability."
  use:
    completeness: 57.1
    originality: 0.0
    items:
      - key: models-served
        title: "Models served"
        doc_type: reference
        source_type: aggregated
        coverage: full
        refs: [ev6, ev4]
        summary: "232 public non-deprecated entries across modalities (93 text-generation, plus image, video, speech, embedding and reranker models). Open-weight text families include DeepSeek V4 and V4.1, Kimi K3 and K3.1 Pro, GLM-5.x, Qwen3.5, gpt-oss-120B and 20B, Gemma 4, Nemotron 3, MiMo V2.6 and Llama 3.x. 94 entries are flagged partner models, including Anthropic Claude and Google Gemini, which run on the partner's infrastructure under the partner's data policy."
      - key: features
        title: "Inference features"
        doc_type: reference
        source_type: aggregated
        coverage: partial
        refs: [ev6, ev4]
        summary: "OpenAI-compatible chat/completions across the catalogue, embeddings, reranking, speech and media endpoints, service tiers (Priority, Flex), prompt cache retention for 5 minutes or 1 hour on some models, and dedicated GPU instances. The model listing tags each model with capabilities such as tools and reasoning; per-model behaviour was not individually verified."
      - key: context-limits
        title: "Context & token limits"
        doc_type: reference
        source_type: aggregated
        coverage: partial
        refs: [ev4, ev6]
        summary: "The pricing page shows a context column per model (for example DeepSeek V4 family 1024k, DeepSeek V3.2 160k, Llama 3.3 70B Turbo 128k, Gemma 4 31B 256k) and the model listing carries a max_tokens field. Limits on dedicated deployments were not read."
      - key: fine-tuning
        title: "Fine-tuning / custom models"
        doc_type: reference
        source_type: gap
        gap_reason: "No first-party fine-tuning / custom-model documentation is published, so whether and how DeepInfra supports fine-tuning (methods, formats, hosting terms) is not verified here."
  support:
    completeness: 42.9
    originality: 0.0
    items:
      - key: security-disclosure
        title: "Security disclosure & trust centre"
        doc_type: reference
        source_type: aggregated
        coverage: partial
        refs: [ev3]
        summary: "The trust centre (trust.deepinfra.com) is now readable: compliance badges, control families, 46 policies and documents, sub-processors and an FAQ on retention, residency, the DPA and the BAA, with a Request access button for restricted material. A published security.txt, advisory feed or bug-bounty programme was not found; the Terms (Sec 11(a)(v)) forbid testing the services without prior written consent."
      - key: channels
        title: "Support & community channels"
        doc_type: reference
        source_type: aggregated
        coverage: partial
        refs: [ev-status, ev1]
        summary: "Documentation at docs.deepinfra.com (with llms.txt), a Discord community and a feedback email are named on the status page, and enterprise contact goes through sales. Response-time commitments per tier were not found."
      - key: status-uptime
        title: "Status page & uptime history"
        doc_type: reference
        source_type: aggregated
        coverage: partial
        refs: [ev-status]
        summary: "status.deepinfra.com shows current state, measured 90-day uptime per core service and per model, a maintenance page and scheduled deprecations. It has no incident-history page, so past incidents and their communication could not be reviewed, and there is no uptime SLA."
      - key: deprecation
        title: "Model deprecation policy"
        doc_type: reference
        source_type: gap
        gap_reason: "No published model-deprecation or end-of-life policy was surfaced; because most of the catalogue is open-weight, a removed model can generally be self-hosted, but no formal notice window is documented."

ownership:
  level: partial
  factors:
    use_modify:   { level: strong,   rationale: "OpenAI-compatible API over a public catalogue that is mostly open-weight (DeepSeek V4, Kimi K3.1, GLM-5.x, Qwen3.5, gpt-oss, Gemma 4, Llama); the same models run elsewhere or self-hosted, and custom weights can be hosted on dedicated GPUs." }
      # grounded in: ev6 (live model listing, retrieved)
    transparency: { level: moderate, rationale: "The Terms, Privacy Policy, status page, trust centre and sub-processor list are readable, and the DPA is incorporated by Terms Sec 5(a) and listed (2026-10-05). Held at moderate because the DPA PDF, SOC 2 report, ISO certificate and pen-test report could not be opened, partner models run under other terms, and the Terms still read as an Order Form MSA." }
      # grounded in: ev7 and ev-tos-rewrite (terms, retrieved), ev3 (security, retrieved, attachments unread), ev-dpa (retrieved:false)
    reliability:  { level: moderate, rationale: "A public status page shows measured 90-day uptime, but there is no uptime SLA or credits, no incident history page and no independent pen-test report was read; SOC 2 is Type 1." }
      # grounded in: ev-status (sla, retrieved), ev3
    data_control: { level: moderate, rationale: "For DeepInfra-hosted models the Terms make ZDR contractual and controlling, add a no-train clause and a mutual confidentiality duty, and retain customer IP. It falls short of strong because partner models (94 of 232 public entries) are governed by the partner's terms, exceptions allow feature-elected retention, new sub-processors need no consent, residency is US-only with CLOUD Act exposure, and nothing independent attests the ZDR." }
      # grounded in: ev-tos-rewrite (terms, retrieved - Sec 7(b), 17, 5(a)), ev2 (docs, retrieved), ev5 (security, retrieved - US-only)
  verdict: "You substantially control your data on DeepInfra-hosted open models: the Terms (last modified 2026-10-15) make Zero Data Retention contractual and controlling, forbid training on it, give a mutual confidentiality duty and keep your IP, and a DPA is now incorporated by reference. Ownership is capped at partial because that control is not uniform - partner models (Anthropic, Google and 90 more entries) carry the partner's data terms, so route no sensitive data through them - and because all processing is in the United States with no EU region, so it is ruled out where EU data sovereignty is required. The DPA PDF and the attestation documents were not readable here, so the SCC content and the SOC 2 and ISO 27001 status rest on the provider's own trust-centre statements."

evidence:
- id: ev1
  claim: >-
    DeepInfra data-privacy documentation (re-read 2026-11-19): inference input is held in memory
    only and deleted once inference completes, bulk batch data may be stored encrypted on disk and
    is deleted after a short retention period, DeepInfra logs only request metadata (request ID,
    cost, sampling parameters), does not train on submitted data except where Google or Anthropic
    models apply the receiving company's policy, and Google logs prompts and responses for a
    limited period for abuse detection. The page no longer states a US-only or SOC 2 or ISO 27001
    claim; those are on the trust centre (ev3, ev5).
  source_type: publisher
  doc_type: docs
  retrieved: true
  url: https://docs.deepinfra.com/account/data-privacy
  date: '2026-11-19'
- id: ev2
  claim: >-
    DeepInfra Privacy Policy (last modified 2026-08-15, re-read 2026-11-19) and data-privacy docs:
    "We will not store, sell, or train using this data unless we have your explicit consent" (inference
    inputs and outputs); data "may be transferred, stored, and processed outside of your
    jurisdiction, specifically in the United States"; a DPO is named. The docs state that with a
    Google model Google stores the output per its Privacy Notice and with an Anthropic model
    Anthropic stores the output per its Trust Center. The policy contains no SCC or DPA text.
  source_type: publisher
  doc_type: privacy_policy
  retrieved: true
  url: https://deepinfra.com/privacy
  date: '2026-11-19'
- id: ev7
  claim: >-
    DeepInfra Terms of Service (last modified 2026-10-15, re-read 2026-11-19): Sec 7(b) customer
    retains all IP in Customer Data and the provider "will not sell Customer Data" nor use it to
    train, fine-tune or improve any model except as necessary to provide the Services; Sec 7(b)
    Zero Data Retention applies "to models hosted by Provider" and data sent to a third-party model
    is governed by Sec 18 and the third party's terms; Sec 18 third-party content is governed
    "exclusively by the applicable third-party license, terms of use, and privacy policies".
  source_type: publisher
  doc_type: terms
  retrieved: true
  url: https://deepinfra.com/terms
  date: '2026-11-19'
- id: ev3
  claim: >-
    DeepInfra trust centre (Sprinto, now readable, re-read 2026-11-19): compliance badges SOC 2
    "Compliant", ISO 27001 "Compliant", GDPR "In progress", HIPAA "Compliant"; documents listed
    include a "Deep Infra SOC 2 Type 1 Report" ("2025"), a SOC 2 Bridge Letter, a Deep Infra ISO
    27001 Certificate, an ISMS Manual, a Pentest Report, a BAA and a Data Processing Agreement
    (46 resources in all), none opened. Sub-processors: AWS, GCP and Stripe, all United States. FAQ
    (publisher statement): the DPA "is part of the Terms of Service (Section 5)" and "includes the
    EU Standard Contractual Clauses (Modules 1 to 3), the UK IDTA and Swiss terms" with no EU-US
    Data Privacy Framework certification; 7 days' notice before a new sub-processor; a BAA on an
    enterprise agreement covering hosted models only; ZDR "applies to every account, including
    pay-as-you-go".
  source_type: publisher
  doc_type: security
  retrieved: true
  url: https://trust.deepinfra.com/
  date: '2026-11-19'
- id: ev4
  claim: >-
    DeepInfra pricing page (re-read 2026-11-19, first-party; replaces the third-party research
    recorded 2026-07-25): per million tokens, input / output, Llama 3.1 8B Turbo $0.02 / $0.04,
    Llama 3.3 70B Turbo $0.10 / $0.32, DeepSeek V4 Flash $0.09 / $0.18, Kimi K3.1 Pro $2.00 /
    $10.00, GLM-5.3 $0.90 / $4.00 (some marked discounted); service tiers Priority 1.5x and Flex
    0.8x; dedicated GPUs per GPU-hour A100 $1.49, H100 $2.90, H200 $3.49, B200 $4.89, B300 $5.89
    (the July record had A100 $0.89 to B200 $2.79); card or prepayment required, spending limit
    available; default 200 concurrent requests per public model.
  source_type: publisher
  doc_type: marketing
  retrieved: true
  url: https://deepinfra.com/pricing
  date: '2026-11-19'
- id: ev5
  claim: >-
    DeepInfra trust-centre FAQ (publisher statement, re-read 2026-11-19): "All DeepInfra inference
    runs in data centers in the United States"; "Serverless API and dedicated deployments both run
    in the US only. There is no EU or other non-US region, and you cannot choose a specific US
    region."
  source_type: publisher
  doc_type: security
  retrieved: true
  url: https://trust.deepinfra.com/
  date: '2026-11-19'
- id: ev6
  claim: >-
    DeepInfra live model listing (GET https://api.deepinfra.com/models/list, read 2026-11-19; replaces
    the third-party "77 to 90+ models" count): 411 entries, of which 232 are public and not
    deprecated (93 text-generation), and 94 of those 232 carry is_partner (Anthropic 9, Google 13,
    Bria 20, ByteDance 9 and others); open-weight text families include DeepSeek V4 and V4.1, Kimi K3
    and K3.1 Pro, GLM-5.x, Qwen3.5, gpt-oss, Gemma 4, Nemotron 3, MiMo V2.6 and Llama 3.x. The
    pricing page also lists a Claude family and a Gemini family.
  source_type: publisher
  doc_type: docs
  retrieved: true
  url: https://api.deepinfra.com/models/list
  date: '2026-11-19'
- id: ev-tos-rewrite
  claim: >-
    DeepInfra Terms of Service (last modified 2026-10-15; the 2026-09-21 grounding read the version
    effective 2026-08-17), re-read 2026-11-19. Sec 7(b) (verbatim): "Provider will not retain, store,
    or log any Customer Data submitted to or generated by the Services beyond the period strictly
    necessary to process and return the applicable request, after which such Customer Data is deleted
    from Provider's systems in the ordinary course of operations ('Zero Data Retention')", with
    exceptions (i) support data kept at the customer's written request and deleted within 30 days of
    resolution, (ii) non-content operational metadata, (iii) legal-compliance and abuse records and
    (iv) data kept for a feature the customer elects (batch requests, asynchronous media outputs,
    third-party integrations, paid cache retention) for the documented period. Sec 5(a): the provider's
    "data processing agreement made available at https://trust.deepinfra.com ... is incorporated by
    reference and applies to Provider's processing of personal data included in Customer Data", and the
    ZDR commitment "controls over the Privacy Policy and any other Provider policy" and "applies to all
    Customer Data". Sec 17 (verbatim): "The Receiving Party shall maintain the Confidential
    Information in strict confidence and disclose the Confidential Information only to its employees,
    subcontractors, consultants, and representatives who have a need to know", three-year survival,
    17(f) marketing use of name and logo; the definition does not name Customer Data. Sec 6(a):
    sub-processors may be engaged "without Customer's consent". Sec 4(b): 24-hour hardware replacement,
    no uptime percentage. The Terms still refer to an Order Form and Service Order (Sec 1).
  source_type: publisher
  doc_type: terms
  retrieved: true
  url: https://deepinfra.com/terms
  date: '2026-11-19'
- id: ev-dpa
  claim: >-
    DeepInfra Data Processing Agreement: exists (incorporated by Terms Sec 5(a); listed on the trust
    centre as "2026-10-05 - Deep Infra - DPA.docx.pdf") but its text was NOT read: the signed file
    URL returned HTTP 403 from CloudFront and was not worked around. The SCC, UK IDTA, Swiss terms
    and 7-day sub-processor notice are FAQ statements (ev3), not DPA text. Documented but unverified.
  source_type: publisher
  doc_type: dpa
  retrieved: false
