  date: '2026-11-19'
- id: ev-status
  claim: >-
    DeepInfra status page (read 2026-11-19 16:42 GMT): core services operational, all 172 monitored
    models operational, API and website 100% 90-day uptime over 86.4 of 90 days measured, per-model
