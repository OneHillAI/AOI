changelog:
- date: '2026-07-25'
  change: Initial entry.
- date: '2026-07-25'
  change: Migrated to v2 four-domain library format (added documentation block; score
    carried over unchanged).
- date: '2026-07-25'
  change: 'Primary-source grounding pass. Retrieved (via scoped WebSearch; direct fetch
    403''d) the Terms of Service, the data-privacy documentation and the docs/data page:
    grounded zero-retention/no-training, customer-retained IP (customer_data_ownership
    resolved unclear -> customer_retains), the closed-model routing carve-out (Google/
    Anthropic transferred under their terms), and US-only residency onto those binding
    docs. Added doc_type/retrieved to every evidence item and a dedicated Terms item (ev7).
    Trust centre (SOC 2 Type designation, sub-processors) did not resolve -> retrieved:false,
    documented but unverified. Ownership data_control weak -> moderate on the retrieved
    Terms; level unchanged (partial).'
- date: '2026-08-06'
  change: 'Confidentiality + dedicated-availability pass (OpenSpec provider-confidentiality-dedicated,
    rubric 1.2). Re-read the ToS (eff. 2024-07-04): confirmed there is no confidentiality clause (only
    Submissions "will remain private"), an open-ended debugging carve-out that may store Submissions
    (content, not only metadata) with no time limit, and an "other internal uses only" licence tail.
    Added confidentiality: functional_only and dedicated_availability: self_serve. **data_governance
    4 -> 3** (data_governance). Verified against the Privacy Policy + data-privacy docs (2026-08-06)
    that DeepInfra offers NO signable DPA and NO SCCs / EU transfer mechanism (US-only processing,
    DPO named): corrected gdpr_dpa yes -> no and **compliance 3 -> 2** (fails the "GDPR/DPA available"
    bar). Added confidentiality: functional_only and dedicated_availability: self_serve. Net headline
    60.4 -> 52.0 (grade C -> D).'
- date: '2026-09-21'
  change: 'Freshness re-verification (Cowork browser session) surfaced a MATERIAL POSITIVE rewrite of
    the Terms of Service (effective 2026-08-17, after the prior grounding). Sec 17 adds a genuine
    bilateral confidentiality duty (confidentiality: functional_only -> mutual). Sec 7(b)/5(a) make
    Zero Data Retention contractual and controlling, replacing the old unbounded debugging carve-out
    with a bounded 30-day diagnostics exception, and properly scope the no-train commitment.
    **data_governance 3 -> 4** (52.0 -> 56.8; grade D -> C). Compliance (SOC 2/ISO dated-vs-claim,
    DPA/SCCs) was NOT re-examined this pass (trust centre 403''d again) and is unchanged pending a
    future check - flagged, not credited. Open caveat: the rewritten ToS reads as an
    enterprise/Service-Order MSA at the canonical /terms URL; credited to the base self-serve product
    as the standard reading of a canonical Terms page, but this should be explicitly re-confirmed if a
    separate self-serve-only ToS is found. No incidents since Aug 2026.'
- date: '2026-11-19'
  change: >-
    Freshness re-verification (code session, curl against live pages; rubric 1.2). DeepInfra pages
    that returned HTTP 403 in earlier sessions now answer HTTP 200, including the trust centre.
    Re-read the Terms (last modified 2026-10-15), Privacy Policy (2026-08-15), data-privacy docs,
    trust centre and its FAQ, sub-processor docs, status page, rate-limits docs, pricing page and the
    model listing. Watch item answered: the stored finding of no DPA and no SCCs is out of date.
    Terms Sec 5(a) incorporates a DPA by reference, the trust centre lists it (dated 2026-10-05) and
    its FAQ says it includes the EU SCCs (Modules 1 to 3), UK IDTA and Swiss terms; the DPA PDF
    returned HTTP 403 and was not read (retrieved:false), so the SCC content is a publisher
    statement. Changes. (1) gdpr_dpa no to yes, hipaa_baa unknown to yes (enterprise BAA, hosted
    models only), subprocessors_disclosed false to true (AWS, GCP, Stripe). (2) compliance 2 to 3
    on the DPA plus the stated ISO 27001 (publisher claims, certificate not opened). (3) reliability
    2 to 3: a public status page with measured 90-day uptime exists; no SLA. (4) cost 5 to 4: the 5
    rested on third-party research that is no longer retrievable and dedicated GPU-hour rates are 59%
    to 75% above the July record (A100 $1.49, H100 $2.90, H200 $3.49, B200 $4.89, B300 $5.89). (5)
    data_governance stays 4: Sec 7(b) now adds exception (iv) for feature-elected retention and
    states the third-party-model carve-out in the binding text; 94 of 232 public entries are partner
    models. (6) residency stays 1 and is now confirmed by the trust-centre FAQ (US only, no EU
    region, no choice of US region); region_pinning unknown to no. (7) The open caveat that the Terms
    read as an enterprise MSA is answered only by a publisher FAQ line that ZDR and the DPA apply to
    every account, including pay-as-you-go. (8) Catalogue replaced: 232 public entries (93
    text-generation) replace the third-party "77 to 90+" count; Llama 3.x, DeepSeek V4, Kimi K3.1,
    GLM-5.3 and others updated. (9) Sec 17 confidentiality kept as mutual, with a note that Customer
    Data is not named in the definition. Headline and grade recomputed with scripts/score.py 56.8 (C)
    to 61.6 (C): compliance +1, reliability +1, cost -1. Ownership level unchanged (partial).

