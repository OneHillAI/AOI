schema_version: '2.0'
id: runware
name: Runware
profile: inference
hq_country: United Kingdom
summary: 'An inference platform ("one API for all AI") that runs a large catalogue of open-weight
  Hugging Face models on its own custom stack, the Sonic Inference Engine, across pods in the US
  and central Europe. Runware markets a US HQ (San Francisco), but the binding legal entity read in
  its Terms and Privacy Policy is Runware Ltd (United Kingdom), under UK governing law and London
  arbitration. The binding documents were read on 2026-07-26 and they contradict the marketing on
  data handling. The Terms give the customer nominal ownership of outputs but grant Runware a
  worldwide, perpetual, transferable licence over both inputs and outputs, and reference storing
  training data; the Privacy Policy sets generic retention ("as long as necessary" / account life)
  with no auto-purge or opt-in-storage clause, does not address training at all, names only Stripe
  and Google Analytics as sub-processors, and cites GDPR/UK GDPR without naming SCCs or the EU-US
  Data Privacy Framework. SOC 2 and ISO 27001 appear as badges only, with no readable report, and
  no public DPA was found (both URLs 404). The models themselves are open weights, so use and exit
  stay in your hands by self-hosting, but on a hosted basis the data terms are weak: a perpetual
  licence over your inputs and outputs, generic retention, and no no-training commitment. Read the
  binding text before sending sensitive data, and prefer self-hosting the same open checkpoints
  where data control matters.

  '
models_served:
- Open-weight models from Hugging Face (image, video, audio and language; ~400K model variants)
- FLUX / Stable Diffusion family and other open image models
- Open language and multimodal checkpoints served through one unified API
hardware: Custom Runware inference pods (Sonic Inference Engine), US and central Europe
pricing:
  model: per-request
  notes: 'Pay-as-you-go, usage-based pricing with representative rates on the pricing page (read
    2026-07-26); enterprise plans add dedicated capacity and custom terms.

    '
  example_rates:
  - 'Pay-as-you-go usage-based pricing (see provider pricing page for current per-model rates)'
data_governance:
  default_retention: 'generic, not zero - the Privacy Policy retains data "as long as necessary"
    and for the life of the account, with no auto-purge or opt-in-storage clause. This contradicts
    the marketing claim that generated content is auto-purged unless storage is opted into.'
  trains_on_inputs: unclear
  zdr_available: "no"
  zdr_scope_caveats: 'No zero-retention posture is supported by the binding text. The Privacy
    Policy sets generic retention ("as long as necessary" / account life) with no auto-purge, and
    the Terms grant Runware a worldwide, perpetual, transferable licence over inputs and outputs
    and reference storing training data. There is no no-training commitment in either document. The
    marketing claims of no-training and default auto-purge are not supported by the documents read.

    '
  customer_data_ownership: provider_may_use
  outputs_used_to_improve_service: unclear
  third_party_routing_leakage: 'Runs open-weight models on its own inference pods rather than
    reselling a closed third-party model API. The Privacy Policy names only Stripe and Google
    Analytics as sub-processors, so the inference-infrastructure processors that actually handle
    prompt content are not disclosed.

    '
  subprocessors_disclosed: true
  confidentiality: adverse
  confidentiality_caveats: 'Actively adverse on the standard terms (read 2026-08-06): "any
    Contributions you upload ... or Generations you create using the Services will be considered
    non-confidential and non-proprietary", and you grant Runware "a worldwide, non-exclusive,
    royalty-free, transferable license to use, reproduce, distribute, prepare derivative works of,
    display, and otherwise utilize" them in connection with the Services. Express exception: privately
    uploaded custom models (weights/architectures) are treated as confidential, with a separate NDA
    available. The no-training commitment covers only uploaded Training Data / Trained Models, not
    ordinary prompts and generations.'
compliance:
  soc2: unknown
  iso_27001: unknown
  iso_27701: unknown
  hipaa_baa: unknown
  gdpr_dpa: unknown
  fedramp: ''
  trust_center_url: https://runware.ai/trust
residency:
  eu_region_available: unknown
  regions:
  - United Kingdom (binding entity, Runware Ltd)
  - European Union (residency advertised, not contractually pinned)
  - United States
  sovereign_option: 'Not a sovereign offering. The Trust page advertises "EU & US" data residency,
    but no contractual region-pinning document was found, the binding entity is Runware Ltd (UK)
    under UK law, and US CLOUD Act is not addressed anywhere located. EU residency is advertised,
    not guaranteed.'
  region_pinning: unknown
  cloud_act_exposure: false
  provider_can_restrict_access: 'UK jurisdiction (Runware Ltd), UK governing law and London
    arbitration. The Terms allow termination at Runware''s sole discretion, with data deleted on
    request; no notice window or export window was found.'
reliability:
  sla: ''
  uptime_notes: 'A USD 50M Series A (December 2025) and advertised enterprise custom SLAs indicate
    scale, but no public uptime SLA or status page was found, so availability is not independently
    observable.'
  incidents: []
lock_in:
  openai_compatible_api: false
  portability_notes: 'The catalogue is open-weight Hugging Face models, so the same checkpoints run
    on other providers or self-hosted and are fully portable. Runware''s API is a proprietary
    unified schema (OpenAI compatibility not confirmed), so client code is written to Runware''s
    shape and must be rewritten to move; the switching cost is in the API surface, not the model.
    Self-hosting the same open checkpoints also sidesteps the hosted data terms entirely.

    '
dedicated_availability: enterprise_only
dedicated_notes: 'Enterprise plans advertise "dedicated capacity, custom SLAs" at FAQ level only,
  with no public terms. The newly announced Sonic Inference Pods (containerised, deployable "within
  any national border") point at sovereign/on-prem deployment but are a press-announcement claim, not
  a documented, generally-available offering.'
trust_considerations:
- The binding Terms (Runware Ltd, UK; read 2026-07-26) give the customer nominal ownership of
  outputs but grant Runware a worldwide, perpetual, transferable licence over inputs and outputs
  and reference storing training data. This is the central finding and it contradicts the marketing
  line that your data belongs to you and is never reused. The ordinary prompt/generation path is
  the concern; privately uploaded custom models are the exception.
- Express exception (a genuine positive for that path) - privately uploaded custom models
  (weights/architectures) ARE treated as confidential and a separate NDA is available - so the
  private-model route is materially safer than ordinary prompts/generations, which the standard
  Terms deem non-confidential. Prefer that route for anything sensitive.
- The Privacy Policy sets generic retention ("as long as necessary" / account life) with no
  auto-purge or opt-in-storage clause and does not address training. The marketed no-training and
  auto-purge claims are not supported by the document read.
- Sub-processors named are only Stripe and Google Analytics; the inference-infrastructure
  processors that handle prompt content are not disclosed. GDPR/UK GDPR is cited without naming
  SCCs or the EU-US Data Privacy Framework.
- SOC 2 and ISO 27001 appear as badges on the Trust page with no readable report (no number,
  issuer, scope, type, or period), and no public DPA was located (both URLs 404, likely
  enterprise-only). Treat the attestations as claimed, not verified, and request a DPA and the
  reports for any regulated use.
- The models are open weights, so use, modification and exit remain in your hands, and self-hosting
  the same checkpoints avoids the hosted data terms. Where data control matters, prefer that route.
