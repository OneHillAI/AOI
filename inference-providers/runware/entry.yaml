  grade: D
  hard_flags: []
  # CORRECTED 2026-09-21: the adverse-confidentiality hard flag above is LIFTED. An independent
  # re-verification found the current Terms of Service no longer contain the clauses that
  # triggered it (see data_governance.confidentiality_caveats for the full finding and its
  # load-bearing caveat: inferred from current-text absence, not a verbatim historical diff).
  dimensions:
    data_governance:
      score: 3
      rationale: 'CORRECTED 2026-09-21: the prior finding of a worldwide, perpetual, transferable
        licence over inputs/outputs and a non-confidentiality declaration is no longer supported by
        the current Terms of Service (independently browser-read, two fetches, targeted negative
        search confirming the old clauses'' absence) - the current text instead has the customer own
        Outputs outright, grants Runware no broad licence, and now-verbatim Sec 3 confirms no
        training on Training Data/Trained Models, with nothing in the current text permitting
        training on ordinary inputs either. Held at 3, not higher, because retention remains generic
        (account-lifetime, no auto-purge, no numeric window - Privacy Policy Sec 6, unchanged) and
        ZDR is unavailable - matching the anchor-2/3 boundary ("no training on inputs claimed, but
        retention is the default with no bounded opt-out; ZDR unavailable") rather than anchor 4''s
        "short bounded retention or ZDR by default" bar. Caveat: the confidentiality-clause removal
        is inferred from current-text absence, not a verbatim historical diff (web archives were
        proxy-blocked this pass).

        '
      evidence_refs:
      - ev-terms
      - ev-privacy
      - ev-terms-2026-09
    compliance:
      score: 1
      rationale: 'SOC 2 and ISO 27001 appear as badges only, with no readable report, and no public
        DPA was located (both URLs 404). GDPR/UK GDPR is cited without naming SCCs or the EU-US Data
        Privacy Framework. Meets the score-1 anchor (security/privacy claims on a marketing surface
        only): no third-party certification is verifiable and no signable data-processing instrument
        (DPA) was reachable, so it falls short of the score-2 bar which requires an available DPA.

        '
      evidence_refs:
      - ev-privacy
      - ev-trust
    residency:
      score: 2
      rationale: 'The Trust page advertises "EU & US" residency, but no contractual region-pinning
        document was found, the binding entity is Runware Ltd (UK) under UK law, and US CLOUD Act is
        not addressed. EU residency is advertised, not guaranteed. Held at 2: a UK entity with an
        advertised-but-unpinned EU/US residency is materially weaker than an EU-owned, EU-only
        provider.

        '
      evidence_refs:
      - ev-trust
      - ev-series-a
    security:
      score: 3
      rationale: 'The Trust page carries SOC 2 / ISO 27001 badges and a vulnerability-disclosure
        channel, and models run on Runware-operated hardware. Held at 3 absent a readable
        attestation report or an independent penetration test.

        '
      evidence_refs:
      - ev-trust
    reliability:
      score: 2
      rationale: 'A USD 50M Series A (December 2025) and advertised enterprise custom SLAs indicate
        production scale, but no public uptime SLA or status page was found, so availability is
        asserted rather than independently observable. Meets the score-2 anchor (serving in
        production, but no status page or published uptime history); a public status page would
        reach 3.

        '
      evidence_refs:
      - ev-series-a
    transparency_lockin:
      score: 4
      rationale: 'The catalogue is open-weight models from Hugging Face, so the same checkpoints run
        on other providers or self-hosted and the models are fully portable. Held to 4 because
        Runware''s API is a proprietary unified schema (OpenAI compatibility unconfirmed), so
        client code is written to Runware''s shape.

        '
      evidence_refs:
      - ev-series-a
      - ev-home
    cost:
      score: 4
      rationale: 'Pay-as-you-go usage-based pricing with representative rates read on the pricing
        page, and low cost is a core part of the positioning. Held below 5 because no independent
        cost benchmark was run.

        '
      evidence_refs:
      - ev-pricing
      - ev-home

