changelog:
- date: '2026-07-26'
  change: 'Initial v2 entry created from public/marketing claims (binding docs were 403 to the code
    session).'
- date: '2026-07-26'
  change: 'Primary-source re-ground from documents read by a browser (Cowork) session. The binding
    entity is Runware Ltd (UK), not US. The read Terms grant Runware a worldwide, perpetual,
    transferable licence over inputs and outputs and reference storing training data; the Privacy
    Policy has generic retention with no auto-purge and does not address training; sub-processors
    named are only Stripe and Google Analytics; SOC 2 / ISO 27001 are badges with no readable
    report; no public DPA (404). Corrected the earlier US-CLOUD-Act framing to UK jurisdiction.
    Flipped ev-terms / ev-privacy / ev-pricing to retrieved:true. Dropped data_governance,
    compliance and residency to 2, and set the ownership data_control factor to weak with the
    verdict reflecting the input/output licence. This is the Infercom pattern again: marketing
    contradicted by the binding text.'
- date: '2026-08-06'
  change: 'Confidentiality + dedicated-availability pass (OpenSpec provider-confidentiality-dedicated,
    rubric 1.2). Re-read the Terms: confirmed contributions/generations are deemed "non-confidential
    and non-proprietary" with a worldwide, transferable, derivative-works licence taken over them, and
    the express exception that privately uploaded custom models are confidential (NDA available).
    Added confidentiality: adverse (+ hard flag) and dedicated_availability: enterprise_only (Sonic
    Pods announced, not GA). No dimension score changed - data_governance already sits at 2 (below the
    adverse cap of 3); added the private-model exception as a genuine positive for that path.'
- date: '2026-09-21'
  change: 'Freshness re-verification (Cowork browser session, two fetches with a targeted negative
    search) found the adverse-confidentiality finding is NO LONGER SUPPORTED by the current Terms of
    Service: the Termly-style boilerplate that drove it (non-confidentiality declaration, broad
    transferable licence over inputs/outputs) is absent from the current 28-section text, which
    instead has the customer own Outputs outright with no broad licence granted to Runware, and a
    verbatim Sec 3 no-train commitment. LOAD-BEARING CAVEAT: this is inferred from current-text
    absence, not a verbatim diff against the prior snapshot - all web archives were proxy-blocked this
    pass. Lifted the adverse hard flag; confidentiality: adverse -> functional_only;
    customer_data_ownership: provider_may_use -> customer_retains; outputs_used_to_improve_service:
    unclear -> no; trains_on_inputs: unclear -> never (Sec 3, scoped to the fine-tuning product but
    nothing in the current text permits training on inputs either). **data_governance 2 -> 3**
    (45.6 -> 50.4; grade D unchanged - other dimensions were not re-examined this pass). Ownership
    data_control weak -> moderate. What did NOT improve:
    retention remains generic with no auto-purge (Privacy Policy Sec 6, unchanged) and SOC 2/ISO 27001
    remain self-asserted badges with no readable report - compliance and residency scores unchanged.'
- date: '2026-11-19'
  change: 'Freshness re-verification (59 days past the fast-moving SLA), real re-read of live sources. Terms
    "Last updated: 29 September 2026" (newer than the 2026-09-21 read) re-read in full: confirms no licence over
    inputs or outputs, no non-confidentiality declaration, Outputs owned by you, no training on Training Data,
    Trained Models or the new Serverless Customer Material; adds an express confidentiality duty for Serverless,
    hosting named as United States, Germany and Romania (Sec 16), 30 days'' notice before ending paid access, and
    a HIPAA exclusion. Terms versus marketing: the help centre says all data is on EU-based servers, which the
    Terms contradict; SOC 2 and ISO 27001 remain footer badges with no report. New facts: the catalogue now
    includes closed Partner Models forwarded to the model provider (third_party_routing_leakage corrected;
    transparency_lockin 4 -> 3); a ZDR option exists in the docs but is enterprise-only and sales-enabled
    (zdr_available no -> enterprise_only); a public status page exists, earlier missed (reliability 2 -> 3); a
    DPA is available through the enterprise process per the help centre (compliance 1 -> 2, gdpr_dpa yes,
    hipaa_baa no); eu_region_available unknown -> yes from the Terms hosting clause; subprocessors_disclosed
    true -> false (only analytics and payment tools are named). Ownership use_modify strong -> moderate; level
    stays partial. Headline 50.4 -> 54.4; grade D unchanged. Not readable: trust.runware.ai
    (JavaScript-only, retrieved false), the DPA itself, and any web archive (so the old-versus-new Terms diff
    remains inferred). last_verified bumped because every fast-moving field that can be read was re-checked.'
