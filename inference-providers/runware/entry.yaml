- id: ev-terms-2026-09
  claim: 'HISTORICAL, superseded by ev-terms-2026-11. Runware Terms of Service, version independently browser-read 2026-09-21 ( two
    fetches including a targeted negative search for the prior adverse clauses). That 28-section
    text contains NO Submissions/Contributions section, NO IP-assignment of user content to Runware,
    NO "unrestricted use/dissemination without acknowledgment or compensation" clause, and NO
    non-confidentiality disclaimer. Instead, near-verbatim: Sec 2 - "As between you and Runware, you
    own your Outputs... Runware asserts no ownership of, and claims no intellectual property rights
    in, your Outputs"; Sec 2 Private Model Protection - "We agree to treat all such materials as
    confidential" and "not to disclose, distribute, or otherwise make available these models to any
    third party without the explicit written consent of the user"; Sec 4 requires the user to protect
    Runware''s own proprietary information; Sec 3 "Model Training and Fine-Tuning" - "Runware will not
    use your Training Data or Trained Models to train, fine-tune, or develop Runware''s own models or
    those of any third party." The only user-granted licence (Sec 2) is name/logo for marketing
    (benign). LOAD-BEARING CAVEAT: web.archive.org, archive.ph and timetravel.mementoweb were all
    proxy-blocked this pass, so the August-2026 snapshot could not be read - the removal of the old
    adverse clauses is inferred from their absence in the current text plus an evident deliberate
    rewrite (new defined terms, a new Sec 3), not a verbatim side-by-side quote.'
  source_type: publisher
  doc_type: terms
  retrieved: true
  url: https://runware.ai/terms
  date: '2026-09-21'
- id: ev-terms-2026-11
  claim: 'Runware Terms of Service, "Last updated: 29 September 2026", re-read in full 2026-11-19 (server-rendered
    page, 29 sections). Sec 2: "you own your Outputs ... Runware asserts no ownership of, and claims no
    intellectual property rights in, your Outputs" and "Runware takes no licence in your Outputs";
    Partner Models, Open-Source Models and Community Models are defined and each Model Licence governs;
    private uploaded models are treated as confidential "whether or not an NDA has been signed". Sec 3:
    "Runware will not use your Training Data or Trained Models to train, fine-tune, or develop Runware''s
    own models or those of any third party." Sec 4 (Serverless): Customer Material is yours, not used for
    training, treated as confidential, deleted within 30 days of account closure. Sec 1: Services not
    tailored to HIPAA or FISMA, "you may not use the Services" if those laws apply. Sec 16: "the Services are
    hosted in the United States, Germany and Romania". Sec 17: 30 days'' written notice before ending paid
