# OneHill v2 INFERENCE-PROVIDER library entry for Runware.
# Validated against schema/inference-provider.v2.schema.json.
#   scores  -> scripts/score.py --write        (provider AOI)
#   meters  -> scripts/completeness.py --write  (per-domain completeness/originality)
#   prose   -> assess.md / implement.md / use.md / support.md (sections keyed <!-- item: KEY -->)

schema_version: '2.0'
id: runware
name: Runware
profile: inference
hq_country: United Kingdom
summary: 'An inference platform ("one API for all AI") that serves a very large catalogue through
  one proprietary API: open-weight and community models run on its own Sonic Inference Engine pods,
  alongside closed "Partner Models" (GPT, Claude, Gemini, Kling and others) that the Terms describe as
  licensed to Runware by the model owner. It also sells serverless GPU compute for your own code and
  containers. Runware markets a US HQ, but the binding entity is Runware Ltd (United Kingdom), under
  English law with London-seated arbitration. Re-verified 2026-11-19 against Terms last updated
  2026-09-29: the adverse licence and non-confidentiality clauses found on 2026-08-06 are absent, you
  own Outputs, Runware takes no licence in them, and Runware will not train on Training Data, Trained
  Models or Serverless Customer Material. The Terms now say the Services are hosted in the United
  States, Germany and Romania, which contradicts the help-centre claim that all data sits on EU-based
  servers. Retention on the managed API is still generic (account lifetime, no numeric window); zero
  data retention exists only as an enterprise, sales-enabled option for a listed set of models.
  SOC 2 and ISO 27001 remain unverified footer badges, and the DPA is enterprise-only and unread. For
  sensitive data, use the open-weight route or self-host the same checkpoints.

  '
models_served:
- Open-weight and community models (image, video, audio, language and 3D) run on Runware's own pods;
  the registry is reported at 400K+ models, of which 420 have published rates (2026-11-19)
- Open text models such as Kimi K3.1 Pro, DeepSeek-V4.1-Flash, GLM-5.3-Flash, MiniMax M3.1 Flash
- Closed Partner Models licensed through the model owner (GPT-6.x, Claude Fable/Sonnet/Haiku 5.x,
  Gemini 4, Kling, Seedance and others), served under their own Model Licence and provider terms
- Serverless compute for your own code, containers and models on L40s to B300 GPUs
hardware: Custom Runware inference pods (Sonic Inference Engine), US and central Europe
pricing:
  model: per-request
  notes: 'Pay-as-you-go per generation, second or 1M tokens for 420 priced models (read 2026-11-19);
    serverless GPU time billed per second from a prepaid balance with reserved capacity on request; $2
    free credit for business-email sign-ups; enterprise plans add custom terms.

    '
  example_rates:
  - 'GLM-5.3-Flash (text): $0.15 per 1M input, $0.50 per 1M output'
  - 'Kimi K3.1 Pro (text): $2.00 per 1M input'
  - 'Serverless H100: $0.001097 per second ($3.95 per hour); reserved from $2.45 per GPU-hour'
data_governance:
  default_retention: 'Managed API: the Privacy Policy (Sec 6, re-read 2026-11-19) keeps data for as long
    as necessary and no longer than the account lifetime, with no numeric window, auto-purge or
    opt-in-storage clause. Terms Sec 2: "Runware does not retain your Outputs on a long-term basis";
    the docs add that output URLs live for 7 days without ZDR. Training Data and Trained Models are kept
    "in accordance with your plan and settings" (Sec 3). Serverless Customer Material is deleted within
    30 days after the account closes (Sec 4).'
  trains_on_inputs: never
  zdr_available: enterprise_only
  zdr_scope_caveats: 'NEW since 2026-09-21: Runware docs describe zero data retention as an
    organisation-level option for enterprise accounts, enabled by Runware staff on request, applying
    only from the moment it is turned on, and covering a listed set of models (Runware-hosted and
    uploaded models, models from eight providers with a ZDR agreement, and 12 named text models). "Any
    other model is not covered by ZDR today, even when your organization has it enabled." It is not
    mentioned in the Terms or Privacy Policy, so it is documentation, not a contractual term. No
    training: Terms Sec 3 ("Runware will not use your Training Data or Trained Models to train,
    fine-tune, or develop Runware''s own models or those of any third party") and Sec 4 (same for
    Serverless Customer Material); the docs add that API data is never used to train, with or without
    ZDR. The Privacy Policy is silent on training.

    '
  customer_data_ownership: customer_retains
  outputs_used_to_improve_service: "no"
  third_party_routing_leakage: 'CORRECTED 2026-11-19: the catalogue is no longer open-weight only. The
    Terms define Partner Models (licensed to Runware by the model owner), and the ZDR docs say that
    "When a provider runs the model, the provider''s own ZDR terms apply to the copy it handles"
    (HeyGen keeps request data 24 hours, Ideogram 30 minutes; Google, MiniMax and Topaz Labs keep
    flagged requests). The status page separates Official from Third-party Models. Prompts sent to
    closed partner models therefore reach the model provider under that provider''s terms. Open and
    community models run on Runware pods. The Privacy Policy names only analytics and payment tools,
    so infrastructure sub-processors are not disclosed.

    '
  subprocessors_disclosed: false
  confidentiality: functional_only
  confidentiality_caveats: 'Re-read 2026-11-19 (Terms last updated 2026-09-29). The current 29-section
    Terms contain no Submissions or Contributions section, no licence to Runware over inputs or
    outputs, and no non-confidentiality declaration; the adverse text found on 2026-07-26 and
    2026-08-06 is not there. Express confidentiality now exists in two places: Sec 2 for privately
    uploaded models ("We agree to treat all such materials as confidential", applying "whether or not
    an NDA has been signed") and Sec 4 for Serverless Customer Material ("Runware will treat your
    Customer Material as confidential, protect it with at least reasonable care"). Prompts and outputs
    on the managed Models API are not named in either clause, and you own Outputs with no licence
    taken (Sec 2), so protection there rests on the absence of any licence, not a stated duty of
    confidence. Coded functional_only for the main product; Serverless alone would read as explicit.
    Standing caveat: the removal of the old clauses is inferred from the current text, never diffed
    side by side, because no web archive was readable in either the 2026-09-21 or 2026-11-19 pass.'
compliance:
  soc2: unknown
  iso_27001: unknown
  iso_27701: unknown
  hipaa_baa: "no"
  gdpr_dpa: "yes"
  fedramp: ''
  trust_center_url: https://trust.runware.ai/
residency:
  eu_region_available: "yes"
  regions:
  - United Kingdom (binding entity, Runware Ltd)
  - Germany and Romania (hosting named in Terms Sec 16)
  - United States (hosting named in Terms Sec 16)
  sovereign_option: 'Not a sovereign offering. Terms Sec 16 (binding): "the Services are hosted in the
    United States, Germany and Romania", with no customer-selectable region or contractual pinning. The
    help centre says all data is "stored on secure, EU-based servers" and the footer says "Data
    residency EU & US"; the Terms contradict the first, so residency rests on the Terms. The Serverless
    page shows eu-west and eu-central region choices in a product mock-up, which is not a contract term.
    US CLOUD Act exposure is not addressed: the binding entity is UK, but hosting is partly US and the
    site footer names "Runware, Inc.", so US reach is neither established nor excluded.'
  region_pinning: unknown
  cloud_act_exposure: false
  provider_can_restrict_access: 'UK jurisdiction (Runware Ltd), English law, and arbitration seated in
    London under European Centre of Arbitration rules. Access can be denied at Runware''s sole
    discretion without notice, except that for paid Services Runware gives at least 30 days'' written
    notice before ending access unless there is a breach, legal demand or security risk (Sec 17; earlier
    passes recorded no notice window). Deletion on request by email.'
reliability:
  sla: ''
  uptime_notes: 'A public status page exists (status.runware.ai, incident.io), which earlier passes
    missed: "fully operational" on 2026-11-19, with Aug to Nov 2026 uptime of 99.93% for Models (Third-party
    Models 99.98%) and 99.90% for Serverless. There is no SLA in the Terms (Sec 18: "We cannot guarantee
    the Services will be available at all times"); custom SLAs are advertised for enterprise only. A USD
    50M Series A (December 2025) indicates scale.'
  incidents: []
lock_in:
  openai_compatible_api: false
  portability_notes: 'The open and community models are open-weight checkpoints that run on other
    providers or self-hosted, so they are portable. The closed Partner Models are not: they are used
    under the owner''s Model Licence and cannot be moved. Runware''s API is a proprietary unified schema
    (OpenAI compatibility was not found in the docs), so client code is written to Runware''s shape and
    must be rewritten to move. Serverless runs your own containers, which keeps that workload portable.
    Self-hosting the same open checkpoints sidesteps the hosted data terms entirely.

    '
dedicated_availability: enterprise_only
dedicated_notes: 'Serverless compute is live, billed per second on a shared pool, with access requested
  from the dashboard and reviewed by Runware. Reserved GPU capacity ("a fixed number of GPUs for a term")
  and Sonic Pods are commercial commitments with published starting rates but no public contract terms,
  so single-tenant isolation is whatever is negotiated; enterprise plans advertise dedicated capacity.

'
trust_considerations:
- 'Re-verified 2026-11-19 against Terms last updated 2026-09-29: the adverse clauses a 2026-08-06 pass
  found (broad licence over inputs and outputs, non-confidentiality deeming) are absent. You own
  Outputs and Runware takes no licence in them. Standing caveat: the removal is inferred from the
  current text, never diffed side by side, because no web archive was readable.'
- 'Marketing against binding text: the help centre says all data is on EU-based servers, while Terms
  Sec 16 says the Services are hosted in the United States, Germany and Romania. The footer shows ISO
  27001 and SOC 2 badges with no report behind them, and the Terms bar HIPAA-regulated use. Rely on the
  Terms, not the marketing.'
- 'Express confidentiality covers only privately uploaded models (Sec 2) and Serverless Customer
  Material (Sec 4, new). Prompts and outputs on the managed Models API carry no stated duty of
  confidence, so the code stays functional_only.'
- 'The catalogue now includes closed Partner Models (GPT, Claude, Gemini, Kling and others). Requests
  to them go to the model provider under that provider''s own retention terms (the ZDR docs list HeyGen
  at 24 hours and Ideogram at 30 minutes). The earlier description of Runware as open-weight only, on its
  own pods, is no longer accurate.'
- 'Retention: Privacy Policy Sec 6 is still generic. Zero data retention exists but only as an
  enterprise, sales-enabled option for a listed set of models, documented in the docs and not in the
  Terms or Privacy Policy.'
- 'Sub-processors: the Privacy Policy names analytics and payment tools only (Google Analytics,
  PostHog, Meta Pixel, LinkedIn Insight Tag, Umami, Stripe). No infrastructure sub-processor list and no
  SCC or EU-US Data Privacy Framework reference was found.'
- 'SOC 2 and ISO 27001 are claimed badges. trust.runware.ai is a JavaScript-only page this session could
  not read (retrieved: false). A DPA is available only through the enterprise process (help centre) and
  was not read.'
- 'The open and community models keep use, modification and exit in your hands, and self-hosting the
  same checkpoints avoids the hosted data terms.'
score:
  rubric_version: '1.2'
  headline: 54.4
  grade: D
  hard_flags: []
  # The adverse-confidentiality hard flag stays lifted. The 2026-11-19 re-read of Terms last updated
  # 2026-09-29 again finds no licence over inputs/outputs and no non-confidentiality declaration
  # (see data_governance.confidentiality_caveats for the standing inferred-from-absence caveat).
  dimensions:
    data_governance:
      score: 3
      rationale: 'Re-read 2026-11-19: Terms (updated 2026-09-29) give no licence over Outputs, state "Runware
        takes no licence in your Outputs", commit not to train on Training Data, Trained Models or
        Serverless Customer Material, and add an express confidentiality duty for Serverless and
        private models. Held at 3, not 4: retention on the managed API is still generic (account
        lifetime, no numeric window), zero data retention is enterprise-only, sales-enabled and limited
        to listed models (docs, not a contract term), closed Partner Models send prompts to the model
        provider under its own terms, and infrastructure sub-processors are not disclosed. This is the
        anchor-3 pattern (no training, ZDR available with caveats, third-party routing under other terms).

        '
      evidence_refs:
      - ev-terms-2026-11
      - ev-privacy-2026-11
      - ev-docs-zdr
    compliance:
      score: 2
      rationale: 'CHANGED 2026-11-19 from 1: the help centre states a DPA is available through the
        enterprise agreement process, and the SOC 2 and ISO 27001 footer badges are self-asserted claims,
        which meets the score-2 anchor (a DPA is available and certifications are self-attested, with no
        completed independent audit readable). Held at 2: the DPA text was not read and is not public
        (runware.ai/dpa returns 404), no SOC 2 or ISO report, number, issuer or date is published,
        trust.runware.ai is JavaScript-only and unreadable here, the Privacy Policy names no SCCs or DPF,
        and the Terms bar HIPAA-regulated use.

        '
      evidence_refs:
      - ev-help-status
      - ev-trust-2026-11
      - ev-privacy-2026-11
      - ev-terms-2026-11
    residency:
      score: 2
      rationale: 'Terms Sec 16 (binding, 2026-11-19) say the Services are hosted in the United States,
        Germany and Romania, so an EU location exists, but there is no customer-selectable region, no
        contractual pinning and no documented data boundary. The help-centre claim of EU-only storage is
        contradicted by the Terms. The binding entity is Runware Ltd (UK), and US CLOUD Act reach is not
        addressed (hosting is partly US). Held at 2: EU region offered for some workloads without
        pinning guarantees.

        '
      evidence_refs:
      - ev-terms-2026-11
      - ev-help-status
    security:
      score: 3
      rationale: 'A responsible-disclosure programme (not a public bug bounty) with safe harbour and a
        5-business-day acknowledgement target, the Terms'' Serverless workload-security and scanning
        clause, and enterprise SSO/SAML and configurable MFA (footer, marketing) support a documented
        posture. Held at 3 absent a readable attestation report or an independent penetration test.

        '
      evidence_refs:
      - ev-help-status
      - ev-terms-2026-11
    reliability:
      score: 3
      rationale: 'CHANGED 2026-11-19 from 2: a public status page exists (status.runware.ai, incident.io),
        showing per-component uptime for Aug to Nov 2026 (API 100%, Models 99.93%, Serverless 99.90%) and
        a "fully operational" banner. Earlier passes recorded no status page; it is linked from every page
        footer. Meets the score-3 anchor (public status page, operational record). Held at 3 because there
        is no SLA in the Terms (Sec 18 disclaims availability), no service credits and no multi-region
        failover documentation.

        '
      evidence_refs:
      - ev-help-status
      - ev-terms-2026-11
    transparency_lockin:
      score: 3
      rationale: 'CHANGED 2026-11-19 from 4: the catalogue is no longer open-weight only. It includes closed
        Partner Models used under the owner''s licence and forwarded to the model provider, the API is a
        proprietary schema (OpenAI compatibility not found in the docs), and infrastructure sub-processors
        are not disclosed. The open and community models stay portable and Serverless runs your own
        containers, so exit remains workable. Meets the score-3 anchor (open models, portable) but not the
        score-4 bar of transparent routing and a documented exit path.

        '
      evidence_refs:
      - ev-pricing-2026-11
      - ev-docs-zdr
    cost:
      score: 4
      rationale: 'Pay-as-you-go published rates for 420 models plus per-second serverless GPU rates with
        reserved starting prices, and low cost is a core part of the positioning (read 2026-11-19). Held below
        5 because no independent cost benchmark was run and community models carry no public price.

        '
      evidence_refs:
      - ev-pricing-2026-11

