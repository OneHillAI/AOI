#   prose   -> assess.md / implement.md / use.md / support.md (sections keyed <!-- item: KEY -->)

schema_version: '2.0'
id: runware
name: Runware
profile: inference
hq_country: United Kingdom
summary: 'An inference platform ("one API for all AI") that runs a large catalogue of open-weight
  Hugging Face models on its own custom stack, the Sonic Inference Engine, across pods in the US
  and central Europe. Runware markets a US HQ (San Francisco), but the binding legal entity is
  Runware Ltd (United Kingdom), under UK governing law and London arbitration. CORRECTED 2026-09-21:
  an independent re-verification found the current Terms of Service no longer contain the adverse,
  non-confidentiality clause a 2026-08-06 pass had found - the current text instead has the customer
  own Outputs outright, gives no broad licence to Runware over inputs/outputs, and a Private Model
  Protection clause treats uploaded custom models as confidential. This removal is inferred from the
  current text''s absence of the old clauses (web archives were proxy-blocked, so no verbatim
  historical diff was possible) but is high-confidence given an evident deliberate rewrite. The
  adverse-confidentiality hard flag is lifted. What has NOT improved: retention is still generic
  (account-lifetime, no auto-purge, no ZDR), sub-processor disclosure beyond Stripe/Google Analytics
  is still thin, and SOC 2/ISO 27001 remain self-asserted badges with no readable report or dated
  certificate. The models themselves are open weights, so use and exit stay in your hands by
  self-hosting; on a hosted basis the data terms are now considerably less hostile than previously
  graded, but retention and compliance verification remain real gaps.

  '
models_served:
- Open-weight models from Hugging Face (image, video, audio and language; ~400K model variants)
- FLUX / Stable Diffusion family and other open image models
- Open language and multimodal checkpoints served through one unified API
hardware: Custom Runware inference pods (Sonic Inference Engine), US and central Europe
pricing:
  model: per-request
  notes: 'Pay-as-you-go, usage-based pricing with representative rates on the pricing page (read
    2026-07-26); enterprise plans add dedicated capacity and custom terms.

    '
  example_rates:
  - 'Pay-as-you-go usage-based pricing (see provider pricing page for current per-model rates)'
data_governance:
  default_retention: 'CORRECTED 2026-09-21: retention is still generic, not zero - Privacy Policy
    Sec 6 retains data for the account lifetime with no numeric window or auto-purge/opt-in-storage
    clause. This specific weakness is UNCHANGED. What changed is everything around it - see
    confidentiality_caveats.'
  trains_on_inputs: never
  zdr_available: "no"
  zdr_scope_caveats: 'No zero-retention posture is supported by the binding text (Privacy Policy
    Sec 6, unchanged) - this remains the entry''s principal residual weakness. CORRECTED 2026-09-21:
    the current Terms of Service Sec 3 "Model Training and Fine-Tuning" (near-verbatim, independently
    browser-read, two fetches): "Runware will not use your Training Data or Trained Models to train,
    fine-tune, or develop Runware''s own models or those of any third party." trains_on_inputs
    resolved from unclear to never - the clause is defined-term-scoped to the fine-tuning product,
    but Sec 2 (see confidentiality_caveats) grants Runware no rights over ordinary inputs/outputs
    either, so nothing in the current text permits training on inputs by any reading. The Privacy
    Policy is silent on training.

    '
  customer_data_ownership: customer_retains
  outputs_used_to_improve_service: "no"
  third_party_routing_leakage: 'Runs open-weight models on its own inference pods rather than
    reselling a closed third-party model API. The Privacy Policy names only Stripe and Google
    Analytics as sub-processors, so the inference-infrastructure processors that actually handle
    prompt content are not disclosed. Unchanged 2026-09-21.

    '
  subprocessors_disclosed: true
  confidentiality: functional_only
  confidentiality_caveats: 'CORRECTED 2026-09-21 - the adverse finding is NO LONGER SUPPORTED by the
    current Terms of Service (independently browser-read, two fetches including a targeted negative
    search): the current 28-section ToS contains NO Submissions/Contributions section, NO
    IP-assignment of user content to Runware, NO "unrestricted use/dissemination without
    acknowledgment or compensation" clause, and NO non-confidentiality disclaimer - the Termly-style
    boilerplate that drove the adverse classification is simply absent. The current text is
    affirmatively protective instead: Sec 2 (near-verbatim) - "As between you and Runware, you own
    your Outputs... Runware asserts no ownership of, and claims no intellectual property rights in,
    your Outputs"; Sec 2 Private Model Protection - "We agree to treat all such materials as
    confidential" and "not to disclose, distribute, or otherwise make available these models to any
    third party without the explicit written consent of the user"; Sec 4 requires the user to
    protect Runware''s own proprietary information. The only licence the user grants Runware is
    name/logo for marketing (benign). Coded functional_only, not mutual or explicit: there is no
    general confidentiality clause covering ordinary prompts/outputs broadly - only Private Model
    Protection is expressly confidential - so protection for ordinary content rests on the absence
    of any licence grant plus retained ownership, not a stated duty of confidence.
    LOAD-BEARING CAVEAT: this removal is INFERRED from the current text''s absence of the old
    clauses, not verbatim-diffed against the prior August snapshot - all web archives
    (web.archive.org, archive.ph, timetravel.mementoweb) were proxy-blocked this pass. High
    confidence (an evident deliberate rewrite: new defined terms Training Data/Trained
    Models/Outputs/Generations, a new Sec 3), but flagged as inferred rather than a side-by-side
    quote. Retry the archive diff if a verbatim historical comparison is later required.'
compliance:
  soc2: unknown
  iso_27001: unknown
  iso_27701: unknown
  hipaa_baa: unknown
  gdpr_dpa: unknown
  fedramp: ''
  trust_center_url: https://runware.ai/trust
residency:
  eu_region_available: unknown
  regions:
  - United Kingdom (binding entity, Runware Ltd)
  - European Union (residency advertised, not contractually pinned)
  - United States
  sovereign_option: 'Not a sovereign offering. The Trust page advertises "EU & US" data residency,
    but no contractual region-pinning document was found, the binding entity is Runware Ltd (UK)
    under UK law, and US CLOUD Act is not addressed anywhere located. EU residency is advertised,
    not guaranteed.'
  region_pinning: unknown
  cloud_act_exposure: false
  provider_can_restrict_access: 'UK jurisdiction (Runware Ltd), UK governing law and London
    arbitration. The Terms allow termination at Runware''s sole discretion, with data deleted on
    request; no notice window or export window was found.'
reliability:
  sla: ''
  uptime_notes: 'A USD 50M Series A (December 2025) and advertised enterprise custom SLAs indicate
    scale, but no public uptime SLA or status page was found, so availability is not independently
    observable.'
  incidents: []
lock_in:
  openai_compatible_api: false
  portability_notes: 'The catalogue is open-weight Hugging Face models, so the same checkpoints run
    on other providers or self-hosted and are fully portable. Runware''s API is a proprietary
    unified schema (OpenAI compatibility not confirmed), so client code is written to Runware''s
    shape and must be rewritten to move; the switching cost is in the API surface, not the model.
    Self-hosting the same open checkpoints also sidesteps the hosted data terms entirely.

    '
dedicated_availability: enterprise_only
dedicated_notes: 'Enterprise plans advertise "dedicated capacity, custom SLAs" at FAQ level only,
  with no public terms. The newly announced Sonic Inference Pods (containerised, deployable "within
  any national border") point at sovereign/on-prem deployment but are a press-announcement claim, not
  a documented, generally-available offering.'
trust_considerations:
- 'CORRECTED 2026-09-21, MATERIAL: a 2026-08-06 pass found the binding Terms (Runware Ltd, UK) gave
  the customer nominal ownership of outputs but granted Runware a worldwide, perpetual, transferable
  licence over inputs and outputs, deemed them non-confidential, and referenced storing training
  data. An independent re-verification found this NO LONGER SUPPORTED by the current 28-section
  Terms of Service (two fetches, targeted negative search): no Submissions/Contributions section, no
  IP-assignment, no non-confidentiality disclaimer. The current text instead has the customer own
  Outputs outright with no broad licence granted to Runware. LOAD-BEARING CAVEAT: this is inferred
  from the current text''s absence of the old clauses - web archives were proxy-blocked, so no
  verbatim old-vs-new diff was possible this pass. High confidence given an evident deliberate
  rewrite (new defined terms, a new Sec 3), but flagged as inferred rather than side-by-side quoted.'
- Private Model Protection (Sec 2) remains a genuine positive - privately uploaded custom models
  (weights/architectures) are treated as confidential and a separate NDA is available. This was
  already true before the rewrite and remains true now; it is no longer the ONLY confidentiality
  protection available, since ordinary Outputs are now customer-owned with no licence grant either.
- 'CORRECTED 2026-09-21: Sec 3 "Model Training and Fine-Tuning" now states verbatim "Runware will
  not use your Training Data or Trained Models to train, fine-tune, or develop Runware''s own models
  or those of any third party" - trains_on_inputs resolved from unclear to never. UNCHANGED: the
  Privacy Policy still sets generic retention ("as long as necessary" / account life) with no
  auto-purge or opt-in-storage clause - this remains the entry''s principal residual weakness.'
- Sub-processors named are only Stripe and Google Analytics; the inference-infrastructure
  processors that handle prompt content are not disclosed. GDPR/UK GDPR is cited without naming
  SCCs or the EU-US Data Privacy Framework.
- SOC 2 and ISO 27001 appear as badges on the Trust page with no readable report (no number,
  issuer, scope, type, or period), and no public DPA was located (both URLs 404, likely
  enterprise-only). Treat the attestations as claimed, not verified, and request a DPA and the
  reports for any regulated use.
- The models are open weights, so use, modification and exit remain in your hands, and self-hosting
  the same checkpoints avoids the hosted data terms. Where data control matters, prefer that route.
