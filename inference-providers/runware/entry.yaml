      # grounded in: ev-terms-2026-11, ev-privacy-2026-11, ev-docs-zdr (all retrieved:true)
  verdict: "You partly own workloads here. The models you choose to run from the open-weight set are yours to move or self-host, and the current binding Terms (updated 2026-09-29) give you the Outputs, take no licence over your inputs or outputs, and commit not to train on your training data or serverless workloads. That is a reversal of the 2026-08 finding, and it rests on current-text absence of the old clauses, not a verbatim diff. What keeps this partial: retention on the managed API is generic, zero retention is an enterprise add-on for listed models, closed partner models pass your prompts to their own providers, the Terms put hosting partly in the United States, and the SOC 2 and ISO 27001 claims have no report. Marketing claims of EU-only storage are contradicted by the Terms. Use the open-weight route for sensitive data, and request the DPA and attestation reports before regulated use."

evidence:
