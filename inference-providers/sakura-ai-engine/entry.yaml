      in a designated country. Art. 17(2): Sakura does not involve itself in user data. Art. 24:
      secrecy of communications under Telecommunications Business Act Art. 4, with disclosure to
      authorities and, for user violations, to third parties. Art. 28: discontinuation on one
      month's notice. Art. 29: liability cap of one month's fee for gross negligence, and outage
