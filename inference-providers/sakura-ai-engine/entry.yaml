# OneHill v2 INFERENCE-PROVIDER library entry for Sakura Internet "AI Engine".
# Validated against schema/inference-provider.v2.schema.json.
#   scores  -> scripts/score.py --write        (provider AOI)
#   meters  -> scripts/completeness.py --write  (per-domain completeness/originality)
#   prose   -> assess.md / implement.md / use.md / support.md (sections keyed <!-- item: KEY -->)
# Binding documents are Japanese. Japanese text governs (basic terms Art. 3(1)); English readings are OneHill's own.

schema_version: '2.0'
id: sakura-ai-engine
name: Sakura Internet AI Engine
profile: inference
hq_country: Japan
summary: >-
  A shared, pay-as-you-go inference API run by Sakura Internet Inc. (headquartered in Osaka),
  serving mostly open-weight models (gpt-oss-120b, Qwen3, Gemma 4, Kimi, GLM, DeepSeek, llm-jp)
  plus two closed Japanese models, through OpenAI-compatible and Anthropic-compatible APIs. Art.
  10 of the AI Engine terms bars Sakura from using inputs and from giving them to third parties
  including model providers, and bars AI training on them by Sakura or the model provider. It does
  not promise zero retention: inputs and outputs may be held, encrypted, for an undefined "certain
  period" for maintenance and fault handling. Sakura's product pages say "not stored at all" and
  "ZDR", and say model execution, communication and storage are all in Japan. The terms contain no
  location clause and no sub-processor list, and the basic terms say referenced web pages are not
  part of the contract. No DPA is published, AI Engine is outside the SLA, and the security
  certifications Sakura publishes name Sakura Cloud and not AI Engine. A dedicated "Private
  Edition" exists for Japanese corporations only, under separate terms.
models_served:
  - 'gpt-oss-120b (Apache-2.0)'
  - 'llm-jp-3.1-8x13b-instruct4 (Apache-2.0)'
  - 'Qwen3.6-35B-A3B, Qwen3-VL-30B-A3B-Instruct, Qwen3-0.6B (Apache-2.0, public preview)'
  - 'Gemma 4 31B it (Apache-2.0, public preview)'
  - 'Kimi-K2.7-Code (Modified MIT, public preview)'
  - 'GLM-5.3-Flash (MIT, public preview)'
  - 'DeepSeek-V4.1-Flash-1017 (MIT, public preview)'
  - 'Weblab-MedLLM-gpt-oss-120b (Apache-2.0, public preview)'
  - 'Kimi-K2.6 (on the price list and the Messages API note only, public preview)'
  - 'Phi-4-mini-instruct on CPU (MIT, public preview)'
  - 'Whisper large-v3-turbo (transcription), multilingual-e5-large and Qwen3-Embedding-4B (embeddings), VOICEVOX voices (speech)'
  - 'Closed, by application only: PLaMo 3.0 Prime (Preferred Networks), cotomi v3 (NEC)'
hardware: >-
  Not stated (Sakura-operated GPU platform in Japan; GPU type not documented)
pricing:
  model: per-token
  notes: >-
    Pay-as-you-go in Japanese yen per 10,000 tokens, tax included, per Sakura's product page. A
    free foundation-model plan gives a monthly request allowance on selected models. RAG document
    storage is billed per 100 chunks with no free allowance and keeps billing until every document
    is deleted. Credit card only unless Sakura approves otherwise (AI Engine terms Art. 6).
    Private Edition is a flat monthly fee per GPU, quote on request, bank transfer, minimum 2
    months (Private Edition terms Art. 5, 7).
  example_rates:
    - 'gpt-oss-120b: 0.15 yen input and 0.75 yen output per 10,000 tokens (3,000 free requests a month)'
    - 'Kimi-K2.7-Code (preview): 0.52 yen input and 5.04 yen output per 10,000 tokens'
    - 'GLM-5.3-Flash and DeepSeek-V4.1-Flash-1017 (preview): 0.4 yen input and 4.0 yen output per 10,000 tokens'
    - 'multilingual-e5-large: 2 yen per 10,000 input tokens; whisper-large-v3-turbo: 0.5 yen per 60 seconds'
data_governance:
  default_retention: "Terms Art. 10(1) (第10条第1項): inputs and outputs are \"in principle not stored\" (原則として保存されません).
    They may be stored \"for a certain period\" (一定期間) in Sakura's facilities for maintenance or
    fault handling, kept encrypted and deleted after that period. The period is not defined in any
    terms document. Documents uploaded to the RAG feature are kept until the customer deletes them
    (manual, not in the terms)."
  trains_on_inputs: never
  zdr_available: unclear
  zdr_scope_caveats: >-
    Sakura's product pages say "ZDR (Zero Data Retention)" and "not stored at all, not cached". The binding
    text is narrower: Art. 10(1) permits temporary encrypted storage of inputs and outputs for an undefined
    period. Private Edition terms Art. 9(4) say Sakura does not handle input and output "in principle" but
    lists exceptions for fault investigation, support the user asks for, and legal or other justifiable
    reasons. Zero retention is therefore claimed in marketing and not promised in the contract. Not
    verifiable from outside.
  customer_data_ownership: customer_retains
  outputs_used_to_improve_service: unclear
  third_party_routing_leakage: >-
    Art. 10(2) says inputs are not given to third parties including model providers. The manual
    says all served models are hosted by Sakura and that closed-model providers (PFN, NEC) receive
    no data. The closed-model end-user terms (PLaMo, cotomi) bind the customer and not Sakura, and
    PLaMo bars entering personal information. No third-party model routing is documented.
  subprocessors_disclosed: false
  confidentiality: explicit
  confidentiality_caveats: >-
    Art. 10(2) is an express provider-side duty not to use inputs or give them to third parties, and basic
    terms Art. 24(1) commits Sakura to the statutory secrecy of communications under the Telecommunications
    Business Act. It is not a mutual NDA-grade clause and does not name customer data as confidential
    information. It covers inputs only; outputs and RAG documents are not addressed. Art. 24(2) allows
    disclosure to courts and regulators, and Art. 24(3) allows disclosure of information within a user's
    secrecy of communications to third parties where the user commits a prohibited act. Basic terms
    Art. 17(2) says Sakura does not involve itself in user data and is not liable for its leakage or loss
    (subject to Art. 29).
compliance:
  soc2: unknown
  iso_27001: 'yes'
  iso_27701: unknown
  hipaa_baa: unknown
  gdpr_dpa: unknown
  fedramp: >-
    Not applicable. ISMAP (the Japanese government scheme, C21-0030-2) covers Sakura Cloud IaaS only; AI
    Engine is not in its scope.
  trust_center_url: https://www.sakura.ad.jp/corporate/security/
  scope_notes: >-
    ISO/IEC 27001 (ICMS-SR0063), ISMS cloud security (ISO/IEC 27017 based, Cloud-SR0063), ISO/IEC
    27018 (CloudPII-SR0063), ISMAP, PCI DSS (physical requirements 9 and 12 only) and Privacy Mark
    are held at company level. The registered scopes of the cloud, ISO 27018 and ISMAP
    certificates name Sakura Cloud (Tokyo and Ishikari regions). AI Engine is named in none of
    them, though it is sold inside the Sakura Cloud console. SOC 3 (independent auditor,
    unqualified, 2025-06-01 to 2026-05-31) covers the Ishikari data centre, not AI Engine. A SOC 2
    Type 2 report for the Ishikari data centre and a SOC 2 Type 1 report for Sakura Cloud exist
    and are disclosed on request; neither is verified. No DPA, GDPR addendum or sub-processor list
    has been located, so gdpr_dpa is unknown and not a confirmed absence.
residency:
  eu_region_available: 'no'
  regions:
    - 'Japan only, as stated in the FAQ, product page and manual ("domestic data centres"). No data centre or region is named for AI Engine, and the statement is not in the binding terms.'
  sovereign_option: >-
    Private Edition: GPU platform dedicated to the customer (Private Edition terms Art. 2(2)), Japanese
    corporations only (Art. 3). Closed-network connection is available only if written into the order form
    (Art. 2(4)). Dedicated scope is the GPU platform only, not VM, storage, API or network unless agreed.
  region_pinning: 'no'
  cloud_act_exposure: false
  provider_can_restrict_access: "Sakura is a Japanese company under Japanese law (basic terms Art. 32), Tokyo District Court
    (Art. 33). It is not subject to the US CLOUD Act as a US company. Its terms import US export
    control. Sakura may refuse or bar users on the Japanese METI Foreign End User List, the US BIS
    Denied Persons List or Entity List, or from embargoed countries (AI Engine terms Art. 3, 12). It
    may end a service on one month's notice, or immediately where authorities order it or a
    technology supplier relationship ends (basic terms Art. 28). It may end the free plan at its
    discretion (Art. 2(3)) and withdraw preview models without notice (manual). Applicants must
    reside in a \"designated country\" (basic terms Art. 5(3)); the list is not published in any
    terms document."
reliability:
  sla: "None for AI Engine. The manual states the service is outside quality assurance (SLA). Private
    Edition terms Art. 11 give best effort unless an SLA is written into the service site, order
    form or other document. The only remedy is basic terms Art. 29(3). It applies where a
    continuously provided service is wholly unusable for 24 hours or more for a reason attributable
    to Sakura. The remedy is compensation of actual ordinary damage on request, capped at one
    thirtieth of one month's basic fee per whole day of outage, or a term extension if under 10,000
    yen. How that applies to a usage-billed service is not stated."
  uptime_notes: >-
    The public Sakura Cloud status page (status.cloud.sakura.ad.jp) lists Cloud API per zone, the
    website and appliances. AI Engine is not a listed component, so no public uptime history for
    it exists on that page. The general maintenance and incident page renders by script and its
    content is unverified. Per-request time limit is about 5 minutes; HTTP 429 is returned under
    load even on the free plan.
  incidents: []
lock_in:
  openai_compatible_api: true
  portability_notes: >-
    OpenAI-compatible Chat Completions, Responses (no images or multi-turn yet), Embeddings and Audio APIs,
    plus an Anthropic-compatible Messages API (one preview model per the product page). Unsupported
    parameters such as top_p, top_k, stop, seed and logprobs are silently ignored. Served open models are
    all downloadable elsewhere, so workloads move easily. No minimum term; cancel on notice (AI Engine terms
    Art. 7, 8), but all RAG documents and tokens must be deleted before the plan can be cancelled. The two
    closed models (PLaMo, cotomi) run only on Sakura and bar fine-tuning, distillation and derived models.
dedicated_availability: available
dedicated_notes: >-
  AI Engine Private Edition: managed hosting of the customer's own model on a GPU platform
  dedicated to the customer, flat monthly fee per GPU on quote, bank transfer. Minimum initial
  term 2 months or about 1 year chosen at order; the shared AI Engine contract cannot be cancelled
  while Private Edition continues. Japanese corporations only (Art. 3). Terms are published (in
  force 2026-11-02). The page says "dedicated environment", but Art. 2(2) limits exclusivity to
  the GPU platform named in the order. No on-prem or air-gapped option is documented.
trust_considerations:
  - >-
    The binding AI Engine terms (Art. 10(2)) bar use of inputs, bar giving them to third parties
    including model providers, and bar AI training on them by Sakura or the model provider. That
    is a stronger written commitment than many providers give. It covers inputs only; outputs and
    uploaded RAG documents are not addressed.
  - >-
    Retention contradiction: the product page, FAQ and Private Edition page say input and response
    data are "not stored at all", "not cached" and "ZDR". Art. 10(1) says they may be stored
    encrypted for an undefined period for maintenance or fault handling. Treat retention as "not
    stored in principle, undefined exceptions" and not as zero retention.
  - >-
    Location contradiction: the top page FAQ says model execution, communication and storage are
    completed entirely in Japan, and the manual says requests are processed in Japanese data
    centres. None of the three terms documents contains a location clause, and basic terms Art.
    2(5) says web pages designated in the terms are not part of the terms. No data centre is named
    for AI Engine. Japan-only processing is a marketing and documentation claim and not a
    contractual commitment.
  - >-
    Private Edition contradiction: the page says "dedicated environment", "closed-network
    connection" and stable operation. The terms dedicate only the named GPU platform (Art. 2(2)),
    exclude closed-network connection unless ordered (Art. 2(4)) and give best effort unless an
    SLA is written down (Art. 11). The ZDR claim is again narrower in Art. 9(4).
  - >-
    The security certifications Sakura publishes (ISMS ISO 27001, ISO 27017, ISO 27018, ISMAP, SOC
    2 and 3) are independently audited, but their registered scopes name Sakura Cloud or the
    Ishikari data centre. AI Engine is not named in any scope, and the transparency report also
    excludes it.
  - >-
    No DPA, sub-processor list, SLA, public status history or rate-limit table is published for AI
    Engine. Contract, notices and support are in Japanese only; Japanese text governs (basic terms
    Art. 3).
  - >-
    Eligibility limits: applicants must reside in a "designated country" (list not published);
    export-list parties are barred; military use is prohibited except for Japan's defence (AI
    Engine terms Art. 12(1)(vi)); Private Edition is for Japanese-law corporations only.
  - >-
    Most models are in public preview, which Sakura says can change or end without notice and
    carries no stability guarantee. Only gpt-oss-120b, llm-jp-3.1, Whisper, multilingual-e5-large
    and VOICEVOX are outside preview.
score:
  rubric_version: '1.2'
  headline: 48.0
  grade: D
  hard_flags: []
  dimensions:
    data_governance:
      score: 3
      rationale: >-
        Contractual no training and no use or third-party provision of inputs (Art. 10(2)), a
        documented retention rule (Art. 10(1)), and models hosted by Sakura itself. The score is 3
        and not 4 because retention is not bounded (the "certain period" is undefined), no
        sub-processor list is published, and the protection covers inputs only. The "ZDR" and "not
        stored at all" marketing is not matched by the terms, so no zero-retention credit is
        given.
      evidence_refs:
        - ev-terms-ai
        - ev-terms-pe
        - ev-terms-basic
        - ev-docs-basics
        - ev-marketing-ai
    compliance:
      score: 2
      rationale: >-
        Sakura holds ISO 27001, ISO 27017, ISO 27018, ISMAP and Privacy Mark at company level,
        which would meet a score of 3 for the company. The published scopes of the cloud, ISO
        27018 and ISMAP certificates name Sakura Cloud and not AI Engine, no DPA or GDPR addendum
        has been identified, and the SOC 2 reports are available on request only. The score is 2
        on what ties to this service. It would move to 3 or 4 if Sakura confirmed AI Engine inside
        the ISMS scope and published a processing agreement.
      evidence_refs:
        - ev-sec-certs
        - ev-sec-checksheet
        - ev-ismap
        - ev-soc3
        - ev-dpa-gap
        - ev-soc2-request
        - ev-transparency
    residency:
      score: 2
      rationale: >-
        Processing in Japanese data centres is stated three times in Sakura's own pages, and the
        operator is a Japanese company under Japanese law with no US CLOUD Act exposure. There is
        no location clause in any terms document, no data centre is named, there is no region
        choice, and basic terms Art. 2(5) keeps web statements out of the contract. That is a
        region claim without a pinning guarantee or a documented data boundary. The score would
        reach 4 if the location statement were written into the terms or a DPA.
      evidence_refs:
        - ev-terms-ai
        - ev-terms-basic
        - ev-docs-basics
        - ev-marketing-top
        - ev-marketing-ai
    security:
      score: 2
      rationale: >-
        Temporarily stored inputs and outputs are encrypted (Art. 10(1)), access is by account
        token, a private path through Sakura Cloud's service endpoint gateway is documented, and
        the Ishikari data centre has an independent SOC 3 opinion. No tenant-isolation
        description, penetration-test statement or bug-bounty programme is documented for AI
        Engine, and the cloud isolation policy describes virtualised servers and not the inference
        platform. The score meets the anchor for stated encryption and access controls without an
        independent pen-test.
      evidence_refs:
        - ev-terms-ai
        - ev-docs-ops
        - ev-soc3
        - ev-sec-cloud-policy
        - ev-sec-checksheet
    reliability:
      score: 2
      rationale: >-
        Serving is in production, but AI Engine is expressly outside the SLA (manual), Private
        Edition is best effort unless an SLA is written, the Sakura Cloud status page has no AI
        Engine component, and no incident history is published. Only the limited outage
        compensation in basic terms Art. 29(3) applies. That matches the anchor for production
        service with no status page, uptime history or SLA.
      evidence_refs:
        - ev-docs-basics
        - ev-terms-pe
        - ev-terms-basic
        - ev-status
    transparency_lockin:
      score: 3
      rationale: >-
        OpenAI-compatible and Anthropic-compatible APIs over mostly open models with published
        licences, a manual that says all models are hosted by Sakura, no minimum term and a
        self-serve exit, plus a Private Edition dedicated option. The score is held at 3 because
        routing and sub-processor statements sit in non-binding documentation, parameter
        compatibility is partial, most models are previews, the two closed models cannot be taken
        elsewhere, and Private Edition is open to Japanese corporations only.
      evidence_refs:
        - ev-docs-chat
        - ev-docs-licences
        - ev-eula-plamo
        - ev-eula-cotomi
        - ev-terms-ai
        - ev-terms-pe
    cost:
      score: 3
      rationale: >-
        Clear public per-token and per-unit prices in yen, tax included, with a free allowance and
        no minimum term. Prices are not compared with other providers, Private Edition is
        quote-only, RAG storage keeps billing until all documents are deleted, and payment is
        credit card in yen only.
      evidence_refs:
        - ev-marketing-ai
        - ev-terms-ai
        - ev-terms-pe
