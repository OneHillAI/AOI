        source_type: aggregated
        coverage: partial
        refs: [ev-docs-chat, ev-marketing-ai, ev-terms-basic]
        summary: "Preview models can change or end without notice and carry no stability guarantee. Free-plan terms can change at Sakura's discretion (Art. 2(3)). Services end on one month's notice, or at once where authorities or a technology supplier require it (basic terms Art. 28). No per-model sunset schedule."
ownership:
  level: partial
  factors:
    use_modify:
      level: moderate
      rationale: "Mostly Apache-2.0 and MIT models behind OpenAI and Anthropic compatible APIs, but no fine-tuning on the shared service, two closed models with no-fine-tune and no-distillation terms, a military-use ban (Art. 12(1)(vi)), and a dedicated option for Japanese corporations only (Private Edition Art. 3)."
    transparency:
      level: moderate
      rationale: >-
        Three binding terms documents are published, but they are Japanese only, there is no DPA
        or sub-processor list, certification scopes do not name AI Engine, and marketing claims
        (ZDR, Japan-only) are stronger than the terms.
    reliability:
      level: moderate
      rationale: "Production service with a company-level security programme, but no SLA, most models in preview that can end without notice, and no AI Engine status history (manual 01-basics; terms Art. 11 of Private Edition)."
    data_control:
      level: moderate
      rationale: "Art. 10(2) bars use of inputs, third-party provision and AI training on them, but retention is 'in principle not stored' with an undefined encrypted exception, outputs and RAG documents are not covered, and Japan-only processing is not contractual."
  verdict: >-
    Inference here is partly owned. Sakura's terms commit in writing not to use inputs, not to
    give them to model providers and not to train on them, which is a real baseline. They do not
    promise zero retention, do not fix the data location, and come with no SLA or DPA. Ownership
    would move to substantial if Sakura wrote Japan-only processing and a bounded retention period
    into the terms, published a processing agreement, and confirmed AI Engine inside its ISMS
    scope.
evidence:
  - id: ev-terms-ai
    claim: >-
      Sakura AI Engine service terms (さくらの AI Engine サービス約款, in force 2025-09-24). Art. 10(1):
      inputs and outputs are not stored in principle; they may be kept encrypted for a certain
      period for maintenance or fault handling and then deleted. Art. 10(2): Sakura does not use
      inputs or give them to third parties including model providers, and inputs are not used for
      AI training by Sakura or the model provider. Art. 10(3): outputs free to use subject to
      model licences, no warranty. Art. 9: models sub-licensed, user must follow each model
      licence. Art. 3 and 12: export-list and sanctions bars, military-use ban. Art. 6: credit
      card only. Art. 7-8: no minimum term. Art. 13: beta features carry no liability for data
      loss. The terms contain no location clause, SLA, DPA or sub-processor list.
    source_type: publisher
    doc_type: terms
    retrieved: true
    url: https://www.sakura.ad.jp/corporate/wp-content/themes/sakura-corporate/assets/pdf/yakkan_ai-engine.pdf
    date: '2026-11-19'
  - id: ev-terms-pe
    claim: >-
      Sakura AI Engine Private Edition service terms (in force 2026-11-02). Art. 2(2): dedicated
      GPU platform only, not VM, storage, API or network unless agreed. Art. 2(4): closed-network
      connection, fine-tuning and RAG build excluded unless ordered. Art. 3: Japanese-law
      corporations only. Art. 5: 2-month or about 1-year initial term, shared contract cannot be
      cancelled meanwhile. Art. 9: user model and information used only to provide the service,
      not given to third parties, not used to train Sakura or third-party models. Input and output
      are handled per the AI Engine terms; 'in principle' not handled, with exceptions for fault
      investigation, user-requested support and legal or other justifiable reason. Art. 11: best
      effort unless an SLA is written.
    source_type: publisher
    doc_type: terms
    retrieved: true
    url: https://www.sakura.ad.jp/corporate/wp-content/themes/sakura-corporate/assets/pdf/yakkan_ai-engine-private-edition.pdf
