    reliability:
      level: moderate
      rationale: "ISO 27001:2022 is certified and a public status page shows one major incident in under a year of operation, but pay-as-you-go has no SLA and the Reserved and Dedicated SLAs are not public."
      # grounded in: ev-iso (third_party, retrieved), ev-status (publisher, retrieved), ev-terms (Sec 8.2); reliability dim 3
    data_control:
      level: strong
      rationale: "On the data-extraction axis your data stays yours: zero content retention, no training, fine-tuning or service improvement, metadata-only 90-day logs and customer_retains, per Privacy Statement v2.4, Terms v2.1 and DPA v1.4. The caveats are jurisdiction and contractual scope, not extraction: Global Catalogue prompts go outside the EEA (primarily US) and outside the DPA, and a US operator has remote administrative access."
      # grounded in: ev8 (privacy_policy, retrieved), ev10 (privacy_policy, retrieved - US-routing caveat), ev9 (dpa, retrieved - scope and operator access)
  verdict: "You substantially own EU-sensitive workloads here. Zero content retention, no training, metadata-only logs and a portable open-weight exit with shipped single-tenant and air-gapped options keep your data yours, and the Terms, Privacy Statement and DPA state this contractually. Ownership stops short of full because sovereignty is conditional and oversold. The DPA covers EU-hosted models only, the Global Model Catalogue sends prompts outside the EEA, a US company operates the platform with remote access, and the docs' no-CLOUD-Act claim has no binding text behind it. Pin EU-hosted models, sign the DPA, and use Dedicated Capacity or on-premises if operator access matters."

