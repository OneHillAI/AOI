# OneHill v2 INFERENCE-PROVIDER library entry for Infercom (The Inference Company).
# Validated against schema/inference-provider.v2.schema.json.
#   scores  -> scripts/score.py --write        (provider AOI)
#   meters  -> scripts/completeness.py --write  (per-domain completeness/originality)
#   prose   -> assess.md / implement.md / use.md / support.md (sections keyed <!-- item: KEY -->)

schema_version: '2.0'
id: infercom
name: Infercom
profile: inference
hq_country: Luxembourg
summary: 'A Luxembourg-headquartered Inference-as-a-Service provider running open-weight models on
  SambaNova RDU dataflow hardware, with EU-hosted models processed at Equinix Munich 4, Germany. Its
  binding documents (Terms v2.1, Privacy Statement v2.4 of 2026-10-30, DPA v1.4 of 2026-09-24) now all
  read in full: prompt and output content is not stored or used for training, only metadata is logged for 90
  days, the customer keeps ownership, and sub-processors are named. ISO 27001:2022 is read at source (Proks
  certificate, valid to 2028-12-15); the CSA STAR for AI listing is a Level 1 self-assessment, and SOC 2 is "not
  yet". Sovereignty is conditional and the marketing overstates it: the DPA covers EU-hosted models only (Non-EU
  Models need a separate addendum), the Global Model Catalogue routes prompt content outside the EEA, primarily
  to the US, and the platform is operated by a US company (SambaNova) with remote administrative access,
  while the docs and pricing pages claim "no US CLOUD Act exposure". The platform has a public status page
  (one major incident, June 2026) but no SLA outside Reserved Capacity and Dedicated Rack contracts. Shipped
  single-tenant dedicated racks and air-gapped on-premises deployment remain the strongest exit path.

  '
models_served:
- 'EU-hosted on the Inference API (read 2026-11-19): gpt-oss-120b, gemma-4-31B-it, E5-Mistral-7B-Instruct
  (embeddings), Whisper-Large-v3 (speech-to-text)'
- 'Global Model Catalogue (processed outside the EU, primarily US): MiniMax-M3.1-Flash (MiniMax-M3 is an
  alias)'
- 'Retired since the 2026-09-21 pass: Meta-Llama-3.3-70B-Instruct (2026-11-17), DeepSeek-V3.1 and V3.2
  (2026-11-03), MiniMax-M2.7 (2026-09-30)'
- 'Dedicated Capacity and on-premises catalogue (not on the Inference API): GLM-5.3 and MiniMax-M3.1-Flash
  (Preview), MiniMax-M3 (Preview), MiniMax-M2.7, M2.5, gpt-oss-120b and 20b, Whisper, gemma-4-31B-it,
  gemma-3, DeepSeek-V3.2 and others; availability depends on the platform release'
hardware: SambaNova RDU (Reconfigurable Dataflow Unit, SN40L) - custom dataflow hardware,
  native BF16
pricing:
  model: per-token
  notes: 'Pay-as-you-go per-token rates in EUR excluding VAT, read from infercom.ai/pricing on 2026-11-19. No
    minimums or commitment; EUR 5.00 free credit that expires after 30 days; the ToS lets Infercom change PAYG
    prices on posting. Dedicated Capacity and On-Premises are priced per engagement (quote only). Enterprise
    gets the same list rates with committed-volume discounts.

    '
  example_rates:
  - 'gpt-oss-120b (EU): EUR 0.22/M in, EUR 0.59/M out'
  - 'Gemma 4 31B (EU): EUR 0.20/M in, EUR 0.35/M out'
  - 'Whisper Large v3 (EU): EUR 0.10/M input; E5-Mistral 7B embeddings (EU): EUR 0.13/M input'
  - 'MiniMax M3.1 Flash (Global, outside the EU): EUR 0.60/M in, EUR 2.40/M out'
data_governance:
  default_retention: none (zero data retention - data is not stored after inference;
    encrypted in transit)
  trains_on_inputs: never
  zdr_available: yes_default
  zdr_scope_caveats: 'Prompts/outputs are not stored after inference and are never
    used for training - in the binding Privacy Statement v2.4 (Sec 4.3, 6, 11.2), Terms v2.1 (Sec 2.4, 6.3) and, for
    EU-hosted models, DPA v1.4 (Sec 2(1), read in full 2026-11-19). The DPA adds that personnel have no access
    to prompt content in the ordinary course, and that sub-processors may not train either. Usage logs retain
    metadata only (timestamps, token counts, model used - no prompt/response content) for 90 days;
    authentication logs 12 months. The DPA does NOT cover Non-EU Models: DPA Sec 1(1) says they need a separate
    written addendum. The no-store and no-training commitments for the Global Model Catalogue rest on the
    Privacy Statement and Terms only, and the Privacy Statement routes that prompt content outside the EEA,
    primarily to the US, under SCCs / EU-US DPF.

    '
  customer_data_ownership: customer_retains
  outputs_used_to_improve_service: "no"
  third_party_routing_leakage: 'Serves open-weight models only; no closed third-party
    model routing, so no other vendor''s data terms attach. But the Global Model Catalogue
    (currently one model, MiniMax-M3.1-Flash) routes prompt content to SambaNova infrastructure outside the
    EU, primarily the US, under SCCs - a geographic transfer to the platform operator, not a vendor-terms
    transfer.

    '
  subprocessors_disclosed: true
  confidentiality: functional_only
  confidentiality_caveats: 'Re-read 2026-11-19: Terms v2.1 still contain NO confidentiality clause over customer
    inputs (Sec 3.3 only calls API keys confidential credentials). What exists is functional: logical isolation
    from other tenants and model creators (Sec 2.3), the narrow service licence (Sec 6.2), no-other-use
    commitments, and zero content retention. DPA v1.4 Sec 5(1)(b) binds personnel to confidentiality, but as an
    Art. 28(3)(b) duty over personal data, not trade secrets. For proprietary or trade-secret material, use a
    separate NDA or the enterprise / on-prem contract.'
compliance:
  soc2: none
  iso_27001: "yes"
  iso_27701: unknown
  hipaa_baa: unknown
  gdpr_dpa: "yes"
  fedramp: ''
  trust_center_url: https://infercom.ai/trust/
residency:
  eu_region_available: "yes"
  regions:
  - European Union (Munich, Germany - Equinix MU4, Infercom-owned SambaRack hardware)
  - Outside the EU, primarily United States (Global Model Catalogue only; the partner blog also lists Japan)
  sovereign_option: 'EU-sovereign only when you pin EU-hosted models: those run on Infercom-owned hardware at Equinix
    Munich 4 and, per the DPA v1.4 (Sec 1, 2(1), 7a), are processed exclusively in the EU/EEA with no fallback,
    overflow or load-balancing routing outside it. Three limits. First, the Global Model Catalogue serves
    non-EU models whose prompt content is processed outside the EU, primarily in the US, and DPA Sec 1(1) says
    those models are not covered by the DPA at all (a separate addendum is needed). Second, the platform is
    operated by SambaNova Systems, Inc. (US) under a managed services agreement (Terms Sec 2.1), with remote
    administrative access to account identifiers and request metadata under SCCs Module Three (DPA Sec 7a);
    the Trust Centre FAQ says SambaNova has "operational access to the Munich facility". Third, the docs and
    pricing pages say EU sovereign models carry "no US CLOUD Act exposure", a claim no binding document makes
    and one the US operator relationship leaves open. Sovereignty is a per-model choice plus an operator
    caveat, not a blanket property.'
  region_pinning: "yes"
  cloud_act_exposure: true
  provider_can_restrict_access: 'Lower switch-off risk for EU-hosted models (Luxembourg company, German hosting,
    own hardware), but the day-to-day operator is a US company, and the Global Model Catalogue sends prompts to
    US infrastructure. Pin EU-hosted models, ask for the Transfer Impact Assessment (DPA Sec 7a(4)), and use
    Dedicated Capacity or on-premises if operator access is a concern.'
reliability:
  sla: 'None on pay-as-you-go (Terms Sec 8.2). SLAs with uptime commitments and remedies exist for Reserved
    Capacity and Dedicated Rack customers under separate agreement; the SLA text is not public.'
  uptime_notes: 'Public Atlassian Statuspage at status.infercom.ai (component live since 2025-12-31) with
    per-model components, an incident feed and a scheduled-maintenance notice for 2026-11-20. One public
    incident to date: 2026-06-19 to 2026-06-20, impact major, gemma-4-31B-it (workaround posted, resolved after
    about 21 hours). The page states no SLA and the serving platform is under a year old. SambaNova speed claims
    (up to 10x versus GPUs, about 713 output tokens per second on gpt-oss-120b) are vendor figures.'
  incidents:
  - date: '2026-06-19'
    impact: major
    summary: 'Multiple issues with gemma-4-31B-it; workaround max_tokens above 64k; resolved 2026-06-20 11:20 UTC (status.infercom.ai API)'
lock_in:
  openai_compatible_api: true
  portability_notes: 'OpenAI-compatible API serving portable open-weight models - migrate
    by re-pointing the base URL and key. The SambaNova RDU hardware is a provider-side
    dependency, but because the served models are open-weight, the same checkpoints
    run on GPU-based providers or self-hosted, so customer lock-in is low.

    '
dedicated_availability: available
dedicated_notes: 'Two shipped isolation levels available today (On-Premises page, Trust Centre FAQ and Sovereign AI page,
  re-read 2026-11-19): single-tenant dedicated racks in the EU data centres ("no other tenants", flat
  monthly, custom SLAs) and full on-prem / air-gapped deployment in your own facility (SambaRack
  SN40L; "SambaStack runs fully offline" in an air-gap; ~90 days contract-to-production), with BYOC
  (bring-your-own-checkpoint). Per-engagement contracts, so the weight-ownership language sits in
  unpublished paper, but the deployment options are real and shipped - the strongest control/exit
  path among the EU providers here.'
trust_considerations:
- 'ISO 27001:2022 is read at source (Proks Certification GmbH certificate LU-IS-20250253, valid 2025-12-16
  to 2028-12-15, scope Inference as a Service), a third-party attestation. The CSA STAR for AI listing is
  a Level 1 self-assessment (AI CAIQ v1.1.0), not an audit, and the Trust Centre says SOC 2 is "Not yet".'
- 'Sovereignty is conditional and the marketing overstates it. The docs and pricing pages say EU sovereign
  models have "no US CLOUD Act exposure". The binding Terms (Sec 2.1) and DPA v1.4 (Sec 7, 7a) disclose
  that the platform is operated by SambaNova Systems, Inc., a US company, with remote administrative
  access under SCCs; no binding document addresses CLOUD Act reach through that operator. Treat the claim
  as marketing.'
- 'The DPA (v1.4, 2026-09-24) covers EU-hosted models only. Non-EU Models need a separate written addendum,
  and the Global Model Catalogue (one model today, MiniMax-M3.1-Flash) sends prompt content outside the
  EEA, primarily to the US. Pin EU-hosted models and decline the Global Catalogue to keep inside the DPA.'
- 'Content is not stored and never used for training, with metadata-only 90-day logs, in the Privacy
  Statement v2.4, Terms v2.1 and DPA v1.4, all read in full on 2026-11-19. The DPA adds 48-hour breach
  notification and controller audit rights.'
- 'Sub-processors are now named, but in two lists that do not match: the Privacy Statement names SambaNova,
  Auth0, Stripe, Metronome (US) and TECLIB; the DPA names SambaNova, Google Ireland, Pipedrive, Stripe and
  TECLIB. SambaNova''s own further sub-processors are available only on request.'
- 'Public status page (status.infercom.ai) with one major incident (June 2026) but no SLA outside Reserved
  Capacity and Dedicated Rack contracts; the platform has been live under a year.'
- 'The model roster is thin and churns: four EU-hosted models and one Global model on the Inference API,
  with Llama 3.3 70B and two DeepSeek models retired in November 2026 on two to three weeks'' notice (the
  Terms still allow changes "without prior notice").'
- 'The standard ToS has NO express confidentiality clause - only functional protections (isolation, zero-
  retention, narrow licence); the DPA''s confidentiality attaches to personal data, not trade secrets. For
  trade-secret material use an NDA or the enterprise / on-prem contract.'
- 'Genuinely shipped isolation - single-tenant dedicated racks in Munich plus full on-prem / air-gapped
  BYOC, available today (unlike Groq''s enterprise-only/undocumented or Berget''s coming-soon) - the
  strongest control and exit path among the providers here.'
score:
  rubric_version: '1.2'
  headline: 78.4
  grade: B
  hard_flags: []
  dimensions:
    data_governance:
      score: 4
      rationale: 'Zero content retention - "Infercom does not store, log, or retain the
        content of your prompts or model outputs" - prompts never used for training,
        fine-tuning or service improvement, customer retains ownership, and metadata-only
        90-day usage logs. Read verbatim in the binding Privacy Statement v2.4 (ev8) and, for EU-hosted
        models, in the full text of DPA v1.4 (ev9, read 2026-11-19), so it is contractual rather than a
        trust-centre claim. Sub-processors are now named in both documents (ev8, ev9), though the two lists
        differ. Held below 5 because the no-retention/no-training posture is the provider''s own binding
        attestation, not independently audited (ISO 27001 covers security management, not this clause),
        the DPA does not cover Non-EU Models, and confidentiality is only functional (no express duty over
        customer inputs, ev-noconf).

        '
      evidence_refs:
      - ev8
      - ev9
      - ev2
    compliance:
      score: 4
      rationale: 'ISO 27001:2022 read at source: Proks Certification GmbH certificate LU-IS-20250253, valid
        2025-12-16 to 2028-12-15, scope Inference as a Service (ev-iso, third-party attestation, retrieved
        2026-11-19). Plus a CSA STAR for AI listing (ev-csa), which is a Level 1 self-assessment (AI CAIQ
        v1.1.0), and an Art. 28(3) GDPR DPA read in full (ev9). Meets the score-4 anchor, which names ISO 27001
        plus CSA STAR as two attestations, but note the CSA entry is self-assessed, so the independent weight
        rests on the ISO certificate alone. Short of 5: SOC 2 is "Not yet" (Trust Centre), there is no ISO 27701
        or HIPAA/BAA, and the Trust Centre listing (ev2) is a first-party surface.

        '
      evidence_refs:
      - ev-iso
      - ev-csa
      - ev9
      - ev2
    residency:
      score: 4
      rationale: 'EU-hosted models run on Infercom-owned hardware at Equinix Munich 4 and, under DPA v1.4
        (ev9, Sec 1, 2(1), 7a), are processed exclusively in the EU/EEA with no fallback or overflow routing
        outside it - a documented data boundary for the main workload. Held below 5 because: Infercom''s own
        Privacy Statement (ev10) routes Global Model Catalogue prompt content outside the EEA, primarily to the
        US, and the DPA excludes those Non-EU Models; the platform is operated by a US company (SambaNova) with
        remote administrative access under SCCs (Terms Sec 2.1, DPA Sec 7a), so the marketing line "no US CLOUD
        Act exposure" (ev7) is not supported by any binding text; and no third-party attestation covers
        residency. Sovereignty is a per-model choice plus an operator caveat.

        '
      evidence_refs:
      - ev7
      - ev10
      - ev9
    security:
      score: 4
      rationale: 'ISO 27001:2022 certificate read (ev-iso), plus binding technical measures: DPA v1.4 Annex 1
        (ev9) lists TLS 1.2+, in-memory stateless processing, hardware-level tenant sandboxing, MFA, least
        privilege, logging, DDoS protection and automated failover, and the Privacy Statement (ev8) adds AES-256
        at rest. Held below 5 because no independent penetration-test report or bug-bounty programme was found
        (vulnerability reports go to an e-mail address), SOC 2 is "Not yet", the physical controls sit with the
        Equinix facility and the US operator, and the platform is under a year old.

        '
      evidence_refs:
      - ev-iso
      - ev9
      - ev2
    reliability:
      score: 3
      rationale: 'RAISED 2 -> 3 on 2026-11-19. The earlier "no status page" finding no longer holds: a public
        Atlassian Statuspage (ev-status) has run since 2025-12-31 with per-model components, an incident feed, a
        scheduled-maintenance notice and one documented major incident (gemma-4-31B-it, 2026-06-19, resolved in
        about 21 hours). That meets the score-3 anchor (operational track record, public status page, documented
        incident communication). Short of 4: pay-as-you-go has no SLA (Terms Sec 8.2), the Reserved Capacity and
        Dedicated Rack SLAs are not public, and the platform is under a year old.

        '
      evidence_refs:
      - ev-status
      - ev-terms
    transparency_lockin:
      score: 5
      rationale: 'OpenAI-compatible API over portable open-weight models, plus a shipped single-tenant Dedicated
        Capacity product and on-prem / air-gapped BYOC deployment (re-read 2026-11-19, ev-onprem): you can run
        the same open checkpoints in your own facility, the strongest control and exit. The SambaNova RDU is a
        provider-side dependency in the hosted mode only. Routing is transparent (each model is tagged EU or
        Non-EU in /v1/models) and sub-processors are named, though in two lists that do not match. The Inference
        API roster is thin (four EU models, one Global) and churns, with a two-to-three-week deprecation notice
        (ev-docs). The 5 rests on the third-party gateway ref (ev5) and the shipped on-prem path.

        '
      evidence_refs:
      - ev5
      - ev-onprem
      - ev-docs
    cost:
      score: 3
      rationale: 'Per-token EUR rates are now published (ev1, read 2026-11-19): gpt-oss-120b 0.22/0.59, Gemma 4 31B
        0.20/0.35, MiniMax M3.1 Flash 0.60/2.40 per 1M tokens, with no minimums. Rate limits by tier are documented
        (ev-docs). Held at 3 rather than 4: Dedicated Capacity and On-Premises are quote-only, the ToS allows
        price changes on posting, and no independent cost benchmark was captured.

        '
      evidence_refs:
      - ev1
      - ev-docs

