ownership:
  level: substantial
  factors:
    use_modify:
      level: strong
      rationale: "OpenAI-compatible API over portable open-weight models served in native BF16 - the SambaNova RDU is a provider-side dependency, but the same checkpoints run on GPU providers or self-hosted, so customer exit cost is low."
      # grounded in: ev5 (third_party - gateway partnership, OpenAI-compatible, no vendor lock-in), lock_in block
    transparency:
      level: moderate
      rationale: "The no-storage/no-training posture is legible in the binding Privacy Policy, and the DPA is a confirmed Art. 28(3) agreement; the served catalogue is open-weight and inspectable. Held to moderate because the sub-processor list is not disclosed and the DPA PDF's full clause text was unreadable behind the proxy (documented but unverified)."
      # grounded in: ev8 (privacy_policy, retrieved), ev9 (dpa, retrieved:false - identity confirmed, clauses unverified); subprocessors_disclosed:false
    reliability:
      level: moderate
      rationale: "ISO 27001 and the CSA AI assessment give real security maturity, but the platform is newly launched (first datacenter late 2025) with no public uptime SLA or status history verified."
      # grounded in: ev4 (third_party - first datacenter late 2025), ev2; reliability.sla empty
    data_control:
      level: strong
      rationale: "On the data-extraction axis your data stays yours: zero retention, prompts never used for training/fine-tuning/service-improvement, metadata-only 90-day logs and customer_retains - read verbatim from the binding Privacy Policy. The one caveat is jurisdictional, not extractive: the same Privacy Policy routes non-EU-hosted Global Catalogue prompt content to SambaNova US infrastructure under SCCs / EU-US DPF, so residency (unlike retention) is conditional on pinning EU-hosted models."
      # grounded in: ev8 (privacy_policy, retrieved - ZDR/no-train/metadata-log), ev10 (privacy_policy, retrieved - US-routing caveat)
  verdict: "You substantially own EU-sensitive workloads here: zero retention, prompts never trained on, metadata-only logs and a portable open-weight exit keep your data yours, and the posture is read from a binding Privacy Policy and an Art. 28(3) DPA rather than a marketing page. It stops short of full because sovereignty is conditional - Infercom's own Privacy Policy routes the default Global Model Catalogue's non-EU-hosted prompts to the US under SCCs - the platform is newly launched with no verified uptime SLA, and the sub-processor list is undisclosed. Pin EU-hosted models and sign the DPA to keep data in EU jurisdiction."

