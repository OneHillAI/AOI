schema_version: '2.0'
id: infercom
name: Infercom
profile: inference
hq_country: Luxembourg
summary: 'A Luxembourg-headquartered EU-sovereign Inference-as-a-Service provider running
  open-weight models in native BF16 on SambaNova RDU dataflow hardware, with EU-routed
  inference hosted in Munich, Germany, under 100% EU jurisdiction. Its standout facts
  are jurisdictional and compliance-led: data stays in EU jurisdiction with no US CLOUD
  Act exposure for EU-hosted models, zero data retention (data is gone after inference,
  encrypted in transit), prompts are never used for training, and usage logs hold
  metadata only (timestamps/token counts/model - no content, 90-day retention). It
  is ISO 27001 certified and has completed the Cloud Security Alliance''s AI security
  assessment (CSA STAR / AI CAIQ), and aligns with GDPR, German BDSG and the EU AI
  Act. A binding Privacy Policy and a GDPR Art. 28(3) DPA set out the no-storage/no-training
  posture, beyond the trust centre. Main caveats: sovereignty is conditional
  - Infercom''s own Privacy Policy states the default Global Model Catalogue routes non-EU-hosted
  models'' prompt content to US infrastructure (SambaNova) under SCCs, so you must pin
  EU-hosted models to keep data in the EU; the platform is newly launched (first datacenter
  late 2025) with no verified uptime SLA; and the SambaNova custom hardware is a mild
  provider-side lock-in (customer models remain open-weight and portable).

  '
models_served:
- Open-weight models served in native BF16 (e.g. Llama / gpt-oss family)
hardware: SambaNova RDU (Reconfigurable Dataflow Unit, SN40L) - custom dataflow hardware,
  native BF16
pricing:
  model: per-token
  notes: 'Pay-as-you-go for OpenAI-compatible inference. Exact per-model rates were
    not confirmed in public sources.

    '
  example_rates:
  - 'Pay-as-you-go per-token (exact per-model rates not confirmed in public sources)'
data_governance:
  default_retention: none (zero data retention - data is not stored after inference;
    encrypted in transit)
  trains_on_inputs: never
  zdr_available: yes_default
  zdr_scope_caveats: 'Prompts/outputs are not stored after inference and are never
    used for training - documented in the binding Privacy Policy and DPA v1.3 (GDPR
    Art. 28(3)), not only the trust centre. Usage logs retain metadata only (timestamps,
    token counts, model used - no prompt/response content) for 90 days. Retention scope
    caveat: the Privacy Policy states that for Global Model Catalogue models NOT hosted
    on EU infrastructure, prompt content is routed to SambaNova global infrastructure
    outside the EEA (primarily the US) under SCCs / EU-US DPF - so residency, unlike
    the no-storage/no-training posture, depends on choosing EU-hosted models.

    '
  customer_data_ownership: customer_retains
  outputs_used_to_improve_service: "no"
  third_party_routing_leakage: 'Serves open-weight models only; no closed third-party
    model routing, so no other vendor''s data terms attach. But the Global Model Catalogue
    routes non-EU-hosted models'' prompt content to US infrastructure (SambaNova) under
    SCCs - a geographic transfer, not a vendor-terms transfer.

    '
  subprocessors_disclosed: false
  confidentiality: functional_only
  confidentiality_caveats: 'The standard ToS contains NO confidentiality clause at all - no
    definition of Confidential Information covering your inputs, no express duty of confidence. What
    exists is functional: logical isolation from other tenants and model creators, the narrow
    service licence, the no-other-use commitments, and zero retention. The DPA''s confidentiality
    obligations (personnel; sub-processor flow-down) attach to personal data, not trade secrets. For
    proprietary/trade-secret material, use a separate NDA or the enterprise/on-prem contract.'
compliance:
  soc2: unknown
  iso_27001: "yes"
  iso_27701: unknown
  hipaa_baa: unknown
  gdpr_dpa: "yes"
  fedramp: ''
  trust_center_url: https://infercom.ai/trust/
residency:
  eu_region_available: "yes"
  regions:
  - European Union (Munich, Germany)
  - United States
  - Japan
  sovereign_option: 'EU-sovereign only when you pin EU-hosted models: those run in German
    datacenters (Equinix Munich) under EU jurisdiction and stay in the EEA. The default
    Global Model Catalogue also serves non-EU-hosted models whose prompt content is routed
    to US infrastructure (SambaNova) under SCCs - so sovereignty is a per-model choice,
    not a blanket property of the platform.'
  region_pinning: "yes"
  cloud_act_exposure: true
  provider_can_restrict_access: 'Low switch-off risk for EU-hosted models (German/EU
    jurisdiction, no US CLOUD Act reach). But the Global Model Catalogue routes non-EU-hosted
    models'' prompts to the US under SCCs / EU-US DPF, which does carry US-jurisdiction
    exposure - pin EU-hosted models to avoid it.'
reliability:
  sla: ''
  uptime_notes: 'SambaNova RDU dataflow claims up to 10x faster inference and up to
    5x better energy efficiency vs GPU alternatives, but the platform is newly launched
    (first datacenter late 2025) and no public uptime SLA or history was independently
    verified.'
  incidents: []
lock_in:
  openai_compatible_api: true
  portability_notes: 'OpenAI-compatible API serving portable open-weight models - migrate
    by re-pointing the base URL and key. The SambaNova RDU hardware is a provider-side
    dependency, but because the served models are open-weight, the same checkpoints
    run on GPU-based providers or self-hosted, so customer lock-in is low.

    '
dedicated_availability: available
dedicated_notes: 'Two shipped isolation levels available today (per the On-Premises page, read
  2026-08-06): single-tenant dedicated racks in the EU data centres ("no other tenants", flat
  monthly, custom SLAs) and full on-prem / air-gapped deployment in your own facility (SambaRack
  SN40L; "SambaStack runs fully offline" in an air-gap; ~90 days contract-to-production), with BYOC
  (bring-your-own-checkpoint). Per-engagement contracts, so the weight-ownership language sits in
  unpublished paper, but the deployment options are real and shipped - the strongest control/exit
  path among the EU providers here.'
trust_considerations:
- ISO 27001 certified plus a completed CSA AI security assessment (CSA STAR / AI CAIQ),
  GDPR / German BDSG / EU AI Act alignment - a strong, third-party-corroborated compliance
  posture for an EU adopter.
- Sovereignty is conditional - EU-hosted models run in Munich under EU jurisdiction with
  no US CLOUD Act exposure, but Infercom's own Privacy Policy routes the default Global
  Model Catalogue's non-EU-hosted prompts to US infrastructure (SambaNova) under SCCs;
  pin EU-hosted models to keep data in the EU.
- Zero data retention with prompts never used for training and metadata-only 90-day
  usage logs (no content) - set out in a binding Privacy Policy and DPA v1.3, not just
  the trust centre.
- Newly launched platform (first datacenter late 2025); no public uptime SLA/history
  verified, and the exact model roster is not fully confirmed.
- SambaNova custom RDU hardware is a mild provider-side lock-in note; customer-facing
  models remain open-weight and portable.
- The standard ToS has NO express confidentiality clause - only functional protections (isolation,
  zero-retention, narrow licence); the DPA's confidentiality attaches to personal data, not trade
  secrets. For trade-secret material this is arguably the more important caveat than sovereignty -
  use an NDA or the enterprise / on-prem contract.
- Genuinely shipped isolation - single-tenant dedicated racks plus full on-prem / air-gapped BYOC,
  available today (unlike Groq's enterprise-only/undocumented or Berget's coming-soon) - the
  strongest control and exit path among the providers here.
score:
  rubric_version: '1.2'
  headline: 76.0
  grade: B
  hard_flags: []
  dimensions:
    data_governance:
      score: 4
      rationale: 'Zero data retention - "Infercom does not store, log, or retain the
        content of your prompts or model outputs" - prompts never used for training,
        fine-tuning or service improvement, customer retains ownership, and metadata-only
        90-day usage logs. This is documented verbatim in the binding Privacy Policy (ev8),
        with a GDPR Art. 28(3) DPA v1.3 on top (ev9), so it is contractual rather than a
        trust-centre claim. Held below 5 because the no-retention/no-training posture is
        the provider''s own binding attestation, not independently audited: ISO 27001
        covers security management but not this specific clause, and non-EU-hosted
        Global Catalogue models route prompt content to the US under SCCs (see residency).

        '
      evidence_refs:
      - ev8
      - ev9
      - ev2
    compliance:
      score: 4
      rationale: 'ISO 27001 certified - a third-party-audited standard - corroborated by
        the independent SambaNova sovereign-AI partnership announcement (ev3), which
        satisfies the independent-attestation bar for a claim the vendor cannot self-certify;
        plus a completed CSA AI security assessment (CSA STAR Level 1 self-assessment /
        AI CAIQ v1.1.0) and GDPR, German BDSG and EU AI Act alignment. Meets the score-4
        anchor (two independent security attestations - ISO 27001 + CSA STAR - plus GDPR/DPA);
        short of 5, which additionally needs SOC 2 Type II, ISO 27701 and a HIPAA/BAA plus a
        published trust centre (the trust-centre listing here (ev2) is a marketing surface,
        so the rating rests on the third-party ref, not the self-attestation).

        '
      evidence_refs:
      - ev2
      - ev3
    residency:
      score: 4
      rationale: 'EU-hosted models run at Equinix Munich under EU jurisdiction and stay in
        the EEA with no US CLOUD Act exposure - genuine sovereignty when you pin them. Held
        below 5 because Infercom''s own Privacy Policy (ev10) states that
        for Global Model Catalogue models not hosted on EU infrastructure "your API requests
        (including prompt content) are routed to SambaNova''s global infrastructure outside
        the EEA, primarily in the United States" under EC SCCs (Decision 2021/914) / EU-US
        DPF - so full sovereignty is conditional on model choice, not guaranteed platform-wide.

        '
      evidence_refs:
      - ev7
      - ev10
      - ev9
    security:
      score: 4
      rationale: 'ISO 27001-certified security management, a completed CSA AI security
        assessment and encryption in transit. Held below 5 because these controls are
        described on the trust-centre marketing surface (ev2) with no binding security
        document retrieved, the platform is newly launched, and no independent
        penetration test beyond the ISO/CSA scope was surfaced.

        '
      evidence_refs:
      - ev2
    reliability:
      score: 2
      rationale: 'SambaNova RDU dataflow claims strong performance/efficiency, but
        the platform is newly launched (first datacenter late 2025) and no public
        uptime SLA, status page or history was independently verified. Meets the score-2
        anchor (serving in production, but no status page or published uptime history);
        a public status page would reach 3.

        '
      evidence_refs:
      - ev4
    transparency_lockin:
      score: 5
      rationale: 'OpenAI-compatible API over portable open-weight models, plus a shipped
        on-prem / air-gapped / single-tenant BYOC deployment path (read 2026-08-06): you can run
        the same open checkpoints in your own facility, the strongest possible control and exit.
        The SambaNova RDU is a provider-side dependency in the hosted mode only - the
        on-prem/air-gapped option removes it entirely. Reaches the top anchor on control/exit;
        the exact served-model roster is the remaining unknown.

        '
      evidence_refs:
      - ev5
      - ev-onprem
    cost:
      score: 3
      rationale: 'Pay-as-you-go OpenAI-compatible pricing, but exact per-model rates
        were not confirmed in public sources and no independent cost benchmark was
        captured.

        '
      evidence_refs:
      - ev1

