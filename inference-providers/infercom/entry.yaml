        title: "Data governance - retention, ZDR & training"
        doc_type: reference
        source_type: aggregated
        coverage: full
        refs: [ev8, ev9, ev2]
        summary: "Zero content retention (prompts and outputs not stored after inference), no training, fine-tuning or service improvement, and metadata-only logs kept 90 days, per Privacy Statement v2.4 and Terms v2.1 and, for EU-hosted models, DPA v1.4. The DPA excludes Non-EU Models."
      - key: data-ownership
        title: "Data & IP ownership"
        doc_type: reference
        source_type: aggregated
        coverage: full
        refs: [ev8, ev10, ev9]
        summary: "Terms v2.1 Sec 6 leave you owning Input and Output with a narrow processing licence; nothing is retained or used to improve the service, and only open-weight models are served. Caveats: sub-processors are named in two lists that do not match, and Non-EU Models fall outside the DPA (see residency)."
      - key: residency
        title: "Data residency & jurisdiction"
        doc_type: reference
        source_type: aggregated
        coverage: full
        refs: [ev10, ev7, ev9]
        summary: "EU-hosted models run on Infercom-owned hardware at Equinix Munich 4 and, under DPA v1.4, never leave the EU/EEA. The Global Model Catalogue sends prompt content outside the EEA, primarily to the US, outside the DPA. The platform operator SambaNova is a US company with remote administrative access, so the marketing claim of no US CLOUD Act exposure is not backed by any binding text."
      - key: compliance
        title: "Compliance & attestations"
        doc_type: reference
        source_type: aggregated
        coverage: full
        refs: [ev-iso, ev-csa, ev9]
        summary: "ISO 27001:2022 certificate (Proks, valid to 2028-12-15). CSA STAR for AI is a Level 1 self-assessment. Art. 28(3) DPA v1.4. SOC 2 is not held (Trust Centre: Not yet); no ISO 27701 or HIPAA/BAA."
      - key: security
        title: "Security controls"
        doc_type: reference
        source_type: aggregated
        coverage: full
        refs: [ev-iso, ev9, ev2]
        summary: "ISO 27001-certified ISMS, TLS 1.2+ in transit, AES-256 at rest, stateless in-memory processing, hardware tenant sandboxing, MFA and least privilege (DPA Annex 1). No independent pen-test report or bug bounty is published; vulnerability reports go to an e-mail address; no private connectivity."
      - key: pricing
        title: "Pricing & cost model"
        doc_type: reference
        source_type: aggregated
        coverage: full
        refs: [ev1, ev-docs]
        summary: "Published EUR per-token rates excluding VAT (gpt-oss-120b 0.22/0.59, Gemma 4 31B 0.20/0.35, MiniMax M3.1 Flash 0.60/2.40 per 1M), no minimums, EUR 5 free credit; Dedicated and On-Premises priced per engagement. The ToS allows PAYG price changes on posting."
      - key: reliability
        title: "Reliability posture"
        doc_type: reference
        source_type: aggregated
        coverage: full
        refs: [ev-status, ev-terms]
        summary: "Public status page since 2025-12-31 with per-model components and one documented major incident (June 2026). No SLA on pay-as-you-go; SLAs exist for Reserved Capacity and Dedicated Rack under separate agreement. Speed claims (10x versus GPUs) are vendor figures."
  implement:
    completeness: 75.0
    originality: 0.0
    items:
      - key: integration
        title: "API integration"
        doc_type: howto
        source_type: aggregated
        coverage: full
        refs: [ev1, ev5]
        summary: "OpenAI-compatible APIs - point an existing OpenAI client at https://api.infercom.ai/v1 with an Infercom key; the docs also list Anthropic-SDK compatibility and a Responses API. Also reachable via the Opper AI gateway."
      - key: region-config
        title: "Region & sovereignty configuration"
        doc_type: howto
        source_type: aggregated
        coverage: full
        refs: [ev10, ev9, ev-docs]
