        refs: [ev-docs]
        summary: "Free tier (no payment method) 20 requests per minute and 20 per day per model; Developer tier (card linked) e.g. gpt-oss-120b 150 per minute and 50,000 per day; Enterprise defaults 500 per minute and 100,000 per day with custom limits on request. Limits are in requests, not tokens."
      - key: portability
