        title: "Model deprecation policy"
        doc_type: reference
        source_type: aggregated
        coverage: full
        refs: [ev-docs]
        summary: "Production models get at least two to three weeks' deprecation notice by e-mail, the docs and the Playground; a dated record lists retirements (Llama 3.3 70B on 2026-11-17, DeepSeek V3.1 and V3.2 on 2026-11-03). The ToS Sec 2.2 still says models may change without prior notice."

ownership:
  level: substantial
  factors:
    use_modify:
      level: strong
      rationale: "OpenAI-compatible API over portable open-weight models; the same checkpoints run on GPU providers or self-hosted, and single-tenant Dedicated Capacity and on-prem / air-gapped BYOC are shipped, so exit cost is low."
      # grounded in: ev5 (third_party - gateway partnership, OpenAI-compatible), ev-onprem (docs, retrieved), lock_in block
    transparency:
      level: moderate
      rationale: "Terms v2.1, Privacy Statement v2.4 and DPA v1.4 are all published and were read in full, and sub-processors are now named. Held at moderate because the Privacy Statement and DPA sub-processor lists do not match, the DPA excludes Non-EU Models, SambaNova's own sub-processors are on request only, and the docs claim no US CLOUD Act exposure while the binding texts disclose a US operator."
      # grounded in: ev8 (privacy_policy, retrieved), ev9 (dpa, retrieved:true as of 2026-11-19), ev7 (marketing claim contradicted by ev-terms and ev9)
    reliability:
      level: moderate
      rationale: "ISO 27001:2022 is certified and a public status page shows one major incident in under a year of operation, but pay-as-you-go has no SLA and the Reserved and Dedicated SLAs are not public."
      # grounded in: ev-iso (third_party, retrieved), ev-status (publisher, retrieved), ev-terms (Sec 8.2); reliability dim 3
    data_control:
      level: strong
      rationale: "On the data-extraction axis your data stays yours: zero content retention, no training, fine-tuning or service improvement, metadata-only 90-day logs and customer_retains - read verbatim from Privacy Statement v2.4, Terms v2.1 and DPA v1.4. The caveats are jurisdictional and contractual scope, not extractive: Global Catalogue prompts go outside the EEA (primarily US) and outside the DPA, and a US operator has remote administrative access."
      # grounded in: ev8 (privacy_policy, retrieved), ev10 (privacy_policy, retrieved - US-routing caveat), ev9 (dpa, retrieved - scope and operator access)
  verdict: "You substantially own EU-sensitive workloads here: zero content retention, no training, metadata-only logs and a portable open-weight exit with shipped single-tenant and air-gapped options keep your data yours, and the posture is read from the full Terms, Privacy Statement and DPA rather than a marketing page. It stops short of full because sovereignty is conditional and oversold: the DPA covers EU-hosted models only, the Global Model Catalogue sends prompts outside the EEA, a US company operates the platform with remote access, and the docs' no-CLOUD-Act claim has no binding text behind it. Pin EU-hosted models, sign the DPA, and use Dedicated Capacity or on-premises if operator access matters."

