# web tools; false = documented/known to exist but NOT read this session). infercom.ai
# returns 403 to WebFetch on every path (privacy policy, DPA PDF, trust, glossary, third-party
# blogs); the binding Privacy Policy's clauses were recovered VERBATIM via scoped WebSearch
# extraction this session and are marked retrieved:true. The DPA v1.3 PDF was unreadable behind
# the proxy - only its identity (Art. 28(3), Luxembourg entity, effective date) was indexed, not
# its operative clauses - so it stays retrieved:false and is listed as outstanding.
