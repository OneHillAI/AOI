data_governance:
  default_retention: 'By default, Nebius collects and stores Inputs/Outputs for the
    purposes of providing the Service AND for training its own smaller "Speculative
    Decoding" models (Token Factory Supplemental Terms Sec 5.1(b) and 5.4, effective
    2026-10-22; the same clause was Sec 7 of the legacy Token Factory Terms), unless the
    customer opts out (via onboarding form or emailing support) or enables Zero Data
    Retention. Nebius also keeps "absolute discretion" to remove, screen or delete Inputs and
    Outputs without notice (5.3). Retained Speculative Decoding data is stored in Finland (EU)
    regardless of where real-time processing happens (Legal Quick Guide 5.1). Fine-tuning
    artifacts are stored exclusively in EU data centres per the Legal Quick Guide.'
  trains_on_inputs: by_default
  zdr_available: yes_optional
  zdr_scope_caveats: 'Zero Data Retention is an account-level opt-in ("enable Zero Data
    Retention in your account settings"), not the default. Enabling it stops storage and
    stops use for Speculative Decoding, but the Legal Quick Guide itself warns enabling
    it "may impact the level of service provided (e.g., inference speed)." Dedicated
    endpoints separately advertise a "zero-retention data flow" as a built-in feature of
    that tier.

    '
  customer_data_ownership: customer_retains
  outputs_used_to_improve_service: opt_out
  third_party_routing_leakage: 'Serves an overwhelmingly open-weight catalogue (Apache
    2.0 / MIT / DeepSeek / Llama licences per the catalogue''s own licence fields); no
    closed third-party model routing identified for Token Factory.

    '
  subprocessors_disclosed: true
  confidentiality: functional_only
  confidentiality_caveats: 'The Nebius Services Agreement (effective 2026-10-22) has a general mutual
    confidentiality clause (Sec 18) over "any information of the disclosing party" that does not name
    Customer Data or Customer AI Content, and a purpose limitation (Sec 10.1.3) that lets Nebius use
    Customer Data "solely to perform, or as otherwise set forth in" the Agreement and the Token
    Factory Supplemental Terms - which include the Speculative Decoding training licence (5.1(b)), a
    royalty-free, transferable, sub-licensable, worldwide licence to Input and Output. The DPA gives a
    processor confidentiality duty (2.5) scoped to "Customer Personal Data". Coded functional_only
    rather than disclaimed because no clause states Customer Content is non-confidential, but this is
    a close call: the purpose limitation is only as narrow as the Supplemental Terms allow. The Legal
    Quick Guide (non-binding) says "we do not use your content to train, fine-tune or improve any AI
    models" and that Speculative Decoding "does not involve training any model", while the binding
    Supplemental Terms say Nebius may "train smaller Models used for Speculative Decoding"; the
    contract governs.'
