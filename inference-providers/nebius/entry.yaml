ownership:
  level: partial
  factors:
    use_modify:   { level: strong,   rationale: "An OpenAI-compatible API (the quickstart uses the OpenAI client against api.tokenfactory.nebius.com/v1) over a predominantly open-weight catalogue keeps served checkpoints portable, and the customer retains ownership of Customer Content (Supplemental Terms 3.1) subject to Nebius' 5.1 licence. Dedicated endpoints keep deprecated models available; the serverless catalogue churns on dated notices." }
    transparency: { level: moderate, rationale: "The Services Agreement, Token Factory Supplemental Terms, DPA, sub-processor list, regions, SLA and docs are public and legible, and the catalogue renders in a browser with per-model prices and context. The legacy Terms apply only to customers with an active reserve as of 2026-09-15; everyone else is under the Supplemental Terms. The non-binding Legal Quick Guide contradicts the binding training clause. The logged-in price list and dedicated prices are not public." }
    reliability:  { level: moderate, rationale: "No inference SLA exists, and Supplemental Terms 7.4 says so expressly (no service level commitments, uptime guarantees or credits unless agreed in writing). Self-service dedicated endpoints carry no formal SLA and release capacity on any stop or incident. The status page shows a Token Factory component per region and two resolved Token Factory incidents in its 14-day window." }
    data_control: { level: weak,     rationale: "The binding Supplemental Terms (5.1(b), effective 2026-10-22) let Nebius use Input and Output by default to train smaller Speculative Decoding models, with an opt-out by onboarding form or email, and reserve absolute discretion to delete them without notice (5.3). Zero Data Retention exists only as an account-level opt-in. The Legal Quick Guide contradicts this in plain English; the contract governs." }
  verdict: "Data control is limited by default. The binding Token Factory Supplemental Terms (5.1(b), effective 2026-10-22) allow Nebius to train its smaller Speculative Decoding models on your Inputs and Outputs unless you opt out. The Legal Quick Guide tells readers that content is not used to train any model. Compliance is a strength, evidenced by a public Deloitte SOC 3 report and an SII-QCD ISO 27001 certificate. Two EU data-plane regions (Finland, France) are documented, but public endpoints are unpinned and the standard terms carry no inference SLA. For sensitive data, enable Zero Data Retention (it also stops Speculative Decoding) and use a dedicated endpoint in an EU region for residency."

evidence:
- id: ev-tfterms
  claim: "Nebius Token Factory Supplemental Terms (publication and effective date 2026-10-22), incorporated into the Nebius Services Agreement. Sec 3.1: customer retains ownership of Customer Content including Input and Output. Sec 5.1: Nebius may 'access, use, host, cache, store, copy, modify, and otherwise process Input and Output to (a) provide, maintain, monitor, protect, and support the Services ... or (b) train smaller Models used for Speculative Decoding', under 'royalty free, transferable, sublicensable, and worldwide' licences. Sec 5.3: 'absolute discretion, to remove, screen, or delete any Inputs or Outputs at any time, for any reason, and without notice.' Sec 5.4: opt-out of storage and of Speculative Decoding through the onboarding form or an email to tokenfactory-support@nebius.com. Sec 7.4: 'Nebius does not provide any service level commitments, uptime guarantees, or associated compensation for the Token Factory Service.' Extract: docs/primary-sources/nebius/terms__token-factory-supplemental__2026-11-19.md."
  source_type: publisher
  doc_type: terms
  retrieved: true
  url: https://docs.nebius.com/legal/token-factory
  date: '2026-11-19'
- id: ev-tos
  claim: "Legacy Nebius Token Factory Terms of Service (publication date 2026-08-20). A banner states they apply exclusively to customers with an active reserve as of 2026-09-15 and that from 2026-09-28 other customers are governed by the Nebius Services Agreement. Sec 7: Nebius 'collects and processes both Input and Output data for the purpose of training smaller Models used exclusively for Speculative Decoding', with an opt-out by onboarding form or email and 'absolute discretion' to delete Inputs and Outputs without notice. Sec 10: customer ownership. The Supplemental Terms (ev-tfterms) govern other customers, and their training sentence omits the word 'exclusively'."
