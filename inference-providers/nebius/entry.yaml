# OneHill v2 INFERENCE-PROVIDER library entry for Nebius (Token Factory).
# Validated against schema/inference-provider.v2.schema.json.
#   scores  -> scripts/score.py --write        (provider AOI)
#   meters  -> scripts/completeness.py --write  (per-domain completeness/originality)
#   prose   -> assess.md / implement.md / use.md / support.md (sections keyed <!-- item: KEY -->)

schema_version: '2.0'
id: nebius
name: Nebius (Token Factory)
profile: inference
hq_country: Netherlands
summary: 'Nebius Group N.V. (Amsterdam-headquartered, spun off from Yandex, Nasdaq-listed)
  runs "Nebius Token Factory" (formerly "Nebius AI Studio"), a managed OpenAI-compatible
  inference platform serving a broad open-model catalogue over shared/public per-token
  endpoints and single-tenant dedicated endpoints, alongside a separate raw-GPU-cloud
  product. An independent Cowork browser session (2026-09-21) CONFIRMED this entry''s
  central, most consequential finding VERBATIM: Nebius'' Legal Quick Guide states "we do
  not use your content to train... any AI models," but the binding Token Factory Terms of
  Service (Sec 7) states inputs/outputs ARE collected and used by default to train
  Nebius'' own smaller "Speculative Decoding" models unless the customer opts out. That
  same session corrected three overstatements in an earlier draft: only TWO EU regions
  (Finland, France) are public/self-serve, not four (Spain and Iceland are
  private/negotiated-only); there is NO committed inference SLA at all (the 99.9% figure
  is marketing-only - Token Factory has no sla-levels sub-page); and the flagship models
  once described as "dedicated-endpoint-only, no public price" are in fact publicly
  served per-token, simply superseded by newer catalogue entries. Compliance remains
  strong (SOC 2 Type II by a named auditor - Deloitte - covering HIPAA; ISO 27001 scope
  confirmed to include AI Studio/Token Factory).

  '
models_served:
- DeepSeek-V4-Pro, DeepSeek-V4-Flash, DeepSeek-R1-0528, DeepSeek-V3-0324
- Kimi-K2-Instruct, Kimi-K2-Thinking, Kimi-K3
- Qwen3-235B-A22B-Instruct/Thinking-2507, Qwen3-Coder-480B-A35B
- Llama-3.3-70B-Instruct, Llama-3.1-8B-Instruct, Llama-Guard-3-8B
- gpt-oss-120b / gpt-oss-20b
- GLM-4.5 / GLM-5.1 / GLM-5.2 / GLM-5.3
- NVIDIA Nemotron-3-Ultra-550B-A55B, Nemotron-3-Nano-30B-A3B
- MiniMax-M2 / M3
- 'CORRECTED 2026-09-21: an earlier draft claimed several of the above (Kimi-K2-Instruct,
  Llama-3.3-70B-Instruct, GLM-4.5) were dedicated-endpoint-only with no public price. An
  independent browser check found this NOT supported: open models are publicly served
  per-token (e.g. Llama-3.3-70B-Instruct at $0.13/$0.40 per 1M tokens, a standard public
  rate with no dedicated qualifier); those specific named versions have simply been
  superseded by newer catalogue entries (e.g. Kimi-K2.7-Code, GLM-5.x) - ordinary catalogue
  churn, not an access restriction. The full catalogue runs to roughly 90 model variants;
  the authoritative live price list is auth-gated and was not independently re-confirmed
  in full.'
hardware: NVIDIA GPU
pricing:
  model: mixed
  notes: 'Public/shared endpoints are pure per-token, read directly from individual model
    pages. Dedicated endpoints are billed per running replica (pay-as-you-go while
    replicas are up, adjusting dynamically with autoscaling) - the underlying $/GPU-hour
    rate itself is not disclosed on the public billing-policy page ("charges may vary
    depending on your custom contract or work order").

    '
  example_rates:
  - 'DeepSeek-V4-Pro: $1.75/M in, $3.50/M out (public endpoint, verified live)'
  - 'gpt-oss-120b: $0.15/M in, $0.60/M out (public endpoint, verified live)'
  - 'Llama-3.3-70B-Instruct: $0.13/M in, $0.40/M out (public endpoint, standard public
    rate - independently re-confirmed 2026-09-21)'
  - 'CORRECTED 2026-09-21: the specific model versions cited in an earlier draft
    (Kimi-K2-Instruct, GLM-4.5) as "dedicated-endpoint-only, no public price" have simply
    been superseded by newer catalogue entries (e.g. Kimi-K2.7-Code, GLM-5.x) - the
    authoritative live price list remains auth-gated and was not independently
    re-confirmed in full, but the "gated" framing itself was wrong.'
data_governance:
  default_retention: 'By default, Nebius collects and stores Inputs/Outputs for the
    purposes of providing the Service AND for training its own smaller "Speculative
    Decoding" models (Token Factory Terms of Service Sec 7), unless the customer opts
    out (via onboarding form or emailing support) or enables Zero Data Retention.
    Fine-tuning artifacts are stored exclusively in EU data centres per the Legal Quick
    Guide.'
  trains_on_inputs: by_default
  zdr_available: yes_optional
  zdr_scope_caveats: 'Zero Data Retention is an account-level opt-in ("enable Zero Data
    Retention in your account settings"), not the default. Enabling it stops storage and
    stops use for Speculative Decoding, but the Legal Quick Guide itself warns enabling
    it "may impact the level of service provided (e.g., inference speed)." Dedicated
    endpoints separately advertise a "zero-retention data flow" as a built-in feature of
    that tier.

    '
  customer_data_ownership: customer_retains
  outputs_used_to_improve_service: opt_out
  third_party_routing_leakage: 'Serves an overwhelmingly open-weight catalogue (Apache
    2.0 / MIT / DeepSeek / Llama licences per the catalogue''s own licence fields); no
    closed third-party model routing identified for Token Factory.

    '
  subprocessors_disclosed: true
  confidentiality: functional_only
  confidentiality_caveats: 'This is the most consequential finding in this entry, and it
    cuts across two documents that must both be read to get it right. The Legal Quick
    Guide (marketing-adjacent docs) states "we do not use your content to train, fine-tune
    or improve any AI models - ours or third parties''." But the binding Token Factory
    Terms of Service, Sec 7 (the governing document), states Nebius by default collects
    and uses Input/Output data to train its own "Speculative Decoding" models, with an
    opt-out required to stop it - and separately reserves the right to "remove, screen, or
    delete any of Your Inputs and Outputs at any time, for any reason, and without notice."
    Neither the general commercial confidentiality clause (Master Agreement Sec 18) nor
    Sec 7 itself names Customer Content as the customer''s Confidential Information; the
    DPA gives a real, GDPR-style processor confidentiality duty, but it is scoped to
    "Customer Personal Data," not Customer Content/business information generally. Coded
    functional_only rather than disclaimed because no clause expressly states Customer
    Content is non-confidential - but this is a closer call than most functional_only
    entries and should be revisited if a customer confidentiality clause is later found
    in the Master Agreement.'
