residency:
  eu_region_available: "yes"
  regions:
  - United States (us-central1, public)
  - 'CORRECTED 2026-09-21: European Union PUBLIC self-serve regions are Finland (eu-north1)
    and France (eu-west1) ONLY. Spain (eu-south1, Madrid) and Iceland (eu-north2), plus a
    second French region (eu-west2), are PRIVATE - "available only to the users who already
    have deployments there" - not self-serve. A prior draft claimed four public EU regions;
    an independent browser read of docs.nebius.com/overview/regions corrected this to two.'
  - Israel (me-west1, public)
  - United Kingdom (uk-south1/uk-south2, public)
  sovereign_option: 'No distinct named "sovereign cloud" SKU was found; the two self-serve
    public EU regions (Finland, France) plus two private/negotiated EU regions (Spain,
    Iceland) are the closest primary-source-backed residency option.'
  region_pinning: "yes"
  cloud_act_exposure: true
  provider_can_restrict_access: 'The DPA states, for dedicated Token Factory endpoints and
    AI Cloud, that Customer Content is hosted/processed in the customer-selected region -
    but for shared/public Token Factory endpoints, processing location "may vary." The
    published sub-processor list names Nebius Inc. (United States) providing core
    infrastructure/operations, and a us-central1 public region exists, which plausibly
    creates US CLOUD Act exposure for data transiting US entities/regions even though the
    parent (Nebius Group N.V.) is Netherlands-domiciled - this is an inference from the
    sub-processor list and regions page, not an explicit CLOUD Act statement in any primary
    document found.'
reliability:
  sla: 'CORRECTED 2026-09-21: an independent Cowork browser session confirmed there is NO
    committed inference SLA at all - a prior draft claimed a real contractual SLA existed and
    just lacked a confirmed number, which overstated it. The master SLA page
    (docs.nebius.com/legal/sla, independently read) delegates entirely to per-service sub-pages
    at docs.nebius.com/legal/sla-levels; that index page (also independently read) lists EXACTLY
    SEVEN services - Compute Cloud, Managed Kubernetes, Managed MLflow, Managed PostgreSQL,
    Object Storage, Standalone Applications, Virtual Private Cloud - and NONE of them is
    inference, Token Factory, or AI Studio. The 99.9% figure seen in Token Factory marketing
    copy is therefore MARKETING-ONLY, not backed by any binding SLA sub-page. Do not attribute a
    committed uptime percentage to Token Factory inference.'
  uptime_notes: 'A public status page (status.nebius.com) exists with a dedicated uptime
    history view; its content was corroborated via search rather than independently
    fetched in full this pass. Only minor, resolved incidents were found (partial metrics
    unavailability in eu-west1, partial Object Storage unavailability in us-central1,
    SkyPilot cluster-creation errors in eu-north1).

    '
  incidents:
  - region: eu-west1
    summary: 'Partial metrics unavailability (resolved) - independently browser-confirmed,
      2026-09-09/17 window.'
  - region: us-central1
    summary: 'Partial Object Storage 5xx errors (resolved) - independently browser-confirmed,
      2026-09-09/17 window.'
  - region: eu-north1
    summary: 'SkyPilot cluster-creation errors (503) / VM creation issues (resolved) -
      independently browser-confirmed, 2026-09-09/17 window.'
lock_in:
  openai_compatible_api: true
  portability_notes: 'A "simple, OpenAI-compatible API" (product page and docs, read
    directly) over a predominantly open-weight catalogue (Apache 2.0 / MIT / DeepSeek /
    Llama licences confirmed on the catalogue''s own licence fields) keeps the served
    checkpoints themselves portable. The DPA commits to deleting or returning Customer
    Personal Data on termination, at the customer''s choice. CORRECTED 2026-09-21: a prior
    claim that several flagship models are "dedicated-endpoint-only, no public price" is NOT
    supported by an independent browser check of the live catalogue - open models ARE
    publicly served per-token (e.g. Llama-3.3-70B-Instruct at $0.13/$0.40 per 1M tokens on a
    standard public rate, no "dedicated" qualifier); the specific named versions cited in the
    prior draft (Kimi-K2-Instruct, Llama-3.3-70B-Instruct, GLM-4.5) have simply been
    SUPERSEDED by newer catalogue entries (normal churn), not gated behind a dedicated tier.
    The authoritative live price list itself remains auth-gated and was not independently
    re-confirmed.

    '
dedicated_availability: self_serve
dedicated_notes: 'Verified directly on the live product: the model catalogue''s dedicated-endpoint
  control plane is a self-serve login/deploy flow ("Log in to deploy dedicated endpoints with
  guaranteed performance, zero-retention data flow, and full configurability"), not a
  "contact sales" gate, with self-serve create/update/stop/delete deployment management.
  Enterprise custom contracts are also referenced for billing ("charges may vary depending on
  your custom contract or work order"), and the exact per-GPU-hour rate is not disclosed
  publicly. No on-prem/air-gapped offering was found.'
trust_considerations:
- 'MOST CONSEQUENTIAL FINDING - CONFIRMED VERBATIM 2026-09-21 by an independent Cowork browser
  session: the Legal Quick Guide (marketing-adjacent) states content is not used to train "any
  AI models," but the binding Token Factory Terms of Service Sec 7 states Input/Output data IS
  used by default to train Nebius'' own "Speculative Decoding" models, with an opt-out required
  to stop it. This entry codes trains_on_inputs as by_default on the binding-terms reading, not
  the marketing paraphrase - this reading holds up under independent human-grade verification,
  not just an automated read.'
- Sec 7 of the Terms of Service separately reserves the right to "remove, screen, or delete
  any of Your Inputs and Outputs at any time, for any reason, and without notice" - a
  provider-favourable clause worth knowing about even though it does not by itself make
  content non-confidential.
- Zero Data Retention is opt-in (account-level setting), not the default, and the Legal
  Quick Guide itself warns it may reduce inference speed.
- 'STRENGTHENED 2026-09-21: compliance breadth is a genuine strength, now independently
  confirmed verbatim - SOC 2 Type II is audited by a NAMED firm (Deloitte) covering HIPAA, and
  the ISO 27001 scope statement explicitly names "AI Studio" (Token Factory itself, not just
  the company generally). A published trust centre exists, and a sub-processor list of
  approximately 21 named entities is disclosed (a prior draft said ~24 - recount recommended)
  with a 15-day advance-notice commitment.'
- 'CORRECTED 2026-09-21: EU-region breadth was overstated in a prior draft. Only TWO named EU
  regions are public/self-serve - Finland (eu-north1) and France (eu-west1) - not four. Spain
  (eu-south1) and Iceland (eu-north2) are private/existing-deployment-only, not self-serve. The
  DPA does document region pinning for dedicated/AI-Cloud workloads on the regions that are
  available, but shared/public Token Factory endpoints do not carry the same residency
  guarantee ("processing location may vary").'
- A US sub-processor entity (Nebius Inc.) and a us-central1 public region exist alongside the
  Netherlands-domiciled parent, creating plausible CLOUD Act exposure that no primary document
  addresses explicitly.
- 'CORRECTED 2026-09-21: a prior claim that several flagship models (Kimi-K2-Instruct,
  Llama-3.3-70B-Instruct, GLM-4.5) are dedicated-endpoint-only with no public price is NOT
  supported - open models are publicly served per-token, and those specific named versions have
  simply been superseded by newer catalogue entries (ordinary churn, not an access restriction).'
- 'CORRECTED 2026-09-21 (downward): a prior claim of "a real contractual SLA with service
  credits" is RETRACTED - an independent browser session found NO committed inference SLA
  exists at all. The master SLA page delegates to seven per-service sub-pages, none of which is
  inference/Token Factory/AI Studio. The marketed 99.9% figure is confirmed marketing-only, not
  backed by any binding SLA sub-page.'
