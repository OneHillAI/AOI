- id: ev-quickguide
  claim: "Nebius Legal Quick Guide (non-binding; states that the Terms, DPA and Privacy Policy prevail). FAQ: 'Is my data used to train your AI models? No. We do not use your content to train, fine-tune or improve any AI models - ours or third parties'. Unless you enable Zero Data Retention, your inputs and outputs may be stored and used solely for Speculative Decoding, which does not involve training any model.' This contradicts the binding Supplemental Terms 5.1(b). ZDR is org-level, enabled in account settings, and also switches Speculative Decoding off. Public endpoints show Region 'Global' with a location that 'can change at any time without prior notice'. Retained Speculative Decoding data is stored in Finland (EU), and fine-tuning data is stored only in EU data centres. Extract: docs/primary-sources/nebius/docs__legal-quick-guide__2026-11-19.md."
