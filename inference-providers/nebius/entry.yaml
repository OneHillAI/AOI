residency:
  eu_region_available: "yes"
  regions:
  - United States (us-central1 Kansas City and us-north1 Minnesota, public)
  - 'The Nebius AI Cloud region list (docs.nebius.com/overview/regions) shows public EU regions Finland
    (eu-north1), Madrid, Spain (eu-south1), France (eu-west1) and a second French region (eu-west2): four
    region IDs in three countries. Only eu-north2 (Iceland) is private. That list is for the GPU cloud,
    not for Token Factory. Token Factory''s own control and data plane page names three data-plane regions
    (eu-north1 Finland, eu-west1 France, us-central1). Its sub-processor list gives Nebius B.V. Token Factory
    processing locations of France, Iceland, Finland and the United Kingdom (Nebius Inc. United States,
    Nebius Israel Israel, RunPod Iceland, BoostRun and Shadeform United States, Axe Compute Canada). No
    Token Factory document names Spain or eu-west2, so the count for this service is two EU regions (Finland,
    France), not four. The status page lists a Token Factory component under every region, including EU-SOUTH1
    and EU-WEST2, and three Token Factory locations TF-US1, TF-US2 and TF-CA1, but it lists every product
    under every region, so it says nothing about availability. Shared endpoints show Region "Global" and
    are unpinned (the per-model pages show current processing regions eu-north1, uk-south1, us-north1 and
    us-central1). Dedicated endpoints are pinned to the region you choose.'
  - Israel (me-west1, public)
  - United Kingdom (uk-south1/uk-south2, public)
  sovereign_option: 'No distinct named "sovereign cloud" SKU was found; the public EU regions
    (Finland, Spain, France) with a dedicated endpoint pinned to one of them, and fine-tuning data
    stored only in EU data centres, are the closest primary-source-backed residency option.'
  region_pinning: "yes"
  cloud_act_exposure: true
  provider_can_restrict_access: "DPA 6.1 (effective 2026-11-18): for dedicated endpoints Customer Content is processed in the
    region selected by the customer, subject to limited processing outside it for operation,
    maintenance, security or support. For public endpoints the location is \"specified in the API or
    displayed in the Token Factory interface\", and the Annex says they \"are not region-pinned\".
    US-incorporated customers contract with Nebius Inc. (Delaware law, JAMS arbitration in New York)
    for Token Factory registrations on or after 2026-09-15. Other customers contract with Nebius
    B.V. (Dutch law, Amsterdam courts). The published sub-processor list names Nebius Inc. and four
    US-based infrastructure providers (RunPod, BoostRun, Shadeform, Axe Compute). This creates
    plausible US CLOUD Act exposure alongside the Netherlands-domiciled parent. It is an inference
    from the list and the contracting-entity clause, with no explicit CLOUD Act statement behind
    it."
reliability:
  sla: "None on the standard terms. Token Factory Supplemental Terms 7.4 (effective 2026-10-22): \"The Service Level Agreement (\"SLA\") available at https://docs.nebius.com/legal/sla does not apply to the Token Factory Service. Nebius does not provide any service level commitments, uptime guarantees, or associated compensation for the Token Factory Service\", with credits excluded \"unless agreed otherwise in writing\". The dedicated-endpoint docs say self-service dedicated endpoints \"do not include a formal SLA unless covered by contract\", and the rate-limits page says an Enterprise Tier gives \"dedicated capacity plus an SLA\", but no Enterprise terms are published. The SLA index (docs.nebius.com/legal/sla-levels, 2026-10-06) lists eight services - Compute Cloud, Disks, Managed Kubernetes, Managed MLflow, Managed PostgreSQL, Object Storage, Shared Filesystem, Virtual Private Cloud - and none is inference. Any 99.9% figure in marketing is not backed by a contract."
  uptime_notes: 'A public status page (status.nebius.com) shows All Systems Operational with a Token Factory component
    in each region and a 90-day uptime bar without a numeric percentage on the main view. Two Token Factory
    incidents in the last 14 days, both resolved: 2026-11-05 some models unavailable in eu-north1, and 2026-11-11
    connectivity loss in tf-us2 for about 8 minutes (cause under investigation).'
  incidents:
  - region: eu-north1
    summary: 'Token Factory: some models unavailable (resolved), 2026-11-05 10:30 to 11:07 UTC.'
  - region: tf-us2
    summary: 'Token Factory connectivity loss, not reachable 07:33 to 07:41 UTC (resolved), 2026-11-11.'
  - region: eu-west1
    summary: Partial metrics unavailability (resolved), 2026-09-09/17 window.
  - region: us-central1
    summary: Partial Object Storage 5xx errors (resolved), 2026-09-09/17 window.
  - region: eu-north1
    summary: SkyPilot cluster-creation errors (503) / VM creation issues (resolved), 2026-09-09/17 window.
lock_in:
  openai_compatible_api: true
  portability_notes: A "simple, OpenAI-compatible API" (product page and docs) over a predominantly open-weight catalogue
    (Apache 2.0 / MIT / DeepSeek / Llama licences on the catalogue's own licence fields) keeps the served
    checkpoints portable. The DPA commits to deleting or returning Customer Personal Data on termination,
    at the customer's choice (DPA Sec 7, effective 2026-11-18). Most open models have a public per-token
    endpoint, but Kimi-K2-Instruct, Llama-3.3-70B-Instruct and DeepSeek-V4-Pro show "Public endpoint Not
    available" (dedicated only). Nebius publishes Serverless removal notices (2026-06-22, 08-31, 11-09,
    12-24) that say dedicated endpoints for removed models are unaffected and that requests are not rerouted.
    Exit is easy on the weights (open models), but the serverless catalogue churns every few weeks.
dedicated_availability: self_serve
dedicated_notes: Supplemental Terms 2.3 grant "a limited right to create, configure, and manage Dedicated Endpoints
  through the Platform", and the dedicated-endpoint docs say "Deployment region is fixed and user-selected"
  with "Capacity reserved for your organization", so the control plane is self-serve. Catalogue pages
  say "Log in to deploy dedicated endpoints ... zero-retention data flow"; deployment and the dedicated
  price list are behind the login, and regions come from a templates API. Self-service dedicated endpoints
  run on on-demand capacity that is released on any stop, incident or maintenance and is not reserved,
  with no formal SLA unless covered by contract. Enterprise custom contracts are also referenced for billing
  ("charges may vary depending on your custom contract or work order"), and the exact per-GPU-hour rate
  is not disclosed publicly. No on-prem/air-gapped offering is documented.
trust_considerations:
- Token Factory Supplemental Terms 5.1(b) (effective 2026-10-22) let Nebius use your Input and Output
  to "train smaller Models used for Speculative Decoding", on by default, with an opt-out by onboarding
  form or email to tokenfactory-support@nebius.com (5.4). The Legal Quick Guide answers "No" to "Is my
  data used to train your AI models?" and says Speculative Decoding "does not involve training any model".
  This entry codes trains_on_inputs as by_default on the contract, which the Quick Guide says prevails.
  The legacy Sec 7 sentence read "training smaller Models used exclusively for Speculative Decoding";
  5.1(b) omits "exclusively".
- The standalone Token Factory Terms of Service apply only to customers with an active reserve as of
  2026-09-15; from 2026-09-28 everyone else is on the Nebius Services Agreement plus the Supplemental
  Terms. The contracting entity follows where you are incorporated (Agreement Sec 17). Nebius B.V. has
  Dutch law and Amsterdam courts (not the US or Israel). Nebius Israel Ltd has Israeli law and Tel Aviv
  courts (Israel, Token Factory customers with a committed volume registered on or after 2026-09-15).
  Nebius Inc. has Delaware law and JAMS arbitration in New York (US, Token Factory customers registered
  on or after 2026-09-15). There are three matching DPAs.
- Supplemental Terms 5.3 keeps "absolute discretion, to remove, screen, or delete any Inputs or
  Outputs at any time, for any reason, and without notice" - provider-favourable, and it does not by
  itself make content non-confidential.
- Zero Data Retention is opt-in (account-level setting), not the default. The Legal Quick Guide warns
  it may reduce inference speed, and says enabling it is also how you opt out of Speculative Decoding.
- 'Compliance is a strength: a public Deloitte SOC 3 report (period 2025-04-01 to 2025-07-31, dated 2025-10-19,
  clean opinion, system description includes AI Studio inference) and an ISO/IEC 27001:2022 certificate
  from SII-QCD (valid to 2028-08-11). The SOC 2 Type II report is NDA-gated, the SOC 3 period ended about
  16 months ago, and ISO 27701 and ISO 42001 rest on trust-centre statements (certificates not public).'
- The Nebius AI Cloud regions page lists four public EU region IDs in three countries (Finland eu-north1,
  Spain eu-south1, France eu-west1 and eu-west2; only Iceland is private). That is the GPU-cloud list.
  Token Factory's own documents name two EU data-plane regions (Finland eu-north1, France eu-west1) plus
  us-central1, and its sub-processor list gives France, Iceland, Finland and the UK as Nebius B.V. processing
  locations, so this entry counts two EU regions for the service. Token Factory shared endpoints are unpinned
  ("Global", processing location can change without notice, "not intended for production use cases that
  require a stable, predictable region"; the pages show eu-north1, uk-south1, us-north1 and us-central1).
  Only dedicated endpoints are contractually pinned (DPA 6.1), subject to limited processing outside the
  region for operation, maintenance, security or support.
- The sub-processor list (effective 2026-09-23) has 23 rows and 20 distinct entities, including Nebius
  Inc. (US) and four US-based infrastructure providers (RunPod, BoostRun, Shadeform, Axe Compute); Argentum
  AI is not listed. With the US contracting entity this creates plausible CLOUD Act exposure that no primary
  document addresses explicitly.
- 'There is no inference SLA on the standard terms, now by express contract: Supplemental Terms 7.4 says Nebius
  "does not provide any service level commitments, uptime guarantees, or associated compensation for the Token
  Factory Service" (credits excluded "unless agreed otherwise in writing"). The rate-limits page says an
  Enterprise Tier adds "an SLA", but no such terms are published. Two Token Factory incidents occurred in the
  last 14 days (2026-11-05 eu-north1 some models unavailable; 2026-11-11 tf-us2 connectivity loss of about 8
  minutes).'
- 'There is no inference SLA on the standard terms: Supplemental Terms 7.4 says Nebius "does not provide
  any service level commitments, uptime guarantees, or associated compensation for the Token Factory Service"
  (credits excluded "unless agreed otherwise in writing"). The rate-limits page says an Enterprise Tier
  adds "an SLA", but no such terms are published. Two Token Factory incidents occurred in the status page''s
  14-day window (2026-11-05 eu-north1 some models unavailable; 2026-11-11 tf-us2 connectivity loss of
  about 8 minutes).'
- 'Catalogue and prices: tokenfactory.nebius.com returns HTTP 403 to curl but renders in a browser. The
  133-row catalogue and per-model public prices are visible without login; the logged-in price list and
  all dedicated-endpoint prices are not. DeepSeek-V4-Pro and Llama-3.3-70B-Instruct carried public prices
  in September and are dedicated-only, as is Kimi-K2-Instruct. Serverless models are removed on announced
  dates with no automatic rerouting (2026-06-22, 08-31, 11-09, 12-24).'
- 'Encryption keys are Nebius-managed and customer-managed keys are not currently offered (DPA Annex 3).'
score:
  rubric_version: '1.2'
  headline: 64.4
  grade: C
  hard_flags: []
  dimensions:
    data_governance:
      score: 2
      rationale: Supplemental Terms 5.1(b) and 5.4 (effective 2026-10-22; Sec 7 of the legacy Terms) let Nebius use
        Input and Output by default to "train smaller Models used for Speculative Decoding" under a royalty-free,
        transferable, sub-licensable, worldwide licence. The opt-out is by onboarding form or email. Nebius
        also holds "absolute discretion" to delete Inputs and Outputs without notice. The Legal Quick Guide
        contradicts the contract in plain English ("No" to "Is my data used to train your AI models?"). Positives
        keep the score off the floor. They are customer ownership of Content (3.1), Zero Data Retention as an
        account-level opt-in that also turns off Speculative Decoding, a disclosed sub-processor list (20 distinct
        entities, effective 2026-09-23, 15 days' notice) and a purpose limitation (Agreement 10.1.3). No training
        by default is the anchor-3 threshold, and this provider does not clear it. Training and retention by
        default with only a limited opt-out is the anchor-2 pattern.
      evidence_refs:
      - ev-tfterms
      - ev-tos
      - ev-quickguide
      - ev-subprocessors
    compliance:
      score: 5
      rationale: 'Two independent artefacts support a 5. (1) A public SOC 3 report issued by Deloitte for Nebius BV
        (Security, Availability, Confidentiality + HIPAA mapping; period 2025-04-01 to 2025-07-31; dated 2025-10-19;
        clean opinion; system description includes AI Studio inference). (2) ISO/IEC 27001:2022 certificate
        no. 1129086 from SII-QCD, valid 2025-08-11 to 2028-08-11. The trust centre also lists SOC 2 Type II
        with HIPAA, ISO 27701, 42001, 22301, 27018, 27032, 27799, CSA STAR Level 1, a signed-BAA route for HIPAA,
        and a GDPR DPA with SCCs. This is the anchor-5 set. Caveats: the SOC 2 Type II report is NDA-gated.
        The SOC 3 audit period ended about 16 months ago and no newer report is linked. The ISO scope sentence
        is generic and does not name Token Factory (the trust centre and the SOC 3 do). ISO 27701 and 42001
        rest on trust-centre statements. FedRAMP is not offered. A refreshed SOC report is needed to keep the
        5.'
      evidence_refs:
      - ev-soc3
      - ev-iso27001
      - ev-trustcenter
      - ev-dpa
    residency:
      score: 3
      rationale: Held at 3 (EU region for at least some workloads); 4 needs pinning for the main workloads. Token Factory's
        control and data plane page names two EU data-plane regions (Finland, France) plus us-central1, and
        its sub-processor list names France, Iceland, Finland and the UK for Nebius B.V. The Nebius AI Cloud
        regions page (docs.nebius.com/overview/regions) lists four public EU region IDs in three countries (Finland
        eu-north1, Spain eu-south1, France eu-west1 and eu-west2), with only Iceland (eu-north2) private, but
        it covers the GPU cloud, not Token Factory. The DPA (effective 2026-11-18) pins dedicated Token Factory
        endpoints to the customer-selected region, subject to limited processing outside it for operation, maintenance,
        security or support. Public endpoints "are not region-pinned" and run as "Global"; their processing
        regions are Finland, the UK and two US regions. US-incorporated customers contract with Nebius Inc.,
        and the sub-processor list carries US entities, so CLOUD Act exposure is plausible. No primary document
        addresses it.
      evidence_refs:
      - ev-regions
      - ev-tfdocs
      - ev-dpa
      - ev-subprocessors
      - ev-quickguide
    security:
      score: 3
      rationale: 'The trust centre documents customer workload isolation (VPC, InfiniBand and Kubernetes), TLS in transit,
        storage encryption by default (with named exceptions), least-privilege access with MFA, vulnerability
        management and regular security assessments, a structured incident-response plan and a secure SDLC.
        DPA Annex 3 repeats the measures. SOC 3 and ISO 27001 give independent assurance over the control environment.
        Held at 3, not 4: no independent penetration-test attestation or bug-bounty programme is published,
        the shared-endpoint isolation model is not documented beyond the general statements, and no cipher specifics
        are named.'
      evidence_refs:
      - ev-trustcenter
      - ev-soc3
      - ev-quickguide
    reliability:
      score: 3
      rationale: 'Token Factory has no inference SLA, and Supplemental Terms 7.4 (effective 2026-10-22) excludes one:
        Nebius "does not provide any service level commitments, uptime guarantees, or associated compensation
        for the Token Factory Service". The SLA index lists eight services and none is inference. A public status
        page shows a Token Factory component in each region and two resolved Token Factory incidents in its
        14-day window. This matches the anchor-3 bar (operational track record, public status page, no SLA).
        Anchor 4 requires a contractual SLA.'
      evidence_refs:
      - ev-tfterms
      - ev-sla
      - ev-status
    transparency_lockin:
      score: 4
      rationale: 'An OpenAI-compatible API over a predominantly open-weight catalogue keeps served checkpoints portable,
        and the DPA commits to deleting or returning Customer Personal Data on termination. Sub-processors are
        disclosed in full (20 distinct entities in 23 rows, with processing locations and transfer mechanisms),
        per-model context windows are published, and Serverless removals come with dated notices that leave
        dedicated endpoints in place. Held below 5 for four reasons. The Terms carry an unfavourable training
        licence and an absolute-discretion deletion right. The governing document differs between customers
        with an active reserve and everyone else. The logged-in price list and dedicated prices are not public.
        The serverless catalogue churns: three models priced publicly in September are dedicated-only, with
        no standing minimum notice period.'
      evidence_refs:
      - ev-catalogue
      - ev-subprocessors
      - ev-tokenfactory
      - ev-deprecations
    cost:
      score: 3
      rationale: 'Per-token prices are public on per-model catalogue pages for models with a public endpoint: gpt-oss-120b
        $0.15/$0.60, DeepSeek-V4-Pro-0813 $1.32/$3.96, GLM-5.3 $1.40/$4.40 and MiniMax-M3 $0.30/$1.20, each
        with a cached-input rate. The rate-limit rules are documented. Several models are dedicated-only with
        prices behind a login, and the consolidated price list needs a login. The dedicated tier''s per-replica
        or GPU-hour rate is described only as variable "depending on your custom contract or work order", a
        transparency gap against peers that publish dedicated rate cards. This matches anchor 3 (clear public
        pricing with documented tiers), not 4.'
      evidence_refs:
      - ev-catalogue
      - ev-billing
      - ev-tfdocs

