changelog:
- date: '2026-09-20'
  change: 'Initial entry. Primary-source research read the Token Factory Terms of Service, the
    Master Services Agreement, the DPA, the sub-processor list, the Trust Center, the regions
    and SLA pages, the Legal Quick Guide, the live model catalogue, and the dedicated-endpoint
    billing-policy page directly. Coded trains_on_inputs as by_default on the binding Terms of
    Service (Sec 7 - Speculative Decoding training, opt-out available), not the Legal Quick
    Guide''s marketing claim of no training on content - this discrepancy is the entry''s
    central finding and is documented in confidentiality_caveats and trust_considerations.
    Confidentiality coded functional_only (DPA processor-confidentiality is scoped to Customer
    Personal Data, not Customer Content generally; no clause found naming Customer Content
    non-confidential, so short of disclaimed). Flagged that many flagship models on the live
    catalogue are dedicated-endpoint-only with no public per-token price.'
- date: '2026-09-21'
  change: 'CORRECTION - independent Cowork browser verification pass. The entry''s central
    finding (ToS Sec 7 train-by-default, opt-out required) is CONFIRMED VERBATIM under
    independent human-grade review and stands unchanged - this was the one finding most worth
    stress-testing, and it held. Three real corrections downward: (1) EU-region breadth was
    overstated - only Finland (eu-north1) and France (eu-west1) are public/self-serve, not four
    as claimed (Spain and Iceland are private/existing-deployment-only); residency 4 -> 3. (2) A
    claimed "real contractual SLA with service credits" is RETRACTED - no committed inference
    SLA exists at all (the sla-levels index lists exactly seven non-inference services; 99.9% is
    marketing-only); reliability 4 -> 3. (3) A claim that several flagship models were
    dedicated-endpoint-only with no public price was wrong on re-check - they are publicly
    served per-token and were simply superseded by newer catalogue entries; cost 2 -> 3. Two
    corrections upward: SOC 2 Type II now carries a NAMED auditor (Deloitte) and the ISO 27001
    scope statement explicitly names AI Studio/Token Factory - compliance strengthened at the
    same score (4). Also corrected the sub-processor count (~24 -> ~21) and the ownership level
    (limited -> partial; a scoring-rule slip in the original draft - "exactly one factor weak"
    maps to partial, independent of this session''s findings). Headline 65.2 -> recomputed by
    score.py.'
