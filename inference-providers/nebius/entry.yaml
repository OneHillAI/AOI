- GLM-4.5 to GLM-5.3 and GLM-5.3-Flash, MiniMax-M2.1 to M3 and M3.1-Flash
- gpt-oss-120b / gpt-oss-20b, Muse Spark Open, Reflection Beam 1.0, Inkling-2-Small
- NVIDIA Nemotron-3-Ultra-550B-A55B, Nemotron 3.5 Super VL, Nemotron-3.5-Lightning
- Llama 3.1 / 3.2 / 3.3 and Llama-Guard-3-8B, Gemma-2/3/4, Hermes-4, INTELLECT-3, embedding models (bge, e5-mistral, Qwen3-Embedding-8B)
- 'CORRECTED 2026-11-19 (read in the in-app browser; curl still gets HTTP 403): the catalogue lists 133 rows with
  context windows, but its platform column shows the same tags on every row, so the per-model page decides
  whether a public endpoint exists. Public endpoints read: gpt-oss-120b, DeepSeek-V4-Pro-0813, GLM-5.3,
  MiniMax-M3. "Public endpoint Not available" (dedicated only) on DeepSeek-V4-Pro, Llama-3.3-70B-Instruct and
  Kimi-K2-Instruct; the first two match Serverless removal notices dated 2026-11-09 and 2026-08-31 (no
  notice for Kimi-K2-Instruct was found in the four notice pages read). The 2026-09-21 browser note that Llama-3.3-70B-Instruct was publicly priced could not be
  reproduced. Dedicated endpoints for deprecated models stay available.'
hardware: NVIDIA GPU
pricing:
  model: mixed
  notes: 'Public/shared endpoints are pure per-token, read on the per-model catalogue pages (rendered in a
    browser 2026-11-19; the logged-in price list at /organization/prices was not read, and not every catalogue
    model has a public endpoint). Dedicated endpoints are billed per running replica (pay-as-you-go while
    replicas are up, adjusting dynamically with autoscaling) and dedicated prices are behind the login - the
    underlying $/GPU-hour rate itself is not disclosed on the public billing-policy page ("charges may vary
    depending on your custom contract or work order").

    '
