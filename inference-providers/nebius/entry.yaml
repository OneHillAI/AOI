schema_version: '2.0'
id: nebius
name: Nebius (Token Factory)
profile: inference
hq_country: Netherlands
summary: 'Nebius Group N.V. (Amsterdam-headquartered, spun off from Yandex, Nasdaq-listed)
  runs "Nebius Token Factory" (formerly "Nebius AI Studio"), a managed OpenAI-compatible
  inference platform serving a broad open-model catalogue over shared/public per-token
  endpoints and single-tenant dedicated endpoints, alongside a separate raw-GPU-cloud
  product. Re-read 2026-11-19: the governing contract has moved. The standalone Token Factory
  Terms of Service now apply only to customers with an active reserve as of 2026-09-15;
  everyone else is on the Nebius Services Agreement plus the Token Factory Supplemental Terms
  (effective 2026-10-22). The central finding survives the move and was re-read verbatim: Supplemental
  Terms 5.1(b) let Nebius "train smaller Models used for Speculative Decoding" on your Input and Output by
  default, with an opt-out by onboarding form or email (5.4), while the Legal Quick Guide still
  answers "No" to "Is my data used to train your AI models?" (the word "exclusively" that qualified the
  legacy sentence is gone). The inference SLA is no longer merely absent: Supplemental Terms 7.4 expressly
  says no service level commitments, uptime guarantees or credits apply to Token Factory unless agreed in
  writing. EU regions: the Nebius AI Cloud regions page now lists four public EU region IDs (Finland, Spain,
  France x2), but Token Factory''s own documents name only two EU data-plane regions (Finland eu-north1,
  France eu-west1), public endpoints are unpinned ("Global") and showed processing in Finland, the UK and the
  US on the day read. Compliance is now backed by two independent artefacts read in full: a public Deloitte
  SOC 3 report that includes AI Studio inference and an ISO/IEC 27001:2022 certificate issued by SII-QCD.
  Contracting entity depends on where you are incorporated: Nebius B.V. (Dutch law), Nebius Israel Ltd
  (Israeli law) or Nebius Inc. (Delaware law, JAMS arbitration). The catalogue (133 rows) and per-model
  prices render in a browser: several models once priced publicly (DeepSeek-V4-Pro, Llama-3.3-70B-Instruct,
  Kimi-K2-Instruct) are now dedicated-only after deprecation notices.

  '
