        coverage: partial
        refs: [ev-tfdocs]
        summary: "The docs describe dynamic limits: an illustrative baseline of 60 RPM and 400,000 TPM, x1.2 scale-up and divide-by-1.5 scale-down per rolling 15-minute window, a hard ceiling of 4x the base allocation beyond which Enterprise is required, HTTP 429 over the limit (with possible low-priority processing flagged by x-ratelimit-over-limit) and HTTP 529 when an endpoint is busy. Actual defaults are visible only in the console, and dedicated endpoints have no rate limits."
