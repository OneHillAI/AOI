schema_version: '2.0'
id: nebius
name: Nebius (Token Factory)
profile: inference
hq_country: Netherlands
summary: 'Nebius Group N.V. (Amsterdam-headquartered, spun off from Yandex, Nasdaq-listed) runs "Nebius Token
  Factory" (formerly "Nebius AI Studio"), a managed OpenAI-compatible inference platform. It serves a
  broad open-model catalogue over shared per-token endpoints and single-tenant dedicated endpoints, alongside
  a separate raw-GPU-cloud product. The standalone Token Factory Terms of Service apply only to customers
  with an active reserve as of 2026-09-15; everyone else is on the Nebius Services Agreement plus the
  Token Factory Supplemental Terms (effective 2026-10-22). Supplemental Terms 5.1(b) let Nebius "train
  smaller Models used for Speculative Decoding" on your Input and Output by default, with an opt-out by
  onboarding form or email (5.4). The Legal Quick Guide answers "No" to "Is my data used to train your
  AI models?". Supplemental Terms 7.4 says no service level commitments, uptime guarantees or credits
  apply to Token Factory unless agreed in writing. Token Factory''s own documents name two EU data-plane
  regions (Finland eu-north1, France eu-west1). Public endpoints are unpinned ("Global") and showed processing
  in Finland, the UK and the US. The Nebius AI Cloud regions page lists four public EU region IDs (Finland,
  Spain, France x2), but that list covers the GPU cloud. Compliance rests on a public Deloitte SOC 3 report
  that includes AI Studio inference and an ISO/IEC 27001:2022 certificate issued by SII-QCD. The contracting
  entity depends on where the customer is incorporated: Nebius B.V. (Dutch law), Nebius Israel Ltd (Israeli
  law) or Nebius Inc. (Delaware law, JAMS arbitration). The catalogue lists 133 models with per-model
  prices. DeepSeek-V4-Pro, Llama-3.3-70B-Instruct and Kimi-K2-Instruct are dedicated-only after deprecation
  notices.'
models_served:
- DeepSeek V4.1 Flash / V4.1 Flash 1017 / V4-Pro-0813 / V4-Flash-0731, DeepSeek-R1-0528, DeepSeek-V3-0324
- Kimi-K3, Kimi-K3.1-Pro, Kimi-K2.5 / K2.6 / K2.7-Code
- Qwen3 / Qwen3.5 / Qwen3.6 / Qwen3.8-27B families, Qwen3-Coder-480B-A35B, Qwen3-235B-A22B-Instruct/Thinking-2507
- GLM-4.5 to GLM-5.3 and GLM-5.3-Flash, MiniMax-M2.1 to M3 and M3.1-Flash
- gpt-oss-120b / gpt-oss-20b, Muse Spark Open, Reflection Beam 1.0, Inkling-2-Small
- NVIDIA Nemotron-3-Ultra-550B-A55B, Nemotron 3.5 Super VL, Nemotron-3.5-Lightning
- Llama 3.1 / 3.2 / 3.3 and Llama-Guard-3-8B, Gemma-2/3/4, Hermes-4, INTELLECT-3, embedding models (bge, e5-mistral, Qwen3-Embedding-8B)
- The catalogue lists 133 rows with context windows, but its platform column shows the same tags on every
  row, so the per-model page decides whether a public endpoint exists. Public endpoints exist for gpt-oss-120b,
  DeepSeek-V4-Pro-0813, GLM-5.3 and MiniMax-M3. DeepSeek-V4-Pro, Llama-3.3-70B-Instruct and Kimi-K2-Instruct
  show "Public endpoint Not available" (dedicated only). The first two match Serverless removal notices
  dated 2026-11-09 and 2026-08-31; no notice for Kimi-K2-Instruct appears on the four notice pages. Dedicated
  endpoints for deprecated models stay available. The catalogue renders in a browser; curl gets HTTP 403.
hardware: NVIDIA GPU
pricing:
  model: mixed
  notes: Public/shared endpoints are pure per-token, shown on the per-model catalogue pages (rendered in a browser).
    The logged-in price list at /organization/prices is not public, and not every catalogue model has a
    public endpoint. Dedicated endpoints are billed per running replica (pay-as-you-go while replicas are
    up, adjusting dynamically with autoscaling) and dedicated prices are behind the login. The underlying
    $/GPU-hour rate is not disclosed on the public billing-policy page ("charges may vary depending on your
    custom contract or work order").
  example_rates:
  - 'gpt-oss-120b: $0.15/M in, $0.10/M cached, $0.60/M out (public endpoint; processing region shown eu-north1)'
  - 'DeepSeek-V4-Pro-0813: $1.32/M in, $0.04/M cached, $3.96/M out (public endpoint; processing region
    shown uk-south1)'
  - 'GLM-5.3: $1.40/M in, $0.26/M cached, $4.40/M out (public endpoint; processing region shown us-north1)'
  - 'MiniMax-M3: $0.30/M in, $0.06/M cached, $1.20/M out (public endpoint; processing region shown us-central1)'
  - 'DeepSeek-V4-Pro ($1.75/$3.50) and Llama-3.3-70B-Instruct ($0.13/$0.40) have no public endpoint: the
    per-model pages say "Public endpoint Not available", following Serverless removal notices dated 2026-11-09
    and 2026-08-31.'
data_governance:
  default_retention: "By default, Nebius collects and stores Inputs/Outputs for the purposes of providing the Service
    AND for training its own smaller \"Speculative Decoding\" models. The source is Token Factory
    Supplemental Terms Sec 5.1(b) and 5.4, effective 2026-10-22; the same clause was Sec 7 of the
    legacy Token Factory Terms. This does not apply if the customer opts out (via onboarding form or
    emailing support) or enables Zero Data Retention. Nebius also keeps \"absolute discretion\" to
    remove, screen or delete Inputs and Outputs without notice (5.3). Retained Speculative Decoding
    data is stored in Finland (EU) regardless of where real-time processing happens (Legal Quick
    Guide 5.1). Fine-tuning artifacts are stored exclusively in EU data centres per the Legal Quick
    Guide."
  trains_on_inputs: by_default
  zdr_available: yes_optional
  zdr_scope_caveats: "Zero Data Retention is an account-level opt-in (\"enable Zero Data Retention in your account
    settings\"), not the default. Enabling it stops storage and stops use for Speculative Decoding.
    The Legal Quick Guide itself warns that enabling it \"may impact the level of service provided
    (e.g., inference speed)\". Dedicated endpoints separately advertise a \"zero-retention data
    flow\" as a built-in feature of that tier.\n"
  customer_data_ownership: customer_retains
  outputs_used_to_improve_service: opt_out
  third_party_routing_leakage: 'Serves an overwhelmingly open-weight catalogue (Apache
    2.0 / MIT / DeepSeek / Llama licences per the catalogue''s own licence fields); no
    closed third-party model routing identified for Token Factory.

    '
  subprocessors_disclosed: true
  confidentiality: functional_only
  confidentiality_caveats: "The Nebius Services Agreement (effective 2026-10-22) has a general mutual confidentiality
    clause (Sec 18) over \"any information of the disclosing party\". It does not name Customer Data
    or Customer AI Content. It also has a purpose limitation (Sec 10.1.3) that lets Nebius use
    Customer Data \"solely to perform, or as otherwise set forth in\" the Agreement and the Token
    Factory Supplemental Terms. Those terms include the Speculative Decoding training licence
    (5.1(b)), a royalty-free, transferable, sub-licensable, worldwide licence to Input and Output.
    The DPA gives a processor confidentiality duty (2.5) scoped to \"Customer Personal Data\". Coded
    functional_only, not disclaimed, because no clause states Customer Content is non-confidential.
    This is a close call: the purpose limitation is only as narrow as the Supplemental Terms allow.
    The Legal Quick Guide (non-binding) says \"we do not use your content to train, fine-tune or
    improve any AI models\" and that Speculative Decoding \"does not involve training any model\".
    The binding Supplemental Terms say Nebius may \"train smaller Models used for Speculative
    Decoding\". The contract governs."
