        title: "Data & IP ownership"
        doc_type: reference
        source_type: aggregated
        coverage: partial
        refs: [ev-tfterms, ev-agreement]
        summary: "Supplemental Terms 3.1: the customer retains ownership of Customer Content, including Input and Output, subject to the 5.1 licence. The Services Agreement's confidentiality clause (Sec 18) is general and mutual and does not name Customer Data; Sec 10.1.3 limits use of Customer Data to the Agreement and the Supplemental Terms. The DPA's processor-confidentiality duty is scoped to Customer Personal Data."
      - key: residency
        title: "Data residency & jurisdiction"
        doc_type: reference
        source_type: aggregated
        coverage: full
        refs: [ev-regions, ev-tfdocs, ev-dpa, ev-subprocessors]
        summary: "The Nebius AI Cloud regions page lists four public EU region IDs in three countries (Finland, Spain, France x2), Iceland private, but Token Factory's own data-plane page names two EU regions (Finland eu-north1, France eu-west1) plus us-central1. DPA 6.1 pins dedicated endpoints to the customer-selected region, public endpoints are 'Global' and not region-pinned (processing shown in Finland, the UK and the US on 2026-11-19). The contracting entity is Nebius B.V., Nebius Israel Ltd or Nebius Inc. by place of incorporation, and the sub-processor list names US entities, so CLOUD Act exposure is plausible."
      - key: compliance
        title: "Compliance & attestations"
        doc_type: reference
        source_type: aggregated
        coverage: full
        refs: [ev-soc3, ev-iso27001, ev-trustcenter, ev-dpa]
        summary: "A public Deloitte SOC 3 report (period 2025-04-01 to 2025-07-31, clean opinion, includes AI Studio inference) and an ISO/IEC 27001:2022 certificate from SII-QCD (valid to 2028-08-11) were read in full on 2026-11-19; the trust centre also lists SOC 2 Type II with HIPAA (NDA-gated report), ISO 27701, 42001, 22301, 27018, 27032, 27799 and CSA STAR Level 1. A GDPR DPA with SCCs is published; FedRAMP is not offered."
      - key: security
        title: "Security controls"
        doc_type: reference
        source_type: aggregated
        coverage: partial
        refs: [ev-trustcenter, ev-soc3, ev-quickguide]
        summary: "Trust centre (read 2026-11-19) documents VPC, InfiniBand and Kubernetes isolation, TLS in transit, storage encryption by default with named exceptions, least-privilege access with MFA, vulnerability management and regular security assessments, and incident response; DPA Annex 3 repeats the measures. No independent penetration-test attestation or bug-bounty programme was found."
      - key: pricing
        title: "Pricing & cost model"
        doc_type: reference
        source_type: aggregated
        coverage: partial
        refs: [ev-catalogue, ev-billing, ev-tfdocs]
        summary: "Per-token prices are shown on per-model catalogue pages for models with a public endpoint (read 2026-11-19: gpt-oss-120b $0.15/$0.60, DeepSeek-V4-Pro-0813 $1.32/$3.96, GLM-5.3 $1.40/$4.40, MiniMax-M3 $0.30/$1.20). DeepSeek-V4-Pro, Llama-3.3-70B-Instruct and Kimi-K2-Instruct are dedicated-only; the logged-in price list and dedicated prices were not read. Dedicated endpoints are billed per running replica and the per-replica or GPU-hour rate is not disclosed publicly."
      - key: reliability
        title: "Reliability posture"
        doc_type: reference
        source_type: aggregated
        coverage: full
        refs: [ev-tfterms, ev-sla, ev-status]
        summary: "No inference SLA, and Supplemental Terms 7.4 now expressly excludes one: no service level commitments, uptime guarantees or credits for Token Factory. The SLA index lists eight non-inference services. A public status page shows a Token Factory component per region and two resolved incidents in the last 14 days (2026-11-05, 2026-11-11)."
