ownership:
  # Level unchanged on 2026-11-19: exactly one factor (data_control) is weak, which the ownership rule
  # ("Exactly one factor weak" -> partial) maps to partial.
  level: partial
  factors:
    use_modify:   { level: strong,   rationale: "An OpenAI-compatible API (the quickstart uses the OpenAI client against api.tokenfactory.nebius.com/v1) over a predominantly open-weight catalogue keeps served checkpoints portable, and the customer retains ownership of Customer Content (Supplemental Terms 3.1) subject to Nebius' 5.1 licence. Dedicated endpoints keep deprecated models available; the serverless catalogue churns on dated notices." }
    transparency: { level: moderate, rationale: "The Services Agreement, Token Factory Supplemental Terms, DPA, sub-processor list, regions, SLA and docs were read in full on 2026-11-19 and are legible, and the catalogue renders in a browser with per-model prices and context. But the governing document moved between September and November (the legacy Terms now apply only to customers with an active reserve as of 2026-09-15), the non-binding Legal Quick Guide still contradicts the binding training clause, and the logged-in price list and dedicated prices were not readable." }
    reliability:  { level: moderate, rationale: "No inference SLA exists, and Supplemental Terms 7.4 now states so expressly (no service level commitments, uptime guarantees or credits unless agreed in writing); self-service dedicated endpoints carry no formal SLA and release capacity on any stop or incident. The status page shows a Token Factory component per region and two resolved Token Factory incidents in the last 14 days." }
    data_control: { level: weak,     rationale: "The binding Supplemental Terms (5.1(b), effective 2026-10-22) let Nebius use Input and Output by default to train smaller Speculative Decoding models, with an opt-out by onboarding form or email, and reserve absolute discretion to delete them without notice (5.3). Zero Data Retention exists only as an account-level opt-in. The Legal Quick Guide contradicts this in plain English; the contract governs." }
  verdict: "You do not fully control your data by default here: the binding Token Factory Supplemental Terms (5.1(b), effective 2026-10-22) say your Inputs and Outputs may be used to train Nebius' smaller Speculative Decoding models unless you opt out, while the Legal Quick Guide still tells readers that content is not used to train any model. Compliance is a real strength, independently evidenced by a public Deloitte SOC 3 report and an SII-QCD ISO 27001 certificate, and two EU data-plane regions (Finland, France) are documented, but public endpoints are unpinned and there is no inference SLA on the standard terms. If you send sensitive data to Nebius Token Factory, enable Zero Data Retention (it also stops Speculative Decoding) and use a dedicated endpoint in an EU region for residency."

