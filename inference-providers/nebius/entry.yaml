        title: "Data governance - retention, ZDR & training"
        doc_type: reference
        source_type: aggregated
        coverage: full
        refs: [ev-tfterms, ev-tos, ev-quickguide]
        summary: "The binding Token Factory Supplemental Terms Sec 5.1(b) and 5.4 (effective 2026-10-22; Sec 7 of the legacy Terms) say Input and Output are used by default to train smaller Speculative Decoding models, opt-out by onboarding form or email, with absolute-discretion deletion (5.3). The Legal Quick Guide contradicts this in plain English. Zero Data Retention is an account-level opt-in that also stops Speculative Decoding."
