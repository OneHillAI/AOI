residency:
  eu_region_available: "yes"
  regions:
  - United States (us-central1 Kansas City and us-north1 Minnesota, public)
  - 'CHANGED 2026-11-19 (docs.nebius.com/overview/regions, the Nebius AI Cloud region list): public EU regions
    are now Finland (eu-north1), Madrid, Spain (eu-south1), France (eu-west1) and a second French region
    (eu-west2) - four region IDs in three countries. In September only Finland and France were
    public and Spain, eu-west2 and us-north1 were private; now only eu-north2 (Iceland) is listed
    as private. That list is for the GPU cloud, NOT for Token Factory. Token Factory''s own control and
    data plane page names three data-plane regions (eu-north1 Finland, eu-west1 France, us-central1), and
    its sub-processor list gives Nebius B.V. Token Factory processing locations of France, Iceland, Finland
    and the United Kingdom (Nebius Inc. United States, Nebius Israel Israel, RunPod Iceland, BoostRun and
    Shadeform United States, Axe Compute Canada). No Token Factory document names Spain or eu-west2, so the
    count for this service is two EU regions (Finland, France), not four. The status page does list a
    Token Factory component under every region, including EU-SOUTH1 and EU-WEST2, and three Token Factory
    locations TF-US1, TF-US2 and TF-CA1, but it lists every product under every region, so it proves
    nothing about availability. Shared endpoints show Region "Global" and are unpinned (on 2026-11-19 the
    per-model pages showed current processing regions eu-north1, uk-south1, us-north1 and us-central1);
    dedicated endpoints are pinned to the region you choose.'
  - Israel (me-west1, public)
  - United Kingdom (uk-south1/uk-south2, public)
  sovereign_option: 'No distinct named "sovereign cloud" SKU was found; the public EU regions
    (Finland, Spain, France) with a dedicated endpoint pinned to one of them, and fine-tuning data
    stored only in EU data centres, are the closest primary-source-backed residency option.'
  region_pinning: "yes"
  cloud_act_exposure: true
  provider_can_restrict_access: 'DPA 6.1 (effective 2026-11-18): for dedicated endpoints Customer
    Content is processed in the region selected by the customer, subject to limited processing
    outside it for operation, maintenance, security or support; for public endpoints the location
    is "specified in the API or displayed in the Token Factory interface", and the Annex says they
    "are not region-pinned". US-incorporated customers contract with Nebius Inc. (Delaware law, JAMS
    arbitration in New York) for Token Factory registrations on or after 2026-09-15; other customers
    contract with Nebius B.V. (Dutch law, Amsterdam courts). The published sub-processor list names
    Nebius Inc. and four US-based infrastructure providers (RunPod, BoostRun, Shadeform, Axe Compute),
    which creates plausible US CLOUD Act exposure alongside the Netherlands-domiciled parent - an
    inference from the list and the contracting-entity clause, not an explicit CLOUD Act statement.'
reliability:
  sla: 'None on the standard terms. Token Factory Supplemental Terms 7.4 (effective 2026-10-22, read 2026-11-19): "The Service Level Agreement ("SLA") available at https://docs.nebius.com/legal/sla does not apply to the Token Factory Service. Nebius does not provide any service level commitments, uptime guarantees, or associated compensation for the Token Factory Service", with credits excluded "unless agreed otherwise in writing". The dedicated-endpoint docs say self-service dedicated endpoints "do not include a formal SLA unless covered by contract", and the rate-limits page says an Enterprise Tier gives "dedicated capacity plus an SLA", but no Enterprise terms are published. The SLA index (docs.nebius.com/legal/sla-levels, 2026-10-06) lists eight services - Compute Cloud, Disks, Managed Kubernetes, Managed MLflow, Managed PostgreSQL, Object Storage, Shared Filesystem, Virtual Private Cloud - and none is inference. Any 99.9% figure in marketing is not backed by a contract.'
  uptime_notes: 'A public status page (status.nebius.com, read 2026-11-19) shows All Systems Operational
    with a Token Factory component in each region and a 90-day uptime bar without a numeric
    percentage on the main view. Two Token Factory incidents in the last 14 days, both resolved:
    2026-11-05 some models unavailable in eu-north1, and 2026-11-11 connectivity loss in tf-us2
    for about 8 minutes (cause under investigation).

    '
  incidents:
  - region: eu-north1
    summary: 'Token Factory: some models unavailable (resolved), 2026-11-05 10:30 to 11:07 UTC.'
  - region: tf-us2
    summary: 'Token Factory connectivity loss, not reachable 07:33 to 07:41 UTC (resolved), 2026-11-11.'
  - region: eu-west1
    summary: 'Partial metrics unavailability (resolved) - independently browser-confirmed,
      2026-09-09/17 window.'
  - region: us-central1
    summary: 'Partial Object Storage 5xx errors (resolved) - independently browser-confirmed,
      2026-09-09/17 window.'
  - region: eu-north1
    summary: 'SkyPilot cluster-creation errors (503) / VM creation issues (resolved) -
      independently browser-confirmed, 2026-09-09/17 window.'
lock_in:
  openai_compatible_api: true
  portability_notes: 'A "simple, OpenAI-compatible API" (product page and docs, read
    directly) over a predominantly open-weight catalogue (Apache 2.0 / MIT / DeepSeek /
    Llama licences confirmed on the catalogue''s own licence fields) keeps the served
    checkpoints themselves portable. The DPA commits to deleting or returning Customer
    Personal Data on termination, at the customer''s choice (DPA Sec 7, effective 2026-11-18).
    RE-READ 2026-11-19 (catalogue and per-model pages rendered in a browser): most open models have a
    public per-token endpoint, but several named in the first draft (Kimi-K2-Instruct,
    Llama-3.3-70B-Instruct) and DeepSeek-V4-Pro now show "Public endpoint Not available" (dedicated only), and
    Nebius publishes Serverless removal notices (2026-06-22, 08-31, 11-09, 12-24) that say dedicated endpoints
    for removed models are unaffected and that requests are not rerouted. Exit is therefore easy on the weights
    (open models) but the serverless catalogue churns every few weeks.

    '
dedicated_availability: self_serve
dedicated_notes: 'Supplemental Terms 2.3 (read 2026-11-19) grant "a limited right to create, configure,
  and manage Dedicated Endpoints through the Platform", and the dedicated-endpoint docs say "Deployment
  region is fixed and user-selected" with "Capacity reserved for your organization", so the control
  plane is self-serve (catalogue pages read 2026-11-19: "Log in to deploy dedicated endpoints ... zero-retention
  data flow"; deployment and the dedicated price list are behind the login, and regions come from a templates API).
  Self-service dedicated endpoints run on on-demand capacity that is released on any stop, incident or
  maintenance and is not reserved, with no formal SLA unless covered by contract.
  Enterprise custom contracts are also referenced for billing ("charges may vary depending on
  your custom contract or work order"), and the exact per-GPU-hour rate is not disclosed
  publicly. No on-prem/air-gapped offering was found.'
trust_considerations:
- 'MOST CONSEQUENTIAL FINDING, RE-CONFIRMED 2026-11-19 in the new governing document: Token Factory
  Supplemental Terms 5.1(b) (effective 2026-10-22) let Nebius use your Input and Output to "train
  smaller Models used for Speculative Decoding", on by default, with an opt-out by onboarding form
  or email to tokenfactory-support@nebius.com (5.4). The Legal Quick Guide still answers "No" to "Is
  my data used to train your AI models?" and says Speculative Decoding "does not involve training any
  model". This entry codes trains_on_inputs as by_default on the contract, not the summary, which
  says of itself that the Terms prevail. The word "exclusively" that qualified the legacy Sec 7
  sentence ("training smaller Models used exclusively for Speculative Decoding") is gone from 5.1(b).'
- 'The governing document moved. The standalone Token Factory Terms of Service apply only to
  customers with an active reserve as of 2026-09-15; from 2026-09-28 everyone else is on the Nebius
  Services Agreement plus the Supplemental Terms. The contracting entity follows where you are
  incorporated (Agreement Sec 17): Nebius B.V. with Dutch law and Amsterdam courts (not the US or
  Israel); Nebius Israel Ltd with Israeli law and Tel Aviv courts (Israel, Token Factory customers with a
  committed volume registered on or after 2026-09-15); Nebius Inc. with Delaware law and JAMS arbitration
  in New York (US, Token Factory customers registered on or after 2026-09-15). There are three matching DPAs.'
- Supplemental Terms 5.3 keeps "absolute discretion, to remove, screen, or delete any Inputs or
  Outputs at any time, for any reason, and without notice" - provider-favourable, and it does not by
  itself make content non-confidential.
- Zero Data Retention is opt-in (account-level setting), not the default. The Legal Quick Guide
  warns it may reduce inference speed, and now says enabling it is also how you opt out of
  Speculative Decoding.
- 'Compliance is a genuine strength and is now independently evidenced: a public Deloitte SOC 3
  report (period 2025-04-01 to 2025-07-31, dated 2025-10-19, clean opinion, system description
  includes AI Studio inference) and an ISO/IEC 27001:2022 certificate from SII-QCD (valid to
  2028-08-11). The SOC 2 Type II report itself is NDA-gated, the SOC 3 period ended about 16 months
  ago, and ISO 27701 and ISO 42001 rest on trust-centre statements (certificates not read).'
- 'EU-REGION COUNT RE-CHECKED 2026-11-19 (a four-region reading does not hold for this service): the Nebius AI Cloud regions page
  now lists four public EU region IDs in three countries (Finland eu-north1, Spain eu-south1, France eu-west1
  and eu-west2; only Iceland is private), up from two in September. That is the GPU-cloud list. Token Factory''s
  own documents name two EU data-plane regions (Finland eu-north1, France eu-west1) plus us-central1, and its
  sub-processor list gives France, Iceland, Finland and the UK as Nebius B.V. processing locations, so this
  entry counts two EU regions for the service. Token Factory shared endpoints remain unpinned ("Global",
  processing location can change without notice, "not intended for production use cases that require a
  stable, predictable region"; on 2026-11-19 the pages showed eu-north1, uk-south1, us-north1 and us-central1);
  only dedicated endpoints are contractually pinned (DPA 6.1), subject to limited processing outside the region
  for operation, maintenance, security or support.'
- The sub-processor list (effective 2026-09-23) has 23 rows and 20 distinct entities, including
  Nebius Inc. (US) and four US-based infrastructure providers (RunPod, BoostRun, Shadeform, Axe
  Compute); Argentum AI is no longer listed. With the US contracting entity this creates plausible
  CLOUD Act exposure that no primary document addresses explicitly.
- 'There is no inference SLA on the standard terms, now by express contract: Supplemental Terms 7.4 says Nebius
  "does not provide any service level commitments, uptime guarantees, or associated compensation for the Token
  Factory Service" (credits excluded "unless agreed otherwise in writing"). The rate-limits page says an
  Enterprise Tier adds "an SLA", but no such terms are published. Two Token Factory incidents occurred in the
  last 14 days (2026-11-05 eu-north1 some models unavailable; 2026-11-11 tf-us2 connectivity loss of about 8
  minutes).'
- 'Catalogue and prices: tokenfactory.nebius.com returns HTTP 403 to curl but renders in a browser. The 133-row
  catalogue and per-model public prices were read on 2026-11-19; the logged-in price list and all dedicated-endpoint
  prices were not. Models that carried public prices in September (DeepSeek-V4-Pro and Llama-3.3-70B-Instruct)
  are dedicated-only today, as is Kimi-K2-Instruct, and Serverless models are removed on announced dates with no
  automatic rerouting (2026-06-22, 08-31, 11-09, 12-24).'
- 'Rate limits: defaults are dynamic and visible only in the console; the docs give an illustrative baseline of 60
  RPM and 400,000 TPM, a x1.2 scale-up and divide-by-1.5 scale-down per 15-minute window and a hard ceiling of 4x
  the base allocation, beyond which an Enterprise plan is required. Over-limit requests may still be served at
  lower priority; busy endpoints return HTTP 529.'
- 'Encryption keys are Nebius-managed and customer-managed keys are not currently offered (DPA Annex 3).'
score:
  rubric_version: '1.2'
  headline: 64.4
  grade: C
  hard_flags: []
  dimensions:
    data_governance:
      score: 2
      rationale: 'The binding Token Factory Supplemental Terms (effective 2026-10-22; previously Sec 7
        of the legacy Terms) let Nebius use Input and Output by default to "train smaller Models used
        for Speculative Decoding" under a royalty-free, transferable, sub-licensable, worldwide licence,
        with an opt-out by onboarding form or email, and "absolute discretion" to delete Inputs and
        Outputs without notice. The Legal Quick Guide contradicts this in plain English ("No" to "Is my
        data used to train your AI models?"). Real positives keep this off the floor: customer
        ownership of Content (3.1), Zero Data Retention as an account-level opt-in that also turns off
        Speculative Decoding, a disclosed sub-processor list (20 distinct entities, effective
        2026-09-23, 15 days'' notice) and a purpose limitation (Agreement 10.1.3). But "no training by
        default" is the anchor-3 threshold this provider does not clear, matching the anchor-2 pattern
        of retention and training being the default with only a limited opt-out.

        '
      evidence_refs:
      - ev-tfterms
      - ev-tos
      - ev-quickguide
      - ev-subprocessors
    compliance:
      score: 5
      rationale: 'RE-SCORED 2026-11-19 (4 to 5) on two independent artefacts read in full. (1) A public SOC 3
        report issued by Deloitte for Nebius BV (Security, Availability, Confidentiality + HIPAA mapping;
        period 2025-04-01 to 2025-07-31; dated 2025-10-19; clean opinion; system description includes
        AI Studio inference). (2) ISO/IEC 27001:2022 certificate no. 1129086 from SII-QCD, valid
        2025-08-11 to 2028-08-11. Plus a published trust centre listing SOC 2 Type II with HIPAA,
        ISO 27701, 42001, 22301, 27018, 27032, 27799, CSA STAR Level 1, a signed-BAA route for HIPAA, and a
        GDPR DPA with SCCs. This is the anchor-5 set. Caveats: the SOC 2 Type II report itself is
        NDA-gated, the SOC 3 audit period ended about 16 months ago (no newer one linked), the ISO
        certificate scope sentence is generic and does not name Token Factory (the trust-centre and the
        SOC 3 do), ISO 27701 and 42001 rest on trust-centre statements, and FedRAMP is not offered.
        Revert to 4 if a refreshed SOC report does not appear.

        '
      evidence_refs:
      - ev-soc3
      - ev-iso27001
      - ev-trustcenter
      - ev-dpa
    residency:
      score: 3
      rationale: 'CHANGED 2026-11-19: the Nebius AI Cloud regions page (docs.nebius.com/overview/regions) now lists four
        public EU region IDs in three countries (Finland eu-north1, Spain eu-south1, France eu-west1 and
        eu-west2), with only Iceland (eu-north2) private. That page covers the GPU cloud, not Token Factory:
        Token Factory''s own control and data plane page names two EU data-plane regions (Finland, France) plus
        us-central1, and its sub-processor list names France, Iceland, Finland and the UK for Nebius B.V., so
        two EU regions are documented for this service. The DPA (effective 2026-11-18) pins dedicated
        Token Factory endpoints to the region the customer selects (subject to limited processing outside it for
        operation, maintenance, security or support), but public endpoints "are not region-pinned" and run as
        "Global": on the day read their processing regions were Finland, the UK and two US regions. Held at 3 (EU
        region for at least some workloads) rather than 4, which needs pinning for the main workloads. US-incorporated
        customers contract with Nebius Inc., and the sub-processor list carries US entities, so CLOUD Act exposure
        is plausible and undisclosed in any primary document.

        '
      evidence_refs:
      - ev-regions
      - ev-tfdocs
      - ev-dpa
      - ev-subprocessors
      - ev-quickguide
    security:
      score: 3
      rationale: 'The trust centre (read 2026-11-19) documents customer workload isolation (VPC,
        InfiniBand and Kubernetes isolation), TLS in transit, storage encryption by default (with named
        exceptions), least-privilege access with MFA, vulnerability management with automated and manual
        scanning and regular security assessments, a structured incident-response plan, and a secure
        SDLC; DPA Annex 3 repeats the measures. SOC 3 and ISO 27001 give independent assurance over
        the control environment. Held at 3, not 4: no independent penetration-test attestation or
        bug-bounty programme was found, the shared-endpoint isolation model is not documented separately
        from the general statements, and the language names no cipher specifics.

        '
      evidence_refs:
      - ev-trustcenter
      - ev-soc3
      - ev-quickguide
    reliability:
      score: 3
      rationale: 'No inference SLA, and as of 2026-10-22 an express exclusion: Supplemental Terms 7.4
        says Nebius "does not provide any service level commitments, uptime guarantees, or associated
        compensation for the Token Factory Service". The SLA index lists eight services and none is
        inference. What remains is a public status page with a Token Factory component in each region
        and a documented incident record (two Token Factory incidents in the last 14 days, both
        resolved). Matches the anchor-3 bar (operational track record, public status page, SLA absent)
        rather than anchor 4, which requires an actual contractual SLA.

        '
      evidence_refs:
      - ev-tfterms
      - ev-sla
      - ev-status
    transparency_lockin:
      score: 4
      rationale: 'An OpenAI-compatible API over a predominantly open-weight catalogue keeps served
        checkpoints portable, and the DPA commits to deleting or returning Customer Personal Data on
        termination. Sub-processors are disclosed in full (20 distinct entities in 23 rows, with
        processing locations and transfer mechanisms), per-model context windows are published, and
        Serverless removals come with dated notices that leave dedicated endpoints in place. Held below 5
        because the Terms carry an unfavourable training licence and an absolute-discretion deletion right,
        the governing document moved between September and November, the logged-in price list and dedicated
        prices were not readable, and the serverless catalogue churns (three models that were priced
        publicly in September are now dedicated-only, with no standing minimum notice period).

        '
