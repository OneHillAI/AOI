changelog:
- date: '2026-09-20'
  change: 'Initial entry. Primary-source research read the Token Factory Terms of Service, the
    Master Services Agreement, the DPA, the sub-processor list, the Trust Center, the regions
    and SLA pages, the Legal Quick Guide, the live model catalogue, and the dedicated-endpoint
    billing-policy page directly. Coded trains_on_inputs as by_default on the binding Terms of
    Service (Sec 7 - Speculative Decoding training, opt-out available), not the Legal Quick
    Guide''s marketing claim of no training on content - this discrepancy is the entry''s
    central finding and is documented in confidentiality_caveats and trust_considerations.
    Confidentiality coded functional_only (DPA processor-confidentiality is scoped to Customer
    Personal Data, not Customer Content generally; no clause found naming Customer Content
    non-confidential, so short of disclaimed). Flagged that many flagship models on the live
    catalogue are dedicated-endpoint-only with no public per-token price.'
- date: '2026-09-21'
  change: 'CORRECTION - independent Cowork browser verification pass. The entry''s central
    finding (ToS Sec 7 train-by-default, opt-out required) is CONFIRMED VERBATIM under
    independent human-grade review and stands unchanged - this was the one finding most worth
    stress-testing, and it held. Three real corrections downward: (1) EU-region breadth was
    overstated - only Finland (eu-north1) and France (eu-west1) are public/self-serve, not four
    as claimed (Spain and Iceland are private/existing-deployment-only); residency 4 -> 3. (2) A
    claimed "real contractual SLA with service credits" is RETRACTED - no committed inference
    SLA exists at all (the sla-levels index lists exactly seven non-inference services; 99.9% is
    marketing-only); reliability 4 -> 3. (3) A claim that several flagship models were
    dedicated-endpoint-only with no public price was wrong on re-check - they are publicly
    served per-token and were simply superseded by newer catalogue entries; cost 2 -> 3. Two
    corrections upward: SOC 2 Type II now carries a NAMED auditor (Deloitte) and the ISO 27001
    scope statement explicitly names AI Studio/Token Factory - compliance strengthened at the
    same score (4). Also corrected the sub-processor count (~24 -> ~21) and the ownership level
    (limited -> partial; a scoring-rule slip in the original draft - "exactly one factor weak"
    maps to partial, independent of this session''s findings). Headline 65.2 -> recomputed by
    score.py.'
- date: '2026-11-19'
  change: 'FRESHNESS RE-VERIFICATION against the live primary documents (a first pass by an earlier agent was
    cut off mid-edit; every changed fact was re-read from the live pages and checked, not trusted). The
    central finding was re-read verbatim and stands: Token Factory Supplemental Terms 5.1(b) (effective
    2026-10-22, now the governing text for everyone without an active reserve as of 2026-09-15) let Nebius
    "train smaller Models used for Speculative Decoding" on Input and Output by default, opt-out by onboarding
    form or email (5.4), absolute-discretion deletion (5.3), while the Legal Quick Guide still says "No" to
    training and that Speculative Decoding "does not involve training any model"; the word "exclusively" in the
    legacy sentence is gone. trains_on_inputs stays by_default; data_governance stays 2. SLA: Supplemental Terms
    7.4 expressly excludes any SLA, uptime guarantee or credit unless agreed in writing, and the SLA index
    still lists eight non-inference services; reliability stays 3. COMPLIANCE re-scored 4 to 5: the public
    Deloitte SOC 3 report (period 2025-04-01 to 2025-07-31, clean opinion, AI Studio inference in scope) and the
    ISO/IEC 27001:2022 certificate no. 1129086 (SII-QCD, valid to 2028-08-11) were both downloaded and read in
    full, which supplies the third-party attestation the score-5 rule needs; the SOC 2 Type II report itself
    stays NDA-gated and ISO 27701 and 42001 rest on trust-centre statements. Headline 60.8 to 64.4 (grade C),
    computed by score.py. EU REGIONS: the Nebius AI Cloud regions page now lists four public EU region IDs
    (Finland, Spain, France x2), but Token Factory documents name only two EU data-plane regions (Finland
    eu-north1, France eu-west1), so residency stays 3 and the entry counts two EU regions for this service.
    Contracting entity also covers Nebius Israel Ltd (Israeli law). CATALOGUE AND PRICES (readable in a
    browser although curl gets HTTP 403): 133 models; public prices for gpt-oss-120b, DeepSeek-V4-Pro-0813,
    GLM-5.3 and MiniMax-M3; DeepSeek-V4-Pro, Llama-3.3-70B-Instruct and Kimi-K2-Instruct are dedicated-only, so
    the September example rates for DeepSeek-V4-Pro and Llama-3.3-70B-Instruct are withdrawn; the September
    note that Llama-3.3-70B-Instruct was publicly priced could not be reproduced. Rate limits, per-model context
    windows and per-event deprecation notices are now documented, closing three documentation gaps (completeness
    recomputed). The logged-in price list and dedicated prices were not read. Ownership level unchanged
    (partial; data_control weak); factor rationales and verdict rewritten.'
