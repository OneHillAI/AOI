ownership:
  # CORRECTED 2026-09-21: exactly one factor (data_control) is weak, which the ownership rule
  # ("Exactly one factor weak" -> partial) maps to partial, not limited - a scoring-rule slip in
  # the original draft, independent of this session's browser-verification findings.
  level: partial
  factors:
    use_modify:   { level: strong,   rationale: "An OpenAI-compatible API over a predominantly open-weight catalogue keeps served checkpoints portable, and the customer retains ownership of Customer Content subject to Nebius' operational licence. CORRECTED 2026-09-21: a prior claim that many flagship models are dedicated-endpoint-only is not supported - they are publicly served per-token, simply superseded by newer catalogue entries." }
    transparency: { level: moderate, rationale: "The Terms of Service, DPA, Legal Quick Guide and regions/SLA pages are legible and were independently browser-read - but they contain a CONFIRMED internal discrepancy (marketing says no training on content; the binding Terms say otherwise, opt-out only), and the dedicated-tier per-GPU-hour rate is not publicly disclosed. An earlier draft also overstated the public EU-region count (four, corrected to two) and the existence of a committed inference SLA (corrected to none) - both now fixed, but the overstatement itself is a data point about how carefully marketing-adjacent claims need checking here." }
    reliability:  { level: moderate, rationale: "CORRECTED 2026-09-21 (downward): a prior claim of a real contractual SLA with service credits is RETRACTED - an independent browser session found no committed inference SLA exists at all; the master SLA page delegates to seven per-service sub-pages, none of which is inference. What remains: a public status page with a dedicated Token Factory component, shown operational, with a documented but informal incident record." }
    data_control: { level: weak,     rationale: "The binding Terms of Service Sec 7 (independently browser-confirmed verbatim) state Input/Output data is used by default to train Nebius' own models unless the customer opts out - directly contradicting the marketing claim of no training on content, and this finding survives independent human-grade verification - and separately reserve a right to delete customer Inputs/Outputs at any time without notice. Zero Data Retention exists only as an account-level opt-in, not a default." }
  verdict: "You do not fully control your data by default here: an independent Cowork browser session confirmed, verbatim, that the binding Token Factory Terms of Service (Sec 7) state your Inputs and Outputs are used to train Nebius' own models unless you actively opt out - a materially different posture from the marketing copy's 'we do not use your content to train any models' claim, and from every other provider in this batch. This is not an artefact of automated research; it holds up under independent verification. Compliance is genuinely strong (SOC 2 Type II by a named auditor - Deloitte - covering HIPAA; ISO 27001 scope confirmed to include Token Factory itself), but EU-region breadth is narrower than an earlier draft claimed (two public self-serve regions, not four) and there is no committed inference SLA at all (a prior claim to the contrary is retracted). Enabling Zero Data Retention in account settings closes the training gap - but you have to know to do it. If you route sensitive data through Nebius Token Factory, enable Zero Data Retention explicitly and confirm which endpoint (shared vs dedicated) actually carries your chosen region's residency guarantee before relying on it."

evidence:
- id: ev-tos
  claim: "Nebius Token Factory Terms of Service (read directly), Sec 7: Nebius collects and
    stores Inputs/Outputs by default and grants itself a licence to 'access, use, host, cache,
    store, copy, and modify Inputs and Outputs' to provide the Service AND to train its own
    smaller models used exclusively for 'Speculative Decoding'; opt-out available via
    onboarding form or emailing tokenfactory-support@nebius.com; separately reserves the right
    to 'remove, screen, or delete any of Your Inputs and Outputs at any time, for any reason,
    and without notice.' Sec 10(b)/(c): customer 'holds exclusive ownership of all rights,
    titles, and interests... to Customer's Content,' Nebius claims no rights except as
    described in Secs 7/12/13/13A; outputs 'may not be unique' (shared-endpoint caveat)."
  source_type: publisher
  doc_type: terms
  retrieved: true
  url: https://docs.tokenfactory.nebius.com/legal/terms-of-service
  date: '2026-09-20'
- id: ev-quickguide
  claim: "Nebius Legal Quick Guide (read directly): states 'We do not use your content to
    train, fine-tune or improve any AI models - ours or third parties'' - in tension with the
    binding Terms of Service Sec 7 (see ev-tos). Confirms Zero Data Retention is an
    account-level opt-in setting ('enable Zero Data Retention in your account settings'), with
    a disclosed trade-off ('may impact the level of service provided, e.g. inference speed');
    confirms data is stored in Finland (EU) regardless of processing location, and fine-tuning
    artifacts stored exclusively in EU data centres; references encryption at rest/in transit
    and need-to-know access management; 15-day advance notice before adding a sub-processor."
