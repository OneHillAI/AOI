# OneHill model entry - machine-readable source of truth.
# Validated against schema/model.schema.json. Scores are computed by scripts/score.py.
# Copy this folder to models/<id>/ and fill it in. Every non-trivial claim needs an
# evidence entry; a dimension scored 5 needs onehill_verified or third_party evidence.

schema_version: "1.0"
id: "publisher-model"                     # lowercase slug, matches the folder name
name: "Publisher Model Family"
aliases: []

publisher:
  name: ""
  country: ""
  accountable_entity: true                # is there a named, legally accountable publisher?
  url: ""
  security_contact: ""

summary: >
  One independent paragraph: what it is, who made it, the single most important
  thing an adopter needs to know (license posture, provenance, standout risk).

variants:
  - name: ""
    params_total: ""
    params_active: ""                     # for MoE; omit for dense
    context_window: ""
    kind: instruct                        # base | instruct | reasoning | guard | code | multimodal | quantized | other
    safety_tuned: true

openness:
  tier: open_weights                      # fully_open | open_weights_recipe | open_weights | gated_open | open_washed | closed
  components:
    weights: open                         # open | partial | closed
    training_data: closed
    training_code: closed
    evaluation: partial
    documentation: open
    license: partial                      # open | partial | closed (how open the LICENSE is; the classification goes below)
  license:
    spdx: ""
    name: ""
    classification: open_weight           # osi | permissive_open | open_weight | research_only | custom
    commercial_use: allowed_with_conditions
    notable_restrictions: []
    url: ""

provenance:
  canonical_source: ""
  verified_org_on_primary_host: true
  formats: [safetensors]                  # safetensors | gguf | onnx | pickle | mlx | other
  integrity:
    checksums: true
    signed: false
    signing_tech: ""
    provenance_attestation: false
  mirrors_and_quants:
    acknowledged: true
    notable: []
  checkpoint_checklist_score: 0           # 0..8, see supply-chain-risk.md
  scanner_result: {}
  incidents: []

eu_ai_act:
  is_gpai: true
  systemic_risk:
    designated: false
    training_flops_estimate: ""
    over_1e25_threshold: null
    article_55_docs_available: n/a        # yes | partial | no | n/a
  open_source_exemption:
    license_qualifies: uncertain          # yes | no | uncertain
    rationale: ""
  provider_package:
    technical_documentation: unknown      # yes | partial | no | unknown
    downstream_information: unknown
    copyright_policy: unknown
    training_content_summary: unknown
    code_of_practice_signatory: false
  deployer_notes: ""
  last_assessed: "2026-07-25"

performance: {}                           # see benchmark-methodology.md
behaviour: {}
safety: {}

deployment:
  ceiling_tier: T1                        # T0..T4 - highest tier reachable with controls
  ceiling_conditional: true
  hardware_notes: ""
  serving_support: []                     # vllm | llama.cpp | ollama | tgi | mlx | ...
  controls_required: []

score:
  rubric_version: "1.0"
  headline: null                          # computed by scripts/score.py --write
  grade: null
  hard_flags: []
  dimensions:
    openness:     {score: 0, rationale: "", evidence_refs: []}
    provenance:   {score: 0, rationale: "", evidence_refs: []}
    legal:        {score: 0, rationale: "", evidence_refs: []}
    safety:       {score: 0, rationale: "", evidence_refs: []}
    performance:  {score: 0, rationale: "", evidence_refs: []}
    operational:  {score: 0, rationale: "", evidence_refs: []}
    governance:   {score: 0, rationale: "", evidence_refs: []}

evidence:
  - id: ev1
    claim: ""
    source_type: publisher                # onehill_verified | third_party | publisher
    url: ""
    date: "2026-07-25"

changelog:
  - date: "2026-07-25"
    change: "Initial entry."

last_verified: "2026-07-25"
freshness_sla: {fast_days: 30, score_days: 90, slow_days: 180}
