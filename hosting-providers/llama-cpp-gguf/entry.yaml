      - key: known-issues
        title: "Known issues & caveats"
        doc_type: troubleshooting
        source_type: aggregated
        coverage: full
        refs: [ev2, ev4, ev5]
        summary: "Known caveats: chat-template SSTI RCE (CVE-2024-34359, llama-cpp-python; SGLang CVE-2026-5760 is a separate flaw) and poisoned-template inference-time backdoors that run on every prompt. Recurring GGUF parser overflows (two rated RCE by ZDI in November 2026) add to them. Mitigations are keeping loaders current, inspecting templates and sandboxing."

evidence:
- id: ev1
  claim: "llama.cpp is the open-source community serving engine, with a GGUF workflow (convert, quantize, run) and a single-file container format. The repository is MIT-licensed and not archived; v1.0.0 was released 2026-11-13."
  source_type: publisher
  doc_type: docs
  retrieved: true
  url: https://github.com/ggml-org/llama.cpp
  date: '2026-11-19'
- id: ev2
  claim: "JFrog states that the only publicly known GGUF-to-RCE template injection is CVE-2024-34359 in llama-cpp-python < 0.2.72, with no code execution on >= 0.2.72 or in other GGUF libraries such as ollama."
  source_type: third_party
  doc_type: third_party
  retrieved: true
  url: https://research.jfrog.com/model-threats/gguf-ssti/
  date: '2026-11-19'
