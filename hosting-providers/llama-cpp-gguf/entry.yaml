# OneHill v2 HOSTING/DISTRIBUTION-PROVIDER library entry for llama.cpp / GGUF. Replaces data.yaml.
# Validated against schema/hosting-provider.v2.schema.json.
#   scores  -> scripts/score.py --write        (provider score - carried over unchanged)
#   meters  -> scripts/completeness.py --write  (per-domain completeness/originality)
#   prose   -> assess.md / implement.md / use.md / support.md (sections keyed <!-- item: KEY -->)

schema_version: '2.0'
id: llama-cpp-gguf
name: llama.cpp / GGUF
kind: serving_engine
operator: ggml-org (core maintainers employed by Hugging Face since February 2026) / open-source community
summary: "llama.cpp is the community serving engine and GGUF is its single-file container format (weights, tokenizer, metadata and chat template). It is not a hub. Weights come from elsewhere (usually Hugging Face), are converted to GGUF with convert_hf_to_gguf.py, quantized with llama-quantize (Q4_K_M, Q5_K_M, Q8_0, etc.) and run with llama-cli or llama-server; the README also shows a \"llama cli\" / \"llama serve\" front end. Community quantizers (bartowski, unsloth) redistribute prebuilt GGUFs on HF. The engine is plain MIT, and v1.0.0 shipped on 2026-11-13 with semantic versioning for the C API. GGUF is tensor plus metadata with no pickle-style code execution on load, which is a safety plus. The loaders have repeatedly had weaknesses. The GGUF chat-template Jinja2 SSTI leading to RCE in llama-cpp-python < 0.2.72 is CVE-2024-34359 (patched 0.2.72). The same bug class hit SGLang as CVE-2026-5760 (fixed 0.5.11). The llama.cpp GGUF parser keeps producing memory-safety CVEs: heap and integer overflows in gguf_init_from_file and gguf_init_from_reader through 2026, with ZDI publishing two GGUF-parsing bugs as remote code execution on 2026-11-13. Poisoned templates can also plant inference-time backdoors that run on every prompt. The engine and format carry no native provenance, malware scanning or signing. Safety therefore depends on the source of the GGUF and the deployer's discipline: pull from the canonical publisher or a reputable quantizer, pin and hash the source revision, and keep llama.cpp and llama-cpp-python current. Inspect the chat template before serving and sandbox the loader. The project says there is no reliable way to detect a malicious model and recommends sandboxing."
distribution_mechanism: 'Not a hub. Obtain weights (usually from Hugging Face), convert
  to GGUF (convert_hf_to_gguf.py), quantize (llama-quantize), and run with llama-cli
  / llama-server. GGUF is a single-file container (weights + tokenizer + metadata
  + chat template). Community quant repos (bartowski, unsloth) distribute prebuilt
  GGUFs on HF. The engine can also download from HF directly (-hf flag). Pre-built
  binaries, Docker images, Homebrew, conda-forge, MacPorts and Winget packages exist;
  none of them is signed per the release pipeline described in the project blog.

  '
provenance:
  verified_orgs: 'no'
  malware_scanning: 'None in the format itself. GGUF carries no scanning; provenance
    and any scanning depend entirely on the source hub you pulled the file from (usually
    Hugging Face).

    '
  signing: 'None native. The GGUF specification (format version 3) has no signing,
    hash or attestation field, and llama.cpp has no built-in cryptographic signing
    of the artifact. SECURITY.md tells users to confirm the hash of any downloaded
    artifact against a known-good value.

    '
  checksums: 'yes'
  revision_pinning: 'yes'
  gating_enforcement: none (gating depends on the source hub)
format_safety:
  safetensors_default: n/a
  pickle_handling: n/a
  trust_remote_code_surface: 'GGUF is tensor + metadata with no pickle-style code-execution
    on load - a safety plus versus pickle. Concrete residual risks follow. (1) GGUF chat-template Jinja2 SSTI leading to RCE - CVE-2024-34359 in llama-cpp-python 0.2.30 to 0.2.71, patched in 0.2.72. JFrog states no code execution occurs on >= 0.2.72 or in other GGUF libraries such as ollama. The same class hit SGLang as CVE-2026-5760 (/v1/rerank, fixed in 0.5.11). (2) Poisoned-template inference-time backdoors, where malicious instructions in the template layer execute on every prompt. (3) Loader memory safety - gguf_init_from_file() historically did not validate n_kv. 2026 brought further integer and heap overflows in gguf_init_from_reader and the multimodal projector loader. ZDI labelled two of them remote code execution (user interaction required). (4) llama-server, RPC backend and state-restore bugs, which concern
    the server and not the file format.

    '
  known_loader_cves:
  - CVE-2024-34359 - llama-cpp-python 0.2.30 to 0.2.71 GGUF chat-template Jinja2 SSTI
    -> RCE (CVSS 9.6); patched in 0.2.72
  - CVE-2026-5760 - SGLang < 0.5.11 /v1/rerank GGUF chat-template SSTI -> RCE (CVSS
    9.8); not a llama.cpp or llama-cpp-python bug
  - GGUF gguf_init_from_file n_kv heap-overflow class (2024, JFrog / huntr), then
    CVE-2025-53630, CVE-2026-27940 and CVE-2026-33298 (integer overflows in GGUF/tensor
    parsing, fixed b7824 and b8146)
  - CVE-2026-116829 and CVE-2026-116840 (gguf_init_from_reader integer overflows, fixed
    b11301 and b11275), CVE-2026-116816 (PLaMo2 tokenizer heap write from GGUF, fixed
    b10261)
  - CVE-2026-126974 and CVE-2026-126975 (ZDI-26-975/976 GGUF parsing RCE) and CVE-2026-126976
    (ZDI-26-954 multimodal projector GGUF parsing RCE), advisories published 2026-11-13;
    ZDI states llama.cpp issued an update
  - CVE-2026-52131 - reachable assertion in gguf_reader::read (b5693 and before, DoS)
license_surfacing: "The engine is plain MIT (\"Copyright (c) 2023-2026 The ggml authors\"), which covers the code only. The engine and format surface no weights licence. Whatever licence and gating attach to the weights come from wherever the GGUF was obtained (usually a Hugging Face repo)."
security_track_record:
  incidents:
  - date: '2024-05-10'
    summary: CVE-2024-34359 ("Llama Drama") - GGUF chat-template SSTI leading to RCE
      in llama-cpp-python 0.2.30 to 0.2.71, patched in 0.2.72. The only publicly
      known GGUF template-to-RCE case in llama.cpp-based libraries per JFrog.
    severity: critical
    url: https://research.jfrog.com/model-threats/gguf-ssti/
  - date: '2026-04-20'
    summary: "CVE-2026-5760 - the same bug class in SGLang's /v1/rerank endpoint (GGUF tokenizer.chat_template rendered with an unsandboxed Jinja2 environment), fixed in SGLang 0.5.11. CERT/CC records that no response was obtained from the SGLang maintainers during coordination."
    severity: critical
    url: https://www.kb.cert.org/vuls/id/915947
  - date: 2024-2026
    summary: Repeated GGUF file-format parsing vulnerabilities in llama.cpp - gguf_init_from_file
      n_kv and string-length overflows (2024), CVE-2025-53630, CVE-2026-27940, CVE-2026-33298,
      and in October 2026 CVE-2026-116829, CVE-2026-116840 and CVE-2026-116816 (fixed
      in b11301, b11275, b10261).
    severity: high
    url: https://github.com/ggml-org/llama.cpp/security/advisories
  - date: '2026-11-13'
    summary: ZDI published ZDI-26-975, ZDI-26-976 and ZDI-26-954 (CVE-2026-126974,
      CVE-2026-126975, CVE-2026-126976), GGUF parsing and multimodal-projector GGUF
      parsing bugs rated remote code execution (CVSS 7.8, 7.8, 7.0; user interaction
      required). One was reported in June and published in November.
    severity: high
    url: https://www.zerodayinitiative.com/advisories/ZDI-26-975/
  response_notes: 'Fixes land quickly for most reports, and ZDI states the vendor issued
    an update before publication, but the record has two weaknesses. First, the project
    disabled its private security-disclosure channel on 2026-06-01 (SECURITY.md: submit patches as public PRs, emails ignored). Its GitHub advisory feed has not been updated since 2026-03-26, while NVD lists roughly thirty later llama.cpp and GGUF
    CVEs, so the first-party list is no longer a complete record. Second, one ZDI report
    took about five months from report to publication. Treat community-uploaded GGUFs
    like untrusted third-party software - the format''s data-only design does not
    neutralise template injection or loader memory bugs.

    '
trust_signals_exposed:
- Fully open-source engine - code is auditable (a real transparency plus)
- 'Source-hub provenance - GGUF has none of its own; trust depends entirely on where the
  file was obtained (gameable if the source hub''s signals are gameable)'
- Quantizer reputation (bartowski, unsloth, etc.) - informal, community reputation,
  not a verified identity
self_hosting_notes: "Prefer GGUFs from the model's canonical publisher or a reputable quantizer. Pin the exact source revision and verify SHA256. Keep llama.cpp and llama-cpp-python current (llama-cpp-python >= 0.2.72 closes CVE-2024-34359; llama.cpp fixes land per build tag, so track the bNNNN tag or v1.x release, not a date). Inspect the GGUF chat template and tokenizer config before serving: template injection runs on every prompt at inference time, beyond the load step. Sandbox the loader (no network, least privilege). SECURITY.md states \"no reliable methods to detect malicious models\", recommends sandboxing, and advises against exposing the RPC backend or llama-server to untrusted networks. If SGLang runs GGUF models, use >= 0.5.11 (CVE-2026-5760). Check the template against known-malicious signatures where feasible."
ecosystem_lockin: 'Minimal lock-in: llama.cpp is open-source and GGUF is the de facto
  local-inference standard, consumed by Ollama, LM Studio, text-generation-webui and
  many others. The format is maximally portable; conversion tooling is open.

  '
score:
  rubric_version: '1.0'
  headline: 56.4
  grade: C
  hard_flags: []
  dimensions:
    provenance_integrity:
      score: 2
      rationale: "As a format and engine, GGUF/llama.cpp carries no native provenance: no verified orgs, no scanning, no signing. Integrity depends entirely on the source hub's checksums and the deployer's revision-pinning discipline. That sits below the score-3 anchor, which expects verified orgs plus scanning at the distribution layer."
      evidence_refs:
      - ev1
      - ev2
    format_loader_safety:
      score: 3
      rationale: "GGUF's data-only design (no code execution on load) is a plus over pickle and earns the middle anchor. The loaders have an exploited CVE history: the chat-template SSTI RCE (CVE-2024-34359, llama-cpp-python) and a continuing run of GGUF parser overflows through 2026, two rated RCE by ZDI in November 2026. Safety therefore depends on keeping loaders current, pinning versions and inspecting templates, and is not intrinsic."
      evidence_refs:
      - ev2
      - ev4
      - ev5
    license_governance:
      score: 2
      rationale: "The engine itself is plain MIT, but the engine and format surface and enforce nothing about the weights. All weights licence clarity and gating come from the source hub. On its own that is minimal governance, below the enforced-gating anchor."
      evidence_refs:
      - ev1
    security_track_record:
      score: 3
      rationale: "Documented loader vulnerabilities (SSTI RCE, heap overflows) concentrate here and are actively researched. Most are fixed within days of a report. The project disabled private disclosure on 2026-06-01. Its advisory feed stopped at 2026-03-26 while NVD lists about thirty later llama.cpp and GGUF CVEs, and one ZDI report took about five months to publish. The middle anchor reflects a format that is safe by design but demands version and template discipline."
      evidence_refs:
      - ev2
      - ev4
    transparency:
      score: 3
      rationale: "llama.cpp is fully open-source and auditable, and the security research on GGUF is public. The score stays at the middle anchor because the artifact exposes no provenance signal of its own, so a downloader must reason about trust entirely from the external source."
      evidence_refs:
      - ev1
      - ev3
    ecosystem_portability:
      score: 5
      rationale: "GGUF is the de facto local-inference standard, consumed across Ollama, LM Studio, text-generation-webui and more. The engine and conversion tooling are open-source and the format is maximally portable. Security research that treats GGUF as the dominant local model format attests to its ubiquity."
      evidence_refs:
      - ev2
      - ev5

