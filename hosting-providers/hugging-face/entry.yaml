        source_type: aggregated
        coverage: full
        refs: [ev1, ev7, ev8]
        summary: "Repeated real-world incidents (PoisonGPT, nullifAI, JFrog's ~100+ backdoored models, 2026 typosquats with 200k+ downloads) offset by fast ~24h removals, hardened picklescan and vendor partnerships."
      - key: transparency
        title: "Exposed trust signals & their gameability"
