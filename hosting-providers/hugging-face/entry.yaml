        refs: [ev1, ev2, ev9, ev10, ev22]
        summary: "Verified-org (blue) badges for named labs (documented route is domain verification), layered automated scanning (ClamAV, Pickle Import scan, Protect AI Guardian, JFrog, TruffleHog), hash-identified files and commit-hash pinning; scanning marks rather than blocks, does not analyse repo Python, and there is no weight-level cryptographic signing."
      - key: format-safety
        title: "Format & loader safety"
        doc_type: reference
        source_type: aggregated
        coverage: full
        refs: [ev4, ev5, ev6, ev14, ev15, ev16]
        summary: "safetensors is promoted as the default (Trail of Bits audit found no critical RCE; now under the PyTorch Foundation); pickle is flagged-not-blocked, trust_remote_code=True runs repo Python the scanners do not analyse (Load/Mine, October 2026), CVE-2026-4372 achieved config-injection RCE bypassing trust_remote_code=False in Transformers before 5.3.0, and NVD lists 59 picklescan CVEs."
      - key: license-governance
        title: "License surfacing & gating"
        doc_type: reference
        source_type: aggregated
        coverage: full
        refs: [ev3, ev11]
        summary: "License declared per repo in the model card and not validated by the Hub; gated models (Llama, Gemma) require a per-user access request (click-through, automatic or manual approval) enforced at the download/API layer and revocable by authors at any time."
      - key: security-record
        title: "Security incident history & response"
        doc_type: explanation
        source_type: aggregated
        coverage: full
        refs: [ev7, ev8, ev13, ev14, ev18]
        summary: "Repeated real-world incidents (PoisonGPT, JFrog's ~100 malicious models, nullifAI, 2026 typosquats, the July 2026 intrusion into the Hub's own infrastructure, the October 2026 Load/Mine campaign) offset by an under-24-hour nullifAI removal, a published post-mortem, hardened picklescan and vendor partnerships; the Load/Mine second wave stayed live for days."
      - key: transparency
        title: "Exposed trust signals & their gameability"
        doc_type: explanation
        source_type: aggregated
        coverage: full
        refs: [ev2, ev8, ev9, ev17]
        summary: "Verified-org badges, visible scan status, commit-verified badges and public gating state are honest signals; download counts, likes and self-declared base_model lineage are gameable and not labelled as such. SOC 2 Type 2 is claimed in the docs; ISO 27001 is not held."
  implement:
    completeness: 37.5
    originality: 0.0
    items:
      - key: obtain-weights
        title: "Obtaining weights (git-LFS / huggingface_hub)"
        doc_type: howto
        source_type: aggregated
        coverage: partial
        refs: [ev3, ev22]
        summary: "Weights live in per-repo git repositories with large files in Xet storage (LFS pointer format kept) pulled via git clone or, typically, huggingface_hub / transformers from_pretrained(); gated repos need an approved access request and a user token before the pull succeeds."
      - key: verify-integrity
        title: "Verifying integrity (hashes & scan status)"
        doc_type: howto
        source_type: aggregated
        coverage: partial
        refs: [ev2, ev9]
        summary: "Files are identified by git-sha1 or sha256 ETag and Xet chunk hashes; layered scan status (unsafe/suspicious flags) is the visible integrity surface, but it warns rather than blocks and the docs read do not say the client re-verifies each hash, so verify the SHA256 yourself."
      - key: pin-revision
        title: "Pinning a revision"
        doc_type: howto
        source_type: aggregated
        coverage: partial
        refs: [ev3]
        summary: "Revisions are addressable by commit hash; pin an explicit commit rather than `main` for reproducible, tamper-evident pulls (the download/API layer resolves the pinned revision)."
      - key: run-serve
        title: "Running / serving"
        doc_type: howto
        source_type: gap
        gap_reason: "Hugging Face Hub is a distribution hub, not a local runner or serving engine; running/serving pulled weights is out of scope for this entry and not documented in the sources reviewed."
      - key: resource-needs
        title: "Resource requirements"
        doc_type: reference
        source_type: gap
        gap_reason: "Disk/VRAM/hardware requirements depend on the specific model pulled from the Hub rather than the Hub itself and were not captured in the sources reviewed."
  use:
    completeness: 90.0
    originality: 0.0
    items:
      - key: catalog-scope
        title: "Catalog scope & publishers"
        doc_type: reference
        source_type: aggregated
        coverage: full
        refs: [ev7, ev8]
        summary: "The de facto default public registry for open-weight models - named labs (Meta, Google, Mistral) publish under verified orgs alongside a vast open-upload community; security researchers repeatedly target it precisely because of its central position."
      - key: formats-supported
        title: "Formats supported"
        doc_type: reference
        source_type: aggregated
        coverage: full
        refs: [ev4, ev6]
        summary: "safetensors (promoted default, data-only), legacy pickle checkpoints (flagged-not-blocked), plus repo-shipped code paths (trust_remote_code / config); prefer safetensors and avoid untrusted pickle/remote code."
      - key: integration
