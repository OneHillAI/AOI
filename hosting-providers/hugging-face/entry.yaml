        source_type: aggregated
        coverage: partial
        refs: [ev7]
        summary: "First-class client tooling (huggingface_hub, transformers from_pretrained) makes it the ecosystem's center of gravity - the default source most downstream stacks pull from - though the specifics per stack were not individually catalogued."
