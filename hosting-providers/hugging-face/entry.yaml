changelog:
- date: '2026-07-25'
  change: Initial entry.
- date: '2026-07-25'
  change: Migrated to v2 four-domain library format (added documentation block; score
    carried over unchanged).
- date: '2026-09-21'
  change: 'Freshness re-verification (Cowork browser session). Malware/pickle scanning still active and unchanged, verbatim: ClamAV runs on every uploaded file; every pickled file (pytorch_model.bin etc.) runs through Pickle Import scan, flagging suspicious imports, with the unchanged disclaimer that this is not 100% foolproof and packages are not actively audited for safety. safetensors remains documented as an "experiment," not declared the platform default. No HF-native signing/provenance-attestation feature confirmed (still commit-level GPG signing only; third parties like Cohere/Red Hat/sigstore push model signing, not HF itself). No new security incident or typosquatting campaign surfaced since ~Aug 2026 (the July 2026 intrusion predates this window and was already reflected). Hard flag does not apply. No score change.'
- date: '2026-11-19'
  change: 'Freshness re-verification against live primary sources (code session; first time extracts are stored under docs/primary-sources/hugging-face/). Re-read Terms (effective 2022-09-15, unchanged), Privacy Policy (2023-03-28, unchanged), Content Policy (2025-04-10), security, malware, pickle, JFrog, Protect AI, secrets and GPG docs, gated-model and licence docs, storage limits, regions, pricing, Xet docs and the status page. Corrections: (1) ISO 27001 removed - Hugging Face''s own docs claim SOC2 Type 2 only and its May 2026 Hub blog article says ISO 27001 is not held; the earlier "SOC 2 and ISO 27001" claim cited a post that contains neither. (2) CVE-2025-1716 is picklescan before 0.0.21 not treating pip as unsafe (NVD), not the nullifAI broken-pickle fix; CVE-2026-4372 range narrowed to Transformers 4.56.0 to 5.2.x with kernels installed (NVD says all versions before 5.3.0). (3) The "fake OpenAI repository, ~244k downloads" row was the Open-OSS typosquat counted twice and is merged. (4) JFrog "about 100 malicious models" is from JFrog research of 2024-02, not the Hugging Face partnership post. (5) Scanners named in the docs are ClamAV, a Pickle Import scan, Protect AI Guardian, JFrog and TruffleHog; ModelScan is not named. (6) Storage is now Xet-backed with LFS pointers; the docs read do not state that the client re-verifies hashes on download. (7) Verified-org badge: only documented route is domain verification on Team and Enterprise plans. (8) Evidence links repaired: The Hacker News URL returns 403 and the Trail of Bits PDF URL returns 404. New facts added: July 2026 intrusion into Hugging Face production infrastructure (HF post-mortem, no tampering found in repos or published artifacts); October 2026 Load/Mine campaign (31 repos, 32,376 downloads, flagship scanned clean, second wave live eight days after report); 59 NVD picklescan CVEs, 50 from June and July 2026; safetensors moved to the PyTorch Foundation 2026-04-08; Trusted Publishers; gating EU-disallow flag; status page 99.991% Hub uptime over 90 days with no git-hosting incident. Not re-read: the Trail of Bits PDF (over fetch cap), The Hacker News (403), OpenAI''s incident report and the California complaint. Scores unchanged (79.2, B); security_track_record kept at 3 with a rationale noting the Load/Mine response as the weakest data point.'
