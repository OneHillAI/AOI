    the in-house picklescan only pattern-matches module names. The count of about 100 malicious models comes
    from ev18, not this post.
  source_type: publisher
  doc_type: docs
  retrieved: true
  url: https://huggingface.co/blog/jfrog
  date: '2026-11-19'
- id: ev2
  claim: JFrog scanner integration on the Hub; results shown in the Hub UI.
  source_type: publisher
  doc_type: security
  retrieved: true
  url: https://huggingface.co/docs/hub/en/security-jfrog
  date: '2026-11-19'
- id: ev3
  claim: Gated models need a per-user access request (click-through, automatic or manual
    approval), enforced at download with a user token; authors can revoke at any time;
    optional EU-disallow flag.
