        title: "Catalog scope & publishers"
        doc_type: reference
        source_type: aggregated
        coverage: full
        refs: [ev7, ev8]
        summary: "The de facto default public registry for open-weight models - named labs (Meta, Google, Mistral) publish under verified orgs alongside a vast open-upload community; security researchers repeatedly target it precisely because of its central position."
      - key: formats-supported
        title: "Formats supported"
        doc_type: reference
        source_type: aggregated
