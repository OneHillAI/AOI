      - key: format-safety
        title: "Format & loader safety"
        doc_type: reference
        source_type: aggregated
        coverage: full
        refs: [ev4, ev5, ev6]
        summary: "safetensors is promoted as the default (Trail of Bits audit found no critical RCE); pickle is flagged-not-blocked, trust_remote_code=True runs repo Python, and CVE-2026-4372 achieved config-injection RCE bypassing trust_remote_code=False in Transformers < 5.3.0."
      - key: license-governance
        title: "License surfacing & gating"
        doc_type: reference
        source_type: aggregated
        coverage: full
        refs: [ev3]
        summary: "License declared per repo and surfaced in the model card; gated models (Llama, Gemma) enforce click-through acceptance plus optional access request at the download/API layer - one of the few hubs that actually enforces EULA gating."
      - key: security-record
