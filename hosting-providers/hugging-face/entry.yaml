        refs: [ev2]
        summary: "Security documentation on the Hub plus scanner partnerships (JFrog, ProtectAI) are the trust/disclosure surface; malicious repos are typically removed within ~24h, though a formal coordinated-disclosure channel was not separately captured."
      - key: release-versioning
        title: "Tooling versioning & patch cadence"
