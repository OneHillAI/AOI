        source_type: aggregated
        coverage: full
        refs: [ev2, ev8, ev9]
        summary: "Verified-org badges, visible scan status, commit-verified badges and public gating state are honest signals; download counts, likes and self-declared base_model lineage are gameable and not labelled as such."
  implement:
    completeness: 37.5
    originality: 0.0
    items:
      - key: obtain-weights
        title: "Obtaining weights (git-LFS / huggingface_hub)"
        doc_type: howto
        source_type: aggregated
        coverage: partial
        refs: [ev3]
        summary: "Weights live in per-repo git-LFS repositories pulled via git clone or, typically, huggingface_hub / transformers from_pretrained(); gated repos require click-through acceptance at the download/API layer before the pull succeeds."
      - key: verify-integrity
        title: "Verifying integrity (hashes & scan status)"
        doc_type: howto
        source_type: aggregated
        coverage: partial
        refs: [ev2, ev9]
        summary: "Content-addressed storage means the client verifies file hashes on download; layered scan status (unsafe/suspicious flags) is the visible integrity surface, but it warns rather than blocks, so verify the SHA256 yourself."
      - key: pin-revision
        title: "Pinning a revision"
        doc_type: howto
        source_type: aggregated
        coverage: partial
        refs: [ev3]
        summary: "Revisions are addressable by commit hash; pin an explicit commit rather than `main` for reproducible, tamper-evident pulls (the download/API layer resolves the pinned revision)."
      - key: run-serve
        title: "Running / serving"
        doc_type: howto
        source_type: gap
        gap_reason: "Hugging Face Hub is a distribution hub, not a local runner or serving engine; running/serving pulled weights is out of scope for this entry and not documented in the sources reviewed."
      - key: resource-needs
        title: "Resource requirements"
        doc_type: reference
        source_type: gap
        gap_reason: "Disk/VRAM/hardware requirements depend on the specific model pulled from the Hub rather than the Hub itself and were not captured in the sources reviewed."
