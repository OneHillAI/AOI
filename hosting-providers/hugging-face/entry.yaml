        doc_type: reference
        source_type: aggregated
        coverage: partial
        refs: [ev2, ev12, ev14]
        summary: "Security documentation on the Hub (security@huggingface.co), the Content Policy report button and safety@huggingface.co, plus scanner partnerships (JFrog, Protect AI) are the trust/disclosure surface; the nullifAI models were removed in under 24 hours but the Content Policy promises no takedown time and the Load/Mine second wave stayed live for days."
      - key: release-versioning
        title: "Tooling versioning & patch cadence"
        doc_type: release_notes
        source_type: aggregated
        coverage: partial
        refs: [ev6, ev16]
        summary: "Loader security tracks client versions - CVE-2026-4372 was patched in Transformers 5.3.0 (current release 5.23.0, 2026-11-13), picklescan was changed after nullifAI and is at 1.0.5 after a June and July 2026 wave of bypass CVEs - so keep transformers >= 5.3.0; the Hub's own release/changelog cadence was not separately captured."
      - key: channels
        title: "Community & support channels"
        doc_type: reference
        source_type: gap
        gap_reason: "Community and support channel details (forums, Discord, enterprise support terms) were not captured in the sources reviewed."
      - key: known-issues
        title: "Known issues & caveats"
        doc_type: troubleshooting
        source_type: aggregated
        coverage: full
        refs: [ev6, ev8, ev14, ev16]
        summary: "Loader CVE history (config-injection RCE, 59 picklescan CVEs), scanning that marks-but-doesn't-block and does not analyse repo Python (Load/Mine, October 2026), and gameable trending/download signals that enabled 2026 typosquats with hundreds of thousands of downloads."

