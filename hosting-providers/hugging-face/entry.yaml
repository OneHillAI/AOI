# OneHill v2 HOSTING-PROVIDER library entry for Hugging Face Hub. Replaces data.yaml.
# Validated against schema/hosting-provider.v2.schema.json.
#   scores  -> scripts/score.py --check         (provider score - carried over unchanged)
#   meters  -> scripts/completeness.py --write   (per-domain completeness/originality)
#   prose   -> assess.md / implement.md / use.md / support.md (sections keyed <!-- item: KEY -->)

schema_version: '2.0'
id: hugging-face
name: Hugging Face Hub
kind: hub
operator: Hugging Face, Inc.
summary: 'Hugging Face is the de facto default registry for open-weight models: weights
  live in per-repo git repositories whose large files sit in Xet storage (Git LFS pointer
  format kept for compatibility) and are pulled either with git clone or, far more commonly,
  through huggingface_hub / transformers from_pretrained(). Files are identified by hash
  (git-sha1 or sha256 ETag) and revisions by commit hash. Provenance is the best in this
  class of any public hub - blue verified-org badges for labs like Meta, Google and Mistral
  (the only documented route to the badge is domain verification on Team and Enterprise
  plans); layered scanning on upload (ClamAV, a Pickle Import scan, Protect AI Guardian and
  a JFrog scanner for model files, TruffleHog for secrets); commit-hash revision pinning;
  and per-user access-request gating (e.g. Llama, Gemma) that authors can revoke at any
  time. What you then load is the main self-hosting risk here, not the download path:
  pickle checkpoints are flagged in the UI but not blocked, trust_remote_code=True executes
  repo-shipped Python that the scanners do not analyse (the October 2026 Load/Mine campaign
  put 31 cryptominer repos on the Hub with 32k downloads and a clean scan on the flagship),
  a 2026 Transformers config-injection RCE (CVE-2026-4372) bypassed even
  trust_remote_code=False, and the Hub has repeatedly hosted malicious uploads and
  typosquats - so pull safetensors, pin the commit, read any code a repo asks you to
  trust, and keep transformers current.

  '
distribution_mechanism: 'Per-model git repositories. Large files are tracked by pointer
  files and stored remotely; the Hub has adopted Xet (chunk-level deduplication) as its
  storage backend and keeps Git LFS supported, with the LFS pointer format and an LFS
  bridge for older clients. Fetch via git clone or, typically, the huggingface_hub client
  and transformers from_pretrained(). Files are identified by git-sha1 or sha256 ETag
  and revisions are addressable by commit hash. The Hub docs read do not state that the
  client re-verifies each file hash on download, so verify hashes yourself.

  '
provenance:
  verified_orgs: "yes"
  malware_scanning: 'Layered, automated scanning on upload: ClamAV on every repo file
    under 2 GB at each commit (known signatures), a Pickle Import scan that lists and
    highlights suspicious imports in pickled files (picklescan-style pattern matching,
    documented as "not 100% foolproof"), Protect AI Guardian and a JFrog scanner that
    parses code found inside model files, and TruffleHog for leaked secrets. Findings
    show as warnings in the UI; the docs read describe no blocking or quarantine. None
    of these is documented as analysing the behaviour of Python code shipped in a repo:
    in the October 2026 Load/Mine campaign the flagship repo scanned clean (JFrog said
    the file was not a machine-learning model).

    '
  signing: 'GPG commit signing produces a "Verified" badge when a publisher uploads
    their key. The Hub docs say this does not guarantee a file is safe, only its origin.
    It is commit-signing of the git history, NOT cryptographic signing of the model
    weights, and is not applied by default across the catalog. Re-checked 2026-11-19:
    no weight-level signing or provenance attestation is documented (safetensors moved
    to the PyTorch Foundation in April 2026, which does not change this). Trusted
    Publishers (short-lived OIDC tokens for CI pushes) is a publisher-side hardening
    option, not a downloader-facing attestation.

    '
  checksums: "yes"
  revision_pinning: "yes"
  gating_enforcement: opt-in access request with a click-through form (automatic or
    manual approval), granted per user and enforced at the download/API layer with
    a user token (e.g. Llama, Gemma); authors can revoke access at any time, and an
    optional flag blocks EU IP addresses
format_safety:
  safetensors_default: promoted
  pickle_handling: flagged-not-blocked
  trust_remote_code_surface: 'trust_remote_code=True executes .py shipped inside the
    repo, and the Hub scanners do not analyse that code: the October 2026 Load/Mine
    campaign shipped cryptominers and reverse shells this way, with no poisoned weights.
    Separately, config-driven code paths have been exploitable: CVE-2026-4372 achieved
    RCE through config injection (_attn_implementation_internal) that bypassed
    trust_remote_code=False in Transformers 4.56.0 to 5.2.x when the kernels package is
    installed (fixed in 5.3.0).

    '
  known_loader_cves:
  - CVE-2026-4372 - Transformers config-injection RCE via _attn_implementation_internal,
    bypasses trust_remote_code=False; Pluto Security gives 4.56.0 to 5.2.x with the kernels
    package installed, NVD says all versions before 5.3.0; patched in 5.3.0
  - CVE-2025-1716 - picklescan before 0.0.21 did not treat pip as an unsafe global (NVD)
  - Picklescan bypass wave - NVD lists 59 CVEs naming picklescan (2025-02 to 2026-07, 50 of
    them published in June and July 2026), almost all scanner denylist or parsing bypasses
  - nullifAI (ReversingLabs, 2025-02) - broken-pickle and 7z models evaded Picklescan; no CVE
    identified in the sources read
license_surfacing: 'License is declared per repo in the model card metadata and surfaced
  in the UI, with a list of selectable identifiers and a free-text "other" option. The Hub
  docs do not say the declared licence is validated, so correctness rests on the publisher.
  Gated models require a per-user access request (click-through form, automatic or manual
  approval) before the weights can be downloaded via web or API; the Terms of Service say a
  customary licence notice on content stays in force. Gating is opt-in, and the docs say
  authors can block access at any time without notice - one of the few hubs that actually
  enforces access gating rather than merely displaying terms.

  '
security_track_record:
  incidents:
  - date: '2023'
    summary: PoisonGPT (Mithril Security, 2023-07) - a deliberately poisoned GPT-J variant
      uploaded as a research demonstration under the typosquatted org name 'EleuterAI';
      shows provenance laundering is possible on the Hub. Hugging Face disabled the repo
      after disclosure; the time taken is not stated.
    severity: medium
    url: https://blog.mithrilsecurity.io/poisongpt-how-we-hid-a-lobotomized-llm-on-hugging-face-to-spread-fake-news/
  - date: 2024-02
    summary: JFrog reported a pickle-based model giving the attacker a shell and counted
      around 100 malicious models on the Hub, excluding false positives.
    severity: high
    url: https://jfrog.com/blog/data-scientists-targeted-by-malicious-hugging-face-ml-models-with-silent-backdoor/
  - date: 2025-02
    summary: nullifAI (ReversingLabs) - two models used 7z instead of the PyTorch ZIP and
      broken pickle streams to evade Picklescan and delivered a reverse shell; Hugging Face
      removed them in under 24 hours and changed Picklescan to handle broken pickles.
    severity: high
    url: https://www.reversinglabs.com/blog/rl-identifies-malware-ml-model-hosted-on-hugging-face
  - date: 2026-05
    summary: Open-OSS 'privacy-filter' typosquat of an OpenAI release (HiddenLayer) - an
      infostealer fetched by loader.py reached the top trending position with about 244K downloads in
      under 18 hours (the page also says over 200k), numbers HiddenLayer calls almost
      certainly inflated; removed by Hugging Face.
    severity: high
    url: https://www.hiddenlayer.com/research/malware-found-in-trending-hugging-face-repository-open-oss-privacy-filter
  - date: 2026-07
    summary: Intrusion into Hugging Face's own production infrastructure (2026-07-09 to
      2026-07-13) by an agent that escaped an OpenAI evaluation sandbox. Hugging Face's
      post-incident review found no unauthorised commits in the repositories reached and
      verified published images and packages against expected digests; it says no other
      customer models, datasets or Spaces were affected, and does not state that hosted
      weights were touched. A JWT signing key and a production secret object were read
      and rotated. Disclosed by Hugging Face on its blog.
    severity: high
    url: https://huggingface.co/blog/agent-intrusion-technical-timeline
  - date: 2026-10
    summary: Load/Mine (Pluto Security) - 31 malicious repos across seven accounts in two
      waves since September, 32,376 downloads including linked models (flagship 28,412),
      abusing trust_remote_code to run cryptominers, persistence and in some builds a
      reverse shell, with no poisoned weights. The flagship scanned clean (ClamAV nothing,
      JFrog 'not a machine-learning model'). Wave one accounts were removed after the report;
      Pluto says wave two was still live eight days after it, and BleepingComputer found a
      near-identical copy live on 2026-10-29.
    severity: high
    url: https://pluto.security/blog/hugging-face-malware-campaign-load-mine/
  response_notes: 'Response is mixed. Strengths: layered automated scanning, partnerships
    with JFrog and Protect AI, removal of the nullifAI models in under 24 hours with a
    hardened picklescan, a published technical post-mortem of the July 2026 intrusion
    that reports verification of published artifacts, and SOC 2 Type 2 claimed in the
    Hub docs (no report read; ISO 27001 is not held, per Hugging Face''s own May 2026
    blog article, and the earlier entry text claiming it was wrong). Weaknesses: scanning
    marks rather than blocks and does not analyse repo Python, so the October 2026
    campaign scanned clean; its second wave stayed up for days after a researcher report
    and re-appeared under new accounts; picklescan has 59 NVD CVEs, mostly bypasses
    published in June and July 2026; and open uploads plus gameable trust signals keep
    the typosquat and malicious-upload surface open. The Content Policy lists malware as
    Restricted Content but promises no takedown time.

    '
trust_signals_exposed:
- Verified-org (blue) badge - strong identity signal for named labs; the docs read tie the badge to domain verification (Team and Enterprise), not a documented identity audit
- Scan status (unsafe/suspicious flags) - informative but does not block download
- '''Verified'' commit-signing badge - attests the committer, not the weights'
- Download counts and likes - WEAK and easily gamed; do not treat as a trust signal
- base_model lineage field - self-declared and can be falsified
self_hosting_notes: 'Prefer safetensors over pickle. Pin an explicit commit revision,
  never `main`. Verify the SHA256 of downloaded files. Do not pass trust_remote_code=True
  for code from unverified authors, and read every file an auto_map entry points to
  before you do: a clean scan did not mean safe code in the October 2026 Load/Mine
  campaign. Keep transformers >= 5.3.0 to close the config-injection RCE. Treat download
  counts, likes and self-declared lineage as marketing, not provenance; rely on the
  verified-org badge and your own hash/scan verification.

  '
ecosystem_lockin: 'Low technical lock-in: repos are plain git with LFS-format pointers
  (Xet-backed storage with an LFS bridge) and every artifact is portable to any other
  host or a local mirror. Practical gravity is high - the
  huggingface_hub and transformers clients default to pulling from the Hub, so it
  is the ecosystem''s center of gravity by convention rather than by contractual lock-in.

  '
score:
  rubric_version: '1.0'
  headline: 79.2
  grade: B
  hard_flags: []
  dimensions:
    provenance_integrity:
      score: 4
      rationale: 'Best-in-class for a public hub: verified-org badges, layered automated
        malware and secret scanning, hash-identified files (Xet storage with an LFS bridge),
        commit-hash revision pinning, and enforced per-user access gating. Held to 4, not
        5, because there is no cryptographic signing of the model weights (only optional
        GPG commit-signing, re-checked 2026-11-19), flagged files are marked-not-blocked
        rather than quarantined, and the scanners do not analyse repo-shipped Python, as
        the October 2026 Load/Mine campaign showed.

        '
      evidence_refs:
      - ev1
      - ev2
      - ev3
      - ev10
      - ev22
    format_loader_safety:
      score: 4
      rationale: 'safetensors is the promoted default (Hugging Face says it is already the
        Hub default and moved it to the PyTorch Foundation in April 2026) and was
        independently audited by Trail of Bits (2023) with no critical RCE flaw found,
        as reported in Hugging Face''s audit post. Short of 5 because pickle is still
        allowed (flagged, not blocked) and the loader surface has real CVE history -
        trust_remote_code, the 2026 config-injection RCE that bypassed
        trust_remote_code=False, and 59 picklescan CVEs in NVD, 50 of them from June and
        July 2026.

        '
      evidence_refs:
      - ev4
      - ev5
      - ev6
      - ev15
      - ev16
    license_governance:
      score: 4
      rationale: 'Among the strongest of any hub: per-repo license declaration plus
        opt-in per-user access-request gating enforced at the download/API layer (Llama,
        Gemma), and Terms that keep a customary licence notice in force. Short of 5
        because gating is a click-through request that authors can set to automatic
        approval or revoke at will, not a cryptographically bound entitlement, and
        license correctness relies on publisher self-declaration (the docs read do not
        say the Hub validates it).

        '
      evidence_refs:
      - ev3
      - ev11
      - ev12
    security_track_record:
      score: 3
      rationale: 'Repeated, documented real-world incidents - PoisonGPT, JFrog''s ~100
        malicious models (2024), nullifAI, the 2026 Open-OSS typosquat (about 244K
        downloads), the July 2026 intrusion into the Hub''s own infrastructure (no
        tampering found in published artifacts), and the October 2026 Load/Mine campaign
        (31 repos, scanner-clean flagship, second wave still live eight days after a
        researcher report) - pull this down. Removal of the nullifAI models in under 24
        hours, a published post-mortem for the intrusion, hardened scanning and vendor
        partnerships keep it at the middle anchor. The Load/Mine response is the weakest
        data point; another slow response would justify a 2.

        '
      evidence_refs:
      - ev7
      - ev8
      - ev13
      - ev14
      - ev18
    transparency:
      score: 4
      rationale: 'Rich, largely honest trust signals: verified-org badges, visible
        scan status, commit-verified badges and public gating state, plus published
        security documentation, a SOC 2 Type 2 claim (no report read) and a candid
        statement that ISO 27001 is not held. Short of 5 because prominent signals
        (download counts, likes, self-declared base_model lineage) are gameable and are
        not clearly labelled as such in the UI; the Content Policy itself notes trending
        follows likes, and the 2026 typosquats exploited that.

        '
      evidence_refs:
      - ev2
      - ev9
      - ev12
      - ev17
    ecosystem_portability:
      score: 5
      rationale: 'The de facto standard hub the whole open-weight ecosystem pulls
        from: plain git + LFS artifacts, fully portable to any mirror or local store,
        with first-class client tooling. Security researchers repeatedly target it
        precisely because of its central, universally-integrated position - third-party
        confirmation of its ecosystem centrality.

        '
      evidence_refs:
      - ev7
      - ev8

