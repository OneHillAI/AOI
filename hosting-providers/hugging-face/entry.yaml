# OneHill v2 HOSTING-PROVIDER library entry for Hugging Face Hub. Replaces data.yaml.
# Validated against schema/hosting-provider.v2.schema.json.
#   scores  -> scripts/score.py --check         (provider score - carried over unchanged)
#   meters  -> scripts/completeness.py --write   (per-domain completeness/originality)
#   prose   -> assess.md / implement.md / use.md / support.md (sections keyed <!-- item: KEY -->)

schema_version: '2.0'
id: hugging-face
name: Hugging Face Hub
kind: hub
operator: Hugging Face, Inc.
summary: 'Hugging Face is the de facto default registry for open-weight models: weights
  live in per-repo git repositories backed by git-LFS and are pulled either with git
  clone or, far more commonly, through huggingface_hub / transformers from_pretrained().
  Storage is content-addressed and the client verifies file hashes, so integrity on
  download is strong. Provenance is the best in this class of any public hub - blue
  verified-org badges for labs like Meta, Google and Mistral; layered malware/secret
  scanning (Picklescan, ProtectAI ModelScan/Guardian, ClamAV, TruffleHog and a JFrog
  proprietary scanner); SHA/etag checksums; commit-hash revision pinning; and enforced
  click-through license gating (e.g. Llama, Gemma). What you then load is the main
  self-hosting risk here, not the download path: pickle checkpoints are flagged "unsafe"
  in the UI but not blocked, trust_remote_code=True executes repo-shipped Python,
  a 2026 Transformers config-injection RCE bypassed even trust_remote_code=False,
  and the hub has repeatedly hosted malicious uploads and typosquats - so pull safetensors,
  pin the commit, verify the hash, and keep transformers current.

  '
distribution_mechanism: 'Per-model git repositories backed by git-LFS. Fetch via git
  clone or, typically, the huggingface_hub client and transformers from_pretrained().
  Content-addressed storage; the client verifies file hashes on download. Revisions
  are addressable by commit hash.

  '
provenance:
  verified_orgs: "yes"
  malware_scanning: 'Layered, automated scanning on upload: Picklescan and ProtectAI
    ModelScan/Guardian for malicious pickles, ClamAV for general malware, TruffleHog
    for leaked secrets, and a JFrog proprietary scanner that parses embedded code.
    Findings mark files "unsafe" or "suspicious" in the UI but do NOT block or delete
    them - the scan warns, it does not quarantine.

    '
  signing: 'GPG commit signing produces a "Verified" badge when a publisher uploads
    their key. This is commit-signing of the git history, NOT full cryptographic signing
    of the model weights themselves, and is not applied by default across the catalog.

    '
  checksums: "yes"
  revision_pinning: "yes"
  gating_enforcement: click-through license acceptance + optional access request,
    enforced per-user at the download/API layer (e.g. Llama, Gemma)
format_safety:
  safetensors_default: promoted
  pickle_handling: flagged-not-blocked
  trust_remote_code_surface: 'trust_remote_code=True executes .py shipped inside the
    repo. Separately, config-driven code paths have been exploitable: CVE-2026-4372
    achieved RCE through config injection (_attn_implementation_internal) that bypassed
    trust_remote_code=False in Transformers < 5.3.0.

    '
  known_loader_cves:
  - CVE-2026-4372 - Transformers < 5.3.0 config-injection RCE via _attn_implementation_internal,
    bypasses trust_remote_code=False; patched in 5.3.0
  - CVE-2025-1716 - picklescan broken-pickle bypass (nullifAI technique)
  - Sonatype 2025 - four additional picklescan bypass vulnerabilities
license_surfacing: 'License is declared per repo and surfaced in the model card and
  UI. Gated models enforce a click-through acceptance of the license (and optionally
  a per-user access request) before the weights can be downloaded via web or API -
  one of the few hubs that actually enforces EULA gating rather than merely displaying
  terms.

  '
security_track_record:
  incidents:
  - date: '2023'
    summary: PoisonGPT - a poisoned model surfaced via a typosquatted 'EleuterAI'
      organization, demonstrating provenance laundering on the hub.
    severity: high
    url: https://thehackernews.com/2025/02/malicious-ml-models-found-on-hugging-face.html
  - date: 2024-2025
    summary: JFrog reported ~100+ malicious models carrying silent backdoors uploaded
      to the hub.
    severity: high
    url: https://huggingface.co/blog/jfrog
  - date: 2025-02
    summary: nullifAI (ReversingLabs) - malicious models used 7z compression to evade
      Picklescan and delivered a reverse shell; led to CVE-2025-1716 and a hardened
      picklescan.
    severity: high
    url: https://thehackernews.com/2025/02/malicious-ml-models-found-on-hugging-face.html
  - date: 2026-05
    summary: Open-OSS 'privacy-filter' typosquat (HiddenLayer) - infostealer hidden
      in loader.py reached top-trending with 200k+ downloads.
    severity: high
    url: https://www.hiddenlayer.com/research/malware-found-in-trending-hugging-face-repository-open-oss-privacy-filter
  - date: 2025-2026
    summary: Fake OpenAI repository delivering an infostealer accumulated ~244k downloads
      before removal.
    severity: high
    url: https://www.hiddenlayer.com/research/malware-found-in-trending-hugging-face-repository-open-oss-privacy-filter
  response_notes: 'Response is comparatively strong: automated layered scanning, formal
    partnerships with JFrog and ProtectAI, malicious-repo removals typically within
    ~24h, and a hardened picklescan after nullifAI. Hugging Face itself holds SOC
    2 and ISO 27001. The weakness is structural - scanning marks rather than blocks,
    and open uploads plus gameable trust signals keep the typosquat/malicious-upload
    surface open.

    '
trust_signals_exposed:
- Verified-org (blue) badge - strong identity signal for named labs
- Scan status (unsafe/suspicious flags) - informative but does not block download
- '''Verified'' commit-signing badge - attests the committer, not the weights'
- Download counts and likes - WEAK and easily gamed; do not treat as a trust signal
- base_model lineage field - self-declared and can be falsified
self_hosting_notes: 'Prefer safetensors over pickle. Pin an explicit commit revision,
  never `main`. Verify the SHA256 of downloaded files. Do not pass trust_remote_code=True
  for code from unverified authors. Keep transformers >= 5.3.0 to close the config-injection
  RCE. Treat download counts, likes and self-declared lineage as marketing, not provenance;
  rely on the verified-org badge and your own hash/scan verification.

  '
ecosystem_lockin: 'Low technical lock-in: repos are plain git + LFS and every artifact
  is portable to any other host or a local mirror. Practical gravity is high - the
  huggingface_hub and transformers clients default to pulling from the Hub, so it
  is the ecosystem''s center of gravity by convention rather than by contractual lock-in.

  '
score:
  rubric_version: '1.0'
  headline: 79.2
  grade: B
  hard_flags: []
  dimensions:
    provenance_integrity:
      score: 4
      rationale: 'Best-in-class for a public hub: verified-org badges, layered automated
        malware and secret scanning, content-addressed checksums, commit-hash revision
        pinning, and enforced license gating. Held to 4, not 5, because there is no
        default cryptographic signing of the model weights (only optional GPG commit-signing)
        and pickle files are marked-not-blocked rather than quarantined.

        '
      evidence_refs:
      - ev1
      - ev2
      - ev3
    format_loader_safety:
      score: 4
      rationale: 'safetensors is the promoted default and was independently audited
        by Trail of Bits (2023) with no critical RCE flaw found. Short of 5 because
        pickle is still allowed (flagged, not blocked) and the loader surface has
        real CVE history - trust_remote_code plus the 2026 config-injection RCE that
        bypassed trust_remote_code=False.

        '
      evidence_refs:
      - ev4
      - ev5
      - ev6
    license_governance:
      score: 4
      rationale: 'Among the strongest of any hub: per-repo license declaration plus
        actually-enforced click-through gating and optional access requests at the
        download/API layer (Llama, Gemma). Short of 5 because enforcement is per-user
        click-through rather than a cryptographically bound entitlement, and license
        correctness relies on publisher self-declaration.

        '
      evidence_refs:
      - ev3
    security_track_record:
      score: 3
      rationale: 'Repeated, documented real-world incidents - PoisonGPT, nullifAI,
        JFrog''s ~100+ backdoored models, and 2026 typosquats with hundreds of thousands
        of downloads - pull this down, but fast (~24h) removals, hardened scanning
        and vendor partnerships keep it at the middle anchor rather than lower.

        '
      evidence_refs:
      - ev1
      - ev7
      - ev8
    transparency:
      score: 4
      rationale: 'Rich, largely honest trust signals: verified-org badges, visible
        scan status, commit-verified badges and public gating state, plus published
        security documentation and SOC 2 / ISO 27001. Short of 5 because prominent
        signals (download counts, likes, self-declared base_model lineage) are gameable
        and are not clearly labelled as such in the UI.

        '
      evidence_refs:
      - ev2
      - ev9
    ecosystem_portability:
      score: 5
      rationale: 'The de facto standard hub the whole open-weight ecosystem pulls
        from: plain git + LFS artifacts, fully portable to any mirror or local store,
        with first-class client tooling. Security researchers repeatedly target it
        precisely because of its central, universally-integrated position - third-party
        confirmation of its ecosystem centrality.

        '
      evidence_refs:
      - ev7
      - ev8

