# OneHill v2 HOSTING-PROVIDER library entry for Ollama. Replaces data.yaml.
# Validated against schema/hosting-provider.v2.schema.json.
#   scores  -> scripts/score.py --check         (provider score - carried over unchanged)
#   meters  -> scripts/completeness.py --write   (per-domain completeness/originality)
#   prose   -> assess.md / implement.md / use.md / support.md (sections keyed <!-- item: KEY -->)

schema_version: '2.0'
id: ollama
name: Ollama
kind: local_runner
operator: Ollama
summary: "Ollama is a local model runner (MIT-licensed software, ollama/ollama) with a content-addressable, OCI-like registry at ollama.com and a separate paid cloud offering. `ollama pull` fetches a manifest and SHA256-addressed blobs (a Modelfile-style recipe of weights, chat template, parameters and licence text), and `ollama run` serves it locally. Since v0.40.0 (2026-09-25) the registry can serve a manifest list with a llama.cpp GGUF build and an MLX safetensors-derived per-tensor build, and the client picks one by runner preference (MLX first on Apple Silicon). Models tagged `:cloud` are not pulled. They run on Ollama's servers under the Terms and Privacy Policy, which promise no training and transient processing of prompts. The docs and pricing page say zero retention, which is stronger than the binding Privacy Policy wording. The strengths are convenience, a data-only artifact format (GGUF and safetensors cannot execute code on load the way pickle can) and a library that ships each model's licence text. The weaknesses are provenance and the tool's own security record. There is no verified-publisher identity, no documented scanning and no signing (PR #11573 is open), and SHA256 addressing gives integrity but not authenticity. Ollama's own GGUF loader had a critical heap-memory-disclosure CVE (CVE-2026-7482, fixed in 0.17.1), alongside pull-path SSRF and Windows updater CVEs, several reported by researchers who say the vendor did not respond. CVE-2026-5760 is an SGLang flaw and does not concern Ollama. Users must bring their own provenance discipline: prefer the official library or known publishers, keep Ollama current and do not expose the API port."
distribution_mechanism: 'Content-addressable, OCI-like registry (manifests + SHA256-addressed
  blobs). `ollama pull` resolves a manifest and downloads the blobs into a local cache; `ollama run` serves it.
  Since v0.40.0 a name can resolve to a manifest list (media type application/vnd.ollama.manifest.list.v2+json)
  with a llama.cpp/GGUF child and an MLX/safetensors child (one tensor layer per safetensors tensor). The client prefers MLX then llama.cpp then ggml on Apple Silicon, and llama.cpp then ggml then MLX elsewhere. A client
  that does not request the list gets the llama.cpp GGUF manifest. Custom models via Modelfile + `ollama create`;
  any user can push to ollama.com under a username. Models tagged `:cloud` run on Ollama''s servers and are
  not downloaded.

  '
provenance:
  verified_orgs: 'no'
  malware_scanning: 'None documented. No GGUF-level malware scanning of registry content
    is confirmed; this is recorded as not documented, not proven-absent.

    '
  signing: "None shipped. The registry manifests carry no signature field, and no v0.30 to v0.40.16 release note mentions signing. OpenSSF-style model signing is proposed in GitHub PR #11573 (open, last updated 2026-09-08, child PR #11526 open since 2025-07). The Ollama public key (ed25519) identifies a local install to ollama.com for push and cloud sign-in; it is not a publisher identity or model signature."
  checksums: 'yes'
  revision_pinning: unknown
  gating_enforcement: none (CLI flow) - no click-through licence gating, including for the Llama community licences
format_safety:
  safetensors_default: promoted
  pickle_handling: n/a - the registry carries GGUF and safetensors-derived tensor layers, not pickle
  trust_remote_code_surface: 'GGUF and safetensors are data-only, so there is no pickle-style code execution
    on load. Neither is risk-free. A malicious GGUF Jinja2 chat template can cause server-side template
    injection or inference-time backdoors in runners that render the embedded template (v0.40.7 adds
    `template_source` to `ollama show` so you can see where the template comes from). Ollama''s own GGUF
    loader and quantiser had a critical out-of-bounds read, CVE-2026-7482 (heap memory disclosure through
    /api/create then /api/push, fixed in 0.17.1), and CERT/CC reports a similar CVE-2026-5757 for which Ollama
    gave no status. CVE-2026-5760 is an SGLang chat-template RCE; it does not concern Ollama or llama-cpp-python.
    Since v0.40.0 the pull path also handles per-tensor layers (MLX builds), which is the path named in the
    SSRF CVE-2026-85180.

    '
  known_loader_cves:
  - 'CVE-2026-7482 - GGUF loader and quantiser heap out-of-bounds read, Ollama before 0.17.1, CVSS 9.1 (NVD)'
  - 'CVE-2026-5757 - quantisation engine heap read via crafted GGUF (CERT/CC VU#518910); no vendor status or fixed version stated'
  - 'CVE-2026-85180 - SSRF through tensor-layer blob redirects on pull, 0.30.0 to 0.33.2; current code validates redirect targets'
  - 'CVE-2026-5530 - SSRF in the model pull API, up to 0.18.1 (NVD)'
  - 'CVE-2026-42248 and CVE-2026-42249 - Windows updater without signature verification and with path traversal, 0.12.10 to 0.17.5 tested; current code verifies the installer signature'
license_surfacing: 'The Ollama software is MIT-licensed. Each library model ships its licence text as a
  registry layer, viewable with `ollama show --license` (Apache-2.0 for qwen3.8, gemma4 and gpt-oss; the Llama
  3.3 and Llama 4 community licence texts for those models). Enforcement is minimal: there is no click-through,
  access request or acceptance check in `ollama pull` or `ollama run`, and the Ollama Terms say nothing about
  model licences or user-uploaded models. Licence acceptance is on the operator''s honour.

  '
security_track_record:
  incidents:
  - date: '2026-05-04'
    summary: 'CVE-2026-7482 "Bleeding Llama": heap out-of-bounds read in Ollama''s GGUF loader and quantiser.
      An attacker who can reach the unauthenticated /api/create and /api/push endpoints can leak process
      memory (environment variables, API keys, system prompts, other users'' conversations) inside a model
      artifact. Fixed in 0.17.1 per NVD; the 0.17.1 release notes do not mention a security fix and no
      GitHub security advisory was published.'
    severity: critical
    url: https://nvd.nist.gov/vuln/detail/CVE-2026-7482
  - date: '2026-04-22'
    summary: 'CERT/CC VU#518910 (CVE-2026-5757): similar GGUF quantisation heap read; CERT/CC could not reach the
      vendor and no patch existed at publication. Ollama has published no status for it.'
    severity: high
    url: https://kb.cert.org/vuls/id/518910
  - date: '2026-04-29'
    summary: 'CVE-2026-42248 and CVE-2026-42249 (CERT Polska): Ollama for Windows applied update executables with no
      signature check and wrote update files from header-derived paths; maintainers did not respond to the
      reporter. Current main verifies the installer signature (commit of 2026-05-11).'
    severity: high
    url: https://cert.pl/en/posts/2026/04/CVE-2026-42248/
  - date: '2026-09-03'
    summary: 'CVE-2026-85180: SSRF through tensor-layer blob redirects on pull in 0.30.0 to 0.33.2 (reported 2026-06-03,
      issue #17041 still open). Current code validates redirect targets against a public-IP allowlist; no
      advisory or release note says so.'
    severity: high
    url: https://www.vulncheck.com/advisories/ollama-0.30.0-through-0.33.2-ssrf-via-cross-host-tensor-blob-redirect
  response_notes: 'No malicious-model-in-registry incident specific to ollama.com was found, but that reflects
    weak provenance tooling (no verified identity, scanning or signing) as much as a clean registry. The tool
    itself has a 2026 record of serious memory-disclosure, SSRF and updater flaws. Fixes appear in the code but
    release notes do not flag them as security fixes, no GitHub security advisories are published, and
    four of the CVE records say the vendor did not respond to the reporter. SECURITY.md asks for reports through
    GitHub advisories; there is no security page (ollama.com/security returns 404), bug bounty, SOC 2 or
    ISO 27001 report.

    '
trust_signals_exposed:
- Registry namespace - weak; any user can push under a username, and a namespace is not an identity badge
- Official Ollama library curation - weak; curation is not per-publisher identity verification or scanning
- Licence text layer - informational; shown by `ollama show --license`, not enforced
self_hosting_notes: 'Run a current Ollama (the 0.40.x line; 0.17.1 is the floor for the GGUF loader
  CVE) and keep the API on 127.0.0.1: /api/create and /api/push have no authentication and OLLAMA_HOST=0.0.0.0
  exposed the loader CVE to the internet. Inspect the chat template (`ollama show`, and `template_source` since
  0.40.7) before serving untrusted models. Prefer the official library or known publishers; cross-check pulled
  GGUFs against the publisher''s Hugging Face SHA256 (integrity, not authenticity). After upgrading to 0.40 or
  later, models pulled earlier are upgraded in the background and the old copies kept as backups until you
  remove them; downgrading below 0.40 means re-pulling. Set OLLAMA_NO_CLOUD=1 or `disable_ollama_cloud` to
  stop any use of `:cloud` models and cloud web search.

  '
ecosystem_lockin: 'Moderate to low format lock-in. GGUF is portable (llama.cpp, LM Studio) and MLX builds are
  safetensors-derived, but the Modelfile recipe, the manifest-list and per-tensor layout and the local registry
  layout are Ollama-specific. The cloud offering (`:cloud` models, per-token billing, retirement of old cloud
  models on a published schedule) adds a hosted dependency that does not exist for local use. The software is
  MIT-licensed and the local runner has no usage limit.

  '
score:
  rubric_version: '1.0'
  headline: 48.4
  grade: D
  hard_flags: []
  dimensions:
    provenance_integrity:
      score: 2
      rationale: "No verified-publisher identity, no documented malware scanning and no shipped signing (PR #11573 is open). The only integrity guarantee is SHA256 content-addressing, which proves the blob is intact but not who authored it (integrity, not authenticity). Any user can push to the registry. That is below the score-3 anchor, which requires verified orgs plus scanning on top of checksums."
      evidence_refs:
      - ev1
      - ev2
      - ev10
      - ev16
    format_loader_safety:
      score: 3
      rationale: "GGUF and the safetensors-derived MLX layers are data-only, an advantage over pickle. Ollama's own GGUF loader is exposed, though. CVE-2026-7482 is a critical (CVSS 9.1) out-of-bounds read in the GGUF loader and quantiser, fixed only in 0.17.1. CVE-2026-5757 is similar and has no vendor status, and the pull path gained per-tensor layers (SSRF CVE-2026-85180). CVE-2026-5760 is an SGLang flaw and does not concern Ollama. The chat-template injection surface remains. That matches the score-3 anchor (data-only formats promoted, loader risks documented), not 4."
      evidence_refs:
      - ev3
      - ev4
      - ev5
      - ev10
      - ev12
      - ev13
      - ev17
    license_governance:
      score: 2
      rationale: "Licence text is surfaced (`ollama show --license`, a licence layer in every library model, including Apache-2.0 and Llama community licences), but there is no gating, no click-through acceptance and no access-request enforcement, and the Terms are silent on model licences. Acceptance is entirely on the operator."
      evidence_refs:
      - ev1
      - ev6
      - ev7
      - ev10
    security_track_record:
      score: 2
      rationale: "No malicious-model incident on ollama.com is known, but weak provenance tooling means that is partly an absence of detection. The tool's own 2026 record is serious: a critical GGUF loader memory-disclosure CVE, an unresolved similar CVE, SSRF on the pull path and two Windows updater CVEs. Disclosure handling is poor: four CVE records say the vendor did not respond, fixes are not flagged in release notes, no GitHub security advisory is published and there is no security page. Fixes do appear in current code, which keeps the score at 2, not 1."
      evidence_refs:
      - ev1
      - ev4
      - ev12
      - ev13
      - ev14
      - ev15
      - ev16
      - ev18
    transparency:
      score: 2
      rationale: "The only trust signals exposed to a puller are the registry namespace, official-library curation and the licence text layer. None is a verified-publisher identity or a published scan result, and there is no trust centre, security page, DPA or certification."
      evidence_refs:
      - ev1
      - ev10
      - ev18
    ecosystem_portability:
      score: 4
      rationale: "The ecosystem is very large and growing (about 187.6K GitHub stars, frequent releases, many integrations), the software is MIT-licensed and the GGUF and safetensors-derived artifacts are portable. The score is short of 5 because the Modelfile recipe, manifest-list layout and local registry layout are Ollama-specific, not an open cross-tool standard, and the cloud offering adds a hosted dependency."
      evidence_refs:
      - ev1
      - ev6
      - ev10

