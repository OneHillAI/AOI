        refs: [ev1, ev2, ev10, ev18]
        summary: "The only signals a puller sees are the registry namespace, official-library curation and the licence text layer - none is a verified-publisher identity or a published scan result - and there is no security page, trust centre, DPA or certification."
  implement:
    completeness: 50.0
    originality: 0.0
    items:
      - key: obtain-weights
        title: "Obtaining weights (ollama pull / Modelfile)"
        doc_type: howto
        source_type: aggregated
        coverage: full
        refs: [ev1, ev10]
        summary: "`ollama pull` fetches a manifest and SHA256-addressed blobs into a local cache. Since v0.40.0 the manifest can be a list with llama.cpp GGUF and MLX safetensors children, chosen by runner preference. Custom models are built with a Modelfile and `ollama create`. `:cloud` tags are not downloaded."
      - key: verify-integrity
        title: "Verifying integrity (SHA256 addressing)"
        doc_type: howto
        source_type: aggregated
        coverage: partial
        refs: [ev1, ev2, ev10]
        summary: "Blobs are SHA256 content-addressed, so a pull is integrity-checked (the blob is intact), but there is no scanning or signing - cross-check the checksum against a canonical source (for example the publisher's Hugging Face repo) since addressing proves integrity, not authenticity."
      - key: pin-revision
        title: "Pinning a revision"
        doc_type: howto
        source_type: gap
        gap_reason: "Blobs and manifests are SHA256-addressed, but no documentation describes pinning by digest or tag reproducibility (revision_pinning stays unknown). Tags are mutable: the library qwen3.8:latest manifest differs by client Accept header and by runner."
      - key: run-serve
        title: "Running / serving locally"
        doc_type: howto
        source_type: aggregated
        coverage: full
        refs: [ev1, ev9]
        summary: "`ollama run` serves a pulled model locally over the CLI and API (127.0.0.1 by default); inspect the chat template before serving untrusted models; setting OLLAMA_NO_CLOUD=1 or `disable_ollama_cloud` keeps everything local."
      - key: resource-needs
        title: "Resource requirements"
        doc_type: reference
        source_type: gap
        gap_reason: "Disk and VRAM requirements depend on the specific build and quantisation pulled (for example qwen3.8 latest is 18 GB), and no general rule is documented."
  use:
    completeness: 90.0
    originality: 0.0
    items:
      - key: catalog-scope
        title: "Catalog scope & publishers"
        doc_type: reference
        source_type: aggregated
        coverage: full
        refs: [ev1, ev2, ev9, ev10]
        summary: "A curated official library, user-pushed community models by namespace, and cloud-enabled `:cloud` models (about two dozen priced per token, with a published retirement list); there is no per-publisher identity verification."
      - key: formats-supported
        title: "Formats supported"
        doc_type: reference
        source_type: aggregated
        coverage: full
        refs: [ev3, ev1, ev10]
        summary: "GGUF blobs (llama.cpp runner) and, since v0.40.0, safetensors-derived per-tensor layers (MLX runner, default on Apple Silicon), packaged with Modelfile-style recipes; GGUF is consumable by other runners such as llama.cpp and LM Studio."
      - key: integration
        title: "Downstream integration"
        doc_type: reference
        source_type: aggregated
        coverage: partial
        refs: [ev1, ev11]
        summary: "Local CLI and API, OpenAI-compatible and Anthropic-compatible endpoints, `ollama launch` for coding tools, Modelfile recipes and an Ollama-specific registry layout; portable at the GGUF layer but the recipe format and registry layout are Ollama-specific."
  support:
    completeness: 71.4
    originality: 0.0
    items:
      - key: security-disclosure
        title: "Reporting malicious models & vulnerabilities"
        doc_type: reference
        source_type: aggregated
        coverage: partial
        refs: [ev16, ev18]
        summary: "SECURITY.md asks for reports through GitHub security advisories; no security page, bug bounty or malicious-model reporting route is published (ollama.com/security returns 404), and several CVE reporters say the vendor did not respond."
      - key: release-versioning
        title: "Tooling versioning & changelog"
        doc_type: release_notes
        source_type: aggregated
        coverage: full
        refs: [ev11]
        summary: "GitHub releases with short feature lists: v0.40.16 stable on 2026-11-09 and v0.40.17-rc1 on 2026-11-10, one to four releases a week; release notes do not carry a security section and have not flagged the 2026 security fixes."
      - key: channels
        title: "Community & support channels"
        doc_type: reference
        source_type: aggregated
        coverage: partial
        refs: [ev11]
        summary: "GitHub issues, Discord, X, a support link and support@ollama.com for accounts; a large community, but no published support commitment outside the Team and Enterprise tiers."
      - key: known-issues
        title: "Known issues & caveats"
        doc_type: troubleshooting
        source_type: aggregated
        coverage: full
        refs: [ev2, ev4, ev10, ev12]
        summary: "Provenance is the weak spot (no verified identity, scanning or signing), the unauthenticated API must not be exposed, chat templates can carry injection payloads, and upgrading to 0.40 migrates stored models in the background while downgrading below 0.40 means re-pulling."

