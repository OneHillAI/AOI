        refs: [ev1]
        summary: "`ollama pull` resolves a Modelfile recipe (base weights + chat template + parameters + optional system prompt) and downloads the SHA256-addressed GGUF blob into a local cache; custom models are built with a Modelfile and `ollama create`."
