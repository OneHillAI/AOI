changelog:
- date: '2026-07-25'
  change: Initial entry.
- date: '2026-07-25'
  change: Migrated to v2 four-domain library format (added documentation block; score
    carried over unchanged).
- date: '2026-09-21'
  change: 'Freshness re-verification. New in-window finding: CVE-2026-85180 (published 2026-09-03) - a tensor-blob-redirect SSRF, where an attacker-controlled registry can return a manifest whose blob request redirects to a private address including a cloud metadata endpoint; a separate code path from the earlier-patched non-tensor downloader. Offsetting positive, NOT yet shipped: GitHub PR #11573 implements OpenSSF Model Signing (ed25519 signatures, `ollama sign`/`ollama verify`, automatic verification during pull/push) - merge status/date unconfirmed, treated as proposed/in-progress. Ollama distributes GGUF, not pickle, so the pickle hard-flag does not apply on format grounds. No score change: the fresh SSRF advisory offsets the still-unmerged signing PR; revisit for a possible upgrade only once signed-pull verification lands in a stable release.'
- date: '2026-11-19'
  change: 'Freshness re-verification against primary sources (first time any primary document is stored for this entry: docs/primary-sources/ollama/). Read the MIT LICENSE, Terms (Aug 2026), Privacy Policy (Mar 2026), cloud docs and pricing, registry manifests, release notes, SECURITY.md and NVD and CERT/CC records. Changed: (1) format_loader_safety 4 to 3 - Ollama''s own GGUF loader had CVE-2026-7482 (critical, fixed 0.17.1) and CERT/CC lists CVE-2026-5757; the entry said Ollama avoided loader CVEs. (2) Corrected a misattribution: CVE-2026-5760 is an SGLang chat-template RCE, not a llama-cpp-python bug, so the "Ollama avoided CVE-2026-5760" claim is removed. (3) security_track_record 3 to 2 - four CVE records say the vendor did not respond, fixes are not flagged in release notes, no GitHub advisories, no security page. (4) Registry is no longer GGUF-only: v0.40.0 (2026-09-25) added manifest lists with MLX/safetensors children, default on Apple Silicon; old clients get the llama.cpp GGUF manifest; v0.40.2 migrates stored models. (5) Cloud: `:cloud` models run on Ollama servers; Privacy Policy says transient processing, no storage beyond the request and no training, while docs and pricing say zero retention (stronger than the binding text); no DPA or certification published. Unchanged: licence MIT, no gating, model signing PR #11573 still open (last updated 2026-09-08), provenance 2, license_governance 2, transparency 2, portability 4. New in this pass: gap items security-disclosure, release-versioning and channels now documented. Unresolved: whether CVE-2026-5757 is the same flaw as CVE-2026-7482 or fixed, which release first shipped the Windows updater signature check, and the exact failure of v0.30.10 on newer models (no official statement found; the registry behaviour that would explain it is recorded). Headline and grade recomputed by score.py (55.2 C to 48.4 D).'
