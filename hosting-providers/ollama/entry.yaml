# OneHill v2 HOSTING-PROVIDER library entry for Ollama. Replaces data.yaml.
# Validated against schema/hosting-provider.v2.schema.json.
#   scores  -> scripts/score.py --check         (provider score - carried over unchanged)
#   meters  -> scripts/completeness.py --write   (per-domain completeness/originality)
#   prose   -> assess.md / implement.md / use.md / support.md (sections keyed <!-- item: KEY -->)

schema_version: '2.0'
id: ollama
name: Ollama
kind: local_runner
operator: Ollama
summary: 'Ollama is a local model runner with a content-addressable, OCI-like registry:
  `ollama pull` resolves a Modelfile (a recipe of base weights + chat template + parameters
  + an optional system prompt), downloads the GGUF blob addressed by SHA256, caches
  it, and `ollama run` serves it locally; custom models are built with a Modelfile
  and `ollama create`. Its great strength is convenience and a genuinely safer artifact
  format - GGUF is data-only and cannot execute code on load the way pickle can, and
  Ollama is NOT exposed to the llama-cpp-python GGUF RCE (CVE-2026-5760) because
  it does not use that Python binding. Its weakness is provenance: there is no verified-publisher
  identity comparable to a Hugging Face blue badge, no documented GGUF-level malware
  scanning, and no documented cryptographic signing. SHA256 addressing gives you integrity
  (the blob you got is the blob that was published) but NOT authenticity (no proof
  of who published it). The residual risk is a malicious GGUF chat template (Jinja2
  server-side template injection / inference-time backdoors) or a malformed header
  hitting a loader memory bug, so you must bring your own provenance discipline: prefer
  the official library or known publishers and cross-check checksums against a canonical
  source.

  '
distribution_mechanism: 'Content-addressable, OCI-like registry (manifests + SHA256-addressed
  blobs). `ollama pull` resolves a Modelfile recipe and downloads the GGUF blob into
  a local cache; `ollama run` serves it. Custom models via Modelfile + `ollama create`.

  '
provenance:
  verified_orgs: 'no'
  malware_scanning: 'None documented. No GGUF-level malware scanning of registry content
    is confirmed; this is recorded as not documented, not proven-absent.

    '
  signing: 'None documented. No cryptographic signing or publisher-identity verification
    is confirmed; treat as NOT DOCUMENTED rather than proven-absent.

    '
  checksums: 'yes'
  revision_pinning: unknown
  gating_enforcement: none (CLI flow) - no click-through license gating
format_safety:
  safetensors_default: n/a
  pickle_handling: n/a
  trust_remote_code_surface: 'GGUF is data-only, so there is no pickle-style code-execution
    on load (safer than pickle by design). It is not risk-free: a malicious GGUF Jinja2
    chat template can cause server-side template injection / inference-time backdoors,
    and malformed GGUF headers can trigger loader memory bugs. IMPORTANT: Ollama is
    NOT vulnerable to the llama-cpp-python GGUF RCE (CVE-2026-5760) because it does
    not use that Python binding.

    '
  known_loader_cves: []
license_surfacing: 'License text ships inside the model and is viewable with `ollama
  show --license`. Enforcement is minimal - there is no click-through gating or access-request
  flow, so license acceptance is on the operator''s honour, not enforced by the tool.

  '
security_track_record:
  incidents: []
  response_notes: 'Fewer documented malicious-upload incidents than the large public
    hubs, but that reflects weaker provenance tooling overall rather than a stronger
    security posture: with no verified-org identity, no documented scanning and no
    signing, malicious content would be harder to detect and attribute in the first
    place.

    '
trust_signals_exposed:
- Registry namespace - weak; namespace ownership is not an identity badge
- Official Ollama library curation - weak; curation is not per-publisher identity
  verification or scanning
self_hosting_notes: 'GGUF is safer than pickle, but inspect the chat template before
  serving untrusted GGUFs (template injection runs at inference time). Prefer the
  official Ollama library or known publishers. Where possible, verify a pulled model
  against the canonical source (e.g. the publisher''s Hugging Face repo) SHA256 -
  remember SHA256 addressing gives integrity, not authenticity.

  '
ecosystem_lockin: 'Low format lock-in - GGUF is portable and usable by other runners
  (llama.cpp, LM Studio) - but the Modelfile recipe format and the local registry
  layout are Ollama-specific conveniences. Large, fast-growing local ecosystem.

  '
score:
  rubric_version: '1.0'
  headline: 55.2
  grade: C
  hard_flags: []
  dimensions:
    provenance_integrity:
      score: 2
      rationale: 'No verified-publisher identity, no documented malware scanning and
        no documented signing; the only integrity guarantee is SHA256 content-addressing,
        which proves the blob is intact but not who authored it (integrity, not authenticity).
        That is below the score-3 anchor, which requires verified orgs plus scanning
        on top of checksums.

        '
      evidence_refs:
      - ev1
      - ev2
    format_loader_safety:
      score: 4
      rationale: 'GGUF is data-only and cannot execute code on load - a real safety
        advantage over pickle - and Ollama specifically avoided the main llama-cpp-python
        GGUF RCE (CVE-2026-5760) by not using that binding. Held to 4, not 5, because
        the chat-template SSTI / inference-time-backdoor surface exists and is not
        automatically inspected or blocked for pulled models.

        '
      evidence_refs:
      - ev3
      - ev4
      - ev5
    license_governance:
      score: 2
      rationale: 'License text is surfaced (`ollama show --license`) but there is
        no gating, no click-through acceptance and no access-request enforcement -
        acceptance is entirely on the operator. That is minimal governance, below
        the anchor for enforced gating.

        '
      evidence_refs:
      - ev1
    security_track_record:
      score: 3
      rationale: 'Few documented malicious-upload incidents, but weak provenance tooling
        means the absence of reports is partly an absence of detection rather than
        evidence of a clean surface - placing it at the middle anchor rather than
        higher.

        '
      evidence_refs:
      - ev1
      - ev4
    transparency:
      score: 2
      rationale: 'The only trust signals exposed to a puller are the registry namespace
        and official-library curation, neither of which is a verified-publisher identity
        or a published scan result; there is little for a downloader to independently
        assess.

        '
      evidence_refs:
      - ev1
    ecosystem_portability:
      score: 4
      rationale: 'Very large and growing local ecosystem built on the portable GGUF
        format, which other runners can consume. Short of 5 because the Modelfile
        recipe and local registry layout are Ollama-specific conveniences rather than
        an open cross-tool standard.

        '
      evidence_refs:
      - ev1

